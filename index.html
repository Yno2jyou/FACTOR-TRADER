ndent\">「そして死んで百年も経てば、誰も僕たちのことなんて覚えていない」</p>\n    <p>改めてそう思うとひどく悲しかった。どのように生きたところで、いつかは忘れ去られる。</p>\n    <p class=\"no-indent\">「時々思うんだ。たった百年の間に死にゆく僕の人生は一体何なんだろう。死んで百年の間に消える僕という存在は一体何なんだろうって」</p>\n    <p>トヲルはその言葉に静かに頷いた。僕はポケットに手を突っ込んだまま、天を仰いだ。</p>\n    <p class=\"no-indent\">「たとえ働いて平穏な生活を送っても、犯罪を犯して牢獄に収容されても、死んで百年も経てばそれらは全て忘れ去られる。世界的な大発明や、世界的な大犯罪を犯さない限り百年後に名を残すことはできない。君に、そんな知恵と勇気はある？」</p>\n    <p class=\"no-indent\">「ないな」</p>\n    <p class=\"no-indent\">「僕もだ」</p>\n    <p>そこで僕は苦笑した。世界的な大発明も、世界的な大犯罪も僕たちにはできない。</p>\n    <p class=\"no-indent\">「どう足掻いたところでこのままの人生では僕たちは百年後、人々の記憶から跡形もなく消え去る」</p>\n    <p>百年の間に死ぬ命と、死んで百年の間に消える記憶。そこに一体何の意味があり、何の価値があるのか。そしてこの世界で息をする自分は一体何者で、この世界で何を為し、何を残すのか。</p>\n    <p class=\"no-indent\">「僕たちはきっと、宇宙から見ればごくごく小さな存在に過ぎない」</p>\n    <p>宇宙の広さに比べたら、僕たちはあまりにも無意味で、無価値だ。</p>\n    <p class=\"no-indent\">「そして宇宙からしてみれば、僕たちの人生は流星のように短く、儚い」</p>\n    <p class=\"no-indent\">「……ああ」</p>\n    <p>この地球では今もたくさんの生命が生まれては、そのいのちを燃やし、尽き果ててゆく。それはまるで流星群のように、とめどなく。</p>\n    <p class=\"no-indent\">「俺たちは、何の為に生きるんだろう」</p>\n    <p>それはきっと百年という月日があっても答えを導き出すことはできないのだろう。星ほどの長い年月があったとしても、その答えに辿り着くことはできないのだろう。僕は小さく息をつき、夜空を見上げた。頭上には天の川が静かに横たわっている。夜空を裂くように広がった天の川には無数の星が散らばっている。それはまるで時空の裂け目に向かって、光のかけらが吸い込まれているようだった。僕たちはただ、目の前に広がる世界の神秘に立ち尽くした。その光景は息を呑むほど美しく、理論や定義といったものを簡単にねじ伏せてしまうような力強さがあった。人間がやってきたことなど、この星々の輝きには到底及ばないのだと強く感じた。それだけ頭上に広がった世界は美しく、広大だった。</p>\n    <p class=\"no-indent\">「なんかさ、こうやって宇宙の広さを感じていると心が安らぐよ」</p>\n    <p class=\"no-indent\">「安らぐ？」</p>\n    <p>僕はその問いに頷いて、改めて夜空を仰いだ。幾千もの星が、叫ぶように輝いている。</p>\n    <p class=\"no-indent\">「宇宙の大きさに比べたら、自分の抱える悩みは取るに足らないものだって思えるからさ」</p>\n    <p class=\"no-indent\">「わからなくもないけど、虚しくならないか？」</p>\n    <p>僕はそれについて考えた。宇宙を見上げたときの、何かとても大きなものに包まれているような感覚を表したかった。</p>\n    <p class=\"no-indent\">「確かに宇宙の広さに圧倒されて虚しくなることはあるよ。僕たちの想像を絶するくらい宇宙は広いからね。そう言った意味での無力さはある。だけど、それがときとして励みになるんだよ」</p>\n    <p class=\"no-indent\">「励みに？」</p>\n    <p>僕はその問いに頷いて、夜空をじっと見つめた。夜空にまたがる天の川は世界の神秘を解き放つように、果てしなく広がっている。</p>\n    <p class=\"no-indent\">「毎日必死に働いて、でもふと顔を上げればこんなにも美しい世界が広がっている。僕たちは本当はものすごく小さな生き物で、僕たちだけの力でこの美しい世界が変わることは決してない。そういった意味で僕たちは無力だよ。だけどこの宇宙は僕たちがどんな絶望や悲しみに打ちひしがれていようとも、変わらず美しく在り続ける。それはある意味で、励みにもなる気がするんだ」</p>\n    <p class=\"no-indent\">「……励みに」</p>\n    <p>トヲルはそれについて、真剣に考えているようだった。僕は小さく息をつき、夜空の遠く彼方を見つめた。</p>\n    <p class=\"no-indent\">「いつも星を見上げると思うんだ。星の数だけ希望は残っている、って」</p>\n    <p class=\"no-indent\">「……希望」</p>\n    <p>僕はその言葉に頷き、ゆっくりと道を歩いた。夜道は夏とは思えないほど冷たく、まるで巨大な死体でも横たわっているみたいだった。</p>\n    <p class=\"no-indent\">「もちろん星を見上げたからって、人生が劇的に変わることはない。でも、どんなときだって希望は残っている。そう宇宙が教えてくれているような気がするんだよ」</p>\n    <p class=\"no-indent\">「……そうか」</p>\n    <p>そこで僕たちは黙った。夜空には光の大河が流れている。星たちが呼吸をするように瞬いている。</p>\n    <p class=\"no-indent\">「『どんな時だって希望は残っている』キズキにもそう言ってあげればよかったのかな」</p>\n    <p>何となしに僕が呟くと、トヲルは夜空を見上げたまま、ああとだけ言った。それから僕たちはただひたすら夜空を眺めた。穏やかな夜だった。まるで星が落ちてきそうな夜だった。</p>\n    <p class=\"no-indent\">「あのさ……」</p>\n    <p class=\"no-indent\">「ん？」</p>\n    <p class=\"no-indent\">「お前に、ずっと言ってなかったことがあるんだ」</p>\n    <p class=\"no-indent\">「ずっと言ってなかったこと？」</p>\n    <p>その言葉にビクッと体が反応した。トヲルはポケットに手を突っ込んだまま、フーッと息を吐いた。</p>\n    <p class=\"no-indent\">「死ぬ少し前に、アイツ言ったんだよ。『俺は死なないぜ』って」</p>\n    <p class=\"no-indent\">「えっ……？」</p>\n    <p>暗い夜道にひんやりとした風が吹き抜けた。まるで死の淵からやってきたような風だった。</p>\n    <p class=\"no-indent\">「『生きとし生けるものは、本当の意味では死なない。死んで生命が失われても、その生命を構成していたものは別の何かへと形を変えて永久にあり続ける。俺が死んでも、俺を構成していたものは地球を漂い、宇宙を彷徨い続ける。そしてまたお前たちと、宿命的にめぐり逢う』って……。あれはきっと、自死の予告だったんだ」</p>\n    <p>トヲルの声が、言葉が、ひどく震えていた。僕はその言葉に息を呑んだ。</p>\n    <p class=\"no-indent\">「その時はただロマンチックだと思ってたよ。だけど、アイツは本当にそう思っていたんだ。自分が死んで骨と灰だけになっても、必ず俺たちとまためぐり逢えるって」</p>\n    <p class=\"no-indent\">「本当に、そう言ってたの？」</p>\n    <p class=\"no-indent\">「ああ、言ってたよ」</p>\n    <p>初めて聞いたことだった。キズキはトヲルと最期に会ったときに、もう死ぬことを決めていたのだ。</p>\n    <p class=\"no-indent\">「どうして今までそのことを言ってくれなかったの？」</p>\n    <p>問いただすような言い方になってしまった。トヲルは俯いたまま、唇を震わせて声を出した。</p>\n    <p class=\"no-indent\">「あの時自殺を止められたのは俺だけだったんだ。なのに俺は自殺を止められなかった。これは全部、俺の責任なんだ」</p>\n    <p class=\"no-indent\">「そんなわけないだろ」</p>\n    <p class=\"no-indent\">「そんなわけあるんだよ！」</p>\n    <p>そう言ってトヲルは肩を震わせた。僕はただ、トヲルの姿を見つめることしかできなかった。</p>\n    <p class=\"no-indent\">「アイツはたくさんのヒントを残していたんだ。でも俺は、それに気づくことすらできなかった」</p>\n    <p class=\"no-indent\">「ヒントって……」</p>\n    <p class=\"no-indent\">「自分が憎いんだ。何もできなかった、いや何もしなかった自分が堪らなく憎いんだよ」</p>\n    <p>トヲルはそう言うと、頭を抱えてうずくまってしまった。ひどく惨めな姿だった。これ以上、自分を傷つけるトヲルの姿を見たくなかった。</p>\n    <p class=\"no-indent\">「もうこの話はやめよう。これ以上こんな君の姿は見たくない」</p>\n    <p>そう言って僕は夜道を歩いた。まるで光の届かない海底を歩いているようだった。孤独で、息が苦しい夜だった。</p>\n</div>\n\n  <div class=\"section\" id=\"ch14\">\n    <h2 class=\"section-title\">第十四話：犬吠埼</h2>\n    <p>路肩に止めておいた車に戻った僕たちは、九十九里浜を後にした。九十九里浜を後にしてからは休むことなく車を走らせ、最終的には犬吠埼と呼ばれる太平洋に突出した岬までたどり着いた。犬吠埼にたどり着いた頃には、ちょうど黎明の薄い光が世界を覆っているところだった。</p>\n    <p class=\"no-indent\">「すごい、夜明けだ」</p>\n    <p class=\"no-indent\">「ああ、ほんとだ」</p>\n    <p>太陽がすぐそばまで迫ってきているのが目に見えた。今にも水平線の彼方から光が溢れてきそうだった。</p>\n    <p class=\"no-indent\">「そろそろ来るな」</p>\n    <p>キズキがそう言った瞬間、潮がさっと引き、静寂が訪れた。まるでこの瞬間だけ世界から音が抜き取られてしまったみたいだった。</p>\n    <p>その瞬間、光が世界を満たした。</p>\n    <p>ほんの刹那の静寂のあと、再び波音が聞こえた頃には朝日が昇っていた。朝日が昇ると天空を覆っていた藍色は急速にその色を失い、砂浜は一瞬にして美しい黄金色に染まった。まるで世界が生まれ変わったかのようだった。</p>\n    <p class=\"no-indent\">「すごい眺めだね」</p>\n    <p class=\"no-indent\">「ああ、そうだな」</p>\n    <p>世界が古い姿を捨て、新しい姿を手にいれる、まさにその瞬間だった。僕たちはその光景をただ息を呑んで眺めていた。世界は光で満ちてゆき、輝きで溢れかえっていた。あまりにも美しい光景だったので、僕たちはそれから三十分くらいは、ただそうやって朝日を眺めていた。ハッと我に返ってキズキを見ると、そこには微笑みを口許に湛えた彼の姿があった。しかし、その微笑みはやがて夕暮れの残光のように、ゆっくりと奥の方に消えてしまった。そしてあとに残ったのは、荒涼とした大地を見つめるような物悲しい眼差しだけだった。そこには朝日の眩い光も一切受けつけないような、深い、深い闇があった。僕はただその瞳を眺め、そこに潜む底のない闇をじっと見つめた。</p>\n    <p>レンタカー店に車を返し、寮に戻ったのは十時だった。僕たちは寮に戻るなり、外泊届けを出さなかったことで寮長にこっぴどく叱られた。説教は一時間近く続き、危うく講義に遅刻するところだった。それでもなんとか講義には間に合い、出席をすることができた。講義が終わると僕たちは寮に戻り、自室で眠りについた。二人とも昨夜は一睡もしていなかったから、ベッドに入るなりすぐに眠ることができた。眠りにつく前、僕はもう一度頭の中で、あの愉快な一夜について思いを巡らせた。本当に、長い夜だった。</p>\n    <p>しかし、その次の日、キズキは死んだ。正確にはキズキが死んだと分かったのは、あの夜から五日が経った頃のことだった。</p>\n    <p>講義に出て、寮に戻り、眠りについた後、目覚めるとキズキの姿が消えていた。そのときはどこかに外出でもしたのかと思っていたが、その日の夜になってもキズキは寮へと帰ってこなかった。外泊でもしているのかと寮長に尋ねてみると、キズキは外泊届を出していないと言われた。寮長もキズキが外出をしてからは行方を知らないようだった。僕はトヲルと話し合ってから、とりあえず一晩様子を見ることにした。というのも、キズキは時々外泊届を出さずに、ふらっと外へ出かけることがあったからだった。ところが次の日になっても、キズキは寮に戻ってこなかった。寮長も流石に不審に思ったらしく、キズキの携帯に電話をかけた。しかしキズキは電話にも出なかった。キズキは外出をしたきり、帰ってこなかった。</p>\n    <p>キズキの死を知ったのは、その三日後だった。詳しい話は僕やトヲルにもよくわからなかったが、どうやら警察から寮に電話があったらしく、そこでキズキが自殺したことが告げられたようだった。寮長はキズキの死を知ると、真っ先にその事実を、僕とトヲルに告げた。そして次の日には寮に電話をした警察に呼ばれて事情聴取を受けた。僕たちがキズキの死の詳細を知ったのも、ちょうどこの事情聴取を受けたときだった。</p>\n    <p>警察の話によればキズキの遺体は、長野にある廃業したホテルの浴槽で見つかったそうだった。</p>\n    <p>そのホテルは半年前に、経営者の一人が観光業振興のための県の補助金を不正受給していたことが発覚したことで、地域からの信頼を失い、廃業した施設だった。そのニュースは地方紙で大々的に取り上げられて大きな話題になり、全国放送のニュース番組でも二度ピックアップされた。キズキがこのホテルを見つけたのも、恐らくその地方紙やニュースを何らかの形で入手、または閲覧・視聴したからなのではないかと推測された。</p>\n    <p>ホテルは廃業後、誰にも管理されることなく放置されていた。そのため窓ガラスはひび割れ、壁紙は湿気で剥がれ落ち、夜風が吹き込むたびに空室の扉が軋むような、忘れ去られた建物となっていた。キズキの遺体が見つかったのは、そのホテルのツインルームの浴槽だった。第一発見者は肝試しにやって来た地元の高校生たちで、キズキは浴槽の中で、手首から大量の血を流している状態で見つかった。しかし驚くべきことは、キズキの見つかった部屋だけ、荒れ果てていたツインベッドや浴室、洗面所が綺麗に整えられていたことだった。警察は抑揚を欠いた声で、あまりの整然さにため息が出たと呟き、現場の写真を見せてくれた。そこにはキズキが綺麗に整えたとされるツインベッドがあり、浴室があり、洗面所があった。警察の話によれば、ツインベッドのシーツは真っ白な新品のものに取り替えられ、歯ブラシやタオルなどのアメニティも、可能な限りすべて綺麗に揃えられていたという。僕とトヲルそのあまりにも整然とした部屋の写真を一つひとつ手に取り、キズキが残そうとした何かに思いを馳せた。</p>\n    <p>丁寧に整えられたツインベッドや、浴室、洗面所とは引き換えに、遺体が発見された浴槽は殺伐とし、ひどく凄惨な状態だったという。当初はそのあまりの悲惨さから他殺も疑われたが、遺体が横たわる浴槽の上に、煙草の吸い殻が溜まった灰皿が置かれていたこと、そして遺体の手元にキズキの指紋がついた剃刀が落ちていたことなどを総合的に判断した結果、自殺という結論が出た。つまり、キズキは補助金の不正受給をして廃業となったホテルを何らかの手段で見つけ、旅を終えた翌日にひとり寮を抜け出し、廃墟と化した長野のホテルまで赴き、そこで部屋を整理してから、煙草を燻らせたまま、ゆっくりとこの世を去ったのだ。死因は静脈を切ったことによる失血死で、死亡推定時刻は夜中の十一時だった。</p>\n    <p>警察はキズキの死の詳細を語り終えると、まず高校時代からの友人だったトヲルから普段の様子を聞き、その次に僕にいくつか質問をした。キズキに自死の兆候はあったのか。僕は見ていた限りではないと答えた。すると警察は、死の直前にキズキと一緒に旅をしていた目的は何だったのかと尋ねた。恐らく寮長から旅の話を聞いたのだろう。僕は誘われたからですと正直に答えた。すると警察は一度こちらをじっと見てから、その旅の道中でキズキは何か意味深な発言をしていなかったかと尋ねた。しかし僕はそれ以上、警察の質問に答えることができなかった。頭が鈍く痛み、ひどい吐気がした。僕が答えに窮すると、警察は五秒待ってから、その質問を飛ばした。どうやらそれが警察の気遣いのようだった。しかし、今の僕にはそんな些細な気遣いも大して役には立たなかった。結局、僕たちはその後、刑事の質問に対して三回頷き、二回首を振ってから警察署を後にした。僕もトヲルもひどく憔悴していた。しかしその頃には、それまで実体がなかったキズキの死が、はっきりと実感できるようになっていた。</p>\n</div>\n\n  <div class=\"section\" id=\"ch15\">\n    <h2 class=\"section-title\">第十五話：見届けるよ。そこで。</h2>\n    <p>トヲルの家と思しき建物にたどり着いたのは、バーを出てから三十分が経った頃のことだった。庭付きの二階建ての家で、家屋の横には大きなガレージが備えられている。トヲルがガレージの扉に鍵を差し込んだのを見て、僕は思わず足を止めた。</p>\n    <p class=\"no-indent\">「実家だよ。父親は俺が二十八のときに癌で死んで、母親は施設に入ってる。だから今は一人で住んでるんだ」</p>\n    <p>そう言いながらトヲルはガレージを開け、中へ入るよう手で示した。僕は頷いて、ひんやりとした空気の中に足を踏み入れた。</p>\n    <p class=\"no-indent\">「一人で寂しくない？」</p>\n    <p class=\"no-indent\">「実家だからな。特に寂しくはないよ」</p>\n    <p>トヲルはそう言いながら、ガレージに停めてあった車のボディに手を滑らせた。それはキズキが憧れていた、日産のプリンス・グロリアだった。</p>\n    <p class=\"no-indent\">「これって……」</p>\n    <p class=\"no-indent\">「覚えてるか？　キズキが好きだったやつだよ。中古で、ちょっと奮発して買ったんだ」</p>\n    <p class=\"no-indent\">「いや、覚えてるけど……どうして、これを？」</p>\n    <p>僕が尋ねると、トヲルは何も答えず、ポケットから煙草を取り出して火をつけた。煙が一筋、ガレージの暗がりに昇っていく。</p>\n    <p class=\"no-indent\">「俺さ、アイツのことがずっと好きだったんだよ」</p>\n    <p class=\"no-indent\">「それは自分もだけど──」</p>\n    <p class=\"no-indent\">「そうじゃなくてさ」</p>\n    <p>短くそう言って、トヲルは黙り込んだ。何か聞き返そうとしたが、言葉が出てこなかった。</p>\n    <p class=\"no-indent\">「俺さ、どうしてもアイツのことが忘れられないんだよ」</p>\n    <p>トヲルはそれだけ言うと、グロリアの排気パイプにゴムホースを繋ぎ始めた。車内に置かれていたガムテープを取り、グロリアの窓を一枚、また一枚と目張りしていった。</p>\n    <p class=\"no-indent\">「おい、何してるんだよ」</p>\n    <p>声をかけても、トヲルの手は止まらなかった。迷いのない、淀みない手つきだった。</p>\n    <p class=\"no-indent\">「知ってるか？　昔の車にはガスを浄化する装置がついていないんだ。だから、このホースで車内に排気ガスを送り込めば──死ねるんだよ」</p>\n    <p>トヲルは車内にホースを通し、最後の窓に目張りを終えた。その手の動きで、トヲルが何をしようとしているのか、僕は否応なく理解した。</p>\n    <p class=\"no-indent\">「やめろよ。そんなことして、キズキが喜ぶと思ってるのかよ！」</p>\n    <p class=\"no-indent\">「キズキは喜ばないだろうな。だけど、もういいんだよ」</p>\n    <p>そう言ってトヲルはワイパーに一枚の紙を差し込んだ。それはキズキの遺書だった。</p>\n    <p class=\"no-indent\">「アイツが死んでから十年、俺はただがむしゃらに生きてきた。アイツのことを思って眠れない夜もあったし、忘れようと必死になった時期もあった。それでも前だけを向いて生きてきた──はずだった」</p>\n    <p>煙草を吸い、長く煙を吐く。白い煙が、魂のように揺らめいてガレージの天井へ消えていく。</p>\n    <p class=\"no-indent\">「だけど、やっぱり辛いんだ。アイツのいない朝が、アイツのいない夜が、俺にはもう耐えられない。一日生きるたびに、アイツが自分にとってどれだけ大切な存在だったか、ひしひしと思い知らされる。それが毎日、十年だよ。耐えられるわけがないだろ。俺にはもう無理だ」</p>\n    <p>大きく息をつくトヲルを見て、胸がひくりと痛んだ。この十年の重さを思うと、何も言えなかった。</p>\n    <p class=\"no-indent\">「そんなとき、キズキの姉さんから遺書を見せてもらったんだ。震えたあの字を見て、ハッとした。アイツの苦しみが、そこから伝わってきたから。それで思ったんだ。アイツの『息をするのも、しないのも辛い』っていう感覚を、自分でも味わってみようって。そうやって調べて、準備して、今夜決行すると決めた。だけど、どうしても最期にお前に会いたかったんだよ。キズキの話をしたかった。遺書も見せたかったしな。だけどお前と話してるうちに思ったんだ。お前に、俺とキズキの最期を見届けてほしいって」</p>\n    <p class=\"no-indent\">「馬鹿なこと言うなよ」</p>\n    <p>必死で止めようとしたが、トヲルの耳には届いていなかった。トヲルは煙草を指に挟んだまま、こちらを見て、不器用に笑った。</p>\n    <p class=\"no-indent\">「お前と話すのは楽しかったよ。寮を抜け出して花火をして、麻雀に明け暮れたあの日々を思い出した。短い人生だったけど、俺は幸せだった。キズキを失ったことはものすごく辛かったけど──もうすぐ会える。だから、見届けてほしいんだ。俺とキズキの最期を。なあ、頼む」</p>\n    <p>手を合わせるトヲルを前に、僕は車内に通されたホースに視線を落とした。</p>\n    <p class=\"no-indent\">「これで、本当に死ねるの？」</p>\n    <p class=\"no-indent\">「どうだろうな。だけど、死ぬのには時間がかかるよ」</p>\n    <p>僕は目張りされた窓をじっと見つめた。ガムテープの貼り方ひとつにまで、トヲルの性格が滲んでいた。</p>\n    <p class=\"no-indent\">「苦しみながら死ぬわけ？」</p>\n    <p class=\"no-indent\">「キズキの抱えた苦しみを、知りたいんだよ」</p>\n    <p class=\"no-indent\">「だからって……」</p>\n    <p>言葉を継げなかった。トヲルの瞳が「止めないでくれ」と、はっきり訴えていた。</p>\n    <p class=\"no-indent\">「キズキのことが、好きだったのか？」</p>\n    <p>その問いに、トヲルは遠いどこかを見るような目で、助手席のシートに視線を落とした。</p>\n    <p class=\"no-indent\">「ああ……もう、ずっと」</p>\n    <p>その一言には、十年という時間が積み上げた執着と、それが報われなかった虚無とが、静かに溶け合っていた。</p>\n    <p class=\"no-indent\">「どうして言ってくれなかったんだ。言ってくれたら、一緒に考えることだってできたのに」</p>\n    <p class=\"no-indent\">「そんなこと、できるわけないだろ。絶対に──」</p>\n    <p class=\"no-indent\">「どうして？」</p>\n    <p>そこでトヲルは皮肉めいた笑みを浮かべ、ゆっくりと首を横に振った。</p>\n    <p class=\"no-indent\">「だってアイツが好きだったのは、お前だったから……」</p>\n    <p class=\"no-indent\">「え？」</p>\n    <p>喉から絞り出した声は、ひどく掠れていた。その言葉に理解が追いつかず、ガレージの輪郭がぐらりと歪んだ気がした。</p>\n    <p class=\"no-indent\">「どういう、こと」</p>\n    <p>トヲルはグロリアの助手席の扉を開け、中から一冊の文庫本を取り出した。</p>\n    <p class=\"no-indent\">「この小説、知ってるだろ」</p>\n    <p>差し出されたそれは、キズキがあの日、居酒屋で見せてくれた川端康成の『掌の小説』だった。受け取った本はずっしりと重く、ページの角は丸みを帯び、紙の繊維がわずかに毛羽立っている。開くと、古紙のかすかな甘い香りとインクの匂いが立ち、文字の詰まったページが指の熱を吸い込むように波打っていた。十年前、死の間際にキズキが見せてくれたあの一冊に、間違いなかった。しかしページを捲っていると、隙間から一枚の紙が滑り落ちた。手に取ると、それは青い花を押し花にした一枚の栞だった。</p>\n    <p class=\"no-indent\">「勿忘草、だよ」</p>\n    <p class=\"no-indent\">「わすれなぐさ？」</p>\n    <p class=\"no-indent\">「ああ。花言葉は『わたしを忘れないで』だ」</p>\n    <p class=\"no-indent\">「わたしを忘れないで……」</p>\n    <p>トヲルは苦笑いを浮かべた。</p>\n    <p class=\"no-indent\">「この間、キズキの実家に線香をあげに行ったとき、遺品を見せてもらったんだ。そうしたら、この小説が出てきた」</p>\n    <p>その声はどこか遠くから響いてくるようだった。僕は手の中の文庫本を、ただ凝視するしかできなかった。</p>\n    <p class=\"no-indent\">「最初はキズキの好きだった小説の一冊かと思って気にも留めなかった。だけど、妙なところにこの栞が挟まっていたんだ」</p>\n    <p class=\"no-indent\">「妙なところ？」</p>\n    <p>栞の挟まれていたページを見ると、『化粧の天使たち』の一節があった。『別れる男に、花の名を一つは教えておきなさい。花は毎年必ず咲きます』。キズキが下線を引き、幽遠な文章だと思わないかと言ったあの一節だった。</p>\n    <p class=\"no-indent\">「『別れる男に、花の名前を一つは教えておきなさい』と書かれたページに、勿忘草の栞が挟まっている。妙だと思わないか」</p>\n    <p>否定できなかった。文学を愛したキズキなら、十分にあり得ることだった。</p>\n    <p class=\"no-indent\">「だからって、どうしてそれが僕を好きな理由になるんだ」</p>\n    <p>問い詰めると、トヲルは一歩、二歩と歩み寄り、栞を取り上げてその裏側を僕に見せつけた。</p>\n    <p class=\"no-indent\">「裏に、イニシャルが書かれているんだよ」</p>\n    <p>目を凝らすと、達筆な字で「Ｈ・Ｍ」と書かれていた。</p>\n    <p class=\"no-indent\">「Ｈ・Ｍ。俺はこのイニシャルを持つやつを一人しか知らない。もう、わかるだろ。ミツル──」</p>\n    <p>その名が叫ばれた瞬間、『掌の小説』を見せてくれたときのキズキの言葉が、脳裏に鮮明に浮かんだ。</p>\n    <p class=\"no-indent\">──なんか素敵じゃないか。好きな人に毎年思い出してもらうために、花の名前を教えるなんてさ。</p>\n    <p>まさか、と思った。だが、トヲルの叫んだ「ミツル」という名は、確かに僕の名前だった。</p>\n    <p class=\"no-indent\">「なあ、ミツル。知ってるか、勿忘草のもうひとつの花言葉──」</p>\n    <p class=\"no-indent\">「えっ……」</p>\n    <p>天使が通り過ぎたみたいに、深い沈黙が僕たちの間に降りた。</p>\n    <p class=\"no-indent\">「『真実の愛』だよ」</p>\n    <p class=\"no-indent\">「……真実の愛」</p>\n    <p>その言葉が耳に届いた瞬間、記憶の波が一斉に押し寄せた。ずっと前から好きな人がいると語ったときの、覚悟を宿した冷たい横顔。絶望的な距離があると語ったときの切実な眼差し。好きな人について尋ねたときに見せた一瞬の驚き。今度、想いを正直に伝えてみようと語った遠い目。『月を喰らうもの』を語るときの異様な饒舌さ。鴨川で「俺がどう見える？」と尋ねたときの、抑えきれない苦悶。そのすべてが走馬灯のように脳裏を駆け抜けた。</p>\n    <p class=\"no-indent\">「好きな人って……」</p>\n    <p>視線を落とすと、些細な言動の数々と、目の前の事実が音を立てて一つに収斂していった。『掌の小説』に挟まれた栞には勿忘草が押し花されている。花言葉は『私を忘れないで』と『真実の愛』。そして『化粧の天使達』、そこでキズキが線を引いていた一節は──。</p>\n    <p class=\"no-indent\">「『別れる男に、花の名を一つは教えておきなさい。花は毎年必ず咲きます』」</p>\n    <p>手が震えていた。震えが止まらなかった。</p>\n    <p class=\"no-indent\">「もう、わかっただろ。これは偶然なんかじゃない。確信犯なんだよ、アイツは」</p>\n    <p>彼の一言一句が、鉛のように胸へと沈んでいった。キズキが抱えていた深い孤独と、誰にも言えなかったひそかな愛。それが十年後の今夜、あまりにも残酷な形で息を吹き返し、トヲルの心を突き動かし、僕の眼前に突きつけられていた。その事実に、僕はただ愕然としていた。</p>\n    <p class=\"no-indent\">「アイツは自分の意思で、この想いを勿忘草に託して、遺書としてお前に残したんだ。俺じゃない、お前に、だ──」</p>\n    <p>あの日、居酒屋で見せたキズキの、寂しげで、しかしどこか晴れやかな微笑みが浮かぶ。僕はその裏に隠された真実を、何も知らずにいた。</p>\n    <p class=\"no-indent\">「だから、俺はここで死ぬ。悔いはない。アイツのところに行くんだよ」</p>\n    <p>トヲルの声には、もう迷いがなかった。</p>\n    <p class=\"no-indent\">「でも、一人で死ぬのはあまりに哀しい。だから、お前に見届けてほしいんだよ。俺たちの最期を」</p>\n    <p>懇願するその手が、震えていた。自分が今、どれほど残酷な決断を迫られているのか、僕はようやく悟った。</p>\n    <p class=\"no-indent\">「……わかったよ」</p>\n    <p class=\"no-indent\">「見届けてくれるのか」</p>\n    <p>一段、明るくなった声。それが余計に悔しく、僕は拳を強く握った。</p>\n    <p class=\"no-indent\">「見届けるよ。そこで」</p>\n    <p>そう言って、僕はプリンス・グロリアの助手席を指差した。指先を目で追ったトヲルは、ひどく驚いた顔でこちらを見た。</p>\n</div>\n\n  <div class=\"section\" id=\"ch16\">\n    <h2 class=\"section-title\">第十六話：旅の終わり、日常の始まり</h2>\n    <p>キズキの死を知らせる電話が鳴ったあの日から、世界は急激に色彩を失った。警察署を出たあと、僕とトヲルはしばらくまともに言葉を交わすことができなかった。駅までの道を並んで歩きながら、ただ互いの足音だけを聞いていた。日常のすべてがひどく色褪せて見えた。コンビニの看板も、信号機の音も、すれ違う人々の笑い声も、月並みな言葉で表せば、遠い世界の出来事のようだった。キズキの葬式もまた驚くほど淡々と進んでいった。線香の匂いと、僧侶の読む経と、親族の啜り泣き。その中で、僕はただ立ち尽くしていた。何か言葉をかけなければと思っても、果たして何を言えばいいのかわからなかった。キズキの母親が棺にしがみついて泣き崩れる姿を、僕は直視することすらできなかった。火葬場の煙突から立ち昇る煙を、丘の上から眺めたあの日。僕が「まるで天国に向かって昇っているみたいだ」と言ったことを、彼は鮮明に覚えていたが、僕自身は長らく忘れていた。だけどそのときの僕には、そんな感傷に浸る余裕すらなかった。ただ目の前で起きていることが現実だとは、どうしても思えなかった。</p>\n    <p>大学に戻ってからの日々は、奇妙な静けさに包まれていた。寮の部屋からキズキの私物が運び出されたあと、隣の部屋はしばらく空室のままだった。寮長も、他の寮生たちも、その部屋の前を通るときだけ、少しだけ声を潜めるようになった。誰もキズキの名前を口にしなかったし、誰も口にしたいとも思っていなかった。それはまるでキズキという存在を悪性のウイルスか何かだと思っているようだった。それが僕にはひどく腹立たしかったし、同時に途方もなく虚しかった。そして僕はその行き場のない思いをかき消すように、大学の講義にひとりで出席し、レポートを書き、サークルの集まりにも頻繁に顔を出すようになった。傍目にはいつも通りの学生生活を送っているように見えただろう。だけど僕の内側では、何かが決定的に壊れてしまっていた。夜、ベッドに横たわると、決まってあの夜のドライブのことを思い出した。代々木パーキングエリアの自販機の温もり。海ほたるから見た東京の夜景。九十九里浜で競走したときの息切れ。犬吠埼で見た夜明け。そして鴨川で見せたあの、悲愁に満ちた表情。どうしてあのとき、もっと深く尋ねなかったのだろう。どうしてあのとき、ハンドルを握ったキズキの手を、もっと強く握り返さなかったのだろう。後悔は際限なく押し寄せ、夜ごと僕を苛んだ。</p>\n    <p>トヲルとはしばらくの間、連絡を取り合うことができなかった。顔を合わせれば、否応なくあの日のことを思い出してしまう。電話のベルが鳴るたびに心臓が竦んだ。お互いがお互いの傷を見るのが怖かったのだと思う。キズキを失った悲しみを分かち合うことすら、当時の僕たちにはできなかった。 大学の卒業式で久しぶりに顔を合わせたとき、トヲルは見違えるほど痩せていた。スーツの袖から覗く手首は、記憶にあるよりもずっと細かった。「元気か」と尋ねると、トヲルは力なく笑って「まあな」とだけ答えた。その目の奥に、深い疲労と、まだ癒えていない傷の色が見えた気がした。</p>\n    <p>社会人になってからの僕たちは、それぞれ別の道を歩んだ。僕は出版社に就職し、文芸編集の部署に配属された。皮肉なことに、毎日のように誰かの「書いた言葉」と向き合う仕事だった。原稿を読みながら、ふとキズキの『月を喰らうもの』のことを思い出すことがあった。精緻な構成と、ひとりの少女の報われない愛を描いたあの物語を語るときだけ、饒舌になるキズキの姿が脳裏から離れなかった。トヲルは大手の機械メーカーに、技術職として入社した。入社三年目で早くも昇進し、実直に仕事をこなしているという話を、共通の知人から時折耳にした。住む場所も離れ、生活のリズムも違う僕たちは、自然と会う機会を失っていった。それでも完全に縁が切れることはなかった。年に一度か二度、どちらからともなく連絡を取り、居酒屋で酒を酌み交わす習慣だけは、不思議と絶えることなく続いていた。最初の数年は、キズキの名前を出すことすら避けていた。居酒屋で乾杯をしても、思い出話に花が咲いても、決まってキズキのことだけは触れずにいた。その名前を口にした瞬間、せっかく保っていた均衡が崩れてしまう。そんな予感が互いの中にあったのだと思う。だから僕たちは、当たり障りのない仕事の話や、最近見た映画の話ばかりをした。</p>\n    <p>転機が訪れたのは、キズキが死んでから五年目の命日だった。その年、トヲルが珍しく自分から連絡をしてきた。「今年は、ちゃんとキズキの話をしよう」と。電話越しのその声は、いつになく真剣だった。僕は少しの躊躇のあと、わかったと答えた。その夜、僕たちは初めて正面からキズキについて語り合った。彼の笑い方、彼の口癖、彼が好きだった本、彼が見せた優しさ。語るほどに止まっていたはずの涙が、不思議と溢れてきた。だけどそれは悲しみだけの涙ではなかった。どこか温かい、救われるような涙でもあった。その夜を境に、命日に合わせてバーで落ち合い、キズキとその記憶について語り合うことが、僕たちの習わしになった。もちろん語ることは、痛みを伴った。あの夜のドライブの記憶を辿るたびに、見落としていたはずの違和感が、後から後から浮かび上がってくる。鴨川での唐突な質問。「またどこかで」という最期の言葉。整然と整えられたホテルの部屋。それらの欠片が、語るたびにぼんやりとした意味を浮かび上がらせては、波紋が広がるように静かに消えていった。だけど僕たちは、その意味を最後まで突き詰めることをしなかった。きっと、それが何を指し示しているのか、心のどこかで気づいていながら、目を逸らし続けていたのだと思う。それでも、語らなければキズキという存在そのものが、この世界から少しずつ損なわれていく気がした。記憶は放っておけば必ず色褪せる。輪郭は曖昧になり、声は遠ざかり、笑顔さえもいつか思い出せなくなってしまう。だから僕たちは毎年その日だけは、互いの言葉と記憶を持ち寄って、キズキという存在を確かめ合った。それが僕たちなりの弔いだったのかもしれない。</p>\n    <p>トヲルは表向きには、順調な人生を送っているように見えた。仕事では着実に評価を重ね、同期の中では一番昇進をしていた。三十を過ぎた頃には、後輩の指導も任されるようになったと聞いた。彼は誰もが認める、優秀な技術者だった。だけど命日の夜だけは別人のような顔を見せた。普段の生真面目さからは想像もつかないほど、酒の量が増えていった。最初はビールを一杯、二杯と空けるだけだったのが、いつしかギムレットを何杯も重ねるようになった。酔いが回るほどに言葉数は減り、視線はどこか遠くを彷徨うようになる。僕はそれに気づいていながら、深く踏み込むことができなかった。トヲルの抱える孤独が、僕の想像をはるかに超えるものだと、無意識のうちに感じていたのかもしれない。父親を癌で亡くしたのは、トヲルが二十八のときだった。その知らせを聞いたとき、僕はすぐに駆けつけようとしたが、トヲルは「気にしなくていい、お前にまで気を遣われたくない」と言って、頑なに僕を遠ざけた。線香さえあげさせなかった。あとになって彼の母親が施設に入ったことも、僕は人づてに知った。トヲルは大切なものを失っても誰かに頼ろうとはしなかった。一人で抱え込み、一人で耐え抜き、そして何事もなかったかのように、僕の前では笑ってみせた。その不器用な優しさは、トヲルらしいといえばその通りだったが、その優しさの裏で、トヲルがどれほどの孤独を一人で抱えていたのか、僕は本当の意味で想像することができていなかった。そして十年目の命日。トヲルは約束の時間から、二時間も遅れてバーにやってきた。「年中激務だよ」「昨日も同僚がひとり過労で倒れた」と、いつものように笑いながら話す彼の姿に、僕は自死の兆候を見抜けなかった。ネクタイを緩め、グラスを傾けるその仕草も、疲れは滲んでいたが、いつもと変わらないように見えた。だけどその日のトヲルをよく観察すると、彼は確かに違っていた。グラスの縁を指でなぞる仕草が、いつもより長く、いつもより慎重だった。視線は時折、店の外の暗闇に向けられ、何かを見定めようとするように細められた。それはまるで、長い旅の終わりを前にした人間が見せる、静かな覚悟のようにも見えた。そして僕はそのとき、キズキのことを、彼のことを、何も知らなかった。キズキの胸の内に、十年間ひた隠しにされ続けてきた想いがあることも、その夜、彼の家のガレージに置かれたプリンス・グロリアが、もうひとつの「さよなら」のために静かに準備されていたことも。ただ、僕の隣に座ったトヲルの横顔が、いつになく遠くを見ているように感じられた。まるで、もうこの世界にはいない誰かを、グラスの向こうに探しているみたいに。</p>\n    <p>グラスの中で、氷が静かに音を立てて沈んでいった。僕はそんなトヲルの姿をじっと見つめながら、何気なく口を開いた。</p>\n    <p class=\"no-indent\">「仕事の方は最近どうなの？」</p>\n    <p>それが十年という歳月を経て、すべてが動き始める夜の、ほんの些細な始まりだった。</p>\n</div>\n\n  <div class=\"section\" id=\"ch17\">\n    <h2 class=\"section-title\">第十七話：君が死んだら、僕も死ぬよ。</h2>\n    <p class=\"no-indent\">「どういうことだよ」</p>\n    <p>トヲルが驚いたように、こちらを見つめた。</p>\n    <p class=\"no-indent\">「言った通りさ。車内で見届けるよ」</p>\n    <p class=\"no-indent\">「それじゃあ、お前……」</p>\n    <p>言葉を切り、トヲルは黙り込んだ。僕は短く息を吐き、ボンネットに手を置いた。</p>\n    <p class=\"no-indent\">「言っただろ。『君が死んだら、僕も死ぬ』って」</p>\n    <p class=\"no-indent\">「本気で言ってるのか」</p>\n    <p class=\"no-indent\">「本気だよ。君が死んだら、僕も死ぬ。仲良く心中さ」</p>\n    <p>苦し紛れに笑ってみせると、トヲルの顔が歪んだ。痛みに耐えるような、醜い表情だった。</p>\n    <p class=\"no-indent\">「君が死んだら、僕はひとりになる。ひとりになるくらいなら、死んだ方がマシだ」</p>\n    <p class=\"no-indent\">「だからって……」</p>\n    <p>言葉を失ったトヲルの背後で、グロリアがガレージの光を黒く跳ね返している。まるで、こちらを死へと招き入れるように。</p>\n    <p class=\"no-indent\">「ほら、死ぬんだろ？　一緒に逝こう」</p>\n    <p>窓ガラスはすべてガムテープで目張りされている。三十分くらいで死ねるだろうか。</p>\n    <p class=\"no-indent\">「そうやってお前は、どこまでも俺の心を傷つけるんだな」</p>\n    <p>その言葉に、足が止まった。ナイフで胸を抉られたような、鈍い痛みが走る。それでも僕は止まらなかった。</p>\n    <p class=\"no-indent\">「ドライブなんて何年ぶりだろう？　キズキとふたりで旅をした以来か。まあ、今回は戻ってこれないけど」</p>\n    <p class=\"no-indent\">「……やめてくれ」</p>\n    <p class=\"no-indent\">「親も選べず理不尽に生まれたんだ。最期くらい、身勝手に死んだって誰も文句は言わないさ」</p>\n    <p class=\"no-indent\">「やめろ！」</p>\n    <p>ガレージの重い空気が、互いの吐く息で白く濁った。トヲルの瞳に、凍りつくような憤怒が宿った。</p>\n    <p class=\"no-indent\">「君がそんな臆病なやつだなんて、知らなかったよ」</p>\n    <p>目張りされたグロリアの窓に手を触れ、僕は静かに言った。</p>\n    <p class=\"no-indent\">「せっかく、一人で逝こうとする卑怯な友人に、心中を持ちかけているというのに」</p>\n    <p>その瞬間、トヲルの目が見開かれた。驚きと怒り、かすかな困惑がそこに入り混じっていた。</p>\n    <p class=\"no-indent\">「卑怯？　臆病？　笑わせるなよ」</p>\n    <p>一歩、二歩と詰め寄り、トヲルが僕の眼前に迫った。</p>\n    <p class=\"no-indent\">「俺がこの十年、どれだけキズキのことを想い続けて、砂を噛むような思いで生きてきたか知ってるのかよ！」</p>\n    <p>トヲルの拳がボンネットを激しく叩く。鈍い金属音がガレージに反響した。</p>\n    <p class=\"no-indent\">「……わからないよ」</p>\n    <p class=\"no-indent\">「わからないなら、偉そうな口叩くなよ。お前のその無自覚な言動が、どれだけ俺たちの孤独を嘲笑っていたか、少しは理解しろよ」</p>\n    <p>その言葉に、僕は唇を引き結び、床に視線を落とした。革靴の先に、小さな油のシミが滲んでいる。</p>\n    <p class=\"no-indent\">「確かに僕は、僕自身の無自覚な言動で、君やキズキを傷つけたのかもしれない。そのせいでキズキが死んだのなら、僕は君に何も言い返せない──」</p>\n    <p class=\"no-indent\">「なら……」</p>\n    <p class=\"no-indent\">「でも、もしそうであるなら、僕は尚更君を見捨てるわけにはいかない。傲慢なのはわかっている。それでも僕は、キズキを殺めてしまった僕だけは、君を見殺しにするわけにはいかない。それは僕自身の個人的な戒めでもあるし、同時にキズキの悲劇を二度と繰り返さないための誓いでもある」</p>\n    <p>ガレージの蛍灯が、ジジ、と小さく音を立てて瞬いた。トヲルは何も言わなかった。ただ、戸惑うようにこちらを見つめていた。</p>\n    <p class=\"no-indent\">「こんなことを言っても、キズキが帰ってこないことはわかっている。それでもこれは僕なりの贖罪なんだ。僕自身の無自覚によって殺めてしまったキズキの命への最大限の贖罪。キズキはもう二度と帰ってこない。なら、僕はキズキの命に免じて、君を救い出さないといけない。僕自身のひどく無自覚な行動によって、僕は君を失意の底から救い出さないといけない。これは僕に課せられた使命なんだ」</p>\n    <p>その言葉に、トヲルの肩からわずかに力が抜けたのがわかった。言葉を失ったトヲルの瞳が、わずかに揺れた。</p>\n    <p class=\"no-indent\">「使命なんてどうでもいいんだよ……俺はただ、お前に見守ってほしいだけなんだ」</p>\n    <p>その声に先ほどまでの怒気はなかった。ただ疲労だけが、言葉の上に静かに覆い被さっていた。</p>\n    <p class=\"no-indent\">「この十年、ずっと堪え続けてきたんだ。だからさ、最期くらいわがままを聞いてくれよ」</p>\n    <p>胸の奥で何かが軋んだ。十年分の痛みを吐き出すような、切実な声だった。それでも僕は目を逸らさなかった。</p>\n    <p class=\"no-indent\">「なら、さっさと死ねよ」</p>\n    <p class=\"no-indent\">「……え？」</p>\n    <p class=\"no-indent\">「自分を犠牲にしてでもキズキを想うなら、僕の命を殺してみろよ。僕の命を踏み台にして、キズキに会いに行けよ」</p>\n    <p>自暴自棄な叫びをかき消す、静かな声で、僕はトヲルの言葉を制した。</p>\n    <p class=\"no-indent\">「もう自分でもわかってるだろ。君は僕の死が怖いんだよ。キズキのいない世界で生きていくこと以上に、僕の死が怖い。違うか？」</p>\n    <p>その瞬間、トヲルの顔から血の気が引いた。怒りに染まっていた瞳が大きく揺れ、胸ぐらを掴まれたまま、何かを言い返そうと唇だけが震えている。</p>\n    <p class=\"no-indent\">「キズキを想ってるなら、僕を殺してみろよ。僕の命を踏み躙ってキズキに会ってみろよ」</p>\n    <p>トヲルは目を見開いたまま固まっていた。怒りに満ちていたはずの眼差しが、行き場を失い、深い戸惑いに変わっていく。</p>\n    <p class=\"no-indent\">「ほら、殺せよ。そうしたら誰にも咎められることなく、心置きなく死ねるだろ」</p>\n    <p class=\"no-indent\">「やめろ……」</p>\n    <p class=\"no-indent\">「もしかして怖いのか？　キズキの死んだ世界で生きるよりも、僕の死が怖いのか？」</p>\n    <p class=\"no-indent\">「やめろ、やめろ、やめろ」</p>\n    <p>彼は必死に首を振っている。それでも僕は胸ぐらを掴んだまま、詰め寄った。</p>\n    <p class=\"no-indent\">「だから臆病者なんだよ。君は自分の命を犠牲にできても、僕の命は犠牲にできない。他人の命を踏み台に生きられるほど傲慢にもなれないし、他人を見捨てられるほど冷酷にもなれない。いいか？　傲慢になれないなら、差し伸べられた手を弾くな。冷酷になれないなら、見守ってほしいなんてほざくな。僕が僕自身の無自覚な言動によって、君やキズキを傷つけたように、君だってその中途半端な覚悟と優しさで、僕の心を際限なく傷つけているんだよ。そんなことも理解できないで、一丁前に死にたいなんてほざくな！」</p>\n    <p>そこで初めて、自分が泣いていることに気づいた。頬を伝う涙は止まらなかった。それでも僕は声を張り上げ続けた。</p>\n    <p class=\"no-indent\">「自分の命は犠牲にできても、他人の命は犠牲にできない？　笑わせるのも大概にしろ。君は今夜、死ぬと決めたんだろ？　それなのに適当な理由をつけて、僕をここに連れてきた。その時点で、もう答えは出ているんだよ。君はどうしたって死ぬのが怖いんだ。そしてここに僕を連れてきたのも、結局は自殺を止めてもらいたいだけなんだよ。何を言いたいか、もう分かってるだろ。今夜の逢瀬も、バーでの会話も、ガレージへの引導も、すべては君のくだらないひとり芝居に過ぎないんだよ。舞台俳優みたく悲劇を演じて、グロリアという舞台装置を用意して、観客として僕を呼び寄せて、随分と派手にやってくれたもんだよ。だけど、それはすべて虚構だ。全部フィクションだ。君の本心は、ただひとつしかない。助けてほしい。このどん底から救い出してほしい。それだけだ。それだけしかない。そう、それだけのことなのに君は、こんなにも大掛かりな虚構を築き上げて、本心を伝えることから逃げている。なあ、こんなことやって、馬鹿らしくならなかったのか？　しんどくならなかったのか？」</p>\n    <p>叫び終えると、ガレージはひどく静まり返った。トヲルは幽霊でも見たかのように呆然と立ち尽くし、ただ僕の涙を凝視している。その胸ぐらを掴む僕の指先は、怒りと情けなさでガタガタと震えていた。僕は喉の奥からせり上がる熱い塊を強引に飲み込み、さらに言葉を絞り出した。</p>\n    <p class=\"no-indent\">「苦しいなら、苦しいと言えよ。辛いなら、辛いと言えよ。死にたいなら、死にたいと言えよ。言いづらいのはわかるさ。だけど、言わなければ本当の意味で、何も変わらないだろ。ひとりで抱え込んでいたって、物事はひとりよがりな方向にしか進まない。それによって追い詰められるのは、他ならぬ自分自身だろ。もちろんこんなこと口にしたたって、君はどうせ『そんなことわかってる』としか思わないんだろ。実際そうさ。僕がこうやって言っていることも全部わかっていながら、君はこんなくだらないひとり芝居をやってるんだからな。救いようがないよ。だけどな、口にしないと、始まらないことだって世の中にはあるんだよ。ほら、遭難したときに煙を上げない限り、救助隊に見つけてもらえないように、口にする意志がない限り、決して変わることのないことだって世の中にはたくさんあるんだ。もちろん煙を上げたからって、気づいてもらえるとは限らない。だけど煙を上げない限り、見つけてもらえない。これだけは、間違いないんだよ。だからこそ、救われるためには、何がなんでも声を上げなければならない。煙を上げなければならない。その一声が、一筋の煙が、君自身の未来を開き、運命を変えるんだ。それだけの力を、口にし、語ることは持っているんだよ」</p>\n    <p>吐き出された僕の息が、ガレージの空気を重く湿らせていく。トヲルはもう、僕から視線を逸らすことすらできなくなっていた。僕は彼を逃がさないようにさらに顔を近づけ、今度は諭すような、それでいてひどく冷ややかな声で告げた。</p>\n    <p class=\"no-indent\">「人の命は、死のもとに平等だ。傲慢な政治家も、謙虚なアスリートも、慈愛に満ちた聖母も、死ねばみんな灰になるだけだ。そこに優劣も、序列も、区別もない。身も蓋もないことを言えば、自分が今ここで手首を切って死のうが、君がここでグロリアに乗り込んで死のうが、世界にとってみれば街角の風向きが変わるくらいの意味しかないんだ。それなのにどうして君は、自分の命をそんなに簡単に疎かにできるんだ。少しは自分を愛せよ。尊べよ。君は、優しすぎる。もっと傲慢になるべきだ。他人の命を蹴落としてでも、自分の命を尊重してみせろ。他人の尊厳を踏み躙ってでも、自分は価値ある存在だと証明してみせろ。いつまでも優等生ぶって、謙虚であろうとするな。自分を押し込めて、強がろうとするな。そんなことしかできずに、自分が犠牲になればいいんだなんて思い上がっているうちは、他人を尊ぶ資格なんてないんだよ。少しはそういうことも自覚しろ！」</p>\n    <p>溜まりに溜まった怒りを、すべて吐き出した。僕は息を切らしながら、それでも胸ぐらを掴み続けた。</p>\n    <p class=\"no-indent\">「キズキを失って悲しいのはわかる。残された者は、死んだ者に思いを巡らせることしかできない。それがどれだけ虚しく、報われないことか、それは僕だってよく知っている。それでも僕たちは生きて、キズキを想い続けなくちゃいけないだろ。彼を知る、ひとりの人間として」</p>\n    <p>トヲルの唇が震えた。反論したいはずだった。否定したいはずだった。だが、その言葉を押し込めるように、僕はさらに声を張った。</p>\n    <p class=\"no-indent\">「君はキズキを失ってひどく傷ついたに違いない。その気持ちは、僕にもよくわかる。朝起きても苦しい。街を歩いていても苦しい。何かを見ても、何かを聞いても、ふとした瞬間にキズキを思い出す。『もういない』という事実だけが、何度も胸に突き刺さる。その痛みを、君はこの十年間ずっと抱えてきたんだろ？　それなのに君は死のうとする。君が死んだら、今度はその痛みを僕が抱えることになる。君が味わってきた苦しみを、痛みを、今度は僕が何十年も抱えて生きることになる。君はその苦しみを、僕に押しつけるのか？　自分が傷ついたように、誰かを傷つけて死ぬのか？」</p>\n    <p class=\"no-indent\">「……違う」</p>\n    <p class=\"no-indent\">「違わない。いいか、自殺っていうのは人を傷つける死に方なんだよ。それは君が、一番よくわかっているだろ」</p>\n    <p>その言葉に、トヲルは黙った。キズキが死んで、僕たちは傷ついた。その傷は今もまだ癒えていない。</p>\n    <p class=\"no-indent\">「君はこれまで、数えきれないほど傷ついてきた。傷つきに傷ついて、その果てで死を選ぼうとしている。だけど君が死んだら、今度は君を想う誰かが傷つくんだ。その傷は、簡単には消えない。十年経っても消えなかった君の傷と同じように、ずっと心の奥に残り続ける」</p>\n    <p>涙を拭うこともせず、続けた。</p>\n    <p class=\"no-indent\">「それでも君は、自分が傷ついたのと同じように、誰かを傷つけて死ぬのか？　本当に、そんな死を望んでいるのか？」</p>\n    <p class=\"no-indent\">「……違う」</p>\n    <p class=\"no-indent\">「違わない！」</p>\n    <p>声が、心が震えていた。トヲルを失うことが、どうしても耐えられなかった。</p>\n    <p class=\"no-indent\">「確かに君は今、死ぬに値するくらい辛いのかもしれない」</p>\n    <p>一度言葉を切り、震える息を吐いた。</p>\n    <p class=\"no-indent\">「でも君は、まだ死ぬに値するほど幸せじゃない」</p>\n    <p>トヲルの眉がわずかに動いた。怯えながらも、その眼差しは僕から逸れなかった。</p>\n    <p class=\"no-indent\">「確かに君は、死ぬに値するだけの苦痛を味わったのかもしれない。ここまで生きてきて、もう十分だと思うくらい傷ついたのかもしれない。でも、君はまだ、死ぬに値するほど幸せじゃない。苦痛だけで人生を終えるなんて、あまりにも不公平だ。君はこの世界から傷つけられたことで、たくさんのものを奪われてきた。だったら今度は、その傷に見合うだけのものを、この世界から享受しなきゃいけない。苦しみも、喜びも、その両方を抱えてようやく君の人生は出来上がる。どちらか片方だけを抱えて死ぬなんて、本来あってはならないんだ。だから君はその帳尻が合うまで、もがき苦しみながら生きなきゃいけない。苦しんだ分だけ、幸せにならなきゃいけない。それだけじゃいけないのか？　それだけだからいけないのか？」</p>\n    <p>わからなかった。それが希望となるのか、絶望となるのか、救いとなるのか、綺麗事となるのか、何もわからなかった。それでも僕はそう信じることしかできなかった。キズキが死んだあともこの世界には生きるに足る何かが、まだ残されているのだと。僕たちの知る由もない幸せが、この先のどこかに待ち受けているのだと、信じることしかできなかった。僕は一息つくと、ポケットから煙草を取り出し、ライターで火をつけた。針のように細い煙が、ゆらゆらと頭上を漂った。その瞬間、ひとつの情景が脳裏に浮かんだ。</p>\n    <p class=\"no-indent\">「大学二年の頃、真夜中の公園でサークルのみんなと飲み明かしたことがあっただろ」</p>\n    <p>トヲルは何も言わなかった。ただ濡れた目で、続く言葉を待っていた。煙をゆっくりと吐き出しながら、僕は遠い記憶の底へ意識を沈めた。</p>\n    <p class=\"no-indent\">「みんな飲んだくれてバタバタ倒れて、だけどキズキだけは一滴も飲まなかったんだよ。酔い潰れた連中に毛布を掛けたり、コンビニで水を買ってきたり、最後まで世話を焼いていた。キズキらしいだろ？」</p>\n    <p>あの夜の景色が、胸の奥に蘇る。</p>\n    <p class=\"no-indent\">「それでさ、みんながベンチや芝生で寝静まったあと、僕はふと目が覚めたんだ。みんな眠っていたから、すぐに横になろうとしたんだけど、そのとき、少し離れた遊具のところに、キズキがいるのが見えたんだよ。街灯の下のベンチに腰掛けて、缶ビールを片手に夜空を見上げていたんだ」</p>\n    <p>今でも鮮明に覚えている光景だった。</p>\n    <p class=\"no-indent\">「驚いたよ。すっかり寝てたと思っていたから。僕はすぐに声を掛けようとした。でも、できなかった」</p>\n    <p>僕は静かに、煙を吐き出した。</p>\n    <p class=\"no-indent\">「だって、あまりにも楽しそうだったから──」</p>\n    <p>トヲルは黙って聞いていた。</p>\n    <p class=\"no-indent\">「星空を見ながら、ひとりで笑っていたんだ。声を出すわけでも、誰かと話しているわけでもない。ただ静かに酒を飲みながら、本当に幸せそうな顔をしていた。まるで今この瞬間だけで人生は、十分だって言っているみたいに」</p>\n    <p>目を閉じる。今でも鮮明に瞼の裏にある光景だった。</p>\n    <p class=\"no-indent\">「あの夜、キズキは何も特別なことなんてしていなかった。ただ星を見て、酒を飲んでいただけだ。でもそのときの僕には、その姿があまりにも美しく見えてしまった。まるで太陽が惚れて月が嫉妬するくらいに。そのことを、キズキの葬式の日にふと思い出したんだよ。あの憂鬱な葬式の日に」</p>\n    <p>白い花に囲まれた葬儀場で、僕は何度もあの夜のことを思い出していた。棺の中で眠るキズキではなく、星空の下で静かに笑っていたキズキを。</p>\n    <p class=\"no-indent\">「そのとき思ったんだ。あの楽しそうなキズキの顔を知っているのは、僕だけなんだって。僕だけが知っていて、僕だけが証明できるもの。この世界でたった一人、僕だけが知っているキズキの素顔。僕がいなくなれば、この世界から跡形もなく消えてしまう、なかったことになってしまうキズキの姿。きっと誰もが、そんなものを持っているんだよ。『キズキ』という存在を証明する、記憶をさ」</p>\n    <p class=\"no-indent\">「『キズキ』を証明する、記憶……」</p>\n    <p>トヲルが、救いを求めるようにこちらを見つめた。息を整え、僕は静かにその目を見返した。</p>\n    <p class=\"no-indent\">「そのときに思ったんだ。それが僕の生きる意味なんじゃないかって。自分だけが証明できる『キズキ』を抱えて、『キズキ』が生きたことの証人になる。僕がこの世界で生きている限り、『キズキ』と過ごしたあの日々は色褪せることなくあり続ける。僕たちにしか証明できない『キズキ』があるなら、僕たちは生きている限り、その証人であり続けなくちゃいけない気がするんだよ」</p>\n    <p>キズキへの想いが、トヲルへの想いが、胸の奥から止めどなく溢れ出る。それを押し留めることなく、言葉にした。</p>\n    <p class=\"no-indent\">「僕たちがいなければ、『キズキ』はどんどんこの世界から損なわれてしまう。それはまずいし、何よりキズキが可哀想だ。だから僕たちは生きなければならない。生きて、『キズキ』が生きていたことを、僕たちの記憶で証明し続けなければならない」</p>\n    <p>キズキという肉体は確かに死んだ。だけど、僕たちが覚えている限り、キズキの存在そのものまでが消えてしまうわけじゃない。</p>\n    <p class=\"no-indent\">「だから生きるんだ。キズキが生きていたことを、僕たちが生きて証明するんだ。自分のためじゃない、『キズキ』のために生きるんだよ」</p>\n    <p class=\"no-indent\">「キズキのために、生きる」</p>\n    <p>トヲルの瞳が震えている。煙草を捨て、僕はその肩を両手で掴んだ。</p>\n    <p class=\"no-indent\">「そうだよ。僕でも君でもない、キズキのために生きるんだ」</p>\n    <p>トヲルの肩が震えている。ぎゅっと掴み、必死に震えを抑えた。</p>\n    <p class=\"no-indent\">「このまま、俺は生きていけるのか」</p>\n    <p class=\"no-indent\">「生きていけるさ。大丈夫。僕がついてる」</p>\n    <p class=\"no-indent\">「キズキのいない世界で、俺は生きていけるのか」</p>\n    <p class=\"no-indent\">「生きていけるよ。大丈夫」</p>\n    <p>本当に大丈夫なのか、本当に生きていけるのか、わからなかった。それでもトヲルとならば生きていけそうな気がした。</p>\n    <p class=\"no-indent\">「一人で抱え込んじゃダメだ。辛いなら、苦しいなら伝えてほしい。分かち合ってほしい。必ず、力になるから……」</p>\n    <p class=\"no-indent\">「力になる……」</p>\n    <p>僕は頷き、グロリアからホースを引き抜いた。</p>\n    <p class=\"no-indent\">「だからさ、キズキが生きられなかった分だけ、一緒に生きよう」</p>\n    <p>そう言って僕が微笑むと、トヲルはそのまま床へ突っ伏した。両腕で顔を覆い、固い床に押し当てた体全体を小さく縮めている。溢れそうになる息を何度か呑み込もうとしていたが、やがて呼吸が途切れ途切れになり、肩の震えが大きくなり、低い啜り泣きの声が静かに足元から漏れ出していった。</p>\n    <p class=\"no-indent\">「……怖かった。キズキがいなくなったのも、それからの人生も、ずっと怖かった。そしてお前を失うのも、やっぱり怖かった」</p>\n    <p>体を震わせながら、トヲルは胸のうちを明かした。僕はただその背中を撫でた。</p>\n    <p class=\"no-indent\">「でも、本当の意味でキズキが死ぬのは、もっと怖い」</p>\n    <p class=\"no-indent\">「そうだね」</p>\n    <p>それから僕たちは、キズキに思いを巡らせた。生者は死者に思いを巡らせることしかできない。それでも僕たちは思いを巡らせることで死者と向き合っていく。ガレージの中で、しばらく誰も言葉を発しなかった。聞こえるのは、互いの荒い呼吸だけだった。泣き疲れたトヲルは床に座り込み、僕も壁にもたれて肩で息をしていた。目張りされた窓、床に転がるホース、充満した排気の臭い──そのどれもが、ほんの少し前まで僕たちを死へ導こうとしていたことを物語っていた。重くなった体を、ゆっくりと起こす。膝が、わずかに震えていた。トヲルもそれに気づいたのか、小さく苦笑した。</p>\n    <p class=\"no-indent\">「外に出よう」</p>\n    <p class=\"no-indent\">「……ああ」</p>\n    <p>肩を支え合いながら、ガレージの出口へ向かう。シャッターの隙間から流れ込む夜気は、驚くほど冷たかった。外へ出た瞬間、ひやりとした空気が肺の奥まで流れ込んだ。思わず大きく息を吸う。さっきまでの淀んだ空気とはまるで違う、紛れもなく生きている人間のための空気だった。夜は深く更けていた。住宅街は寝静まり、遠くで犬の鳴く声が一度だけ聞こえた。街灯の淡い光がアスファルトを照らし、その向こうには果てしない夜の闇が広々と広がっている。だけど、不思議と怖くはなかった。僕はその場で、ポケットから煙草を二本取り出した。指先は、まだ少し震えていた。ライターを鳴らすと、小さな炎が夜の中で揺れた。一本をトヲルに渡し、もう一本を口に咥えた。ゆっくりと煙を吐き出すと、白い煙は冷えた夜気に溶けながら、静かに空へ昇っていった。トヲルもまた煙を吐いた。二筋の煙は途中で絡み合い、やがて見分けがつかなくなった。トヲルは人差し指と中指に挟んだ煙草を、静かに天へ掲げた。赤く灯る火種だけが、夜の中で小さく瞬いている。吐き出された煙は冷たい空気の中で細く伸び、風に形を崩されながらも、ゆっくりと空へ昇っていった。僕もまた煙草を掲げ、その行方を目で追った。二筋の煙は溶け合い、夜の闇へと吸い込まれていく。</p>\n    <p class=\"no-indent\">「キズキに届けよう」</p>\n    <p class=\"no-indent\">「……ああ」</p>\n    <p>僕たちの想いは、あの煙に乗っているのだろうか。風に揺られ、雲をくぐり抜け、月の傍らを過ぎて、星空のさらに先へ──届いただろうか。</p>\n    <p class=\"no-indent\">「アイツ、ずっと前に言ってたよ。この世界は天国と呼ぶには残酷で、だけど地獄と呼ぶにはあまりにも美しい。それが俺たちの生きづらさだって」</p>\n    <p class=\"no-indent\">「生きづらさ？」</p>\n    <p>トヲルはその問いに頷き、夜空を仰いだ。幾千もの星が、遠くから光を放っている。まるで、ここにいるよと叫ぶように。</p>\n    <p class=\"no-indent\">「確かにこの世界は残酷だよ。だけど死ぬには惜しいくらい美しい。キズキの言った通り、生きづらいよ、全く──」</p>\n    <p class=\"no-indent\">「そうだね」</p>\n    <p>無数に散らばる星に、それらを呑み込むように横たわった天の川。その姿は、ただひたすらに美しい。</p>\n    <p class=\"no-indent\">「きっと、夜空の向こうには天国があるんだよ」</p>\n    <p class=\"no-indent\">「どうしてそう思う？」</p>\n    <p class=\"no-indent\">「だって、あんなに星が輝いているから」</p>\n    <p>トヲルは夜空を見つめながら、そっと微笑んだ。限りなく透明で、静かな夜だった。僕たちは煙草を高く、高く掲げた。</p>\n    <p class=\"no-indent\">「絆希に捧げよう」</p>\n    <p>その言葉に頷き、天を見上げると、夜空の片隅で、ひとつの星が震えるように瞬いた。まるで太陽が惚れて月が嫉妬するような、眩い光で。</p>\n</div>\n\n</main>\n\n<div class=\"afterword-section\">\n  <button type=\"button\" class=\"afterword-toggle\" id=\"afterword-btn\" aria-expanded=\"false\">最後に</button>\n  <div class=\"afterword-content\" id=\"afterword-content\" hidden>\n    <h2 class=\"aw-title\">あとがき</h2>\n    <div class=\"aw-epigraph\">\n      <span>伝えなかったことにはならない。</span>\n      <span class=\"indent\">ただ伝わらなかっただけで──</span>\n    </div>\n    <p>この作品をひとことで表すなら、こんな言葉がふさわしいのではないかと思います。生きるのがつらかった日々、死がとても魅力的に思えたあの日々、僕は何かを書きたいという初期衝動に駆られて、その圧倒的なエネルギーを抱えたまま、この作品の原案となる二つのエピソードを書き上げました。『君が死んだら、僕も死ぬよ』と『Speak or Die』、高校二年生の頃に描いた小説です。\n    <p>『君が死んだら、僕も死ぬよ』はこの作品でいう現代パート（奇数話）、『Speak or Die』はこの作品でいう回想パート（偶数話）です。この二つの小説は、共に『生と死』という重いテーマを縦糸に、語られることなく潰えた想いという悲劇を横糸に、生きることにもがき苦しむ人たちを描いています。当時はこの二つの小説を統合して、一つの小説作品にするつもりはなかったのですが、高校を卒業し、相変わらず将来の見通しが立たず、ぼんやりとしていたときに、高校時代自分自身が生きるために書いたこの二作を統合してみたら、より重厚な物語になるのではないかと思い立ちました。そこからの流れは実にスムーズで、豊かで、輝きに満ちていました。\n    <p>この二作の通底する、語られざる想いによって、生と死の明暗が分かれるというテーマはひとつの作品に収斂させることで、より先鋭になったように感じます。そして改めてこの作品を通読すると、当時原案となる二つの小説を執筆していた自分自身もトヲルやキズキ、ミツルのようにもがき苦しんで生きていたのだなと実感できました。あの頃から、どれだけ自分が成長できたのかはわかりませんが、この作品を書いたことで、何かしら得るものがあったのではないかと思っています。そしてそれが読者の方に、少しでも響いたり、届いたりしたら、これ以上に嬉しいことはないです。</p>\n  </div>\n</div>"},{"id":"toto-chan","number":"II","title":"ととちゃん","subtitle":"Toto-chan","desc":"誰かに見つけてもらえなければ、<br>自分は存在しないのではないか――。<br>右こめかみの星形のほくろから<br>「スター先輩」と呼ばれる少女は、<br>幼い頃に失った愛犬の首輪を<br>今も首に巻いている。","content":"<div id=\"toc\">\n  <ol>\n    <li><a href=\"#ch0\">プロローグ</a></li>\n    <li><a href=\"#ch1\">第一話：暇？</a></li>\n    <li><a href=\"#ch2\">第二話：慣れると気にならない</a></li>\n    <li><a href=\"#ch3\">第三話：重かったね</a></li>\n    <li><a href=\"#ch4\">第四話：別れた</a></li>\n    <li><a href=\"#ch5\">第五話：いなくてもいい</a></li>\n    <li><a href=\"#ch6\">第六話：夏、だね</a></li>\n    <li><a href=\"#ch7\">第七話：うらら</a></li>\n    <li><a href=\"#ch8\">第八話：散歩して</a></li>\n    <li><a href=\"#ch9\">第九話：ありがとう</a></li>\n    <li><a href=\"#ch10\">第十話：かちり</a></li>\n  </ol>\n</div>\n\n\n<main id=\"honbun\">\n\n  <div class=\"section\" id=\"ch0\">\n    <h2 class=\"section-title\">プロローグ</h2>\n    <p>ＯＤはコスパが悪いとあれほど言っていたのに、スター先輩は咳止めを三十錠飲んだ。薬は市販のものだった。ドラッグストアの棚に無造作に並んでいる一箱数百円の鎮咳薬。成分表示を確認する素振りもなく、彼女はそれをレジに持っていった。メジコンでもブロンでもなく、ただの咳止め。三十錠というのは二箱以上に相当する量で、飲み込むだけでも相当な時間と水が必要だったはずだ。それでもスター先輩はやりきった。そのストイックさだけは、誰にも負けない。ところが天罰とでもいうべきか、副作用がようやく抜けかけた翌朝、彼女はひどい風邪を引いた。悪寒に、発熱、止まらない咳。皮肉にも薬を三十錠流し込んだ翌日に、本物の咳が始まってしまったのだ。体はだるく、起き上がるだけで額に汗が滲んだ。しぶしぶ近所のクリニックへ赴いたスター先輩に、医者は聴診器を当てながら咳止めを処方した。ところがその薬は、前日に三十錠もの同系統の成分を体に叩き込んだせいで耐性ができてしまい、一切効かなかった。スター先輩はベッドの上で毛布を顎まで引き上げ、天井を見つめながら力なく咳き込み、「しんどい」と掠れた声で呟いた。自業自得という言葉が、部屋の空気にじんわりと滲んでいた。</p>\n    <p>数日後、再診のために再びクリニックを訪れたスター先輩を、医者は首を傾げながら迎えた。処方通りに服用しているはずの咳止めが、どうしてこんなにも効かないのか。電子カルテを眺め、聴診器を当て直し、もう一度首を傾げた。当然、問診票に「昨日玩具のように咳止めを大量服用した」などと書けるはずもなく、スター先輩は「うーん、なんででしょうねえ」とだけ答えた。医者は腕を組んで少し考えてから、処方箋を書いた。咳止めの代わりに処方されたのは、ハチミツ入りの喉飴だった。袋を受け取ったスター先輩は、薬局の白い蛍光灯の下でそれをしばらく眺めた。三十錠の咳止めが行き着いた先が、喉飴。彼女は乾いた笑いをひとつ漏らした。それは苦笑いというより、もはや自分の業の深さを認め、受け入れるような笑いだった。</p>\n  </div>\n\n  <div class=\"section\" id=\"ch1\">\n    <h2 class=\"section-title\">第一話：暇？</h2>\n    <p>スター先輩について少し話しておこう。池袋生まれの池袋育ち。繁華街の雑踏と電車の騒音を子守唄代わりに育った一人っ子の女の子。両親はどちらも忙しく、かといって放任というわけでもなく、ただ娘に対して過度な期待も、深刻な失望も抱かなかった。テストで赤点を取っても叱られず、賞状を持ち帰っても大げさに褒められない。必要最低限の確認だけをして、すぐに自分の世界に戻っていく。そういった家庭で育ったせいか、彼女は幼い頃から、自分がそこにいるという実感に乏しかった。家族の会話に自分がほとんど出てこない日々が、骨の髄まで染みついていたのだ。だからこそ、彼女は外の世界で「見られている」ことだけが、自分の輪郭をかろうじて保つ手段になった。しかしそれはどこまでも脆く、危うい肯定の手段でもあった。</p>\n    <p>彼女の呼び名についても触れておこう。彼女の友人たちは、よく彼女のことを親しみも込めて「スター先輩」と呼んでいた。スターの由来は、彼女の右こめかみにある星型のほくろのことで、一体誰が最初にそれを指摘をしたのかは覚えていないが、気づけばそれは彼女の代名詞になっていた。実際、右こめかみにスターが宿っているという事実は、彼女にとってきわめて重要な意味を持っていた。彼女にとって目立つことは、誰かの記憶に残ることと同義だった。目立たなければ誰の記憶には残らないし、記憶にすら残らなければ、自分がここにいたという事実は跡形もなく消えてしまう。彼女はそのことをもっとも恐れていたし、だからこそ右こめかみに宿ったスターをとても大切に扱っていた。スターによって顔を覚えてもらえるということは自分の存在を認めてもらえるということでもあり、それはすなわち、彼女にとって唯一無二の絶対的な存在証明となる。だからこそ右こめかみに刻まれた「スター」の印は、彼女にとって切っても切り離せない、まさに自分の分身といっても過言ではないくらい不可分な存在だった。</p>\n    <p>ところが彼女はごく稀に心を許した相手にだけ「スター先輩」でも、本名でもない第三の愛称を差し出すことがあった。それが『ととちゃん』だった。「とと」という名前については、彼女が幼い頃に飼っていた一匹のマルチーズに由来する。母親と初めてペットショップを訪れた日のことを、彼女は今でもよく覚えていた。犬や猫たちの鳴き声が絶えず響き、甘いペットフードの匂いと消毒液の匂いが混じり合う店内。その雑多で賑やかな空間を彼女は母親の手を握ったまま、絶えず目移りしながらじっと見て回った。丸くなって眠るもの。兄弟同士でじゃれ合うもの。こちらなど眼中にないという顔で横を向いているもの。透明なガラスケースの向こうでは、小さな命たちが各々の時間を生きていた。しかしそんな小さな命たちの営みの中で彼女の目を真っ先に引いたのが、一匹の白いマルチーズだった。他の犬たちが思い思いに過ごしているなか、そのマルチーズだけはガラスケースの前面にぴたりと張りつき、通り過ぎる人間のひとりひとりに向かって、懸命に尻尾を振っていた。黒い瞳は期待に満ちてきらきらと輝き、小さな舌をのぞかせながら、まるで「ここにいるよ」とでも訴えるように身体全体で存在を主張している。誰かが立ち止まれば嬉しそうに飛び跳ね、視線が向けばさらに激しく尻尾を振る。その姿には、単なる愛くるしさだけでは片付けられない、どこか痛々しいほどの必死さがあった。まだ見ぬ誰かに選ばれたい。誰かに無条件に愛され、満たされたい。そんな仔犬の必死な姿に、幼い彼女は言語化できない切実な願いを勝手に読み取ってしまった。だからこそ彼女は、その仔犬の姿から目を離すことができなかった。厚さ数ミリの薄いガラスを隔てた向こう側で、剥き出しの小さな命が世界に向かって、その存在を全力で主張している。そのひたむきな姿に、彼女はひと目で心を奪われた。</p>\n    <p class=\"no-indent\">「この子がいい」</p>\n    <p>ぽつりと呟いた娘の言葉に、母親は即座に眉をひそめて首を振った。世話の手間、アレルギーの懸念、マンションの規約。大人の都合からなる拒絶の理由はいくらでも溢れ出てきたが、彼女は決して引かなかった。それは極めて異例なことだった。普段の彼女は、常に親の顔色を先読みし、拒絶される前に自らの欲求を引っ込めてしまう、聞き分けのいい子どもだったからだ。しかしその日だけは違った。食事の席でも、就寝する前も、彼女は無言の、しかし頑なな意志を崩さなかった。三週間におよぶ静かな膠着状態の末、とうとう母親のほうが根負けした。</p>\n    <p class=\"no-indent\">「とと」という名前は彼女自身がつけた。特別な語源も、高尚な意味もない。ただその白い塊を抱き上げたとき、胸の奥から自然とこぼれ落ちた響きがそれだった。そして予想通り、ととはとても手のかかる犬だった。夜が来れば寂しそうに鳴き続け、あちこちで粗相をし、気に入らないことがあれば小さな牙を剥いて噛みついた。それでも彼女は甲斐甲斐しくととの世話をし続けた。学校から帰ると、靴も脱ぎ散らかしたまま真っ先にととのいるケージへと駆け寄った。抱き上げればミルクのような甘い匂いとともに、顔中を温かい舌で舐め回された。家の中でととだけが、彼女の気配を察知すると、狂喜乱舞してその全身を向けてくれた。両親は娘が帰宅したことにさえ気づかない夜が多かったが、ととだけは違った。いつでも、どんなときでも、暗闇の中でも、彼女の足音を聴き分けていた。しかしそんな幸福な時間は、あまりにも唐突に終わりを告げた。ととが夭折したのは、飼い始めてから一年と少しが過ぎた、木枯らしの吹く秋の日だった。「生まれつき、心臓に重い疾患があった」と、後から訪れた獣医は静かに告げた。それは彼女が小学校で授業を受けている間の出来事だった。帰宅し、玄関を開けた瞬間に漂う、妙に静まり返った空気。リビングへ進むと、母親がととのケージの前で力なく立ち尽くし、肩を震わせていた。その背中を見ただけで、彼女にはすべてが理解できた。もう、あの激しい尾音で迎えられることはないのだと。</p>\n    <p>葬儀は家族だけのひっそりとしたものだった。骨壷に入ったととを、彼女は一ヶ月もの間、寝るときにずっと抱きかかえていた。生前「とと」がお気に入りだったぬいぐるみは綻び、涙でぐっしょりと濡れていた。それらはととの死から半年が経った頃に寺院で供養されることになったのだが、散歩のときに使っていた細い革製の首輪だけはどうしても供養することができなかった。だから彼女はととの面影が残ったその小さな首輪をそっと手元に残した。そして彼女は次の日から、真鍮の金具がついたその首輪を自らのか細い首に巻きつけるようになった。まるで自らを繋ぎ止める、チョーカーのように。行き場を失ったリードはズボンのポケットに忍ばせ、いつでも取り出せるようにした。なぜそんなことをするのか、誰にも説明しなかった。いや、当時の彼女には自らの胸を締めつける感情を説明できる言葉がまだ見つかっていなかったのだ。首輪をつけた彼女に対し、友人は最初のうちこそ奇妙なものを見る目を向けたが、一ヶ月もそれが彼女の肌の一部と化すのを見るうちに、やがて何も言わなくなった。彼女はあとになって気づくことになる。あの日、ガラスケースの向こうで必死に尻尾を振っていたのは、ととだけではなかったのだと。誰かに見つけてほしい。選んでほしい。愛してほしい。そんな言葉にならない渇望を抱えていたのは、むしろ自分自身の方だったのだと。だからこそ彼女にとってその首輪は、逝ってしまったととの形見である以上に、自らの心に課した逃れがたい戒めでもあった。死んだ愛犬のことを忘れないために、あるいは誰にも拾われなかった自分の孤独を忘れないために、彼女は自分の首に首輪を巻き続けた。そういった経緯もあり、彼女が自らの内なる痛みに『ととちゃん』という名を与え、ひそかに名乗るようになったのも、それは必然の帰結といえた。彼女にとって『ととちゃん』という呼び名は両親から与えられた、社会的でもっともらしすぎる本名や、友人たちが憧れを込めて囃し立てる「スター先輩」という眩い記号よりも遥かに深く、不気味なほどしっくりと自らの希薄さに馴染んだからだ。</p>\n    <p>さて、そんな不思議めいた彼女との出会いについても語らなくてはならない。しかし肝心なのは私と彼女の間に最初から何か特別な関係があったわけではないということだ。私たちはただ共通の友だちの誕生日会に呼ばれ、見知らぬ人間が十数人ひしめき合う狭い部屋で、たまたま隣に座った。そしてそれが彼女であり、私であった。ただそれだけのことである。部屋はリビングを無理やり使っていて、折りたたみのテーブルが二つ並べられ、百円ショップの紙皿に唐揚げと、スナック菓子が盛られていた。誰かがスピーカーにスマホを繋いでいたが、音量の調整を誰もしないせいで、人々の声とほぼ同じくらいの音量でポップソングが流れていた。私は知らない人間ばかりの中で、どこに視線を置けばいいかわからず、紙コップのジンジャエールを飲んでは伏し目がちに眺め回すことを繰り返していた。一方、スター先輩はその場で誰かと積極的に話しているわけではなかった。膝の上にスマホを乗せて、時々画面を見て、時々部屋を見回して、唐揚げを一つ取って食べた。それだけだった。一つだけ、他の人間と違うものがあるとするなら、首元だった。鎖骨の少し上のあたりに、細い革の輪が巻かれていた。チョーカーにしては素気なく、アクセサリーにしては無骨だった。しかしそれを抜きにしても、彼女の周囲だけは明確に空気が違うような感じがした。ざわざわとした空間の中で、彼女の半径一メートルだけがどういうわけか静かだった。</p>\n    <p>私たちが話したのは、その場に流れる音楽がほんの一瞬、途切れた瞬間だった。隣に座った彼女は不意に「何年生？」と訊いてきた。私が「二年」と答えると、「じゃあ、後輩だ」と言って、それだけで満足したようにオレンジジュースを口に運んだ。その日私たちが交わした言葉はそれだけだった。でも帰り際、出口でまた鉢合わせると、彼女は「また会おうね」とだけ言って、池袋の雑踏に吸い込まれるように消えていった。また会おうというのは社交辞令だと思っていた。しかし翌週、共通の友人を通じてスター先輩からメッセージが届いた。「暇？」というたった一言だけだった。</p>\n    <p>私はその返事の簡潔さに、しばらく呆然とし、感心してしまった。何せ当時の私にとって「言葉」とは常に相手の顔色を窺い、その裏にある機嫌を読み解かなければならない、ひどく神経を摩耗させる道具でしかなかったからだ。ここで私の家庭環境についても踏み込んでおこう。実のところ私はその頃なんとなく家の中で居心地が悪かった。我が家の母は常に優しかったが、その優しさには常に、かすかな息苦しさが伴っていた。彼女の優しさは常に何かを先回りしていた。私が疲れているのを見れば好きなものを作り、私が黙っているのを見れば適度な話題を持ってきた。それ自体は悪いことではない。ただ先回りされ続けると、自分がどこかへ消えていくような感覚があった。私自身の気持ちよりも、母親が想像した私の方が先に存在しているように思えたのだ。だから母親の視線の中に映っている「私」はいつも少しだけ本物の私とずれていた。そしてそのずれを指摘する言葉を、私はまだ持っていなかった。父親は、別の意味で難しかった。商社勤めで出張が多く、月に数回程度しか家に帰ってこなかった。帰らないこと自体は、慣れてしまえば普通のことになった。問題は、帰ってくる夜だった。父親が帰ってくる日は前日から空気が変わった。母親の動きが少し忙しなくなる。冷蔵庫を開ける回数が少し増え、料理の品数が一つか二つ多くなる。父親の好きな銘柄のビールが冷やされる。これらの変化は誰も口にしないが、家の中のどこかに張り詰めた何かが生まれた。父親自身が怒鳴るとか暴力をふるうとか、そういったことは一切なかった。ただ食卓に座ると、部屋の重力とでも呼ぶべきものが変わった。父親は寡黙で、食事中もほとんど話さなかった。そして話さないことが圧力になっていた。何か話題を見つけなければという義務感が場に漂い、母親がいくつかの話を試みるが、父親の返答は常に短く、それ以上続くことはなかった。私は箸を動かしながら、どこに視線を置けばいいかわからなくて、米粒を数えるようにして食べた。別に怒っているわけでも、機嫌が悪いわけでもない。それはわかっているはずなのに、呼吸は浅くなった。父親が「ごちそうさま」と言って席を立つと場の緊張が少し解けた。そのほっとする感覚を悟られないように私は何でもない顔を保った。感情を持っていることを気取られないように、悟られないように私は細心の注意を払った。しかしそういった習慣は、往々にして自分の生き方を規定してしまう。私は長い時間をかけて、いつからか自発的に感情を持って動くよりも、相手の感情や、思考を事細かに精査してから動くようになった。相手の感情や、思考を詳細に分析し、その裏や、心理を読み解いていく。そうすることで私は自分や、相手が傷つく可能性を、最小限に抑えようとしていたのだ。しかしそれはひどく神経を摩耗する生き方でもあった。常に相手の顔色を窺い、その裏にあるものを詮索していく作業は精神的にかなりの労力を要した。そしてその結果、私はいつからか人間関係において、個人的な関係を積極的には望まないようになってしまった。つまりは孤立していたのである。</p>\n    <p>だからこそ「暇？」と訊いてきたスター先輩に引き寄せられたのは、単に彼女の言葉の軽さからだけではなかった。彼女のメッセージには相手を試すような鋭さも、過剰な歓迎もなかった。ただ一定の距離を保ったまま、こちらの存在を前提として差し出される均質で無機質な呼びかけ。それが私が家で感じていた先回りする優しさや、名状しがたい圧力とは驚くほど対照的だったのだ。「暇？」の二文字は応答の有無を問う以前に、既にこちらの存在を前提として認め、受け入れていた。そして何より常に人の顔色を窺い、相手の感情を詮索してきた私にとって、スター先輩の何の裏も圧力もない簡潔な問いかけは、張り詰めた心を一瞬にして解き放ってくれた。だから私はスター先輩のその押しつけがましさのない接し方に、素直に好感を抱き、ほとんど反射的に「ひま」と返信を打った。すると、すぐに「じゃあ来て」と、住所が送られてきた。それがスター先輩の部屋との、最初の出会いだった。</p>\n  </div>\n\n  <div class=\"section\" id=\"ch2\">\n    <h2 class=\"section-title\">第二話：慣れると気にならない</h2>\n    <p>彼女の部屋との出会いは鮮烈だった。実際、私は扉を開けた瞬間、目前に広がった光景に絶句した。部屋というものがあれほど混沌とした状態に変貌できるとは、それまでの十四年の人生で思いもしなかったからだ。空き缶やペットボトルが床のあちこちに散在し、脱ぎ捨てた服が山をなし、進路調査用紙やスナック菓子の包装紙が、ピサの斜塔のような危うい高さで部屋の片隅に堆積していた。スター先輩はその惨状の真ん中に胡座をかき、何食わぬ顔で蒸しパンを食べながらテレビを見ていた。</p>\n    <p class=\"no-indent\">「ひど」と思わず声が漏れた。</p>\n    <p class=\"no-indent\">「そう？」と彼女は言った。「慣れると気にならないんだよね」</p>\n    <p>それが彼女の口癖だった。慣れると気にならない。彼女はそうやって、多くのものを受け流して生きていた。床に散らばった空き缶も、途切れがちな会話も、自分の存在の薄さも、何もかもを。もちろん私は最初、その部屋の汚さに絶句していた。足の踏み場こそあるものの、どこを見ても生活の痕跡が剥き出しのまま放置されていて、何処に目を向ければいいのかわからなかった。ところが私は同時にその散らかり具合に、ひどくほっとしてもいた。自分の家には、ゴミというものが落ちていたことがなかったからだ。食後の皿はすぐ洗われ、脱いだ靴は綺麗に揃えられ、テーブルの上にはいつも何も置かれない。それが当たり前だと思って、私はこれまで十四年間生きてきた。しかしあの日、扉を開けた瞬間、私の中には確かに何かが流れ込んできた。整然とした空間では絶対に得ることのできない、強烈な何かだ。それがいったい何なのかは私にもよくわからない。しかし後になって考えてみれば、たぶんそれは「誰にも見張られていない」という感覚だったのだと思う。この部屋では誰も、誰かの様子を先回りして窺っていなかった。部屋が散らかっていることについて恥じているものは誰もいなかった。つまりそこでは誰も相手のことを気にしてはいなかったのだ。それは日々家庭の中で相手の顔色を窺っていた私にとってみれば、かなり異質なことだった。しかしその異質さこそが、私の安堵の理由でもあった。</p>\n    <p>結局、その日の午後、私たちは特に何をするでもなく、ただ部屋に並んで座ってテレビを見た。スター先輩は時折おかしな突っ込みを入れて、私はそれに釣られて笑った。私がクスッと笑うたびに、彼女は少し得意そうな顔をしたが、すぐに澄ました表情に戻った。夕方になると「もう帰っていいよ」と言われた。もちろん、そこはお世辞にも居心地のいい空間ではなかったが、それでも確かに不思議と居たくなるような何かがあった。</p>\n    <p>それからの数ヶ月、私は週に一度か二度、スター先輩の部屋に呼ばれた。呼ばれるたびに特別な理由があるわけでもなかった。「暇？」と言われて行くと、部屋で何かを食べているか、スマホを眺めているか、寝転んでいるかのどれかだった。用がなければ「もう帰っていいよ」と言われた。しかし帰ろうとすると「あ、そういえばさ」と何かを話し始めることが多かった。ある日は、どこの高校がいいと思うかという話になった。スター先輩はぱらぱらと雑誌をめくりながら、驚くほど熱心に喋った。「制服がかっこいい学校がいい」「通学に一時間以上かかるのは嫌」「でも遠いと親がうるさいこと言ってこないからいいかも」。話しながら結局どうしたいのかよくわからない結論に至り、「まあ受験してみてからだ」と言ってまた雑誌に目を落とした。別の日は、池袋の話をした。彼女は自分が育った街のことを批判的でも肯定的でもなく、ただ観察記録のように静かに語った。「東口と西口で住んでる人間の質が全然違うんだよ」「サンシャイン通りに夕方行くと、ホストっぽい男がビラ配ってるんだよね。でも誰も受け取らないから、結局バッグに押し込んでる。あれ、毎日どのくらい捨ててるんだろうね」「西口の公園、昔はもっと人がいたらしいけど、今はほとんど誰もいないんだよ。でも夜になると猫がいるから猫公園に改名したほうがいいよ」。彼女の語り口には街の細部をよく観察しているような節があった。雑踏の中にいながら、外側から眺めているような目。その目には、どこか達観したような諦めが混じっていた。私はそこに親近感を覚えていた。</p>\n    <p>中学三年生だったスター先輩は、夏頃から本格的に高校受験の勉強を始めた。といっても机に向かう姿勢が劇的に変わったわけではない。相変わらず床には空き缶が転がり、参考書は開きかけのまま別の雑誌に押し潰されていた。それでも成績は確かに伸びていた。赤点常連だった英語が平均点を超え、苦手だった数学も少しずつ形になりはじめた。本人はどこ吹く風で、「なんかわかってきた」と缶コーヒーを飲みながら言うだけだった。私が何か手伝えることがあればと申し出ると、「問題集の丸つけだけやって」と言われた。赤ペンを手渡され、スター先輩の解答用紙を採点した。数学は意外に点数が高かった。英語は文法より語彙で点を落としていた。単語帳は鞄の中に入っているが、ほとんど開いた形跡がなかった。指摘すると「単語帳ってなんか好きじゃないんだよ。文脈ないと覚えられないからさ」と言い返してきた。じゃあどうするの、と聞くと「本読む」とだけ答えた。実際、彼女の部屋には英語の文庫本が何冊かあった。翻訳版と並べて置かれていて、好きなシーンだけ原文で読んでいたらしい。</p>\n    <p>そうして冬が来て、受験当日も普段着に近い格好で試験会場に訪れたスター先輩は、桜の咲く前に志望校の合格通知を手にした。あの散らかった部屋からでも、ちゃんと未来へ続く道が伸びていたのだ。合格の報告は電話ではなく、ショートメッセージで届いた。「受かった」それだけだった。私は「おめでとう」と返した。しばらくして「ありがと」と来た。それだけだった。大げさな喜びも、感謝の言葉もこれからの展望もなかった。でも、私は何となくそのメッセージをスクリーンショットした。「受かった」という二文字は、彼女が努力した時間のすべてを内包していた。</p>\n    <p>彼女にとって高校生活は紛れもなく新しい生活の始まりだった。新しい教室、新しい制服、新しい仲間たち、新しい教師たち。彼女は目前まで迫った明るい未来に期待していた。中学とは何か違う、もっと鮮やかで濃密な時間が待っていると信じていた。悩みや葛藤はあれど、これから先の未来に迷いや不安は存在しなかった。彼女も、私も、当時はそう信じていた。しかし事件は、入学から間を置かずに起きた。</p>\n  </div>\n\n  <div class=\"section\" id=\"ch3\">\n    <h2 class=\"section-title\">第三話：重かったね</h2>\n    <p>その前にまず、スター先輩の彼氏について話しておかなければならない。</p>\n    <p>スター先輩が彼と付き合い始めたのは中学二年の秋の終わりだった。試験勉強が一段落しかけた時期で、ちょうど具体的な進路が見えてきて、気持ちが勉強以外に向き始めた頃のことだった。相手は同じ中学の一つ上の先輩だった。背が高く、話すときに相手の目をまっすぐに見つめる男だった。それ以外に特にこれと言って大きな特徴はなかったが、当時のスター先輩にはそれだけで十分すぎるほど響いたのだと、後になって彼女は言った。</p>\n    <p>彼との最初のエピソードを、スター先輩はよく話してくれた。出会ったのは文化祭の後片付けのときで、スター先輩が一人で折りたたみの机を廊下に運んでいたら、黙って反対側を持ってくれたのだという。話しかけてくるわけでも、名前を聞いてくるわけでもなく、ただ重たい机の端を持った。廊下を一緒に歩いて、所定の場所に置いて、「重かったね」と言って去ってしまった。それだけだったのに、とスター先輩は言った。どうしてそれで好きになるわけ、と私が問うと、「わかんない、でもなんかよかったんだよね。すごく刺さった」と彼女は答えた。私はその話を聞きながら、どこかで奇妙なものを感じていた。それはある意味では嫉妬にも似た感情だったのかもしれないし、また別の意味では単純な疑問だったかもしれない。「重かったね」と言って去った男のその一言のどこがそんなに良かったのか、私は本当に理解できなかった。でも同時に理解できないこと自体が少し不快でもあった。何故なら、理解できないと認めることは、自分が彼女の本質に届いていないと認めることでもあったからだ。</p>\n    <p>その後、スター先輩と彼はクラスの共通の知り合いを通じて連絡先を交換し、数週間のやり取りを経て、年が明ける前に付き合うことになった。交際の始まりは、喫茶店での待ち合わせだった。池袋の西口から少し歩いたところにある、昔ながらの純喫茶だった。内装が古びた木造で、コーヒーの香りが床板に染み込んでいるような店で、窓から街を見下ろせた。彼はコーヒーを飲みながら、スター先輩の右こめかみを指さした。</p>\n    <p class=\"no-indent\">「そのほくろ、星みたいだね」</p>\n    <p>誰にも言われたことがなかった言葉だった。いや、星みたいと言われたことはあったかもしれないけど、言い方が少し違ったとスター先輩は言った。どう違うの、と聞くと、彼女はうまく言えないと言った。強いて言うなら、ちゃんと自分のことを見ていたという感じ、と。スター先輩は自分の容姿にあまり自信がなかった。鏡の前で「ブスだよな」と呟くのを、私は何度か聞いたことがあった。冗談めかした言い方ではなく独り言を呟くような、確認するような声で。だから彼に「ちゃんと見てもらえている」と感じたことは、それなりに大きかったのだと思う。</p>\n    <p>交際が始まってからの数ヶ月は、後から振り返れば蜜月と呼べる時期だった。週に一度か二度、放課後に会った。行く場所はたいして特別でなくて、池袋の喫茶店とか、図書館とか、サンシャインシティの広場などで特別な何かをするのではなく、ただ並んで時間を過ごした。彼は人の話をよく聞く人間だった。スター先輩が何かを話すたびに、相槌を丁寧に打ち、質問が自然で、簡潔だった。そして何より話が途切れることを怖れない人間でもあった。沈黙になっても、急いで埋めようとしなかった。そのスマートな沈黙との付き合い方が、スター先輩には心地よかった。</p>\n    <p>ただ、彼にはひとつの癖があった。それは自分のことをあまり多く話さないということだった。聞けば答えるが、自分からは話さない。スター先輩が気づいたのは交際から二ヶ月ほど経ってからだった。自分が彼のことをあまり知らないことに気づいた。家族のことや、友人関係のこと、将来の話。彼はどれも軽く流した。深掘りしようとすると、話題をうまく変えた。別に隠しているというふうでもなく、ただそういう話し方をする人間だった。どうしてそういう話し方をするのか、スター先輩は一度聞いたことがあった。彼は少しの間沈黙してから、相手に不快な思いをさせたくないんだ、と答えた。不快にさせたくない？　とスター先輩が尋ねると、自分の話をしているときが人っていちばん楽しいからね、邪魔したくないんだと端的に答えた。当時のスター先輩は、それを彼の性格だと思っていた。後から考えれば、違ったのだろうが。</p>\n    <p>ともあれ、スター先輩は高校入学と交際継続という二つの春を同時に迎えた。新しい制服を買いに行ったとき、彼が付き合ってくれた。百貨店の制服売り場で、スター先輩がブレザーを羽織って見せると、「似合う」と言った。もっと詳しく言ってよ、とスター先輩がからかうと、「首元がとても綺麗に見える」と答えた。首元、という言葉にスター先輩は少し照れた。それが彼女にとって、高校入学前の最後に記憶している幸せの感触だった。そして新しい生活が始まってからも、その幸福は続いていくものだと彼女は信じていた。慣れない教室や新しい友人たちに囲まれても、放課後に彼と会う約束があるだけで彼女の心は軽くなった。未来はまだ漠然としていたが、少なくとも彼との関係だけは揺るがないものだと思っていた。しかし事件はあまりにも唐突に、無慈悲に起きた。何と入学からほぼ間を置かずに。スター先輩と付き合っていた彼が別の女性と交際していたことが発覚したのだ。しかもその女性は、妊娠をしていた。スター先輩が新しい教室で自己紹介をしていたのと、ほぼ同じ頃に──。</p>\n    <p>スター先輩がそれを知ったのは、偶然と呼ぶには出来すぎた夜だった。手持ち無沙汰に滑らせていた指がふと画面の端で引っかかった。見覚えのある横顔が他人の写真に紛れ込んでいたのである。通り過ぎかけた指先が戻り、アカウントを開く。整然と並ぶ投稿の中で、違和は一つではなかった。最初は錯覚だと思った。しかし遡るごとに像は輪郭を増し、やがて逃げ場のない確信へと変わっていった。そこに写っていたのは、自分の彼氏だった。問題は、その写り方にあった。単に偶然背景に入り込んだ通行人という写り方ならよかった。しかしスター先輩の彼氏は、撮影者である女の子と明確な関係を示す距離に繰り返し現れていた。肩に回された手、テーブル越しの対面、夜景の前で並ぶ影。それらは単発ではなく、日付とともに積み重なっていた。最低でも数週間、場合によってはそれ以上の期間にわたって、継続的に接触していたことが読み取れた。</p>\n    <p>スター先輩はいったんスマホを伏せた。部屋が静かすぎた。自分の呼吸の音が、やけにはっきり聞こえた。膝の上に置いた手がじわりと湿っていた。彼女は一度、小さく息を吐いた。それから投稿のタイムスタンプと自分が彼と会っていた日程とを照合した。するといくつかの日付が正確に重なった。自分と過ごしているはずの時間に、別の女の子と同じ時間を共有している記録が視覚的に残されていたのだ。それは一見すると不可解な状況ではあったが、筋は通っていた。関係が発覚した際に言い逃れの余地を残そうとしている──そう考えれば、全てが腑に落ちた。</p>\n    <p>電話をかけたのは、その直後だった。呼び出し音は長く続かず、直後に軽い調子の応答が返ってきた。</p>\n    <p class=\"no-indent\">「もしもし？」</p>\n    <p>何も知らない者の声音だった。スター先輩は遠回りをしなかった。</p>\n    <p class=\"no-indent\">「このアカウント、知ってる？」</p>\n    <p class=\"no-indent\">「……え？　なんの話？」</p>\n    <p>例のアカウント名を告げ、写真を挙げ、時間と場所を一つずつ押さえていった。否認はすぐに出たが、長くは続かなかった。</p>\n    <p class=\"no-indent\">「それは──」</p>\n    <p class=\"no-indent\">「何日の、どこの店？」</p>\n    <p class=\"no-indent\">「……いや、その」</p>\n    <p>具体を重ねるごとに、言葉は鈍り、間が増え、やがて途切れた。受話器の向こうに残った沈黙は、どんな説明よりも正確だった。</p>\n    <p class=\"no-indent\">「……もういい」</p>\n    <p>スター先輩はそこで電話を切った。切った後、しばらく画面をただ見つめていた。怒りが来るかと思っていたが、来なかった。代わりにひどい眠気が訪れた。彼女は気持ちを落ち着かせる意味でも、一度ベッドの中に入った。しかし当然、寝れるはずはなかった。決定的な補足が届いたのは、その翌日だった。例のアカウントの持ち主からメッセージが来たのだ。文面は極めて簡潔で、余計な装飾を欠いていた。自分が彼と関係にあること。現在妊娠をしていること。関係が重なっていると知りながら、継続していたこと。必要な情報だけが、過不足なく並んでいた。時期や頻度にも曖昧さはなかった。前夜に拾い上げた断片と、矛盾なく接続された。その日のうちに、スター先輩は彼を呼び出した。場所は、夜通し灯りの消えないファミレスだった。</p>\n    <p>向かい合って座ると、ドリンクバーのコーヒーマシンが低く唸っているのが聞こえた。平日の夜遅く、客はまばらで、遠いテーブルに受験生らしき男の子が一人、参考書を広げていた。スター先輩はブラックコーヒーを一口飲んでから、感情を表に出さず、順に確認していった。</p>\n    <p class=\"no-indent\">「いつから」</p>\n    <p class=\"no-indent\">「……」</p>\n    <p class=\"no-indent\">「妊娠を知ったのは」</p>\n    <p class=\"no-indent\">「……その」</p>\n    <p class=\"no-indent\">「なんで」</p>\n    <p>問いは極めて具体的で、逃げ道を一切残さない形をしていた。彼は彼女の問いに応じきれなかった。否認と曖昧な言い換えを繰り返し、やがて辻褄を失った。事態に見合う言葉は、もうどこにもなかった。そこでスター先輩は区切りを置いた。関係を終えると短く告げたのである。</p>\n    <p>しかしその瞬間、彼の態度が急に変わった。</p>\n    <p class=\"no-indent\">「待って、別れたくない」</p>\n    <p class=\"no-indent\">「……」</p>\n    <p class=\"no-indent\">「お願いだよ、許してほしい」</p>\n    <p>濁していた口が、別の意味で動き始めた。声が震えていた。スター先輩はそんな彼を黙って見ていた。謝罪でも弁明でもなく、ただ「別れたくない」という言葉を繰り返し続ける彼を。</p>\n    <p class=\"no-indent\">「じゃあ、その子はどうするの」</p>\n    <p class=\"no-indent\">「それは……考える」</p>\n    <p class=\"no-indent\">「いつ」</p>\n    <p class=\"no-indent\">「……」</p>\n    <p>スター先輩はそこでようやく呆れを示した。それでも最後に一つだけ残っている問いを、取り落とさなかった。</p>\n    <p class=\"no-indent\">「どうして黙ってたの」</p>\n    <p class=\"no-indent\">「……」</p>\n    <p class=\"no-indent\">「どうして関係を続けたの」</p>\n    <p>彼女はその問いを逃げ場のない形で彼へと差し出した。彼はしばらく黙っていた。卓上の水滴を指でなぞり、消してはまた現れる輪を見つめていた。受験生が鉛筆でノートを叩く音だけが、遠くから聞こえた。少し離れたテーブルで談笑しているカップルがいた。それは言葉を探しているというより、言い逃れの形を選び損ねているような間だった。 しかし彼はやがて観念したように口を開いた。</p>\n    <p>彼の説明は断片的な弁解などではなく、一応の筋を持とうとしていた。まず、自分がずっと誰かから求められている状態だったこと。だからこそ誰かに選ばれ続けているという状態が途切れることを、極端に恐れていたのだということ。関係を一つに絞れば、その関係が終わった瞬間に、選ばれているという前提は消えてしまう。故に彼は関係を重ね、どちらからも切られない状態を維持しようとしていた──それが二重交際という形を取った理由なのだと。次になぜそれを隠したのかという点について、彼は長い沈黙のあと、「試していた」という言葉を選んだ。</p>\n    <p class=\"no-indent\">「何を？」</p>\n    <p class=\"no-indent\">「それでも離れないかどうか」</p>\n    <p>スター先輩は黙った。コーヒーカップを両手で包み、テーブルを見た。彼の説明はこういうことだった。もし浮気が発覚したとき、それでもなお自分を手放さないかどうか。関係の不利が明らかになったあとでも、相手が自分を選び続けるかどうか。それを確認することでしか、自分が相手にどの程度必要とされているのか測れなかった。だから自分の価値を確かめる意味で二重交際をしていた。彼は、そう言った。もちろんスター先輩はこの論理を到底受け入れることはできなかった。しかし同時におかしいと思いながら、それでも聞き続けてしまう自分もいた。</p>\n    <p class=\"no-indent\">「……最低だね」</p>\n    <p class=\"no-indent\">「わかってる」</p>\n    <p>さらに彼は妊娠という事実についても、同じ尺度で処理していたことを認めた。責任の所在を直視するより先に「それでも離れないか」という一点で相手の出方を見ていたのだと。結果として関係は倫理や現実の負担から切り離され、「どれだけ自分が求められるか」を測ることに収束していたのだと。そして、そこまで言って彼はようやく自分の内側について言及をした。</p>\n    <p class=\"no-indent\">「……誰かに求められてないと、すぐ価値がなくなる気がするんだ」</p>\n    <p>その一言が出た瞬間、スター先輩の中で何かが止まった。怒りでも、共感でもない。ただ、ある種の既視感のような、説明のつかない静けさだった。彼女はその感覚を言葉にできなかった。ただ黙って、彼の顔を見た。</p>\n    <p class=\"no-indent\">「だから、関係を重ねて、確かめていたんだと思う」</p>\n    <p class=\"no-indent\">「……」</p>\n    <p class=\"no-indent\">「それで残った方が、自分にとっての本当の関係なんだって」</p>\n    <p>求められ続けている状態を複数の関係で担保し、さらにその強度を確かめるために、わざと不利な条件を作る。そうすれば、残った方だけが「本当に必要としている相手」だと判断できる──彼の言いたいことはそういうことだった。そして彼の論理はあらゆる面で、その一点に収束していた。</p>\n    <p class=\"no-indent\">「卑怯なのは、わかってる」</p>\n    <p class=\"no-indent\">「……」</p>\n    <p class=\"no-indent\">「でも、それも含めて残るかどうか、見てた」</p>\n    <p>彼は自分の行為が卑劣であること自体は否定しなかった。ただ、その卑劣さも含めて相手が受け入れられるかどうかを見ていたと言った。そうして残る関係だけが、自分にとって有効な拠り所になるのだと。彼は全てを語り終えると視線を上げた。スター先輩は戸惑った。犯した過ちはもちろん見過ごせなかったが、彼の話には筋が通っていた。人間関係の不安定さから、相手を試そうとするその心理は彼女にも共感できた。しかしそれ以上に、彼女は理屈の形を整えたはずの彼の言葉が、どこか芯を欠いていることに気づいていた。彼の論理は説明としては間違いなく閉じていたが、責任の所在だけが最後まで外側に置かれていた。まるで責任を取ることから、逃れるように。</p>\n    <p>スター先輩はその事実を前に、しばらく黙っていた。彼女は当初、彼とはきっぱり縁を切るつもりでいた。しかし彼の歪んだ理屈は、きっぱりと縁を切るにはあまりにも首尾一貫していた。愚かであると明確に断じながらも、彼は彼なりの矛盾を抱えながら、それでも何とか自分の均衡を保とうとしている。そんな必死な姿に彼女はどこか行き場のないものを見てしまった。切り捨てるべきだと理解しながら、それでも切り捨てきれない何かが彼女の胸の奥には引っかかった。そして結果的にそれが彼との関係を一か月ほど延ばしてしまった。</p>\n  </div>\n\n  <div class=\"section\" id=\"ch4\">\n    <h2 class=\"section-title\">第四話：別れた</h2>\n    <p>ファミレスの夜から半月が経っても、スター先輩は彼と会い続けた。もちろん理屈では終わっていた。あの夜、向かい合ったテーブルの上で、彼女は関係を終えるとはっきり告げた。それは本心だった。衝動的な怒りでも、感情的な勢いでもなく、ただ論理的な結論として、彼女はそこに辿り着いた。しかし翌朝に彼から届いたメッセージを、スター先輩は開いてしまった。短い文章だった。謝罪でもなく、説明でもなく「昨日の話をもう少ししたい」という一文と、彼女が好きな喫茶店の名前が添えられていた。あの純喫茶の名前だった。二人で何度も行った、木の内装の、コーヒーの香りが板に染み込んでいる店だった。スター先輩はしばらく画面を見つめ、既読をつけたまま置いた。返信はしなかった。しかし翌日、その喫茶店の前を通りかかったとき、ふと足が止まった。もちろん入らなかった。ただ、しばらく扉の前に立っていた。風が吹いて、ドアベルが揺れた。中から珈琲の匂いがした。それだけのことで、なぜか喉の奥が痛くなった。そういうことが何度か続いた。彼からの連絡を無視しながら、特定の場所や時間帯を避けながら、しかし完全に断ち切ることもできないまま、彼女の日々は続いた。彼女自身、なぜそうなるのかを言語化できなかった。あの夜に彼が語った歪んだ理屈──誰かに求められ続けることでしか自分の価値を測ることができないという理屈が、胸の底に引っかかっていた。哀れみでも共鳴でもなかった。ただ、それが自分自身と地続きであるような冷えた既視感があった。彼女もまた、求められることでしか輪郭を保てなかった。星のほくろを確かめ、散らかった部屋に埋もれる。彼を切り捨てれば、自分も消えてしまうような気がした。だからこそ彼女は、彼を完全に拒絶できなかった。</p>\n    <p>しばらくしてスター先輩は彼と再会した。最初に会ったのは、別れを告げてから十一日が経った頃だった。場所は駅前のチェーンのカフェだった。二時間ほどたいして意味のない話をして別れた。その帰り道、彼女は自分でも意味がわからないと思いながら、なぜか激しく泣いた。一体泣く理由がどこにあるのか、彼女にもわからなかった。怒りでも、悲しみでもなく、ただ涙が溢れた。彼女はすぐさまコンビニのトイレに入って、個室の中で十分ほどかけて泣き続けた。鏡を見ると目が腫れていた。自分の顔が少し他人のように見えた。帰宅してから彼女は部屋の床に転がったまま、天井を二時間見続けた。その頃から眠れない夜が増えた。深夜二時に目が覚めて、そのまま朝まで過ごすことが週に何度もあった。高校に上がってから彼女はラーメン店で求人を見つけ、バイトをしていたが仕込みの作業中に手が止まることが増えた。スープの味見をして、何も感じないことがあった。美味しいとも不味いとも思わない。ただ液体が口の中にあるという、それだけの感覚。店長には気を遣われて声をかけられたが、彼女は「大丈夫です」と言い続けた。事実、体は動いていた。学校にも行っていた。ただ、何かがじわじわと薄れていくような感覚が、日常の端に常にあった。</p>\n    <p>リストカットを最初にしたのは、何度目かの眠れない夜のことだった。午前三時をとっくに回っていた。布団に入っても眠れなくて、起き上がって、床に座った。膝を抱えて、壁にもたれた。部屋には音がなかった。外からも何も聞こえなかった。聞こえないということが、その夜に限って奇妙な重さを持っていた。世界がどこかへ行ってしまって、自分だけがここにひとり取り残されているような感覚。胸の中にぽっかりと穴が空いているような感覚。そういうものを何時間もかけて、彼女はただ抱えていた。衝動的ではなかった。気づいたら引き出しを開けていた。工作用に買ったカッターナイフだった。刃を折るタイプのどこにでもある安いもの。取り出して、手首を見た。蛍光灯の光の下で、血管の生々しい青さが皮膚越しにうっすらと透けていた。生きているということの証拠が、こんなに表面近くに走っている。その事実が、そのとき妙に遠く感じた。そっと刃を当てた。すーっと引くと、皮膚が思ったより簡単に裂けた。最初は何も感じなかった。それから数秒遅れて、鋭い痛みが来た。傷口からぷっくりと血が滲み出してきた。繰り返しカッターで傷をつけると、鋭い痛みの後に不思議な静けさがやってきた。泣かなかった。ただ静かに息を吐いた。それだけでよかった。それだけだからよかった。血は少量で、すぐに止まった。翌朝には傷にテープを貼り、長袖の制服を着た。誰にも何も言わなかった。それから数週間の間に同じことを七度繰り返した。毎回、深夜だった。毎回、時間をかけてそこに辿り着いた。二度目は一度目よりも迷いが少なかった。三度目は迷いがなかった。傷を増やすたびに、彼女は静けさを感じた。痛みによって、ようやく自分がここにいるという手応えを得る。散らかった部屋と同じ。自分で自分を痛めつけることで、薄れゆく存在を必死に留めようとする。だがその行為は、結局、希薄さをさらに深くするだけだった。しかしそれでもやめられなかった。</p>\n    <p>四度目のあと、傷の数を確認しながら、この行為が自分に及ぼす影響について考えた。しかし考えたところで何も変わらないと思い、やめた。五度目のとき、少し深く入りすぎた。血が思ったより多く出て、手が震えた。それでもやめることはできなかった。六度目は、痛みよりも先に静けさが来た。順序が逆になっていた。七度目のあと、床に座ったまま傷口を押さえながら、ふと気づいた。別に死にたいわけじゃなかった。その事実に自分でもひどく驚いた。しかしそれは本当だった。自分は消えたいとも、終わりにしたいとも思っていない。ただ何かに触れたかった。自分が本当にここにいるかどうかを確かめたかった。生きているという感覚が、自分の中に本当にあるかどうかを。カッターナイフを使うたびに、それを確かめていた。そういう行為だったのだと、七度目を終えてから初めて気づいた。しかし当時は、それすら言葉にならなかった。ただ、やめられなかった。</p>\n    <p>七度目を終えた翌朝、彼女は考えた。自分はいつリストカットを知ったのだろうと。もちろん、リストカットという行為そのものを知らなかったわけではなかった。中学に入る頃にはインターネットや雑誌の記事の断片、誰かの噂話のようなものを通じて、そういう行為がこの世界に存在することは知っていた。けれど当時の彼女にとって、それはどこか遠い場所の出来事だった。理解できるとも当初は思わなかったし、自分に関係があるとも当然、思わなかった。ただ、生きづらさを抱えた誰かがいるらしいという程度の認識だった。それはＯＤについても同じだった。ネット上には様々な体験談や断片的な情報が溢れていたが、彼女はそれらを特別な興味を持って読んでいたわけではない。学校から帰ってきて、なんとなく画面を眺めているうちに目に入った言葉のひとつに過ぎなかった。だから後になって自分がその言葉の意味を身をもって知ることになるなど、その頃は想像もしていなかった。</p>\n    <p>ＯＤに手を出したのは、その少し後だった。深夜に目が覚めた。また眠れない夜だった。布団から出て、台所へ行った。水を飲もうと思った。コップを取り出して、蛇口を捻ろうとしたとき、棚の上の咳止めの瓶が目に入った。買い置きのもので、ただそこにあった。スター先輩は瓶を手に取って、ラベルを読んだ。成分表示。用量。一回二錠、一日三回まで。その「まで」という言葉が、しばらく頭に引っかかった。ＯＤについて検索をしたのはそのときではなかった。翌日の昼、図書館の隅に座って膝の上にスマートフォンを置いて、調べた。成分名を入れると、関連する情報が次々と出てきた。作用の仕組み、用量の上限、閾値を超えたときに体に何が起きるか。感覚が変わるという記述があった。意識が遠くなるという記述があった。スター先輩はその記述を何度か読んだ。感覚が欲しかった。あるいは今ある感覚をいったん切り離したかった。どちらともつかないまま、彼女は情報だけを淡々と集めた。それから一ヶ月、スター先輩は何もしなかった。情報を持ったまま、ただ日々をやり過ごした。しかしある深夜、目が覚めて、また例の空洞が来た。ぽっかりと胸に穴が空いたような感覚。世界が遠のく感覚。彼女はそのとき初めて引き出しではなく棚に手を伸ばした。十錠を水で流し込んだ。服用直後、すぐに眠気が来た。体が重くなって、床に横たわると、そのまま意識が遠のいた。夢を見た気がしたが、内容は覚えていない。翌朝、目が覚めると体が鉛のように重かった。吐き気があった。頭がゆっくりと回転しているような眩暈があった。立ち上がろうとすると床が遠ざかっていくような感覚に見舞われた。しかし不思議と気分は悪くなかった。感覚が、全部少しずつずれていた。痛みも、虚ろさも、胸に空いた穴も、どこか遠いところにあった。それから彼女はＯＤを、週に一回するようになった。いつの間にか、ドラックストアを何件も回ることが彼女の日課になっていた。</p>\n    <p>彼と最後に会ったのは、ＯＤを初めてやった日の翌週だった。自分から連絡をしたのは、珍しいことだった。なぜそうしたのか、スター先輩自身にもうまく説明できなかった。ただ、会わなければならないという感覚があった。確かめなければならないことが、まだある気がした。場所は以前と同じ夜通しのファミレスで、時間は夜の十時だった。向かい合って座ると、コーヒーマシンがあの日と同じように低く唸っていた。店内はがらんとしていて、遠いテーブルにトラックの運転手らしき男が一人、定食を食べていた。スター先輩はホットコーヒーを一口飲んだ。苦かった。それから、口を開いた。感情は一切込めなかった。込めようとしなかったわけではなく、込める感情がもう手元になかった。眠れない夜のことを静かに話した。左腕の傷のことを断片的に話した。棚の上の瓶のことを淡々と話した。全部ではなかったが、輪郭だけを丁寧に話した。話しながら自分の声が妙に遠くから聞こえた。まるで他人のことを報告しているみたいだと思った。彼は黙って聞いていた。話し終えると、沈黙があった。長い沈黙だった。スター先輩はその間、彼の顔だけをじっと見ていた。動揺が来た。それは本物だった。それから困惑が来た。それも本物だった。眉が寄って、目が泳いで、何か言おうとして言葉を失う、その過程がゆっくりと顔の上を通過していくのを、スター先輩はただ黙って見ていた。そして最後に安堵が来た。ほんの一瞬だった。目の緊張がわずかに緩んで、肩が落ちて、口元がかすかに弛む。その一瞬を、スター先輩は見逃さなかった。見た瞬間、何かが腑に落ちた。落ちたというよりも納得をした。この人は今、安心している。私が傷ついているという事実に。私が追い詰められているという事実に。それが彼にとって、自分が必要とされている証拠として機能している。あの夜に聞いた理屈は本当だった。彼は今この瞬間も、同じ尺度でこちらを測っている。スター先輩は確信した。この人は変わらない。変われない。そしてそれ以上に、自分もその構造の中に自発的に留まり続けていた。傷のことを話したのは自分だった。彼に会いに来たのも自分だった。あの一ヶ月、断ち切れなかったのも自分だった。彼女は自らその枷とでも呼ぶべきものを、彼の目の前に差し出していた。痛みと虚無を晒すことで、「まだ必要とされている」という最後の証拠を、相手に、そして自分に突きつける。枷を外せば、自分が消えてしまうという恐怖が、彼女をそこに留めていた。散らかった部屋に埋もれ、咳止めを飲み、刃を当て、薬を流し込み、それでもなお、誰かに自分の傷を見せることで輪郭を保とうとする。彼女は被害者である前に、その構造の共犯者だった。そして今も、自らその鎖を握りしめ続けていた。</p>\n    <p>コーヒーカップを見た。液面が静かだった。スター先輩は立ち上がった。声は出さなかった。財布から千円札を一枚取り出して、テーブルに置いた。コーヒー代だった。彼が口を開きかけた。スター先輩は手のひらを、静かに返した。言葉を遮るためではなかった。ただ、もう聞く必要がない、という意思表示のためだった。店を出ると、夜風が頬に当たった。六月の終わりの風で、思ったより冷たかった。振り返らなかった。ガラス越しに、彼が何かしているのが視界の端に映ったが、見なかった。歩道に出て、しばらく歩いた。足が震えていることに気づいたのは、角を曲がってからだった。泣きたいとも思わなかった。ただ、ひどく疲れていた。何かがようやく終わったという感じではなく、長い間持ち続けていた重いものを、まだ手放せていないような感じ。空が低くて、街灯の光が妙に白かった。</p>\n    <p>翌朝の六時に、電話が鳴った。画面にスター先輩の名前が出た。私は寝ぼけたまま出た。</p>\n    <p class=\"no-indent\">「別れた」</p>\n    <p>開口一番、それだけだった。声は、驚くほど平坦だった。おはようでもなく、起こしてごめんでもなく、ただ「別れた」。</p>\n    <p class=\"no-indent\">「……いつ」</p>\n    <p class=\"no-indent\">「昨日の夜」</p>\n    <p class=\"no-indent\">「そっか」</p>\n    <p>詳しく聞こうとしたが、彼女は「もういい、終わったから、全部終わり」と繰り返した。繰り返し方が少し、念を押すような繰り返し方だった。自分に言い聞かせているのか、こちらに言い聞かせているのか、私には判別できなかった。</p>\n    <p>少し間があった。</p>\n    <p class=\"no-indent\">「でも、しんどい」</p>\n    <p>それだけだった。しんどいというのは何がしんどいのかと聞こうとした瞬間、彼女は続けた。</p>\n    <p class=\"no-indent\">「別にどうもしなくていい、ただ言いたかっただけ」</p>\n    <p>それ以上は話さなかった。電話は五分ほどで切れた。</p>\n    <p>私はしばらく暗い天井を見ていた。朝の六時の光がカーテンの隙間から斜めに差し込んでいた。彼女が何をしたくて電話をかけてきたのか、そのときの私にはよくわからなかった。慰めてほしかったわけでもない。話を聞いてほしかったわけでも、多分ない。ただ、誰かの耳に「しんどい」という言葉を届けたかった。声に出して、どこかに着地させたかった。そういうことだったのだと私はしばらく後になってから気づいた。そしてそのために選ばれたのが、朝の六時で、相手が私だったということもしばらく後になってから理解した。そして理解をしたとき、私はなぜかひどく安堵してした。安堵したことに、後になって自分自身もひどく驚いた。しかしその安堵は確かなものだった。私は彼女から電話がかかってきたことに、ある種の満ち足りた感情を感じていた。自分が求められていることへの安心感、自分が必要とされていることへの充足感。それが私に小さな、でも確かな安堵を与えていた。私はその事実にひどく困惑したが、同時に納得もしていた。何故なら、自分が彼女に必要とされたいのだということに気づいていたからだ。</p>\n  </div>\n\n  <div class=\"section\" id=\"ch5\">\n    <h2 class=\"section-title\">第五話：いなくてもいい</h2>\n    <p>スター先輩の様子が変わり始めたのは、彼氏と別れた一ヶ月後だった。呼ばれて部屋に行くと彼女がいつもより静かだった。テレビがついておらず、カーテンも閉められていた。机の上に置かれたノートパソコンの光だけが煌々と光り、スター先輩は布団の上に横たわって、天井を見ていた。部屋の空気が違った。何かが抜け落ちたような、あるいは何かが溜まりすぎたような、どちらとも判断できない重さがあった。私が声をかけると、唇がわずかに動いて、短い返事だけが返ってきた。視線は動かなかった。床に座るスペースをいつものように確保しようとしたが、以前にも増してゴミと吐瀉物の跡が散乱していて、足の踏み場がなかった。ペットボトルをどけると、血がついたカッターナイフが床に転がっていた。咄嗟に視線を逸らしたが、スター先輩は私の反応に気づいていた。ただ何も言わなかった。</p>\n    <p class=\"no-indent\">「どうしたの」と私は訊いた。</p>\n    <p class=\"no-indent\">「べつに」と彼女は言った。</p>\n    <p class=\"no-indent\">「べつにではないでしょ」</p>\n    <p class=\"no-indent\">「うん」</p>\n    <p>しばらく沈黙が続いた。カーテンの隙間から差し込む光が、空き缶の縁で反射してちかちかしていた。スター先輩は天井を見続けていた。</p>\n    <p class=\"no-indent\">「あのさ」と彼女は言った。</p>\n    <p class=\"no-indent\">「なに」</p>\n    <p class=\"no-indent\">「最近、泣けないんだよね」</p>\n    <p>私は何も言わなかった。</p>\n    <p class=\"no-indent\">「それに夜中に目が覚めると、誰かに胸を掴まれてるみたいな感じがするんだよ。朝になったら少しは楽になるけど、最近ずっとそんな感じ」</p>\n    <p class=\"no-indent\">「いつから」</p>\n    <p class=\"no-indent\">「覚えてない。気づいたら、そうなってた」</p>\n    <p>カーテンが風でわずかに揺れた。外では烏が鳴いていた。日が暮れかけてはいたが、烏が鳴くにはまだ早い時間だった。</p>\n    <p class=\"no-indent\">「バイトは、どう」と私は訊いた。</p>\n    <p class=\"no-indent\">「行ってる。なんとか」</p>\n    <p class=\"no-indent\">「学校は」</p>\n    <p class=\"no-indent\">「行ってる。でも、なんか違和感がすごい。窓の外見てると、自分だけゲージの中にいるみたいな気がして」</p>\n    <p>彼女は淡々と続けた。声に抑揚がなかった。感情を排して話しているのではなく、感情を運ぶエネルギーそのものが枯渇しているようだった。ごはんは一食くらい。お風呂は入れてない日もある。言葉は少なく、しかし途切れることなく出てきた。彼女はもう隠す気力すら失っていた。散らかった部屋は以前よりさらに混沌を増し、ゴミと埃と血の跡が存在の希薄さを埋めようとして、逆にその輪郭を曖昧にぼやけさせていた。カッターナイフも、咳止めも、それはすべて自らの希薄さを癒すためのものだった。痛みや虚無に触れることで、彼女は自分がここにいることを何とか確かめようとしていた。しかしその行為はどれだけ繰り返しても、彼女の中に染みついた根本的な希薄さを癒すことはできなかった。</p>\n    <p>私は壁に背中を預けて座った。スター先輩は天井を見続けていた。そのまま一時間くらい、二人はほとんど何も言わなかった。私はただそこにいた。自分がここにいて良いのかどうかを確認することすらできないまま、ただそこにいた。それは私にとって、かなり珍しいことだった。確認しないでいること、相手の感情を探らないこと、それは私にとって未知の感覚だった。しかし彼女の呼吸が部屋の中にあって、私の呼吸もそこにあるという事実が、その日、その瞬間だけは、満ち足りたものに感じた。何かをしなければならない、という焦りがなかった。ただそこに、二人分の呼吸があるということが、それだけで十分だと思えた。帰り際、スター先輩は「来てくれてありがとう」と言った。「べつに何もしてないけど」と答えると、彼女は「来てくれるだけでいい」と言った。その言葉の重さを、そのときの私は正確には受け取れていなかった。今にして思えば、彼女はあのとき、誰かに存在を確認してもらうことだけを求めていたのだと思う。言葉でも行動でもなく、ただ同じ空気の中に誰かがいるということを。</p>\n    <p>それから私は、こまめに彼女と連絡を取ったが、返信は一向に返ってこなかった。後になって話を聞くと、その頃はスマホを開いても返信を打てず、ただインスタグラムのタイムラインを何時間も流し続けていたという。生きているのか死んでいるのかもわからないまま、それでも朝は来て、制服に腕を通すしかなかったと彼女は苦しそうに答えた。それでも私は毎日、短いメッセージを送り続けた。ごはんを食べたか、今日は暑かった、公園に蝉がいたとか。返信を期待するのではなく、ただ電波の向こうに言葉を投げ込むような感覚だった。それは暗く深い海に向かって小石を投げ入れていくような感覚に近かったが、自分が投げた小石がいったいどれほど深くまで届いているのかはわからなかった。あるいは届いていないのかもしれない、と何度か思った。底に着く音がしない。波紋も見えない。それでも手を動かし続けた。それでも私は辛抱づよく送り続けた。届いているかどうかを確認する前に、送ることをやめることを強く拒んだ。それは私が初めて、相手を詮索しないまま動いていた時間だったのかもしれなかった。</p>\n    <p>彼女から連絡が来たのは、その三週間後だった。少し話せるかという短い一文で、一時間後に公園に来てほしいという内容だった。急いで向かうと、スター先輩はベンチに座っていた。膝の上に両手を重ねて、俯いていた。日が傾いていて、ベンチに長い影が落ちていた。</p>\n    <p>彼女が顔を上げると、目の周りが赤かった。泣いていたのか、あるいは眠れていないせいなのかは、わからなかった。</p>\n    <p class=\"no-indent\">「久しぶりに泣いた」と彼女は言った。</p>\n    <p class=\"no-indent\">「そう」</p>\n    <p class=\"no-indent\">「バイトの帰りにガチャガチャの前で駄々こねてる子供見てたら、なんか泣けてきて、五分くらい泣いてた」</p>\n    <p class=\"no-indent\">「よかった」</p>\n    <p class=\"no-indent\">「よかった？」</p>\n    <p class=\"no-indent\">「泣けない方が心配だったから」</p>\n    <p>スター先輩は少し笑った。それから「そういうこと言うんだ」と言って、空を見た。雲が一つだけあって、西の方へゆっくりと流れていた。</p>\n    <p class=\"no-indent\">「あの人、見かけたよ」と彼女は言った。</p>\n    <p class=\"no-indent\">「いつ？」</p>\n    <p class=\"no-indent\">「一昨日」</p>\n    <p class=\"no-indent\">「なんか言われた？」</p>\n    <p class=\"no-indent\">「やっぱり、やり直したいって。また最初から、ちゃんとしたいって」</p>\n    <p>私は何も言わなかった。</p>\n    <p class=\"no-indent\">「だからさ、一回聞いてみたんだよ。私のこと好きなの、って。なんていったと思う？」</p>\n    <p class=\"no-indent\">「わからない」</p>\n    <p class=\"no-indent\">「好きなんじゃなくて、必要としているって」</p>\n    <p>雲がゆっくりと形を崩していった。スター先輩は膝の上の手を見ていた。指先がゆっくりと何かを数えるように動いていた。</p>\n    <p class=\"no-indent\">「好き、じゃないんだ」</p>\n    <p class=\"no-indent\">「必要としているだけ、らしいよ」</p>\n    <p>私はその言葉についてしばらく考えを巡らせた。好きという言葉には、少なくとも相手に向けられた眼差しが含まれている。しかし必要としているという言葉には、相手を道具にする眼差ししか含まれていない。その差は小さいようで、決定的なものなのではないだろうか。そしてそのとき初めて、私は自分に問いかけた。私はどちらなのだろう、と。毎日メッセージを送り続けていたのは、スター先輩のためだったのか。それとも届けることで、自分がここにいるという手応えを確かめていたのか。答えは出なかった。出す前に、考えるのをやめた。考えることが、怖かったのだ。</p>\n    <p>公園の夕暮れが、少しずつ青くなっていった。</p>\n    <p class=\"no-indent\">「どうするの」と私は訊いた。</p>\n    <p class=\"no-indent\">「まだわかんない」と彼女は答えた。「でも、もう少しだけ考える」</p>\n    <p>けれど、それからスター先輩はリストカットとODを繰り返し、その結果、救急車で搬送された。</p>\n    <p>彼女の搬送の知らせを受けたとき、私は学校の廊下を歩いていた。バイブレーションで画面を見ると、共通の知り合いからメッセージが届いていた。「スター先輩が病院に搬送されたらしい。知ってた？」</p>\n    <p>それだけだった。廊下の蛍光灯が、ひどく白く見えた。私はその場でしばらく動けなかった。廊下は昼休みの喧騒で溢れていたが、その喧騒が一瞬にして遠のいていった。急いで病院の名前を確認して、学校を出た。病院に着くと、処置が終わって個室に移った彼女が点滴の針を刺した腕をシーツの上に置いて、天井を見ていた。点滴の管は透明で、そこを流れる液体も無色で、すべてが死んだように静かだった。</p>\n    <p class=\"no-indent\">「大丈夫？」と私は言った。</p>\n    <p class=\"no-indent\">「なんで来たの」と彼女は言った。</p>\n    <p class=\"no-indent\">「心配したからだよ」</p>\n    <p class=\"no-indent\">「心配しなくていいのに」</p>\n    <p class=\"no-indent\">「しなくていいかどうかは、こっちが決めるから」</p>\n    <p>スター先輩は少しの間黙った。それから「ごめん」と言った。</p>\n    <p class=\"no-indent\">「謝らなくていいよ」</p>\n    <p class=\"no-indent\">「でも、心配させた」</p>\n    <p class=\"no-indent\">「させていいよ。させてくれないと、そばにいられない」</p>\n    <p>病院の廊下を看護師が歩く足音がして、消毒液の匂いが漂った。どこかで機械が規則的な音を立てていた。スター先輩は点滴の管をじっと見ていた。</p>\n    <p class=\"no-indent\">「怖かった」と彼女は言った。</p>\n    <p class=\"no-indent\">「何が」</p>\n    <p class=\"no-indent\">「今日は、量が多かったから。そしたら呼吸がおかしくなって。それで初めて、あ、死ぬかもって思った」</p>\n    <p class=\"no-indent\">「そう……」</p>\n    <p class=\"no-indent\">「死にたいわけじゃないのに、死ぬかもって思った」</p>\n    <p class=\"no-indent\">「うん」</p>\n    <p class=\"no-indent\">「怖かった」</p>\n    <p class=\"no-indent\">「そりゃ怖いよ」と私は言った。「怖くて当たり前だよ」</p>\n    <p>スター先輩はそれに対して何も言わなかった。ただ、少しだけ肩の力が抜けた気がした。</p>\n    <p class=\"no-indent\">「自分で呼んだの？　救急車」</p>\n    <p class=\"no-indent\">「うん」</p>\n    <p class=\"no-indent\">「よかった」</p>\n    <p class=\"no-indent\">「……そう？」</p>\n    <p>沈黙があった。長い沈黙だった。私はパイプ椅子を引いて座り、スター先輩は天井を見ていた。廊下から、足音がして、遠ざかった。</p>\n    <p class=\"no-indent\">「楽になりたかった」と彼女は言った。「消えたかったわけじゃないんだけど、楽になる感覚が欲しかった」</p>\n    <p class=\"no-indent\">「うん」</p>\n    <p class=\"no-indent\">「それって、変？」</p>\n    <p>スター先輩の濡れた瞳がこちらを見ていた。私は一度、息を吐いた。</p>\n    <p class=\"no-indent\">「変じゃない、と思う」</p>\n    <p class=\"no-indent\">「でも、よくないことはわかってる」</p>\n    <p class=\"no-indent\">「うん」</p>\n    <p class=\"no-indent\">「じゃあ、なんでって聞かれたら、答えられない。なんでかわかんないけど、やっちゃうんだよ。気づいたらやっちゃってる」</p>\n    <p>私はそれに対して何も言えなかった。正直に言えば、何も言うことがなかった。わかる、とは言えなかった。大丈夫、とも言えなかった。かと言ってやめてほしい、とは言いたくなかった。やめてほしいと言えば、彼女は傷つくかもしれない。あるいはやめてほしいと言える立場に、私はいないのかもしれない。どちらであっても、私は声をかけることを恐れた。</p>\n    <p class=\"no-indent\">「ねえ」と彼女は言った。</p>\n    <p class=\"no-indent\">「なに」</p>\n    <p class=\"no-indent\">「なんで、来てくれるの」</p>\n    <p>顔を上げた。私は少し考えた。</p>\n    <p class=\"no-indent\">「そばにいたいから」</p>\n    <p class=\"no-indent\">「なんで」</p>\n    <p class=\"no-indent\">「好きだから」</p>\n    <p>スター先輩は黙った。しばらくそのまま黙っていた。点滴の袋が、ゆっくりと満ちていた。</p>\n    <p class=\"no-indent\">「……好き、の意味が違くない？」とやがて言った。</p>\n    <p class=\"no-indent\">「違わないよ」</p>\n    <p class=\"no-indent\">「でも、そういうんじゃないでしょ」</p>\n    <p class=\"no-indent\">「そういうのも含まれてるかもしれないけど、それだけじゃないって言いたかっただけ」</p>\n    <p class=\"no-indent\">「……よくわかんない」</p>\n    <p class=\"no-indent\">「自分もよくわかんない」</p>\n    <p>スター先輩は少し笑った。声にならない、口の端だけが動く笑い方だった。</p>\n    <p class=\"no-indent\">「正直だね」</p>\n    <p class=\"no-indent\">「かもね」</p>\n    <p class=\"no-indent\">「……ありがとう」</p>\n    <p>その言葉は、以前の「ありがとう」とは少し違う響きがあった。</p>\n    <p class=\"no-indent\">「いてもいい？」</p>\n    <p class=\"no-indent\">「えっ？」</p>\n    <p class=\"no-indent\">「しばらく、ここにいてもいい？　帰れって言われるまで」</p>\n    <p>スター先輩は私を見た。何かを測るような目だった。病院のベッドの白さと、点滴の透明さの中で、彼女の目だけが色を持っていた。それから少しだけ目を細めて、「好きにして」と言った。私はベットの脇まで、パイプ椅子を引いた。スター先輩はまた天井を向いた。それから一時間ほど、どちらも何も言わなかった。病院の時間は、外の時間よりゆっくり流れるような気がした。相手の感情や顔色を窺わないまま、私はただそこにいた。それは思いのほか、疲れなかった。その瞬間だけは、沈黙が然るべき重さを持たなかった。</p>\n    <p>スター先輩の両親が病院に現れたのは、搬送から三時間ほど経ってからだった。</p>\n    <p>父親は仕事を途中で切り上げてきたようで、ネクタイが少しゆるんでいた。母親はわずかに化粧が薄かった。急いで来たのか、あるいは元々薄かったのかはわからなかった。二人とも廊下でしばらく立ったまま、医師の説明を聞いていた。父親は腕を組んでいた。母親は小さなバッグの持ち手を両手で握りしめていた。私は個室の外のソファに座って、その様子を離れたところからじっと見ていた。父親が先に個室に入り、数分後に出てきた。廊下に出た瞬間、天井を一度見上げてから、何かを堪えるように口を一文字に結んだ。母親が入り、少し長く中にいた。廊下に出てくると、目が赤かった。</p>\n    <p>その後両親は医師と話し合い、スター先輩はカウンセリングを受けることになった。本人がどこまで了承したのかは聞いていなかったが、スター先輩は翌週から予約の入った曜日の放課後にクリニックへ行くようになった。カウンセリングがどんな内容だったか、スター先輩はほとんど話さなかった。「普通だよ」「なんか色々と話した」「まあ悪くはないね」という程度の言葉しか返ってこなかった。</p>\n    <p>ただ一度だけ、こんなことを言った。</p>\n    <p class=\"no-indent\">「先生に、自分のことどう思うかって聞かれてさ」</p>\n    <p class=\"no-indent\">「うん」</p>\n    <p class=\"no-indent\">「答えられなかった。どう思うってことが、よくわからなくて」</p>\n    <p class=\"no-indent\">「自分のことが嫌いとか、好きとか、そういうことじゃないの？」</p>\n    <p class=\"no-indent\">「そういう感じなんだと思うんだけど、嫌いとか好きとかじゃなくて、その、なんていうか……どっちでもよくないかな、って」</p>\n    <p>私はその言葉をすぐには飲み込めなかった。</p>\n    <p class=\"no-indent\">「どっちでもいい？」</p>\n    <p class=\"no-indent\">「うん。いや、自分のこと嫌いじゃないんだよ。ただ、なんか別にいいじゃん。自分がここにいなくても世界は普通に回るわけだし」</p>\n    <p>それは消えたいというよりも、もっと静かで、根源的な言葉だった。彼女の中で根源的に染みついた、存在の希薄さそのもの。どんな関係も、どんな痛みも、それを癒すことはできなかった。私は何も言わなかった。言えなかった、というよりも、言う前に何かが固まってしまった。彼女のここにいなくてもいいという言葉と、私の中にある何かが、静かに共鳴しているような気がした。私もまた自分がそこにいていいかどうかを、これまでずっと確認し続けてきたのではないか。確認しないまま感情を出すことを、ずっと怖れてきたのではないか。彼女の希薄さと、私の希薄さは形が違ったが同じ場所に根を持っているのではないか。しかし私はそれを言葉にはしなかった。言葉にすることで、私たちの関係が変容することを私は強く恐れていた。変容した先に何があるかを確かめることよりも、今ここにある形を保ち続けることの方が、そのときの私にはずっと大切だった。</p>\n  </div>\n\n  <div class=\"section\" id=\"ch6\">\n    <h2 class=\"section-title\">第六話：夏、だね</h2>\n    <p>スター先輩の退院後、私は以前よりも頻繁に部屋を訪ねた。呼ばれるときもあったが、呼ばれなくても行くことが増えた。「暇？」と先に送るのが、今度は私の役目になった。スター先輩は「来ていいよ」とも「来なくていい」とも言わなかった。ただ「ん」だけ返信が来て、行くと鍵が開いていた。彼女は私を拒まなかったし、積極的に呼ぶことも少なくなっていた。ただ、そこにいることを許容していた。それが彼女にとってまた一つの枷になっていたことを、私はあとになって理解した。私を必要とするという行為自体が、彼女の存在をわずかに固定する手段になっていたのだ。そして同時に私もまた、そこに行くことで自分の存在をわずかに固定しているようだった。彼女の部屋の混沌の中で、相手を詮索せずに呼吸できる時間を私は確かに必要としていた。しかしそれが元彼の言う「好き」と「必要としている」という言葉の差異と、何が違うのかは私にもわからなかった。</p>\n    <p>ある日の午後、私はスター先輩の散らかった部屋で学校の課題を片付けていた。床に散乱した雑誌や、あちこちに脱ぎ捨てられた服の隙間でノートを広げていると、ベッドの隅に丸まっていた彼女が、天井を見上げたままぼそっと呟いた。</p>\n    <p class=\"no-indent\">「カップ麺食べたい」</p>\n    <p>顔を上げて、私は彼女の横顔を見た。</p>\n    <p class=\"no-indent\">「……買ってこよっか？」</p>\n    <p>シャープペンシルを置いて立ち上がろうとすると、彼女は「待って」と遮った。</p>\n    <p class=\"no-indent\">「どうせなら、外で食べよう」</p>\n    <p>それは、珍しい提案だった。彼女が自らあの薄暗い部屋の外へ出たがることは、滅多になかったからだ。</p>\n    <p>近所のコンビニへ向かう道中、彼女はどこか上の空だった。店内の棚から、彼女は醤油味を、私は塩味のカップ麺を一つずつ選んだ。レジ横の給湯器で内側の線までお湯を入れ、プラスチックの蓋の上に木箸を載せて、茶色いレジ袋に収めた。店を出ると、外の空気はすでに夕方のどこかはかない匂いをしていた。スター先輩は季節外れの長袖の袖口をきゅっと握ったまま、私の二歩後ろを少し遅れてついてきた。河川敷までは徒歩で十五分ほど。西日の差し込む住宅街を、私たちは並んで歩いた。彼女は何も話さなかった。ただ、首元に巻き付けられている首輪が、傾いた夕日を受けて微かに鈍い光を放っているだけだった。アスファルトの継ぎ目を等間隔に照らすオレンジ色の光が、私たちの影を細長く、どこまでも頼りなく伸ばしていった。</p>\n    <p>護岸はコンクリートで固められた無機質な階段状になっていた。私たちは一段降りた水面に近い平らな場所に持参したレジャーシートを広げ、並んで腰を下ろした。川幅はそれほど広くなく、対岸には背の低い古いビルや住宅がどこまでも続いていた。寄せては返す水の音は静かで、遠くの幹線道路を走る車の音がまるで薄い膜の向こう側から響くように、低くブーンと唸っていた。スター先輩は膝を抱えると、カップ麺の蓋の端を爪の先で少しだけ持ち上げた。隙間から、白く熱い湯気が一筋、彼女の顔をかすめて立ち上った。それを彼女は瞬きもせずにじっと見つめていた。</p>\n    <p class=\"no-indent\">「カップ麺ってさ、三分待つじゃん」</p>\n    <p class=\"no-indent\">「そうだね」</p>\n    <p class=\"no-indent\">「あの三分間、なんか好きなんだよね」</p>\n    <p class=\"no-indent\">「そう？　退屈じゃない？」</p>\n    <p>私が聞き返すと、彼女は視線を湯気に固定したまま、小さく息を吐いた。</p>\n    <p class=\"no-indent\">「決まってるから。三分待てば、誰が作ってもちゃんと温かくて、美味しいものが食べられるじゃん。それ以上でも以下でもなく、ちょうど三分。裏切られないっていうかさ……保証されてるっていうかさ」</p>\n    <p>私はその言葉を咀嚼しながら、自分のカップ麺の蓋を半分だけ剥がした。勢いよく立ち上る塩スープの香気が、川上の方から遮るものなくやってきた風によって、遠くの方まで運ばれた。</p>\n    <p class=\"no-indent\">「日常のほとんどはそうじゃないからそう思うわけ？」</p>\n    <p class=\"no-indent\">「うん」</p>\n    <p>彼女は短く、突き放すように言った。それ以上は何も語りたがらない性質だと知っていたから、私も追及はしなかった。私たちはそこで同時に蓋を完全に剥がし、割り箸で縮れた麺をほぐした。ずるずると麺をすする音と、規則正しい川のせせらぎだけが、しばらくの間、私たちのまわりを支配した。対岸の建物にぽつり、ぽつりと黄色い明かりが灯り始めていた。空の端はまだ燃えるような橙色を残しているのにその上空からは深い藍色が、音もなく静かに降りてきていた。ひとしきり麺を啜り、スープまで飲み干すと、彼女は空になった容器を膝の上に置き、再び川を見つめた。</p>\n    <p class=\"no-indent\">「美味しかった」</p>\n    <p>消え入りそうな声での、小さな呟き。その瞬間、川風が少しだけ強さを増した。それは一日の終わりを告げるような、どこか寂しくてやわらかい風だった。風に煽られて彼女の黒い前髪が揺れ、露わになった首元の細い首輪がかすかに浮き上がってまた鎖骨へと落ちた。「美味しかった」という彼女の言葉だけが、まるで実体を持つかのようにしばらく川の音の中にぽつんと浮かんでいた。私が食べ終わったカップ麺をレジ袋にまとめ終えると、スター先輩は「もう少しいる」と言って、そのままシートの上に仰向けに寝転がった。私は少しだけ躊躇ってから、彼女に倣って隣に背中をつけた。ビニールシート越しに、昼間の熱を失ったコンクリートの冷たい感触が、じわじわと背中から骨へと染み込んできた。空が刻一刻と暗くなるにつれて、頭上には星が出始めた。都会の濁った夜空には似つかわしくない、刺すようなはっきりとした光が、いくつか。</p>\n    <p class=\"no-indent\">「星、少ないね」</p>\n    <p>彼女が夜空に手を伸ばすようにして言った。</p>\n    <p class=\"no-indent\">「都会だからね。ネオンが明るいんだよ」</p>\n    <p class=\"no-indent\">「でも」</p>\n    <p>彼女は伸ばした右手の人差し指を曲げ、自分の右のこめかみを、トントンと軽く叩いた。</p>\n    <p class=\"no-indent\">「星は、ここにあるよ」</p>\n    <p>私はたまらず、彼女の横顔を盗み見た。首元の革の輪が闇に溶けかけながらも、ひっそりとそこにあった。彼女の濡れたように黒い瞳が、上空にある数少ない星の光を、そのまま一粒ずつ綺麗に映し出していた。川の流れる音、遠くを走る車の地鳴り、草むらのどこかで鳴いている秋の虫の声。そういった世界のノイズがゆっくりと重なり合って、私たちの間に流れる沈黙を優しく埋めていた。いつの間にか、シートの上で、私たちの手の間隔が少しだけ縮まっていた。指を絡めるわけでも、手のひらを重ねるわけでもない。ただ互いの小指の側面が、触れているのか、触れていないのか、その境界線が曖昧になるほどの距離だった。それが果たして世界の傾きでそうなったのか、あるいはどちらかが意図してそうなったたのかは私にも分からなかったが、心臓の音だけがやけにうるさかった。そうやって私たちがぼうっとしていると、少し離れた土手の上から、カシャカシャと砂利を踏む音と短い犬の鳴き声が聞こえた。見上げると中型犬を連れた人影が夜の土手を散歩させていた。犬は飼い主の少し前を弾むような足取りで嬉しそうに進みながら、時折立ち止まっては振り返り、ちぎれんばかりに尻尾を振っていた。スター先輩の視線は、その犬の動きをじっと目で追っていた。暗がりの中でも、彼女の表情がわずかに強張るのが分かった。彼女は犬が夜闇の向こうに去るまで、じっと動かなかった。しかし犬の姿が見えなくなると、彼女はスッと音を立てずに上体を起こし、ズボンのポケットに手を入れ、何かを引き出した。 かちり、と金属の擦れる冷たい音がした。</p>\n    <p class=\"no-indent\">「……それ、持ってきてたの？」</p>\n    <p class=\"no-indent\">「うん」</p>\n    <p>彼女が手に持っていたのは「とと」の形見でもある細いリードだった。彼女はリードを手にすると、先端にあるスナップフックを、自分の首元の革の輪に近づけたり遠ざけたりしながら、手の中で転がしていた。そして二分ほど経ってから、やがて意を決したようにこちらを振り向いた。</p>\n    <p class=\"no-indent\">「ねえ──」</p>\n    <p class=\"no-indent\">「ん？」</p>\n    <p class=\"no-indent\">「……もし、私が犬だったら、私のこと飼ってくれる？」</p>\n    <p>声のトーンは、驚くほど平坦だった。それは冗談だよと笑い飛ばすことも、本気だから受け止めてと縋ることも、どちらも選べるように、あらかじめ用意された意地悪な問いかけだった。けれど、暗闇の中で私を捉えた彼女の目は、微塵も笑っていなかった。むしろ果てしない虚無で満たされていた。</p>\n    <p class=\"no-indent\">「どういうこと？」</p>\n    <p class=\"no-indent\">「そのままの意味。犬になったら、飼ってくれる？」</p>\n    <p>限りなく透明で、どこまでも澄み切った瞳だった。私はそのあまりの真剣さに、思わず目を逸らしてしまった。</p>\n    <p class=\"no-indent\">「毎日、散歩してくれる？」</p>\n    <p class=\"no-indent\">「散歩って……」</p>\n    <p>私は乾いた笑いを浮かべ、冗談の枠にその言葉を押し込めようと誤魔化した。しかし彼女は一切笑わなかった。</p>\n    <p class=\"no-indent\">「ごめん、無理だよね。わかってる」</p>\n    <p>彼女は自嘲気味に呟くと、手にしたリードを自分の手の甲にくるくると巻きつけ、強く握りしめた。</p>\n    <p class=\"no-indent\">「変なこと言って、ごめん」</p>\n    <p>彼女はただ拒絶されたことを瞬時に悟ったような目で、私の顔をじっと見つめていた。川の音が遮るものなく、大きく鼓膜に響いた。</p>\n    <p class=\"no-indent\">「──夏、だね」</p>\n    <p>唐突なその言葉に、私が何か返そうと口を開きかけると、「いいよ、答えなくていい」と冷たい声でぴしゃりと遮られた。彼女はそれから五分ほど、河川敷を眺めてから、弾かれたように立ち上がり、リードをポケットの奥深くへとねじ込んだ。「帰ろ」とだけ言うと、私の返事を待たずに、彼女は空のカップをまとめた袋を私からひったくるように持つと、レジャーシートの端を掴んで手際よく畳み、さっさと土手の上へと歩き出してしまった。私はそんな彼女の姿に呆気に取られながら、どういうわけかたまらなく哀しくなった。理由は、わからない。ただ、その姿は私に夏の終わりを予感させた。もちろん、まだ夏は盛りすら迎えていなかった。しかしそれなのに、彼女が引きずる細長い影だけは、なぜか夏の気配から静かに遠ざかっていた。</p>\n    <p>今にして思えば、あの日を境に彼女は少しだけ私に弱さを見せるようになったのかもしれない。もちろん本人はそんなつもりなどなかっただろうが、結果としてあの日から、私はそれまで見ることのなかった彼女の一面に触れることになった。そのひとつが、スター先輩の傷の手当てだった。きっかけがどのようなものであったのかは、もう覚えてない。ただ、最初に申し出たときは「いい」と拒否された手当てを、二度目は拒絶されることなく、腕を差し出してきた。もちろん最初はその傷の生々しさに、言葉を失い、しばらく手が動かなかったが、何度か手当てをするうちに、いつしか処置は手慣れ、手当ての順序は回数を重ねるごとに洗練されるようになった。彼女の腕の表面を薄く走る線は、皮膚をはっきりと裂いていた。じわりと滲んだ傷は、縁に沿ってそっと滲んでいた。私はそんな傷口を指でそっとなぞりながら、救急箱から消毒液と絆創膏を取り出し、傷口を丁寧に拭き、深さを確認してから、必要ならば圧迫をした。ガーゼで傷口を押さえているあいだ、私は彼女の腕の細さをひしひしと感じていた。こんなにも細い腕が自分自身を傷つけるために使われているのだという事実が、どうしても現実のものとして受け止めきれなかった。</p>\n    <p>傷口を拭き終えると、絆創膏を取り出し、傷口の大きさに合わせて鋏で切った。適当なサイズに切ると、私は裏のシールを剥がし、空気が入ってシワにならないよう細心の注意を払いながら、手のひらの温もりとともに、絆創膏をゆっくりと傷口に貼りつけた。そして端を指の腹でなじませるようにして押さえた。たったそれだけのことだった。しかしそれだけのことなのに、毎回少し時間がかかった。彼女はその間、スマホを見ていることが多かったが、時折何かを確認するみたいに傷口を覗き込んだ。その目が傷口に落ちる瞬間、私は彼女の感情を読み取ることができなかった。痛みでも、後悔でもない、ある意味で、それらとはもっと途方もない距離のある目だった。「べつにほっとけば勝手に治るよ」と彼女はよく呟いたが、私はそのたびに腕を出すようにと強く諭した。「治るかどうかの話じゃないから」と一度だけ言うと、彼女は「じゃあ、何の話？」と聞いた。私は答えられなかった。もちろん自分が絆創膏を貼ったからといって、彼女の傷跡が完全に消えるわけではなかった。しかしそれでも彼女の自傷をただ黙って見過ごすわけにはいかなかった。そもそも私には黙って見過ごすような度胸はないし、もしそんなことをすれば、それこそ自分にとって何かとても大切なものが崩れるような気がした。だから私は、彼女が自傷したときはなるべく手当てをするようにしたし、それがたとえ利己的な判断によるものだったとしても、処置をする手を止めなかった。しかしどれだけ丁寧に手当てをしたところで、それは結局、できてしまった傷の後始末に過ぎなかった。彼女の根本的な希薄さを癒すことにはつながらなかった。そして何度目かの手当てをしたとき、私は処置をしながらふと気づいてしまった。彼女が自傷をしているという事実に、自分が全く驚いていないことに。最初に血のついたカッターナイフを見たとき、私は咄嗟に目を逸らした。あの感覚が私の中にはもうなくなっていた。傷口を見ても、手が震えなかった。どれほど彼女が自分を傷つけても、私はただ淡々と消毒をして、絆創膏を貼っていた。それだけの出来事を、私の体は作業として受け入れようとしていた。それは一般には慣れと呼ばれるものだったが、私は彼女の自傷に自分自身が慣れているという事実に、ひどく困惑した。何故なら、それはとても慣れてはいけないものだったからだった。</p>\n    <p class=\"no-indent\">「また深くなってる」と私は言った。</p>\n    <p class=\"no-indent\">「そう？」と彼女は言った。</p>\n    <p class=\"no-indent\">「気をつけて切ってるよ、一応」</p>\n    <p class=\"no-indent\">「気をつけてるなら、切らないでよ」</p>\n    <p class=\"no-indent\">「それはむり」</p>\n    <p class=\"no-indent\">「どうして？」</p>\n    <p class=\"no-indent\">「だから言ったでしょ？　気づいたときには、もう切ってるの」</p>\n    <p>彼女は視線をスマホに戻した。画面の光が彼女の顔を青白く照らしていた。それが冗談なのか、本気なのかはわからなかったが、何も言わなかった。正確には言えなかった、という方が正しいかもしれない。気づいたときにはという言葉には、意思の介在しない何かがあった。そしてそれに対して私に言葉を差し込む余地など残されていなかった。彼女は傷の手当てを受けたまま、コンビニ飯を広げて、テレビを見ていた。チャーハンの容器から箸で米を掬いながら、画面の向こうのバラエティ番組の笑い声に、表情ひとつ変えなかった。きっと彼女は今日も明日も絆創膏を貼った左腕を長袖で隠して、学校へと行くのだ。ODをし、体が重く吐き気があっても、彼女は制服に腕を通して、何の気なしに外へ出るのだ。彼女はかつて慣れると気にならないと言った。それはいつもの口癖のはずだった。しかしその口癖こそが、彼女の痛みや苦しみをすべて肯定してしまっているのではないか。彼女の生き方を、そこからの逃避の仕方を、肯定してしまっているのではないか。私にはそう思わずにはいられなかった。そして私という存在もまた、その慣れたら気にならないという感覚に紛れもなく慣れつつあった。異常を、日常として扱うことに段々と慣れてしまった。それがいつから始まったのかは、私にもよくわからない。しかし気づいたら、そうなっていた。絆創膏の端を押さえながら、私は自分の指先を見た。かつて震えていたはずのこの手が、今は何の迷いもなく動いている。そうやって人はあらゆるものに慣れていき、感覚を麻痺させていくのではないだろうか。そしてすべての感覚を麻痺させた先に死というものが待ち受けているのではないのだろうか。私はその事実に唖然とするとともに、それでも絆創膏を貼る手を止めることができなかった。</p>\n    <p>それからの一週間、大きな変化はなかった。スター先輩は学校へ行き、私は放課後になると彼女の部屋を訪れた。傷の手当てをして、コンビニ飯を食べて、テレビを眺める。そんな代わり映えのしない時間が繰り返された。傷は少しずつだが薄くなり、そのぶん私の驚きも少しずつ薄くなっていった。あの夜に感じた恐怖も危機感も消えたわけではない。ただ、それらは日常の目に見えない場所へと沈み込んでいただけだった。だからこそ、スター先輩から珍しく声をかけてきたとき、私はびっくりして思わず顔を上げた。</p>\n    <p class=\"no-indent\">「ねえ、プール行きたい」</p>\n    <p>唐突に部屋の静寂を破ったその一言に、私は一瞬、絆創膏を握る手を止めた。驚きを隠せないまま、けれどいつものルーティンを崩さないように、私は彼女の左腕をそっと自分のほうへと引き寄せた。触れれば折れてしまいそうなほど、白く細い手首。それを壊れ物を扱うように持ち上げると、そこに刻まれた幾筋もの紅い線は、いつもよりあきらかに赤みが引いていた。浅い、と思った。刃の侵入は前回に比べて驚くほど躊躇いがちだった。それが彼女の心境の変化によるものなのか、それとも、ただの気まぐれなのかは私にもわからなかった。</p>\n    <p class=\"no-indent\">「体調は、大丈夫なの？」</p>\n    <p>私が傷口に顔を覗かせながら呟くと、彼女はいたずらが成功した子供のように、ふっと口元を綻ばせた。</p>\n    <p class=\"no-indent\">「うん。今日は気分がいいんだよ」</p>\n    <p>そう言って微笑む彼女の瞳は、けれど次の瞬間には、私を通り過ぎてどこか遠くの、果てしない場所を見つめていた。</p>\n    <p class=\"no-indent\">「夏の匂い、嗅ぎたいな」</p>\n    <p>ぽつりとこぼれた言葉と同時に、彼女の細い指先が、その首元へと伸びる。 肌にぴったりと吸い付くように巻きつけられた首輪から留め具の金属が「かち、かち」と小さく乾いた音を立てた。静かな部屋に響くその硬質な音は、まるで彼女をこの世界に繋ぎ止める鎖の音のようだった。</p>\n    <p>近場にあるプールへと足を運んだのは、その一時間後だった。ガタゴトと規則正しい音を立てて揺れる車内で、彼女は珍しくせわしなく動いていた。 普段なら、隣に座る私の気配すら遮断するように、ただ一点を見つめて凍りついたように動かない。それなのに今日の彼女の視線は、驚くほど多くのものを捉えていた。窓の外を流れる、青々とした夏の空とむくむくと湧き上がる入道雲を見上げたかと思えば、車内に吊るされた週刊誌の刺激的な見出しや、旅行会社の派手な中吊り広告のひまわり畑をじっと眺めたりしている。ガタン、と大きく電車が揺れた拍子には、彼女の視線は私の手元へと落ち、それからまたすぐに窓の外へと戻っていった。その一連の動作があまりにも自然で、私の胸はどきりとした。彼女の意識が、彼女自身の深い内側にある暗闇ではなく、外の開かれた世界に向いている。エアコンの冷気が微かに届く車内で、窓越しに受ける太陽の眩しさに、彼女が小さく目を細める。首筋には窓際の熱を孕んだ小さな汗の粒が滲んでいる。結んだ唇が何かを呟こうとするかのように、わずかに、本当にわずかに震える。そのごく当たり前にある何気ない仕草が、私はどういうわけか無性に嬉しかった。</p>\n    <p>二十分ほど経つと、電車が速度を落とし、目的の駅のホームへと滑り込んだ。 ドアが開いた瞬間に流れ込んできたのは、冷房の効いた車内を瞬時に塗り替えるような、熱を含んだ重い空気だった。改札を抜け、照り返しの激しいアスファルトへ一歩を踏み出すと、まるでフライパンの上に放り出されたかのような熱波に思わず眩暈がしそうだった。二人で並んで歩き出すと、すぐにシャツの背中やうなじに、じっとりと汗が滲み始める。会話はなかった。ただ、アスファルトを蹴る私たちのスニーカーの乾いた音と、時折すれ違う車のはためき、そして遠くで狂ったように鳴き続ける蝉の声だけが、重苦しい熱気の中に溶けていった。私たちは時折、ハンカチで汗を拭いながら、傾斜のきつい坂道を一歩一歩、足元を確かめるように登った。額から流れ落ちる汗が目に入りそうになり、何度も瞬きを繰り返す。ようやく坂を登りきると、視界が開けた。錆びついた高いフェンスの向こうから、すでにたくさんの人々の弾けるような気配と、それらを包み込むような、きらきらと乱反射するまばゆい水面の光が目に飛び込んできた。</p>\n    <p class=\"no-indent\">「じゃあ、先着替えてるよ」</p>\n    <p>先に入場券を買った私は更衣室の暖簾の前で、財布からお金を出すのに手こずるスター先輩にそう言って別れた。一歩足を踏み入れた更衣室は、外の炎天下とはまた違う、湿った床のひんやりとした感触と、塩素の混じった気怠い熱気に包まれていた。スチールロッカーが並ぶだけの無機質な空間には、誰かが落とした水滴が点々と床を濡らしている。私はテキパキと着替えを済ませ、Tシャツと水着姿になると、外へとつながる重いプラスチック製の扉を颯爽と両手で押し開けた。</p>\n    <p>プールサイドへ足を踏み入れると、網膜を焼きにくるような強烈な光の束と、容赦のない熱を孕んだコンクリートの感触が、ビーチサンダルの薄い底面を突き抜けて足の裏にダイレクトに伝わってきた。鼻腔を突く特有の漂白剤の匂いと、誰かがこぼした日焼け止めのココナッツのような甘い香り。あちこちから沸き起こる子供たちの黄色い歓声や水飛沫、それらを切り裂くように力強く水を蹴る激しい音が、熱風に乗って鼓膜を震わせる。夏のあらゆる瑞々しく暴力的な要素が一斉に押し寄せてきて、一瞬立ち眩みがしそうだった。壁際に立ち、まだ冷えていない自販機のスポーツドリンクを口に含みながら、女子更衣室の出口をじっと見つめた。結露した缶から滴る水滴が、私の指を伝って足元に落ちていく。その数十秒が、ひどく長く感じられた。</p>\n    <p>先ほどと同じ重い扉が躊躇するようにゆっくりと開いたのはその五分後だった。出てきたスター先輩はやはり頑ななまでに黒い長袖のラッシュガードを着込んでいた。カラフルな水着や浮き輪がひしめくぎらぎらとした波の中で、その色彩を拒絶するような黒いシルエットは、どこか異質で、けれど不思議と綺麗に見えた。彼女はこちらに気づくと歩み寄り、シャワーで濡れた前髪をかき上げ、眩しそうに腕を伸ばした。するとその瞬間、ラッシュガードの袖の端から、光に透けるような白い左腕がわずかに覗いた。そこには真新しい傷ではなく、すでに過去のものとなりつつある白い傷の跡が、まるで繊細なレースの模様のようにうっすらと見えた。 ぎらぎらとした強烈な日差しが、彼女の肌を執拗なまでに容赦なく照らし出す。その眩暈がするような光の渦の中で、彼女の右こめかみにある星型のほくろだけが、いつも以上にひときわ鮮明に、彼女というかけがえのない存在を強く主張しているように見えた。</p>\n    <p>私たちは、家族連れや騒がしい学生グループから距離を置くように、敷地の端の方にある比較的ひとの少ない芝生エリアにビニールシートを広げた。 荷物を置くと、スター先輩が周囲を警戒するように顎を少し引き、「首輪、付ける」と小声で言った。 彼女はバッグの奥から、ととの形見である首輪を取り出した。周囲の目をさして気にする様子もなく、まるで毎朝のルーティンであるかのような手慣れた動作で、それを自分の細い首へと巻きつけると、 かちり、と硬質なバックルが噛み合う音がした。 その冷たい金属音がプールの騒々しい喧騒の中で妙に鮮明に響いた気がして、私は心臓を跳ね上げながら思わず周囲を見回してしまった。けれど誰もこちらを見てはいなかった。容赦なく降り注ぐ夏の日差しの下で、人々は自分たちの眩しい楽しみに夢中で、他人の首元に巻かれた異物など気にする余裕はなかった。</p>\n    <p>それから私たちはしばらくの間、並んでシートに座り、ただゆらゆらと揺れる青い水を眺めていた。じりじりと肌を焼く熱気が、二人の間にじっとりとした沈黙を溜めていく。 しかし五分もすると、容赦のない日差しに耐えかねたのか、衣服が擦れる微かな音とともに、彼女は「入る」とだけ言い、音もなく立ち上がった。彼女ははじめは浅瀬で、躊躇うように足首だけを冷たい水に浸けていた。しかしやがてその刺激に慣れると、一歩、また一歩と深い方へ進み、腰まで、そしてついには鎖骨のあたりまで深く身を沈めていった。 黒いラッシュガードがたっぷりと水を吸い、重く彼女の身体のラインにまとわりついているのが見て取れた。それでも彼女はまったく構う様子もなく、何かに吸い寄せられるように少しずつ深いところへと移動していった。やがて彼女は静かに水面へ身体を横たえた。仰向けに身体を横たえた彼女の動きに合わせて、プールの底に描かれた青いラインが、ゆらゆらと不規則に歪み、その境界線を曖昧にしていく。真昼の太陽が激しく波立つ水面で乱反射して、私の視界を真っ白に染め上げていった。水の上に漂う彼女の濡れて重くなった黒髪は羽のように広がり、艶やかに光っている。ゆらめく髪の隙間から見える、右こめかみの星のほくろだけが、まるで水底で瞬くひとつの星座のようにちらちらと覗いた。ととの首輪はたっぷりと水を吸ってさらに深い漆黒へと色を変え、彼女の白い喉の皮膚に対して、鮮烈で、どこか不穏なコントラストを描いていた。両耳まで完全に水に浸かり、世界の音を遮断するように細く目をあけて、彼女はただどこまでも高い空を見上げていた。水の中に入れば、周囲の音は一瞬で遠ざかる。子供たちの弾けるような嬌声も、監視員の鳴らす甲高い笛の音も、すべては水面の向こう側へと押しやられ、心臓の鼓動に似たくぐもった雑音へと変わる。彼女は今、その絶対的な静けさの中に浮かび、世界の重力から解き放たれていた。私はプールの縁にそっと腰をかけて、水と同化していくようなその横顔を、胸の奥の微かな痛みを堪えながら眺めていた。手を伸ばせば届く距離なのに、彼女だけがどこか別の宇宙の彼方へといってしまったかのような、寂しさが指先をかすめる。</p>\n    <p>彼女がゆっくりと身体を垂直に戻したのは、その五分後だった。水面から突き出た彼女は顔にかかった前髪を両手で払いながら、いかにも清々しそうな、どこか幼い表情を浮かべていて、ぽつりと小さな声を漏らした。</p>\n    <p class=\"no-indent\">「……死ぬのってこういう感じなのかな」</p>\n    <p>水面に浮かんだまま彼女がぽつりと言った。 そのあまりにも無防備で、生々しい言葉が鼓膜に触れた瞬間、私の心臓はドクリと激しく跳ね上がった。全身の血が急激に冷えていくような錯覚。彼女がそのまま水底へ沈んで、二度と戻ってこないのではないかという根拠のない恐怖が胸を突き上げ、私は叫びそうになる声を喉の奥で押し潰し、ほとんど反射的に、プールの中へと身体を投げ出した。ドボン、と自分の身体が派手に水を割る。激しい水しぶきが天高く上がり、私たちの視界を真っ白に遮った。勢いよく飛び込んだせいで鼻と耳の奥に冷たい水が容赦なく滑り込み、それまで周囲を満たしていたすべての音が、まるで遠い世界の出来事のように一瞬で遠ざかった。息を詰まらせながら、必死に、勢いよく水面から顔を出すと、 彼女は動揺する私の前でくすくすと喉を鳴らして笑っていた。濡れて顔に張り付いた前髪の隙間から、細められた瞳がいたずらっぽく私を捉えている。いつも頑なに表情を崩さない彼女が、波に揺られながら見せたそんなあどけない笑顔は、激しい水の音を突き抜けて、私の耳の奥に驚くほどまっすぐに届いた。</p>\n    <p class=\"no-indent\">「冗談だよ。なに本気になってるの？」</p>\n    <p>彼女は笑っていた。しかしその瞳の奥はどこか虚ろで、焦点が合っていないように見えた。彼女の額を伝っていた水滴がこめかみに刻まれたほくろをなぞるようにして顎のラインへと落ちていく。楽しげな笑い声と、底の知れない目の虚ろさが、一つの顔の中に歪に同居していた。</p>\n    <p class=\"no-indent\">「冗談でも、そういうことは言わないでほしい」</p>\n    <p>私が自分自身の動揺を隠すように、耳抜きしながら言うと、彼女は私の抗議をいなすように、手のひらで目の前の水を掬った。</p>\n    <p class=\"no-indent\">「だって、こうやって浮いてると。何も考えなくていいんだよ。全部、水の中に溶けちゃうみたいに」</p>\n    <p class=\"no-indent\">「……」</p>\n    <p class=\"no-indent\">「ほら、浮いてみたら？ 一緒に溶けれるよ」</p>\n    <p class=\"no-indent\">「笑えない」と、私は引きつった声で遮った。</p>\n    <p>彼女は今度こそ、楽しそうに声を上げて笑った。その瞳の奥には、さっきまでなかった微かな光が確かに宿っていた。</p>\n    <p class=\"no-indent\">「あ、目にゴミ入ってる」</p>\n    <p>そう言うと彼女は、手のひらでパシャリと私に水をかけた。私があっけに取られていると、彼女はケラケラと笑った。私は「やったな」と、負けじと勢いよく冷たい水をかけ返した。しばらくの間私たちはそうやって年相応の子供のように夢中で水をかけ合い、やがてどちらからともなく肩で息を切らして手を止めた。すっかり冷えた身体を温めるように、私たちはビニールシートへと戻り、二人で並んで腰を下ろした。 火照った肌に受ける風が、彼女の濡れたラッシュガードを冷やしていく。私たちはすっかり生温くなったペットボトルの水を代わる代わる口にした。水を飲み終えると彼女はきゅっと膝を抱え、顎を乗せて、ぼんやりと遠くの水面を見つめていた。 原色の大きな浮き輪を引っ張り合ってはしゃいでいる、幼い子供たちの眩しい光景を、彼女はただ退屈そうに、けれどどこか愛おしそうに、静かな目で追っていた。</p>\n    <p class=\"no-indent\">「なんか今日、すごく生きてる感じがする」</p>\n    <p>セミの鳴き声にかき消されそうなほど小さな声で、彼女はぽつりとそう言った。私は何も言わなかった。正確には言うべき言葉が見つからなかった。だから私は彼女の額に触れ、濡れて束になった黒髪を指先でそっと梳いた。かつて彼女の左腕にある傷跡の上を、確かめるように指先でなぞったときと同じように、あえて言葉を挟むことはしなかった。不用意に言葉にすることで、今この瞬間に満ちている、奇跡のようにつなぎとめられた美しい時間をがらくたにしたくなかった。 彼女
