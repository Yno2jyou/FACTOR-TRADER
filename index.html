  touch-action: manipulation;
  scroll-behavior: smooth;
  overflow-x: hidden;
  width: 100%;
  max-width: 100%;
  /* モバイルブラウザの自動文字サイズ調整(フォントブースティング)を無効化。
     これが原因で、閲覧モード(複数の<p>)と編集モード(単一のcontenteditable)で
     同じfont-size指定でも実際の描画サイズがずれ、一行あたりの文字数が変わってしまう。 */
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
html, body { background: var(--bg); color: var(--fg); }

#app {
  overflow-x: hidden;
  max-width: 100%;
  width: 100%;
}

body {
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 2.0;
  letter-spacing: 0.03em;
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
  width: 100%;
  max-width: 100%;
  background:
    radial-gradient(ellipse 130% 90% at 50% -25%, #12101a 0%, transparent 55%),
    radial-gradient(ellipse 70% 50% at 90% 100%, #0e0c12 0%, transparent 50%),
    radial-gradient(ellipse 50% 40% at 5% 80%, #0c0a10 0%, transparent 45%),
    linear-gradient(180deg, #08070c 0%, #060508 45%, #050406 100%);
  background-attachment: fixed;
}

body::before, body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
}
body::before {
  opacity: 0.28;
  background-image:
    radial-gradient(1px 1px at 7% 14%, rgba(255,255,255,0.45), transparent),
    radial-gradient(1px 1px at 18% 32%, rgba(255,255,255,0.3), transparent),
    radial-gradient(1px 1px at 33% 9%, rgba(255,255,255,0.38), transparent),
    radial-gradient(1px 1px at 47% 44%, rgba(255,255,255,0.25), transparent),
    radial-gradient(1px 1px at 61% 20%, rgba(255,255,255,0.35), transparent),
    radial-gradient(1px 1px at 76% 38%, rgba(255,255,255,0.28), transparent),
    radial-gradient(1px 1px at 89% 16%, rgba(255,255,255,0.32), transparent),
    radial-gradient(1px 1px at 12% 58%, rgba(255,255,255,0.24), transparent),
    radial-gradient(1px 1px at 27% 72%, rgba(255,255,255,0.28), transparent),
    radial-gradient(1px 1px at 44% 82%, rgba(255,255,255,0.3), transparent),
    radial-gradient(1px 1px at 58% 62%, rgba(255,255,255,0.22), transparent),
    radial-gradient(1px 1px at 72% 78%, rgba(255,255,255,0.26), transparent),
    radial-gradient(1px 1px at 86% 68%, rgba(255,255,255,0.24), transparent),
    radial-gradient(1px 1px at 94% 52%, rgba(255,255,255,0.3), transparent),
    radial-gradient(1px 1px at 4% 88%, rgba(255,255,255,0.22), transparent),
    radial-gradient(1px 1px at 22% 94%, rgba(255,255,255,0.26), transparent),
    radial-gradient(1px 1px at 52% 92%, rgba(255,255,255,0.28), transparent),
    radial-gradient(1px 1px at 78% 96%, rgba(255,255,255,0.24), transparent),
    radial-gradient(1px 1px at 96% 84%, rgba(255,255,255,0.26), transparent);
  background-repeat: no-repeat; background-size: 100% 100%;
}
body::after {
  opacity: 0.2;
  background-image:
    radial-gradient(1.2px 1.2px at 14% 22%, rgba(230,220,255,0.35), transparent),
    radial-gradient(1.2px 1.2px at 62% 28%, rgba(200,210,240,0.3), transparent),
    radial-gradient(1.2px 1.2px at 38% 58%, rgba(255,255,255,0.28), transparent),
    radial-gradient(1.2px 1.2px at 82% 72%, rgba(190,200,230,0.25), transparent),
    radial-gradient(1.2px 1.2px at 9% 78%, rgba(255,255,255,0.24), transparent),
    radial-gradient(1.2px 1.2px at 48% 88%, rgba(220,225,245,0.26), transparent),
    radial-gradient(1.2px 1.2px at 74% 12%, rgba(255,255,255,0.3), transparent),
    radial-gradient(1.2px 1.2px at 28% 42%, rgba(180,190,230,0.18), transparent);
  background-repeat: no-repeat; background-size: 100% 100%;
}

.sky-star {
  position: fixed; border-radius: 50%; pointer-events: none; z-index: 0;
  background: #fff; will-change: opacity;
  animation-name: star-twinkle; animation-timing-function: ease-in-out; animation-iteration-count: infinite;
}
@keyframes star-twinkle { 0%, 100% { opacity: var(--dim, 0.12); } 50% { opacity: var(--bright, 0.65); } }

.shooting-star {
  position: fixed; top: 0; left: 0; width: 2px; height: 2px; background: #fff;
  border-radius: 50%; pointer-events: none; z-index: 2; opacity: 0;
  box-shadow: 0 0 2px 1px rgba(220, 225, 255, 0.5); will-change: transform, opacity;
}
.shooting-star::after {
  content: ""; position: absolute; top: 50%; right: 1px; width: 0; height: 1px;
  transform: translateY(-50%); transform-origin: right center;
  background: linear-gradient(to left, rgba(255,255,255,0.85) 0%, rgba(190,200,240,0.4) 45%, transparent 100%);
  border-radius: 1px;
}
.shooting-star.is-flying { animation: shoot-move 1.25s cubic-bezier(0.15, 0.6, 0.3, 1) forwards; }
.shooting-star.is-flying::after { animation: shoot-trail 1.25s cubic-bezier(0.15, 0.6, 0.3, 1) forwards; }
@keyframes shoot-move {
  0% { opacity: 0; transform: rotate(var(--angle, 35deg)) translateX(0); }
  8% { opacity: 1; } 70% { opacity: 1; }
  100% { opacity: 0; transform: rotate(var(--angle, 35deg)) translateX(var(--dist, 240px)); }
}
@keyframes shoot-trail {
  0% { width: 0; opacity: 0; } 10% { width: 48px; opacity: 1; }
  55% { width: 88px; opacity: 0.7; } 100% { width: 22px; opacity: 0; }
}

header, main, footer, nav, #app { position: relative; z-index: 1; }

a { color: var(--accent); text-decoration: none; transition: color 0.25s ease; }
a:hover { color: var(--fg); }

header {
  max-width: var(--max-width); margin: 0 auto; padding: 88px 24px 0; text-align: center;
}
.site-title {
  font-size: 22px; font-weight: 300; letter-spacing: 0.14em; margin: 0 0 14px; color: var(--fg);
  font-family: "Didot", "Bodoni MT", "Didot LT STD", "Hoefler Text", "Garamond", "Times New Roman", "Yu Mincho", serif;
}
p.site-title { font-size: 20px; font-weight: normal; }
.site-subtitle { font-family: var(--font-mono); font-size: 11px; color: var(--fg-dim); letter-spacing: 0.18em; margin: 0 0 8px; }
.site-catchcopy {
  font-size: 15px; font-weight: normal; color: var(--fg); letter-spacing: 0.1em;
  line-height: 1.9; margin: 28px 0 0; text-align: center;
}
.site-subcopy {
  font-family: var(--font-mono); font-size: 12px; color: var(--fg-dim);
  letter-spacing: 0.12em; line-height: 1.9; margin: 12px 0 0; text-align: center;
}
.header-rule { width: 48px; height: 1px; background: var(--line); margin: 16px auto 0; }

.epigraph {
  max-width: var(--max-width); margin: 48px auto 0; padding: 0 28px; text-align: center;
  font-size: 13px; color: var(--fg-dim); line-height: 2.0; letter-spacing: 0.06em;
}
.epigraph span { display: block; }
.epigraph .indent { padding-left: 1.6em; margin-top: 0.35em; }

main { max-width: var(--max-width); margin: 0 auto; padding: 40px 24px 100px; }

.intro { text-align: center; font-size: 14px; color: var(--fg-dim); line-height: 2.05; margin: -24px 0 20px; letter-spacing: 0.04em; }
.intro p { margin: 0 0 1.1em; }

.works { display: flex; flex-direction: column; gap: 28px; }

.work-card {
  display: block; background: var(--card-bg); border: 1px solid var(--line); border-radius: 2px;
  padding: 36px 32px 32px; transition: border-color 0.3s ease, background 0.3s ease, transform 0.25s ease;
  position: relative; overflow: hidden; cursor: pointer;
}
.work-card::before {
  content: ""; position: absolute; top: 0; left: 0; width: 2px; height: 100%;
  background: var(--accent-soft); opacity: 0; transition: opacity 0.3s ease;
}
.work-card:hover { border-color: #4a443e; background: rgba(18, 16, 18, 0.85); transform: translateY(-2px); }
.work-card:hover::before { opacity: 1; }
.work-number { font-family: var(--font-mono); font-size: 11px; color: var(--fg-dim); letter-spacing: 0.18em; margin-bottom: 14px; }
.work-title { font-size: 20px; font-weight: normal; letter-spacing: 0.14em; margin: 0 0 6px; color: var(--fg); }
.work-subtitle { font-family: var(--font-mono); font-size: 12px; color: var(--fg-dim); letter-spacing: 0.1em; margin: 0 0 18px; }
.work-desc { font-size: 13.5px; color: var(--fg-dim); line-height: 1.95; letter-spacing: 0.03em; margin: 0 0 22px; text-indent: 0; }
.work-link { font-family: var(--font-mono); font-size: 11px; color: var(--accent); letter-spacing: 0.16em; border-bottom: 1px dotted var(--accent-soft); padding-bottom: 1px; display: inline-block; }
.work-card:hover .work-link { color: var(--fg); border-bottom-color: var(--fg-dim); }
.work-card-footer {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  margin-top: 4px;
}
.work-meta {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--fg-dim);
  letter-spacing: 0.08em;
  white-space: nowrap;
  margin-left: auto;
  opacity: 0.85;
}

footer {
  max-width: var(--max-width); margin: 0 auto; padding: 40px 24px 80px; text-align: center;
  font-family: var(--font-mono); font-size: 11px; color: var(--fg-dim);
  border-top: 1px solid var(--line); letter-spacing: 0.1em;
}
footer p { margin: 6px 0; line-height: 1.9; }

/* work-page specific (ported from individual work files) */
nav.work-nav { max-width: var(--max-width); margin: 36px auto 0; padding: 0 24px 28px; text-align: center; font-family: var(--font-mono); font-size: 12px; color: var(--fg-dim); }
nav.work-nav a { margin: 0 10px; border-bottom: 1px dotted var(--accent); }

#toc { max-width: var(--max-width); margin: 0 auto 48px; padding: 0 24px; display: none; }
#toc.is-open { display: block; }
#toc ol { list-style: none; padding: 12px 0 8px; margin: 0; font-size: 13px; line-height: 2.05; border-top: 1px solid var(--line); }
#toc li { margin: 0; padding: 0; }
#toc a { border-bottom: none; color: var(--fg); }
#toc a:hover { color: var(--accent); }

.section { margin-top: 72px; }
.section:first-child { margin-top: 0; }
.section-title {
  font-size: 15px; font-weight: normal; color: var(--fg-dim); text-align: center;
  letter-spacing: 0.2em; margin: 0 0 40px; padding: 0 12px 16px;
  border-bottom: 1px solid var(--line);
  /* 文字の途中では折り返さず、softBreakTitle の <wbr>（、の直後）だけで改行 */
  word-break: keep-all;
  line-break: strict;
  overflow-wrap: normal;
  max-width: 100%;
  box-sizing: border-box;
}
/* 目次：折り返したとき二行目を「：」から三字ほど右に（入りきるときは一行のまま） */
#toc a {
  display: inline-block;
  max-width: 100%;
  line-height: 1.7;
  word-break: keep-all;
  line-break: strict;
  overflow-wrap: normal;
  padding-left: 6em;
  text-indent: -6em;
  box-sizing: border-box;
}
main p { margin: 0 0 1.4em; text-indent: 1em; }
main p.no-indent { text-indent: 0; }

/* 本文行長：閲覧・編集ともに 1行 22 字（--honbun-measure）に統一 */
main#honbun:not(.is-editing) .section,
main#honbun.is-editing .chapter-edit-body,
main#honbun:not(.is-editing) .afterword-content {
  max-width: var(--honbun-measure);
  width: 100%;
  margin-left: auto;
  margin-right: auto;
  box-sizing: border-box;
  letter-spacing: var(--honbun-tracking);
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
main#honbun:not(.is-editing) .section > p,
main#honbun.is-editing .chapter-edit-body > p,
main#honbun:not(.is-editing) .afterword-content > p {
  letter-spacing: var(--honbun-tracking);
  max-width: 100%;
  box-sizing: border-box;
}
main#honbun:not(.is-editing) .section > p,
main#honbun:not(.is-editing) .section > hr,
main#honbun:not(.is-editing) .section > hr.scene-break,
main#honbun:not(.is-editing) .section > .scene-break {
  margin-left: 0;
  margin-right: 0;
}

/* 場面区切り（コピペ時の空行 → 区切り線） */
hr.scene-break,
.scene-break {
  border: 0;
  height: 0;
  margin: 2.6em auto;
  padding: 0;
  width: min(42%, 160px);
  border-top: 1px solid var(--line);
  opacity: 0.85;
  display: block;
  background: none;
}
main#honbun.is-editing hr.scene-break,
main#honbun.is-editing .scene-break {
  margin: 1.8em auto;
  border-top-color: var(--accent-soft);
  opacity: 1;
}

.afterword-section { max-width: var(--max-width); margin: 0 auto; padding: 0 24px 60px; text-align: center; }
.afterword-toggle {
  background: none; border: 1px solid var(--line); color: var(--fg-dim); font-family: var(--font-mono);
  font-size: 12px; letter-spacing: 0.16em; padding: 10px 28px; cursor: pointer; transition: all 0.25s ease;
}
.afterword-toggle:hover { border-color: var(--accent-soft); color: var(--fg); }
.afterword-content { margin-top: 32px; text-align: left; }
.afterword-content.is-open {}
.aw-title { text-align: center; font-size: 15px; font-weight: normal; color: var(--fg-dim); letter-spacing: 0.2em; margin: 0 0 32px; }
.aw-epigraph { text-align: center; font-size: 13px; color: var(--fg-dim); line-height: 1.9; margin: 0 0 40px; }
.aw-epigraph span { display: block; }
.aw-epigraph .indent { padding-left: 1.6em; margin-top: 0.35em; }
.afterword-content p { margin: 0 0 1.3em; text-indent: 1em; line-height: 1.95; font-size: 14px; color: var(--fg-dim); }
.afterword-content p.no-indent { text-indent: 0; }

@media (max-width: 520px) {
  /* 本文だけ小さくして一度に読める量を増やす（タイトル・紹介文は維持） */
  body { background-attachment: scroll !important; }
  header { padding: 56px 18px 24px; }
  .site-title { font-size: 14px; letter-spacing: 0.08em; }
  main { padding: 40px 16px 80px; }
  main p { font-size: 14px; line-height: 1.85; letter-spacing: var(--honbun-tracking); margin: 0 0 1.2em; }
  .work-card { padding: 28px 22px 26px; }
  .work-title { font-size: 17px; }
  .epigraph { padding: 0 18px; font-size: 12.5px; }
  .section-title {
    letter-spacing: 0.06em;
    line-height: 1.7;
    padding: 0 8px 12px;
  }
  main#honbun.is-editing .chapter-edit-title,
  main#honbun.is-editing h2.section-title {
    letter-spacing: 0.06em;
    line-height: 1.7;
    padding: 0 8px 12px;
  }
  /* モバイルでも 22 字／行・同一メトリクス（閲覧＝編集） */
  main#honbun:not(.is-editing) .section,
  main#honbun.is-editing .chapter-edit-body {
    max-width: var(--honbun-measure);
    width: 100%;
  }
  main#honbun:not(.is-editing) .section > p,
  main#honbun.is-editing .chapter-edit-body,
  main#honbun.is-editing .chapter-edit-body > p {
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.85;
    letter-spacing: var(--honbun-tracking);
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  main#honbun.is-editing .chapter-edit-body {
    padding-left: 0;
    padding-right: 0;
  }
  main#honbun.is-editing .chapter-edit-body > p { margin: 0 0 1.2em; }
  main#honbun.is-editing {
    box-shadow: none;
  }
  main#honbun.is-editing .chapter-edit-body:focus {
    box-shadow: none;
  }
}

/* ---------- Site menu (三点リーダー + サイドバー) ---------- */
.site-menu-btn {
  position: fixed; top: 16px; right: 16px; z-index: 600;
  width: 42px; height: 42px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(14, 12, 14, 0.72); border: 1px solid var(--accent-soft); color: var(--accent);
  border-radius: 50%; cursor: pointer; transition: all 0.25s ease;
  backdrop-filter: blur(12px);
  padding: 0; line-height: 1;
}
.site-menu-btn:hover { background: rgba(154,139,122,0.16); color: var(--fg); border-color: var(--accent); }
.site-menu-btn svg { width: 20px; height: 20px; display: block; }
/* FACTOR/TRADER 解放中：枠を常時緑に */
.site-menu-btn.is-factor-unlocked {
  border-color: rgba(57,255,156,0.75);
  color: #39ff9c;
  box-shadow: 0 0 14px rgba(57,255,156,0.35), 0 0 0 1px rgba(57,255,156,0.2);
  background: rgba(57,255,156,0.08);
}
.site-menu-btn.is-factor-unlocked:hover {
  border-color: rgba(57,255,156,0.95);
  color: #9affc9;
  box-shadow: 0 0 20px rgba(57,255,156,0.5), 0 0 0 1px rgba(57,255,156,0.35);
  background: rgba(57,255,156,0.14);
}
body.is-editing .site-menu-btn { z-index: 460; }
/* 本文編集でキーボードが開いたときだけツールバーを隠す。
   ツールバー内の入力（章タイトル追加など）にフォーカスがある場合は隠さない（JS側で制御） */
.inline-editor-toolbar.is-keyboard-open { display: none !important; }
body.keyboard-open .site-menu-btn { display: none !important; }

.site-sidebar-overlay {
  position: fixed; inset: 0; z-index: 700;
  background: rgba(0,0,0,0.45);
  opacity: 0; visibility: hidden;
  transition: opacity 0.25s ease, visibility 0.25s ease;
}
.site-sidebar-overlay.is-open {

}

.site-sidebar {

.site-sidebar-header {

.site-sidebar-header .sidebar-menu-label {

.site-sidebar-header .sidebar-menu-label:hover {

.site-sidebar-header .sidebar-menu-label.is-egg-pulse {

.site-sidebar-close {

.site-sidebar-nav .sidebar-divider {

.site-sidebar-nav .sidebar-label {

.site-sidebar-nav button.is-work {

/* 閲覧時の章ジャンプハイライト */
.section.is-jump-target,
.chapter-edit-block.is-jump-target {

.site-sidebar-nav .sidebar-empty {

<script id="site-data" type="application/json">{"site":{"title":"27° 10′ 48″ N, 147° 32′ 24″ E","subtitle":"LUNA3","epigraph":"生きること、死ぬこと、<br>誰かを想い、慕い、忘れられること。<br>それでも生きる、ということ。","catchcopy":"","subcopy":""},"works":[{"id":"speak-or-die","number":"I","title":"語れ、さもなくば死ね","subtitle":"Speak or Die","desc":"「お前が死んだら、俺も死ぬよ」<br>そう言い残したキズキは、<br>その五日後に自ら命を絶った。<br>十年後。<br>親友キズキを失った「僕」は、<br>過労に追い詰められた友人トヲルと<br>酒を酌み交わしていた。","content":"<div id=\"toc\">\n  <ol>\n    <li><a href=\"#ch0\">プロローグ</a></li>\n    <li><a href=\"#ch1\">第一話：また後で。</a></li>\n    <li><a href=\"#ch2\">第二話：都内某所の居酒屋</a></li>\n    <li><a href=\"#ch3\">第三話：死んだら、パチンさ。</a></li>\n    <li><a href=\"#ch4\">第四話：代々木パーキングエリア</a></li>\n    <li><a href=\"#ch5\">第五話：生きる希望も、死ぬ勇気もない。</a></li>\n    <li><a href=\"#ch6\">第六話：羽田空港</a></li>\n    <li><a href=\"#ch7\">第七話：煙みたいなやつだった。</a></li>\n    <li><a href=\"#ch8\">第八話：海ほたる</a></li>\n    <li><a href=\"#ch9\">第九話：不公平な神より、平等な死を望む。</a></li>\n    <li><a href=\"#ch10\">第十話：館山城</a></li>\n    <li><a href=\"#ch11\">第十一話：生まれてきてよかったって言えるか？</a></li>\n    <li><a href=\"#ch12\">第十二話：九十九里浜</a></li>\n    <li><a href=\"#ch13\">第十三話：どんな時だって、希望は残っている。</a></li>\n    <li><a href=\"#ch14\">第十四話：犬吠埼</a></li>\n    <li><a href=\"#ch15\">第十五話：見届けるよ。そこで。</a></li>\n    <li><a href=\"#ch16\">第十六話：旅の終わり、日常の始まり</a></li>\n    <li><a href=\"#ch17\">第十七話：君が死んだら、僕も死ぬよ。</a></li>\n  </ol>\n</div>\n\n\n<main id=\"honbun\">\n\n  <div class=\"section\" id=\"ch0\">\n    <h2 class=\"section-title\">プロローグ</h2>\n    <p>死とは何か、ずっと昔一人の友人にそう尋ねられたことがある。あれはまだ、僕たちが二十歳になったばかりの頃で、世界のあらゆる問いに対して、答えを持たないことを許せていた時期だった。その友人──キズキ──がどのような表情と声音で、その問いを放ったのかはもう思い出せない。しかしキズキが唐突にそういう質問をする人間だったことだけは、はっきりと覚えている。何の脈絡もなく、まるで天気の話でもするみたいに、生死について尋ねてくるのだ。そのくせ答えを急かすことはなく、じっとこちらの言葉を待っている。その静かな圧力に、僕はいつも気圧された。</p>\n    <p>僕は少し迷ってから、暗く、冷たく、孤独な場所だと答えた。特に根拠があったわけではない。ただ漠然と、死とはそういう光の届かない場所であり、誰の声も届かない場所であり、そういう手触りをしているものだと、当時僕は信じていた。キズキは僕の答えを聞くと、にこやかに笑ってから、ビールを飲み、息を吐いた。その笑い方はいつも通り屈託がなく、まるで僕の答えの浅はかさをそっと肯定してくれるような、優しい笑い方だった。グラスに残った泡が、彼の唇の端にわずかに残っていた。隣のテーブルに座った客の談笑が心地よく響いていた。キズキはこちらを射止めるようにじっと見つめると、少し間を置いてから、含みを帯びた声音で、そっとこう言った。</p>\n    <p class=\"no-indent\">──お前が死んだら、俺も死ぬよ。</p>\n    <p>その言葉を、僕は長らく軽口の一種として処理していた。友情の誇張表現、若者らしい大仰な愛情表現。そう思い込むことで、もしかしたら僕はその言葉の重さから目を逸らしていたのかもしれない。しかしキズキはその五日後に手首を切って死んだ。遺書も、予告もなく唐突にだ。それがこの物語のすべての始まりであり、同時に終わりでもある。そして僕はその言葉が何を意味していたのか、という問いを十年もの間、彷徨い続けることになる。</p>\n</div>\n\n  <div class=\"section\" id=\"ch1\">\n    <h2 class=\"section-title\">第一話：また後で。</h2>\n    <p>グラスの中で氷が静かに鳴った。その音は、静かなバーの空気の中では驚くほど大きく響いた。溶けかけた氷が、琥珀色の液体をゆっくりと濁らせていく。店内は薄暗く、天井のランプがテーブルに小さな光の輪を落としていた。僕の隣に座ったトヲルはネクタイを少し緩め、どこか遠くを見るような目をしていた。</p>\n    <p class=\"no-indent\">「仕事の方は最近どうなの？」</p>\n    <p>僕が沈黙を破ると、トヲルは視線を戻し、困ったように笑った。</p>\n    <p class=\"no-indent\">「年中激務だよ。昨日も同僚がひとり過労で倒れた」</p>\n    <p class=\"no-indent\">「……そう」</p>\n    <p>言葉のあとに沈黙が落ちた。グラスの中の氷が、またひとつ音を立てて沈んでいった。僕はその音を聞きながら、トヲルの顔をそれとなく観察した。目の下には薄い隈が浮かび、頬もいくらか痩けて見える。仕事のせいだけではないだろう、と僕は直感的に思った。</p>\n    <p class=\"no-indent\">「近くにいたやつが救急車を呼ぼうとしたんだ。そうしたら上司が止めた。なんて言ったと思う？」</p>\n    <p class=\"no-indent\">「なんて言ったの？」</p>\n    <p class=\"no-indent\">「『そいつは睡眠不足なんだ。少しそこで眠らせとけ』ってよ。おかしな奴らだと思わないか？」</p>\n    <p>呆れて笑うトヲルを、僕はじっと見つめていた。</p>\n    <p class=\"no-indent\">「前にも言ったけど、そんな会社やめた方がいい。どうしてあの会社に、そこまでこだわるんだ？」</p>\n    <p class=\"no-indent\">「辞めようにもやめられないんだよ。色々と立て込んでいるからさ」</p>\n    <p>トヲルは今日、約束の時間から二時間遅れてバーにやってきた。最近残業続きだと、笑いながら言っていた。</p>\n    <p class=\"no-indent\">「でも、そんな会社にいたら心と体が壊れるのは時間の問題だ」</p>\n    <p>さとすように言うと、トヲルはグラスを握りながら首を振った。</p>\n    <p class=\"no-indent\">「周りに迷惑はかけられないんだよ。同僚だって同じように苦労してるんだ。自分だけ辞めるのは気が引ける」</p>\n    <p>そう言って、トヲルはグラスに残ったギムレットをぐっと飲んだ。</p>\n    <p class=\"no-indent\">「気持ちはわかる。でも他人の心配をするのは自分がまともなときにしろよ。君は今、苦しんでいるんだ。そんな状態で他人の心配をする必要はない」</p>\n    <p class=\"no-indent\">「他人事だからそう言えるんだ。そんなに簡単な話じゃない」</p>\n    <p>トヲルはポケットから煙草を取り出し、口に咥えた。そしてライターで火をつけた。小さな炎が一瞬、彼の顔を橙色に照らし出し、その表情の奥底にある何かを、僕に垣間見せた気がした。</p>\n    <p class=\"no-indent\">「同じように苦労してきた同僚の姿を、ずっと見てきたんだ。辛いのは俺だけじゃない。それなのに俺だけ逃げるなんて、そんなこと許されない」</p>\n    <p>煙草を口から離し、静かに煙を吐く。白い煙は宙に浮かんだあと、ゆるやかに消えていった。</p>\n    <p class=\"no-indent\">「でも、君のことが心配だ。転職は気が向いたらでいい。だけど辛かったり苦しかったりすることがあるなら、遠慮なく伝えてほしい。相談にも乗るし、手助けもする。とにかく、僕はもう大切なものを失いたくないんだ」</p>\n    <p>トヲルは小さく息を吐き、煙草を灰皿に置いた。</p>\n    <p class=\"no-indent\">「もう十年か」</p>\n    <p class=\"no-indent\">「キズキが生きていたら、三十だよ。僕たちも、随分と歳をとった」</p>\n    <p>彼の表情が一瞬だけ、何かに触れられたように揺らいだ。大切なものを失いたくない──ふと口に出たその言葉が、トヲルの心に響いたようだった。</p>\n    <p class=\"no-indent\">「アイツ、最期俺になんて言ったと思う？」</p>\n    <p class=\"no-indent\">「さあ、なんて？」</p>\n    <p class=\"no-indent\">「またどこかで、だよ」</p>\n    <p class=\"no-indent\">「またどこかで……」</p>\n    <p>僕はその言葉を口の中で反芻した。キズキは大学時代の友人だった。もともとはトヲルとキズキが同じ高校の同級生で、僕はトヲルの紹介でキズキと知り合った。あれからもう十年以上が経つというのに、あの出会いの日の光景は、驚くほど鮮明に僕の記憶の中に残っている。</p>\n    <p class=\"no-indent\">「どう思う？」</p>\n    <p class=\"no-indent\">「どう思うって……」</p>\n    <p>僕はその言葉について、しばらく思いを巡らせた。バーの照明が、僕の手元のグラスを柔らかく照らしていた。</p>\n    <p class=\"no-indent\">「そういえばキズキ、よく『さよなら』の代わりに『また後で』って言ってたよね」</p>\n    <p class=\"no-indent\">「ああ、確かに」</p>\n    <p class=\"no-indent\">「ずっと前に聞いたんだよ。どうして『さよなら』じゃなくて『また後で』なのかって」</p>\n    <p class=\"no-indent\">「なんて答えたんだ？」</p>\n    <p>僕は息をついた。今でもキズキの眩しい笑顔を忘れられない。</p>\n    <p class=\"no-indent\">「『さよなら』が最期の言葉になったら寂しいだろう、ってさ」</p>\n    <p>溶けた氷がグラスの中でからんと音を立てた。トヲルは深くため息をついた。</p>\n    <p class=\"no-indent\">「なんだか、今でもまたどこかでアイツに会えるような気がするんだよ」</p>\n    <p class=\"no-indent\">「それは僕も同じだよ」</p>\n    <p>またどこかで。何度聞いても、不思議な響きの言葉だった。</p>\n    <p class=\"no-indent\">「今でも時々アイツの夢を見るんだよ。三人でハワイに行ったときの夢をさ」</p>\n    <p class=\"no-indent\">「懐かしいな。綺麗なビーチだった」</p>\n    <p class=\"no-indent\">「ああ。アイツも楽しそうにしてた」</p>\n    <p>大学の夏休み、二、三日分の着替えとパスポートを持ってハワイに行った。日差しが痛いほどの時期で、僕たちは一日中海に入っていた。キズキは誰よりもはしゃいでいて、片言の英語で現地の人と次々に仲良くなっていった。</p>\n    <p class=\"no-indent\">「本当に、突然死んだよね」</p>\n    <p>トヲルは頷き、ギムレットを飲んだ。グラスの中で氷が小さく揺れた。</p>\n    <p class=\"no-indent\">「最期に見たときも元気だったんだよな？」</p>\n    <p class=\"no-indent\">「ああ。居酒屋で飲んだあと、一緒に房総半島をドライブしたんだよ。最後まで楽しそうだった」</p>\n    <p class=\"no-indent\">「キズキらしいな」</p>\n    <p>死ぬ理由など何ひとつなかったはずだった。それなのにキズキはドライブの五日後、長野の廃業したホテルの浴槽で、手首を切って死んだ。</p>\n    <p class=\"no-indent\">「アイツに会いたいよ」心の底から漏れたような声だった。僕は頷き、ウイスキーの入ったグラスを揺らした。琥珀色の液体が、照明を受けてゆっくりと渦を巻いた。キズキと出会ってからの二年間は、何ものにも代えがたい日々だった。そして僕たちの時間は、キズキが死んだあの瞬間から一秒たりとも動いていなかった。</p>\n    <p class=\"no-indent\">「君が死んだら、僕も死ぬよ」</p>\n    <p class=\"no-indent\">「え……？」</p>\n    <p>トヲルがひどく驚いたように僕を見つめた。</p>\n    <p class=\"no-indent\">「どうしてそんなことを言うんだよ」</p>\n    <p>真剣で、だけど切実な声だった。僕はトヲルの暗く、澱んだ瞳をじっと見つめた。</p>\n    <p class=\"no-indent\">「君のことが心配なんだよ。最近、まともに鏡すら見てないだろ？」</p>\n    <p class=\"no-indent\">「どうしてそう思う？」</p>\n    <p class=\"no-indent\">「ひどい顔をしてるからだよ。今にも手首を切って死にそうな顔をしてる」</p>\n    <p>吐き捨てるように言うと、トヲルは驚いたのか悲しんだのか曖昧な顔をした。そして苦しそうに声を出した。</p>\n    <p class=\"no-indent\">「仮に死ぬとしても、手首を切って死ぬようなまねはしないよ」</p>\n    <p class=\"no-indent\">「それは君に、まともな理性があったらの話だ」</p>\n    <p class=\"no-indent\">「俺にまともな理性がないというのか？」</p>\n    <p class=\"no-indent\">「ああ」</p>\n    <p>僕がはっきり言うと、トヲルはやりきれないように顔を歪め、ギムレットを飲み干した。キズキの通夜に似た、居心地の悪さだった。</p>\n    <p class=\"no-indent\">「とにかく、僕は本気だからね」</p>\n    <p>目を離さずに言うと、トヲルは小さく息をついて目を逸らした</p>\n    <p class=\"no-indent\">「気をつけるよ」</p>\n    <p>張り詰めた空気だった。僕はウイスキーを頼み、煙草に火をつけた。そしてキズキと一緒にしたあの日のドライブを、ゆっくりと思い出していった。</p>\n</div>\n\n  <div class=\"section\" id=\"ch2\">\n    <h2 class=\"section-title\">第二話：都内某所の居酒屋</h2>\n    <p>夜気をまとった客たちが暖簾をくぐるたび、ひんやりとした風が店内へ滑り込んできた。</p>\n    <p>炭火の香ばしい匂いには、焼き鳥の脂が弾ける乾いた音が混じっている。天井から吊るされた裸電球は、わずかに揺れながら、店の奥に集う客たちの輪郭を淡く照らしていた。僕とキズキは仕事帰りの会社員に挟まれるように、小さな机を囲んで腰を下ろしていた。テーブルには半分ほど減ったジンジャーエールと、泡の名残を残したビールのジョッキがある。泡がゆっくりと沈んでいく音が、店内のざわめきに溶けてゆるやかに消えていった。キズキはメニューに目を落とすこともなく、焼き鳥の盛り合わせとビールを頼んだ。そして店員に向かって、仔犬のように可愛げのある表情で、微笑んだ。僕はその横顔をじっと見つめながら、ふとテーブルの端に置かれた、分厚い文庫本に視線を留めた。</p>\n    <p class=\"no-indent\">「それ、新しい本？」</p>\n    <p>指差すと、キズキは「ああ、これ？」と軽く言って、本を手に取った。</p>\n    <p class=\"no-indent\">「掌の小説だよ。川端康成の」</p>\n    <p class=\"no-indent\">「たなごころの小説？」</p>\n    <p>初めて聞く名前の小説だった。僕は本を受け取り、ぱらぱらとページを捲った。</p>\n    <p class=\"no-indent\">「原稿用紙五、六枚くらいの短編が多いんだ。だから、出先で読むのにちょうどいいんだよ」</p>\n    <p>そう言うと、キズキはごくりとビールを飲んだ。僕は『掌の小説』を眺めながら、枝豆の塩漬けをつまんだ。</p>\n    <p class=\"no-indent\">「大体、何作品くらいあるの？」</p>\n    <p class=\"no-indent\">「数えたことないからな。でも、百篇以上はあると思うけど……」</p>\n    <p class=\"no-indent\">「百篇か、すごいね」</p>\n    <p>そう言ってページを捲っていると、ふと見覚えのあるタイトルが目に飛び込んできた。</p>\n    <p class=\"no-indent\">「あっ、これって『化粧の天使達』？」</p>\n    <p>驚いて声を上げると、キズキは僕が開いていたページを覗き込み、文章を目で追った。</p>\n    <p class=\"no-indent\">「ああ。そうだよ。よく知ってるな」</p>\n    <p class=\"no-indent\">「高校の教科書に載ってたんだよ。『掌の小説』のやつだったんだ」</p>\n    <p>さらにページを捲ると、ふと文章に線が引かれたページに行き当たった。</p>\n    <p class=\"no-indent\">「ここ、線が引いてあるね」</p>\n    <p>指で示すと、キズキは「ああ、これか」と言って、その一文を読み上げた。</p>\n    <p class=\"no-indent\">「『別れる男に、花の名を一つは教えておきなさい。花は毎年必ず咲きます』──幽遠な文章だと思わないか？」</p>\n    <p>僕はその言葉を、何度か頭の中で繰り返してみた。</p>\n    <p class=\"no-indent\">「確かに、素敵な文章だね。でも、なんでこの文章を？」</p>\n    <p>僕が尋ねると、キズキは近くの店員につまみを頼みながら答えた。</p>\n    <p class=\"no-indent\">「なんか素敵じゃないか。好きな人に毎年思い出してもらうために、花の名前を教えるなんてさ」</p>\n    <p class=\"no-indent\">「ああ、確かに。なんか日本人らしいね」</p>\n    <p class=\"no-indent\">「ああ、ほんと、素晴らしいよ」</p>\n    <p>ジョッキを片手に、キズキはにこりと笑った。まるで天使のウインクみたいに無防備でキュートな笑みだった。</p>\n    <p class=\"no-indent\">「にしても、悪いな。俺だけ酒飲んで」</p>\n    <p>申し訳なさそうにキズキが言ったので、僕は首を振った。</p>\n    <p class=\"no-indent\">「仕方ないよ。僕は三月生まれなんだから。でも、あと少しの辛抱だ」</p>\n    <p>ジンジャーエールを口に含むと、舌で炭酸が弾けた。十月生まれのキズキは二十歳。三月生まれの僕は、まだ十九歳だった。</p>\n    <p class=\"no-indent\">「キズキは、お酒、強い方なの？」</p>\n    <p>気になって尋ねると、キズキは「そうだなぁ」と言って、ビールのグラスを揺らした。</p>\n    <p class=\"no-indent\">「まだあまり飲んでないからわからないけど、人並みには飲めると思うよ。少なくとも、一杯で顔が真っ赤になるタイプじゃないな」</p>\n    <p>そう言って、キズキはぐいっと酒を流し込んだ。キズキが酒を飲む姿は初めてみたが、その飲みっぷりはなかなかに豪快だった。</p>\n    <p class=\"no-indent\">「お酒飲むと、やっぱり気分が良くなるの？」</p>\n    <p class=\"no-indent\">「まあ、それなりにな。満ち足りた気持ちになるっていうか、心地いい気分になるんだ」</p>\n    <p class=\"no-indent\">「心地いい気分……」</p>\n    <p>その感覚を想像しながら、僕はジンジャーエールを飲んだ。ノンアルではとても実感が湧かない。</p>\n    <p class=\"no-indent\">「まあ、お前もあとちょっとでわかるよ」</p>\n    <p class=\"no-indent\">「そうだね」</p>\n    <p>そこで僕たちはテーブルに並んだ料理を見下ろした。寮の先輩に勧められたお店だったが、ここの焼き鳥は、期待以上に美味しかった。</p>\n    <p class=\"no-indent\">「そういえば、この前、トヲルと三人で観たあの映画、どうだった？」</p>\n    <p>キズキに言われて、僕は一週間前に、トヲルと一緒に観たとある映画を思い出した。</p>\n    <p class=\"no-indent\">「ああ、面白かったよ。何だか切ない話だったけどね」</p>\n    <p>それは宇宙と地上に引き裂かれた男女の恋を描いたＳＦ映画だった。あまり世には知られていない作品なのだが、熱狂的なファンがいて、界隈では根強い人気のある作品だった。僕はその作品を一週間前の夜に、寮の共用テレビでキズキと一緒に観たのだ。</p>\n    <p class=\"no-indent\">「俺さ、あの映画、実はもう何十回も観てるんだよ」</p>\n    <p class=\"no-indent\">「そうなの？」</p>\n    <p class=\"no-indent\">「ああ。『たとえ世界の端と端に引き裂かれても、あなたと同じ星を見上げることができるのなら、私はそれだけで十分です』映画の冒頭の台詞だよ。なんか、ロマンチックだよな。同じ星を見上げるだけでいいなんてさ」</p>\n    <p>それはヒロインが宇宙に旅立つ前に、主人公に託した台詞だった。だけど主人公は、いつしかその言葉を忘れてしまうのだ。</p>\n    <p class=\"no-indent\">「遠く離れた二人が、同じ星を見上げて想い合うんだ。『あの人も今、同じ星を見上げているかもしれない』って。でも地上に残った主人公は、いつからか他に好きな女の子を作って、星を見上げなくなる。ラストは悲劇的だったな。宇宙に飛び立った女の子は、燃料が尽きた宇宙船の中で、果てしない空腹と孤独に苛まれながら死んでいく。女の子が安らかに目を閉じる瞬間、その真っ黒な瞳にはひとつの星が映っていたんだ。あれはきっと、最期の最後まで女の子が主人公のことを想っていたことを表していたんだよ」</p>\n    <p>キズキの話を聞いているうちに、僕はだんだんと映画の詳細を思い出してきた。あれは、本当に切ない映画だった。</p>\n    <p class=\"no-indent\">「そして映画は、死んでしまった女の子を乗せた宇宙船が、果てしない闇の中にぽつんと浮かんでいるカットで終わる。エンドロールの虚無感には宇宙的なものを感じたよ。まるで、宇宙にひとり放り出されたような気分だった。どこかの気取った批評家は、この映画のラストを憂鬱なバッドエンドだと酷評したらしいけど、俺はそうは思わない。この物語は愛の真実を語っているんだ。愛することの残酷さ。それを美しく、克明に描いた作品だと思う」</p>\n    <p>愛することの残酷さ。キズキは、その言葉を強調した。</p>\n    <p class=\"no-indent\">「宇宙船の燃料が尽き果てても、主人公のことを想い続ける女の子の姿を観て、俺は思ったよ。想いとは、宇宙を直向きに突き進む光なんだって」</p>\n    <p class=\"no-indent\">「……光」</p>\n    <p class=\"no-indent\">「そして愛とは、尽き果てることのない人間の燃料なんだって」</p>\n    <p class=\"no-indent\">「燃料」</p>\n    <p>キズキはその言葉に頷き、グラスのふちを指でなぞった。照明に照らされて、キズキの爪が滑らかに輝いた。</p>\n    <p class=\"no-indent\">「ちなみに、映画のキャッチコピーは『想いは音よりも、光よりも速いスピードで誰かのもとに届く』だった」</p>\n    <p class=\"no-indent\">「ああ、そうだったね」</p>\n    <p>印象的なキャッチコピーだった。ヒロインの直向きな想いは、時間と空間を超えていたのだ。</p>\n    <p class=\"no-indent\">「でも、俺はこのキャッチコピーを見た時に思ったんだ。いくら音よりも、光よりも速いスピードで想いが届いたとしても、それを受け取ってくれる人がいなかったら、何の意味もないんじゃないかって」</p>\n    <p class=\"no-indent\">「まあ、そうだね」</p>\n    <p>必ずしも、想いが届くとは限らない。この世界には、届かずして消えていった想いが、たくさんある。</p>\n    <p class=\"no-indent\">「俺さ、実はずっと前から好きな人がいるんだ」</p>\n    <p class=\"no-indent\">「えっ？」</p>\n    <p>驚いて声を出すと、キズキはそれに頷き、グラスに入ったビールを口に含んだ。そして灰皿のふちを指でなぞって、頬杖をついた。</p>\n    <p class=\"no-indent\">「だけど、そこには絶望的な距離があった」</p>\n    <p class=\"no-indent\">「絶望的な距離？」</p>\n    <p>僕が問うと、キズキは頬杖をついたまま、じっとこちらを見つめた。</p>\n    <p class=\"no-indent\">「それは宇宙と地上よりも遠い距離だよ」</p>\n    <p class=\"no-indent\">「宇宙と地上よりも遠い……」</p>\n    <p>キズキはその言葉に頷き、沈黙の重さを確かめるみたいに黙った。僕もそれ以上は尋ねず、静かにジンジャーエールを飲んだ。絶望的な距離。それが一体、どれほどの距離なのか、僕にはわからなかった。</p>\n    <p class=\"no-indent\">「……でも、良かったよ」</p>\n    <p class=\"no-indent\">「えっ？」</p>\n    <p class=\"no-indent\">「いや、ほら。キズキって出会ったときから、あまり恋愛の話とか乗り気じゃなかったから。てっきり、そういうのには興味がないのかなって思ってたんだ」</p>\n    <p class=\"no-indent\">「ああ……まあ、そうだな」</p>\n    <p>思い出したように言いながら、キズキはもやしのナムルを箸で口に運んだ。</p>\n    <p class=\"no-indent\">「で、その好きな人ってどんな人なの？」</p>\n    <p>気になって尋ねてみると、キズキはハッと顔を上げて、こちらを見つめた。それから少し目を逸らして、箸を置いた。</p>\n    <p class=\"no-indent\">「まあ、いい人だよ。一緒にいて楽しいし、話してると色々と発見がある」</p>\n    <p class=\"no-indent\">「そっか……でも嬉しいよ。キズキにもそういう人ができて」</p>\n    <p>串入れに竹串を入れながら言うと、キズキはありがとうと言って、儚げに笑った。まるで、春の柔らかな風に揺れるアネモネのように。</p>\n    <p class=\"no-indent\">「にしても美味しいね、この焼き鳥。今度、彼女と一緒に来ようかな」</p>\n    <p class=\"no-indent\">「そういえば、その彼女とは上手くいってるのか？」</p>\n    <p>キズキの声が少し強張っているように聞こえたが、僕は気にせず、キズキの問いに頷いた。</p>\n    <p class=\"no-indent\">「順調だよ。この前は近くの水族館に行ったんだ。人懐っこいシロイルカがいる水族館でね。とっても可愛いんだ」</p>\n    <p class=\"no-indent\">「へえ。でも、水族館なんて久しく行ってないな」</p>\n    <p class=\"no-indent\">「今度、一緒に行こうよ。ほら、その好きな子でも誘ってさ」</p>\n    <p>枝豆の塩漬けをつまみながら言うと、キズキは首を振って、ビールを流し込んだ。</p>\n    <p class=\"no-indent\">「言っただろ？　絶望的な距離があるって」</p>\n    <p class=\"no-indent\">「そんなに望みがないの？」</p>\n    <p class=\"no-indent\">「まあ、うん……」</p>\n    <p>そう言うと、キズキは静かに息をついた。そして、絞り出すように声を出した。</p>\n    <p class=\"no-indent\">「でも、今度、自分の想いを正直に伝えてみようって思うんだ。その人に」</p>\n    <p class=\"no-indent\">「ほんと？　じゃあ、上手くいったら、その子も連れて、一緒に水族館に行こうよ」</p>\n    <p>僕がそう言うと、キズキは一度、目を伏せてから、ちらりとこちらを見つめた。</p>\n    <p class=\"no-indent\">「……まあ、上手くいったらな」</p>\n    <p class=\"no-indent\">「きっと、上手くいくさ」</p>\n    <p class=\"no-indent\">「うん。そう願いたいな」</p>\n    <p>そこで、僕たちはしばらく黙った。キズキは焼き鳥を一本頬張り、僕は枝豆の塩漬けを口に運んだ。</p>\n    <p>次に、キズキが声を出したのは、僕がジンジャーエールを飲み干し、新しくコーラを頼んだときだった。</p>\n    <p class=\"no-indent\">「そういえば、お前免許取ったんだよな？」</p>\n    <p class=\"no-indent\">「うん。取ったよ。先月」</p>\n    <p>店員から受け取ったコーラを飲みながら言うと、キズキは箸を置いてこちらを見た。</p>\n    <p class=\"no-indent\">「もう、公道で走ったのか？」</p>\n    <p class=\"no-indent\">「親の車では走ったよ。なかなか慣れないけどね」</p>\n    <p>僕が苦笑交じりに言うと、キズキは一度、まっすぐに僕を見つめてから、にこりと笑った。</p>\n    <p class=\"no-indent\">「じゃあ、ドライブでもしようぜ」</p>\n    <p class=\"no-indent\">「えっ、いつ？」</p>\n    <p class=\"no-indent\">「今からだよ。深夜時間で車をレンタルできる店が、この近くにあるんだ」</p>\n    <p class=\"no-indent\">「えっ？　いや、十一時過ぎてるんだよ？　それに、十二時に戻るって寮長に言ったし」</p>\n    <p>慌ててそう言うと、キズキはビールを飲み干してから、満面の笑みを浮かべて言った。</p>\n    <p class=\"no-indent\">「いいじゃんか。ほら、お前、酒飲んでないんだし」</p>\n</div>\n\n  <div class=\"section\" id=\"ch3\">\n    <h2 class=\"section-title\">第三話：死んだら、パチンさ。</h2>\n    <p>薄暗い店内には、店内のスピーカーからは、低く抑えられたジャズが流れていた。壁の古い掛け時計が、重苦しく時を刻んでいる。</p>\n    <p>トヲルが声を出したのは、バラライカを飲み干し、新しくギムレットを頼んだ後だった。</p>\n    <p class=\"no-indent\">「なあ、死んだらどうなると思う？」</p>\n    <p>その問いに、僕は考えるよりも先に声を出していた。</p>\n    <p class=\"no-indent\">「死んだら、パチンさ」</p>\n    <p class=\"no-indent\">「パチン？」</p>\n    <p class=\"no-indent\">「ＯＮからパチンとＯＦＦになる。ただそれだけだよ」</p>\n    <p class=\"no-indent\">「随分と軽いな」</p>\n    <p class=\"no-indent\">「そんなものだよ。大抵の人は死んだことにすら気づかないで死ぬんだ」</p>\n    <p class=\"no-indent\">「それは気楽でいい」</p>\n    <p>部屋の電気を消すみたいに死は訪れる。そう教えてくれたのはキズキだった。</p>\n    <p class=\"no-indent\">「アイツは自分が死んだことに気づいたと思う？」</p>\n    <p>力のない静かな声だった。僕はトヲルの問いに、じっくりと考えを巡らせた。</p>\n    <p class=\"no-indent\">「キズキは自分の意思で電気を消したんだ。ＯＮからパチンとＯＦＦに」</p>\n    <p class=\"no-indent\">「……ああ」</p>\n    <p>キズキは死んだ。まるで部屋の電気を消しにいくみたいに。</p>\n    <p class=\"no-indent\">「自殺っていうのはきっと、自分が死んだことに唯一気づける死に方なんだよ。哀しいことにね」</p>\n    <p>僕がそう言うと、トヲルはそうかとだけ言った。夏の終わりの螢みたいに、今にも消えてなくなりそうな声だった。</p>\n    <p class=\"no-indent\">「アイツは死ぬ時、何を思ったんだろう」</p>\n    <p>抑揚のない平板な声だった。僕は項垂れたトヲルの姿を見つめながら、呟くように声を出した。</p>\n    <p class=\"no-indent\">「それは誰にもわからない。キズキにも、わからなかったと思うよ」</p>\n    <p>死を間際にしてキズキは何を思ったのだろう、何を感じたのだろう。僕にはとても想像がつかない。</p>\n    <p class=\"no-indent\">「俺はさ、小さい頃ずっと死を受け入れられなかったんだ」</p>\n    <p class=\"no-indent\">「受け入れられなかった？」</p>\n    <p>僕の問いに、トヲルは一度頷いた。そして届けられたギムレットを口にし、息をついた。</p>\n    <p class=\"no-indent\">「死んだらもう生きられないってことに、どうしても耐えられなかったんだ。死ぬのがたまらなく怖かった。いつか死ぬ世界で生きているのが怖かった。それでも俺はいつからか死を受け入れていた。終わりを定められた人生を受け入れていた」</p>\n    <p>そう言うと、トヲルはギムレットの注がれたグラスのふちを指でなぞった。</p>\n    <p class=\"no-indent\">「でもアイツが死んで、俺はやっぱり分からなくなった。だって考えてみろよ。昨日までニコニコ笑ってたやつが、次の日には真っ青になって冷たくなってるんだよ。名前を呼んでも、肩を叩いても返事をしない。ずっと瞼を閉じてるんだ。信じられるわけないだろ？　昨日まであんなに生き生きしてたやつが、次の日にはただのモノになってるんだよ。もちろん原理はわかるさ。老いたら死ぬ、病気になったら死ぬ、心臓を刺されたら死ぬ、高いところから飛び降りたら死ぬ。それはわかってる。でも死ってなんなんだよ？　死んだら右も左もない。縦も横もない。呼吸も鼓動もない。意思も感情もない。数字も文字もない。色も、音も、形も、匂いも、味もない。生きてた時にあった何もかもが全て失われるんだ。そんなの受け入れられるわけないだろ？　俺には到底受け入れられない」</p>\n    <p>そこでトヲルはポケットから煙草を取り出し、口に咥えた。しかしトヲルは煙草を咥えているだけで、一向に火をつけようとしなかった。</p>\n    <p class=\"no-indent\">「俺たちは何のために生きているんだろう」</p>\n    <p class=\"no-indent\">「え？」</p>\n    <p>驚いて顔を上げると、トヲルはカウンターの一点を見つめたまま、煙草を口から離した。</p>\n    <p class=\"no-indent\">「いや、アイツがよく俺に聞いたんだよ。お前は何のために生きているって。俺はそうやって問われるたびに何も答えることができなかった」</p>\n    <p>キズキの眩しい笑顔を思い浮かべながら、僕はウイスキーを飲んだ。キズキは僕に対して一度もそんなことを尋ねなかった。どうしてトヲルにだけ、そんなことを尋ねたのだろう。</p>\n    <p class=\"no-indent\">「明るいやつだったけど、アイツはずっと考えてたんだ。自分は何故生きているのか、何の為に生きているのかって。神にも、仏にも頼らず、アイツはずっとひとりで考えていた。それがどれだけ孤独な作業か、俺にはとても想像がつかない。ある意味、アイツはずっとひとりだったんだよ。たったひとりで、アイツはこの人生と、この世界と向き合っていたんだよ」</p>\n    <p>その言葉にハッとする自分がいた。キズキはたった一人で、この世界と向き合っていたのだろうか。</p>\n    <p class=\"no-indent\">「なあ、俺たちはどうするべきだったと思う？　どうすればキズキを救えたと思う？」</p>\n    <p>救いを求めるような声だった。僕はその問いにじっくりと考えを巡らせた。でも、そんなことわかるはずなかった。</p>\n    <p class=\"no-indent\">「それは僕にもわからないよ、悪いけど」</p>\n    <p class=\"no-indent\">「……そうだな」</p>\n    <p>僕はそこで小さく息をつき、ウイスキーを口に含んだ。</p>\n    <p class=\"no-indent\">「でも、生きる意味に悩む気持ちは少しわかるよ」</p>\n    <p class=\"no-indent\">「え……？」</p>\n    <p class=\"no-indent\">「僕も学生時代は必死になって生きる意味を探していたから」</p>\n    <p class=\"no-indent\">「そうなのか？」</p>\n    <p>僕はその問いに頷いて過去を振り返った。生きる意味など、あの頃からずっとわからなかった。</p>\n    <p class=\"no-indent\">「小さい頃は、生きるってことに揺るぎない何かがあったはずなんだ。でも勉強をしたり、部活をしたりしているうちにわからなくなった。自分が何故生きているのか、何の為に生きているのか、改めて立ち止まって考えてみると何もわからなかったんだ」</p>\n    <p>灰皿には煙草の吸い殻が積み重なっている。トヲルはギムレットを飲み干し、グラスを弾いた。</p>\n    <p class=\"no-indent\">「それからは無気力だよ。何をやっても身が引き締まらなくて、気力が湧かないんだ。一日一日がただただ辛くて、どうしようもなく苦しかった。この先ずっとこのまま生きていくのかって思うと、たまらなく恐ろしかったんだ」</p>\n    <p>そこで僕は一旦間を置き、琥珀色に染まったグラスをじっと見つめた。トヲルは手にしていた煙草をふたたび口に咥え、ライターで火をつけた。そして大きく息を吸い込み、ゆっくりと煙を吐いた。</p>\n    <p class=\"no-indent\">「色んなことを考えたし、色んな本も読んだ。だけど、やっぱりわからないんだ。自分が何故生きるのか、何の為に生きているのか。考えれば考えるほど、それはわからなくなる」</p>\n    <p>グラスを揺らすと、ウイスキーはなめらかに光を反射させた。トヲルは煙草を指で挟んだまま、棚に並んだグラスをじっと見つめている。その瞳は宇宙の果てを見つめるように、どこか寂しげだった。</p>\n    <p class=\"no-indent\">「でも、その時に思ったんだ。生きることはたまらなく虚しいことだって」</p>\n    <p class=\"no-indent\">「……虚しい」</p>\n    <p>トヲルはそう呟くと灰皿の角で煙草の灰を落とした。そしてバーテンダーを呼び、バラライカを頼んだ。</p>\n    <p class=\"no-indent\">「いつか人は死ぬ。死ねばあらゆるものは失われる。夢も、希望も、幸せも、感情も、意思も、記憶も何もかも失われる。僕たちは産まれながらに全てを失う運命にある。虚しいと思わないか？」</p>\n    <p class=\"no-indent\">「まあ、そうだな」</p>\n    <p>バーテンダーがトヲルのもとにバラライカを届けた。僕はポケットから煙草を取り出し、口に咥えてライターで火をつけた。</p>\n    <p class=\"no-indent\">「必死に考えたよ。この虚しい人生に生きる意味はあるのか？　生きる価値はあるのか？　生きる理由はあるのかって。でも、その答えは見つからなかった」</p>\n    <p>そこで僕は止めて、煙草を吸った。光に照らされて、白い煙が粉雪のように煌めいている。</p>\n    <p class=\"no-indent\">「もちろん今を生きる人たちの考えは様々だ。『生きる意味はわからない』と諦めている人もいるし、『生きる意味はいずれ見つかる』と前向きに捉えている人もいる。『楽しく生きれればそれでいい』と割り切っている人もいるし、『神の為に生きている』と信じている人もいる。考え方はそれぞれだ。だけど僕はやっぱり意味を見つけたかった。生きる意味が、欲しかった」</p>\n    <p class=\"no-indent\">「どうして？」</p>\n    <p>僕はその問いにしばらく考えた。どうして僕は生きる意味を求めたのだろう。</p>\n    <p class=\"no-indent\">「やっぱり怖かったんだよ。意味や価値のないこの世界で生きるのが。意味や価値のないものとして人生を終わらせるのが、たまらなく怖かったんだ。だから僕は必死になって生きる意味を探したんだと思う」</p>\n    <p class=\"no-indent\">「怖い、か」</p>\n    <p>そこでトヲルはゆっくりと煙を吐き出した。僕は手にしていたライターの重みをじっくりと確かめた。</p>\n    <p class=\"no-indent\">「でも、そう思っていたのは学生時代だけだった。ある程度歳を重ねたら、それにも諦めがついた」</p>\n    <p class=\"no-indent\">「諦め？」</p>\n    <p class=\"no-indent\">「ああ、何て言うか、もう考えるのをやめようって思ったんだ。もちろん生きる意味や、生きる理由を考えることは大切なことさ。でも変に考えすぎるのも良くないと思ったんだ。だってその『意味探し』に究極的な答えはないわけだから」</p>\n    <p class=\"no-indent\">「まあ、そうだな」</p>\n    <p>トヲルはバラライカを口に含んだ。僕は煙草を吸いながら、カウンターの木目をじっと見つめた。</p>\n    <p class=\"no-indent\">「もちろん考えることを放棄したわけじゃない。だけど変に考えすぎて苦しくなるのもよくないと思ったんだ。だから、考えるのを諦めた」</p>\n    <p class=\"no-indent\">「考えるのを諦めた」</p>\n    <p>トヲルはその言葉をゆっくりと繰り返した。まるで言葉の響きを確かめるみたいに。</p>\n    <p class=\"no-indent\">「もちろん、今だって何の為に生きているのかはわからない。だけど生まれた以上、生きねばならない。その程度でいいと思うようになったんだ。変に考えすぎるよりもそうやって生きている方がずっと楽しい。きっとそれだけでいいんだ。大層な意味や価値がなくても人は生きていける。生きる。ただそれだけでいいんだ。そこに理論も、定義も、真理も存在しない。大事なのは『何故生きるのか』ではなく、『どう生きるのか』だ。意味を見つけるのは、またあとででいいんだよ」</p>\n    <p class=\"no-indent\">「またあとで、か」</p>\n    <p>トヲルはその言葉に頷いて、灰皿に煙草を擦りつけた。いつの間にかキズキみたいな言い方になってしまった。</p>\n    <p class=\"no-indent\">「キズキも、もしかしたらずっと考えていたのかもしれない。意味のない世界で意味を見出す、その『意味』について。でもその問いには出口がない。入口があっても出口はない。キズキはそんな迷宮に迷い込んだ。そして出口を見つけられないまま、死んでしまった」</p>\n    <p>トヲルはグラスを握ったまま静かに息をついた。死に触れるような深いため息だった。</p>\n    <p class=\"no-indent\">「『生きる意味などわからない』普通の人ならそう割り切って生きていくはずだ。だけどキズキには物事を深く考える癖があった。きっとそれがキズキ自身を苦しめていたんだ。そしてキズキは──」</p>\n    <p class=\"no-indent\">「もういい」と言ってトヲルは止めた。</p>\n    <p>僕は唇を噛み、グラスを強く握った。</p>\n    <p class=\"no-indent\">「でも、本当のところは何もわからないよ」</p>\n    <p>込み上げてくる悲しみを抑えながら、僕は呟いた。</p>\n    <p>トヲルはグラスを握り、カウンターの一点を見つめている。</p>\n    <p class=\"no-indent\">「さっきのは君の話を聞いた上での推測だ。キズキが何を思って自ら命を絶つ選択をしたのか、それは誰にもわからない」</p>\n    <p class=\"no-indent\">「ああ、そうだな」</p>\n    <p>死者の前で生者はあまりにも無力だ。声をかけることも、手を差し伸べることもできない。僕たちはただ、彼らに思いを巡らせることしかできない。</p>\n    <p>それから僕たちは巨石のように黙した。僕はその間にウイスキーを二杯飲み、トヲルはバラライカを一口だけ飲んだ。静かで、穏やかな夜だった。まるで今にもキズキが天から舞い降りてきそうだった。</p>\n</div>\n\n  <div class=\"section\" id=\"ch4\">\n    <h2 class=\"section-title\">第四話：代々木パーキングエリア</h2>\n    <p>会計を済ませ、居酒屋を出た僕たちは、近くにあった深夜時間で車をレンタルできる店に行った。僕が手続きを済ませている間、キズキは店の外にあるスタンド灰皿の前で煙草を吸っていた。車は日産の古いコンパクトカーだった。車に乗り込むと、キズキは車内を物珍しそうに眺めた。</p>\n    <p class=\"no-indent\">「そういえばキズキって、免許取ってないんだよね？」</p>\n    <p class=\"no-indent\">「ああ。でも、いずれは取るつもりだよ。お前にばっか運転させるわけにはいかないからな」</p>\n    <p>そう言うと、キズキはシートベルトをしめて窓の外を見つめた。その瞳には、宇宙の果てを思わせるような深い闇があった。</p>\n    <p class=\"no-indent\">「じゃあ、どこ行く？」</p>\n    <p class=\"no-indent\">「海沿いとか走りたいよな。夜の海とか見てみたいし」</p>\n    <p class=\"no-indent\">「じゃあ、江ノ島？」</p>\n    <p>僕がそう言うと、キズキはうーんと唸りながらカーナビを見つめた。</p>\n    <p class=\"no-indent\">「江ノ島は洒落てるけど、なんか違うな」</p>\n    <p class=\"no-indent\">「となったら、東京湾？」</p>\n    <p>僕の問いに、キズキはパチンと指を鳴らし、「それだ！」と言った。</p>\n    <p class=\"no-indent\">「どうせなら、羽田まで行ってみる？」</p>\n    <p class=\"no-indent\">「いいね、羽田」</p>\n    <p>これで行き先は決まった。あとは、ゆっくりと車を走らせるだけだ。</p>\n    <p>羽田までは色々と行く道があったが、現在地からは首都高速道路に乗るのがいちばんの近道だった。僕はレンタカー店から車を発進させ、しばらく下道を走ってから首都高に乗った。ほとんど夜中だったが、首都高には──それほど多くはなかったが、まだ車が走っていた。夜間運転をするトラックが多いのだろうと思っていたが、意外にもコンパクトカーやセダンが多く見られた。キズキは首都高に入ってから、ほとんど口をきかなかった。一日の疲れもあったのかもしれない。事実、僕たちは居酒屋で飲む前に、いくつかのレポートを書いていた。それは今週中に提出しなければならないレポートで、僕たちはそれを手つかずの状態で放置していた。そして提出日三日前になって、いよいよ取り組んだというわけだ。幸い、レポートの量はそれほど多くなかったので、丸一日使ってなんとか終わらせることができた。居酒屋に行ったのも、レポートが終わった打ち上げのためだった。本当はトヲルも誘おうとしたのだが、学科試験が近いということもあり、断られてしまった。僕たちは三人とも同じ大学に通っていたが、僕とキズキが文学部だったのに対し、トヲルは工学部だった。それにトヲルは工学部内でもトップを争うくらいには頭が良かったため、学科試験前に邪魔はしたくなかった。だから僕とキズキはふたりだけで居酒屋に行った。助手席に腰を下ろしているキズキは特に眠っているわけでもなく、ただ物珍しそうに窓の外の景色を眺めていた。僕はそんなキズキの姿をチラッと見てから、カーナビについていたラジオをつけた。すると少し間を置いてから、交通情報を伝えるアナウンサーの声が聞こえてきた。僕はチャンネルを切り替え、ヒットソングが流れる音楽番組にした。フロントドアの横についたスピーカーから、若い男性の歌声が聴こえてきた。どこかで聴いたことのある歌声だったが、歌手の名前までは思い出せなかった。</p>\n    <p>キズキが途中でトイレに行きたいと言ったので、僕たちは最近リニューアルされたばかりの代々木パーキングエリアに立ち寄った。代々木パーキングエリア自体は、小さい頃に何度か訪れたことがあったが、リニューアルされた後に来るのは初めてだった。もともと広いパーキングエリアではなかったが、リニューアルされたことによって、かなりこざっぱりとした印象になっていた。</p>\n    <p>駐車場に車を停めると、僕たちはパーキングエリア内の建物に入った。どうやらトイレは二階にあるらしく、キズキは建物に入るなりすぐさま二階へと上がっていった。その間、僕は二階にある休憩所を見て回った。二階にはドトールと小さなレストランがあったが、どちらもすでに閉まっていた。休憩所には人がほとんどおらず、唯一いたのは新聞紙を読む男性一人だけだった。僕は窓際の席に座り、そこから首都高速道路を眺めた。もう夜中の零時を過ぎていたが、それでも車はまばらに走っていた。眠らない街とはまさにこういうことだった。</p>\n    <p>キズキは五分ほど経ってから、缶コーヒーを手にして戻ってきた。</p>\n    <p class=\"no-indent\">「どうしたの、それ？」</p>\n    <p>僕が驚いて尋ねると、キズキは缶コーヒーをこちらに投げた。</p>\n    <p class=\"no-indent\">「眠くなるかもしれないと思ってさ。買ったんだ」</p>\n    <p>そう言うと、キズキは缶のふたをカチッと開けた。</p>\n    <p class=\"no-indent\">「ほら、遠慮するなって」</p>\n    <p class=\"no-indent\">「ああ、わかった。ありがとう」</p>\n    <p>そこで僕も缶のふたを開けた。缶は自販機で温まっていたこともあり、冷えた手先に温もりを与えた。</p>\n    <p class=\"no-indent\">「にしても、洒落たパーキングエリアだな」</p>\n    <p>キズキは休憩所をぐるっと見回して言った。</p>\n    <p class=\"no-indent\">「最近リニューアルされたからね。前はもっと味気なかったよ」</p>\n    <p class=\"no-indent\">「よく知ってるな」</p>\n    <p class=\"no-indent\">「地元だからね」</p>\n    <p>そこで僕たちは、窓際の席に座ってコーヒーを飲んだ。外が寒かっただけに、コーヒーの温もりは体の芯にまで沁み渡った。</p>\n    <p class=\"no-indent\">「だけど、大丈夫だったのかな」</p>\n    <p class=\"no-indent\">「何が？」</p>\n    <p class=\"no-indent\">「いや、寮に連絡しなくてさ」</p>\n    <p>僕がコーヒーを啜りながらつぶやくと、キズキは大きく首を振った。</p>\n    <p class=\"no-indent\">「気にしなくていいよ。もし怒られたとしても、俺がうまく誤魔化しとくからさ」</p>\n    <p class=\"no-indent\">「誤魔化せるの？」</p>\n    <p>僕が気になって尋ねると、キズキは自信ありげにこちらを見つめた。</p>\n    <p class=\"no-indent\">「心配すんなって。それにいざとなったら、死んでもお前のこと守るから」</p>\n    <p class=\"no-indent\">「本当に？」</p>\n    <p class=\"no-indent\">「ああ、死んでも守るよ」</p>\n    <p>キズキは真剣な眼差しでこちらを見つめていた。僕はそのまっすぐな瞳をじっと見つめ、ふっと笑った。</p>\n    <p class=\"no-indent\">「どうして笑うんだよ」</p>\n    <p class=\"no-indent\">「いや、妙に真剣だったからさ」</p>\n    <p class=\"no-indent\">「当たり前だろ。俺はお前のこと想って言ってるんだぞ」</p>\n    <p class=\"no-indent\">「にしても、真剣すぎるって」</p>\n    <p>僕が笑うと、キズキもつられて笑った。代々木パーキングエリアの小さな休憩所で、僕たちは夜空を跳ね返すように高らかに笑った。</p>\n    <p class=\"no-indent\">「キズキは、やっぱり面白いね」</p>\n    <p class=\"no-indent\">「バカにするなよ。俺は大真面目なんだからな」</p>\n    <p class=\"no-indent\">「わかったわかった。でも、嬉しいよ。そう言ってくれて」</p>\n    <p class=\"no-indent\">「ったく、最初からそうやって言えばいいのに」</p>\n    <p class=\"no-indent\">「ごめんごめん」</p>\n    <p>休憩所は、びっくりするくらい静まり返っていた。僕たちはコーヒーを飲みながら、眼下の闇を泳ぐように走る車の光跡をじっと見つめた。</p>\n    <p class=\"no-indent\">「本音を言うとさ、今夜はお前と一緒にいたかったんだ」</p>\n    <p class=\"no-indent\">「えっ、それどういう意味？」</p>\n    <p>気になって尋ねると、キズキは目を逸らしながら声を出した。</p>\n    <p class=\"no-indent\">「邪魔されたくなかったんだよ、いろいろと」</p>\n    <p class=\"no-indent\">「邪魔されたくなかった？」</p>\n    <p class=\"no-indent\">「ああ、ふたりきりが良かったんだ」</p>\n    <p>そこでキズキは口をつぐんだ。僕はテーブルに肘をついて、キズキの横顔をじっと見つめた。</p>\n    <p class=\"no-indent\">「ふたりきりが良かった、か……」</p>\n    <p class=\"no-indent\">「何だよ」</p>\n    <p class=\"no-indent\">「いや、キズキもなかなかにロマンチストだなって」</p>\n    <p>僕がからかうように言うと、キズキは「お前ほどじゃないけどな」と言った。</p>\n    <p class=\"no-indent\">「それどういう意味？」</p>\n    <p class=\"no-indent\">「そのままの意味だよ」</p>\n    <p class=\"no-indent\">「つまり？」</p>\n    <p class=\"no-indent\">「生粋のロマンチストだってことだよ」</p>\n    <p>そう言うと、キズキは乾いた声で笑った。まるでカラカラの砂漠に一ヶ月ぶりの雨が降り注いだみたいだった。</p>\n    <p class=\"no-indent\">「さて、そろそろ行きたいんだが、その前に一つ寄りたいところがある」</p>\n    <p class=\"no-indent\">「寄りたいところ？」</p>\n    <p class=\"no-indent\">「ああ。一階の喫煙所なんだが」</p>\n    <p class=\"no-indent\">「喫煙所？」</p>\n    <p>僕が驚いて尋ねると、キズキは「行こう」と言って僕の手を引いた。</p>\n    <p>喫煙所は階段を降りて、建物を出たその先にあった。僕が喫煙所に近づくと、キズキがこちらに向かって手を振った。その手にはすでに二本の煙草とライターが握られていた。僕が喫煙所の中に入ると、キズキは手にしていた煙草を一本、こちらに渡した。</p>\n    <p class=\"no-indent\">「煙草の吸い方、わかるか？」</p>\n    <p>キズキはそう言いながら、手にしていた煙草を口に咥え、ライターで火をつけた。そして、ふーっと煙を吐いた。</p>\n    <p class=\"no-indent\">「一応、未成年なんだけど」</p>\n    <p>僕がつぶやくように言うと、キズキは僕の背中をぽんぽんと叩いた。</p>\n    <p class=\"no-indent\">「ものは試しさ。何事もやってみなければ始まらない」</p>\n    <p>そう言うと、キズキはにこりと笑った。まるで堕天使のウインクみたいに、蠱惑的な笑みだった。</p>\n    <p class=\"no-indent\">「大丈夫さ。バレることはないよ」</p>\n    <p class=\"no-indent\">「別にそこを心配してるわけじゃないんだけど」</p>\n    <p>僕が仕方なく煙草を口に咥えると、キズキはライターの炎をゆっくりとこちらに近づけてきた。</p>\n    <p class=\"no-indent\">「短く、力強く吸うんだ」</p>\n    <p>キズキに言われた通り、短く力強く吸うと、煙草の先端がぼおっと赤く燃えた。</p>\n    <p class=\"no-indent\">「そうしたら少しずつ煙を吸って、肺の中に入れるんだ」</p>\n    <p>言われた通りにすると、肺の中に煙が流れ込んでいくのが感じられた。</p>\n    <p class=\"no-indent\">「あとは吐き出すだけだ」</p>\n    <p>僕は言われた通り、口から煙を吐き出そうとした。しかし、煙が気管を通った瞬間、僕は激しく咳き込んでしまった。</p>\n    <p class=\"no-indent\">「大丈夫か？」</p>\n    <p>キズキが心配そうにこちらを見つめた。僕は手を上げて大丈夫であることを示した。</p>\n    <p class=\"no-indent\">「やっぱり、最初は咽せるよな」</p>\n    <p>そう言いながら、キズキは煙草をうまそうに吸った。</p>\n    <p class=\"no-indent\">「キズキはこれが美味いって感じるわけ？」</p>\n    <p class=\"no-indent\">「不味いと感じる方が正常だよ」</p>\n    <p>そこでキズキは自分が吸っていた煙草を灰皿に擦りつけた。そして僕が手にしていた煙草を手に取った。</p>\n    <p class=\"no-indent\">「吸ってもいいか？」</p>\n    <p>キズキの問いに、僕は一度頷いた。</p>\n    <p class=\"no-indent\">「じゃあ、ありがたくいただくよ」</p>\n    <p>そう言って、キズキは僕の煙草を気持ちよさそうに吸った。</p>\n    <p class=\"no-indent\">「おっ、こっちの方がうまいな」</p>\n    <p class=\"no-indent\">「えっ、違いがあるの？」</p>\n    <p>僕が驚いて尋ねると、キズキはニコッと笑ってから「さあな」と言った。</p>\n    <p>喫煙所を出たのは午前零時三十分だった。僕たちは空き缶を捨ててから、駐車場に停めてあった車に戻った。</p>\n    <p class=\"no-indent\">「さて、行きますか」</p>\n    <p>そう言って僕がエンジンをかけると、キズキが僕の肩をとんとんと叩いた。</p>\n    <p class=\"no-indent\">「なあ、アレってなんだろう？」</p>\n    <p class=\"no-indent\">「えっ、どれ？」</p>\n    <p>キズキの指差した方向を見ると、街路灯の上に真っ白な鳥がとまっていた。</p>\n    <p class=\"no-indent\">「えっ、何だろう……鳩？」</p>\n    <p class=\"no-indent\">「鳩にしては、嘴が尖りすぎてないか？」</p>\n    <p>確かに、言われてみれば尖りすぎていた。僕はその鳥をじっと見つめた。</p>\n    <p class=\"no-indent\">「あっ、でもよく見ると、鴉っぽくない？」</p>\n    <p>僕が目を凝らして言うと、キズキは「そうか？」と言いながら目を細めた。</p>\n    <p class=\"no-indent\">「ああ、でも言われてみれば確かに鴉っぽいな。だけど、体が白い鴉なんているか？」</p>\n    <p>キズキの問いに、僕はしばらく考えを巡らせた。</p>\n    <p class=\"no-indent\">「可能性としてあるのは、アルビノとか、白変種だよね」</p>\n    <p class=\"no-indent\">「白変種？」</p>\n    <p class=\"no-indent\">「ほら、ホワイトタイガーみたいなさ」</p>\n    <p class=\"no-indent\">「ああ、なるほどな」</p>\n    <p>そう言うと、キズキは楽しそうに白い鳥を見つめた。僕はハンドルに手を置きながら、キズキの横顔を眺めた。普段はあまり意識していなかったが、改めてキズキの横顔を見ると、その端正な顔立ちに驚かされた。すっと通った鼻筋や、長い睫毛の陰になる涼しげな目元は、まるで丁寧に削り出された彫刻のようだった。街灯の光を浴びて透き通るような彼の肌を見ていると、触れれば壊れてしまいそうな危うささえ感じられる。</p>\n    <p>僕がそんな美しい見目形に心を奪われていると、キズキが眉間に皺を寄せて、こちらを見つめた。</p>\n    <p class=\"no-indent\">「どうしたんだよ？」</p>\n    <p>鼻梁を境に、キズキの顔が光と闇に塗り分けられている。僕は視線を逸らすことなく、ただその美しい顔立ちに圧倒された。</p>\n    <p class=\"no-indent\">「いや、なんか綺麗だなって思ってさ」</p>\n    <p class=\"no-indent\">「綺麗？」</p>\n    <p>キズキの問いに、僕は一度頷いた。そして、ぐーっと体を伸ばした。</p>\n    <p class=\"no-indent\">「そろそろ行こうよ。もう用は済んだんだし」</p>\n    <p class=\"no-indent\">「いや、でもあの鳥、気にならないか？」</p>\n    <p class=\"no-indent\">「確かに鳥は気になるけど、いつまでもここにいるわけにはいかないだろ？」</p>\n    <p>僕がさとすように言うと、キズキは「まあ、そうだな」と言った。</p>\n    <p class=\"no-indent\">「じゃあ、行くけどいい？」</p>\n    <p>僕の問いに、キズキは「いいよ」と頷いた。そこで僕は車を発進させ、本線に合流した。</p>\n</div>\n\n  <div class=\"section\" id=\"ch5\">\n    <h2 class=\"section-title\">第五話：生きる希望も、死ぬ勇気もない。</h2>\n    <p>店内の空気は冷えたアクアビットのようにキリッと澄んでいた。白シャツにベストを着たバーテンダーが、まるで僕たちの存在を風景の一部としか思っていないかのように、黙々とカクテルシェイカーを振っている。やがてその硬質な音が止むと、店内の沈黙はよりいっそう深まった。僕たちの拙い影だけが、暗い壁に長く伸びていた。トヲルが声を出したのは、僕が四杯目のウイスキーに口をつけ、トヲルがギムレットを頼んだ時のことだった。</p>\n    <p class=\"no-indent\">「なあ」</p>\n    <p class=\"no-indent\">「ん？」</p>\n    <p class=\"no-indent\">「人間ってさ、死にたいって思ったら死ねるものなのか？」</p>\n    <p>抑揚のないひんやりとした声だった。僕はその問いに、少し間を置いてから答えた。</p>\n    <p class=\"no-indent\">「死にたいと思って死ねるなら、人類はとっくに滅亡しているよ。みんな、死ねないから生きているだけさ」</p>\n    <p class=\"no-indent\">「お前は死にたいって思ったことはあるのか？」</p>\n    <p>孤独な僕たちの心に、沈黙が沁み込んでいく。僕はウイスキーを一口飲み、息を吐いた。</p>\n    <p class=\"no-indent\">「高校生ぐらいのときは毎日思ってたよ。あの頃は、生きているのがただただ辛かった」</p>\n    <p class=\"no-indent\">「それでも死ねなかった？」</p>\n    <p>氷河の一片のような鋭い眼差しで、トヲルは僕を見つめた。僕はその問いについて、考えた。</p>\n    <p class=\"no-indent\">「死ねなかった。ナイフで手首を切ろうとしたときも、ロープで首を吊ろうとしたときも、やっぱりダメだった。どうしようもなく怖いんだ。死んで、全てをパチンするのがさ」</p>\n    <p class=\"no-indent\">「そうか」</p>\n    <p>生きる希望も、死ぬ勇気もなかった。それが、ただ辛かった。</p>\n    <p class=\"no-indent\">「アイツは、怖くなかったのかな」</p>\n    <p class=\"no-indent\">「きっと、怖かったはずさ。でもそれ以上に生きることが怖かったんだよ」</p>\n    <p class=\"no-indent\">「……怖い、か」</p>\n    <p>トヲルは深くため息をついて、ポケットから煙草を取り出した。しかし、トヲルは手にした煙草を一向に口にしなかった。</p>\n    <p class=\"no-indent\">「アイツの葬式、覚えてるか？」</p>\n    <p>僕はその言葉を聞いて、キズキの葬式を思い出した。</p>\n    <p class=\"no-indent\">「覚えてるよ。忘れられないさ」</p>\n    <p>親族以外でキズキの葬式に訪れたのは、僕とトヲルだけだった。葬式のときに知ったことだが、キズキは僕たち以外に友人がいなかった。</p>\n    <p class=\"no-indent\">「アイツの母親、棺桶にしがみつきながら泣き崩れてさ。正直、見てるのも辛かったよ」</p>\n    <p class=\"no-indent\">「でも、安らかに眠っていたよね」</p>\n    <p class=\"no-indent\">「ああ。ほんと、全てを果たしたように眠っていた」</p>\n    <p>キズキの死顔は驚くほど穏やかだった。それはまるで昼寝をする猫のようだった。</p>\n    <p class=\"no-indent\">「そういえばあのとき、俺たち最後まで火葬場にいなかったよな」</p>\n    <p>僕はその言葉を聞いて、当時のことを思い出した。確かに、僕たちはあの日、最後まで火葬場にいなかった。</p>\n    <p class=\"no-indent\">「確か、アイツが火葬炉に運ばれていくのを見送ったあと、適当な理由をつけて火葬場から抜け出したんだよな」</p>\n    <p class=\"no-indent\">「そうだったね」</p>\n    <p>線香のきつい臭いに、親族の咽び泣く声、僧侶のお経に、数珠の擦れる音。その全てに嫌気が差した僕たちは、キズキが火葬炉に運ばれたのを見送ったあと、適当な理由をつけて火葬場を後にした。</p>\n    <p class=\"no-indent\">「そして骨を拾うかわりに、火葬場の煙突がよく見える丘に登った」</p>\n    <p>風がゆるやかに駆け抜ける、静かな丘だった。僕たちはそこでキズキが焼かれて、煙になって空へと舞い上がる姿をじっと見つめた。一筋の光のようになって天に昇っていく姿は不思議と美しかった。だけど、それがキズキを焼いた煙だとは到底思えなかった。</p>\n    <p class=\"no-indent\">「あのとき、お前言ってたよな。『まるで天国に向かって昇っているみたいだ』って」</p>\n    <p class=\"no-indent\">「そんなこと言ったっけ？」</p>\n    <p class=\"no-indent\">「言ってたよ。覚えてないのか？」</p>\n    <p>それについて僕は思いを巡らせた。十年も前のことだ。情景を思い出すだけで精一杯だ。</p>\n    <p class=\"no-indent\">「ごめん、覚えてないや」</p>\n    <p>僕が首を振ると、トヲルは小さく息をついてからギムレットを飲んだ。</p>\n    <p class=\"no-indent\">「俺、結構その言葉に救われてたんだよ」</p>\n    <p class=\"no-indent\">「救われてた？」</p>\n    <p>トヲルはその問いに頷き、手にしていた煙草を口に咥えた。そしてポケットからライターを取り出して火をつけた。</p>\n    <p class=\"no-indent\">「何というか、これでいいんだって思えたんだよ。もちろんアイツが死んだことはものすごくつらかったよ。でも、アイツが天国に行くことで楽になれるなら、それでいいんじゃないかって思えたんだ」</p>\n    <p class=\"no-indent\">「つまり僕の言葉がきっかけで、キズキの死を受け入れられたってこと？」</p>\n    <p>僕の問いにトヲルは一度だけ頷いた。硬く、重たい扉をこじ開けるような頷きだった。</p>\n    <p class=\"no-indent\">「そっか……それは良かったよ」</p>\n    <p>そこで僕はウイスキーを飲んだ。ほんの些細な一言でも、人は救われるのだ。</p>\n    <p class=\"no-indent\">「だからさ、俺は感謝してるんだ。あのとき、お前がああ言ってくれたことに」</p>\n    <p class=\"no-indent\">「そんな、感謝されるようなことはしてないよ」</p>\n    <p>僕がそう言うと、トヲルは首を振ってギムレットを飲んだ。そして灰皿のふちをなぞって、こちらを向いた。</p>\n    <p class=\"no-indent\">「俺にとっては感謝するべきことなんだよ。だってお前があのとき、あんなふうに言ってくれなかったら、俺は今、ここにいなかったかもしれないんだから。そういう可能性だって否定はできないだろ？」</p>\n    <p>その言葉にハッとなって顔を上げると、トヲルは憂いを帯びた瞳でこちらを見ていた。</p>\n    <p class=\"no-indent\">「俺が今ここにいるのは、お前のおかげなんだ。だからお前には心から感謝してるんだよ。本当に、ありがとう」</p>\n    <p>そこでトヲルは不器用に笑った。その笑みに何と声をかけてあげればいいのか、僕にはよくわからなかった。</p>\n</div>\n\n  <div class=\"section\" id=\"ch6\">\n    <h2 class=\"section-title\">第六話：羽田空港</h2>\n    <p>羽田近くに着いたのは、代々木パーキングエリアを出てから十五分ほど経った頃のことだった。</p>\n    <p>僕たちは路肩に車を停め、羽田空港が一望できる公園に向かった。真夜中ということもあり、公園には僕たち以外には誰もいなかった。外灯もまばらで、外灯と外灯の間には深い闇が横たわっていた。僕たちはそんな闇の中を歩きながら、真っ暗な海を見つめた。</p>\n    <p class=\"no-indent\">「何も見えないね」</p>\n    <p class=\"no-indent\">「まあ、夜だからな」</p>\n    <p class=\"no-indent\">「でも、星は少し見えるね」</p>\n    <p class=\"no-indent\">「ああ、そうだな」</p>\n    <p>僕たちはそれからしばらくの間、目の前に横たわる巨大な闇をじっと見つめていた。海からは夜の香りを孕んだ風が吹きつけていた。星はまばらに輝き、時折こぼれ落ちるように瞬いた。まるで巨大な怪物が口を開けてこちらを待っているようだった。冬の海岸は凍てつくように冷たく、寒さは体の芯にまで襲いかかってきた。</p>\n    <p class=\"no-indent\">「なんか、色々と思い出すな」</p>\n    <p class=\"no-indent\">「思い出す？」</p>\n    <p>僕の問いに、キズキは一度頷いた。そしてポケットから煙草の箱とライターを取り出した。</p>\n    <p class=\"no-indent\">「高校生のときに、夜な夜な短編集を書いていたんだ。そのときのことを、ふと思い出してさ」</p>\n    <p class=\"no-indent\">「へえ、なんて短編集？」</p>\n    <p class=\"no-indent\">「『月を喰らうもの』っていう短編集だよ」</p>\n    <p class=\"no-indent\">「『月を喰らうもの』」</p>\n    <p>僕はそのタイトルを口に出して繰り返してみた。</p>\n    <p class=\"no-indent\">「何篇くらいあるの？」</p>\n    <p class=\"no-indent\">「原稿用紙五十枚くらいの短編が、全部で三十篇くらいあるんだ」</p>\n    <p class=\"no-indent\">「超大作だね」</p>\n    <p class=\"no-indent\">「ああ。書くのに三年かかったよ」</p>\n    <p>そう言って、キズキは苦笑した。</p>\n    <p class=\"no-indent\">「中でも一番気に入っているのが、表題作の『月を喰らうもの』だ」</p>\n    <p class=\"no-indent\">「どんな話なの？」</p>\n    <p>僕が気になって尋ねると、キズキはちらっとこちらを見てから煙草を口に咥えた。</p>\n    <p class=\"no-indent\">「貴族の召使として働く女の子の、悲しい恋の物語だよ」</p>\n    <p class=\"no-indent\">「悲しい恋の物語？」</p>\n    <p class=\"no-indent\">「ああ。悲しい哀しい恋の物語さ」</p>\n    <p>そこでキズキはライターで煙草の先端に火をつけた。夜空の片隅には白い月が美しく冴えて光っていた。</p>\n    <p class=\"no-indent\">「えっ、でもちょっと面白そう。ねえ、よかったらあらすじ聞かせてよ」</p>\n    <p>僕がそう言うと、キズキは、「あまり明るい話じゃないけど、いいか？」と尋ねてきた。</p>\n    <p class=\"no-indent\">「全然いいよ。むしろキズキの書いた話、気になる」</p>\n    <p>僕の言葉にキズキは一度頷いた。そして煙草の先端を叩いて灰を落とした。</p>\n    <p class=\"no-indent\">「物語は主人公のルナが、テラという貴族の屋敷を掃除していたときに、美しい少年ルシウスに出会うところから始まるんだ」</p>\n    <p>キズキはそこで一息つき、ゆっくりと物語を語っていった。</p>\n    <p class=\"no-indent\">「ルシウスは眉目秀麗という言葉がぴったりな青年で、貴族の中で最も人気があった。ルナはひと目でそんなルシウスの虜になり、何とか自分の存在に気づいてもらおうと必死になる。でも、ルシウスは一向にルナの好意に気づかない。それどころかルシウスは、ルナの主人であるテラのことを好きになってしまう。自分は美しくないのだ、そう失望するルナ。しかし、月蝕の夜、ふたりは舞踏会の場で偶然一緒になる。ルナはルシウスを外に連れ出し、そこで月蝕を見せる。そしてこう言う。『月蝕がどのような仕組みで起こるか知っていますか』と。ルシウスは『知らない』と答える。するとルナはこう言うんだ。『月蝕は地球の影の中を、月が通過することによって起こるのです』と。ルシウスは『君、物知りなんだね』と言う。するとルナは今にも泣き出しそうな顔で、こう言うんだ。『あなたはいつも美しい星を見つめている。今宵の月のように私はその陰に隠れている。あなたは太陽のように美しい』って。だけど意味がわからなかったルシウスは『君が何を言っているのか、さっぱりわからないよ』とルナに言った。そして続けて『テラがどこにいるか知らないかい？』と尋ねるんだ。そこでルナは舞踏会から逃げ出してしまった。ルシウスはルナを追いかけたが、途中でテラに声をかけられて追うのをやめてしまう。ルナはひとり、どこまでも走り続ける。気づくと、ルナは森の奥深くにいた。そこでルナは膝をつき、暗い月を見つめながら、ひとりわんわんと泣いた。すると森の奥から葉がこすれる音が聞こえたんだ。驚いて辺りを見回すと、そこには黒いマントを羽織った骸骨がいた」</p>\n    <p class=\"no-indent\">「骸骨？」</p>\n    <p class=\"no-indent\">「ああ。骸骨は右手に大きな鎌を持ち、左手には青い炎が灯ったランタンを持っていた。ルナが驚いていると、骸骨はルナの前まで行き、自分が死神であることを告げた。そして死神は、大きな鎌と青い炎が灯ったランタンを差し出して、こう言った。『あなたは生と死の狭間に迷い込んだ。私があなたを救ってあげましょう』と。ルナが『救う？』と尋ねると、死神は大きく頷いた。そしてこう言った。『ここにあるのは命を刈り取る鎌と、現世に帰るためのランタンです。鎌を選べばあなたは冥界へと誘われます。ランタンを選べばあなたは現世へと戻れます。さあ、あなたはどちらを選びますか？』と。ルナはしばらく迷ってから、大きな鎌を手に取った。そしてこう言った。『もうこの世に生きている意味などないわ。だからこの鎌で私の命を刈り取って』と。死神はルナの選択に一度だけ頷いた。そしてランタンの炎をふっと息で消した。死神は鎌を手にし、大きく構える。ルナは恐ろしく澄んだ瞳で、夜空の月を見つめている。そこで物語は終わる」</p>\n    <p class=\"no-indent\">「えっ、終わり？」</p>\n    <p>僕が驚いて声を出すと、キズキはその問いに頷いた。</p>\n    <p class=\"no-indent\">「これで終わりだ。ルナがその後どうなったのかは描いていない」</p>\n    <p>そう言って、キズキは煙草を一気に吸い込んだ。</p>\n    <p class=\"no-indent\">「この終わり方にしたのには一応理由があるんだが、それは話すと長くなるから、また今度話すよ」</p>\n    <p class=\"no-indent\">「…そう、ありがとう」</p>\n    <p>そこで僕たちはしばらくの間黙った。キズキは煙草を地面に落とし、足で踏み消した。僕は夜空に浮かぶ白い月を、じっと見つめた。</p>\n    <p class=\"no-indent\">「でも、何だか切ない話だね」</p>\n    <p class=\"no-indent\">「切ない？」</p>\n    <p class=\"no-indent\">「だってルナは月蝕の夜に、自らを月と重ね合わせて愛を伝えたんだよ。でも、ルシウスはテラのことばかりを考えていて、ルナの言葉の真意に気づかなかった。ルナが言った『あなたは太陽のように美しい』って言葉が、なんとも胸を締めつけるよ」</p>\n    <p>僕がそう言うと、キズキは「だよな」と言って目を伏せた。氷塊のように透き通った顔立ちが、柔らかな月の光に照らされていた。</p>\n    <p class=\"no-indent\">「俺がこの作品を描く上で意識したのは、太陽系をモチーフにすることなんだ。実際にこの作品に出てくる登場人物は全て、太陽系がモチーフになっている。主人公のルナは密やかに光り輝く月を象徴していて、ルシウスはいくつもの惑星を引き寄せる太陽を象徴している。そしてテラは美しい星、地球を象徴している。ルシウスを中心とした恋心を公転という形で表現し、それぞれの登場人物が生きることを自転という形で表現する。そうやって文学と天文学を結びつけて描いたんだ」</p>\n    <p>僕はキズキの解説を踏まえた上で、もう一度物語を思い返してみた。</p>\n    <p class=\"no-indent\">「本当だ。確かに太陽系がモチーフになってる。でもタイトルの『月を喰らうもの』って何なの？」</p>\n    <p>僕が気になって尋ねると、キズキは手にしていたライターをカチンと閉めてから声を出した。</p>\n    <p class=\"no-indent\">「実はこの小説、英語で書いたんだよ」</p>\n    <p class=\"no-indent\">「英語で？」</p>\n    <p class=\"no-indent\">「ああ。そっちの方が描いていて、すっと身に馴染んだからな」</p>\n    <p>そこでキズキは一息ついた。僕は英語で小説を描くキズキの姿を思い浮かべてみた。全く、想像がつかない。</p>\n    <p class=\"no-indent\">「それもあって日本語の題名は『月を喰らうもの』になっているんだが、原文、つまり英語での題名は『エクリプス』になっているんだ。エクリプスは主に天文学で使われる用語で、日蝕や月蝕の『蝕』を意味する言葉だ。『蝕』とは、一つの天体が他の天体を遮ることを言う。俺は物語の中で、ルナがテラに遮られるところを強調して描いた。その遮っているテラのことを、俺は『エクリプス』と表現したんだ。そしてその意図を汲み取った上で和訳したのが、『月を喰らうもの』という題名なんだよ」</p>\n    <p>そう言って、キズキは何度か咳払いをした。僕は緻密に練られた作品の構成に感嘆した。</p>\n    <p class=\"no-indent\">「でも、ひとつ気になるんだけど、キズキはなんでルナじゃなくて、テラのことをタイトルにしたの？」</p>\n    <p>僕の問いに、キズキはうーんと唸った。</p>\n    <p class=\"no-indent\">「それはうまく言葉にできないな。ただ、俺は別にルナの失恋を描きたかったわけじゃないんだ。俺が本当に描きたかったのは、テラという存在の無意識の邪悪さなんだよ」</p>\n    <p class=\"no-indent\">「無意識の邪悪さ……」</p>\n    <p>僕はその言葉の意味を噛み砕くために、しばらく黙った。</p>\n    <p>あたりには冷たい潮の香りが広がっていた。その匂いには、どことなく死の気配が漂っていた。</p>\n    <p class=\"no-indent\">「ちなみに、どういう経緯で『月を喰らうもの』を描こうとしたの？」</p>\n    <p>僕が気になって尋ねると、キズキは少し間を置いてから声を出した。</p>\n    <p class=\"no-indent\">「さっき居酒屋で、好きな人がいるって話をしただろ？　実は高校時代も好きだった人がいたんだよ。そして、俺とその人の関係も、まさに『月蝕』そのものだったんだ。俺は月で、その人は太陽。だけど、その人には他に好きな人がいた。いわば地球だ。俺はいつも、その地球の影に隠れている。わかるか？」</p>\n    <p class=\"no-indent\">「まあ、なんとなくね」</p>\n    <p class=\"no-indent\">「だからさ、俺は自分自身の報われない気持ちを昇華するために、物語を描いたんだ。ルナの台詞でこんなものがある。『私のことを好きじゃないところ以外、私はルシウスのことが全部好きだ』まさに、その通りなんだよ。俺はその好きな人が、自分のことを好きじゃないところ以外、全部好きだった。だけど、その状態では、どれだけ想っても意味はない。愛とは受け取ってもらわなければ意味がないんだ。一方的な愛ほど、虚しいものはない」</p>\n    <p>そこでキズキは静かに息をついた。僕はちらっとキズキの姿を見てから、前を向いた。</p>\n    <p class=\"no-indent\">「僕は、一方的な愛も美しいと思うよ」</p>\n    <p class=\"no-indent\">「えっ？」</p>\n    <p>キズキが驚いたようにこちらを見つめた。その瞳には夜空のすべてが映っていた。</p>\n    <p class=\"no-indent\">「というか、美しい愛は大抵一方通行なんだよ」</p>\n    <p class=\"no-indent\">「一方通行……」</p>\n    <p>キズキはその言葉を、ゆっくりと繰り返した。まるで言葉の響きを確かめるように。</p>\n    <p class=\"no-indent\">「まあ、報われるに越したことはないんだけどね」</p>\n    <p>僕がつぶやくように言うと、キズキは「そうだよな」と言って息をついた。</p>\n    <p class=\"no-indent\">「少し歩こう。夜風に当たりたい」</p>\n    <p class=\"no-indent\">「ああ、いいよ」</p>\n    <p>それから僕たちは、ただ果てのない闇の中を歩き続けた。闇はどこまでも遠くまで広がり、どこまでも深かった。まるで世界の深淵が、すぐそこで口を開けているようだった。本当に、暗く、静かな夜だった。</p>\n</div>\n\n  <div class=\"section\" id=\"ch7\">\n    <h2 class=\"section-title\">第七話：煙みたいなやつだった。</h2>\n    <p>カウンターに置かれた灰皿からは、細い煙が一本の線となって天井へ昇っていた。外を走る車のヘッドライトが、ブラインドの隙間から時折まぶしくカウンターを横切っていった。トヲルが声を出したのは、僕が六本目の煙草に火をつけた時のことだった。</p>\n    <p class=\"no-indent\">「『あるものは断ち切られたようにふっと消え去り、あるものはゆっくりと霞むように消えていく』」</p>\n    <p class=\"no-indent\">「キズキの言葉？」</p>\n    <p class=\"no-indent\">「キズキの書いた詩の一節だよ」</p>\n    <p>そう言ってトヲルはバラライカを飲んだ。僕はウイスキーを飲みながら、その言葉を何度か頭の中で繰り返した。</p>\n    <p class=\"no-indent\">「でも、キズキってどことなく儚かったよね」</p>\n    <p class=\"no-indent\">「ああ。煙みたいなやつだった」</p>\n    <p>目にかかるくらい伸びた艶やかな髪に、湖底のように澄んだ瞳。右耳にだけつけた黒いピアスに、彫刻刀のように鋭く尖った鼻梁。そして陶器のように冷たさを帯びた白い肌。それらは途方もない遺伝子の配列の果てに生まれ、刹那的な輝きを放っていた。</p>\n    <p class=\"no-indent\">「そして本当に煙みたいに消えてしまった」</p>\n    <p>僕はトヲルの言葉に頷き、煙草を吸った。風に揺られるように、キズキは消えてしまった。</p>\n    <p class=\"no-indent\">「俺はさ、初めてアイツに会った時ゾッとしたんだ。何というか、世界の秘密を覗き見たような気分だった」</p>\n    <p class=\"no-indent\">「世界の秘密？」</p>\n    <p>気になって尋ねると、トヲルはグラスのふちを指でなぞってからこちらを見つめた。</p>\n    <p class=\"no-indent\">「とにかく、存在そのものに衝撃を受けたんだ。こんなにも美しいものがこの世にあるのかってさ」</p>\n    <p class=\"no-indent\">「確かに、キズキは美しかったよね」</p>\n    <p class=\"no-indent\">「ああ。でもそれは世間一般の言う美しさとは少し違った」</p>\n    <p class=\"no-indent\">「というと？」</p>\n    <p class=\"no-indent\">「何というか、アイツの美しさは見た人の心の一番デリケートな部分を揺さぶるんだ。それは、とても激しく」</p>\n    <p>確かに、キズキの美しさには見た人の心に強く訴えかけるようなものがあった。それは間違いない。</p>\n    <p class=\"no-indent\">「でも、その美しさは長くは続かなかった」</p>\n    <p>僕はトヲルの言葉に一度だけ頷いた。どれだけ美しいものも、いつかは尽き果てる。</p>\n    <p class=\"no-indent\">「アイツが死んでしまったことによって、アイツの美しさは永遠に失われてしまった。そしてアイツが心のうちに秘めていた想いも、アイツが死んでしまったことによって永遠に秘められてしまった」</p>\n    <p>僕はその言葉に頷いて、キズキの心に思いを巡らせた。たくさんの秘密を残したままキズキは死んでしまった。キズキが抱いていた想いは永遠に秘められたまま、今もこの世界を彷徨している。</p>\n    <p class=\"no-indent\">「きっと僕たちは、キズキの心にもっと踏み込んでいくべきだったんだよ」</p>\n    <p class=\"no-indent\">「踏み込む？」</p>\n    <p>僕はその問いに頷き、煙草を吸った。</p>\n    <p class=\"no-indent\">「キズキはいつも優しかったけど、心の奥底には誰にも触れられたくない領域を持っていた。僕たちもそれには気づいていたけど、無理に踏み入ろうとはしなかった。だけど、その領域にこそキズキの本当の姿があったんだよ。キズキの苦悩が、痛みがそこにはあった。僕たちはきっと無理にでもその領域に踏み込むべきだったんだよ。たとえキズキが嫌がっても、そこに本当のキズキがあるんだから」</p>\n    <p class=\"no-indent\">「……本当のキズキか」</p>\n    <p>そこでトヲルはバラライカを飲み、息をついた。僕も煙草を吸い、煙を吐いた。どのようにキズキと接していたら、キズキを救えたのだろう。どのようにキズキと向き合っていたら、キズキを救えたのだろう。僕たちはただ、答えのないそんな問いに思いを巡らせた。</p>\n</div>\n\n  <div class=\"section\" id=\"ch8\">\n    <h2 class=\"section-title\">第八話：海ほたる</h2>\n    <p>車に戻った僕たちは、その後羽田から海ほたるに向かった。海ほたるは東京湾に浮かぶパーキングエリアで、展望デッキなどもあるれっきとした観光スポットだった。僕もキズキも海ほたるに行くのは初めてで、アクアラインを車で走るのも初めてだった。羽田から海ほたるに行く場合は、アクアトンネルと呼ばれる海底トンネルを通る必要があり、僕たちはそこで生まれて初めて海底トンネルを通った。</p>\n    <p class=\"no-indent\">「海底トンネルってのは、人類の叡智の結晶だな」</p>\n    <p class=\"no-indent\">「確かに、そうだね」</p>\n    <p>海底トンネルとは言ったものの、実際に海底が見えるようになっているわけではないので、ただのトンネルと何ら変わりはなかった。それでも海底を走っていると思うと、なんだか不思議な気持ちがするものだった。</p>\n    <p class=\"no-indent\">「ここを抜けたら人工島なんだよな？」</p>\n    <p class=\"no-indent\">「うん、そうらしいね。そしてその人工島に海ほたるパーキングエリアがある感じだね」</p>\n    <p>僕がカーナビを見ながら言うと、キズキは「なるほどな」と言って窓の外を見つめた。</p>\n    <p>トンネルの明かりによって、キズキの顔にはいくつもの陰影ができている。</p>\n    <p class=\"no-indent\">「にしても、すごいよな。海底にトンネルを掘って東京と房総半島を繋げようって言うんだから。発想がすごい」</p>\n    <p class=\"no-indent\">「でも、遠回りしなくて済むから楽だよね」</p>\n    <p class=\"no-indent\">「ああ。ほんと、人間はすごいよ」</p>\n    <p>そんなことを言っているうちに、トンネルを抜けることができた。トンネルを抜けたらすぐに、海ほたるパーキングエリアだった。</p>\n    <p>夜中ということもあり、海ほたるパーキングエリアの駐車場はびっくりするくらい空いていた。それでも数台は車があったので、何人かは今の時間でもこの場所を訪れているようだった。</p>\n    <p>車を降りてパーキングエリアの中に入ってみたものの、お店は軒並み閉まっており、施設の中は非常に閑散としていた。</p>\n    <p class=\"no-indent\">「まあ、もう夜中の二時だからね」</p>\n    <p class=\"no-indent\">「それもそうか。じゃあ、外でも見に行こう」</p>\n    <p>仕方なく外に出てみると、風がとても強く、僕は思わず「寒っ」と声を出してしまった。</p>\n    <p class=\"no-indent\">「あっ、でもすごいね。夜景が綺麗だよ」</p>\n    <p class=\"no-indent\">「ああ、ほんとだ」</p>\n    <p>目の前には海上を走る車の光跡が無数に見え、その奥には千葉の街の輝きが夜の闇に淡く滲んでいた。</p>\n    <p class=\"no-indent\">「こんなに眺めがいいなんて知らなかったよ」</p>\n    <p class=\"no-indent\">「ほんとだな」</p>\n    <p>東京方面が海底トンネルなのに対して、千葉方面はアクアブリッジと呼ばれる大きな橋が架けられていた。そのため海上にはいくつもの車の光跡が闇に浮かんで見えた。それらはまるで光の帯となって、海を回遊する夜光虫のようにも見えた。</p>\n    <p class=\"no-indent\">「こっちからは東京の夜景が見えるよ」</p>\n    <p class=\"no-indent\">「ああ、ほんとだ」</p>\n    <p>千葉とは反対の方角を向くと、そこには東京のビルの輝きが夜の闇を力強く跳ね返していた。東京方面は海底トンネルということもあり、千葉方面よりもはっきりと夜景が見えた。本当に、驚くほど綺麗な眺めだった。</p>\n    <p class=\"no-indent\">「こういう景色を見てるとさ、何だか救われた気持ちになるね」</p>\n    <p class=\"no-indent\">「救われた気持ち？」</p>\n    <p>僕はその問いに頷き、ポケットに手を突っ込んだ。</p>\n    <p class=\"no-indent\">「だって、この世界に本当の暗闇なんてないんだって、知ることができるから」</p>\n    <p class=\"no-indent\">「どういうこと？」</p>\n    <p>不思議そうに尋ねるキズキをよそに、僕はポケットから手を出して東京の夜景を指差した。</p>\n    <p class=\"no-indent\">「星が見えなければ、地表は明るい。地表が見えなければ、星は明るい。僕たちはこの世界にいる限り、本当の暗闇を知ることはできないんだ」</p>\n    <p class=\"no-indent\">「本当の暗闇……」</p>\n    <p class=\"no-indent\">「僕はこういう景色を見ていつも思うんだ。本当の暗闇がないように、本当の絶望などない。どんなときにも希望は残っている、ってね」</p>\n    <p class=\"no-indent\">「……希望、か」</p>\n    <p>キズキはそう言うと、暗い海の彼方に見える夜景をじっと見つめた。僕もキズキと同じように、海の向こう側にある夜景を見つめた。</p>\n    <p class=\"no-indent\">「どんな絶望に立たされていようとも、希望は残っている。そんなことをこの世界が教えてくれているような気がするんだ」</p>\n    <p class=\"no-indent\">「そうだと、いいな」</p>\n    <p>そこまで言って、僕たちは黙った。冷たい風が激しく体に吹きつけている。風に吹かれてキズキの繊細な髪がさらさらと揺れている。僕たちはただ、海の遠く彼方にあるビルの光を見つめ、そこにある希望にすがりついた。</p>\n</div>\n\n  <div class=\"section\" id=\"ch9\">\n    <h2 class=\"section-title\">第九話：不公平な神より、平等な死を望む。</h2>\n    <p>それからトヲルが声を出したのは、僕が七本目の煙草に火をつけ、トヲルがギムレットを口にした時だった。</p>\n    <p>あたりを見回すと、もう僕たち以外に客はいなかった。</p>\n    <p class=\"no-indent\">「『俺は不公平な神より、平等な死を望む』」</p>\n    <p class=\"no-indent\">「キズキの言葉？」</p>\n    <p>僕が尋ねると、トヲルはああと頷いてギムレットを飲んだ。</p>\n    <p class=\"no-indent\">「『不公平な神に従うくらいなら、死んだ方がマシだ』ってことらしいよ」</p>\n    <p class=\"no-indent\">「死んだ方がマシ、か……でもキズキはよく神を批判してたからね。何となく言ってるところは想像できるよ」</p>\n    <p>キズキは神を憎み、ニーチェを愛していた。『神は死んだ』というニーチェの名言は、キズキの座右の銘でもあった。</p>\n    <p class=\"no-indent\">「『この世界は理不尽で不条理に満ちている。もしこれが神の生み出した世界だとするなら、神はとんだクソ野郎だ』って」</p>\n    <p class=\"no-indent\">「ああ、言ってたね」</p>\n    <p>キズキは事あるごとに神を批判した。そしてニーチェの語録を愛読していた。</p>\n    <p class=\"no-indent\">「クソ野郎ってのが、いいよな」</p>\n    <p>そう言ってトヲルは苦笑した。僕も思わず苦笑してしまった。</p>\n    <p class=\"no-indent\">「でも神に比べれば死は平等だよね」</p>\n    <p class=\"no-indent\">「まあ、そうだな」</p>\n    <p>貧乏も、金持ちも皆等しく死ぬ。地球の裏側や宇宙の果てに逃げたって、死からは逃れられない。</p>\n    <p class=\"no-indent\">「『この世に完璧なものなどない。ただ一つ死を除いて』」</p>\n    <p class=\"no-indent\">「キズキが言ってたの？」</p>\n    <p class=\"no-indent\">「ああ。死は完璧なんだってさ」</p>\n    <p class=\"no-indent\">「完璧か……」</p>\n    <p>キズキは時々独特な表現を使った。キズキらしいといえばその通りだが、それはときに奇妙な余韻をあとに残した。</p>\n    <p class=\"no-indent\">「でも、やっぱり思うんだよ。アイツには神という救済が必要だったんじゃないかって」</p>\n    <p class=\"no-indent\">「救済？」</p>\n    <p>トヲルはその問いに頷いて、じっとこちらを見つめた。今にも吸い込まれてしまいそうな瞳だった。</p>\n    <p class=\"no-indent\">「『神を信じていれば救われる？　そんなバカな話あるわけないだろ』ってアイツはよく言ったよな。でも、この世界では現に何十億もの人が神を信仰している。そして信仰することで救われると考えている。確かに根拠はないさ。でもこれほど多くの人々が神を信仰しているんだ。バカな話ってことはないだろ？」</p>\n    <p class=\"no-indent\">「まあ、確かに」</p>\n    <p class=\"no-indent\">『神は死んだ』とニーチェが宣言してもなお、人々は神を信仰している。それは紛れもない事実だ。</p>\n    <p class=\"no-indent\">「それに何よりこの世界は虚しい。生まれてもいずれ死ぬ。死ねば全てのものを失う。極論、生きていることには何の意味も、価値もない。それは生きている身からすれば、あまりにも残酷なことだ。救いを求めるのも、無理はない」</p>\n    <p>確かに、この世界は虚しい。どれだけ必死に生きたって、死ねばそれで全て終わる。死ねばそれで全て失われる。</p>\n    <p class=\"no-indent\">「だからこそ、俺は神を信仰することには大いなる意味があると思う」</p>\n    <p class=\"no-indent\">「大いなる意味」</p>\n    <p class=\"no-indent\">「そして神を信仰することには大いなる価値があると思う」</p>\n    <p class=\"no-indent\">「大いなる価値」</p>\n    <p>そこまで言ってトヲルはギムレットを口にした。僕も煙草を吸い、煙を吐き出した。</p>\n    <p class=\"no-indent\">「でも、アイツは神に頼らなかった。そして死んだ。でも死っていうのもある意味では救済なんだよ。だって死ねばあらゆる物事から解放されるからな。それは救済とも捉えられる。アイツは神という救済を捨てて、死という救済に縋ったんだ」</p>\n    <p>そこでトヲルはぎゅっとグラスを握った。照明に照らされて、ギムレットが滑らかに輝いている。</p>\n    <p class=\"no-indent\">「結局アイツは死ぬことでしか救われなかった。俺たちはどうすることもできなかった」</p>\n    <p>悲哀に満ちた声だった。それでもトヲルは一度としてキズキの死を否定はしなかった。</p>\n    <p class=\"no-indent\">「……そういえば、お前に見せたいものがあったんだ」</p>\n    <p class=\"no-indent\">「見せたいもの？」</p>\n    <p class=\"no-indent\">「ああ」</p>\n    <p>そう言って、トヲルは胸ポケットから一枚の紙を取り出して僕に渡した。</p>\n    <p class=\"no-indent\">「この前、キズキのお母さんに会ったとき貸してくれたんだ。キズキの部屋を整理していたら、机の中から遺書らしきものが見つかったって」</p>\n    <p class=\"no-indent\">「遺書？」</p>\n    <p>驚きながら尋ねると、トヲルはああと頷いた。</p>\n    <p>改めて見ると、ノートの切れ端のような紙に薄く文字が書かれている。</p>\n    <p class=\"no-indent\">「確かに、キズキの字だ」</p>\n    <p>細くて達筆なキズキの字だった。僕はそこに書かれていた言葉をゆっくりと読み上げた。</p>\n    <p class=\"no-indent\">「『息をするのも、しないのもつらい』……」</p>\n    <p class=\"no-indent\">「どういう意味だと思う？」</p>\n    <p>僕はその文字をしばらくじっと見つめた。今にも霞んで消えてしまいそうな字だった。</p>\n    <p class=\"no-indent\">「息をするのも、しないのも辛かった。だから自死を選んだ……？」</p>\n    <p class=\"no-indent\">「その息をするのも、しないのも辛いってのはどういうことだと思う？」</p>\n    <p>僕はキズキの書いたその言葉に思いを巡らせた。キズキはこの世界に息苦しさを感じていたのだろうか。</p>\n    <p class=\"no-indent\">「何かの理由で息をするのが辛かった。だから息を止めた。だけど生きていれば当然息を止めるのも辛い。息をするのも、しないのも辛い。だからキズキは永遠に息を止める選択をした？」</p>\n    <p>これがキズキの最期の言葉だと思うと胸が痛んだ。キズキはずっと、誰にも言えない苦しみを抱えていたのだ。</p>\n    <p class=\"no-indent\">「なあ、俺たちはどうするべきだったと思う？」</p>\n    <p>その問いに、なんと答えればいいのかわからなかった。僕たちは、どうすればよかったのだろう。</p>\n    <p class=\"no-indent\">「わからないよ、それは僕にも。だけどキズキの異変にもっと早く気づいていたら、何かが変わったのかもしれない」</p>\n    <p class=\"no-indent\">「……そうだな」</p>\n    <p>どうすることもできなかったのだろうか。キズキの死を僕たちはただ、眺めていることしかできなかったのだろうか。</p>\n    <p class=\"no-indent\">「俺たちがアイツを置き去りにしたのか、それとも俺たちがアイツに置き去りにされたのか」</p>\n    <p class=\"no-indent\">「難しいね」</p>\n    <p class=\"no-indent\">「ああ、難しいよ」</p>\n    <p>そこでトヲルはぐーっと背中を伸ばして腕時計を見た。</p>\n    <p class=\"no-indent\">「もうこんな時間か。そろそろこの店も閉まるけど、お前どうする？」</p>\n    <p>腕時計を見ると、夜中の二時だった。確かにこの店もそろそろ閉まってしまう。</p>\n    <p class=\"no-indent\">「名残惜しいけど、帰ろうか。もう、夜も遅いし」</p>\n    <p>僕がそう言うと、トヲルもそうだなと言って荷物をまとめた。そしてバーテンダーを呼んだ。</p>\n    <p class=\"no-indent\">「今日は俺が払うよ。遅れて悪かったな」</p>\n    <p class=\"no-indent\">「いいよ、別に」</p>\n    <p class=\"no-indent\">「お前と久しぶりに話せて楽しかった。ありがとう」</p>\n    <p>そう言ってトヲルは勘定を済ませた。僕はトヲルに礼を言い、店を出た。外は街の静けさに包まれ、程よく冷たかった。</p>\n    <p class=\"no-indent\">「終電、もう過ぎてるよな」</p>\n    <p class=\"no-indent\">「ああ、そうだね。どうしようかな」</p>\n    <p>二時過ぎだから、電車はもうない。ホテルで夜を明かそうか。そう考えていると、トヲルが声を出した。</p>\n    <p class=\"no-indent\">「よかったら俺の家来ないか？　ここからだったら、歩いて三十分だから酔いをさまして帰れる」</p>\n    <p class=\"no-indent\">「嬉しいけど、いいの？」</p>\n    <p class=\"no-indent\">「いいよ。ソファで寝てもらうことになるけど、いいだろ？」</p>\n    <p class=\"no-indent\">「全然いいよ。じゃあ、お邪魔しようかな」</p>\n    <p>そう言うとトヲルは屈託なく笑った。トヲルの笑顔を久しぶりに見たような気がする。キズキがいた頃はよくこうして笑っていた。だけどキズキが死んでからは自然と笑顔が減っていた。キズキが死んでから、僕たちはうまく笑えなくなっていた。</p>\n</div>\n\n  <div class=\"section\" id=\"ch10\">\n    <h2 class=\"section-title\">第十話：館山城</h2>\n    <p>海ほたるを後にした僕たちは、その後千葉を目指した。</p>\n    <p>真夜中だったため道は驚くほど空いており、運転のストレスはほとんどなかった。僕たちは千葉に入ると、木更津から館山まで向かった。館山に向かった理由としては、館山城という里見義頼が築城した城がそこにあったからだった。里見義頼という人物には大して興味はなかったが、城の造形には多少なり関心があった。館山城にまで向かう間、キズキはずっと何かを考え込むように窓の外をじっと眺めていた。それは太陽の爆発を火星から眺めているようにも見えたし、あるいは地球の終焉を月面から眺めているようにも見えた。とにかく、キズキはずっと黙っていた。</p>\n    <p>館山城に着いたのは夜中の三時半だった。僕たちは館山城のある公園に併設された駐車場に車を停め、公園を散策した。公園には外灯があったものの、そのほとんどは闇に埋め尽くされていた。僕たちは公園をしばらく散策したあと、館山城に向かった。どうやら館山城は、公園の少し高くなった所にあるようだった。傾斜のある歩道を登っている間、キズキはずっと口笛を吹いていた。何の歌なのかと聞くと、キズキは俺にもわからないと言った。それから僕たちは、名前のないその歌を口笛で吹きながら館山城に向かった。もし近隣の人にこの口笛が聞かれたら、警察に通報されるか、あるいは怪奇現象として語り継がれるかのどちらかだろうと僕は思った。</p>\n    <p>館山城はそれほど大きな城ではなかった。姫路城のように壮麗でもないし、大阪城のように豪華絢爛でもなかった。それでも館山城には、姫路城にも大阪城にもない親しみやすさがあった。そしてその親しみやすさに触れると、何故だか少しだけ心が温かくなった。そのとき感じた感情は、どんな言葉を使っても完璧に表すことはできないだろう。でも言葉の限りを尽くすなら、それは古い記憶がある日突然蘇ったときのような感動に近かった。</p>\n    <p>僕たちはそれから、ひとしきり館山城を眺めた。営業時間は過ぎていたため中に入ることはできなかったが、月明かりに照らされたその姿は、湖畔に降り立った白鳥のように優美だった。そして館山城の少し先からは、館山の街が一望できた。ほとんどの家屋は明かりが消えていたが、中にはまだ明かりがついている建物もあった。僕たちはそこでしばらく景色を眺めていた。不思議と言葉は出てこなかった。まるで言葉が忘れ去られた世界に、ふたり取り残されたようだった。</p>\n    <p>館山城をあとにする頃には、すでに時刻が四時を過ぎていた。僕たちは再び車に乗り、千葉を走って回った。</p>\n    <p>キズキが声を出したのは、館山を過ぎ、鴨川に入ったときのことだった。</p>\n    <p class=\"no-indent\">「なあ、お前は死にたいって思ったことあるか？」</p>\n    <p>あまりにも唐突な質問だったので、僕は思わず「えっ？」と声を出してしまった。</p>\n    <p class=\"no-indent\">「いきなりどうしたの？」</p>\n    <p class=\"no-indent\">「なんかさ、時々思うんだよ。このままふらっと消えたいなって」</p>\n    <p class=\"no-indent\">「ふらっと？」</p>\n    <p class=\"no-indent\">「ああ、ふらっと……」</p>\n    <p>キズキの声が妙に冷たく、落ち着いていたので、僕はそのまま会話を続けてしまった。車を停めて一度ちゃんと話を聞こうか。そう思ったが、近くに車を停められるような場所はどこにもなかった。</p>\n    <p class=\"no-indent\">「どんなときに、そう思うの？」</p>\n    <p class=\"no-indent\">「どんなときって……まあ、眠れない夜とか？」</p>\n    <p class=\"no-indent\">「眠れない夜……」</p>\n    <p>僕はラジオのボリュームを小さくして、キズキの次の言葉を待った。何か、とても嫌な予感がした。</p>\n    <p class=\"no-indent\">「ここでハンドルを切れば、俺たち死ねるんだよ。なあ、案外死ってのはすぐそこに潜んでいるんだよ。そう思わないか？」</p>\n    <p>僕はその問いに答えなかった。答えてはいけないような気がした。</p>\n    <p class=\"no-indent\">「ここで死んだら、少しは楽になれるのかな」</p>\n    <p class=\"no-indent\">「えっ？」</p>\n    <p class=\"no-indent\">「いや、ここでお前と一緒に死ねたら、楽になれるのかなって」</p>\n    <p class=\"no-indent\">「は？　何言ってるの？」</p>\n    <p>呆れたようにそう言うと、キズキは一度僕を見つめてから、静かに息をついた。</p>\n    <p class=\"no-indent\">「『Speak or Die』」</p>\n    <p class=\"no-indent\">「えっ？」</p>\n    <p class=\"no-indent\">「『語れ、さもなくば死ね』。お前はどうする？」</p>\n    <p class=\"no-indent\">「どういうこと？」</p>\n    <p>僕たちの車とは反対側の車線を、黒い大型バイクが走り抜けていく。バイクには若い男女が乗っているのが一瞬だけ見えた。</p>\n    <p class=\"no-indent\">「たとえば、お前には好きな人がいる。その人に好意を伝えたい。でも、好意を伝えて振られるのが怖い。全てを話したいけど、話せない。話すべきか、死ぬべきか。お前はどうする？」</p>\n    <p>僕はスピードメーターをちらっと見てから、その問いについて考えを巡らせた。</p>\n    <p class=\"no-indent\">「まあ、僕なら話すね。だって、話して振られても失うものは何もないんだから」</p>\n    <p class=\"no-indent\">「何もない？」</p>\n    <p class=\"no-indent\">「だって、話したって、それで何かが失われるわけじゃない。それならモヤモヤするより、話したほうがいい」</p>\n    <p class=\"no-indent\">「本当に、何も失われないのか？」</p>\n    <p>抑揚のない平板な声だった。僕はキズキの問いに、もう一度考えを巡らせた。</p>\n    <p class=\"no-indent\">「まあ、苦しみは残るかもしれない。でも、それは直に消えるものだ。長い目で見たら、失うものはないと思う」</p>\n    <p class=\"no-indent\">「……そうか」</p>\n    <p>そこでキズキはポケットから煙草を取り出し、口に咥えた。そしてライターを取り出して、煙草に火をつけた。しかし、キズキは何を思ったのか、次の瞬間には車の窓を開け、口に咥えていた煙草を道路に投げ捨てた。</p>\n    <p class=\"no-indent\">「どうして捨てるの？」</p>\n    <p class=\"no-indent\">「何となくだよ。うん、なんとなく……」</p>\n    <p>妙に落ち込んだ声だった。僕はキズキの言動に違和感を覚えながらも、運転を続けた。</p>\n    <p class=\"no-indent\">「ラジオ変える？　なんかあまり面白くないし」</p>\n    <p>僕の問いに、キズキは答えなかった。僕は小さく息をついてからラジオのチャンネルを切り替え、音楽番組にした。</p>\n    <p class=\"no-indent\">「あっ、この曲キズキの好きなやつだよ」</p>\n    <p>僕はラジオのボリュームを大きくして、曲に耳を傾けた。その曲は、十九歳という若さでこの世を去ったミュージシャンの遺作だった。若者の心象を描くことで注目を集めたそのミュージシャンは、十七歳で華々しいデビューを飾り、逝去するまでの二年間で十五もの楽曲を作った。それらはどれも音楽シーンに大きな衝撃を与え、後世に語り継がれる名曲になった。ミュージシャンの死は公には事故死とされたが、自殺の疑いもかけられた。その一番の要因になったのは、『人生でいちばん楽しいと思った日に死ぬ』という遺作のタイトルだった。</p>\n    <p class=\"no-indent\">「いいよね、この曲。実はキズキに薦められたあと、結構聴いたんだよ」</p>\n    <p>そう言ってキズキの反応を待ったが、キズキは窓の外を見つめているだけで、何も喋らなかった。僕は仕方なく前を向き、運転に集中した。</p>\n    <p class=\"no-indent\">「みんな、結局は死ぬんだ」</p>\n    <p class=\"no-indent\">「えっ？」</p>\n    <p class=\"no-indent\">「どんな死に方しても変わらないんだよ。結局……」</p>\n    <p class=\"no-indent\">「えっ、どういうこと？」</p>\n    <p>困惑しながら尋ねると、キズキはすっと手を伸ばし、僕の握っていたハンドルを掴んだ。</p>\n    <p class=\"no-indent\">「何してるの？」</p>\n    <p class=\"no-indent\">「なあ、こっちを見てくれ」</p>\n    <p class=\"no-indent\">「はっ？　ダメだよ。運転してるんだから」</p>\n    <p class=\"no-indent\">「いいからさ……」</p>\n    <p>キズキは左手でハンドルを握り、右手で僕の肩を力強く掴んでいた。僕は驚きを隠せないまま、ゆっくりとキズキの座っている方を見た。</p>\n    <p class=\"no-indent\">「なあ、俺がどう見える？」</p>\n    <p>まつ毛が重なりそうなくらい近い距離だった。僕はキズキの荒い息づかいと、かすかな煙草の匂いを感じ、息を呑んだ。目と鼻の先まで迫ったキズキはまるで宇宙の淋しさを独り占めしたみたいに、ひとり物悲しげにこちらを見つめていた。その瞳は氷河のように硬く凍りつき、まつ毛は死に絶えた羽虫のように伏せていた。月明かりに照らされた鼻梁は象牙のように白く、小さく引き締まった唇は、干からびたみみずのように乾いていた。そして僕とキズキを隔てる数センチの間には、深い深い溝が広がっていた。それはこの世界に点在するどのような海溝よりも広く、大きく、救いがたい溝だった。僕はただ時が経つのも忘れて、キズキの顔をじっと見つめていた。そこには宇宙の果てを思わせるような、広く、深い孤独があった。</p>\n    <p>ハッと我に返ったとき、道はカーブだった。僕はそこでようやく理性を取り戻し、ブレーキを踏んで、ハンドルを切った。車体が大きく傾き、僕の体も大きく傾いた。僕はハンドルを強く握りながら、衝撃に備えた。しかし、衝撃はどれだけ経ってもやってこなかった。不思議に思って顔を上げると、目の前には舗装された道があった。どうやら車はガードレールの手前で、弧を描くように曲がったようだった。</p>\n    <p>僕はそこでほっと息をつき、ハンドルにもたれかかった。それから思い出したように、助手席を見つめた。すると、そこにはシートベルトに寄りかかったキズキの姿があった。キズキは車窓から射し込む月明かりに照らされ、夜の闇を裂くように浮かび上がっていた。僕はキズキに対し、大丈夫かと尋ねた。するとキズキは、少し間を置いてから大丈夫だと答えた。そしてこちらに向かって、不器用に微笑んで見せた。</p>\n    <p>キズキの安否を確認すると、僕はバックミラーで後ろに車が来ていないことを確認し、エンジンを切って車から降りた。外に出ると、カーブの方から冷たい風が吹いてきた。僕は車のドアに寄りかかりながら、暗闇に引き裂かれたカーブをじっと見つめた。僕たちはなんとか、あのカーブを曲がることができたのだ。そう思うと、少し誇らしかった。しかし同時に、脳裏にこびりついて離れない光景もあった。それはカーブを曲がる前にキズキが見せた、あの悲愁に満ちた表情だった。僕は何故キズキが、あんなにも哀しげな表情をしたのか考えてみた。しかし、どれだけ真剣に考えを巡らせても、思い当たる節はなかった。僕はそこで小さく息をつき、寄りかかっていた車のドアから体を離した。そして車体に傷がないか見て回った。傷がついていたら修理代を支払わなければならなかったのだが、幸いなことに傷はひとつとして見受けられなかった。</p>\n    <p>僕はそこでほっと胸を撫で下ろし、車の中にいるキズキに声をかけた。</p>\n    <p class=\"no-indent\">「傷はなかったよ。でも、ああやって運転中に気を引こうとするのはやめてくれないか。とても危ないんだ」</p>\n    <p>僕が運転席に腰掛けながら言うと、キズキは一度真っ直ぐにこちらを見つめてから、俯いた。</p>\n    <p class=\"no-indent\">「やっぱり、俺には無理だ」</p>\n    <p class=\"no-indent\">「えっ？」</p>\n    <p class=\"no-indent\">「やっぱり、俺には話せない」</p>\n    <p>そう言うと、キズキは今にも泣き出しそうな顔で、じっとこちらを見つめた。僕はそんなキズキの姿に戸惑いながらも、声を出した。</p>\n    <p class=\"no-indent\">「とにかく、ああいうことは危ないから、二度としちゃダメだ。わかった？」</p>\n    <p>僕がさとすように言うと、キズキは一度だけこくりと頷いた。首振り人形のように、愛想のない頷きだった。</p>\n    <p class=\"no-indent\">「じゃあ、もうこのことは忘れよう。せっかく車で旅をしてるんだ。楽しくいこう」</p>\n    <p>そう言って僕は車のエンジンをかけた。その間も、キズキはずっと俯いていた。</p>\n</div>\n\n  <div class=\"section\" id=\"ch11\">\n    <h2 class=\"section-title\">第十一話：生まれてきてよかったって言えるか？</h2>\n    <p>それから僕たちは外灯の光を頼りに夜道を歩いた。あたりは静けさに充ち満ち、足音だけが夜闇に響いた。僕たち以外に夜道を歩いている人は誰もいなかった。影の足音も聞こえてきそうなくらい、静かな夜だった。</p>\n    <p class=\"no-indent\">「それにしても懐かしいよ」</p>\n    <p class=\"no-indent\">「え？」</p>\n    <p class=\"no-indent\">「ほら、覚えてないか？　寮を抜け出して裏山で花火したの？」</p>\n    <p>トヲルに言われて、僕はその時のことを思い出した。確かあの頃、僕たちは退屈な寮生活に飽き飽きしていたのだ。まずい飯に、汚い部屋、騒音に、悪臭。その全てに嫌気がさした僕たちは、ある夜に寮長の目を盗んで寮を抜け出した。そして近くのコンビニで花火を買い、寮の裏山で花火を打ち上げたのだ。だけど花火のあまりの轟音に、僕たちは怯えて逃げ出してしまった。</p>\n    <p class=\"no-indent\">「覚えてるよ。あの時は大変だったな。寮長にみっちり叱られた挙句、三ヶ月の外出禁止令が出たんだから」</p>\n    <p class=\"no-indent\">「ああ、そうだったな。でもあの外出禁止令があったから、俺たちは麻雀の面白さを知ることができたんだ」</p>\n    <p>確かに、僕たちは三ヶ月の外出禁止令の間、麻雀に明け暮れていた。夜通し麻雀をやったことだってあった。</p>\n    <p class=\"no-indent\">「ははっ。麻雀で単位落としたやつが言うと説得力があるよ」</p>\n    <p>揶揄うように言うと、トヲルは困ったように笑った。</p>\n    <p class=\"no-indent\">「それは言わないでくれよ。あれ、結構大変だったんだから」</p>\n    <p>そう言うとトヲルはネクタイを緩めて、楽しそうに笑った。僕たちの笑い声は果てのない夜の闇に吸い込まれてしまった。</p>\n    <p class=\"no-indent\">「いつまでも忘れないんだろうな」</p>\n    <p class=\"no-indent\">「忘れられないさ。あんな刺激的な日々は」</p>\n    <p>中学、高校と大した学校生活を送ってこなかった僕にとって、彼らと過ごした時間は何ものにも代えがたい日々だった。どのような苦悩も、痛みも全て忘れられるような日々だった。</p>\n    <p class=\"no-indent\">「そして、もう二度と戻らない……」</p>\n    <p>トヲルの言葉に僕は静かに頷いた。もう戻らない。キズキは、もう二度と帰らない。</p>\n    <p class=\"no-indent\">「お前は、生まれてきてよかったって言えるか？」</p>\n    <p>その言葉が耳に入った瞬間、僕は立ち止まっていた。どうなのだろう。僕は生まれてきてよかったと言えるだろうか。</p>\n    <p class=\"no-indent\">「俺は、今死んでもいいと思ってる。もちろんやりたいことはまだまだたくさんある。出世もしたいし、いつかは自分の家が欲しいとも思っている。でも、時々思うんだ。これから何かを失うくらいなら、ここで人生を終えてもいいんじゃないかって。キズキが死んでから、そういう考えが頭から離れないんだよ。全てを失って死ぬくらいなら、全てを失わないために死ぬのもありなんじゃないかってさ」</p>\n    <p>その言葉にハッとなって顔を上げると、トヲルは憂いを帯びた瞳で笑っていた。</p>\n    <p class=\"no-indent\">「もちろん死ぬのは怖いさ。俺は死にたくない。でも、それ以上に何かを失うことがとてつもなく怖い。失って悲しみに暮れるのは、もう嫌なんだ。何かを失った喪失に、俺はこれ以上耐えられない」</p>\n    <p class=\"no-indent\">「それは僕も同じだよ」</p>\n    <p>何もかもが眠りついたような夜だった。まるですべての生き物が息絶えてしまったようだった。</p>\n    <p class=\"no-indent\">「キズキが死んで僕は絶望の淵に立たされた。毎日苦しかったし、辛かった。正直何度も死ぬことを考えた。でも、そのたびに思ったんだ。僕はキズキを失って悲しい。でもそれ以上にキズキは苦しんでいたんじゃないかって。僕たちの悲しみとは比にならないくらい、もっとずっと大きな何かにキズキは苦しんでいたんじゃないかって。そう思うと、不思議と前を向けたんだ。それに、僕には君がいたからね。君を置いて死ぬわけにはいかなかった」</p>\n    <p class=\"no-indent\">「……そうか」</p>\n    <p>外灯に小さな虫たちが群がっている。水たまりに僕たちの姿が反射している。死を悟った蝉たちがけたたましく鳴いている。</p>\n    <p class=\"no-indent\">「キズキがいたらどれほどこの世界が輝いていたんだろうって、時々思うよ。でもさ、もう仕方のないことなんだ。キズキは死んだ。キズキは戻ってこない。それはどうしたって変えられない。いつまでもキズキのことを引きずっていたらダメなんだ。僕たちはキズキという過去に別れを告げなくてはいけない。キズキという記憶に蹴りをつけなくてはいけない」</p>\n    <p>いつまでもキズキに囚われてはいけない。それでは、僕たちは前に進めない。</p>\n    <p class=\"no-indent\">「……そうだな」</p>\n    <p>僕たちはそれから何も言わずに夜道を歩いた。死んだように静かな夜だった。まるで今にもふらっとキズキが現れそうだった。僕は小さく息をつき、夜空を見上げた。すると夜空の遠く彼方に、美しく輝く星が見えた。</p>\n</div>\n\n  <div class=\"section\" id=\"ch12\">\n    <h2 class=\"section-title\">第十二話：九十九里浜</h2>\n    <p>鴨川を後にした僕たちは、続いて九十九里浜に向かった。九十九里浜は全長六十六キロもある日本一長い砂浜で、僕もキズキも行くのは初めてだった。全長六十六キロあるというのは実際に行ってみると本当で、しばらく車を走らせていると海岸線に出た。そこには一面砂浜が広がっており、その先には真っ暗な海が広がっていた。どうやらここが九十九里浜のようだった。</p>\n    <p>九十九里浜の白里海岸に着いたのは五時半だった。五時半とはいえ、冬のためまだ日は昇っていなかった。僕たちは真っ暗闇の中、九十九里浜を全速力で走った。冷たい潮風を全身に受けながら走る感覚は、久しく忘れていたものだった。</p>\n    <p class=\"no-indent\">「意外と、早いなお前」</p>\n    <p class=\"no-indent\">「これでも高校三年間、体育祭のリレー選抜だったからね」</p>\n    <p class=\"no-indent\">「すごいな。まあ、でも俺は小中高ずっとリレー選抜だったけどな」</p>\n    <p class=\"no-indent\">「自慢か？　じゃあ、もう一本走ろう。これでも体力には自信があるんだ」</p>\n    <p class=\"no-indent\">「いいぜ。じゃあ、何か賭けよう」</p>\n    <p>そう言って、キズキはじっとこちらを見つめた。暗闇にはある程度目は慣れていたが、それでもキズキの表情まで窺うことはできなかった。</p>\n    <p class=\"no-indent\">「何を賭ける？」</p>\n    <p class=\"no-indent\">「そうだな。じゃあ、負けた方が勝った方の言うことを何でも聞く」</p>\n    <p class=\"no-indent\">「何だよ、そのど定番なやつ」</p>\n    <p class=\"no-indent\">「いいだろ、じゃあやろう」</p>\n    <p>そう言って僕たちは近くにあった枝で砂浜にスタートラインとゴールラインを引いた。そして入念にアップをし、手や足を伸ばした。遊びとはいえ、勝負事には負けたくなかった。だから、今回は本気を出そうと思った。</p>\n    <p>スタートの合図はじゃんけんでキズキが言うことになった。僕たちはスタートラインについて、一度深呼吸をしてからスタートの用意をした。そしてキズキの合図で走り出した。</p>\n    <p>最初はスタートの合図とともに走り出したキズキが優勢だった。キズキは自慢の脚力を活かして、僕との差を徐々に広げていった。僕はなんとかキズキに追いつこうと必死に腕を振ったが、なかなか差は縮まらなかった。どうやら瞬間的なスピードではキズキに劣るようだった。ところが、中盤に入ってからキズキの勢いがみるみるうちに落ちてきた。どうやらここにきて疲れが出始めたようだった。僕はそこがチャンスだと思い、一気にラストスパートをかけた。三年間陸上部で鍛え上げた僕の脚力は徐々にその真価を発揮し、最終的にはゴールライン手前でキズキを追い越した。</p>\n    <p>結果は僕の勝ちだった。</p>\n    <p class=\"no-indent\">「くっそ、あとちょっとだったのに……」</p>\n    <p class=\"no-indent\">「でも、結構キズキも早いね」</p>\n    <p class=\"no-indent\">「ああ。これでも中高は走り込みばっかやってたからな」</p>\n    <p>僕たちはゼエゼエと息を切らしながら、何とかしゃべった。吐く息が白く、暗闇の中でぼんやりと形を作っては消えていった。</p>\n    <p class=\"no-indent\">「で、負けた方が勝った方の言うことを何でも聞く、だったよね？」</p>\n    <p class=\"no-indent\">「ああ。何でも言ってくれ」</p>\n    <p class=\"no-indent\">「そうだな。じゃあ今日の飲み代割り勘だったけど、キズキに全部払って欲しい」</p>\n    <p class=\"no-indent\">「えっ、そんなことでいいのか？」</p>\n    <p class=\"no-indent\">「そんなことって……じゃあ逆にキズキが勝っていたら何をお願いしようとしたの？」</p>\n    <p>気になったので尋ねると、キズキはしばらく間を置いた。その間の長さに、僕はほんの少しだけ違和感を覚えた。</p>\n    <p class=\"no-indent\">「内緒、だな」</p>\n    <p class=\"no-indent\">「何でだよ」</p>\n    <p>僕がキズキの肩に腕を回すと、キズキはさっと僕の腕をどかした。その反射的な動きに、僕は一瞬だけ戸惑った。</p>\n    <p class=\"no-indent\">「言ったら、多分引くから……」</p>\n    <p class=\"no-indent\">「引くって、どう言うこと？　逆に気になるんだけど」</p>\n    <p class=\"no-indent\">「もういい。わかったよ。今日の飲み代全部払えばいいんだろ？」</p>\n    <p class=\"no-indent\">「おっ、いいの？」</p>\n    <p class=\"no-indent\">「いいよ。ったく、仕方ないなぁ」</p>\n    <p>そう言ってキズキは財布を取り出し、割り勘分の飲み代を僕に払った。僕はありがとうと言って、そのお金を自分の財布にしまった。</p>\n    <p class=\"no-indent\">「さて、運動もできたし、そろそろ行く？」</p>\n    <p class=\"no-indent\">「ああ、そうだな。でも、ちょっと待ってくれ。久しぶりに走って結構疲れたんだ」</p>\n    <p class=\"no-indent\">「ああ、いいよ。じゃあ少し休憩しよう」</p>\n    <p>それから僕たちは九十九里浜に座って、真っ暗な海を眺めた。海は空との境界を完全に失くし、無限の闇を広げていた。僕たちはその闇の前で、ただ静かに息を切らしていた。呼吸が整っていくにつれ、波の音がだんだんとはっきりと耳に届くようになった。</p>\n</div>\n\n  <div class=\"section\" id=\"ch13\">\n    <h2 class=\"section-title\">第十三話：どんな時だって、希望は残っている。</h2>\n    <p>バーを出て、夜道を歩き、ふと見上げた夜空には、星が眩く煌めいていた。</p>\n    <p class=\"no-indent\">「すごい、星が見える」</p>\n    <p>僕がそう言うと、トヲルは俯いていた顔を上げて夜空を見つめた。</p>\n    <p class=\"no-indent\">「ああ、本当だ……」</p>\n    <p>暗闇に馴染めばなじむほど、星は確かな輪郭を帯びた。僕は頭上に広がる星空の美しさに目を奪われながら、ゆっくりと歩いた。</p>\n    <p class=\"no-indent\">「あの星の本当の輝きを知る頃には、僕たちはこの世界にはいない」</p>\n    <p>何となしに呟くと、トヲルは夜空を見上げたままこちらを見つめた。</p>\n    <p class=\"no-indent\">「星の輝き？」</p>\n    <p>僕はその問いに頷いて、ゆっくりと歩いた。どこからか鳥の囀りが聞こえ、どこからか虫のざわめきが聞こえる。風が吹くと草木はさわさわと音を立てて、気持ちよさそうに揺れた。</p>\n    <p class=\"no-indent\">「あの星の光は何十光年も先から長い時間をかけて僕たちのもとにやってきているんだ。だから、あの星の光は実際には何十年も前の光なんだよ」</p>\n    <p class=\"no-indent\">「ああ、そういえば学校でやったな」</p>\n    <p>僕はその言葉に頷き、夜空の光を仰いだ。あの光は何十年、何百年と宇宙を彷徨った末に、今この瞳に届いている。</p>\n    <p class=\"no-indent\">「たかが百年。僕たちが懸命になって生きる百年は、あの星の本当の光が届く頃には過ぎ去っている」</p>\n    <p class=\"no-indent\">「……儚いな」</p>\n    <p class=\"no-i
