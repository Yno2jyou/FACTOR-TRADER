  function confirmOrders() {
    // ---- ONLINE ----
    if (playMode === "online") {
      const me = players.find((p) => p.id === myPlayerId) || players.find((p) => !p.isAI);
      if (!me || me.isBankrupt) return;
      let nOrd = Math.floor(Number(currentN) || 0);
      if (nOrd < 10000) { nOrd = randBase(); setCurrentN(nOrd); stateRef.current = { ...stateRef.current, currentN: nOrd }; }
      const px = sopf(nOrd);
      const clamped = clampOrder(humanOrderDraft, me.cash, me.holdings, px, turn, totalTurns);
      if (onlineRole === "guest") {
        setISubmittedOrder(true);
        sendToHost({ type: "order", order: clamped });
        return;
      }
      // host
      const nextPending = { ...pendingOrders, [me.id]: clamped };
      const nextSubmitted = Array.from(new Set([...submittedOrderIds, me.id]));
      setPendingOrders(nextPending);
      setSubmittedOrderIds(nextSubmitted);
      setISubmittedOrder(true);
      broadcastSnapshotFrom({
        pendingOrders: nextPending,
        submittedOrderIds: nextSubmitted,
        phase: "order",
        screen: "play",
      });
      setTimeout(() => tryFinalizeOnlineOrders(nextPending, nextSubmitted), 30);
      return;
    }
    // ---- LOCAL ----
    const ah = aliveHumans(players);
    const cur = ah[inputHumanIdx];
    if (!cur) {
      finalizeOrdersAndGoHack({});
      return;
    }
    let nOrd = Math.floor(Number(currentN) || 0);
    if (nOrd < 10000) { nOrd = randBase(); setCurrentN(nOrd); stateRef.current = { ...stateRef.current, currentN: nOrd }; }
    const px = sopf(nOrd);
    const clamped = clampOrder(humanOrderDraft, cur.cash, cur.holdings, px, turn, totalTurns);
    const nextOrders = { ...orders, [cur.id]: clamped };
    setOrders(nextOrders);
    const nextIdx = inputHumanIdx + 1;
    if (nextIdx < ah.length) {
      const nextP = ah[nextIdx];
      setInputHumanIdx(nextIdx);
      let draft = { action: "stay", shares: 0 };
      if (isLastFiveTurns(turn, totalTurns)) {
        const maxBuy = priceBefore > 0 ? Math.floor(nextP.cash / priceBefore) : 0;
        if (nextP.holdings > 0) draft = { action: "sell", shares: minOrderShares("sell", nextP.holdings, maxBuy) };
        else if (maxBuy > 0) draft = { action: "buy", shares: minOrderShares("buy", nextP.holdings, maxBuy) };
      }
      setHumanOrderDraft(draft);
      setPassBanner({ name: nextP.name, phaseLabel: "注文" });
      scrollToTop();
      return;
    }
    finalizeOrdersAndGoHack(nextOrders);
  }

  function finalizeOnlineOrders(pending) {
    if (!isHostRef.current) return;
    const st = stateRef.current;
    const nStartL = st.currentN;
    const priceBeforeL = nStartL > 0 ? sopf(nStartL) : 0;
    const refL = (st.priceHistory && st.priceHistory.length)
      ? st.priceHistory[st.priceHistory.length - 1].price
      : st.basePrice;
    const newOrders = { ...pending };
    const humans = humanPlayersOf(st.players).filter((p) => !p.isBankrupt);
    const refHuman = humans.slice().sort((a, b) => totalValue(b, priceBeforeL) - totalValue(a, priceBeforeL))[0] || null;
    (st.players || []).forEach((p) => {
      if (newOrders[p.id]) return;
      if (p.isBankrupt) {
        newOrders[p.id] = { action: "stay", shares: 0 };
      } else if (!p.isAI) {
        newOrders[p.id] = { action: "stay", shares: 0 };
      } else {
        newOrders[p.id] = clampOrder(
          aiDecideTrade(Math.random(), nStartL, priceBeforeL, p.cash, p.holdings, refL, {
            turn: st.turn,
            totalTurns: st.totalTurns,
            human: refHuman,
          }),
          p.cash, p.holdings, priceBeforeL, st.turn, st.totalTurns
        );
      }
    });
    setOrders(newOrders);
    stateRef.current = { ...stateRef.current, orders: newOrders, phase: "hack", currentN: ensureBaseN(stateRef.current.currentN) };
    setPendingOrders({});
    setSubmittedOrderIds([]);
    setISubmittedOrder(false);
    setISubmittedHack(false);
    setPendingHacks({});
    setSubmittedHackIds([]);
    setHumanHackDraft({ quick: 0, heavy: 0, defense: 0, reflect: 0, avant: 0, avantSab: 0, avantPrice: 1000, coinRescue: "" });
    setPhase("hack");
    setTimeout(() => {
      broadcastSnapshotFrom({
        orders: newOrders,
        phase: "hack",
        pendingOrders: {},
        submittedOrderIds: [],
        pendingHacks: {},
        submittedHackIds: [],
        screen: "play",
      });
    }, 40);
  }

  function finalizeOrdersAndGoHack(humanOrdersSoFar) {
    const newOrders = { ...humanOrdersSoFar };
    // 参照用の「最強人間」をAIの behindHuman 判定に使う
    const humans = humanPlayersOf(players).filter((p) => !p.isBankrupt);
    const refHuman = humans.slice().sort((a, b) => totalValue(b, priceBefore) - totalValue(a, priceBefore))[0] || null;
    players.forEach((p) => {
      if (newOrders[p.id]) return;
      if (p.isBankrupt) {
        newOrders[p.id] = { action: "stay", shares: 0 };
      } else if (!p.isAI) {
        newOrders[p.id] = { action: "stay", shares: 0 };
      } else {
        newOrders[p.id] = clampOrder(
          aiDecideTrade(Math.random(), nStart, priceBefore, p.cash, p.holdings, refPrice, {
            turn: turn,
            totalTurns: totalTurns,
            human: refHuman,
          }),
          p.cash, p.holdings, priceBefore, turn, totalTurns
        );
      }
    });
    setOrders(newOrders);
    stateRef.current = { ...stateRef.current, orders: newOrders, phase: "hack", currentN: ensureBaseN(stateRef.current.currentN) };
    // ハックフェーズへ：最初の生存人間
    const ah = aliveHumans(players);
    setInputHumanIdx(0);
    setHumanHackDraft({ quick: 0, heavy: 0, defense: 0, reflect: 0, avant: 0, avantSab: 0, avantPrice: 1000, coinRescue: "" });
    setPassBanner(ah.length > 1 && ah[0] ? { name: ah[0].name, phaseLabel: "COIN" } : null);
    setPhase("hack");
    scrollToTop();
  }

  function confirmHacks() {
    // ---- ONLINE ----
    if (playMode === "online") {
      const me = players.find((p) => p.id === myPlayerId) || players.find((p) => !p.isAI);
      if (!me || me.isBankrupt) return;
      const endgame = isLastFiveTurns(turn, totalTurns);
      const stock = me.cards.stock || 0;
      let choice = humanHackDraft.coinRescue || "";
      if (endgame) choice = "";
      if (choice === "zero10" && stock !== 0) choice = "";
      if (choice === "half5" && stock > 5) choice = "";
      let avant = (!me.avantUsed && humanHackDraft.avant && !humanHackDraft.avantSab) ? 1 : 0;
      let avantSab = (!me.avantUsed && humanHackDraft.avantSab && !humanHackDraft.avant) ? 1 : 0;
      if (turn <= 3) avantSab = 0;
      if (avant && avantSab) { avantSab = 0; }
      let avantPrice = Math.max(1, Math.min(99999, Math.floor(Number(humanHackDraft.avantPrice) || 1)));
      const anyAvant = avant || avantSab;
      let q = anyAvant ? 0 : Math.max(0, Math.floor(humanHackDraft.quick || 0));
      let h = anyAvant ? 0 : (turn <= 3 ? 0 : (humanHackDraft.heavy ? 1 : 0));
      let def = anyAvant ? 0 : ((turn > 3 && humanHackDraft.defense) ? 1 : 0);
      let ref = anyAvant ? 0 : ((turn > 3 && humanHackDraft.reflect) ? 1 : 0);
      if (def && ref) ref = 0; // 防衛優先
      let stockAfterRescue = stock;
      if (choice === "half5") stockAfterRescue = stock + 5;
      if (choice === "zero10") stockAfterRescue = stock + 10;
      const heavyCost = h > 0 ? 5 : 0;
      const defCost = def ? 5 : 0;
      const refCost = ref ? 5 : 0;
      const avantCost = anyAvant ? 10 : 0;
      if (q + heavyCost + defCost + refCost + avantCost > stockAfterRescue) {
        if (anyAvant && stockAfterRescue < 10) { avant = 0; avantSab = 0; }
        if (def && stockAfterRescue - (anyAvant ? 10 : 0) < 5) { def = 0; }
        if (ref && stockAfterRescue - (anyAvant ? 10 : 0) - (def ? 5 : 0) < 5) { ref = 0; }
        if (h > 0 && stockAfterRescue - (anyAvant ? 10 : 0) - (def ? 5 : 0) - (ref ? 5 : 0) < 5) { h = 0; }
        const room = Math.max(0, stockAfterRescue - (anyAvant ? 10 : 0) - (def ? 5 : 0) - (ref ? 5 : 0) - (h > 0 ? 5 : 0));
        if (q > room) q = room;
      }
      const hackPayload = { quick: q, heavy: h, defense: def, reflect: ref, avant: avant, avantSab: avantSab, avantPrice: avantPrice, coinRescue: choice };
      if (onlineRole === "guest") {
        setISubmittedHack(true);
        sendToHost({ type: "hack", hack: hackPayload });
        return;
      }
      const nextPending = { ...pendingHacks, [me.id]: hackPayload };
      const nextSubmitted = Array.from(new Set([...submittedHackIds, me.id]));
      setPendingHacks(nextPending);
      setSubmittedHackIds(nextSubmitted);
      setISubmittedHack(true);
      broadcastSnapshotFrom({
        pendingHacks: nextPending,
        submittedHackIds: nextSubmitted,
        phase: "hack",
        screen: "play",
      });
      setTimeout(() => tryFinalizeOnlineHacks(nextPending, nextSubmitted), 30);
      return;
    }
    // ---- LOCAL ----
    const ah = aliveHumans(players);
    const cur = ah[inputHumanIdx];
    const endgame = isLastFiveTurns(turn, totalTurns);

    if (cur && !cur.isBankrupt) {
      const stock = cur.cards.stock || 0;
      let choice = humanHackDraft.coinRescue || "";
      if (endgame) choice = "";
      if (choice === "zero10" && stock !== 0) choice = "";
      if (choice === "half5" && stock > 5) choice = "";
      let avant = (!cur.avantUsed && humanHackDraft.avant && !humanHackDraft.avantSab) ? 1 : 0;
      let avantSab = (!cur.avantUsed && humanHackDraft.avantSab && !humanHackDraft.avant) ? 1 : 0;
      if (turn <= 3) avantSab = 0;
      if (avant && avantSab) { avantSab = 0; }
      let avantPrice = Math.max(1, Math.min(99999, Math.floor(Number(humanHackDraft.avantPrice) || 1)));
      const anyAvant = avant || avantSab;
      let q = anyAvant ? 0 : Math.max(0, Math.floor(humanHackDraft.quick || 0));
      let h = anyAvant ? 0 : (turn <= 3 ? 0 : (humanHackDraft.heavy ? 1 : 0));
      let def = anyAvant ? 0 : ((turn > 3 && humanHackDraft.defense) ? 1 : 0);
      let ref = anyAvant ? 0 : ((turn > 3 && humanHackDraft.reflect) ? 1 : 0);
      if (def && ref) ref = 0; // 防衛優先
      // 補充後の手札でコスト判定（実際の補充は finalize 時）
      let stockAfterRescue = stock;
      if (choice === "half5") stockAfterRescue = stock + 5;
      if (choice === "zero10") stockAfterRescue = stock + 10;
      const heavyCost = h > 0 ? 5 : 0;
      const defCost = def ? 5 : 0;
      const refCost = ref ? 5 : 0;
      const avantCost = anyAvant ? 10 : 0;
      if (q + heavyCost + defCost + refCost + avantCost > stockAfterRescue) {
        if (anyAvant && stockAfterRescue < 10) { avant = 0; avantSab = 0; }
        if (def && stockAfterRescue - (anyAvant ? 10 : 0) < 5) { def = 0; }
        if (ref && stockAfterRescue - (anyAvant ? 10 : 0) - (def ? 5 : 0) < 5) { ref = 0; }
        if (h > 0 && stockAfterRescue - (anyAvant ? 10 : 0) - (def ? 5 : 0) - (ref ? 5 : 0) < 5) { h = 0; }
        const room = Math.max(0, stockAfterRescue - (anyAvant ? 10 : 0) - (def ? 5 : 0) - (ref ? 5 : 0) - (h > 0 ? 5 : 0));
        if (q > room) q = room;
      }
      const nextHacks = {
        ...hackChoices,
        [cur.id]: { quick: q, heavy: h, defense: def, reflect: ref, avant: avant, avantSab: avantSab, avantPrice: avantPrice, coinRescue: choice },
      };
      setHackChoices(nextHacks);

      const nextIdx = inputHumanIdx + 1;
      if (nextIdx < ah.length) {
        const nextP = ah[nextIdx];
        setInputHumanIdx(nextIdx);
        setHumanHackDraft({ quick: 0, heavy: 0, defense: 0, reflect: 0, avant: 0, avantSab: 0, avantPrice: 1000, coinRescue: "" });
        setPassBanner({ name: nextP.name, phaseLabel: "COIN" });
        scrollToTop();
        return;
      }
      finalizeHacksAndResolve(nextHacks, players);
      return;
    }
    finalizeHacksAndResolve(hackChoices, players);
  }

  function finalizeHacksAndResolve(humanHacksSoFar, playersBase) {
    const endgame = isLastFiveTurns(turn, totalTurns);
    let rescuedPlayers = (playersBase || players).map((p) => ({ ...p, cards: { ...(p.cards || {}) }, history: [...(p.history || [])] }));

    // COIN補充の記録（TRADERS表示用）
    const coinRescueMap = {};

    // 人間の COIN 補充を適用
    rescuedPlayers = rescuedPlayers.map((p) => {
      if (p.isBankrupt || p.isAI) return p;
      const hk = humanHacksSoFar[p.id] || {};
      const choice = hk.coinRescue || "";
      if (!choice || endgame) return p;
      const st = p.cards.stock != null ? p.cards.stock : 0;
      if (choice === "zero10" && st !== 0) return p;
      if (choice === "half5" && st > 5) return p;
      if (st > 5) return p;
      const next = applyCoinRescue(p, choice, priceBefore);
      coinRescueMap[p.id] = choice;
      if (choice === "half5") pushLog("COIN " + p.name + " COIN補充: 総資産の50%と引き換えに COIN+5");
      if (choice === "zero10") pushLog("COIN " + p.name + " COIN補充: 総資産の75%と引き換えに COIN+10");
      return next;
    });

    // AI の COIN 補充
    rescuedPlayers = rescuedPlayers.map((p) => {
      if (p.isBankrupt || !p.isAI) return p;
      const st = p.cards.stock != null ? p.cards.stock : 0;
      if (endgame || st > 5) return p;
      const ord = orders[p.id] || { action: "stay", shares: 0 };
      let need = false;
      if (ord.action === "buy" && (ord.shares || 0) >= 1) {
        const priceHit = personalExecPrice(nStart, 0, 1, "buy");
        const req = (ord.shares || 0) * priceHit;
        const liq = (p.cash || 0) + (p.holdings || 0) * priceHit;
        need = req > liq + 1e-9;
      }
      const trading = (ord.action === "buy" || ord.action === "sell") && (ord.shares || 0) >= 1;
      let choice = "";
      if (st === 0) {
        if (need) choice = Math.random() < 0.9 ? "zero10" : (Math.random() < 0.5 ? "half5" : "");
        else if (trading) choice = Math.random() < 0.7 ? "zero10" : (Math.random() < 0.4 ? "half5" : "");
        else choice = Math.random() < 0.45 ? "zero10" : "";
      } else if (st <= 5) {
        if (need) choice = Math.random() < 0.85 ? "half5" : "";
        else if (trading) choice = Math.random() < 0.55 ? "half5" : "";
        else choice = Math.random() < 0.3 ? "half5" : "";
      }
      if (!choice) return p;
      const next = applyCoinRescue(p, choice, priceBefore);
      coinRescueMap[p.id] = choice;
      pushLog("COIN " + (p.name || p.id) + " がCOIN補充（" + coinRescueLabel(choice) + "）");
      return next;
    });

    const newHacks = { ...humanHacksSoFar };
    rescuedPlayers.forEach((p) => {
      if (newHacks[p.id] && !p.isAI) {
        // 人間は既に入力済み。coinRescue は TRADERS 表示用に残す
        const choice = coinRescueMap[p.id] || newHacks[p.id].coinRescue || "";
        newHacks[p.id] = { ...newHacks[p.id], coinRescue: choice || "" };
        return;
      }
      if (newHacks[p.id]) return;
      if (p.isBankrupt) {
        newHacks[p.id] = { quick: 0, heavy: 0, defense: 0, reflect: 0, avant: 0, avantSab: 0, coinRescue: "" };
        return;
      }
      if (!p.isAI) {
        newHacks[p.id] = { quick: 0, heavy: 0, defense: 0, reflect: 0, avant: 0, avantSab: 0, coinRescue: coinRescueMap[p.id] || "" };
        return;
      }
      newHacks[p.id] = {
        ...aiDecideCards(
          p.cards, turn, totalTurns, orders[p.id], nStart, priceBefore, orders, p.id, rescuedPlayers
        ),
        coinRescue: coinRescueMap[p.id] || "",
      };
    });

    // 妨害の同時撃ちは少なめ
    const aiHeavy = rescuedPlayers.filter((p) => p.isAI && newHacks[p.id] && (newHacks[p.id].heavy || 0) > 0);
    const heavySlots = rescuedPlayers.length >= 5 ? 2 : 1;
    if (aiHeavy.length > heavySlots) {
      for (let i = aiHeavy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = aiHeavy[i]; aiHeavy[i] = aiHeavy[j]; aiHeavy[j] = tmp;
      }
      const keep = new Set(aiHeavy.slice(0, heavySlots).map((p) => p.id));
      aiHeavy.forEach((p) => {
        if (!keep.has(p.id)) newHacks[p.id] = { ...newHacks[p.id], heavy: 0 };
      });
    }

    // 奥義AVANT-GARDE重複解決（操作・妨害それぞれ）
    {
      // 同一プレイヤーが両方立てていたら操作のみ残す
      rescuedPlayers.forEach((p) => {
        const hk = newHacks[p.id];
        if (hk && hk.avant && hk.avantSab) {
          newHacks[p.id] = { ...hk, avantSab: 0 };
        }
      });
      // 操作（自分株価指定）
      const avantUsers = rescuedPlayers.filter((p) => !p.isBankrupt && newHacks[p.id] && newHacks[p.id].avant);
      if (avantUsers.length > 1) {
        let winner = avantUsers[0];
        let winTv = totalValue(winner, priceBefore);
        avantUsers.forEach((p) => {
          const tv = totalValue(p, priceBefore);
          if (tv < winTv || (tv === winTv && String(p.id) < String(winner.id))) {
            winner = p;
            winTv = tv;
          }
        });
        avantUsers.forEach((p) => {
          if (p.id === winner.id) return;
          newHacks[p.id] = { ...newHacks[p.id], avant: 0, avantPrice: newHacks[p.id].avantSab ? newHacks[p.id].avantPrice : 0 };
          pushLog("[ICON:avant] " + (p.name || p.id) + " の奥義：AVANT-GARDE-操作は重複により不成立（COIN返却）");
        });
        pushLog("[ICON:avant] 奥義：AVANT-GARDE-操作 成立: " + (winner.name || winner.id) + "（自分の株価 " + yenNum(newHacks[winner.id].avantPrice) + "円）");
      } else if (avantUsers.length === 1) {
        const w = avantUsers[0];
        pushLog("[ICON:avant] 奥義：AVANT-GARDE-操作: " + (w.name || w.id) + " が自分の株価 " + yenNum(newHacks[w.id].avantPrice) + "円 を指定");
      }
      // 妨害（他者株価指定）— 防衛で無効化される
      const sabUsers = rescuedPlayers.filter((p) => !p.isBankrupt && newHacks[p.id] && newHacks[p.id].avantSab);
      if (sabUsers.length > 1) {
        let winner = sabUsers[0];
        let winTv = totalValue(winner, priceBefore);
        sabUsers.forEach((p) => {
          const tv = totalValue(p, priceBefore);
          if (tv < winTv || (tv === winTv && String(p.id) < String(winner.id))) {
            winner = p;
            winTv = tv;
          }
        });
        sabUsers.forEach((p) => {
          if (p.id === winner.id) return;
          newHacks[p.id] = { ...newHacks[p.id], avantSab: 0, avantPrice: newHacks[p.id].avant ? newHacks[p.id].avantPrice : 0 };
          pushLog("[ICON:avant] " + (p.name || p.id) + " の奥義：AVANT-GARDE-妨害は重複により不成立（COIN返却）");
        });
        pushLog("[ICON:avant] 奥義：AVANT-GARDE-妨害 成立: " + (winner.name || winner.id) + "（他者の株価 " + yenNum(newHacks[winner.id].avantPrice) + "円）");
      } else if (sabUsers.length === 1) {
        const w = sabUsers[0];
        pushLog("[ICON:avant] 奥義AVANT-GARDE（妨害）: " + (w.name || w.id) + " が他者の株価 " + yenNum(newHacks[w.id].avantPrice) + "円 を指定");
      }
    }
    setHackChoices(newHacks);
    setPassBanner(null);
    resolveTurn(newHacks, rescuedPlayers);
  }

  function finalizeOnlineHacks(pending) {
    if (!isHostRef.current) return;
    // pending を humanHacksSoFar として既存 finalize を利用
    finalizeHacksAndResolve(pending, stateRef.current.players);
    // resolveTurn 内で setPhase reveal されるので、その後スナップショット
    setTimeout(() => {
      broadcastSnapshotFrom({
        phase: stateRef.current.phase,
        players: stateRef.current.players,
        revealData: stateRef.current.revealData,
        revealFocusId: stateRef.current.revealFocusId,
        priceHistory: stateRef.current.priceHistory,
        log: stateRef.current.log,
        orders: stateRef.current.orders,
        hackChoices: stateRef.current.hackChoices,
        pendingOrders: {},
        pendingHacks: {},
        submittedOrderIds: [],
        submittedHackIds: [],
        turn: stateRef.current.turn,
        currentN: stateRef.current.currentN,
        screen: stateRef.current.screen,
      });
      setISubmittedOrder(false);
      setISubmittedHack(false);
      setPendingOrders({});
      setPendingHacks({});
      setSubmittedOrderIds([]);
      setSubmittedHackIds([]);
    }, 80);
  }

  function resolveTurn(hacks, playersOverride) {
    const st = stateRef.current || {};
    const basePlayers = playersOverride || st.players || players;
    const nStartR = ensureBaseN(st.currentN != null ? st.currentN : currentN);
    const priceBeforeR = sopf(nStartR);
    const ordersR = (st.orders && Object.keys(st.orders).length) ? st.orders : (orders || {});
    const turnR = st.turn != null ? st.turn : turn;
    // 清算直前に stateRef も同期
    stateRef.current = { ...st, currentN: nStartR, orders: ordersR };
    const { updated, execResults, priceMap, nMap } = settleTurn(
      basePlayers, ordersR, hacks, nStartR, priceBeforeR
    );

    const totalQuick = basePlayers.reduce((s, p) => s + (hacks[p.id]?.quick || 0), 0);
    const totalHeavy = basePlayers.reduce((s, p) => s + (hacks[p.id]?.heavy || 0), 0);

    const cardLines = basePlayers.map((p) => {
      const h = hacks[p.id];
      const parts = [];
      // [ICON:xxx] マーカーは LogPanel が SVG に置換（絵文字回避）
      if (h?.quick > 0) parts.push(`[ICON:quick]操作×${h.quick}`);
      if ((h?.heavy || 0) > 0) parts.push("[ICON:heavy]妨害×" + h.heavy);
      if (h?.defense) parts.push("[ICON:defense]防衛");
      if (h?.reflect) parts.push("[ICON:reflect]反射");
      if (h?.avant) parts.push("[ICON:avant]AVANT-GARDE-操作");
      if (h?.avantSab) parts.push("[ICON:avant]AVANT-GARDE-妨害");
      if (!parts.length) return null;
      return `${p.name}が${parts.join(" ")}を投入`;
    }).filter(Boolean);

    const orderLines = basePlayers.map((p) => {
      const ex = execResults[p.id];
      if (!ex) return null;
      if (ex.bankrupt) return `${p.name}: 破産`;
      if (ex.action === "buy" && ex.sharesFilled > 0) {
        return `${p.name}: 買い ${sharesFmt(ex.sharesFilled)}株 @ ${yenNum(ex.execPrice)}円 (操作+${ex.ownQuick}/被妨害${ex.incomingHeavy})${ex.note ? "("+ex.note+")" : ""}`;
      }
      if (ex.action === "sell" && ex.sharesFilled > 0) {
        return `${p.name}: 売り ${sharesFmt(ex.sharesFilled)}株 @ ${yenNum(ex.execPrice)}円 (操作+${ex.ownQuick}/被妨害${ex.incomingHeavy})${ex.note ? "("+ex.note+")" : ""}`;
      }
      if (ex.note) return `${p.name}: ${ex.note}`;
      return `${p.name}: 様子見`;
    }).filter(Boolean);

    pushLog(`── TERN${turnR} ── 仮株価 ${yenNum(priceBeforeR)}円 / 個人株価制`);
    cardLines.forEach((l) => pushLog("  " + l));
    orderLines.forEach((l) => pushLog("  " + l));

    // チャート用: 最初の人間（または生存人間）の株価を記録
    // 自分の清算を先に表示（ONLINE は myPlayerId、LOCAL は人間プレイヤー）
    const focusId = (
      myPlayerIdRef.current
      || (primaryHuman(basePlayers) || humanPlayersOf(basePlayers)[0] || basePlayers[0]).id
    );
    const focusPrice = priceMap[focusId] != null ? priceMap[focusId] : sopf(nStartR);

    const perHuman = {};
    basePlayers.forEach((hb) => {
      const ha = updated.find((u) => u.id === hb.id) || hb;
      const hp = priceMap[hb.id] != null ? priceMap[hb.id] : sopf(nStartR);
      const vb = totalValue(hb, priceBeforeR);
      const va = ha.isBankrupt ? 0 : totalValue(ha, hp);
      perHuman[hb.id] = {
        id: hb.id,
        name: hb.name,
        isAI: !!hb.isAI,
        nFinal: nMap[hb.id] || nStartR,
        priceFinal: hp,
        humanOrder: ordersR[hb.id] || { action: "stay", shares: 0 },
        humanExec: execResults[hb.id],
        humanCashBefore: hb.cash,
        humanCashAfter: ha.cash,
        humanHoldingsBefore: hb.holdings,
        humanHoldingsAfter: ha.holdings,
        humanAvgPriceAfter: ha.avgPrice,
        humanValueBefore: vb,
        humanValueAfter: va,
        humanDiff: va - vb,
        humanBankrupt: !!ha.isBankrupt,
      };
    });

    const focusReveal = perHuman[focusId] || Object.values(perHuman)[0];

    setPlayers(updated);
    setPriceHistory((h) => [...h, { turn: turnR, price: focusPrice, nFinal: (focusReveal && focusReveal.nFinal) || nStartR }]);
    setRevealFocusId(focusId);
    setRevealData({
      nStart: nStartR,
      nFinal: focusReveal ? focusReveal.nFinal : nStartR,
      priceBefore: priceBeforeR,
      priceFinal: focusReveal ? focusReveal.priceFinal : focusPrice,
      totalQuick,
      totalHeavy,
      refPrice,
      humanOrder: focusReveal ? focusReveal.humanOrder : { action: "stay", shares: 0 },
      humanExec: focusReveal ? focusReveal.humanExec : null,
      priceMap,
      execResults,
      humanCashBefore: focusReveal ? focusReveal.humanCashBefore : 0,
      humanCashAfter: focusReveal ? focusReveal.humanCashAfter : 0,
      humanHoldingsBefore: focusReveal ? focusReveal.humanHoldingsBefore : 0,
      humanHoldingsAfter: focusReveal ? focusReveal.humanHoldingsAfter : 0,
      humanAvgPriceAfter: focusReveal ? focusReveal.humanAvgPriceAfter : 0,
      humanValueBefore: focusReveal ? focusReveal.humanValueBefore : 0,
      humanValueAfter: focusReveal ? focusReveal.humanValueAfter : 0,
      humanDiff: focusReveal ? focusReveal.humanDiff : 0,
      humanBankrupt: focusReveal ? focusReveal.humanBankrupt : false,
      perHuman,
      focusId,
    });
    setPhase("reveal");
  }

  function nextTurn() {
    if (playMode === "online" && onlineRole === "guest") {
      // ゲストはホストの進行を待つ（ホストが next したスナップショット）
      return;
    }
    const humans = humanPlayersOf(players);
    // 人間が全員破産したら残りを自動進行
    if (humans.length > 0 && humans.every((p) => p.isBankrupt)) {
      autoFinishAfterHumanBankrupt();
      return;
    }
    // 生存者が1人以下（人間含む）なら終了
    const alive = players.filter((p) => !p.isBankrupt);
    if (alive.length <= 1) {
      setScreen("over");
      return;
    }
    // CPUが全員破産かつ人間が残っていれば結果へ（対人のみの場合は続行）
    const cpus = players.filter((p) => p.isAI);
    if (cpus.length > 0 && cpus.every((p) => p.isBankrupt) && humans.every((p) => !p.isBankrupt || humans.filter(h=>!h.isBankrupt).length<=1)) {
      const aliveH = humans.filter((p) => !p.isBankrupt);
      if (aliveH.length <= 1) {
        setScreen("over");
        if (playMode === "online" && onlineRole === "host") {
          setTimeout(() => broadcastSnapshotFrom({ screen: "over", players: stateRef.current.players, phase: "reveal" }), 50);
        }
        return;
      }
    }
    if (turn >= totalTurns) {
      setScreen("over");
      if (playMode === "online" && onlineRole === "host") {
        setTimeout(() => broadcastSnapshotFrom({ screen: "over", players: stateRef.current.players, phase: "reveal" }), 50);
      }
      return;
    }
    const next = turn + 1;
    // ラスト5TERN突入時、破産していない生存者にCOIN5枚追加（終盤盛り上げ）
    if (isLastFiveTurns(next, totalTurns) && !isLastFiveTurns(turn, totalTurns)) {
      setPlayers((prev) =>
        prev.map((p) => {
          if (p.isBankrupt) return p;
          const stock = p.cards && p.cards.stock != null ? p.cards.stock : 0;
          return {
            ...p,
            cards: { ...p.cards, stock: stock + 5 },
          };
        })
      );
      const bonusText = "ラスト5TERN・ボーナス：COINが5枚配られました";
      setEndgameBonusMsg(bonusText);
      pushLog("🎁 " + bonusText);
    }
    setTurn(next);
    const cnNext = randBase();
    setCurrentN(cnNext);
    stateRef.current = { ...stateRef.current, turn: next, currentN: cnNext, phase: "market" };
    setPhase("market");
    setHumanOrderDraft({ action: "stay", shares: 0 });
    setHumanHackDraft({ quick: 0, heavy: 0, defense: 0, reflect: 0, avant: 0, avantSab: 0, avantPrice: 1000, coinRescue: "" });
    setOrders({});
    setHackChoices({});
    setRevealData(null);
    setRevealFocusId(null);
    setInputHumanIdx(0);
    setPassBanner(null);
    setISubmittedOrder(false);
    setISubmittedHack(false);
    setPendingOrders({});
    setPendingHacks({});
    setSubmittedOrderIds([]);
    setSubmittedHackIds([]);
    if (playMode === "online" && onlineRole === "host") {
      setTimeout(() => {
        broadcastSnapshotFrom({
          screen: stateRef.current.screen,
          phase: stateRef.current.phase,
          turn: stateRef.current.turn,
          currentN: stateRef.current.currentN,
          players: stateRef.current.players,
          priceHistory: stateRef.current.priceHistory,
          log: stateRef.current.log,
          orders: {},
          hackChoices: {},
          revealData: null,
          endgameBonusMsg: stateRef.current.endgameBonusMsg,
          pendingOrders: {},
          pendingHacks: {},
          submittedOrderIds: [],
          submittedHackIds: [],
        });
      }, 60);
    }
  }

  /** 人間破産後、残りTERNをCPUだけで進めて結果画面へ */
  function autoFinishAfterHumanBankrupt() {
    let pls = players.map((p) => ({ ...p, cards: { ...p.cards }, history: [...(p.history || [])] }));
    let t = turn;
    let hist = priceHistory.slice();
    let lastPrice = hist.length ? hist[hist.length - 1].price : sopf(nStart);

    while (t < totalTurns) {
      t += 1;
      const ns = randBase();
      const pb = sopf(ns);
      const ref = lastPrice || pb;
      const ords = {};
      pls.forEach((p) => {
        if (p.isBankrupt) {
          ords[p.id] = { action: "stay", shares: 0 };
        } else if (p.isAI) {
          const refH = primaryHuman(pls);
          ords[p.id] = clampOrder(aiDecideTrade(Math.random(), ns, pb, p.cash, p.holdings, ref, {
            turn: t,
            totalTurns: totalTurns,
            human: refH,
          }), p.cash, p.holdings, pb, t, totalTurns);
        } else {
          ords[p.id] = { action: "stay", shares: 0 };
        }
      });
      const hks = {};
      pls.forEach((p) => {
        if (p.isBankrupt || !p.isAI) {
          hks[p.id] = { quick: 0, heavy: 0, defense: 0 };
        } else {
          hks[p.id] = aiDecideCards(p.cards, t, totalTurns, ords[p.id], ns, pb, ords, p.id, pls);
        }
      });
      // CPU妨害の同一TERN重複は少なめ（基本1体、5人戦のみ最大2体）
      const aiHeavy = pls.filter((p) => p.isAI && (hks[p.id]?.heavy || 0) > 0);
      const heavySlots = pls.length >= 5 ? 2 : 1;
      if (aiHeavy.length > heavySlots) {
        for (let i = aiHeavy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const tmp = aiHeavy[i]; aiHeavy[i] = aiHeavy[j]; aiHeavy[j] = tmp;
        }
        const keep = new Set(aiHeavy.slice(0, heavySlots).map((p) => p.id));
        aiHeavy.forEach((p) => {
          if (!keep.has(p.id)) hks[p.id] = { quick: hks[p.id].quick || 0, heavy: 0, defense: hks[p.id].defense || 0 };
        });
      }
      const settled = settleTurn(pls, ords, hks, ns, pb);
      pls = settled.updated;
      const fid = (primaryHuman(pls) || humanPlayersOf(pls)[0] || pls[0] || {}).id;
      const hp = (fid && settled.priceMap[fid] != null) ? settled.priceMap[fid] : pb;
      lastPrice = hp;
      hist.push({ turn: t, price: hp, nFinal: (fid && settled.nMap[fid]) || ns });
    }

    setPlayers(pls);
    setPriceHistory(hist);
    setTurn(totalTurns);
    setRevealData(null);
    setPhase("market");
    setScreen("over");
  }

  function quitToTop() {
    setShowQuitConfirm(true);
  }

  function confirmQuit() {
    setShowQuitConfirm(false);
    if (playMode === "online") {
      leaveOnline();
      return;
    }
    setScreen("setup");
  }

  function cancelQuit() {
    setShowQuitConfirm(false);
  }

  const allHumans = humanPlayersOf(players);
  const human = (playMode === "online" && myPlayerId
    ? players.find((p) => p.id === myPlayerId)
    : null) || primaryHuman(players) || allHumans[0];
  // 注文/ハック入力中の対象プレイヤー
  const ahForInput = aliveHumans(players);
  const activeHuman = playMode === "online"
    ? human
    : ((phase === "order" || phase === "hack") && ahForInput[inputHumanIdx]
      ? ahForInput[inputHumanIdx]
      : human);
  // 現在の(未確定)株価を使って評価額を出す。ゲーム中は仮株価、ゲーム終了後は最終確定株価。
  const currentPriceForValue =
    screen === "over"
      ? (priceHistory.length > 0 ? priceHistory[priceHistory.length - 1].price : basePrice)
      : priceBefore;
  const ranked = useMemo(
    () => [...players].sort((a, b) => totalValue(b, currentPriceForValue) - totalValue(a, currentPriceForValue)),
    [players, currentPriceForValue]
  );

  return (
    <div className="ft-root" ref={topRef}>
      <style>{CSS}</style>
      {screen === "setup" && (
        <SetupScreen
          playerCount={playerCount}
          setPlayerCount={setPlayerCount}
          humanCount={humanCount}
          setHumanCount={setHumanCount}
          humanNames={humanNames}
          setHumanNames={setHumanNames}
          seriousMode={seriousMode}
          setSeriousMode={setSeriousMode}
          onStart={startGame}
          playMode={playMode}
          setPlayMode={setPlayMode}
          myName={myName}
          setMyName={setMyName}
          joinCodeInput={joinCodeInput}
          setJoinCodeInput={setJoinCodeInput}
          netStatus={netStatus}
          onCreateRoom={createOnlineRoom}
          onJoinRoom={joinOnlineRoom}
        />
      )}

      {screen === "lobby" && (
        <div className="ft-setup">

              {onlineRole === "host"
                ? "この部屋コードを他のプレイヤーに伝えてください。PeerJS（WebRTC）で接続します。"
                : "ホストの開始を待っています…"}
            </p>
            <div style={{ margin: "14px 0", padding: 12, background: "var(--ft-panel-alt)", border: "1px solid var(--ft-border)", borderRadius: 4 }}>
              <div style={{ fontSize: 11, letterSpacing: 1, opacity: 0.6, marginBottom: 8 }}>参加者</div>
              {(lobbyList.length ? lobbyList : [{ id: "me", name: myName, isHost: onlineRole === "host" }]).map((p) => (
                <div key={p.id} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: "1px dashed var(--ft-border)", fontSize: 13 }}>
                  <span>{p.name}{p.isHost ? "（ホスト）" : ""}</span>
                  <span style={{ color: "var(--ft-accent)", fontSize: 11 }}>{p.connected !== false ? "接続中" : "…"}</span>
                </div>
              ))}
            </div>
            <p style={{ fontSize: 12, color: "var(--ft-amber)", minHeight: 20 }}>{netStatus}</p>
            {onlineRole === "host" && (
              <div className="ft-select-count" style={{ marginBottom: 12 }}>
                <div className="ft-label">席数（不足分はCPU）</div>
                <div className="ft-count-options ft-count-options-players">
                  {[2, 3, 6, 9, 12, 15].map((n) => (
                    <button key={n} className={"ft-count-btn" + (playerCount === n ? " active" : "")} onClick={() => setPlayerCount(n)}>

                    </button>
                  ))}
                </div>
              </div>
            )}
            {onlineRole === "host" && (
              <button className="ft-start-btn" onClick={startOnlineGame}>

            )}

              退出してトップへ
            </button>
          </div>
        </div>
      )}

      {screen === "play" && human && (
        <div className="ft-shell">
          {passBanner && (
            <div className="ft-pass-overlay" onClick={() => setPassBanner(null)}>
              <div className="ft-pass-box" onClick={(e) => e.stopPropagation()}>
                <div className="ft-pass-eyebrow">PASS & PLAY</div>
                <div className="ft-pass-title">{passBanner.name} の番です</div>
                <p className="ft-pass-desc">
                  端末を {passBanner.name} に渡してください。<br />
                  {passBanner.phaseLabel}を入力したら、他のプレイヤーに内容が見えないよう注意。
                </p>
                <button className="ft-primary-btn" onClick={() => setPassBanner(null)}>
                  {passBanner.name} として入力する ▶
                </button>
              </div>
            </div>
          )}
          <TopBar
            turn={turn}
            totalTurns={totalTurns}
            human={activeHuman || human}
            currentPrice={priceBefore}
            onQuit={quitToTop}
            onShowRules={() => setShowRulesModal(true)}
            multiHuman={allHumans.length > 1}
            humanIndex={
              (phase === "order" || phase === "hack") && ahForInput.length
                ? inputHumanIdx + 1
                : null
            }
            humanTotal={
              (phase === "order" || phase === "hack") && ahForInput.length
                ? ahForInput.length
                : null
            }
          />
          <div className="ft-main">
            <div className="ft-col-left">
              <ChartPanel priceHistory={priceHistory} nStart={nStart} priceBefore={priceBefore} refPrice={refPrice} phase={phase} />
              <PlayersPanel players={players} orders={orders} phase={phase} currentPrice={priceBefore} revealData={revealData} />
            </div>
            <div className="ft-col-right">
              <ActionPanel
                phase={phase}
                human={activeHuman || human}
                allHumans={allHumans}
                priceBefore={priceBefore}
                refPrice={refPrice}
                nStart={nStart}
                humanOrderDraft={humanOrderDraft}
                setHumanOrderDraft={setHumanOrderDraft}
                humanHackDraft={humanHackDraft}
                setHumanHackDraft={setHumanHackDraft}
                turn={turn}
                totalTurns={totalTurns}
                endgameBonusMsg={endgameBonusMsg}
                onGoOrder={goToOrderPhase}
                onConfirmOrders={confirmOrders}
                onConfirmHacks={confirmHacks}
                onNextTurn={nextTurn}
                revealData={revealData}
                revealFocusId={revealFocusId}
                setRevealFocusId={setRevealFocusId}
                orders={orders}
                hackChoices={hackChoices}
                players={players}
                inputHumanIdx={inputHumanIdx}
                humanInputTotal={ahForInput.length}
                playMode={playMode}
                onlineRole={onlineRole}
                iSubmittedOrder={iSubmittedOrder}
                iSubmittedHack={iSubmittedHack}
                submittedOrderIds={submittedOrderIds}
                submittedHackIds={submittedHackIds}
                roomCode={roomCode}
              />
              <LogPanel log={log} logEndRef={logEndRef} />
            </div>
          </div>
        </div>
      )}

      {screen === "over" && (
        <GameOverScreen ranked={ranked} currentPrice={currentPriceForValue} onRestart={() => setScreen("setup")} />
      )}

      {showQuitConfirm && (
        <div className="ft-modal-overlay" onClick={cancelQuit}>
          <div className="ft-modal-box" onClick={(e) => e.stopPropagation()}>
            <div className="ft-modal-title">ゲームを中断しますか？</div>
            <p className="ft-modal-desc">
              トップページに戻ります。現在の進行状況は失われます。
            </p>
            <div className="ft-modal-btns">
              <button className="ft-modal-cancel" onClick={cancelQuit}>
                キャンセル
              </button>
              <button className="ft-modal-confirm" onClick={confirmQuit}>
                トップへ戻る
              </button>
            </div>
          </div>
        </div>

      {showRulesModal && (
        <div className="ft-modal-overlay" onClick={() => setShowRulesModal(false)}>
          <div className="ft-modal-box ft-modal-box-wide" onClick={(e) => e.stopPropagation()}>

            <div className="ft-modal-scroll">
              <RulesContent />
            </div>
            <div className="ft-modal-btns">
              <button className="ft-modal-confirm" onClick={() => setShowRulesModal(false)}>
                閉じる
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function SetupScreen({ playerCount, setPlayerCount, humanCount, setHumanCount, humanNames, setHumanNames, seriousMode, setSeriousMode, onStart, playMode, setPlayMode, myName, setMyName, joinCodeInput, setJoinCodeInput, netStatus, onCreateRoom, onJoinRoom }) {
  const baseCoins = CARDS_TABLE[playerCount] || CARDS_TABLE[3];
  const coins = baseCoins + (seriousMode ? SERIOUS_COIN_BONUS : 0);
  const hc = Math.max(1, Math.min(playerCount, Number(humanCount) || 1));
  function changePlayerCount(n) {
    setPlayerCount(n);
    const nextHc = Math.min(hc, n);
    setHumanCount(nextHc);
    setHumanNames((prev) => {
      const arr = [];
      for (let i = 0; i < nextHc; i++) {
        arr.push((prev && prev[i]) || (nextHc === 1 ? "YOU" : ("P" + (i + 1))));
      }
      return arr;
    });
  }
  function changeHumanCount(n) {
    const v = Math.max(1, Math.min(playerCount, n));
    setHumanCount(v);
    setHumanNames((prev) => {
      const arr = [];
      for (let i = 0; i < v; i++) {
        arr.push((prev && prev[i]) || (v === 1 ? "YOU" : ("P" + (i + 1))));
      }
      return arr;
    });
  }
  return (
    <div className="ft-setup">
      <div className="ft-setup-card">
        <div className="ft-eyebrow">SOPF MARKET TERMINAL</div>
        <h1 className="ft-title">
          FACTOR<span className="ft-title-accent">/</span>TRADER
        </h1>

        <RulesContent />

        <div className="ft-select-count">
          <div className="ft-label">MODE</div>
          <div className="ft-count-options">
            <button className={"ft-count-btn" + (playMode === "local" ? " active" : "")} onClick={() => setPlayMode && setPlayMode("local")}>
              <div className="ft-count-num">LOCAL</div>
              <div className="ft-count-turns">vs CPU</div>
            </button>
            <button className={"ft-count-btn" + (playMode === "online" ? " active" : "")} onClick={() => setPlayMode && setPlayMode("online")}>
              <div className="ft-count-num">ONLINE</div>
              <div className="ft-count-turns">対人戦</div>
            </button>
          </div>
        </div>

        {playMode === "online" ? (
          <div className="ft-select-count" style={{ marginTop: 14 }}>
            <div className="ft-label">あなたの名前</div>
            <input
              type="text"
              maxLength={16}
              autoCorrect="off"
              autoComplete="nickname"
              spellCheck={false}
              value={myName || ""}
              onChange={(e) => setMyName && setMyName(e.target.value)}
              style={{ width: "100%", background: "var(--ft-panel-alt)", border: "1px solid var(--ft-border)", color: "var(--ft-text)", padding: "10px 12px", borderRadius: 3, fontSize: 16, marginBottom: 12 }}
            />
            <div className="ft-label">部屋を作る（ホスト）</div>
            <div className="ft-select-count" style={{ marginBottom: 8 }}>
              <div className="ft-label" style={{ opacity: 0.7 }}>席数（後からロビーでも変更可・不足はCPU）</div>
              <div className="ft-count-options ft-count-options-players">
                {[2, 3, 6, 9, 12, 15].map((n) => (
                  <button key={n} className={"ft-count-btn" + (playerCount === n ? " active" : "")} onClick={() => setPlayerCount(n)}>
                    <div className="ft-count-num">{n}<span className="ft-count-people"> PEOPLE</span></div>
                    <div className="ft-count-turns">{TURN_TABLE[n]} TERN</div>
                  </button>
                ))}
              </div>
            </div>
            <div className="ft-label" style={{ marginTop: 4 }}>難易度</div>
            <div className="ft-count-options" style={{ marginBottom: 8 }}>
              <button className={"ft-count-btn" + (!seriousMode ? " active" : "")} onClick={() => setSeriousMode(false)}>
                <div className="ft-count-num">NORMAL</div>
                <div className="ft-count-turns">COIN {baseCoins}</div>
              </button>
              <button className={"ft-count-btn" + (seriousMode ? " active" : "")} onClick={() => setSeriousMode(true)}>
                <div className="ft-count-num">SERIOUS</div>
                <div className="ft-count-turns">COIN {baseCoins + SERIOUS_COIN_BONUS}</div>
              </button>
            </div>
            <p style={{ fontSize: 11, opacity: 0.75, marginBottom: 12, lineHeight: 1.6 }}>
              SERIOUSはCOINがNORMALプレイより10枚多いです。
            </p>

              type="text"
              inputMode="text"
              autoCapitalize="characters"
              autoCorrect="off"
              autoComplete="off"
              spellCheck={false}
              maxLength={6}
              placeholder="部屋コード（6桁）"
              value={joinCodeInput || ""}
              onChange={(e) => {
                // 入力中はそのまま（モバイルIMEで toUpperCase すると文字化け・重複入力になる）
                if (setJoinCodeInput) setJoinCodeInput(e.target.value);
              }}
              onBlur={(e) => {
                if (!setJoinCodeInput) return;
                const cleaned = String(e.target.value || "")
                  .toUpperCase()
                  .replace(/[^A-Z0-9]/g, "")
                  .slice(0, 6);
                setJoinCodeInput(cleaned);
              }}
              style={{ width: "100%", background: "var(--ft-panel-alt)", border: "1px solid var(--ft-border)", color: "var(--ft-text)", padding: "10px 12px", borderRadius: 3, fontSize: 16, letterSpacing: 3, marginBottom: 10, fontFamily: "var(--ft-font-display)" }}

            {netStatus ? <p style={{ fontSize: 12, color: "var(--ft-amber)", marginTop: 10 }}>{netStatus}</p> : null}

          <div className="ft-count-options ft-count-options-players">
            {[2, 3, 6, 9, 12, 15].map((n) => (
              <button
                key={n}
                className={"ft-count-btn" + (playerCount === n ? " active" : "")}
                onClick={() => changePlayerCount(n)}
              >
                <div className="ft-count-num">{n}<span className="ft-count-people"> PEOPLE</span></div>

function ChartPanel({ priceHistory, nStart, priceBefore, refPrice, phase }) {
  const max = Math.max(20, ...priceHistory.map((h) => h.price), priceBefore || 0, refPrice || 0);
  const points = priceHistory.slice(-8);
  const w = 560;
  const h = 160;
  const stepX = points.length > 1 ? w / (points.length - 1) : w;

  const path = points
    .map((p, i) => {
      const x = points.length > 1 ? i * stepX : w / 2;
      const y = h - (p.price / max) * (h - 20) - 10;
      return `${i === 0 ? "M" : "L"}${x},${y}`;
    })
    .join(" ");

  const diff = priceBefore - refPrice;
  const diffPct = refPrice > 0 ? ((priceBefore / refPrice - 1) * 100) : 0;

  return (
    <div className="ft-panel ft-panel-chart">
      <div className="ft-panel-head">
        <Activity size={15} /> MARKET FEED
      </div>
      <div className="ft-chart-body">
      <div className="ft-refprice-box">
        <div className="ft-refprice-label">📌 前回終値（値動きの目安。実際の売買は最終株価で株価します）</div>
        <div className="ft-refprice-row">
          <span className="ft-refprice-value">{yenNum(refPrice)}円</span>
          <span className="ft-refprice-arrow">→</span>
          <span className="ft-refprice-value current">{yenNum(priceBefore)}円</span>
          <span className={"ft-refprice-diff" + (diff > 0 ? " up" : diff < 0 ? " down" : "")}>
            {diff === 0 ? "±0" : diff > 0 ? `+${diff}円` : `${diff}円`}
            {refPrice > 0 && ` (${diffPct >= 0 ? "+" : ""}${diffPct.toFixed(1)}%)`}
          </span>
        </div>
      </div>
      <div className="ft-market-open">
        <div>
          <div className="ft-mo-label">ベース数 N</div>
          <div className="ft-mo-value">{nStart.toLocaleString()}</div>
        </div>
        <div className="ft-mo-arrow">=</div>
        <div>
          <div className="ft-mo-label">仮株価 (ハック前)</div>
          <div className="ft-mo-value price">{yenNum(priceBefore)}円</div>
        </div>
      </div>
      <svg viewBox={`0 0 ${w} ${h}`} className="ft-chart-svg">
        <line x1="0" y1={h - 10} x2={w} y2={h - 10} stroke="var(--ft-grid)" strokeWidth="1" />
        {points.length > 0 && (
          <path d={path} fill="none" stroke="var(--ft-accent)" strokeWidth="2.5" />
        )}
        {points.map((p, i) => {
          const x = points.length > 1 ? i * stepX : w / 2;
          const y = h - (p.price / max) * (h - 20) - 10;
          return <circle key={i} cx={x} cy={y} r="3.5" fill="var(--ft-accent)" />;
        })}
      </svg>
      {priceHistory.length === 0 && (
        <div className="ft-chart-empty">まだ取引履歴がありません — 最初のTERNを開始してください</div>
      )}
      </div>
    </div>
  );
}

function PlayersPanel({ players, orders, phase, currentPrice, revealData }) {
  const rankMap = useMemo(() => {
    const sorted = [...players].sort(
      (a, b) => totalValue(b, currentPrice) - totalValue(a, currentPrice)
    );
    const map = {};
    let rank = 1;
    for (let i = 0; i < sorted.length; i++) {
      if (i > 0) {
        const prev = totalValue(sorted[i - 1], currentPrice);
        const cur = totalValue(sorted[i], currentPrice);
        if (cur < prev) rank = i + 1;
      }
      map[sorted[i].id] = rank;
    }
    return map;
  }, [players, currentPrice]);
  const isReveal = phase === "reveal" && revealData && revealData.execResults;
  const humanHeavyCount = isReveal && revealData.execResults["human"] ? (revealData.execResults["human"].usedHeavy || 0) : 0;
  const humanUsedHeavy = humanHeavyCount > 0;
  const notes = [];
  if (isReveal) {
    // 表示順: 奥義(紫) → 妨害(赤) → 防衛(黄) → 操作(青) → 帳消し
    // --- 0. 奥義 ---
    players.forEach((p) => {
      const ex = revealData.execResults[p.id];
      if (!ex || !ex.avant) return;
      const who = p.name;
      notes.push({
        cls: "note-avant",
        icon: "avant",
        text: who + "が奥義：AVANT-GARDE-操作を使用 — 自分の株価 " + yenNum(ex.avantPrice || 0) + "円",
      });
    });
    players.forEach((p) => {
      const ex = revealData.execResults[p.id];
      if (!ex || !ex.avantSab) return;
      const who = p.name;
      notes.push({
        cls: "note-avant",
        icon: "avant",
        text: who + "が奥義：AVANT-GARDE-妨害を使用 — 他者の株価 " + yenNum(ex.avantPrice || 0) + "円",
      });
    });
    // --- 1. 妨害 ---
    players.forEach((p) => {
      const ex = revealData.execResults[p.id];
      if (!ex) return;
      const uh = ex.usedHeavy || 0;
      if (uh <= 0) return;
      const who = p.name;
      notes.push({
        cls: "note-heavy",
        icon: "heavy",
        text: who + "が妨害を " + uh + " 枚使用しました" + (!p.isAI ? "（相手の株価を妨害）" : ""),
      });
    });
    // --- 2. 防衛 ---
    players.forEach((p) => {
      const ex = revealData.execResults[p.id];
      if (!ex || !ex.defense) return;
      const who = p.name;
      const blocked = ex.blockedHeavy || 0;
      const sabBlock = !!ex.sabBlockedByDef;
      notes.push({
        cls: "note-defense",
        icon: "defense",
        text: who + "が防衛を使用（COIN5枚）"
          + (blocked > 0 ? " → 被妨害×" + blocked + " を無効化" : "")
          + (sabBlock ? " → AVANT-GARDE-妨害を無効化" : ""),
      });
    });
    // --- 2b. 反射 ---
    players.forEach((p) => {
      const ex = revealData.execResults[p.id];
      if (!ex || !ex.reflect) return;
      const who = p.name;
      const out = ex.reflectedOut || 0;
      notes.push({
        cls: "note-reflect",
        icon: "reflect",
        text: who + "が反射を使用（COIN5枚）" + (out > 0 ? " → 被妨害×" + out + " を相手に反射" : ""),
      });
    });
    // --- 3. 操作 ---
    players.forEach((p) => {
      const ex = revealData.execResults[p.id];
      if (!ex) return;
      const oq = ex.ownQuick || 0;
      if (oq <= 0) return;
      const who = p.name;
      if (!p.isAI) {
        const nullified = !!ex.quickNullified;
        notes.push({
          cls: nullified ? "note-heavy" : "note-quick",
          icon: "quick",
          text: who + "が操作を " + oq + " 枚使用" + (nullified ? " → 被妨害により無効化" : "しました"),
        });
        return;
      }
      const action = ex.action || "stay";
      const filled = ex.sharesFilled || 0;
      const priceWith = ex.execPrice;
      const priceWithout = personalExecPrice(revealData.nStart, 0, ex.incomingHeavy || 0, action);
      let assetDelta = 0;
      if (action === "buy" && filled > 0) assetDelta = (priceWithout - priceWith) * filled;
      if (action === "sell" && filled > 0) assetDelta = (priceWith - priceWithout) * filled;
      let deltaText = "";
      if (action === "stay" || filled <= 0) {
        deltaText = "（注文なし／未成立のため総資産への直接影響なし）";
      } else if (assetDelta > 0) {
        deltaText = "（操作により総資産 +" + yen(assetDelta) + "）";
      } else if (assetDelta < 0) {
        deltaText = "（操作により総資産 " + yen(assetDelta) + "）";
      } else {
        deltaText = "（操作による総資産の増減なし）";
      }
      const nullified = !!ex.quickNullified;
      notes.push({
        cls: nullified ? "note-heavy" : "note-quick",
        icon: "quick",
        text: who + "が操作を " + oq + " 枚使用" + (nullified ? " → 被妨害により無効化" : deltaText),
      });
    });
    // --- 4. 帳消し ---
    players.forEach((p) => {
      const ex = revealData.execResults[p.id];
      if (!ex || !ex.bailout) return;
      const n = ex.bailoutCards || 10;
      const who = p.name;
      notes.push({ cls: "note-bailout", text: who + "がCOIN" + n + "枚を消費し、買い注文を帳消ししました" });
    });
    // --- 5. COIN補充 ---
    players.forEach((p) => {
      const ex = revealData.execResults[p.id];
      if (!ex || !ex.coinRescue) return;
      const who = p.name;
      const lab = coinRescueLabel(ex.coinRescue) || ex.coinRescue;
      notes.push({ cls: "note-bailout", text: who + "がCOIN補充（" + lab + "）" });
    });
  }
  return (
    <div className="ft-panel ft-panel-players">
      <div className="ft-panel-head"><User size={15} /> TRADERS</div>
      <div className="ft-players-body">
      <div className="ft-players-grid">
        {players.map((p) => {
          let glow = "";
          if (isReveal) {
            const ex = revealData.execResults[p.id] || {};
            const oq = ex.ownQuick || 0;
            const uh = ex.usedHeavy || 0;
            const df = !!ex.defense;
            const rf = !!ex.reflect;
            const av = !!ex.avant || !!ex.avantSab;
            // 優先: 奥義(紫) > 操作(青) > 防衛(黄) > 反射(白) > 被妨害(赤)
            const hit = ex.incomingHeavy || 0;
            const forcedSab = !!ex.forcedBySab;
            if (av) glow = " glow-purple";
            else if (oq > 0) glow = " glow-blue";
            else if (df) glow = " glow-amber";
            else if (rf) glow = " glow-white";
            else if (hit > 0 || forcedSab) glow = " glow-red";
          }
          return (
          <div key={p.id} className={"ft-player-card" + (p.isAI ? " ai" : " human") + glow + (p.isBankrupt ? " bankrupt" : "")}>
            <span className="ft-pc-rank">{rankMap[p.id]}位</span>
            <div className="ft-pc-name">{p.isAI ? <Cpu size={13} /> : <User size={13} />} {p.name}</div>
            <div className="ft-pc-cash">{p.isBankrupt ? "破産" : yen(totalValue(p, currentPrice))}</div>
            <div className="ft-pc-holdings">現金{yen(p.cash)} ／ {sharesFmt(p.holdings)}株{p.holdings > 0 ? `(@${p.avgPrice.toFixed(1)})` : ""}</div>
            <div className="ft-pc-cards"><Coin size={12} className="icon-coin" /> {p.cards.stock != null ? p.cards.stock : 0}</div>
            {phase !== "market" && phase !== "order" && orders[p.id] && (
              <div className={"ft-pc-order tag-" + orders[p.id].action}>
                {orders[p.id].action === "buy" ? `買い ${sharesFmt(orders[p.id].shares)}株` : orders[p.id].action === "sell" ? `売り ${sharesFmt(orders[p.id].shares)}株` : "様子見"}
              </div>
            )}
          </div>
          );
        })}
      </div>
      {notes.length > 0 && (
        <div className="ft-traders-notes">
          {notes.map((n, i) => (
            <div key={i} className={n.cls} style={{ display: "flex", alignItems: "center", gap: 6 }}>
              {n.icon === "quick" && <Zap size={13} className="icon-quick" style={{ flexShrink: 0 }} />}
              {n.icon === "heavy" && <Bomb size={13} className="icon-heavy" style={{ flexShrink: 0 }} />}
              {n.icon === "defense" && <Shield size={13} className="icon-defense" style={{ flexShrink: 0 }} />}
              {n.icon === "reflect" && <Reflect size={13} className="icon-reflect" style={{ flexShrink: 0 }} />}
              {n.icon === "avant" && <Heptagram size={13} className="icon-avant" style={{ flexShrink: 0 }} />}
              <span>{n.text}</span>
            </div>
          ))}
        </div>
      )}
      </div>
    </div>
  );
}

function ActionPanel(props) {
  const [opPreviewExpand, setOpPreviewExpand] = React.useState(false);
  const {
    phase,
    human,
    allHumans,
    priceBefore,
    refPrice,
    nStart,
    humanOrderDraft,
    setHumanOrderDraft,
    humanHackDraft,
    setHumanHackDraft,
    turn,
    totalTurns,
    onGoOrder,
    onConfirmOrders,
    onConfirmHacks,
    onNextTurn,
    revealData,
    revealFocusId,
    setRevealFocusId,
    orders,
    hackChoices,
    players,
    endgameBonusMsg,
    inputHumanIdx,
    humanInputTotal,
    playMode,
    onlineRole,
    iSubmittedOrder,
    iSubmittedHack,
    submittedOrderIds,
    submittedHackIds,
    roomCode,
  } = props;
  const multiHuman = playMode !== "online" && (allHumans || []).length > 1;
  const isLastHumanInput = multiHuman && humanInputTotal > 0 && inputHumanIdx >= humanInputTotal - 1;
  const isOnline = playMode === "online";
  const onlineWaitingOrder = isOnline && iSubmittedOrder && phase === "order";
  const onlineWaitingHack = isOnline && iSubmittedHack && phase === "hack";
  const aliveHumanIds = (players || []).filter((p) => !p.isAI && !p.isBankrupt).map((p) => p.id);
  const orderWaitCount = (submittedOrderIds || []).filter((id) => aliveHumanIds.indexOf(id) >= 0).length;
  const hackWaitCount = (submittedHackIds || []).filter((id) => aliveHumanIds.indexOf(id) >= 0).length;

  if (phase === "market") {
    return (
      <div className="ft-panel ft-action">
        <div className="ft-panel-head">STEP 1 — 市場開示</div>
        <p className="ft-action-desc">
          今TERNのベース数字 <b>{nStart.toLocaleString()}</b> が公開されました。
          仮株価は <b className="ft-highlight">{yenNum(priceBefore)}円</b>（{factorString(nStart)}）。
          基準株価 <b className="ft-highlight">{yenNum(refPrice)}円</b> と比べて
          {priceBefore > refPrice ? "上振れ" : priceBefore < refPrice ? "下振れ" : "同水準"}
          しています。高騰（素数）を狙うか、暴落（2の累乗）に備えるか——判断のときです。
        </p>
        {isOnline && onlineRole === "guest" ? (
          <p className="ft-action-desc" style={{ color: "var(--ft-amber)" }}>ホストが注文フェーズを開始するまでお待ちください…</p>
        ) : (
          <button className="ft-primary-btn" onClick={onGoOrder}>
            注文フェーズへ ▶
          </button>
        )}
        {isOnline && roomCode ? (
          <div style={{ marginTop: 10, fontSize: 11, opacity: 0.6 }}>ONLINE ROOM {roomCode}</div>
        ) : null}
      </div>
    );
  }

  if (phase === "order") {
    const maxBuyShares = priceBefore > 0 ? Math.floor(human.cash / priceBefore) : 0;
    const maxSellShares = human.holdings;
    const endgameLock = isLastFiveTurns(turn, totalTurns);
    // 終盤は様子見を許さない（ドラフトが stay のまま残っていても表示・操作を補正）
    let action = humanOrderDraft.action;
    let shares = humanOrderDraft.shares || 0;
    if (endgameLock && action === "stay") {
      if (maxSellShares > 0) {
        action = "sell";
        shares = minOrderShares("sell", human.holdings, maxBuyShares);
      } else if (maxBuyShares > 0) {
        action = "buy";
        shares = minOrderShares("buy", human.holdings, maxBuyShares);
      }
    }
    if (endgameLock && (action === "buy" || action === "sell")) {
      const cap = action === "buy" ? maxBuyShares : maxSellShares;
      const minS = minOrderShares(action, human.holdings, maxBuyShares);
      if (cap > 0) {
        if (shares < minS) shares = minS;
        if (shares > cap) shares = cap;
      }
    }
    const estCost = shares * priceBefore;
    const unrealizedPnl = human.holdings > 0 ? (priceBefore - human.avgPrice) * human.holdings : 0;
    const minSharesNow = (action === "buy" || action === "sell")
      ? (endgameLock ? minOrderShares(action, human.holdings, maxBuyShares) : 1)
      : 0;

    function setAction(a) {
      if (endgameLock && a === "stay") return;
      const cap = a === "buy" ? maxBuyShares : a === "sell" ? maxSellShares : 0;
      if (a === "stay") {
        setHumanOrderDraft({ action: "stay", shares: 0 });
        return;
      }
      if (cap <= 0) return; // 売り余力・買い余力なし
      const minS = endgameLock ? minOrderShares(a, human.holdings, maxBuyShares) : 1;
      const cur = humanOrderDraft.shares || 0;
      const next = Math.min(cap, Math.max(minS, cur >= minS ? cur : minS));
      setHumanOrderDraft({ action: a, shares: next });
    }
    function setShares(n) {
      const a = action === "stay" ? (maxSellShares > 0 ? "sell" : "buy") : action;
      const cap = a === "buy" ? maxBuyShares : maxSellShares;
      if (cap <= 0) return;
      const minS = endgameLock ? minOrderShares(a, human.holdings, maxBuyShares) : 0;
      const v = Math.max(minS, Math.min(cap, Math.floor(n) || 0));
      setHumanOrderDraft({ action: a, shares: v });
    }

    return (
      <div className="ft-panel ft-action">
        <div className="ft-panel-head">STEP 2 — 投資注文</div>
        <p className="ft-action-desc">
          現仮株価 <b className="ft-highlight">{yenNum(priceBefore)}円</b> を目安に、何株「買う」か「売る」かを決めます。
          実際の株価は、この後の市場ハックで確定する<b>最終株価</b>で行われます。
          {endgameLock && (
            <span style={{ display: "block", marginTop: 8, color: "var(--ft-amber)" }}>
              終盤ルール（ラスト5TERN）: 様子見禁止 / 売りは保有の50%以上・買いは買付余力の50%以上から自由に選択
            </span>
          )}
          {endgameBonusMsg && (
            <span style={{ display: "block", marginTop: 8, color: "var(--ft-green)", fontWeight: 600 }}>
              🎁 {endgameBonusMsg}
            </span>
          )}
        </p>
        <div className="ft-private-box" style={{ marginBottom: 12 }}>
          <div className="ft-private-head">操作した場合の株価</div>
          <div className="ft-private-desc" style={{ lineHeight: 1.7, fontSize: 12 }}>
            <div style={{ opacity: 0.75, marginBottom: 4 }}>仮株価（操作0枚）: <b>{yenNum(priceBefore)}円</b></div>
            {Array.from({ length: opPreviewExpand ? 15 : 5 }, (_, i) => i + 1).map((q) => {
              const px = previewSelfPrice(nStart, q);
              return (
                <div key={q}>
                  操作{q}枚→株価 <b style={{ color: "var(--ft-blue)" }}>{yenNum(px)}円</b>
                  {px !== priceBefore ? (
                    <span style={{ opacity: 0.7, marginLeft: 6 }}>
                      ({px > priceBefore ? "+" : ""}{yenNum(px - priceBefore)}円)
                    </span>
                  ) : null}
                </div>
              );
            })}
            {!opPreviewExpand ? (
              <button
                type="button"
                onClick={() => setOpPreviewExpand(true)}
                style={{
                  marginTop: 6,
                  padding: "2px 8px",
                  fontSize: 11,
                  background: "transparent",
                  border: "none",
                  color: "rgba(255,255,255,0.45)",
                  cursor: "pointer",
                  letterSpacing: "0.04em",
                }}
              >rest ▾</button>
            ) : (
              <button

                onClick={() => setOpPreviewExpand(false)}
                style={{
                  marginTop: 6,
                  padding: "2px 8px",
                  fontSize: 11,

                    <b style={{ color: "var(--ft-blue)" }}>操作</b>：自分の株価を操作（被妨害時は無効）<br />
                    あなたの株価目安 <b>{yenNum(selfPrice)}円</b>
                    {baseP !== selfPrice ? `（操作前 ${yenNum(baseP)}円）` : ""}
                    <br />
                    自分のみ作用。
                  </span>
                ) : null}
                {!humanHackDraft.avant && !humanHackDraft.avantSab && humanHackDraft.heavy > 0 ? (
                  <span style={{ display: "block", marginBottom: 8 }}>
                    <b style={{ color: "var(--ft-red)" }}>妨害</b>：自分以外の株価を妨害（N+1）<br />
                    自分には無効、他プレイヤーと重複する可能性あり<br />
                    買い：<b>{yenNum(buy0)}円→{yenNum(personalExecPrice(nStart, 0, humanHackDraft.heavy, "buy"))}円</b>
                    <br />
                    売り：<b>{yenNum(sell0)}円→{yenNum(personalExecPrice(nStart, 0, humanHackDraft.heavy, "sell"))}円</b>
                  </span>
                ) : null}
                {!humanHackDraft.avant && !humanHackDraft.avantSab && humanHackDraft.defense ? (
                  <span style={{ display: "block" }}>
                    <b style={{ color: "var(--ft-amber)" }}>防衛</b>：相手からの妨害・反射・AVANT-GARDE-妨害を無効化<br />
                    COIN5枚
                  </span>
                ) : null}
                {!humanHackDraft.avant && !humanHackDraft.avantSab && humanHackDraft.reflect ? (
                  <span style={{ display: "block" }}>
                    <b style={{ color: "var(--ft-text)" }}>反射</b>：妨害の効果を相手に反射<br />
                    COIN5枚
                  </span>
                ) : null}
              </p>
            </div>
          );
        })() : null}
        {multiHuman ? (
          <div style={{ fontSize: 12, marginBottom: 10, color: "var(--ft-amber)" }}>
            {human.name} のCOIN（{inputHumanIdx + 1}/{humanInputTotal}）
          </div>
        ) : null}
        {isOnline ? (
          <div style={{ fontSize: 12, marginBottom: 10, color: "var(--ft-amber)" }}>
            提出状況 {hackWaitCount}/{aliveHumanIds.length}
            {onlineWaitingHack ? " — 他のプレイヤーを待っています…" : ""}
          </div>
        ) : null}
        {onlineWaitingHack ? (
          <div className="ft-primary-btn danger" style={{ opacity: 0.5, pointerEvents: "none", textAlign: "center" }}>
            提出済み（待機中）
          </div>
        ) : (
          <button className="ft-primary-btn danger" onClick={onConfirmHacks}>
            {multiHuman && !isLastHumanInput
              ? human.name + " のCOINを確定 → 次のプレイヤーへ ▶"
              : isOnline
              ? "COINを提出 ▶"
              : "COINをセットして開示 ▶"}
          </button>
        )}
      </div>
    );
  }

  if (phase === "reveal" && revealData) {
    const per = revealData.perHuman || {};
    const focusId = revealFocusId || (human && human.id) || revealData.focusId;
    const focused = (focusId && per[focusId]) || null;
    const view = focused || {
      humanOrder: revealData.humanOrder,
      humanExec: revealData.humanExec,
      nFinal: revealData.nFinal,
      priceFinal: revealData.priceFinal,
      humanCashBefore: revealData.humanCashBefore,
      humanCashAfter: revealData.humanCashAfter,
      humanHoldingsBefore: revealData.humanHoldingsBefore,
      humanHoldingsAfter: revealData.humanHoldingsAfter,
      humanAvgPriceAfter: revealData.humanAvgPriceAfter,
      humanValueBefore: revealData.humanValueBefore,
      humanValueAfter: revealData.humanValueAfter,
      humanDiff: revealData.humanDiff,
      humanBankrupt: revealData.humanBankrupt,
      name: human ? human.name : "YOU",
    };
    const hex = view.humanExec || {};
    const myQuick = hex.ownQuick || 0;
    const hitHeavy = hex.incomingHeavy || 0;
    const myDefense = !!hex.defense;
    const blockedHeavy = hex.blockedHeavy || 0;
    const usedHeavy = hex.usedHeavy || 0;
    const myAvant = !!hex.avant;
    const myAvantSab = !!hex.avantSab;
    // 自分を先頭に、全プレイヤーの清算タブ
    const selfId = (human && human.id) || null;
    const humanNamesList = Object.values(per).slice().sort((a, b) => {
      if (selfId && a.id === selfId) return -1;
      if (selfId && b.id === selfId) return 1;
      if (!a.isAI && b.isAI) return -1;
      if (a.isAI && !b.isAI) return 1;
      return 0;
    });
    return (
      <div className="ft-panel ft-action">
        <div className="ft-panel-head">STEP 4 — 清算結果{view.name ? "（" + view.name + "）" : ""}</div>
        {humanNamesList.length > 0 ? (
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 12 }}>
            {humanNamesList.map((h) => (
              <button
                key={h.id}
                type="button"
                onClick={() => setRevealFocusId && setRevealFocusId(h.id)}
                style={{
                  padding: "6px 10px",
                  fontSize: 11,
                  borderRadius: 3,
                  cursor: "pointer",
                  border: (focusId === h.id) ? "1px solid var(--ft-accent)" : "1px solid var(--ft-border)",
                  background: (focusId === h.id) ? "rgba(57,255,156,0.12)" : "var(--ft-panel-alt)",
                  color: (focusId === h.id) ? "var(--ft-accent)" : "var(--ft-text-dim)",
                }}
              >
                {h.name}{h.isAI ? "（CPU）" : ""}{h.humanBankrupt ? "（破産）" : ""}
              </button>
            ))}
          </div>
        ) : null}

        {view.humanBankrupt && (
          <div className="ft-bankrupt-banner">
            <div className="ft-bankrupt-title">破産</div>
            <div className="ft-bankrupt-desc">
              買付代金を支払えず破産しました（COIN10枚未満で帳消し不可）。以降のプレイはできません。
              残りTERNはCPUが自動進行し、最終結果を表示します。
            </div>
          </div>
        )}
        {!view.humanBankrupt && view.humanExec && view.humanExec.bailout && (
          <div className="ft-bailout-banner">
            <div className="ft-bailout-title">帳消し</div>
            <div className="ft-bailout-desc">
              COINを{view.humanExec.bailoutCards || 10}枚消費し、このTERNの買い注文をキャンセルして破産を回避しました。
            </div>
          </div>
        )}

        <div className="ft-card-banner">
          <div className="ft-card-banner-title">このTERNのCOIN</div>
          <div className="ft-card-banner-body">
            {myAvant && (
              <span className="ft-card-banner-chip" style={{ color: "var(--ft-purple)", background: "rgba(192,132,252,0.15)", border: "1px solid rgba(192,132,252,0.45)" }}>
                <Heptagram size={15} style={{ marginRight: 6, verticalAlign: "middle", flexShrink: 0 }} />
                奥義：AVANT-GARDE-操作
              </span>
            )}
            {!!hex.avantSab && (
              <span className="ft-card-banner-chip" style={{ color: "var(--ft-purple)", background: "rgba(192,132,252,0.15)", border: "1px solid rgba(192,132,252,0.45)" }}>
                <Heptagram size={15} style={{ marginRight: 6, verticalAlign: "middle", flexShrink: 0 }} />
                奥義：AVANT-GARDE-妨害
              </span>
            )}
            {!!hex.forcedBySab && (
              <span className="ft-card-banner-chip heavy">
                <Heptagram size={15} style={{ marginRight: 6, verticalAlign: "middle", flexShrink: 0 }} />
                AVANT-GARDE-妨害で株価固定
              </span>
            )}
            {myQuick > 0 && (
              <span className={"ft-card-banner-chip " + (hitHeavy > 0 ? "heavy" : "quick")}>
                <Zap size={15} style={{ marginRight: 6, verticalAlign: "middle", flexShrink: 0 }} />
                {hitHeavy > 0
                  ? `操作 ×${myQuick} → 被妨害で無効`
                  : `操作 ×${myQuick}`}
              </span>
            )}
            {hitHeavy > 0 && (
              <span className="ft-card-banner-chip heavy">
                <Bomb size={15} style={{ marginRight: 6, verticalAlign: "middle", flexShrink: 0 }} />
                妨害 ×{hitHeavy}
              </span>
            )}
            {myDefense ? (
              <span className="ft-card-banner-chip defense">
                <Shield size={15} style={{ marginRight: 6, verticalAlign: "middle", flexShrink: 0 }} />
                防衛{blockedHeavy > 0 ? `（妨害×${blockedHeavy}を無効化）` : ""}{hex.sabBlockedByDef ? "（AVANT-GARDE-妨害を無効化）" : (blockedHeavy <= 0 && !hex.sabBlockedByDef ? "（妨害なし）" : "")}
              </span>
            ) : null}
            {!!hex.reflect ? (
              <span className="ft-card-banner-chip reflect">
                <Reflect size={15} style={{ marginRight: 6, verticalAlign: "middle", flexShrink: 0 }} />
                反射{(hex.reflectedOut || 0) > 0 ? `（妨害×${hex.reflectedOut}を反射）` : ""}
              </span>
            ) : null}
            {!myDefense && !hex.reflect && hitHeavy <= 0 && !myAvant && !hex.avantSab && !hex.forcedBySab ? (
              <span className="ft-card-banner-chip none-hit">
                誰にも妨害されなかった
              </span>
            ) : null}
          </div>
          <div className="ft-card-banner-note">
            仮株価 {yenNum(revealData.priceBefore)}円 → 最終株価 <b>{yenNum(view.priceFinal)}円</b>
            {view.priceFinal > revealData.priceBefore
              ? `（+${view.priceFinal - revealData.priceBefore}円）`
              : view.priceFinal < revealData.priceBefore
              ? `（${view.priceFinal - revealData.priceBefore}円）`
              : ""}
          </div>
        </div>

        <div className="ft-reveal-box">
          <div className="ft-reveal-row">
            <span>N_start</span>
            <b>{revealData.nStart.toLocaleString()}</b>
          </div>
          {myQuick > 0 && (
            <div className="ft-reveal-row quick">
              <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>
                <Zap size={14} className="icon-quick" /> 操作
              </span>
              <b>+{myQuick}</b>
            </div>
          )}
          {hitHeavy > 0 && (
            <div className="ft-reveal-row heavy">
              <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>
                <Bomb size={14} className="icon-heavy" /> 妨害
              </span>
              <b>+{hitHeavy}</b>
            </div>
          )}
          {myDefense && (
            <div className="ft-reveal-row" style={{ color: "var(--ft-amber)" }}>
              <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>
                <Shield size={14} className="icon-defense" /> 防衛
              </span>
              <b>{blockedHeavy > 0 ? `妨害×${blockedHeavy}を無効化` : "妨害なし"}</b>
            </div>
          )}
          <div className="ft-reveal-row final">
            <span>あなたの N</span>
            <b>{view.nFinal.toLocaleString()}</b>
          </div>
          <div className="ft-reveal-row price">
            <span>あなたの株価</span>
            <b>{yenNum(view.priceFinal)}円</b>
            <span className="ft-factor-note">{factorString(view.nFinal)}</span>
          </div>
        </div>

        <div className="ft-panel-head" style={{ marginTop: 4 }}>あなたの株価結果</div>
        <div className="ft-reveal-box">
          <div className="ft-reveal-row">
            <span>注文</span>
            <b>
              {view.humanOrder.action === "buy"
                ? "買い"
                : view.humanOrder.action === "sell"
                ? "売り"
                : "様子見"}
              {view.humanOrder.action !== "stay" && ` ${sharesFmt(view.humanOrder.shares)}株`}
            </b>
          </div>
          {view.humanOrder.action !== "stay" && (
            <div className="ft-reveal-row">
              <span>株価株数 @ 最終株価</span>
              <b>
                {sharesFmt(view.humanExec.sharesFilled)}株 @ {yenNum(view.priceFinal)}円
                {view.humanExec.note && <span className="ft-factor-note"> {view.humanExec.note}</span>}
              </b>
            </div>
          )}
          <div className="ft-reveal-row">
            <span>現金</span>
            <b>{yen(view.humanCashBefore)} → {yen(view.humanCashAfter)}</b>
          </div>
          <div className="ft-reveal-row">
            <span>保有株</span>
            <b>
              {sharesFmt(view.humanHoldingsBefore)}株 → {sharesFmt(view.humanHoldingsAfter)}株
              {view.humanHoldingsAfter > 0 && ` (平均${view.humanAvgPriceAfter.toFixed(1)}円)`}
            </b>
          </div>
          <div className="ft-reveal-row">
            <span>総資産</span>
            <b>{yen(view.humanValueBefore)} → {yen(view.humanValueAfter)}</b>
          </div>
          <div className="ft-reveal-row final">
            <span>総資産の変動</span>
            <b className={view.humanDiff > 0 ? "pnl-up" : view.humanDiff < 0 ? "pnl-down" : ""}>
              {view.humanDiff === 0
                ? "±0"
                : view.humanDiff > 0
                ? `+${yen(view.humanDiff)}`
                : `-${yen(Math.abs(view.humanDiff))}`}
            </b>
          </div>
        </div>

        {isOnline && onlineRole === "guest" ? (
          <p className="ft-action-desc" style={{ color: "var(--ft-amber)" }}>ホストが次のTERNへ進めるまでお待ちください…</p>
        ) : (
          <button className="ft-primary-btn" onClick={onNextTurn}>
            {view.humanBankrupt || (players || []).filter((p) => p.isAI).every((p) => p.isBankrupt)
              ? "最終結果を見る ▶"
              : "次のTERNへ ▶"}
          </button>
        )}
      </div>
    );
  }

  return null;
}

/** ログ文字列内の [ICON:quick|heavy|defense|avant] を SVG アイコンに置換 */
function renderLogLine(text) {
  const s = String(text == null ? "" : text);
  const re = /\[ICON:(quick|heavy|defense|reflect|avant)\]/g;
  const nodes = [];
  let last = 0;
  let m;
  let key = 0;
  while ((m = re.exec(s)) !== null) {
    if (m.index > last) {
      nodes.push(s.slice(last, m.index));
    }
    const kind = m[1];
    const iconStyle = { display: "inline-block", verticalAlign: "middle", margin: "0 3px 0 1px", flexShrink: 0 };
    if (kind === "quick") {
      nodes.push(<Zap key={"i" + key++} size={12} className="icon-quick" style={iconStyle} />);
    } else if (kind === "heavy") {
      nodes.push(<Bomb key={"i" + key++} size={12} className="icon-heavy" style={iconStyle} />);
    } else if (kind === "defense") {
      nodes.push(<Shield key={"i" + key++} size={12} className="icon-defense" style={iconStyle} />);
    } else if (kind === "reflect") {
      nodes.push(<Reflect key={"i" + key++} size={12} className="icon-reflect" style={iconStyle} />);
    } else if (kind === "avant") {
      nodes.push(<Heptagram key={"i" + key++} size={12} className="icon-avant" style={iconStyle} />);
    }
    last = m.index + m[0].length;
  }
  if (last < s.length) nodes.push(s.slice(last));
  if (nodes.length === 0) return s;
  return nodes;
}

function LogPanel({ log, logEndRef }) {
  return (
    <div className="ft-panel ft-logpanel">

            {renderLogLine(l)}
          </div>
        ))}
        <div ref={logEndRef} />
      </div>
    </div>
  );
}
