function ChartPanel({ priceHistory, nStart, priceBefore, refPrice, phase }) {
  const max = Math.max(20, ...priceHistory.map((h) => h.price), priceBefore || 0, refPrice || 0);
  const points = priceHistory.slice(-8);
  const w = 560;
  const h = 160;
  const stepX = points.length > 1 ? w / (points.length - 1) : w;

  const path = points
    .map((p, i) => {
      const x = points.length > 1 ? i * stepX : w / 2;
      const y = h - (p.price / max) * (h - 20) - 10;
      return `${i === 0 ? "M" : "L"}${x},${y}`;
    })
    .join(" ");

  const diff = priceBefore - refPrice;
  const diffPct = refPrice > 0 ? ((priceBefore / refPrice - 1) * 100) : 0;

  return (
    <div className="ft-panel ft-panel-chart">
      <div className="ft-panel-head">
        <Activity size={15} /> MARKET FEED
      </div>
      <div className="ft-chart-body">
      <div className="ft-refprice-box">
        <div className="ft-refprice-label">📌 前回終値（値動きの目安。実際の売買は最終株価で株価します）</div>
        <div className="ft-refprice-row">
          <span className="ft-refprice-value">{yenNum(refPrice)}円</span>
          <span className="ft-refprice-arrow">→</span>
          <span className="ft-refprice-value current">{yenNum(priceBefore)}円</span>
          <span className={"ft-refprice-diff" + (diff > 0 ? " up" : diff < 0 ? " down" : "")}>
            {diff === 0 ? "±0" : diff > 0 ? `+${diff}円` : `${diff}円`}
            {refPrice > 0 && ` (${diffPct >= 0 ? "+" : ""}${diffPct.toFixed(1)}%)`}
          </span>
        </div>
      </div>
      <div className="ft-market-open">
        <div>
          <div className="ft-mo-label">ベース数 N</div>
          <div className="ft-mo-value">{nStart.toLocaleString()}</div>
        </div>
        <div className="ft-mo-arrow">=</div>
        <div>
          <div className="ft-mo-label">仮株価 (ハック前)</div>
          <div className="ft-mo-value price">{yenNum(priceBefore)}円</div>
        </div>
      </div>
      <svg viewBox={`0 0 ${w} ${h}`} className="ft-chart-svg">
        <line x1="0" y1={h - 10} x2={w} y2={h - 10} stroke="var(--ft-grid)" strokeWidth="1" />
        {points.length > 0 && (
          <path d={path} fill="none" stroke="var(--ft-accent)" strokeWidth="2.5" />
        )}
        {points.map((p, i) => {
          const x = points.length > 1 ? i * stepX : w / 2;
          const y = h - (p.price / max) * (h - 20) - 10;
          return <circle key={i} cx={x} cy={y} r="3.5" fill="var(--ft-accent)" />;
        })}
      </svg>
      {priceHistory.length === 0 && (
        <div className="ft-chart-empty">まだ取引履歴がありません — 最初のTERNを開始してください</div>
      )}
      </div>
    </div>
  );
}

function PlayersPanel({ players, orders, phase, currentPrice, revealData, equippedTitleIds, myPlayerId }) {
  const rankMap = useMemo(() => {
    const sorted = [...players].sort(
      (a, b) => totalValue(b, currentPrice) - totalValue(a, currentPrice)
    );
    const map = {};
    let rank = 1;
    for (let i = 0; i < sorted.length; i++) {
      if (i > 0) {
        const prev = totalValue(sorted[i - 1], currentPrice);
        const cur = totalValue(sorted[i], currentPrice);
        if (cur < prev) rank = i + 1;
      }
      map[sorted[i].id] = rank;
    }
    return map;
  }, [players, currentPrice]);
  const isReveal = phase === "reveal" && revealData && revealData.execResults;
  const humanHeavyCount = isReveal && revealData.execResults["human"] ? (revealData.execResults["human"].usedHeavy || 0) : 0;
  const humanUsedHeavy = humanHeavyCount > 0;
  const notes = [];
  if (isReveal) {
    // 表示順: 奥義(紫) → 妨害(赤) → 防衛(黄) → 操作(青) → 帳消し
    // --- 0. 奥義 ---
    players.forEach((p) => {
      const ex = revealData.execResults[p.id];
      if (!ex || !ex.avant) return;
      const who = p.name;
      notes.push({
        cls: "note-avant",
        icon: "avant",
        text: who + "が奥義：AVANT-GARDE-操作を使用 — 自分の株価 " + yenNum(ex.avantPrice || 0) + "円",
      });
    });
    players.forEach((p) => {
      const ex = revealData.execResults[p.id];
      if (!ex || !ex.avantSab) return;
      const who = p.name;
      notes.push({
        cls: "note-avant",
        icon: "avant",
        text: who + "が奥義：AVANT-GARDE-妨害を使用 — 他者の株価 " + yenNum(ex.avantPrice || 0) + "円",
      });
    });
    // --- 1. 妨害 ---
    players.forEach((p) => {
      const ex = revealData.execResults[p.id];
      if (!ex) return;
      const uh = ex.usedHeavy || 0;
      if (uh <= 0) return;
      const who = p.name;
      notes.push({
        cls: "note-heavy",
        icon: "heavy",
        text: who + "が妨害を " + uh + " 枚使用しました" + (!p.isAI ? "（相手の株価を妨害）" : ""),
      });
    });
    // --- 2. 防衛 ---
    players.forEach((p) => {
      const ex = revealData.execResults[p.id];
      if (!ex || !ex.defense) return;
      const who = p.name;
      const blocked = ex.blockedHeavy || 0;
      const sabBlock = !!ex.sabBlockedByDef;
      notes.push({
        cls: "note-defense",
        icon: "defense",
        text: who + "が防衛を使用（COIN5枚）"
          + (blocked > 0 ? " → 被妨害×" + blocked + " を無効化" : "")
          + (sabBlock ? " → AVANT-GARDE-妨害を無効化" : ""),
      });
    });
    // --- 2b. 反射 ---
    players.forEach((p) => {
      const ex = revealData.execResults[p.id];
      if (!ex || !ex.reflect) return;
      const who = p.name;
      const out = ex.reflectedOut || 0;
      notes.push({
        cls: "note-reflect",
        icon: "reflect",
        text: who + "が反射を使用（COIN5枚）" + (out > 0 ? " → 被妨害×" + out + " を相手に反射" : ""),
      });
    });
    // --- 2c. 反射で返ってきた被妨害 ---
    players.forEach((p) => {
      const ex = revealData.execResults[p.id];
      if (!ex) return;
      const bounced = ex.reflectedTo || 0;
      if (bounced <= 0) return;
      const total = ex.incomingHeavy || 0;
      const direct = Math.max(0, total - bounced);
      const who = p.name;
      let detail = "";
      if (direct > 0) detail = "（被妨害合計×" + total + "＝全体×" + direct + " + 反射×" + bounced + "）";
      else detail = "（被妨害合計×" + total + "＝反射×" + bounced + "）";
      notes.push({
        cls: "note-heavy",
        icon: "heavy",
        text: who + "が反射された妨害×" + bounced + " を受けた" + detail,
      });
    });
    // --- 3. 操作 ---
    players.forEach((p) => {
      const ex = revealData.execResults[p.id];
      if (!ex) return;
      const oq = ex.ownQuick || 0;
      if (oq <= 0) return;
      const who = p.name;
      if (!p.isAI) {
        const nullified = !!ex.quickNullified;
        notes.push({
          cls: nullified ? "note-heavy" : "note-quick",
          icon: "quick",
          text: who + "が操作を " + oq + " 枚使用" + (nullified ? " → 被妨害により無効化" : "しました"),
        });
        return;
      }
      const action = ex.action || "stay";
      const filled = ex.sharesFilled || 0;
      const priceWith = ex.execPrice;
      const priceWithout = personalExecPrice(revealData.nStart, 0, ex.incomingHeavy || 0, action);
      let assetDelta = 0;
      if (action === "buy" && filled > 0) assetDelta = (priceWithout - priceWith) * filled;
      if (action === "sell" && filled > 0) assetDelta = (priceWith - priceWithout) * filled;
      let deltaText = "";
      if (action === "stay" || filled <= 0) {
        deltaText = "（注文なし／未成立のため総資産への直接影響なし）";
      } else if (assetDelta > 0) {
        deltaText = "（操作により総資産 +" + yen(assetDelta) + "）";
      } else if (assetDelta < 0) {
        deltaText = "（操作により総資産 " + yen(assetDelta) + "）";
      } else {
        deltaText = "（操作による総資産の増減なし）";
      }
      const nullified = !!ex.quickNullified;
      notes.push({
        cls: nullified ? "note-heavy" : "note-quick",
        icon: "quick",
        text: who + "が操作を " + oq + " 枚使用" + (nullified ? " → 被妨害により無効化" : deltaText),
      });
    });
    // --- 4. 帳消し ---
    players.forEach((p) => {
      const ex = revealData.execResults[p.id];
      if (!ex || !ex.bailout) return;
      const n = ex.bailoutCards || 10;
      const who = p.name;
      notes.push({ cls: "note-bailout", text: who + "がCOIN" + n + "枚を消費し、買い注文を帳消ししました" });
    });
    // --- 5. COIN補充 ---
    players.forEach((p) => {
      const ex = revealData.execResults[p.id];
      if (!ex || !ex.coinRescue) return;
      const who = p.name;
      const lab = coinRescueLabel(ex.coinRescue) || ex.coinRescue;
      notes.push({ cls: "note-bailout", text: who + "がCOIN補充（" + lab + "）" });
    });
  }
  return (
    <div className="ft-panel ft-panel-players">
      <div className="ft-panel-head"><User size={15} /> TRADERS</div>
      <div className="ft-players-body">
      <div className="ft-players-grid">
        {players.map((p) => {
          let glow = "";
          if (isReveal) {
            const ex = revealData.execResults[p.id] || {};
            const oq = ex.ownQuick || 0;
            const uh = ex.usedHeavy || 0;
            const df = !!ex.defense;
            const rf = !!ex.reflect;
            const av = !!ex.avant || !!ex.avantSab;
            // 優先: 奥義(紫) > 操作無効化/被妨害(赤) > 操作有効(青) > 防衛(黄) > 反射(白)
            const hit = ex.incomingHeavy || 0;
            const forcedSab = !!ex.forcedBySab;
            const nullified = !!ex.quickNullified || (oq > 0 && hit > 0);
            if (av) glow = " glow-purple";
            else if (nullified || ((hit > 0 || forcedSab) && oq <= 0)) glow = " glow-red";
            else if (oq > 0) glow = " glow-blue";
            else if (df) glow = " glow-amber";
            else if (rf) glow = " glow-white";
            else if (hit > 0 || forcedSab) glow = " glow-red";
          }
          return (
          <div key={p.id} className={"ft-player-card" + (p.isAI ? " ai" : " human") + glow + (p.isBankrupt ? " bankrupt" : "")}>
            <span className="ft-pc-rank">{rankMap[p.id]}位</span>
            <div className="ft-pc-name">
              {p.isAI ? <Cpu size={13} /> : <User size={13} />} {p.name}
              {!p.isAI && (Array.isArray(equippedTitleIds) ? equippedTitleIds : []).length ? (
                <span className="ft-tb-title-row ft-pc-titles" style={{ marginLeft: 4 }} title={(Array.isArray(equippedTitleIds) ? equippedTitleIds : []).map((id) => (TITLE_BY_ID[id] || {}).name).filter(Boolean).join(" / ")}>
                  {(Array.isArray(equippedTitleIds) ? equippedTitleIds : []).filter((id) => TITLE_BY_ID[id]).map((id) => (
                    <TitleBadge key={id} titleId={id} size={13} />
                  ))}
                </span>
              ) : null}
            </div>
            <div className="ft-pc-cash">{p.isBankrupt ? "破産" : yen(totalValue(p, currentPrice))}</div>
            <div className="ft-pc-holdings">現金{yen(p.cash)} ／ {sharesFmt(p.holdings)}株{p.holdings > 0 ? `(@${p.avgPrice.toFixed(1)})` : ""}</div>
            <div className="ft-pc-cards"><Coin size={12} className="icon-coin" /> {p.cards.stock != null ? p.cards.stock : 0}</div>
            {phase !== "market" && phase !== "order" && orders[p.id] && (
              <div className={"ft-pc-order tag-" + orders[p.id].action}>
                {orders[p.id].action === "buy" ? `買い ${sharesFmt(orders[p.id].shares)}株` : orders[p.id].action === "sell" ? `売り ${sharesFmt(orders[p.id].shares)}株` : "様子見"}
              </div>
            )}
          </div>
          );
        })}
      </div>
      {notes.length > 0 && (
        <div className="ft-traders-notes">
          {notes.map((n, i) => (
            <div key={i} className={n.cls} style={{ display: "flex", alignItems: "center", gap: 6 }}>
              {n.icon === "quick" && <Zap size={13} className="icon-quick" style={{ flexShrink: 0 }} />}
              {n.icon === "heavy" && <Bomb size={13} className="icon-heavy" style={{ flexShrink: 0 }} />}
              {n.icon === "defense" && <Shield size={13} className="icon-defense" style={{ flexShrink: 0 }} />}
              {n.icon === "reflect" && <Reflect size={13} className="icon-reflect" style={{ flexShrink: 0 }} />}
              {n.icon === "avant" && <Heptagram size={13} className="icon-avant" style={{ flexShrink: 0 }} />}
              <span>{n.text}</span>
            </div>
          ))}
        </div>
      )}
      </div>
    </div>
  );
}

function ActionPanel(props) {
  const [opPreviewExpand, setOpPreviewExpand] = React.useState(false);
  const {
    phase,
    human,
    allHumans,
    priceBefore,
    refPrice,
    nStart,
    humanOrderDraft,
    setHumanOrderDraft,
    humanHackDraft,
    setHumanHackDraft,
    turn,
    totalTurns,
    onGoOrder,
    onConfirmOrders,
    onConfirmHacks,
    onNextTurn,
    revealData,
    revealFocusId,
    setRevealFocusId,
    orders,
    hackChoices,
    players,
    endgameBonusMsg,
    inputHumanIdx,
    humanInputTotal,
    playMode,
    onlineRole,
    iSubmittedOrder,
    iSubmittedHack,
    submittedOrderIds,
    submittedHackIds,
    roomCode,
  } = props;
  const multiHuman = playMode !== "online" && (allHumans || []).length > 1;
  const isLastHumanInput = multiHuman && humanInputTotal > 0 && inputHumanIdx >= humanInputTotal - 1;
  const isOnline = playMode === "online";
  const onlineWaitingOrder = isOnline && iSubmittedOrder && phase === "order";
  const onlineWaitingHack = isOnline && iSubmittedHack && phase === "hack";
  const aliveHumanIds = (players || []).filter((p) => !p.isAI && !p.isBankrupt).map((p) => p.id);
  const orderWaitCount = (submittedOrderIds || []).filter((id) => aliveHumanIds.indexOf(id) >= 0).length;
  const hackWaitCount = (submittedHackIds || []).filter((id) => aliveHumanIds.indexOf(id) >= 0).length;

  if (phase === "market") {
    return (
      <div className="ft-panel ft-action">
        <div className="ft-panel-head">STEP 1 — 市場開示</div>
        <p className="ft-action-desc">
          今TERNのベース数字 <b>{nStart.toLocaleString()}</b> が公開されました。
          仮株価は <b className="ft-highlight">{yenNum(priceBefore)}円</b>（{factorString(nStart)}）。
          基準株価 <b className="ft-highlight">{yenNum(refPrice)}円</b> と比べて
          {priceBefore > refPrice ? "上振れ" : priceBefore < refPrice ? "下振れ" : "同水準"}
          しています。高騰（素数）を狙うか、暴落（2の累乗）に備えるか——判断のときです。
        </p>
        {isOnline && onlineRole === "guest" ? (
          <p className="ft-action-desc" style={{ color: "var(--ft-amber)" }}>ホストが注文フェーズを開始するまでお待ちください…</p>
        ) : (
          <button className="ft-primary-btn" onClick={onGoOrder}>
            注文フェーズへ ▶
          </button>
        )}
        {isOnline && roomCode ? (
          <div style={{ marginTop: 10, fontSize: 11, opacity: 0.6 }}>ONLINE ROOM {roomCode}</div>
        ) : null}
      </div>
    );
  }

  if (phase === "order") {
    const maxBuyShares = priceBefore > 0 ? Math.floor(human.cash / priceBefore) : 0;
    const maxSellShares = human.holdings;
    const endgameLock = isLastFiveTurns(turn, totalTurns);
    // 終盤は様子見を許さない（ドラフトが stay のまま残っていても表示・操作を補正）
    let action = humanOrderDraft.action;
    let shares = humanOrderDraft.shares || 0;
    if (endgameLock && action === "stay") {
      if (maxSellShares > 0) {
        action = "sell";
        shares = minOrderShares("sell", human.holdings, maxBuyShares);
      } else if (maxBuyShares > 0) {
        action = "buy";
        shares = minOrderShares("buy", human.holdings, maxBuyShares);
      }
    }
    if (endgameLock && (action === "buy" || action === "sell")) {
      const cap = action === "buy" ? maxBuyShares : maxSellShares;
      const minS = minOrderShares(action, human.holdings, maxBuyShares);
      if (cap > 0) {
        if (shares < minS) shares = minS;
        if (shares > cap) shares = cap;
      }
    }
    const estCost = shares * priceBefore;
    const unrealizedPnl = human.holdings > 0 ? (priceBefore - human.avgPrice) * human.holdings : 0;
    const minSharesNow = (action === "buy" || action === "sell")
      ? (endgameLock ? minOrderShares(action, human.holdings, maxBuyShares) : 1)
      : 0;

    function setAction(a) {
      if (endgameLock && a === "stay") return;
      const cap = a === "buy" ? maxBuyShares : a === "sell" ? maxSellShares : 0;
      if (a === "stay") {
        setHumanOrderDraft({ action: "stay", shares: 0 });
        return;
      }
      if (cap <= 0) return; // 売り余力・買い余力なし
      const minS = endgameLock ? minOrderShares(a, human.holdings, maxBuyShares) : 1;
      const cur = humanOrderDraft.shares || 0;
      const next = Math.min(cap, Math.max(minS, cur >= minS ? cur : minS));
      setHumanOrderDraft({ action: a, shares: next });
    }
    function setShares(n) {
      const a = action === "stay" ? (maxSellShares > 0 ? "sell" : "buy") : action;
      const cap = a === "buy" ? maxBuyShares : maxSellShares;
      if (cap <= 0) return;
      const minS = endgameLock ? minOrderShares(a, human.holdings, maxBuyShares) : 0;
      const v = Math.max(minS, Math.min(cap, Math.floor(n) || 0));
      setHumanOrderDraft({ action: a, shares: v });
    }

    return (
      <div className="ft-panel ft-action">
        <div className="ft-panel-head">STEP 2 — 投資注文</div>
        <p className="ft-action-desc">
          現仮株価 <b className="ft-highlight">{yenNum(priceBefore)}円</b> を目安に、何株「買う」か「売る」かを決めます。
          実際の株価は、この後の市場HACKで確定する<b>最終株価</b>で行われます。
          {endgameLock && (
            <span style={{ display: "block", marginTop: 8, color: "var(--ft-amber)" }}>
              終盤ルール（ラスト5TERN）: 様子見禁止 / 売りは保有の50%以上・買いは買付余力の50%以上から自由に選択
            </span>
          )}
          {endgameBonusMsg && (
            <span style={{ display: "block", marginTop: 8, color: "var(--ft-green)", fontWeight: 600 }}>
              🎁 {endgameBonusMsg}
            </span>
          )}
        </p>
        <div className="ft-private-box" style={{ marginBottom: 12 }}>
          <div className="ft-private-head">操作した場合の株価</div>
          <div className="ft-private-desc" style={{ lineHeight: 1.7, fontSize: 12 }}>
            <div style={{ opacity: 0.75, marginBottom: 4 }}>仮株価（操作0枚）: <b>{yenNum(priceBefore)}円</b></div>
            {Array.from({ length: opPreviewExpand ? 15 : 5 }, (_, i) => i + 1).map((q) => {
              const px = previewSelfPrice(nStart, q);
              return (
                <div key={q}>
                  操作{q}枚→株価 <b style={{ color: "var(--ft-blue)" }}>{yenNum(px)}円</b>
                  {px !== priceBefore ? (
                    <span style={{ opacity: 0.7, marginLeft: 6 }}>
                      ({px > priceBefore ? "+" : ""}{yenNum(px - priceBefore)}円)
                    </span>
                  ) : null}
                </div>
              );
            })}
            {!opPreviewExpand ? (
              <button
                type="button"
                onClick={() => setOpPreviewExpand(true)}
                style={{
                  marginTop: 6,
                  padding: "2px 8px",
                  fontSize: 11,
                  background: "transparent",
                  border: "none",
                  color: "rgba(255,255,255,0.45)",
                  cursor: "pointer",
                  letterSpacing: "0.04em",
                }}
              >rest ▾</button>
            ) : (
              <button
                type="button"
                onClick={() => setOpPreviewExpand(false)}
                style={{
                  marginTop: 6,
                  padding: "2px 8px",
                  fontSize: 11,
                  background: "transparent",
                  border: "none",
                  color: "rgba(255,255,255,0.45)",
                  cursor: "pointer",
                  letterSpacing: "0.04em",
                }}
              >close ▴</button>
            )}
          </div>
        </div>
        <div className="ft-holdings-box">
          <div>現金: <b>{yen(human.cash)}</b></div>
          <div>保有株: <b>{sharesFmt(human.holdings)}株</b>{human.holdings > 0 && <> (平均取得単価 {human.avgPrice.toFixed(1)}円)</>}</div>
          {human.holdings > 0 && (
            <div>
              評価損益(仮株価基準): {" "}
              <b className={unrealizedPnl > 0 ? "pnl-up" : unrealizedPnl < 0 ? "pnl-down" : ""}>
                {unrealizedPnl === 0 ? "±0" : unrealizedPnl > 0 ? `+${yen(unrealizedPnl)}` : `-${yen(Math.abs(unrealizedPnl))}`}
              </b>
            </div>
          )}
        </div>
        <div className="ft-order-btns">
          <button
            className={"ft-order-btn long" + (action === "buy" ? " active" : "")}
            onClick={() => setAction("buy")}
            disabled={maxBuyShares <= 0}
          >
            <TrendingUp size={16} /> 買い
          </button>
          <button
            className={"ft-order-btn short" + (action === "sell" ? " active" : "")}
            onClick={() => setAction("sell")}
            disabled={maxSellShares <= 0}
            title={maxSellShares <= 0 ? "保有株がありません" : ""}
          >
            <TrendingDown size={16} /> 売り
          </button>
          <button
            className={"ft-order-btn stay" + (!endgameLock && action === "stay" ? " active" : "")}
            onClick={() => setAction("stay")}
            disabled={endgameLock}
            title={endgameLock ? "ラスト5TERNは様子見禁止" : ""}
          >
            <Minus size={16} /> 様子見{endgameLock ? "（終盤禁止）" : ""}
          </button>
        </div>
        {action !== "stay" && (
          <div className="ft-pct-block">
            <div className="ft-label">
              {action === "buy" ? "購入株数" : "売却株数"}: {sharesFmt(shares)}株
              <span className="ft-factor-note">
                {" "}( {endgameLock ? `最低 ${sharesFmt(minSharesNow)}〜` : ""}最大 {sharesFmt(action === "buy" ? maxBuyShares : maxSellShares)}株)
              </span>
            </div>
            <input
              type="range"
              min={minSharesNow}
              max={action === "buy" ? maxBuyShares : maxSellShares}
              step="1"
              value={shares}
              onChange={(e) => setShares(parseInt(e.target.value, 10))}
            />
            <input
              type="number"
              className="ft-shares-input"
              min={minSharesNow}
              max={action === "buy" ? maxBuyShares : maxSellShares}
              value={shares}
              onChange={(e) => setShares(parseInt(e.target.value, 10))}
            />
            {action === "buy" && <div className="ft-pct-amount">概算コスト: {yen(estCost)}</div>}
            {action === "sell" && <div className="ft-pct-amount">概算受取: {yen(estCost)}</div>}
          </div>
        )}
        {multiHuman ? (
          <div style={{ fontSize: 12, marginBottom: 10, color: "var(--ft-amber)" }}>
            {human.name} の注文（{inputHumanIdx + 1}/{humanInputTotal}）
          </div>
        ) : null}
        {isOnline ? (
          <div style={{ fontSize: 12, marginBottom: 10, color: "var(--ft-amber)" }}>
            提出状況 {orderWaitCount}/{aliveHumanIds.length}
            {onlineWaitingOrder ? " — 他のプレイヤーを待っています…" : ""}
          </div>
        ) : null}
        {onlineWaitingOrder ? (
          <div className="ft-primary-btn" style={{ opacity: 0.5, pointerEvents: "none", textAlign: "center" }}>
            提出済み（待機中）
          </div>
        ) : (
          <button className="ft-primary-btn" onClick={onConfirmOrders}>
            {multiHuman && !isLastHumanInput
              ? human.name + " の注文を確定 → 次のプレイヤーへ ▶"
              : isOnline
              ? "注文を提出 ▶"
              : "注文を確定 ▶"}
          </button>
        )}
      </div>
    );
  }

  if (phase === "hack") {
    return (
      <div className="ft-panel ft-action">
        <div className="ft-panel-head">STEP 3 — 市場HACK（裏向き）</div>
        <p className="ft-action-desc">生涯COINを投入しますか？ 使えばもう戻りません。</p>
        <div className="ft-hack-controls">
          <div className="ft-hack-row" style={{ marginBottom: 8, opacity: 0.85, fontSize: 12 }}>
            COIN 残り <b>{human.cards.stock != null ? human.cards.stock : 0}</b> 枚
            （使用: {(humanHackDraft.quick || 0) + ((humanHackDraft.heavy || 0) > 0 ? 5 : 0) + (humanHackDraft.defense ? 5 : 0) + (humanHackDraft.reflect ? 5 : 0) + ((humanHackDraft.avant || humanHackDraft.avantSab) ? 10 : 0)} 枚）
          </div>
          {!isLastFiveTurns(turn, totalTurns) && (human.cards.stock != null ? human.cards.stock : 0) <= 5 ? (
            <div className="ft-hack-row" style={{ marginBottom: 10, flexDirection: "column", alignItems: "stretch", gap: 8, border: "1px solid rgba(57,255,156,0.35)", borderRadius: 4, padding: 10 }}>
              <div style={{ fontSize: 12, color: "var(--ft-accent)", fontWeight: 600 }}>COIN補充（ラスト5TERNは不可）</div>
              <div style={{ fontSize: 11, opacity: 0.8 }}>
                総資産目安 <b>{Math.floor(totalValue(human, priceBefore)).toLocaleString()}円</b>
                （仮株価 {yenNum(priceBefore)}円）
              </div>
              {(human.cards.stock != null ? human.cards.stock : 0) <= 5 ? (
                <button
                  type="button"
                  onClick={() => setHumanHackDraft((d) => ({ ...d, coinRescue: d.coinRescue === "half5" ? "" : "half5" }))}
                  style={{
                    display: "flex",
                    alignItems: "center",
                    gap: 10,
                    textAlign: "left",
                    padding: "8px 10px",
                    borderRadius: 4,
                    cursor: "pointer",
                    border: humanHackDraft.coinRescue === "half5" ? "1px solid rgba(51,209,255,0.85)" : "1px solid rgba(255,255,255,0.25)",
                    background: humanHackDraft.coinRescue === "half5" ? "rgba(51,209,255,0.18)" : "rgba(255,255,255,0.04)",
                    color: humanHackDraft.coinRescue === "half5" ? "#9ae6ff" : "var(--ft-text)",
                    boxShadow: humanHackDraft.coinRescue === "half5" ? "0 0 10px rgba(51,209,255,0.35)" : "none",
                  }}
                >
                  <span style={{
                    width: 14, height: 14, borderRadius: "50%", flexShrink: 0,
                    border: humanHackDraft.coinRescue === "half5" ? "2px solid #33d1ff" : "2px solid rgba(255,255,255,0.55)",
                    background: humanHackDraft.coinRescue === "half5" ? "#33d1ff" : "transparent",
                    boxShadow: humanHackDraft.coinRescue === "half5" ? "0 0 8px rgba(51,209,255,0.8)" : "none",
                  }} />
                  <span style={{ fontSize: 12, lineHeight: 1.55 }}>

                    background: humanHackDraft.coinRescue === "zero10" ? "rgba(51,209,255,0.18)" : "rgba(255,255,255,0.04)",
                    color: humanHackDraft.coinRescue === "zero10" ? "#9ae6ff" : "var(--ft-text)",
                    boxShadow: humanHackDraft.coinRescue === "zero10" ? "0 0 10px rgba(51,209,255,0.35)" : "none",

                >
                  <span style={{
                    width: 14, height: 14, borderRadius: "50%", flexShrink: 0,
                    border: humanHackDraft.coinRescue === "zero10" ? "2px solid #33d1ff" : "2px solid rgba(255,255,255,0.55)",
                    background: humanHackDraft.coinRescue === "zero10" ? "#33d1ff" : "transparent",
                    boxShadow: humanHackDraft.coinRescue === "zero10" ? "0 0 8px rgba(51,209,255,0.8)" : "none",
                  }} />
                  <span style={{ fontSize: 12, lineHeight: 1.55 }}>
                    総資産75%→COIN10枚
                    <br />
                    <span style={{ opacity: 0.75 }}>（残資産 {Math.floor(totalValue(human, priceBefore) * 0.25).toLocaleString()}円）</span>
                  </span>
                </button>
              ) : null}
            </div>
          ) : null}
          <div className="ft-hack-row">
            <div className="ft-hack-label">
              <Zap size={16} className="icon-quick" /> 操作
              <span style={{fontSize:"11px", opacity:0.7, marginLeft:8}}>自分の株価だけを操作（被妨害時は無効）</span>
            </div>
            <div className="ft-hack-stepper">
              <button
                disabled={humanHackDraft.quick <= 0}
                onClick={() => setHumanHackDraft((d) => ({ ...d, quick: Math.max(0, d.quick - 1) }))}
              >−</button>
              <span>{humanHackDraft.quick}</span>
              <button
                disabled={(humanHackDraft.quick || 0) + ((humanHackDraft.heavy || 0) > 0 ? 5 : 0) + (humanHackDraft.defense ? 5 : 0) >= (human.cards.stock || 0)}
                onClick={() =>
                  setHumanHackDraft((d) => {
                    if (d.avant || d.avantSab) return d;
                    const stock = human.cards.stock || 0;
                    const next = (d.quick || 0) + 1;
                    if (next + ((d.heavy || 0) > 0 ? 5 : 0) + (d.defense ? 5 : 0) + ((d.avant || d.avantSab) ? 10 : 0) > stock) return d;
                    return { ...d, quick: next };
                  })
                }
              >+</button>
            </div>
          </div>
          <div className="ft-hack-row">
            <div className="ft-hack-label">

            <div className="ft-hack-stepper">
              <button

                className={"ft-defense-toggle" + (humanHackDraft.heavy ? " is-heavy-on" : "")}
                disabled={turn <= 3 || (!humanHackDraft.heavy && (humanHackDraft.quick || 0) + 5 + (humanHackDraft.defense ? 5 : 0) > (human.cards.stock || 0))}
                onClick={() =>
                  setHumanHackDraft((d) => {
                    if (turn <= 3) return d;
                    if (d.avant || d.avantSab) return d;
                    if (d.heavy) return { ...d, heavy: 0 };
                    const stock = human.cards.stock || 0;
                    if ((d.quick || 0) + 5 + (d.defense ? 5 : 0) + ((d.avant || d.avantSab) ? 10 : 0) > stock) return d;
                    return { ...d, heavy: 1 };
                  })
                }
              >{turn <= 3 ? "不可" : (humanHackDraft.heavy ? "ON" : "OFF")}</button>
            </div>
          </div>
          <div className="ft-hack-row">
            <div className="ft-hack-label">
              <Shield size={16} className="icon-defense" /> 防衛
              <span style={{fontSize:"11px", opacity:0.7, marginLeft:8}}>
                {turn <= 3

            <div className="ft-hack-stepper">
              <button

                className={"ft-defense-toggle" + (humanHackDraft.defense ? " is-on" : "")}
                disabled={turn <= 3 || isProtectOnCooldown(human, turn) || (!humanHackDraft.defense && (humanHackDraft.quick || 0) + ((humanHackDraft.heavy || 0) > 0 ? 5 : 0) + 5 > (human.cards.stock || 0))}
                onClick={() =>
                  setHumanHackDraft((d) => {
                    if (turn <= 3 || isProtectOnCooldown(human, turn)) return d;
                    if (d.avant || d.avantSab) return d;
                    if (d.defense) return { ...d, defense: 0 };
                    const stock = human.cards.stock || 0;
                    if ((d.quick || 0) + ((d.heavy || 0) > 0 ? 5 : 0) + 5 + ((d.avant || d.avantSab) ? 10 : 0) > stock) return d;
                    return { ...d, defense: 1, reflect: 0 };
                  })
                }
              >{turn <= 3 || isProtectOnCooldown(human, turn) ? "不可" : (humanHackDraft.defense ? "ON" : "OFF")}</button>
            </div>
          </div>
          <div className="ft-hack-row">
            <div className="ft-hack-label">
              <Reflect size={16} className="icon-reflect" /> 反射
              <span style={{fontSize:"11px", opacity:0.7, marginLeft:8}}>
                {turn <= 3
                  ? "最初の3TERNは使用不可"

                onClick={() =>
                  setHumanHackDraft((d) => {
                    if (turn <= 3 || isProtectOnCooldown(human, turn)) return d;
                    if (d.avant || d.avantSab) return d;
                    if (d.reflect) return { ...d, reflect: 0 };
                    const stock = human.cards.stock || 0;
                    if ((d.quick || 0) + ((d.heavy || 0) > 0 ? 5 : 0) + (d.defense ? 5 : 0) + 5 + ((d.avant || d.avantSab) ? 10 : 0) > stock) return d;
                    // 反射ON時は防衛をオフ（同時不可・防衛優先のためUI側でも排他）
                    return { ...d, reflect: 1, defense: 0 };
                  })
                }
              >{turn <= 3 || isProtectOnCooldown(human, turn) ? "不可" : (humanHackDraft.reflect ? "ON" : "OFF")}</button>
            </div>
          </div>
          <div className={"ft-hack-row is-avant" + (humanHackDraft.avant ? " is-on" : "")}>
            <div className="ft-hack-label">
              <Heptagram size={16} className="icon-avant" style={{marginRight:4}} />
              <span style={{color:"var(--ft-purple)", fontWeight:600}}>奥義：AVANT-GARDE-操作</span>
              {!humanHackDraft.avant ? (
                <span style={{fontSize:"11px", opacity:0.7, marginLeft:8}}>自分の株価指定</span>
              ) : null}
            </div>
            <div className="ft-hack-stepper" style={{display:"flex", alignItems:"center", gap:8}}>
              {!!humanHackDraft.avant && (
                <input
                  type="number"
                  className="ft-avant-price-input"
                  min={1}
                  max={99999}
                  value={humanHackDraft.avantPrice || 1000}
                  onChange={(e) => {
                    let v = parseInt(e.target.value, 10);
                    if (isNaN(v)) v = 1;
                    v = Math.max(1, Math.min(99999, v));
                    setHumanHackDraft((d) => ({ ...d, avantPrice: v }));
                  }}
                />
              )}
              <button
                type="button"
                className={"ft-defense-toggle" + (humanHackDraft.avant ? " is-avant-on" : "")}
                disabled={!!human.avantUsed || (!humanHackDraft.avant && (human.cards.stock || 0) < 10)}
                onClick={() =>
                  setHumanHackDraft((d) => {
                    if (human.avantUsed) return d;
                    if (d.avant) return { ...d, avant: 0 };
                    if ((human.cards.stock || 0) < 10) return d;
                    // 奥義（操作）ON: 奥義（妨害）・操作・妨害・防衛をクリア
                    return { ...d, avant: 1, avantSab: 0, quick: 0, heavy: 0, defense: 0, reflect: 0, avantPrice: d.avantPrice || 1000 };
                  })
                }
              >{human.avantUsed ? "済" : (humanHackDraft.avant ? "ON" : "OFF")}</button>
            </div>
          </div>
          <div className={"ft-hack-row is-avant" + (humanHackDraft.avantSab ? " is-on" : "")}>
            <div className="ft-hack-label">
              <Heptagram size={16} className="icon-avant" style={{marginRight:4}} />
              <span style={{color:"var(--ft-purple)", fontWeight:600}}>奥義：AVANT-GARDE-妨害</span>
              {!humanHackDraft.avantSab ? (
                <span style={{fontSize:"11px", opacity:0.7, marginLeft:8}}>
                  {turn <= 3 ? "最初の3TERNは使用不可" : "自分以外の株価指定"}
                </span>
              ) : null}
            </div>
            <div className="ft-hack-stepper" style={{display:"flex", alignItems:"center", gap:8}}>
              {!!humanHackDraft.avantSab && turn > 3 && (
                <input
                  type="number"
                  className="ft-avant-price-input"
                  min={1}
                  max={99999}
                  value={humanHackDraft.avantPrice || 1000}
                  onChange={(e) => {
                    let v = parseInt(e.target.value, 10);
                    if (isNaN(v)) v = 1;
                    v = Math.max(1, Math.min(99999, v));
                    setHumanHackDraft((d) => ({ ...d, avantPrice: v }));
                  }}
                />
              )}
              <button
                type="button"
                className={"ft-defense-toggle" + (humanHackDraft.avantSab ? " is-avant-on" : "")}

                onClick={() =>
                  setHumanHackDraft((d) => {

                    if (human.avantUsed) return d;
                    if (d.avantSab) return { ...d, avantSab: 0 };

            </div>
          </div>
        </div>
        {((humanHackDraft.quick > 0 || humanHackDraft.heavy > 0 || !!humanHackDraft.defense || !!humanHackDraft.reflect || !!humanHackDraft.avant || !!humanHackDraft.avantSab)) ? (() => {
          const order = humanOrderDraft || { action: "stay" };
          const act = order.action === "stay" ? "buy" : order.action;
          const selfPrice = personalExecPrice(nStart, humanHackDraft.quick, 0, act);
          const baseP = personalExecPrice(nStart, 0, 0, act);
          const buy0 = personalExecPrice(nStart, 0, 0, "buy");
          const buy1 = personalExecPrice(nStart, 0, 1, "buy");
          const sell0 = personalExecPrice(nStart, 0, 0, "sell");
          const sell1 = personalExecPrice(nStart, 0, 1, "sell");
          return (
            <div className="ft-private-box">
              <div className="ft-private-head">📊 効果</div>
              <p className="ft-private-desc" style={{ lineHeight: 1.85 }}>
                {humanHackDraft.avant ? (() => {
                  const ap = Math.max(1, Math.min(99999, Math.floor(Number(humanHackDraft.avantPrice) || 1)));
                  const ord = humanOrderDraft || { action: "stay", shares: 0 };
                  const sh = Math.max(0, Math.floor(ord.shares || 0));
                  const cash0 = human.cash || 0;
                  const hold0 = human.holdings || 0;
                  const tv0 = cash0 + hold0 * (priceBefore || 0);
                  let cash1 = cash0;
                  let hold1 = hold0;
                  let tradeNote = "注文なし（様子見）";
                  if (ord.action === "buy" && sh > 0) {
                    const cost = sh * ap;
                    cash1 = cash0 - cost;
                    hold1 = hold0 + sh;
                    tradeNote = `買い ${sh}株 × ${ap}円 = ${cost.toLocaleString()}円`;
                  } else if (ord.action === "sell" && sh > 0) {
                    const got = sh * ap;
                    cash1 = cash0 + got;
                    hold1 = hold0 - sh;
                    tradeNote = `売り ${sh}株 × ${ap}円 = ${got.toLocaleString()}円`;
                  }
                  const tv1 = cash1 + hold1 * ap;
                  const dTv = tv1 - tv0;
                  const dSign = dTv > 0 ? "+" : "";
                  return (
                    <span style={{ display: "block" }}>
                      <b style={{ color: "var(--ft-purple)" }}>奥義：AVANT-GARDE-操作</b>
                      <span style={{ opacity: 0.85 }}>（COIN10枚・一度限り／自分の株価のみ／被妨害無効）</span>
                      <br />
                      指定する自分の株価 <b style={{ color: "var(--ft-purple)" }}>{ap.toLocaleString()}円</b>
                      <br />
                      {tradeNote}
                      <br />
                      保有株 <b>{sharesFmt(hold0)}株 → {sharesFmt(hold1)}株</b>
                      <br />
                      現金 <b>{cash0.toLocaleString()}円 → {cash1.toLocaleString()}円</b>
                      <br />
                      総資産（評価） <b>{tv0.toLocaleString()}円 → {tv1.toLocaleString()}円</b>
                      <span style={{ color: dTv >= 0 ? "var(--ft-accent)" : "var(--ft-red)", marginLeft: 6 }}>
                        ({dSign}{dTv.toLocaleString()}円)
                      </span>
                      <br />
                      <span style={{ opacity: 0.75, fontSize: 12 }}>※奥義が重複した場合、総資産が少ない側が優先（多い側はCOIN返却）</span>
                    </span>
                  );
                })() : null}
                {humanHackDraft.avantSab ? (() => {
                  const ap = Math.max(1, Math.min(99999, Math.floor(Number(humanHackDraft.avantPrice) || 1)));
                  return (
                    <span style={{ display: "block" }}>
                      <b style={{ color: "var(--ft-purple)" }}>奥義：AVANT-GARDE-妨害</b>
                      <span style={{ opacity: 0.85 }}>（COIN10枚・一度限り／自分以外の株価指定）</span>
                      <br />
                      自分以外の株価を <b style={{ color: "var(--ft-purple)" }}>{ap.toLocaleString()}円</b> に強制（1〜99999円）
                      <br />
                      自分の株価は通常計算（操作・通常妨害の対象）
                      <br />
                      <span style={{ opacity: 0.75, fontSize: 12 }}>※相手の防衛で無効化されます。奥義が重複した場合は総資産が少ない側が優先されます。</span>
                    </span>
                  );
                })() : null}
                {!humanHackDraft.avant && !humanHackDraft.avantSab && humanHackDraft.quick > 0 ? (
                  <span style={{ display: "block", marginBottom: 8 }}>
                    <b style={{ color: "var(--ft-blue)" }}>操作</b>：自分の株価を操作（被妨害時は無効）<br />
                    あなたの株価目安 <b>{yenNum(selfPrice)}円</b>
                    {baseP !== selfPrice ? `（操作前 ${yenNum(baseP)}円）` : ""}
                    <br />
                    自分のみ作用。
                  </span>
                ) : null}
                {!humanHackDraft.avant && !humanHackDraft.avantSab && humanHackDraft.heavy > 0 ? (
                  <span style={{ display: "block", marginBottom: 8 }}>
                    <b style={{ color: "var(--ft-red)" }}>妨害</b>：自分以外の株価を妨害（N+1）<br />
                    自分には無効、他プレイヤーと重複する可能性あり<br />
                    買い：<b>{yenNum(buy0)}円→{yenNum(personalExecPrice(nStart, 0, humanHackDraft.heavy, "buy"))}円</b>
                    <br />
                    売り：<b>{yenNum(sell0)}円→{yenNum(personalExecPrice(nStart, 0, humanHackDraft.heavy, "sell"))}円</b>
                  </span>
                ) : null}
                {!humanHackDraft.avant && !humanHackDraft.avantSab && humanHackDraft.defense ? (
                  <span style={{ display: "block" }}>
                    <b style={{ color: "var(--ft-amber)" }}>防衛</b>：相手からの妨害・反射・AVANT-GARDE-妨害を無効化<br />
                    COIN5枚
                  </span>
                ) : null}
                {!humanHackDraft.avant && !humanHackDraft.avantSab && humanHackDraft.reflect ? (
                  <span style={{ display: "block" }}>
                    <b style={{ color: "var(--ft-text)" }}>反射</b>：妨害の効果を相手に反射<br />
                    COIN5枚
                  </span>
                ) : null}
              </p>
            </div>
          );
        })() : null}
        {multiHuman ? (
          <div style={{ fontSize: 12, marginBottom: 10, color: "var(--ft-amber)" }}>
            {human.name} の市場HACK（{inputHumanIdx + 1}/{humanInputTotal}）
          </div>
        ) : null}
        {isOnline ? (
          <div style={{ fontSize: 12, marginBottom: 10, color: "var(--ft-amber)" }}>
            提出状況 {hackWaitCount}/{aliveHumanIds.length}
            {onlineWaitingHack ? " — 他のプレイヤーを待っています…" : ""}
          </div>
        ) : null}
        {onlineWaitingHack ? (
          <div className="ft-primary-btn danger" style={{ opacity: 0.5, pointerEvents: "none", textAlign: "center" }}>
            提出済み（待機中）
          </div>
        ) : (
          <button className="ft-primary-btn danger" onClick={onConfirmHacks}>
            {multiHuman && !isLastHumanInput
              ? human.name + " のCOINを確定 → 次のプレイヤーへ ▶"
              : isOnline
              ? "COINを提出 ▶"
              : "COINをセットして開示 ▶"}
          </button>
        )}
      </div>
    );
  }

  if (phase === "reveal" && revealData) {
    const per = revealData.perHuman || {};
    const focusId = revealFocusId || (human && human.id) || revealData.focusId;
    const focused = (focusId && per[focusId]) || null;
    const view = focused || {
      humanOrder: revealData.humanOrder,
      humanExec: revealData.humanExec,
      nFinal: revealData.nFinal,
      priceFinal: revealData.priceFinal,
      humanCashBefore: revealData.humanCashBefore,
      humanCashAfter: revealData.humanCashAfter,
      humanHoldingsBefore: revealData.humanHoldingsBefore,
      humanHoldingsAfter: revealData.humanHoldingsAfter,
      humanAvgPriceAfter: revealData.humanAvgPriceAfter,
      humanValueBefore: revealData.humanValueBefore,
      humanValueAfter: revealData.humanValueAfter,
      humanDiff: revealData.humanDiff,
      humanBankrupt: revealData.humanBankrupt,
      name: human ? human.name : "YOU",
    };
    const hex = view.humanExec || {};
    const myQuick = hex.ownQuick || 0;
    const hitHeavy = hex.incomingHeavy || 0;
    const myDefense = !!hex.defense;
    const blockedHeavy = hex.blockedHeavy || 0;
    const usedHeavy = hex.usedHeavy || 0;
    const myAvant = !!hex.avant;
    const myAvantSab = !!hex.avantSab;
    // 自分を先頭に、全プレイヤーの清算タブ
    const selfId = (human && human.id) || null;
    const humanNamesList = Object.values(per).slice().sort((a, b) => {
      if (selfId && a.id === selfId) return -1;
      if (selfId && b.id === selfId) return 1;
      if (!a.isAI && b.isAI) return -1;
      if (a.isAI && !b.isAI) return 1;
      return 0;
    });
    return (
      <div className="ft-panel ft-action">
        <div className="ft-panel-head">STEP 4 — 清算結果{view.name ? "（" + view.name + "）" : ""}</div>
        {humanNamesList.length > 0 ? (
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 12 }}>
            {humanNamesList.map((h) => (
              <button
                key={h.id}
                type="button"
                onClick={() => setRevealFocusId && setRevealFocusId(h.id)}
                style={{
                  padding: "6px 10px",
                  fontSize: 11,
                  borderRadius: 3,
                  cursor: "pointer",
                  border: (focusId === h.id) ? "1px solid var(--ft-accent)" : "1px solid var(--ft-border)",
                  background: (focusId === h.id) ? "rgba(57,255,156,0.12)" : "var(--ft-panel-alt)",
                  color: (focusId === h.id) ? "var(--ft-accent)" : "var(--ft-text-dim)",
                }}
              >
                {h.name}{h.isAI ? "（CPU）" : ""}{h.humanBankrupt ? "（破産）" : ""}
              </button>
            ))}
          </div>
        ) : null}

        {view.humanBankrupt && (
          <div className="ft-bankrupt-banner">
            <div className="ft-bankrupt-title">破産</div>
            <div className="ft-bankrupt-desc">
              買付代金を支払えず破産しました（COIN10枚未満で帳消し不可）。以降のプレイはできません。
              残りTERNはCPUが自動進行し、最終結果を表示します。
            </div>
          </div>
        )}
        {!view.humanBankrupt && view.humanExec && view.humanExec.bailout && (
          <div className="ft-bailout-banner">
            <div className="ft-bailout-title">帳消し</div>
            <div className="ft-bailout-desc">
              COINを{view.humanExec.bailoutCards || 10}枚消費し、このTERNの買い注文をキャンセルして破産を回避しました。
            </div>
          </div>
        )}

        <div className="ft-card-banner">
          <div className="ft-card-banner-title">このTERNの結果</div>
          <div className="ft-card-banner-body">
            {myAvant && (
              <span className="ft-card-banner-chip" style={{ color: "var(--ft-purple)", background: "rgba(192,132,252,0.15)", border: "1px solid rgba(192,132,252,0.45)" }}>
                <Heptagram size={15} style={{ marginRight: 6, verticalAlign: "middle", flexShrink: 0 }} />
                奥義：AVANT-GARDE-操作
              </span>
            )}
            {!!hex.avantSab && (
              <span className="ft-card-banner-chip" style={{ color: "var(--ft-purple)", background: "rgba(192,132,252,0.15)", border: "1px solid rgba(192,132,252,0.45)" }}>
                <Heptagram size={15} style={{ marginRight: 6, verticalAlign: "middle", flexShrink: 0 }} />
                奥義：AVANT-GARDE-妨害
              </span>
            )}
            {!!hex.forcedBySab && (
              <span className="ft-card-banner-chip heavy">
                <Heptagram size={15} style={{ marginRight: 6, verticalAlign: "middle", flexShrink: 0 }} />
                AVANT-GARDE-妨害で株価固定
              </span>
            )}
            {myQuick > 0 && (() => {
              const nullified = !!hex.quickNullified;
              // 反射で被妨害を防いだ場合は操作有効を明記
              const reflectedAway = !!hex.reflect && (hex.reflectedOut || 0) > 0 && !nullified;
              let label = `操作 ×${myQuick}`;
              if (nullified) label = `操作 ×${myQuick} → 被妨害で無効`;
              else if (reflectedAway) label = `操作 ×${myQuick}（有効・反射で被妨害を回避）`;
              return (
                <span className={"ft-card-banner-chip " + (nullified ? "heavy" : "quick")}>
                  <Zap size={15} style={{ marginRight: 6, verticalAlign: "middle", flexShrink: 0 }} />
                  {label}
                </span>
              );
            })()}
            {/* 実際に受けた妨害のみ表示（反射で防いだ分は反射チップで分かるため非表示） */}
            {hitHeavy > 0 && (() => {
              const bounced = Math.max(0, Math.min(hitHeavy, hex.reflectedTo || 0));
              const direct = Math.max(0, hitHeavy - bounced);
              let detail = "";
              if (bounced > 0 && direct > 0) {
                detail = `（全体×${direct} + 反射×${bounced}）`;
              } else if (bounced > 0) {
                detail = `（反射×${bounced}）`;
              } else if (direct > 0) {
                detail = `（全体×${direct}）`;
              }
              return (
                <span className="ft-card-banner-chip heavy">
                  <Bomb size={15} style={{ marginRight: 6, verticalAlign: "middle", flexShrink: 0 }} />
                  妨害 ×{hitHeavy}{detail}
                </span>
              );
            })()}
            {myDefense ? (
              <span className="ft-card-banner-chip defense">
                <Shield size={15} style={{ marginRight: 6, verticalAlign: "middle", flexShrink: 0 }} />
                防衛{blockedHeavy > 0 ? `（妨害×${blockedHeavy}を無効化）` : ""}{hex.sabBlockedByDef ? "（AVANT-GARDE-妨害を無効化）" : (blockedHeavy <= 0 && !hex.sabBlockedByDef ? "（妨害なし）" : "")}
              </span>
            ) : null}
            {!!hex.reflect ? (
              <span className="ft-card-banner-chip reflect">
                <Reflect size={15} style={{ marginRight: 6, verticalAlign: "middle", flexShrink: 0 }} />
                反射{(hex.reflectedOut || 0) > 0 ? `（妨害×${hex.reflectedOut}を反射）` : ""}
              </span>
            ) : null}
            {!myDefense && !hex.reflect && hitHeavy <= 0 && !myAvant && !hex.avantSab && !hex.forcedBySab ? (
              <span className="ft-card-banner-chip none-hit">
                誰にも妨害されなかった
              </span>
            ) : null}
          </div>
          <div className="ft-card-banner-note">
            仮株価 {yenNum(revealData.priceBefore)}円 → 最終株価 <b>{yenNum(view.priceFinal)}円</b>
            {view.priceFinal > revealData.priceBefore
              ? `（+${view.priceFinal - revealData.priceBefore}円）`
              : view.priceFinal < revealData.priceBefore
              ? `（${view.priceFinal - revealData.priceBefore}円）`
              : ""}
          </div>
        </div>

        <div className="ft-reveal-box">
          <div className="ft-reveal-row">
            <span>N_start</span>
            <b>{revealData.nStart.toLocaleString()}</b>
          </div>
          {myQuick > 0 && (() => {
            const nullified = !!hex.quickNullified;
            const reflectedAway = !!hex.reflect && (hex.reflectedOut || 0) > 0 && !nullified;
            let detail = "";
            if (nullified) detail = "（被妨害で無効）";
            else if (reflectedAway) detail = "（有効・反射で被妨害を回避）";
            return (
              <div className={"ft-reveal-row " + (nullified ? "heavy" : "quick")}>
                <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>
                  <Zap size={14} className="icon-quick" /> 操作
                </span>
                <b>{nullified ? `+${myQuick}${detail}` : `+${myQuick}${detail}`}</b>
              </div>
            );
          })()}
          {/* 実際に適用された被妨害のみ。反射で防いだ分は行を出さない */}
          {hitHeavy > 0 && (() => {
            const bounced = Math.max(0, Math.min(hitHeavy, hex.reflectedTo || 0));
            const direct = Math.max(0, hitHeavy - bounced);
            let detail = "";
            if (bounced > 0 && direct > 0) detail = `（全体+${direct} / 反射+${bounced}）`;
            else if (bounced > 0) detail = `（反射+${bounced}）`;
            else if (direct > 0) detail = `（全体+${direct}）`;
            return (
              <div className="ft-reveal-row heavy">
                <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>
                  <Bomb size={14} className="icon-heavy" /> 妨害
                </span>
                <b>+{hitHeavy}{detail}</b>
              </div>
            );
          })()}
          {myDefense && (
            <div className="ft-reveal-row" style={{ color: "var(--ft-amber)" }}>
              <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>
                <Shield size={14} className="icon-defense" /> 防衛
              </span>
              <b>{blockedHeavy > 0 ? `妨害×${blockedHeavy}を無効化` : "妨害なし"}</b>
            </div>
          )}
          <div className="ft-reveal-row final">
            <span>あなたの N</span>
            <b>
              {view.nFinal.toLocaleString()}
              <span className="ft-factor-note">（{factorString(view.nFinal)}）</span>
            </b>
          </div>
          <div className="ft-reveal-row price">
            <span>あなたの株価</span>
            <b>{yenNum(view.priceFinal)}円</b>
            <span className="ft-factor-note">{factorSumFormula(view.nFinal)}</span>
          </div>
        </div>

        <div className="ft-panel-head" style={{ marginTop: 4 }}>あなたの株価結果</div>
        <div className="ft-reveal-box">
          <div className="ft-reveal-row">
            <span>注文</span>
            <b>
              {view.humanOrder.action === "buy"
                ? "買い"
                : view.humanOrder.action === "sell"
                ? "売り"
                : "様子見"}
              {view.humanOrder.action !== "stay" && ` ${sharesFmt(view.humanOrder.shares)}株`}
            </b>
          </div>
          {view.humanOrder.action !== "stay" && (
            <div className="ft-reveal-row">
              <span>株価株数 @ 最終株価</span>
              <b>
                {sharesFmt(view.humanExec.sharesFilled)}株 @ {yenNum(view.priceFinal)}円
                {view.humanExec.note && <span className="ft-factor-note"> {view.humanExec.note}</span>}
              </b>
            </div>
          )}
          <div className="ft-reveal-row">
            <span>現金</span>
            <b>{yen(view.humanCashBefore)} → {yen(view.humanCashAfter)}</b>
          </div>
          <div className="ft-reveal-row">
            <span>保有株</span>
            <b>
              {sharesFmt(view.humanHoldingsBefore)}株 → {sharesFmt(view.humanHoldingsAfter)}株
              {view.humanHoldingsAfter > 0 && ` (平均${view.humanAvgPriceAfter.toFixed(1)}円)`}
            </b>
          </div>
          <div className="ft-reveal-row">
            <span>総資産</span>
            <b>{yen(view.humanValueBefore)} → {yen(view.humanValueAfter)}</b>
          </div>
          <div className="ft-reveal-row final">
            <span>総資産の変動</span>
            <b className={view.humanDiff > 0 ? "pnl-up" : view.humanDiff < 0 ? "pnl-down" : ""}>
              {view.humanDiff === 0
                ? "±0"
                : view.humanDiff > 0
                ? `+${yen(view.humanDiff)}`
                : `-${yen(Math.abs(view.humanDiff))}`}
            </b>
          </div>
        </div>

        {isOnline && onlineRole === "guest" ? (
          <p className="ft-action-desc" style={{ color: "var(--ft-amber)" }}>ホストが次のTERNへ進めるまでお待ちください…</p>
        ) : (
          <button className="ft-primary-btn" onClick={onNextTurn}>
            {view.humanBankrupt || (players || []).filter((p) => p.isAI).every((p) => p.isBankrupt)
              ? "最終結果を見る ▶"
              : "次のTERNへ ▶"}
          </button>
        )}
      </div>
    );
  }

  return null;
}

/** ログ文字列内の [ICON:quick|heavy|defense|avant] を SVG アイコンに置換 */
function renderLogLine(text) {
  const s = String(text == null ? "" : text);
  const re = /\[ICON:(quick|heavy|defense|reflect|avant)\]/g;
  const nodes = [];
  let last = 0;
  let m;
  let key = 0;
  while ((m = re.exec(s)) !== null) {
    if (m.index > last) {
      nodes.push(s.slice(last, m.index));
    }
    const kind = m[1];
    const iconStyle = { display: "inline-block", verticalAlign: "middle", margin: "0 3px 0 1px", flexShrink: 0 };
    if (kind === "quick") {
      nodes.push(<Zap key={"i" + key++} size={12} className="icon-quick" style={iconStyle} />);
    } else if (kind === "heavy") {
      nodes.push(<Bomb key={"i" + key++} size={12} className="icon-heavy" style={iconStyle} />);
    } else if (kind === "defense") {
      nodes.push(<Shield key={"i" + key++} size={12} className="icon-defense" style={iconStyle} />);
    } else if (kind === "reflect") {
      nodes.push(<Reflect key={"i" + key++} size={12} className="icon-reflect" style={iconStyle} />);
    } else if (kind === "avant") {
      nodes.push(<Heptagram key={"i" + key++} size={12} className="icon-avant" style={iconStyle} />);
    }
    last = m.index + m[0].length;
  }
  if (last < s.length) nodes.push(s.slice(last));
  if (nodes.length === 0) return s;
  return nodes;
}

function TitlesModal({ titleSave, onClose, onEquip, canEquip }) {
  const unlocked = (titleSave && titleSave.unlocked) || {};
  const equippedList = normalizeEquipped(titleSave && titleSave.equipped);
  const equippedSet = {};
  equippedList.forEach((id) => { equippedSet[id] = true; });
  const avantTotal = Math.max(0, Number(titleSave && titleSave.avantTotal) || 0);
  const comebackTotal = Math.max(0, Number(titleSave && titleSave.comebackTotal) || 0);
  const coinRichTotal = Math.max(0, Number(titleSave && titleSave.coinRichTotal) || 0);
  const coinPoorTotal = Math.max(0, Number(titleSave && titleSave.coinPoorTotal) || 0);
  const gamesPlayed = Math.max(0, Number(titleSave && titleSave.gamesPlayed) || 0);

  const GROUP_ORDER = {
    A: ["asset", "comeback"],
    B: ["bailout", "coin_rich", "coin_poor"],
    C: ["quick", "heavy", "defense", "reflect", "avant"],
    D: ["play", "tutorial"],
    E: ["ultimate"],
  };
  const GROUP_LABELS = {
    asset: "資産",
    comeback: "逆転",
    bailout: "帳消し",
    coin_rich: "COIN温存",
    coin_poor: "COIN0",
    quick: "操作",
    heavy: "妨害",
    defense: "防衛",
    reflect: "反射",
    avant: "AVANT-GARDE",
    play: "通算プレイ",
    tutorial: "チュートリアル",
    ultimate: "総合",
  };

  const cats = [
    { key: "A", label: "A 取引・資産" },
    { key: "B", label: "B COIN" },
    { key: "C", label: "C 市場ハック" },
    { key: "D", label: "D 通算プレイ" },
    { key: "E", label: "E 総合" },
  ];

  function countUnlocked(list) {
    let n = 0;
    list.forEach((t) => { if (unlocked[t.id]) n++; });
    return n;
  }

  function progressPct(got, current, threshold) {
    if (got) return 100;
    if (threshold == null || threshold <= 0) return 0;
    const cur = Math.max(0, Number(current) || 0);
    return Math.min(100, Math.floor((cur / threshold) * 100));
  }

  /** 累計系のみ進捗値を表示。game系は解放済=100% / 未=0%（1ゲーム内条件のため） */
  function titleProgress(t) {
    const got = !!unlocked[t.id];
    if (got) return { pct: 100, label: "達成", current: null, threshold: t.threshold };
    if (t.group === "ultimate") {
      const others = TITLE_DEFS.filter((x) => x.id !== "ultimate");
      const current = others.filter((x) => unlocked[x.id]).length;
      const th = others.length;
      const pct = progressPct(false, current, th);
      return { pct, label: current + " / " + th, current, threshold: th };
    }
    if (t.kind !== "cumul" || t.threshold == null) {
      return { pct: 0, label: "未達成", current: null, threshold: t.threshold };
    }
    let current = 0;
    if (t.group === "avant") current = avantTotal;
    else if (t.group === "comeback") current = comebackTotal;
    else if (t.group === "coin_rich") current = coinRichTotal;
    else if (t.group === "coin_poor") current = coinPoorTotal;
    else if (t.group === "play") current = gamesPlayed;
    const pct = progressPct(false, current, t.threshold);
    return {
      pct,
      label: current + " / " + t.threshold,
      current,
      threshold: t.threshold,
    };
  }

  const totalAll = TITLE_DEFS.length;
  const unlockedAll = countUnlocked(TITLE_DEFS);
  const overallPct = totalAll > 0 ? Math.floor((unlockedAll / totalAll) * 100) : 0;

  return (
    <div className="ft-modal-overlay ft-titles-overlay" onClick={onClose}>
      <div className="ft-modal-box ft-modal-box-wide ft-titles-modal" onClick={(e) => e.stopPropagation()}>
        <div className="ft-modal-title">称号一覧</div>
        <p className="ft-modal-desc" style={{ marginBottom: 10 }}>
          称号の獲得はLOCALのみです（通算プレイ・総合以外は最終1位が条件）。途中リタイアは通算に含みません。進捗はブラウザに保存されます。称号は最大3つまで装備でき、トレーダー名・トップバーにバッジ表示されます（現在 {equippedList.length}/{MAX_EQUIPPED_TITLES}）。
        </p>
        <div className="ft-title-progress-block" style={{ marginBottom: 14 }}>
          <div className="ft-title-progress-head">
            <span>全体進捗</span>
            <span className="ft-title-progress-pct">{unlockedAll}/{totalAll}（{overallPct}%）</span>
          </div>
          <div className="ft-title-progress-bar">
            <div className="ft-title-progress-fill" style={{ width: overallPct + "%" }} />
          </div>
        </div>
        <div className="ft-modal-scroll">
          {cats.map((c) => {
            const catTitles = TITLE_DEFS.filter((t) => t.cat === c.key);
            const catGot = countUnlocked(catTitles);
            const catPct = catTitles.length ? Math.floor((catGot / catTitles.length) * 100) : 0;
            const groups = GROUP_ORDER[c.key] || [];
            return (
              <div key={c.key} className="ft-rules-section">
                <div className="ft-rules-h" style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, flexWrap: "wrap" }}>
                  <span>{c.label}</span>
                  <span className="ft-title-cat-pct">{catGot}/{catTitles.length}（{catPct}%）</span>
                </div>
                <div className="ft-title-progress-bar ft-title-progress-bar-sm" style={{ marginBottom: 12 }}>
                  <div className="ft-title-progress-fill" style={{ width: catPct + "%" }} />
                </div>
                {groups.map((gKey) => {
                  const gTitles = catTitles.filter((t) => t.group === gKey);
                  if (!gTitles.length) return null;
                  const gGot = countUnlocked(gTitles);
                  const gPct = Math.floor((gGot / gTitles.length) * 100);
                  return (
                    <div key={gKey} className="ft-title-group">
                      <div className="ft-title-group-head">
                        <span className="ft-title-group-label">{GROUP_LABELS[gKey] || gKey}</span>
                        <span className="ft-title-group-pct">{gGot}/{gTitles.length}（{gPct}%）</span>
                      </div>
                      <div className="ft-title-progress-bar ft-title-progress-bar-xs" style={{ marginBottom: 8 }}>
                        <div className="ft-title-progress-fill is-group" style={{ width: gPct + "%" }} />
                      </div>
                      {gTitles.map((t) => {
                        const got = !!unlocked[t.id];
                        const isEq = !!equippedSet[t.id];
                        const prog = titleProgress(t);
                        return (
                          <div key={t.id} className={"ft-title-row" + (got ? " is-got" : "") + (isEq ? " is-eq" : "")}>
                            <div style={{ flexShrink: 0, opacity: got ? 1 : 0.25 }}>
                              <TitleBadge titleId={t.id} size={20} />
                            </div>
                            <div style={{ flex: 1, minWidth: 0 }}>
                              <div className={got && t.rank === "rainbow" ? "ft-rainbow-text" : undefined} style={{ fontSize: 13, fontWeight: 700, color: got ? (t.rank === "rainbow" ? undefined : (titleRankColor(t.rank) || "var(--ft-accent)")) : "var(--ft-text-dim)" }}>
                                {got ? t.name : "？？？"}
                                {isEq ? <span style={{ marginLeft: 8, fontSize: 10, color: "var(--ft-amber)" }}>装備中</span> : null}
                              </div>
                              <div style={{ fontSize: 11, color: "var(--ft-text-dim)", marginTop: 2 }}>{t.desc}</div>
                              <div className="ft-title-item-progress">
                                <div className="ft-title-progress-bar ft-title-progress-bar-item">
                                  <div
                                    className={"ft-title-progress-fill" + (got ? " is-done" : "")}
                                    style={{ width: prog.pct + "%" }}
                                  />
                                </div>
                                <span className="ft-title-item-pct">{prog.pct}%{prog.label && prog.label !== "達成" && prog.label !== "未達成" ? " · " + prog.label : (got ? " · 達成" : "")}</span>
                              </div>
                            </div>
                            {got && canEquip ? (
                              <button
                                type="button"
                                className="ft-rules-btn"
                                style={{ flexShrink: 0, padding: "6px 10px" }}
                                onClick={() => onEquip && onEquip(t.id)}
                                title={isEq ? "装備を外す" : (equippedList.length >= MAX_EQUIPPED_TITLES ? "装備枠が満杯のため、最も古い装備と入れ替え" : "装備する（最大3つ）")}
                              >
                                {isEq ? "外す" : (equippedList.length >= MAX_EQUIPPED_TITLES ? "入替" : "装備")}
                              </button>
                            ) : null}
                          </div>
                        );
                      })}
                    </div>
                  );
                })}
              </div>
            );
          })}
          <div style={{ fontSize: 11, color: "var(--ft-text-dim)", marginTop: 8 }}>
            AVANT-GARDE累計: {avantTotal}回 ／
            逆転累計: {comebackTotal}回 ／
            COIN温存累計: {coinRichTotal} ／
            COIN0累計: {coinPoorTotal} ／
            通算プレイ: {gamesPlayed}回
          </div>
        </div>
        <div className="ft-modal-btns">
