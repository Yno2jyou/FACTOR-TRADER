<script>
  /* ピンチイン/アウト・ダブルタップ拡大の禁止（iOS Safari は user-scalable=no を無視するため） */
  (function () {
    var stop = function (e) { e.preventDefault(); };
    ["gesturestart", "gesturechange", "gestureend"].forEach(function (t) {
      document.addEventListener(t, stop, { passive: false });
    });
    document.addEventListener("touchmove", function (e) {
      if (e.touches && e.touches.length > 1) e.preventDefault();
    }, { passive: false });
    var lastEnd = 0;
    document.addEventListener("touchend", function (e) {
      var now = Date.now();
      if (now - lastEnd < 320) {
        var t = e.target, tag = t && t.tagName ? t.tagName.toUpperCase() : "";
        if (tag !== "INPUT" && tag !== "TEXTAREA" && tag !== "SELECT") e.preventDefault();
      }
      lastEnd = now;
    }, { passive: false });
  })();
</script>

  .a-slide-left { animation: aSlideLeft .4s ease both; }
  @keyframes aSlideRight { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: none; } }
  .a-slide-right { animation: aSlideRight .4s ease both; }
  @keyframes aScaleIn { from { opacity: 0; transform: scale(.98); } to { opacity: 1; transform: none; } }
  .a-scale-in { animation: aScaleIn .4s ease both; }
  @keyframes aBreathe { 0%,100% { opacity: .5; } 50% { opacity: .9; } }

  @keyframes aBreatheScale { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); } }
  .a-breathe-scale { animation: aBreatheScale 8s ease-in-out infinite; }

  @keyframes aSpinIn { from { opacity: 0; transform: scale(0) rotate(-30deg); } to { opacity: 1; transform: scale(1) rotate(0); } }
  .a-spin-in { animation: aSpinIn .45s cubic-bezier(.22,1.4,.36,1) both; }

  /* ===== STEP切り替え演出 ===== */
  @keyframes ftStepVeil { 0% { opacity: 1; } 82% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes ftStepWipe {
    0%   { transform: translateX(-125%) skewX(-14deg); }
    28%  { transform: translateX(0) skewX(-14deg); }
    72%  { transform: translateX(0) skewX(-14deg); }
    100% { transform: translateX(125%) skewX(-14deg); }
  }
  @keyframes ftStepFlash { 0% { opacity: 0; } 14% { opacity: .5; } 34% { opacity: 0; } 100% { opacity: 0; } }
  @keyframes ftStepNum {
    0%   { opacity: 0; transform: scale(3.4) rotate(-7deg); filter: blur(16px); }
    30%  { opacity: 1; transform: scale(1) rotate(0); filter: blur(0); }
    38%  { transform: scale(1.07); }
    46%  { transform: scale(1); }
    74%  { opacity: 1; transform: scale(1.03); filter: blur(0); }
    100% { opacity: 0; transform: scale(.7) translateX(60px); filter: blur(8px); }
  }
  @keyframes ftStepText {
    0%   { opacity: 0; letter-spacing: 1.1em; transform: translateY(14px); }
    34%  { opacity: 1; letter-spacing: .35em; transform: none; }
    74%  { opacity: 1; }
    100% { opacity: 0; transform: translateY(-10px); }
  }
  @keyframes ftStepBar { 0%, 14% { width: 0; opacity: 1; } 44% { width: min(72vw, 380px); opacity: 1; } 76% { width: min(72vw, 380px); opacity: 1; } 100% { width: min(72vw, 380px); opacity: 0; } }
  @keyframes ftStepIn {
    0%   { opacity: 0; transform: perspective(900px) translateY(70px) rotateX(14deg) scale(.9); filter: blur(8px); }
    60%  { opacity: 1; transform: perspective(900px) translateY(-6px) rotateX(0) scale(1.015); filter: blur(0); }
    100% { opacity: 1; transform: none; filter: none; }
  }
  @keyframes ftIntentIn { 0% { opacity: 0; transform: scale(.6) translateY(6px); } 60% { transform: scale(1.08); } 100% { opacity: 1; transform: none; } }
  .a-step-in { animation: ftStepIn .7s cubic-bezier(.2,1.1,.3,1) both; }
  .ft-step-overlay { position: fixed; inset: 0; z-index: 70; pointer-events: none; overflow: hidden; display: flex; align-items: center; justify-content: center; animation: ftStepVeil 1.25s ease both; }
  .ft-step-flash { position: absolute; inset: 0; background: var(--sc); mix-blend-mode: screen; animation: ftStepFlash 1.25s ease both; }
  .ft-step-wipe { position: absolute; top: -10%; bottom: -10%; left: -30%; width: 160%; transform: translateX(-125%) skewX(-14deg); animation: ftStepWipe 1.25s cubic-bezier(.7,0,.2,1) both; }

  .ft-step-num { font-weight: 800; line-height: .95; font-size: clamp(100px, 36vw, 230px); color: var(--sc); text-shadow: 0 0 28px var(--sc), 0 0 90px var(--sc); animation: ftStepNum 1.25s cubic-bezier(.2,.9,.2,1) both; }
  .ft-step-en { font-weight: 800; font-size: clamp(20px, 6.2vw, 42px); letter-spacing: .35em; color: #fff; animation: ftStepText 1.25s ease .04s both; }

  .ft-intent { animation: ftIntentIn .45s cubic-bezier(.2,1.2,.3,1) both; }
  @media (prefers-reduced-motion: reduce) {
    .ft-step-overlay { display: none; }
    .a-step-in, .ft-intent { animation: none !important; }
  }
  .hover-pop { transition: transform .18s ease; }
  .hover-pop:hover { transform: scale(1.18); }
</style>

  border-bottom: 1px solid rgba(192, 132, 252, 0.55);
  text-shadow: none;
}
.ft-rainbow-text {
  border-bottom: none;
  display: inline;
}

.ft-tb-title-row {
  display: inline-flex !important;
  align-items: center;
  gap: 8px;
  font-size: 13px !important;
}
.ft-tb-title .ft-tb-value {
.ft-title-row{opacity:.55}
.ft-title-row.is-got{opacity:1}
.ft-title-equip-btn{flex-shrink:0;padding:6px 10px;border-radius:6px;border:1px solid var(--ft-border);background:rgba(255,255,255,.04);color:#e2e8f0;font-size:11px;font-weight:700;font-family:ui-monospace,monospace;cursor:pointer}
.ft-title-equip-btn:hover{border-color:var(--ft-accent);color:var(--ft-accent)}
.ft-title-equip-btn.is-on{border-color:var(--ft-amber);color:var(--ft-amber)}
.ft-title-equipped-row{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:0 0 6px 0}
.ft-title-equipped-row .ft-title-badge-icon{width:18px;height:18px}
.ft-title-slotbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px 0;padding:8px 10px;border:1px dashed var(--ft-border);border-radius:6px;font-size:11px;color:var(--ft-text-dim)}

  function mergeTitleSaves(a, b) {

    const atA = Math.max(0, Number(A.equippedAt) || 0);
    const atB = Math.max(0, Number(B.equippedAt) || 0);

    let equipped;
    let equippedAt;
    if (atB > atA) {
      equipped = equippedB;
      equippedAt = atB;
    } else if (atA > atB) {
      equipped = equippedA;
      equippedAt = atA;
    } else if (equippedA.length) {
      equipped = equippedA;
      equippedAt = atA;
    } else {
      equipped = equippedB;
      equippedAt = atB;
    }
    equipped = normalizeEquipped(equipped.filter((id) => unlocked[id]));

  function mergeAiLearn(a, b) {

    const out = JSON.parse(JSON.stringify(base));

  async function loginAccount(id, password, otpToken) {

    }

        salt: salt,
        passHash: passHash,

        updatedAt: Date.now(),

    }

    let progress = account.progress || { titleSave: loadTitleSave(), aiLearn: defaultAiLearn() };

      progress = {
        titleSave: mergeTitleSaves(progress.titleSave, fromRemote.progress.titleSave),
        aiLearn: mergeAiLearn(progress.aiLearn, fromRemote.progress.aiLearn),

    }
    progress = {

      aiLearn: mergeAiLearn(progress.aiLearn, guest.aiLearn),
    };
    account.progress = progress;
    account.updatedAt = Date.now();
    map[uid] = account;
    saveAuthAccounts(map);
    saveAuthSession({ id: uid });
    applyProgressToLocal(progress);
    return { account, merged: true };
  }

            finish(function () {
              resolve(data.pack);
            });
            try {
              conn.close();
            } catch (e) {}
          }
        });
        conn.on("open", function () {
          try {
            conn.send({ type: "ftotp-hello" });
          } catch (e) {}
        });
      }
      function tryConnect() {
        if (done) return;
        attempt += 1;
        if (attempt > maxAttempts) return;
        try {
          if (peer) {
            try {
              peer.destroy();
            } catch (e) {}
            peer = null;
          }
          peer = new Peer(ftSyncPeerOptions());
          peer.on("error", function (err) {
            const t = err && err.type ? String(err.type) : "";
            if (t === "browser-incompatible") {
              finish(function () {
                reject(new Error("この環境では端末間同期接続に対応していません。長いコードを使ってください。"));
              });
              return;
            }
            if (!done && attempt < maxAttempts) {
              if (retryTimer) clearTimeout(retryTimer);
              retryTimer = setTimeout(tryConnect, 600 + attempt * 250);
            }
          });
          peer.on("open", function () {
            if (done) return;
            try {
              const conn = peer.connect(targetId, { reliable: true, serialization: "json" });
              attachConn(conn);
            } catch (e) {
              if (!done && attempt < maxAttempts) {
                if (retryTimer) clearTimeout(retryTimer);
                retryTimer = setTimeout(tryConnect, 500);
              }
            }
            if (!done && attempt < maxAttempts) {
              if (retryTimer) clearTimeout(retryTimer);
              retryTimer = setTimeout(function () {
                if (!done) tryConnect();
              }, 1800 + attempt * 200);
            }
          });
        } catch (e) {
          if (!done && attempt < maxAttempts) {
            if (retryTimer) clearTimeout(retryTimer);
            retryTimer = setTimeout(tryConnect, 500);
          }
        }
      }
      tryConnect();
    });
  }
  function parseOtpLongToken(raw) {
    let s = String(raw || "").trim();
    if (!s.startsWith("FTOTP1.")) return null;
    s = s.slice(7);
    try {
      return JSON.parse(new TextDecoder().decode(ftBytesFromB64(s)));
    } catch (e) {
      return null;
    }
  }
  async function issueSyncOtp(password) {
    const uid = getLoggedInAccountId();
    if (!uid) throw new Error("ログインしてください");
    if (!password) throw new Error("パスワードを再入力してください");
    const map = loadAuthAccounts();
    const account = map[uid];
    if (!account) throw new Error("アカウントが見つかりません");
    const expect = await ftSha256Hex(account.salt + ":" + password);
    if (expect !== account.passHash) throw new Error("パスワードが違います");
    // 最新進捗を反映
    account.progress = collectLocalProgress();
    account.updatedAt = Date.now();
    map[uid] = account;
    saveAuthAccounts(map);
    const otp = ftRandomOtp(8);
    const salt = ftRandomSaltB64(16);
    const nonce = ftRandomSaltB64(12);
    const exp = Date.now() + FT_OTP_TTL_MS;
    const body = {
      v: 1,
      id: uid,
      otp: otp,
      nonce: nonce,
      progress: account.progress,
      ts: Date.now(),
      exp: exp,
    };
    const enc = await ftEncryptJson(body, password + ":" + otp, salt);
    const pack = {
      v: 1,
      id: uid,
      otp: otp,
      salt: salt,
      iv: enc.iv,
      data: enc.data,
    };
    saveOtpVaultEntry(otp, pack, exp);
    startOtpPublishPeer(otp, pack, exp);
    // 互換用トークン（UIでは非表示。旧形式の貼付にも対応）
    const token = "FTOTP1." + ftB64FromBytes(ftUtf8(JSON.stringify(pack)));
    return { otp: otp, token: token, expMin: 5 };
  }
  async function consumeSyncOtp(uid, password, tokenOrOtp) {
    let raw = String(tokenOrOtp || "").trim();
    if (!raw) throw new Error("ワンタイムパスワードを入力してください");

    let pack = null;
    let shortOtp = null;

    if (raw.indexOf("FTOTP1.") >= 0) {
      // 旧形式の長いコードも受け付ける
      const idx = raw.indexOf("FTOTP1.");
      pack = parseOtpLongToken(raw.slice(idx));
      if (!pack) throw new Error("ワンタイムパスワードの形式が不正です");
    } else {
      shortOtp = ftNormalizeOtp(raw);
      if (!/^[A-Z0-9]{6,12}$/.test(shortOtp)) {
        throw new Error("ワンタイムパスワードは8桁の英数字です");
      }
      const entry = peekOtpVaultEntry(shortOtp);
      if (entry && entry.pack) {
        if (entry.exp && Date.now() > Number(entry.exp)) {
          removeOtpVaultEntry(shortOtp);
          throw new Error("ワンタイムパスワードの有効期限が切れています（発行から5分）");
        }
        pack = entry.pack;
      } else {
        try {
          pack = await fetchOtpPackViaPeer(shortOtp, 28000);
        } catch (e) {
          throw new Error(
            (e && e.message) ||
              "発行元に接続できませんでした。PWAでは「長いコード」を発行元からコピーしてログイン欄へ貼り付けてください。"
          );
        }
      }
    }

    if (!pack || pack.v !== 1 || !pack.otp || !pack.salt || !pack.iv || !pack.data) {
      throw new Error("ワンタイムパスワードの形式が不正です");
    }
    if (shortOtp && ftNormalizeOtp(pack.otp) !== shortOtp) {
      throw new Error("ワンタイムパスワードが不正です");
    }
    if (pack.id && uid && pack.id !== uid) {
      throw new Error("IDがワンタイムパスワードと一致しません");
    }
    const useId = String(uid || pack.id || "").trim();
    if (!useId) throw new Error("IDを入力してください");
    let body;
    try {
      body = await ftDecryptJson({ iv: pack.iv, data: pack.data }, password + ":" + pack.otp, pack.salt);
    } catch (e) {
      throw new Error("ワンタイムパスワードまたはパスワードが違います");
    }
    if (!body || !body.progress) throw new Error("データが読めませんでした");
    if (body.exp && Date.now() > Number(body.exp)) {
      removeOtpVaultEntry(pack.otp);
      throw new Error("ワンタイムパスワードの有効期限が切れています（発行から5分）");
    }
    if (body.otp && body.otp !== pack.otp) throw new Error("ワンタイムパスワードが不正です");
    // 使い捨て: 同じ nonce は再使用不可（この端末）
    try {
      const usedKey = "factor_trader_otp_used_v1";
      const used = JSON.parse(localStorage.getItem(usedKey) || "{}");
      const nk = String(body.nonce || pack.otp);
      if (used[nk]) throw new Error("このワンタイムパスワードは使用済みです");
      used[nk] = Date.now();
      const cutoff = Date.now() - 7 * 24 * 3600 * 1000;
      Object.keys(used).forEach((k) => {
        if (used[k] < cutoff) delete used[k];
      });
      localStorage.setItem(usedKey, JSON.stringify(used));
    } catch (e) {
      if (e && e.message && e.message.indexOf("使用済み") >= 0) throw e;
    }
    removeOtpVaultEntry(pack.otp);
    return { id: useId, progress: body.progress, otp: pack.otp };
  }


  function logoutAccount() {
    // 進捗は端末に残す。明示ログアウト時のみセッション解除
    try { stopLiveSync(); } catch (e) {}
    try { clearSyncSession(); } catch (e) {}
    saveAuthSession(null);
  }

  function getLoggedInAccountId() {
    const s = loadAuthSession();
    return s && s.id ? s.id : null;
  }

  /** ログイン中なら称号・AI学習をアカウントへ書き戻し */
  function persistLoggedInProgress() {
    const uid = getLoggedInAccountId();
    if (!uid) return;
    const map = loadAuthAccounts();
    const account = map[uid];
    if (!account) return;
    account.progress = collectLocalProgress();
    account.updatedAt = Date.now();

  /* ========== 他端末ライブ同期（PeerJS・ログイン中は常時） ========== */
  const FT_SYNC_SESSION_KEY = "factor_trader_sync_session_v1";
  const FT_SYNC_PEER_PREFIX = "ftsync2-";
  const FT_SYNC_PULL_MS = 5000;
  let _ftSyncPeer = null;
  let _ftSyncHosting = false;
  let _ftSyncPack = null;
  let _ftSyncPullTimer = null;
  let _ftSyncPushTimer = null;
  let _ftSyncBusy = false;
  let _ftSyncStartedFor = null;
  let _ftSyncHostRetryTimer = null;
  let _ftSyncConns = [];
  let _ftSyncVisBound = false;

  /** ライブ同期資格情報も localStorage（ログアウトまで・PWA再起動後も自動再開） */
  function saveSyncSession(id, password) {
    try {
      const payload = JSON.stringify({
        id: String(id || ""),
        password: String(password || ""),
        t: Date.now(),
      });
      localStorage.setItem(FT_SYNC_SESSION_KEY, payload);
      try { sessionStorage.removeItem(FT_SYNC_SESSION_KEY); } catch (e0) {}
    } catch (e) {}
  }
  function loadSyncSession() {
    try {
      let raw = localStorage.getItem(FT_SYNC_SESSION_KEY);
      if (!raw) {
        try {
          raw = sessionStorage.getItem(FT_SYNC_SESSION_KEY);
          if (raw) {
            localStorage.setItem(FT_SYNC_SESSION_KEY, raw);
            sessionStorage.removeItem(FT_SYNC_SESSION_KEY);
          }
        } catch (e1) {}
      }
      const o = JSON.parse(raw || "null");
      if (!o || !o.id || !o.password) return null;
      const uid = getLoggedInAccountId();
      if (!uid || String(uid) !== String(o.id)) return null;
      return o;
    } catch (e) {
      return null;
    }
  }
  function clearSyncSession() {
    try { localStorage.removeItem(FT_SYNC_SESSION_KEY); } catch (e) {}
    try { sessionStorage.removeItem(FT_SYNC_SESSION_KEY); } catch (e) {}
  }

  async function ftSyncPeerIdFor(uid) {
    const h = await ftSha256Hex("ft-live-sync-v2:" + String(uid || ""));
    return FT_SYNC_PEER_PREFIX + h.slice(0, 16);
  }

  function mergeProgressBlobs(a, b) {
    const A = a || {};
    const B = b || {};
    return {
      titleSave: mergeTitleSaves(A.titleSave, B.titleSave),
      aiLearn: mergeAiLearn(A.aiLearn, B.aiLearn),
    };
  }

  async function buildLiveSyncPack(password, uid) {
    const progress = collectLocalProgress();
    const salt = ftRandomSaltB64(16);
    const body = { v: 2, id: uid, progress: progress, ts: Date.now() };
    const enc = await ftEncryptJson(body, String(password) + ":livesync", salt);
    return { v: 2, id: uid, salt: salt, iv: enc.iv, data: enc.data, ts: body.ts };
  }

  async function decryptLiveSyncPack(pack, password) {
    if (!pack || !pack.salt || !pack.iv || !pack.data) throw new Error("同期データ不正");
    const body = await ftDecryptJson({ iv: pack.iv, data: pack.data }, String(password) + ":livesync", pack.salt);
    if (!body || !body.progress) throw new Error("同期データが読めません");
    return body;
  }

  function notifyProgressUi() {
    try {
      if (typeof window !== "undefined") window.dispatchEvent(new CustomEvent("ft-progress-changed"));
    } catch (e) {}
    try {
      if (typeof window !== "undefined" && window.__ftReloadProgress) window.__ftReloadProgress();
    } catch (e) {}
  }

  async function applyMergedProgressFromRemote(remoteProgress) {
    if (!remoteProgress) return false;
    const local = collectLocalProgress();
    const merged = mergeProgressBlobs(local, remoteProgress);
    // 装備は mergeTitleSaves の LWW に加え、明示的に再適用（取りこぼし防止）
    try {
      const lt = (local && local.titleSave) || {};
      const rt = (remoteProgress && remoteProgress.titleSave) || {};
      const atL = Math.max(0, Number(lt.equippedAt) || 0);
      const atR = Math.max(0, Number(rt.equippedAt) || 0);
      if (!merged.titleSave) merged.titleSave = {};
      if (atR > atL) {
        merged.titleSave.equipped = normalizeEquipped(rt.equipped);
        merged.titleSave.equippedAt = atR;
      } else {
        merged.titleSave.equipped = normalizeEquipped(lt.equipped);
        merged.titleSave.equippedAt = atL;
      }
    } catch (e) {}
    const same =
      JSON.stringify((local.titleSave || {}).equipped || []) === JSON.stringify((merged.titleSave || {}).equipped || []) &&
      Number((local.titleSave || {}).equippedAt || 0) === Number((merged.titleSave || {}).equippedAt || 0) &&
      JSON.stringify(local) === JSON.stringify(merged);
    if (same) return false;
    applyProgressToLocal(merged);
    const uid = getLoggedInAccountId();
    if (uid) {
      const map = loadAuthAccounts();
      if (map[uid]) {
        map[uid].progress = merged;
        map[uid].updatedAt = Date.now();
        saveAuthAccounts(map);
      }
    }
    notifyProgressUi();
    return true;
  }

  function stopLiveSync() {
    if (_ftSyncPullTimer) { clearInterval(_ftSyncPullTimer); _ftSyncPullTimer = null; }
    if (_ftSyncPushTimer) { clearTimeout(_ftSyncPushTimer); _ftSyncPushTimer = null; }
    if (_ftSyncHostRetryTimer) { clearTimeout(_ftSyncHostRetryTimer); _ftSyncHostRetryTimer = null; }
    _ftSyncPack = null;
    _ftSyncHosting = false;
    _ftSyncStartedFor = null;
    _ftSyncConns = [];
    if (_ftSyncPeer) {
      try { _ftSyncPeer.destroy(); } catch (e) {}
      _ftSyncPeer = null;
    }
  }

  function scheduleLiveSyncPush() {
    if (!loadSyncSession()) return;
    if (_ftSyncPushTimer) clearTimeout(_ftSyncPushTimer);
    _ftSyncPushTimer = setTimeout(function () {
      _ftSyncPushTimer = null;
      refreshLiveSyncPackAndBroadcast().catch(function () {});
    }, 300);
  }

  async function refreshLiveSyncPackAndBroadcast() {
    const sess = loadSyncSession();
    if (!sess) return;
    try {
      _ftSyncPack = await buildLiveSyncPack(sess.password, sess.id);
    } catch (e) { return; }
    (_ftSyncConns || []).forEach(function (conn) {
      try { if (conn && conn.open) conn.send({ type: "ftsync-pack", pack: _ftSyncPack }); } catch (e) {}
    });
  }

  function destroySyncPeerQuiet() {
    _ftSyncConns = [];
    if (_ftSyncPeer) {
      try { _ftSyncPeer.destroy(); } catch (e) {}
      _ftSyncPeer = null;
    }
    _ftSyncHosting = false;
  }

  function wireSyncConnection(conn, sess) {
    if (!conn || !sess) return;
    conn.on("data", function (data) {
      handleSyncConnData(conn, data, sess).catch(function () {});
    });
    conn.on("close", function () {
      _ftSyncConns = (_ftSyncConns || []).filter(function (c) { return c !== conn; });
    });
    try { if (_ftSyncPack) conn.send({ type: "ftsync-pack", pack: _ftSyncPack }); } catch (e) {}
  }

  async function handleSyncConnData(conn, data, sess) {
    if (!data || !sess) return;
    try {
      if (data.type === "ftsync-hello" && data.pack) {
        const remoteBody = await decryptLiveSyncPack(data.pack, sess.password);
        if (remoteBody.id && String(remoteBody.id) !== String(sess.id)) return;
        await applyMergedProgressFromRemote(remoteBody.progress);
        _ftSyncPack = await buildLiveSyncPack(sess.password, sess.id);
        try { conn.send({ type: "ftsync-result", pack: _ftSyncPack }); } catch (e) {}
        return;
      }
      if ((data.type === "ftsync-pack" || data.type === "ftsync-result") && data.pack) {
        const remoteBody = await decryptLiveSyncPack(data.pack, sess.password);
        if (remoteBody.id && String(remoteBody.id) !== String(sess.id)) return;
        await applyMergedProgressFromRemote(remoteBody.progress);
        _ftSyncPack = await buildLiveSyncPack(sess.password, sess.id);
      }
    } catch (e) {}
  }

  async function ensureLiveSyncHost() {
    const sess = loadSyncSession();
    if (!sess) return false;
    if (typeof Peer === "undefined") return false;
    if (_ftSyncPeer && _ftSyncHosting) {
      await refreshLiveSyncPackAndBroadcast();
      return true;
    }
    if (_ftSyncPeer && !_ftSyncHosting) destroySyncPeerQuiet();
    if (_ftSyncPeer) return !!_ftSyncHosting;

    const peerId = await ftSyncPeerIdFor(sess.id);
    await refreshLiveSyncPackAndBroadcast();

    return await new Promise(function (resolve) {
      let settled = false;
      const done = function (v) { if (settled) return; settled = true; resolve(v); };
      try {
        const peer = new Peer(peerId, { debug: 0 });
        _ftSyncPeer = peer;
        const failTimer = setTimeout(function () {
          if (!_ftSyncHosting) { destroySyncPeerQuiet(); done(false); }
        }, 6000);
        peer.on("open", function () {
          _ftSyncHosting = true;
          clearTimeout(failTimer);
          done(true);
        });
        peer.on("connection", function (conn) {
          _ftSyncConns.push(conn);
          conn.on("open", function () { wireSyncConnection(conn, sess); });
        });
        peer.on("error", function (err) {
          const t = err && err.type;
          if (t === "unavailable-id") {
            clearTimeout(failTimer);
            destroySyncPeerQuiet();
            done(false);
          } else if (t === "network" || t === "disconnected" || t === "server-error" || t === "socket-error") {
            clearTimeout(failTimer);
            destroySyncPeerQuiet();
            done(false);
          }
        });
        peer.on("close", function () {
          _ftSyncPeer = null;
          _ftSyncHosting = false;
          _ftSyncConns = [];
        });
      } catch (e) {
        destroySyncPeerQuiet();
        done(false);
      }
    });
  }

  async function fetchLiveSyncFromHost(uid, password, localPack, timeoutMs) {
    if (typeof Peer === "undefined") throw new Error("PeerJS未読込");
    const peerId = await ftSyncPeerIdFor(uid);
    return await new Promise(function (resolve, reject) {
      let done = false;
      let client = null;
      const finish = function (fn) {
        if (done) return;
        done = true;
        clearTimeout(timer);
        try { if (client) client.destroy(); } catch (e) {}
        fn();
      };
      const timer = setTimeout(function () {
        finish(function () { reject(new Error("他端末に接続できませんでした")); });
      }, timeoutMs || 10000);
      try {
        client = new Peer({ debug: 0 });
      } catch (e) {
        finish(function () { reject(e); });
        return;
      }
      client.on("error", function () {
        finish(function () { reject(new Error("同期接続エラー")); });
      });
      client.on("open", function () {
        try {
          const conn = client.connect(peerId, { reliable: true });
          conn.on("error", function () {
            finish(function () { reject(new Error("ホスト未起動")); });
          });
          conn.on("open", function () {
            try { conn.send({ type: "ftsync-hello", pack: localPack || null }); } catch (e) {}
          });
          conn.on("data", function (data) {
            (async function () {
              try {
                if (!data || !data.pack) return;
                if (data.type !== "ftsync-result" && data.type !== "ftsync-pack") return;
                const body = await decryptLiveSyncPack(data.pack, password);
                if (body.id && String(body.id) !== String(uid)) {
                  finish(function () { reject(new Error("ID不一致")); });
                  return;
                }
                finish(function () { resolve(body); });
              } catch (e) {
                finish(function () { reject(e); });
              }
            })();
          });
        } catch (e) {
          finish(function () { reject(e); });
        }
      });
    });
  }

  async function tryBootstrapFromLiveSync(uid, password) {
    const salt = ftRandomSaltB64(16);
    const emptyProgress = {
      titleSave: { unlocked: {}, equipped: [], playTotal: 0, cumul: {}, avantTotal: 0, comebackTotal: 0, coinRichTotal: 0, coinPoorTotal: 0, gamesPlayed: 0 },
      aiLearn: typeof defaultAiLearn === "function" ? defaultAiLearn() : {},
    };
    let helloPack = null;
    try {
      const body = { v: 2, id: uid, progress: emptyProgress, ts: Date.now() };
      const enc = await ftEncryptJson(body, String(password) + ":livesync", salt);
      helloPack = { v: 2, id: uid, salt: salt, iv: enc.iv, data: enc.data, ts: body.ts };
    } catch (e) {
      helloPack = null;
    }
    const body = await fetchLiveSyncFromHost(uid, password, helloPack, 12000);
    if (!body || !body.progress) throw new Error("同期データなし");
    return { progress: body.progress, id: uid };
  }

  async function pullLiveSyncOnce() {
    const sess = loadSyncSession();
    if (!sess || _ftSyncBusy) return;
    _ftSyncBusy = true;
    try {
      await refreshLiveSyncPackAndBroadcast();
      if (!_ftSyncHosting) {
        const hosted = await ensureLiveSyncHost();
        if (!hosted) {
          try {
            const body = await fetchLiveSyncFromHost(sess.id, sess.password, _ftSyncPack, 8000);
            if (body && body.progress) {
              await applyMergedProgressFromRemote(body.progress);
              _ftSyncPack = await buildLiveSyncPack(sess.password, sess.id);
            }
          } catch (e) {
            if (!_ftSyncHostRetryTimer) {
              _ftSyncHostRetryTimer = setTimeout(function () {
                _ftSyncHostRetryTimer = null;
                ensureLiveSyncHost().catch(function () {});
              }, 2000);
            }
          }
        }
      }
    } finally {
      _ftSyncBusy = false;
    }
  }

  async function startLiveSync(id, password) {
    id = String(id || "").trim().toLowerCase();
    if (!id || !password) return;
    saveSyncSession(id, password);
    if (_ftSyncStartedFor === id && _ftSyncPullTimer) {
      await refreshLiveSyncPackAndBroadcast();
      await pullLiveSyncOnce();
      return;
    }
    stopLiveSync();
    saveSyncSession(id, password);
    _ftSyncStartedFor = id;
    await refreshLiveSyncPackAndBroadcast();
    await ensureLiveSyncHost();
    await pullLiveSyncOnce();
    _ftSyncPullTimer = setInterval(function () {
      pullLiveSyncOnce().catch(function () {});
    }, FT_SYNC_PULL_MS);
    if (!_ftSyncVisBound) {
      _ftSyncVisBound = true;
      try {
        document.addEventListener("visibilitychange", function () {
          if (!document.hidden) pullLiveSyncOnce().catch(function () {});
        });
      } catch (e) {}
    }
  }

  (function hydrateLoggedInAccount() {
    try {
      const uid = getLoggedInAccountId();
      if (!uid) return;
      const map = loadAuthAccounts();
      const acc = map[uid];
      if (acc && acc.progress) applyProgressToLocal(mergeProgressBlobs(collectLocalProgress(), acc.progress));
    } catch (e) {}
    try {
      const sess = loadSyncSession();
      if (sess && sess.id && sess.password) {
        setTimeout(function () {
          startLiveSync(sess.id, sess.password).catch(function () {});
        }, 400);
      }
    } catch (e) {}
    try {
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState !== "visible") return;
        if (!getLoggedInAccountId()) return;
        const sess = loadSyncSession();
        if (sess && sess.id && sess.password) {
          startLiveSync(sess.id, sess.password).catch(function () {});
        }
      });
    } catch (e) {}
  })();

  /** ログイン済み（旧バージョンでログインしたまま＝同期資格情報なし）の端末で、パスワード確認のうえ同期を開始 */
  async function enableLiveSyncForLoggedIn(password) {
    const uid = getLoggedInAccountId();
    if (!uid) throw new Error("ログインしてください");
    if (!password) throw new Error("パスワードを入力してください");
    const map = loadAuthAccounts();
    const account = map[uid];

            if (totalMatch > 0) {

  /** 1TERN終了時の学習（注文・COIN・結果から傾向を更新） */
  function recordAiTurnLearn(basePlayers, orders, hacks, execResults, nStart, priceBefore) {
    try {
      const d = loadAiLearn();
      const prime = isPrime(nStart);

      (basePlayers || []).forEach((p) => {
        if (!p || p.isBankrupt) return;
        const ord = (orders && orders[p.id]) || { action: "stay", shares: 0 };
        const hk = (hacks && hacks[p.id]) || {};
        const ex = (execResults && execResults[p.id]) || {};
        if (!p.isAI) {
          humAct += 1;
          if (ord.action === "buy" && (ord.shares || 0) > 0) humBuy += 1;
          if ((hk.heavy || 0) > 0) humHeavy += 1;
          if (hk.defense || hk.reflect) humProt += 1;
        } else {
          if ((hk.heavy || 0) > 0) {
            d.s.heavyTries += 1;
            let hit = false;
            (basePlayers || []).forEach((op) => {
              if (!op || String(op.id) === String(p.id)) return;
              const oex = execResults[op.id];
              if (oex && oex.bankrupt) hit = true;
            });
            if (hit) d.s.heavyHits += 1;
          }
          if (hk.defense || hk.reflect) d.s.protectUsed += 1;
          if (ex.bankrupt) d.s.aiBankrupts += 1;
          if (ord.action === "buy" && (ord.shares || 0) > 0 && prime) {
            d.s.buyPrimeN += 1;
            if (!ex.bankrupt && (ex.sharesFilled || 0) > 0) d.s.buyPrimeOk += 1;
          }
          if (ord.action === "sell" && (ord.shares || 0) > 0 && isHigh) {
            d.s.sellHighN += 1;
            if ((ex.sharesFilled || 0) > 0) d.s.sellHighOk += 1;
          }
        }
        if (!p.isAI && ex.bankrupt) d.s.humanBankrupts += 1;
      });
      if (humAct > 0) {
        const a = 0.12;
        d.human.buyRate = d.human.buyRate * (1 - a) + (humBuy / humAct) * a;
        d.human.heavyRate = d.human.heavyRate * (1 - a) + (humHeavy / humAct) * a;
        d.human.protectRate = d.human.protectRate * (1 - a) + (humProt / humAct) * a;
      }
      // 軽量な重み微調整（毎ターン）
      if (d.s.heavyTries >= 5) {
        const rate = d.s.heavyHits / d.s.heavyTries;
        d.w.heavy = clampW(d.w.heavy + (rate > 0.25 ? 0.01 : -0.008));
      }
      if (d.s.buyPrimeN >= 5) {
        const rate = d.s.buyPrimeOk / d.s.buyPrimeN;
        d.w.primeBuy = clampW(d.w.primeBuy + (rate > 0.55 ? 0.01 : -0.008));
      }
      if (d.s.sellHighN >= 5) {
        const rate = d.s.sellHighOk / d.s.sellHighN;
        d.w.highSell = clampW(d.w.highSell + (rate > 0.55 ? 0.01 : -0.008));
      }
      if (d.s.aiBankrupts > 0 && d.games > 0) {
        d.w.protect = clampW(d.w.protect + 0.004);
        d.w.aggression = clampW(d.w.aggression - 0.003);
      }
      saveAiLearn(d);
    } catch (e) {}
  }

  /** ゲーム終了時の学習（人間が勝てばIQ上昇・負ければ低下。プレイヤーに合わせた難度） */
  function recordAiGameLearn(ranked, price) {
    try {
      const d = loadAiLearn();
      d.games = (d.games || 0) + 1;
      let iq = clampAiIq(d.iq != null ? d.iq : 80);
      const list = ranked || [];
      // 人間プレイヤー全員について、最強CPUとの比較で勝敗を集計（一人一人に反映）
      const humans = list.filter((p) => p && !p.isAI);
      const ais = list.filter((p) => p && p.isAI);
      const bestAiTV = ais.length
        ? Math.max.apply(null, ais.map((p) => totalValue(p, price)))
        : 0;
      let anyHumanWin = false;
      let anyHumanLose = false;
      humans.forEach((hum) => {
        const humTV = totalValue(hum, price);
        if (!ais.length) return;
        if (humTV >= bestAiTV) {
          anyHumanWin = true;
          d.humanBeatsAi = (d.humanBeatsAi || 0) + 1;
        } else {
          anyHumanLose = true;
          d.aiBeatsHuman = (d.aiBeatsHuman || 0) + 1;
        }
      });
      if (anyHumanWin && !anyHumanLose) {
        // 人間側がCPUを上回った → IQ上昇（次の対局でCPUが強くなる）
        const delta = 5 + Math.floor(Math.random() * 5); // +5〜9
        iq = clampAiIq(iq + delta);
        d.w.protect = clampW(d.w.protect + 0.02);
        d.w.stayTrap = clampW(d.w.stayTrap + 0.015);
        d.w.heavy = clampW(d.w.heavy + (d.human.buyRate > 0.45 ? 0.02 : 0.008));
        d.w.aggression = clampW(d.w.aggression - 0.008);
        d.w.endgame = clampW(d.w.endgame + 0.012);
        d.w.noise = clampW(d.w.noise - 0.015);
      } else if (anyHumanLose && !anyHumanWin) {
        // CPUが人間を上回った → IQ低下
        const delta = 3 + Math.floor(Math.random() * 5); // -3〜7
        iq = clampAiIq(iq - delta);
        d.w.aggression = clampW(d.w.aggression + 0.01);
        d.w.heavy = clampW(d.w.heavy + 0.008);
        d.w.noise = clampW(d.w.noise + 0.01);
      } else if (anyHumanWin && anyHumanLose) {
        // 混在（複数人間）: わずかに上昇寄り
        iq = clampAiIq(iq + 2);
        d.w.noise = clampW(d.w.noise - 0.005);
      }
      d.iq = iq;
      if (d.games >= 10) d.w.noise = clampW(d.w.noise - 0.008);
      if (d.games >= 30) d.w.noise = clampW(Math.min(d.w.noise, 0.32));
      saveAiLearn(d);
    } catch (e) {}
  }

  function sopf(n) {
    let num = Math.floor(n);
    if (num < 2) return 0;
    let sum = 0;
    let d = 2;
    while (d * d <= num) {
      while (num % d === 0) {
        sum += d;
        num = Math.floor(num / d);
      }
      d += 1;
    }
    if (num > 1) sum += num;
    return sum;
  }
  function factorize(n) {
    let num = Math.floor(n);
    const factors = [];
    let d = 2;
    while (d * d <= num) {
      while (num % d === 0) {
        factors.push(d);
        num = Math.floor(num / d);
      }
      d += 1;
    }
    if (num > 1) factors.push(num);
    return factors.length ? factors : [num];
  }

  function isPrime(n) {

  function minOrderShares(action, holdings, maxBuyShares) {
    if (action === "sell") {
      if (holdings <= 0) return 0;
      return Math.max(1, Math.ceil(holdings * 0.5));
    }
    if (action === "buy") {
      if (maxBuyShares <= 0) return 0;
      return Math.max(1, Math.ceil(maxBuyShares * 0.5));
    }
    return 0;
  }
  function clampOrder(order, cash, holdings, priceBefore, turn, totalTurns) {
    const maxBuy = priceBefore > 0 ? Math.floor(cash / priceBefore) : 0;
    const end = isLastFiveTurns(turn, totalTurns);
    let action = order && order.action || "stay";
    let shares = Math.max(0, Math.floor(order && order.shares || 0));
    if (end) {
      if (action === "stay") {
        if (holdings > 0) action = "sell";
        else if (maxBuy > 0 && !(order && order.leaderProtect)) action = "buy";
      }
      if (action === "buy" || action === "sell") {
        const maxS = action === "buy" ? maxBuy : holdings;
        if (maxS <= 0) {
          action = "stay";
          shares = 0;
        } else {
          const minS = minOrderShares(action, holdings, maxBuy);
          if (!shares || shares < minS) shares = minS;
          if (shares > maxS) shares = maxS;
          if (shares < 1) {
            action = "stay";
            shares = 0;
          }
        }
      }
    }
    if (action === "buy") {
      shares = Math.min(shares, maxBuy);
      if (shares <= 0) {
        action = "stay";
        shares = 0;
      }
    } else if (action === "sell") {
      shares = Math.min(shares, holdings);
      if (shares <= 0) {
        action = "stay";
        shares = 0;
      }
    } else {
      shares = 0;
    }
    return { action, shares };
  }
