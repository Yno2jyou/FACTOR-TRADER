function ChartPanel({ priceHistory, nStart, priceBefore, refPrice, phase }) {
  const max = Math.max(20, ...priceHistory.map((h) => h.price), priceBefore || 0, refPrice || 0);
  const points = priceHistory.slice(-8);
  const w = 560;
  const h = 160;
  const stepX = points.length > 1 ? w / (points.length - 1) : w;

  const path = points
    .map((p, i) => {
      const x = points.length > 1 ? i * stepX : w / 2;
      const y = h - (p.price / max) * (h - 20) - 10;
      return `${i === 0 ? "M" : "L"}${x},${y}`;
    })
    .join(" ");

  const diff = priceBefore - refPrice;
  const diffPct = refPrice > 0 ? ((priceBefore / refPrice - 1) * 100) : 0;

  return (
    <div className="ft-panel ft-panel-chart">
      <div className="ft-panel-head">
        <Activity size={15} /> MARKET FEED
      </div>
      <div className="ft-chart-body">
      <div className="ft-refprice-box">
        <div className="ft-refprice-label">📌 前回終値（値動きの目安。実際の売買は最終株価で株価します）</div>
        <div className="ft-refprice-row">
          <span className="ft-refprice-value">{yenNum(refPrice)}円</span>
          <span className="ft-refprice-arrow">→</span>
          <span className="ft-refprice-value current">{yenNum(priceBefore)}円</span>
          <span className={"ft-refprice-diff" + (diff > 0 ? " up" : diff < 0 ? " down" : "")}>
            {diff === 0 ? "±0" : diff > 0 ? `+${diff}円` : `${diff}円`}
            {refPrice > 0 && ` (${diffPct >= 0 ? "+" : ""}${diffPct.toFixed(1)}%)`}
          </span>
        </div>
      </div>
      <div className="ft-market-open">
        <div>
          <div className="ft-mo-label">ベース数 N</div>
          <div className="ft-mo-value">{nStart.toLocaleString()}</div>
        </div>
        <div className="ft-mo-arrow">=</div>
        <div>
          <div className="ft-mo-label">仮株価 (ハック前)</div>
          <div className="ft-mo-value price">{yenNum(priceBefore)}円</div>
        </div>
      </div>
      <svg viewBox={`0 0 ${w} ${h}`} className="ft-chart-svg">
        <line x1="0" y1={h - 10} x2={w} y2={h - 10} stroke="var(--ft-grid)" strokeWidth="1" />
        {points.length > 0 && (
          <path d={path} fill="none" stroke="var(--ft-accent)" strokeWidth="2.5" />
        )}
        {points.map((p, i) => {
          const x = points.length > 1 ? i * stepX : w / 2;
          const y = h - (p.price / max) * (h - 20) - 10;
          return <circle key={i} cx={x} cy={y} r="3.5" fill="var(--ft-accent)" />;
        })}
      </svg>
      {priceHistory.length === 0 && (
        <div className="ft-chart-empty">まだ取引履歴がありません — 最初のTERNを開始してください</div>
      )}
      </div>
    </div>
  );
}

function PlayersPanel({ players, orders, phase, currentPrice, revealData }) {
  const rankMap = useMemo(() => {
    const sorted = [...players].sort(
      (a, b) => totalValue(b, currentPrice) - totalValue(a, currentPrice)
    );
    const map = {};
    let rank = 1;
    for (let i = 0; i < sorted.length; i++) {
      if (i > 0) {
        const prev = totalValue(sorted[i - 1], currentPrice);
        const cur = totalValue(sorted[i], currentPrice);
        if (cur < prev) rank = i + 1;
      }
      map[sorted[i].id] = rank;
    }
    return map;
  }, [players, currentPrice]);
  const isReveal = phase === "reveal" && revealData && revealData.execResults;
  const humanHeavyCount = isReveal && revealData.execResults["human"] ? (revealData.execResults["human"].usedHeavy || 0) : 0;
  const humanUsedHeavy = humanHeavyCount > 0;
  const notes = [];
  if (isReveal) {
    // 表示順: 奥義(紫) → 妨害(赤) → 防衛(黄) → 操作(青) → 帳消し
    // --- 0. 奥義 ---
    players.forEach((p) => {
      const ex = revealData.execResults[p.id];
      if (!ex || !ex.avant) return;
      const who = p.name;
      notes.push({
        cls: "note-avant",
        text: who + "が奥義：アバンギャルドを使用しました",
      });
    });
    // --- 1. 妨害 ---
    players.forEach((p) => {
      const ex = revealData.execResults[p.id];
      if (!ex) return;
      const uh = ex.usedHeavy || 0;
      if (uh <= 0) return;
      const who = p.name;
      notes.push({
        cls: "note-heavy",
        text: who + "が妨害を " + uh + " 枚使用しました" + (!p.isAI ? "（相手の株価を妨害）" : ""),
      });
    });
    // --- 2. 防衛 ---
    players.forEach((p) => {
      const ex = revealData.execResults[p.id];
      if (!ex || !ex.defense) return;
      const who = p.name;
      const blocked = ex.blockedHeavy || 0;
      notes.push({
        cls: "note-defense",
        text: who + "が防衛を使用（COIN5枚）" + (blocked > 0 ? " → 被妨害×" + blocked + " を無効化" : ""),
      });
    });
    // --- 3. 操作 ---
    players.forEach((p) => {
      const ex = revealData.execResults[p.id];
      if (!ex) return;
      const oq = ex.ownQuick || 0;
      if (oq <= 0) return;
      const who = p.name;
      if (!p.isAI) {
        const nullified = !!ex.quickNullified;
        notes.push({
          cls: nullified ? "note-heavy" : "note-quick",
          text: who + "が操作を " + oq + " 枚使用" + (nullified ? " → 被妨害により無効化" : "しました"),
        });
        return;
      }
      const action = ex.action || "stay";
      const filled = ex.sharesFilled || 0;
      const priceWith = ex.execPrice;
      const priceWithout = personalExecPrice(revealData.nStart, 0, ex.incomingHeavy || 0, action);
      let assetDelta = 0;
      if (action === "buy" && filled > 0) assetDelta = (priceWithout - priceWith) * filled;
      if (action === "sell" && filled > 0) assetDelta = (priceWith - priceWithout) * filled;
      let deltaText = "";
      if (action === "stay" || filled <= 0) {
        deltaText = "（注文なし／未成立のため総資産への直接影響なし）";
      } else if (assetDelta > 0) {
        deltaText = "（操作により総資産 +" + yen(assetDelta) + "）";
      } else if (assetDelta < 0) {
        deltaText = "（操作により総資産 " + yen(assetDelta) + "）";
      } else {
        deltaText = "（操作による総資産の増減なし）";
      }
      const nullified = !!ex.quickNullified;
      notes.push({
        cls: nullified ? "note-heavy" : "note-quick",
        text: who + "が操作を " + oq + " 枚使用" + (nullified ? " → 被妨害により無効化" : deltaText),
      });
    });
    // --- 4. 帳消し ---
    players.forEach((p) => {
      const ex = revealData.execResults[p.id];
      if (!ex || !ex.bailout) return;
      const n = ex.bailoutCards || 10;
      const who = p.name;
      notes.push({ cls: "note-bailout", text: who + "がCOIN" + n + "枚を消費し、買い注文を帳消ししました" });
    });
  }
  return (
    <div className="ft-panel ft-panel-players">
      <div className="ft-panel-head"><User size={15} /> TRADERS</div>
      <div className="ft-players-body">
      <div className="ft-players-grid">
        {players.map((p) => {
          let glow = "";
          if (isReveal) {
            const ex = revealData.execResults[p.id] || {};
            const oq = ex.ownQuick || 0;
            const uh = ex.usedHeavy || 0;
            const df = !!ex.defense;
            const av = !!ex.avant;
            // 優先: 奥義(紫) > 操作(青) > 防衛(黄) > 被妨害(赤)
            const hit = ex.incomingHeavy || 0;
            if (av) glow = " glow-purple";
            else if (oq > 0) glow = " glow-blue";
            else if (df) glow = " glow-amber";
            else if (hit > 0) glow = " glow-red";
          }
          return (
          <div key={p.id} className={"ft-player-card" + (p.isAI ? " ai" : " human") + glow + (p.isBankrupt ? " bankrupt" : "")}>
            <span className="ft-pc-rank">{rankMap[p.id]}位</span>
            <div className="ft-pc-name">{p.isAI ? <Cpu size={13} /> : <User size={13} />} {p.name}</div>
            <div className="ft-pc-cash">{p.isBankrupt ? "破産" : yen(totalValue(p, currentPrice))}</div>
            <div className="ft-pc-holdings">現金{yen(p.cash)} ／ {p.holdings}株{p.holdings > 0 ? `(@${p.avgPrice.toFixed(1)})` : ""}</div>
            <div className="ft-pc-cards">COIN {p.cards.stock != null ? p.cards.stock : 0}</div>
            {phase !== "market" && phase !== "order" && orders[p.id] && (
              <div className={"ft-pc-order tag-" + orders[p.id].action}>
                {orders[p.id].action === "buy" ? `買い ${orders[p.id].shares}株` : orders[p.id].action === "sell" ? `売り ${orders[p.id].shares}株` : "様子見"}
              </div>
            )}
          </div>
          );
        })}
      </div>
      {notes.length > 0 && (
        <div className="ft-traders-notes">
          {notes.map((n, i) => (<div key={i} className={n.cls}>{n.text}</div>))}
        </div>
      )}
      </div>
    </div>
  );
}

function ActionPanel(props) {
  const [opPreviewExpand, setOpPreviewExpand] = React.useState(false);
  const {
    phase,
    human,
    allHumans,
    priceBefore,
    refPrice,
    nStart,
    humanOrderDraft,
    setHumanOrderDraft,
    humanHackDraft,
    setHumanHackDraft,
    turn,
    totalTurns,
    onGoOrder,
    onConfirmOrders,
    onConfirmHacks,
    onNextTurn,
    revealData,
    revealFocusId,
    setRevealFocusId,
    orders,
    hackChoices,
    players,
    endgameBonusMsg,
    inputHumanIdx,
    humanInputTotal,
    playMode,
    onlineRole,
    iSubmittedOrder,
    iSubmittedHack,
    submittedOrderIds,
    submittedHackIds,
    roomCode,
  } = props;
  const multiHuman = playMode !== "online" && (allHumans || []).length > 1;
  const isLastHumanInput = multiHuman && humanInputTotal > 0 && inputHumanIdx >= humanInputTotal - 1;
  const isOnline = playMode === "online";
  const onlineWaitingOrder = isOnline && iSubmittedOrder && phase === "order";
  const onlineWaitingHack = isOnline && iSubmittedHack && phase === "hack";
  const aliveHumanIds = (players || []).filter((p) => !p.isAI && !p.isBankrupt).map((p) => p.id);
  const orderWaitCount = (submittedOrderIds || []).filter((id) => aliveHumanIds.indexOf(id) >= 0).length;
  const hackWaitCount = (submittedHackIds || []).filter((id) => aliveHumanIds.indexOf(id) >= 0).length;

  if (phase === "market") {
    return (
      <div className="ft-panel ft-action">
        <div className="ft-panel-head">STEP 1 — 市場開示</div>
        <p className="ft-action-desc">
          今TERNのベース数字 <b>{nStart.toLocaleString()}</b> が公開されました。
          仮株価は <b className="ft-highlight">{yenNum(priceBefore)}円</b>（{factorString(nStart)}）。
          基準株価 <b className="ft-highlight">{yenNum(refPrice)}円</b> と比べて
          {priceBefore > refPrice ? "上振れ" : priceBefore < refPrice ? "下振れ" : "同水準"}
          しています。高騰（素数）を狙うか、暴落（2の累乗）に備えるか——判断のときです。
        </p>
        {isOnline && onlineRole === "guest" ? (
          <p className="ft-action-desc" style={{ color: "var(--ft-amber)" }}>ホストが注文フェーズを開始するまでお待ちください…</p>
        ) : (
          <button className="ft-primary-btn" onClick={onGoOrder}>
            注文フェーズへ ▶
          </button>
        )}
        {isOnline && roomCode ? (
          <div style={{ marginTop: 10, fontSize: 11, opacity: 0.6 }}>ONLINE ROOM {roomCode}</div>
        ) : null}
      </div>
    );
  }

  if (phase === "order") {
    const maxBuyShares = priceBefore > 0 ? Math.floor(human.cash / priceBefore) : 0;
    const maxSellShares = human.holdings;
    const endgameLock = isLastFiveTurns(turn, totalTurns);
    // 終盤は様子見を許さない（ドラフトが stay のまま残っていても表示・操作を補正）
    let action = humanOrderDraft.action;
    let shares = humanOrderDraft.shares || 0;
    if (endgameLock && action === "stay") {
      if (maxSellShares > 0) {
        action = "sell";
        shares = minOrderShares("sell", human.holdings, maxBuyShares);
      } else if (maxBuyShares > 0) {
        action = "buy";
        shares = minOrderShares("buy", human.holdings, maxBuyShares);
      }
    }
    if (endgameLock && (action === "buy" || action === "sell")) {
      const cap = action === "buy" ? maxBuyShares : maxSellShares;
      const minS = minOrderShares(action, human.holdings, maxBuyShares);
      if (cap > 0) {
        if (shares < minS) shares = minS;
        if (shares > cap) shares = cap;
      }
    }
    const estCost = shares * priceBefore;
    const unrealizedPnl = human.holdings > 0 ? (priceBefore - human.avgPrice) * human.holdings : 0;
    const minSharesNow = (action === "buy" || action === "sell")
      ? (endgameLock ? minOrderShares(action, human.holdings, maxBuyShares) : 1)
      : 0;

    function setAction(a) {
      if (endgameLock && a === "stay") return;
      const cap = a === "buy" ? maxBuyShares : a === "sell" ? maxSellShares : 0;
      if (a === "stay") {
        setHumanOrderDraft({ action: "stay", shares: 0 });
        return;
      }
      if (cap <= 0) return; // 売り余力・買い余力なし
      const minS = endgameLock ? minOrderShares(a, human.holdings, maxBuyShares) : 1;
      const cur = humanOrderDraft.shares || 0;
      const next = Math.min(cap, Math.max(minS, cur >= minS ? cur : minS));
      setHumanOrderDraft({ action: a, shares: next });
    }
    function setShares(n) {
      const a = action === "stay" ? (maxSellShares > 0 ? "sell" : "buy") : action;
      const cap = a === "buy" ? maxBuyShares : maxSellShares;
      if (cap <= 0) return;
      const minS = endgameLock ? minOrderShares(a, human.holdings, maxBuyShares) : 0;
      const v = Math.max(minS, Math.min(cap, Math.floor(n) || 0));
      setHumanOrderDraft({ action: a, shares: v });
    }

    return (
      <div className="ft-panel ft-action">
        <div className="ft-panel-head">STEP 2 — 投資注文</div>
        <p className="ft-action-desc">
          現仮株価 <b className="ft-highlight">{yenNum(priceBefore)}円</b> を目安に、何株「買う」か「売る」かを決めます。
          実際の株価は、この後の市場ハックで確定する<b>最終株価</b>で行われます。
          {endgameLock && (
            <span style={{ display: "block", marginTop: 8, color: "var(--ft-amber)" }}>
              終盤ルール（ラスト5TERN）: 様子見禁止 / 売りは保有の50%以上・買いは買付余力の50%以上から自由に選択
            </span>
          )}
          {endgameBonusMsg && (
            <span style={{ display: "block", marginTop: 8, color: "var(--ft-green)", fontWeight: 600 }}>
              🎁 {endgameBonusMsg}
            </span>
          )}
        </p>
        <div className="ft-private-box" style={{ marginBottom: 12 }}>
          <div className="ft-private-head">操作した場合の株価</div>
          <div className="ft-private-desc" style={{ lineHeight: 1.7, fontSize: 12 }}>
            <div style={{ opacity: 0.75, marginBottom: 4 }}>仮株価（操作0枚）: <b>{yenNum(priceBefore)}円</b></div>
            {Array.from({ length: opPreviewExpand ? 15 : 5 }, (_, i) => i + 1).map((q) => {
              const px = previewSelfPrice(nStart, q);
              return (
                <div key={q}>
                  操作{q}枚→株価 <b style={{ color: "var(--ft-blue)" }}>{yenNum(px)}円</b>
                  {px !== priceBefore ? (
                    <span style={{ opacity: 0.7, marginLeft: 6 }}>
                      ({px > priceBefore ? "+" : ""}{yenNum(px - priceBefore)}円)
                    </span>
                  ) : null}
                </div>
              );
            })}
            {!opPreviewExpand ? (
              <button
                type="button"
                onClick={() => setOpPreviewExpand(true)}
                style={{
                  marginTop: 6,
                  padding: "2px 8px",
                  fontSize: 11,
                  background: "transparent",
                  border: "none",
                  color: "rgba(255,255,255,0.45)",
                  cursor: "pointer",
                  letterSpacing: "0.04em",
                }}
              >rest ▾</button>
            ) : (
              <button
                type="button"
                onClick={() => setOpPreviewExpand(false)}
                style={{
                  marginTop: 6,
                  padding: "2px 8px",
                  fontSize: 11,
                  background: "transparent",
                  border: "none",
                  color: "rgba(255,255,255,0.45)",
                  cursor: "pointer",
                  letterSpacing: "0.04em",
                }}
              >close ▴</button>
            )}
          </div>
        </div>
        <div className="ft-holdings-box">
          <div>現金: <b>{yen(human.cash)}</b></div>
          <div>保有株: <b>{human.holdings}株</b>{human.holdings > 0 && <> (平均取得単価 {human.avgPrice.toFixed(1)}円)</>}</div>
          {human.holdings > 0 && (
            <div>
              評価損益(仮株価基準): {" "}
              <b className={unrealizedPnl > 0 ? "pnl-up" : unrealizedPnl < 0 ? "pnl-down" : ""}>
                {unrealizedPnl === 0 ? "±0" : unrealizedPnl > 0 ? `+${yen(unrealizedPnl)}` : `-${yen(Math.abs(unrealizedPnl))}`}
              </b>
            </div>
          )}
        </div>
        <div className="ft-order-btns">
          <button
            className={"ft-order-btn long" + (action === "buy" ? " active" : "")}
            onClick={() => setAction("buy")}
            disabled={maxBuyShares <= 0}
          >
            <TrendingUp size={16} /> 買い
          </button>
          <button
            className={"ft-order-btn short" + (action === "sell" ? " active" : "")}
            onClick={() => setAction("sell")}
            disabled={maxSellShares <= 0}
            title={maxSellShares <= 0 ? "保有株がありません" : ""}
          >
            <TrendingDown size={16} /> 売り
          </button>
          <button
            className={"ft-order-btn stay" + (!endgameLock && action === "stay" ? " active" : "")}
            onClick={() => setAction("stay")}
            disabled={endgameLock}
            title={endgameLock ? "ラスト5TERNは様子見禁止" : ""}
          >
            <Minus size={16} /> 様子見{endgameLock ? "（終盤禁止）" : ""}
          </button>
        </div>
        {action !== "stay" && (
          <div className="ft-pct-block">
            <div className="ft-label">
              {action === "buy" ? "購入株数" : "売却株数"}: {shares}株
              <span className="ft-factor-note">
                {" "}( {endgameLock ? `最低 ${minSharesNow}〜` : ""}最大 {action === "buy" ? maxBuyShares : maxSellShares}株)
              </span>
            </div>
            <input
              type="range"
              min={minSharesNow}
              max={action === "buy" ? maxBuyShares : maxSellShares}
              step="1"
              value={shares}
              onChange={(e) => setShares(parseInt(e.target.value, 10))}
            />
            <input
              type="number"
              className="ft-shares-input"
              min={minSharesNow}
              max={action === "buy" ? maxBuyShares : maxSellShares}
              value={shares}
              onChange={(e) => setShares(parseInt(e.target.value, 10))}
            />
            {action === "buy" && <div className="ft-pct-amount">概算コスト: {yen(estCost)}</div>}
            {action === "sell" && <div className="ft-pct-amount">概算受取: {yen(estCost)}</div>}
          </div>
        )}
        {multiHuman ? (
          <div style={{ fontSize: 12, marginBottom: 10, color: "var(--ft-amber)" }}>
            {human.name} の注文（{inputHumanIdx + 1}/{humanInputTotal}）

          <div style={{ fontSize: 12, marginBottom: 10, color: "var(--ft-amber)" }}>
            提出状況 {orderWaitCount}/{aliveHumanIds.length}

              : isOnline
              ? "注文を提出 ▶"
              : "注文を確定 ▶"}
          </button>
        )}
      </div>
    );
  }

  if (phase === "hack") {
    return (
      <div className="ft-panel ft-action">
        <div className="ft-panel-head">STEP 3 — 市場ハック（裏向き）</div>
        <p className="ft-action-desc">生涯COINを投入しますか？ 使えばもう戻りません。</p>
        <div className="ft-hack-controls">
          <div className="ft-hack-row" style={{ marginBottom: 8, opacity: 0.85, fontSize: 12 }}>
            COIN 残り <b>{human.cards.stock != null ? human.cards.stock : 0}</b> 枚
            （使用: {(humanHackDraft.quick || 0) + ((humanHackDraft.heavy || 0) > 0 ? 5 : 0) + (humanHackDraft.defense ? 5 : 0) + (humanHackDraft.avant ? 10 : 0)} 枚）
          </div>
          {!isLastFiveTurns(turn, totalTurns) && (human.cards.stock != null ? human.cards.stock : 0) <= 5 ? (
            <div className="ft-hack-row" style={{ marginBottom: 10, flexDirection: "column", alignItems: "stretch", gap: 8, border: "1px solid rgba(57,255,156,0.35)", borderRadius: 4, padding: 10 }}>
              <div style={{ fontSize: 12, color: "var(--ft-accent)", fontWeight: 600 }}>COIN補充（ラスト5TERNは不可）</div>
              <div style={{ fontSize: 11, opacity: 0.8 }}>
                総資産目安 <b>{Math.floor(totalValue(human, priceBefore)).toLocaleString()}円</b>
                （仮株価 {yenNum(priceBefore)}円）
              </div>
              {(human.cards.stock != null ? human.cards.stock : 0) <= 5 ? (
                <button
                  type="button"
                  onClick={() => setHumanHackDraft((d) => ({ ...d, coinRescue: d.coinRescue === "half5" ? "" : "half5" }))}
                  style={{
                    display: "flex",
                    alignItems: "center",
                    gap: 10,
                    textAlign: "left",
                    padding: "8px 10px",
                    borderRadius: 4,
                    cursor: "pointer",
                    border: humanHackDraft.coinRescue === "half5" ? "1px solid rgba(51,209,255,0.85)" : "1px solid rgba(255,255,255,0.25)",
                    background: humanHackDraft.coinRescue === "half5" ? "rgba(51,209,255,0.18)" : "rgba(255,255,255,0.04)",
                    color: humanHackDraft.coinRescue === "half5" ? "#9ae6ff" : "var(--ft-text)",
                    boxShadow: humanHackDraft.coinRescue === "half5" ? "0 0 10px rgba(51,209,255,0.35)" : "none",
                  }}
                >
                  <span style={{
                    width: 14, height: 14, borderRadius: "50%", flexShrink: 0,
                    border: humanHackDraft.coinRescue === "half5" ? "2px solid #33d1ff" : "2px solid rgba(255,255,255,0.55)",
                    background: humanHackDraft.coinRescue === "half5" ? "#33d1ff" : "transparent",
                    boxShadow: humanHackDraft.coinRescue === "half5" ? "0 0 8px rgba(51,209,255,0.8)" : "none",
                  }} />
                  <span style={{ fontSize: 12, lineHeight: 1.55 }}>
                    総資産50%→COIN5枚
                    <br />
                    <span style={{ opacity: 0.75 }}>（残資産 {Math.floor(totalValue(human, priceBefore) * 0.5).toLocaleString()}円）</span>
                  </span>
                </button>
              ) : null}
              {(human.cards.stock != null ? human.cards.stock : 0) === 0 ? (
                <button
                  type="button"
                  onClick={() => setHumanHackDraft((d) => ({ ...d, coinRescue: d.coinRescue === "zero10" ? "" : "zero10" }))}
                  style={{
                    display: "flex",
                    alignItems: "center",
                    gap: 10,
                    textAlign: "left",
                    padding: "8px 10px",
                    borderRadius: 4,
                    cursor: "pointer",
                    border: humanHackDraft.coinRescue === "zero10" ? "1px solid rgba(51,209,255,0.85)" : "1px solid rgba(255,255,255,0.25)",
                    background: humanHackDraft.coinRescue === "zero10" ? "rgba(51,209,255,0.18)" : "rgba(255,255,255,0.04)",
                    color: humanHackDraft.coinRescue === "zero10" ? "#9ae6ff" : "var(--ft-text)",
                    boxShadow: humanHackDraft.coinRescue === "zero10" ? "0 0 10px rgba(51,209,255,0.35)" : "none",
                  }}
                >
                  <span style={{
                    width: 14, height: 14, borderRadius: "50%", flexShrink: 0,
                    border: humanHackDraft.coinRescue === "zero10" ? "2px solid #33d1ff" : "2px solid rgba(255,255,255,0.55)",
                    background: humanHackDraft.coinRescue === "zero10" ? "#33d1ff" : "transparent",
                    boxShadow: humanHackDraft.coinRescue === "zero10" ? "0 0 8px rgba(51,209,255,0.8)" : "none",
                  }} />
                  <span style={{ fontSize: 12, lineHeight: 1.55 }}>
                    総資産75%→COIN10枚
                    <br />
                    <span style={{ opacity: 0.75 }}>（残資産 {Math.floor(totalValue(human, priceBefore) * 0.25).toLocaleString()}円）</span>
                  </span>
                </button>
              ) : null}
            </div>
          ) : null}
          <div className="ft-hack-row">
            <div className="ft-hack-label">
              <Zap size={16} className="icon-quick" /> 操作
              <span style={{fontSize:"11px", opacity:0.7, marginLeft:8}}>自分の株価だけを操作</span>
            </div>
            <div className="ft-hack-stepper">
              <button
                disabled={humanHackDraft.quick <= 0}
                onClick={() => setHumanHackDraft((d) => ({ ...d, quick: Math.max(0, d.quick - 1) }))}
              >−</button>
              <span>{humanHackDraft.quick}</span>
              <button
                disabled={(humanHackDraft.quick || 0) + ((humanHackDraft.heavy || 0) > 0 ? 5 : 0) + (humanHackDraft.defense ? 5 : 0) >= (human.cards.stock || 0)}
                onClick={() =>
                  setHumanHackDraft((d) => {
                    if (d.avant) return d;
                    const stock = human.cards.stock || 0;
                    const next = (d.quick || 0) + 1;
                    if (next + ((d.heavy || 0) > 0 ? 5 : 0) + (d.defense ? 5 : 0) + (d.avant ? 10 : 0) > stock) return d;
                    return { ...d, quick: next };
                  })
                }
              >+</button>
            </div>
          </div>
          <div className="ft-hack-row">
            <div className="ft-hack-label">
              <Bomb size={16} className="icon-heavy" /> 妨害
              <span style={{fontSize:"11px", opacity:0.7, marginLeft:8}}>
                {turn <= 3
                  ? "最初の3TERNは使用不可"
                  : "自分以外の株価を妨害（N+1）"}
              </span>
            </div>
            <div className="ft-hack-stepper">
              <button
                type="button"
                className={"ft-defense-toggle" + (humanHackDraft.heavy ? " is-on" : "")}
                disabled={turn <= 3 || (!humanHackDraft.heavy && (humanHackDraft.quick || 0) + 5 + (humanHackDraft.defense ? 5 : 0) > (human.cards.stock || 0))}
                onClick={() =>
                  setHumanHackDraft((d) => {
                    if (turn <= 3) return d;
                    if (d.heavy) return { ...d, heavy: 0 };
                    const stock = human.cards.stock || 0;
                    if ((d.quick || 0) + 5 + (d.defense ? 5 : 0) > stock) return d;
                    return { ...d, heavy: 1 };
                  })
                }
              >{turn <= 3 ? "不可" : (humanHackDraft.heavy ? "ON" : "OFF")}</button>
            </div>
          </div>
          <div className="ft-hack-row">
            <div className="ft-hack-label">
              <Shield size={16} className="icon-defense" /> 防衛
              <span style={{fontSize:"11px", opacity:0.7, marginLeft:8}}>
                {turn <= 3 ? "最初の3TERNは使用不可" : "相手からの妨害を無効化"}
              </span>
            </div>
            <div className="ft-hack-stepper">
              <button
                type="button"
                className={"ft-defense-toggle" + (humanHackDraft.defense ? " is-on" : "")}
                disabled={turn <= 3 || (!humanHackDraft.defense && (humanHackDraft.quick || 0) + ((humanHackDraft.heavy || 0) > 0 ? 5 : 0) + 5 > (human.cards.stock || 0))}
                onClick={() =>
                  setHumanHackDraft((d) => {
                    if (turn <= 3) return d;
                    if (d.defense) return { ...d, defense: 0 };
                    const stock = human.cards.stock || 0;
                    if ((d.quick || 0) + ((d.heavy || 0) > 0 ? 5 : 0) + 5 > stock) return d;
                    return { ...d, defense: 1 };
                  })
                }
              >{turn <= 3 ? "不可" : (humanHackDraft.defense ? "ON" : "OFF")}</button>
            </div>
          </div>
          <div className={"ft-hack-row is-avant" + (humanHackDraft.avant ? " is-on" : "")}>
            <div className="ft-hack-label">
              <Heptagram size={16} className="icon-avant" style={{marginRight:4}} />
              <span style={{color:"var(--ft-purple)", fontWeight:600}}>奥義：アバンギャルド</span>
              {human.avantUsed ? (
                <span style={{fontSize:"11px", opacity:0.7, marginLeft:8, color:"var(--ft-purple)"}}>使用済み</span>
              ) : null}
            </div>
            <div className="ft-hack-stepper" style={{display:"flex", alignItems:"center", gap:8}}>
              {!!humanHackDraft.avant && (
                <input
                  type="number"
                  className="ft-avant-price-input"
                  min={1}
                  max={99999}
                  value={humanHackDraft.avantPrice || 1000}
                  onChange={(e) => {
                    let v = parseInt(e.target.value, 10);
                    if (isNaN(v)) v = 1;
                    v = Math.max(1, Math.min(99999, v));
                    setHumanHackDraft((d) => ({ ...d, avantPrice: v }));
                  }}
                />
              )}
              <button
                type="button"
                className={"ft-defense-toggle" + (humanHackDraft.avant ? " is-avant-on" : "")}
                disabled={!!human.avantUsed || (!humanHackDraft.avant && (human.cards.stock || 0) < 10)}
                onClick={() =>
                  setHumanHackDraft((d) => {
                    if (human.avantUsed) return d;
                    if (d.avant) return { ...d, avant: 0, quick: d.quick };
                    if ((human.cards.stock || 0) < 10) return d;
                    // 選択時は操作をクリア
                    return { ...d, avant: 1, quick: 0, heavy: 0, defense: 0, avantPrice: d.avantPrice || 1000 };
                  })
                }
              >{human.avantUsed ? "済" : (humanHackDraft.avant ? "ON" : "OFF")}</button>
            </div>
          </div>
        </div>
        {((humanHackDraft.quick > 0 || humanHackDraft.heavy > 0 || !!humanHackDraft.defense || !!humanHackDraft.avant)) ? (() => {
          const order = humanOrderDraft || { action: "stay" };
          const act = order.action === "stay" ? "buy" : order.action;
          const selfPrice = personalExecPrice(nStart, humanHackDraft.quick, 0, act);
          const baseP = personalExecPrice(nStart, 0, 0, act);
          const buy0 = personalExecPrice(nStart, 0, 0, "buy");
          const buy1 = personalExecPrice(nStart, 0, 1, "buy");
          const sell0 = personalExecPrice(nStart, 0, 0, "sell");
          const sell1 = personalExecPrice(nStart, 0, 1, "sell");
          return (
            <div className="ft-private-box">
              <div className="ft-private-head">📊 効果</div>
              <p className="ft-private-desc" style={{ lineHeight: 1.85 }}>
                {humanHackDraft.avant ? (() => {
                  const ap = Math.max(1, Math.min(99999, Math.floor(Number(humanHackDraft.avantPrice) || 1)));
                  const ord = humanOrderDraft || { action: "stay", shares: 0 };
                  const sh = Math.max(0, Math.floor(ord.shares || 0));
                  const cash0 = human.cash || 0;
                  const hold0 = human.holdings || 0;
                  const tv0 = cash0 + hold0 * (priceBefore || 0);
                  let cash1 = cash0;
                  let hold1 = hold0;
                  let tradeNote = "注文なし（様子見）";
                  if (ord.action === "buy" && sh > 0) {
                    const cost = sh * ap;
                    cash1 = cash0 - cost;
                    hold1 = hold0 + sh;
                    tradeNote = `買い ${sh}株 × ${ap}円 = ${cost.toLocaleString()}円`;
                  } else if (ord.action === "sell" && sh > 0) {
                    const got = sh * ap;
                    cash1 = cash0 + got;
                    hold1 = hold0 - sh;
                    tradeNote = `売り ${sh}株 × ${ap}円 = ${got.toLocaleString()}円`;
                  }
                  const tv1 = cash1 + hold1 * ap;
                  const dTv = tv1 - tv0;
                  const dSign = dTv > 0 ? "+" : "";
                  return (
                    <span style={{ display: "block" }}>
                      <b style={{ color: "var(--ft-purple)" }}>奥義：アバンギャルド</b>
                      <span style={{ opacity: 0.85 }}>（COIN10枚・一度限り／自分の株価のみ／被妨害無効）</span>
                      <br />
                      指定する自分の株価 <b style={{ color: "var(--ft-purple)" }}>{ap.toLocaleString()}円</b>
                      <br />
                      {tradeNote}
                      <br />
                      保有株 <b>{hold0}株 → {hold1}株</b>
                      <br />
                      現金 <b>{cash0.toLocaleString()}円 → {cash1.toLocaleString()}円</b>
                      <br />
                      総資産（評価） <b>{tv0.toLocaleString()}円 → {tv1.toLocaleString()}円</b>
                      <span style={{ color: dTv >= 0 ? "var(--ft-accent)" : "var(--ft-red)", marginLeft: 6 }}>
                        ({dSign}{dTv.toLocaleString()}円)
                      </span>
                      <br />
                      <span style={{ opacity: 0.75, fontSize: 12 }}>※他プレイヤーと奥義が重複した場合、総資産が少ない側が優先（多い側はCOIN返却）</span>
                    </span>
                  );
                })() : null}
                {!humanHackDraft.avant && humanHackDraft.quick > 0 ? (
                  <span style={{ display: "block", marginBottom: 8 }}>
                    <b style={{ color: "var(--ft-blue)" }}>操作</b>：自分の株価を操作<br />
                    あなたの株価目安 <b>{yenNum(selfPrice)}円</b>
                    {baseP !== selfPrice ? `（操作前 ${yenNum(baseP)}円）` : ""}
                    <br />
                    自分のみ作用。
                  </span>
                ) : null}
                {!humanHackDraft.avant && humanHackDraft.heavy > 0 ? (
                  <span style={{ display: "block", marginBottom: 8 }}>
                    <b style={{ color: "var(--ft-red)" }}>妨害</b>：自分以外の株価を妨害（N+1）<br />
                    自分には無効、他プレイヤーと重複する可能性あり<br />
                    買い：<b>{yenNum(buy0)}円→{yenNum(personalExecPrice(nStart, 0, humanHackDraft.heavy, "buy"))}円</b>
                    <br />
                    売り：<b>{yenNum(sell0)}円→{yenNum(personalExecPrice(nStart, 0, humanHackDraft.heavy, "sell"))}円</b>
                  </span>
                ) : null}
                {!humanHackDraft.avant && humanHackDraft.defense ? (
                  <span style={{ display: "block" }}>
                    <b style={{ color: "var(--ft-amber)" }}>防衛</b>：相手からの妨害を無効化<br />
                    COIN5枚
                  </span>
                ) : null}
              </p>
            </div>
          );
        })() : null}
        {multiHuman ? (
          <div style={{ fontSize: 12, marginBottom: 10, color: "var(--ft-amber)" }}>
            {human.name} のCOIN（{inputHumanIdx + 1}/{humanInputTotal}）
          </div>
        ) : null}
        {isOnline ? (
          <div style={{ fontSize: 12, marginBottom: 10, color: "var(--ft-amber)" }}>
            提出状況 {hackWaitCount}/{aliveHumanIds.length}
            {onlineWaitingHack ? " — 他のプレイヤーを待っています…" : ""}
          </div>
        ) : null}
        {onlineWaitingHack ? (
          <div className="ft-primary-btn danger" style={{ opacity: 0.5, pointerEvents: "none", textAlign: "center" }}>
            提出済み（待機中）
          </div>
        ) : (
          <button className="ft-primary-btn danger" onClick={onConfirmHacks}>
            {multiHuman && !isLastHumanInput
              ? human.name + " のCOINを確定 → 次のプレイヤーへ ▶"
              : isOnline
              ? "COINを提出 ▶"
              : "COINをセットして開示 ▶"}
          </button>
        )}
      </div>
    );
  }

  if (phase === "reveal" && revealData) {
    const per = revealData.perHuman || {};
    const focusId = revealFocusId || (human && human.id) || revealData.focusId;
    const focused = (focusId && per[focusId]) || null;
    const view = focused || {
      humanOrder: revealData.humanOrder,
      humanExec: revealData.humanExec,
      nFinal: revealData.nFinal,
      priceFinal: revealData.priceFinal,
      humanCashBefore: revealData.humanCashBefore,
      humanCashAfter: revealData.humanCashAfter,
      humanHoldingsBefore: revealData.humanHoldingsBefore,
      humanHoldingsAfter: revealData.humanHoldingsAfter,
      humanAvgPriceAfter: revealData.humanAvgPriceAfter,
      humanValueBefore: revealData.humanValueBefore,
      humanValueAfter: revealData.humanValueAfter,
      humanDiff: revealData.humanDiff,
      humanBankrupt: revealData.humanBankrupt,
      name: human ? human.name : "YOU",
    };
    const hex = view.humanExec || {};
    const myQuick = hex.ownQuick || 0;
    const hitHeavy = hex.incomingHeavy || 0;
    const myDefense = !!hex.defense;
    const blockedHeavy = hex.blockedHeavy || 0;
    const usedHeavy = hex.usedHeavy || 0;
    const humanNamesList = Object.values(per);
    return (
      <div className="ft-panel ft-action">
        <div className="ft-panel-head">STEP 4 — 清算結果{view.name ? "（" + view.name + "）" : ""}</div>
        {humanNamesList.length > 1 ? (
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 12 }}>
            {humanNamesList.map((h) => (
              <button
                key={h.id}
                type="button"
                onClick={() => setRevealFocusId && setRevealFocusId(h.id)}
                style={{
                  padding: "6px 10px",
                  fontSize: 11,
                  borderRadius: 3,
                  cursor: "pointer",
                  border: (focusId === h.id) ? "1px solid var(--ft-accent)" : "1px solid var(--ft-border)",
                  background: (focusId === h.id) ? "rgba(57,255,156,0.12)" : "var(--ft-panel-alt)",
                  color: (focusId === h.id) ? "var(--ft-accent)" : "var(--ft-text-dim)",
                }}
              >
                {h.name}{h.humanBankrupt ? "（破産）" : ""}
              </button>
            ))}
          </div>
        ) : null}

        {view.humanBankrupt && (
          <div className="ft-bankrupt-banner">
            <div className="ft-bankrupt-title">破産</div>
            <div className="ft-bankrupt-desc">
              買付代金を支払えず破産しました（COIN10枚未満で帳消し不可）。以降のプレイはできません。
              残りTERNはCPUが自動進行し、最終結果を表示します。
            </div>
          </div>
        )}
        {!view.humanBankrupt && view.humanExec && view.humanExec.bailout && (
          <div className="ft-bailout-banner">
            <div className="ft-bailout-title">帳消し</div>
            <div className="ft-bailout-desc">
              COINを{view.humanExec.bailoutCards || 10}枚消費し、このTERNの買い注文をキャンセルして破産を回避しました。
            </div>
          </div>
        )}

        <div className="ft-card-banner">
          <div className="ft-card-banner-title">このTERNのCOIN</div>
          <div className="ft-card-banner-body">
            {myQuick > 0 && (
              <span className={"ft-card-banner-chip " + (hitHeavy > 0 ? "heavy" : "quick")}>
                {hitHeavy > 0
                  ? `⚡ 操作 ×${myQuick} → 被妨害で無効`
                  : `⚡ あなたの操作 ×${myQuick}`}
              </span>
            )}
            {hitHeavy > 0 && (
              <span className="ft-card-banner-chip heavy">
                💥 他者からの妨害 ×{hitHeavy}
              </span>
            )}
            {myDefense ? (
              <span className="ft-card-banner-chip defense">
                🛡 防衛{blockedHeavy > 0 ? `（妨害×${blockedHeavy}を無効化）` : "（妨害なし）"}
              </span>
            ) : hitHeavy <= 0 ? (
              <span className="ft-card-banner-chip none-hit">
                誰にも妨害されなかった
              </span>
            ) : null}
          </div>
          <div className="ft-card-banner-note">
            仮株価 {yenNum(revealData.priceBefore)}円 → 最終株価 <b>{yenNum(view.priceFinal)}円</b>
            {view.priceFinal > revealData.priceBefore
              ? `（+${view.priceFinal - revealData.priceBefore}円）`
              : view.priceFinal < revealData.priceBefore
              ? `（${view.priceFinal - revealData.priceBefore}円）`
              : ""}
          </div>
        </div>

        <div className="ft-reveal-box">
          <div className="ft-reveal-row">
            <span>N_start</span>
            <b>{revealData.nStart.toLocaleString()}</b>
          </div>
          {myQuick > 0 && (
            <div className="ft-reveal-row quick">
              <span>⚡ あなたの操作</span>
              <b>+{myQuick}</b>
            </div>
          )}
          {hitHeavy > 0 && (
            <div className="ft-reveal-row heavy">
              <span>💥 他者からの妨害</span>
              <b>+{hitHeavy}</b>
            </div>
          )}
          <div className="ft-reveal-row final">
            <span>あなたの N</span>
            <b>{view.nFinal.toLocaleString()}</b>
          </div>
          <div className="ft-reveal-row price">
            <span>あなたの株価</span>
            <b>{yenNum(view.priceFinal)}円</b>
            <span className="ft-factor-note">{factorString(view.nFinal)}</span>
          </div>
        </div>

        <div className="ft-panel-head" style={{ marginTop: 4 }}>あなたの株価結果</div>
        <div className="ft-reveal-box">
          <div className="ft-reveal-row">
            <span>注文</span>
            <b>
              {view.humanOrder.action === "buy"
                ? "買い"
                : view.humanOrder.action === "sell"
                ? "売り"
                : "様子見"}
              {view.humanOrder.action !== "stay" && ` ${view.humanOrder.shares}株`}
            </b>
          </div>
          {view.humanOrder.action !== "stay" && (
            <div className="ft-reveal-row">
              <span>株価株数 @ 最終株価</span>
              <b>
                {view.humanExec.sharesFilled}株 @ {yenNum(view.priceFinal)}円
                {view.humanExec.note && <span className="ft-factor-note"> {view.humanExec.note}</span>}
              </b>
            </div>
          )}
          <div className="ft-reveal-row">
            <span>現金</span>
            <b>{yen(view.humanCashBefore)} → {yen(view.humanCashAfter)}</b>
          </div>
          <div className="ft-reveal-row">
            <span>保有株</span>
            <b>
              {view.humanHoldingsBefore}株 → {view.humanHoldingsAfter}株
              {view.humanHoldingsAfter > 0 && ` (平均${view.humanAvgPriceAfter.toFixed(1)}円)`}
            </b>
          </div>
          <div className="ft-reveal-row">
            <span>総資産</span>
            <b>{yen(view.humanValueBefore)} → {yen(view.humanValueAfter)}</b>
          </div>
          <div className="ft-reveal-row final">
            <span>総資産の変動</span>
            <b className={view.humanDiff > 0 ? "pnl-up" : view.humanDiff < 0 ? "pnl-down" : ""}>
              {view.humanDiff === 0
                ? "±0"
                : view.humanDiff > 0
                ? `+${yen(view.humanDiff)}`
                : `-${yen(Math.abs(view.humanDiff))}`}
            </b>
          </div>
        </div>

        {isOnline && onlineRole === "guest" ? (
          <p className="ft-action-desc" style={{ color: "var(--ft-amber)" }}>ホストが次のTERNへ進めるまでお待ちください…</p>
        ) : (
          <button className="ft-primary-btn" onClick={onNextTurn}>
            {view.humanBankrupt || (players || []).filter((p) => p.isAI).every((p) => p.isBankrupt)
              ? "最終結果を見る ▶"
              : "次のTERNへ ▶"}
          </button>
        )}
      </div>
    );
  }

  return null;
}

function LogPanel({ log, logEndRef }) {
  return (
    <div className="ft-panel ft-logpanel">
      <div className="ft-panel-head">TRANSACTION LOG</div>
      <div className="ft-log-scroll">
        {log.map((l, i) => (
          <div key={i} className="ft-log-line">
            {l}
          </div>
        ))}
        <div ref={logEndRef} />
      </div>
    </div>
  );
}

function GameOverScreen({ ranked, currentPrice, onRestart }) {
  return (
    <div className="ft-setup">
      <div className="ft-setup-card">
        <div className="ft-eyebrow">MARKET CLOSED</div>
        <h1 className="ft-title">FINAL SETTLEMENT</h1>
        <div className="ft-ranking">
          {ranked.map((p, i) => (
            <div key={p.id} className={"ft-rank-row" + (i === 0 ? " first" : "")}>
              <span className="ft-rank-pos">#{i + 1}</span>
              <span className="ft-rank-name">
                {p.isAI ? <Cpu size={13} /> : <User size={13} />} {p.name}
              </span>
              <span className="ft-rank-cash">{p.isBankrupt ? "破産" : yen(totalValue(p, currentPrice))}</span>
            </div>
          ))}
        </div>
        <button className="ft-start-btn" onClick={onRestart}>
          もう一度市場に挑む ▶
        </button>
      </div>
    </div>
  );
}

:root {
  --ft-bg: #05070a;
  --ft-panel: #0b1017;
  --ft-panel-alt: #0f1620;
  --ft-border: #1c2a35;
  --ft-grid: #16222b;
  --ft-accent: #39ff9c;
  --ft-accent-dim: #1e8a5c;
  --ft-blue: #33d1ff;
  --ft-red: #ff4d6d;
  --ft-amber: #ffb648;
  --ft-purple: #c084fc;
  --ft-text: #d7ede2;
  --ft-text-dim: #6d8a86;
  --ft-font-display: 'Courier New', ui-monospace, SFMono-Regular, monospace;
  --ft-font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
.ft-root {
  background: radial-gradient(ellipse at top, #0a1420 0%, var(--ft-bg) 60%);
  color: var(--ft-text);
  font-family: var(--ft-font-body);
  min-height: 100%;

.ft-order-btns { display: flex; gap: 8px; margin-bottom: 14px; }

  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
  background: var(--ft-panel-alt); border: 1px solid var(--ft-border); color: var(--ft-text-dim);
  padding: 12px 4px; border-radius: 3px; cursor: pointer; font-size: 12px; transition: all .15s;
}
.ft-order-btn.long.active { border-color: var(--ft-accent); color: var(--ft-accent); background: rgba(57,255,156,0.08); }
.ft-order-btn.short.active { border-color: var(--ft-red); color: var(--ft-red); background: rgba(255,77,109,0.08); }
.ft-order-btn.stay.active { border-color: var(--ft-text-dim); color: var(--ft-text); background: rgba(255,255,255,0.06); }
.ft-pct-block { margin-bottom: 16px; }
.ft-pct-block input[type=range] { width: 100%; accent-color: var(--ft-accent); margin: 6px 0; }
.ft-pct-amount { font-family: var(--ft-font-display); color: var(--ft-accent); font-size: 14px; }
.ft-shares-input {
  width: 100%;
  background: var(--ft-panel-alt);
  border: 1px solid var(--ft-border);
  color: var(--ft-text);
  padding: 8px 10px;
  border-radius: 3px;
  font-family: var(--ft-font-display);
  font-size: 14px;
  margin-bottom: 8px;
}
.ft-holdings-box {
  background: var(--ft-panel-alt);
  border: 1px solid var(--ft-border);
  border-radius: 3px;
  padding: 10px 12px;
  margin-bottom: 14px;
  font-size: 12px;
  color: var(--ft-text-dim);
  line-height: 1.8;
}
.ft-holdings-box b { color: var(--ft-text); }
.ft-tb-sub2 { font-size: 13px !important; color: var(--ft-text-dim) !important; }

.ft-hack-controls { margin-bottom: 16px; display: flex; flex-direction: column; gap: 12px; }
.ft-hack-row { display: flex; align-items: center; justify-content: space-between; background: var(--ft-panel-alt); border: 1px solid var(--ft-border); border-radius: 3px; padding: 10px 12px; }
.ft-hack-label { display: flex; align-items: center; gap: 6px; font-size: 12px; }
.ft-hack-stepper { display: flex; align-items: center; gap: 10px; }
.ft-hack-stepper button {
  width: 26px; height: 26px; border-radius: 3px; border: 1px solid var(--ft-border);
  background: var(--ft-panel); color: var(--ft-text); cursor: pointer; font-size: 14px;
}
.ft-hack-stepper button:disabled { opacity: .3; cursor: not-allowed; }
.ft-heavy-toggle {
  background: var(--ft-panel); border: 1px solid var(--ft-border); color: var(--ft-text-dim);
  padding: 6px 12px; border-radius: 3px; cursor: pointer; font-size: 12px;
}
.ft-heavy-toggle.active { border-color: var(--ft-red); color: var(--ft-red); background: rgba(255,77,109,0.1); }
.ft-heavy-toggle:disabled { opacity: .3; cursor: not-allowed; }

.ft-card-banner {
  background: linear-gradient(135deg, rgba(57,255,156,0.12) 0%, rgba(51,209,255,0.08) 100%);
  border: 2px solid var(--ft-accent);
  border-radius: 4px;
  padding: 16px 14px;
  margin-bottom: 14px;
  text-align: center;
  box-shadow: 0 0 24px rgba(57,255,156,0.15);
}
.ft-card-banner.cancelled {
  background: linear-gradient(135deg, rgba(255,182,72,0.12) 0%, rgba(255,77,109,0.08) 100%);
  border-color: var(--ft-amber);
  box-shadow: 0 0 24px rgba(255,182,72,0.15);
}
.ft-card-banner.none {
  background: var(--ft-panel-alt);
  border: 1px dashed var(--ft-border);
  box-shadow: none;
}
.ft-card-banner-title {
  font-family: var(--ft-font-display);
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 1px;
  color: var(--ft-accent);
  margin-bottom: 10px;
  line-height: 1.3;
}
.ft-card-banner.cancelled .ft-card-banner-title { color: var(--ft-amber); }
.ft-card-banner.none .ft-card-banner-title {
  font-size: 14px;
  color: var(--ft-text-dim);
  margin-bottom: 4px;
}
.ft-card-banner-body {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-bottom: 10px;
}
.ft-card-banner-chip {
  display: inline-flex;
  align-items: center;
  font-family: var(--ft-font-display);
  font-size: 16px;
  font-weight: 700;
  padding: 8px 14px;
  border-radius: 4px;
  letter-spacing: 0.5px;
}
.ft-card-banner-chip.quick {
  color: var(--ft-blue);
  background: rgba(51,209,255,0.15);
  border: 1px solid rgba(51,209,255,0.45);
}
.ft-card-banner-chip.heavy {
  color: var(--ft-red);
  background: rgba(255,77,109,0.15);
  border: 1px solid rgba(255,77,109,0.45);
}
.ft-card-banner-chip.defense {
  color: var(--ft-amber);
  background: rgba(255,182,72,0.15);
  border: 1px solid rgba(255,182,72,0.45);
}
.ft-card-banner-chip.none-hit {
  color: var(--ft-text-dim);
  background: rgba(109,138,134,0.12);
  border: 1px solid rgba(109,138,134,0.35);
}
.ft-card-banner-note {
  font-size: 12px;
  color: var(--ft-text-dim);
  line-height: 1.7;
}
.ft-card-banner-note b { color: var(--ft-accent); font-size: 14px; }

.ft-reveal-box { background: var(--ft-panel-alt); border: 1px solid var(--ft-border); border-radius: 3px; padding: 12px; margin-bottom: 16px; }
.ft-reveal-row { display: flex; align-items: center; gap: 8px; justify-content: space-between; font-family: var(--ft-font-display); font-size: 13px; padding: 5px 0; border-bottom: 1px dashed var(--ft-border); }
.ft-reveal-row:last-child { border-bottom: none; }
.ft-reveal-row.quick b { color: var(--ft-blue); }
.ft-reveal-row.heavy b { color: var(--ft-red); }
.ft-reveal-row.final b { color: var(--ft-text); }
.ft-reveal-row.price b { color: var(--ft-accent); font-size: 16px; }
.pnl-up { color: var(--ft-accent) !important; }
.pnl-down { color: var(--ft-red) !important; }
.ft-factor-note { font-size: 10px; color: var(--ft-text-dim); margin-left: auto; }

.ft-logpanel { flex: 1; min-height: 200px; }
.ft-log-scroll { max-height: 280px; overflow-y: auto; font-family: var(--ft-font-display); font-size: 11px; color: var(--ft-text-dim); line-height: 1.8; }
.ft-log-line { white-space: pre-wrap; }

.ft-ranking { margin: 20px 0 28px; }
.ft-rank-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--ft-border); font-family: var(--ft-font-display); font-size: 13px; }
.ft-rank-row.first { color: var(--ft-accent); font-weight: 700; }
.ft-rank-pos { width: 30px; color: var(--ft-text-dim); }
.ft-rank-name { flex: 1; display: flex; align-items: center; gap: 6px; }

.icon-defense { color: var(--ft-amber); }
.ft-card-type.op { border-color: rgba(51,209,255,0.45); }
.ft-card-type.op .ft-card-type-title { color: var(--ft-blue); }
.ft-card-type.sab { border-color: rgba(255,77,109,0.45); }
.ft-card-type.sab .ft-card-type-title { color: var(--ft-red); }
.ft-card-type.def { border-color: rgba(255,182,72,0.45); }
.ft-card-type.def .ft-card-type-title { color: var(--ft-amber); }
.note-quick { color: var(--ft-blue); }
.note-heavy { color: var(--ft-red); }
.note-defense { color: var(--ft-amber); }
.ft-traders-notes .note-quick { color: var(--ft-blue); }
.ft-traders-notes .note-heavy { color: var(--ft-red); }
.ft-traders-notes .note-defense { color: var(--ft-amber); }
.ft-traders-notes .note-avant { color: var(--ft-purple); }
.note-avant { color: var(--ft-purple); }
.ft-hack-stepper button.is-on {
  background: rgba(255,182,72,0.18);
  border-color: rgba(255,182,72,0.55);
  color: #ffd48a;
}
.ft-defense-toggle {
  width: auto !important;
  min-width: 52px;
  height: 28px !important;
  padding: 0 12px;
  font-size: 12px !important;
  letter-spacing: 0.06em;
  flex-shrink: 0;
}
.ft-defense-toggle.is-on {
  background: rgba(255,182,72,0.2);
  border-color: rgba(255,182,72,0.65);
  color: #ffd48a;
}
.ft-defense-toggle.is-avant-on {
  background: rgba(192,132,252,0.22);
  border-color: rgba(192,132,252,0.7);
  color: #e9d5ff;
}
.ft-hack-row.is-avant {
  border-color: rgba(192,132,252,0.45);
}
.ft-card-type.avant {
  border-color: rgba(192, 132, 252, 0.65) !important;
  box-shadow: 0 0 14px rgba(192, 132, 252, 0.35), 0 0 28px rgba(168, 85, 247, 0.15), inset 0 0 12px rgba(192, 132, 252, 0.06);
}
.ft-card-type.avant .ft-card-type-title { color: var(--ft-purple); }
.icon-avant { color: var(--ft-purple); }
.ft-hack-row.is-avant {
  box-shadow: 0 0 12px rgba(192, 132, 252, 0.25);
}
.ft-hack-row.is-avant.is-on {
  box-shadow: 0 0 16px rgba(192, 132, 252, 0.45), inset 0 0 10px rgba(192, 132, 252, 0.08);
}
.ft-pass-overlay {
  position: fixed; inset: 0;
  background: rgba(2,5,8,0.88);
  display: flex; align-items: center; justify-content: center;
  z-index: 1100;
  padding: 16px;
}
.ft-pass-box {
  background: var(--ft-panel);
  border: 1px solid var(--ft-accent);
  border-radius: 4px;
  padding: 28px 24px;
  max-width: 400px;
  width: 100%;
  box-shadow: 0 0 40px rgba(57,255,156,0.15);
  text-align: center;
}
.ft-pass-eyebrow {
  font-family: var(--ft-font-display);
  font-size: 11px;
  letter-spacing: 3px;
  color: var(--ft-accent-dim);
  margin-bottom: 10px;
}
.ft-pass-title {
  font-family: var(--ft-font-display);
  font-size: 22px;
  font-weight: 700;
  color: var(--ft-accent);
  margin-bottom: 12px;
}
.ft-pass-desc {
  font-size: 13px;
  color: var(--ft-text-dim);
  line-height: 1.7;
  margin: 0 0 20px 0;
}

.ft-avant-price-input {
  width: 88px;
  background: #0c0a12;
  border: 1px solid rgba(192,132,252,0.55);
  color: #e9d5ff;
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 13px;
  outline: none;
}
`;
