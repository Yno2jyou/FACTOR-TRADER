  function createOnlineRoom() {
    if (typeof Peer === "undefined") {
      setNetStatus("PeerJSの読み込みに失敗しました。ネットワークを確認してください。");
      return;
    }
    destroyPeer();
    const code = genRoomCode();
    const pid = roomPeerId(code);
    setRoomCode(code);
    setOnlineRole("host");
    setPlayMode("online");
    setNetStatus("部屋を作成中…");
    setLobbyList([]);
    setMyPlayerId("human-0");
    myPlayerIdRef.current = "human-0";
    isHostRef.current = true;
    const peer = new Peer(pid, { debug: 1 });
    peerRef.current = peer;
    peer.on("open", (id) => {
      setNetStatus("部屋コード: " + code + "（参加者を待っています）");
      setScreen("lobby");
      setLobbyList([{ id: "human-0", name: myName || "HOST", isHost: true, connected: true }]);
    });
    peer.on("connection", (conn) => {
      conn.on("open", () => {
        conn.on("data", (data) => handleHostMessage(conn, data));
      });
      conn.on("close", () => {
        if (connsRef.current[conn.peer]) delete connsRef.current[conn.peer];
        setNetStatus("切断: 参加者");
        setTimeout(updateLobbyFromHost, 50);
      });
      conn.on("error", () => {
        setNetStatus("接続エラー");
      });
    });
    peer.on("error", (err) => {
      const msg = (err && err.type) || (err && err.message) || "unknown";
      if (String(msg).indexOf("unavailable-id") >= 0 || String(msg) === "unavailable-id") {
        setNetStatus("部屋IDが衝突しました。再作成してください。");
      } else {
        setNetStatus("Peerエラー: " + msg);
      }
    });
  }

  function joinOnlineRoom() {
    if (typeof Peer === "undefined") {
      setNetStatus("PeerJSの読み込みに失敗しました。");
      return;
    }
    const code = String(joinCodeInput || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (code.length < 4) {
      setNetStatus("部屋コードを入力してください");
      return;
    }
    destroyPeer();
    setRoomCode(code);
    setOnlineRole("guest");
    setPlayMode("online");
    setNetStatus("接続中…");
    isHostRef.current = false;
    const peer = new Peer({ debug: 1 });
    peerRef.current = peer;
    peer.on("open", () => {
      const hostId = roomPeerId(code);
      const conn = peer.connect(hostId, { reliable: true });
      hostConnRef.current = conn;
      conn.on("open", () => {
        setNetStatus("ホストに接続しました");
        conn.send({ type: "hello", name: myName || "GUEST" });
      });
      conn.on("data", (data) => {
        if (!data || !data.type) return;
        if (data.type === "welcome") {
          setMyPlayerId(data.playerId);
          myPlayerIdRef.current = data.playerId;
          if (data.name) setMyName(data.name);
          setNetStatus("参加完了: " + (data.playerId || ""));
          setScreen("lobby");
        } else if (data.type === "lobby") {
          setLobbyList(data.players || []);
          if (data.playerCount) setPlayerCount(data.playerCount);
          if (data.roomCode) setRoomCode(data.roomCode);
        } else if (data.type === "snapshot") {
          applySnapshot(data.snapshot);
        } else if (data.type === "error") {
          setNetStatus(data.message || "エラー");
        }
      });
      conn.on("close", () => {
        setNetStatus("ホストとの接続が切れました");
      });
      conn.on("error", () => {
        setNetStatus("接続エラー（部屋コード・ネットワークを確認）");
      });
    });
    peer.on("error", (err) => {
      const msg = (err && err.type) || (err && err.message) || "unknown";
      setNetStatus("Peerエラー: " + msg + "（部屋が存在するか確認）");
    });
  }

  function startOnlineGame() {
    setAiForceHard(true);
    if (onlineRole !== "host") return;
    const connectedGuests = Object.keys(connsRef.current).filter((k) => connsRef.current[k] && connsRef.current[k].open);

    setPhase("market");
    setScreen("play");

    setHackChoices({});
    setPendingOrders({});

  /** 生存中の人間プレイヤー（入力順） */
  function aliveHumans(list) {
    return humanPlayersOf(list || players).filter((p) => !p.isBankrupt);
  }

  function resetDraftsForPlayer(p) {
    setHumanOrderDraft({ action: "stay", shares: 0 });
    setHumanHackDraft({ quick: 0, heavy: 0, defense: 0, reflect: 0, avant: 0, avantSab: 0, avantPrice: 1000, coinRescue: "" });
  }

  function goToOrderPhase() {
    // ONLINE ゲストはホストのスナップショット待ち
    if (playMode === "online" && onlineRole === "guest") return;
    const ah = aliveHumans(players);
    setInputHumanIdx(0);
    setPlayersReadyMask({});
    setOrders({});
    setPassBanner(null);
    setPendingOrders({});
    setPendingHacks({});
    setSubmittedOrderIds([]);
    setSubmittedHackIds([]);
    setISubmittedOrder(false);
    setISubmittedHack(false);
    // ONLINE: 同時入力。LOCAL は常に人間1人
    const online = playMode === "online";
    const hum = online
      ? players.find((p) => p.id === myPlayerId) || ah[0]
      : ah[0];
    let draft = { action: "stay", shares: 0 };
    if (hum && isLastFiveTurns(turn, totalTurns)) {
      const maxBuy = priceBefore > 0 ? Math.floor(hum.cash / priceBefore) : 0;
      if (hum.holdings > 0) draft = { action: "sell", shares: minOrderShares("sell", hum.holdings, maxBuy) };
      else if (maxBuy > 0) draft = { action: "buy", shares: minOrderShares("buy", hum.holdings, maxBuy) };
    }
    setHumanOrderDraft(draft);
    if (!online && ah.length > 1 && hum) {
      setPassBanner({ name: hum.name, phaseLabel: "注文" });
    }
    setPhase("order");
    if (online && onlineRole === "host") {
      setTimeout(() => {
        broadcastSnapshotFrom({
          phase: "order",
          orders: {},
          pendingOrders: {},
          submittedOrderIds: [],
          pendingHacks: {},
          submittedHackIds: [],
          screen: "play",
        });
      }, 40);
    }
  }

  function confirmOrders() {
    // ---- ONLINE ----
    if (playMode === "online") {
      const me = players.find((p) => p.id === myPlayerId) || players.find((p) => !p.isAI);
      if (!me || me.isBankrupt) return;
      let nOrd = Math.floor(Number(currentN) || 0);
      if (nOrd < 10000) { nOrd = randBase(); setCurrentN(nOrd); stateRef.current = { ...stateRef.current, currentN: nOrd }; }
      const px = sopf(nOrd);
      const clamped = clampOrder(humanOrderDraft, me.cash, me.holdings, px, turn, totalTurns);
      if (onlineRole === "guest") {
        setISubmittedOrder(true);
        sendToHost({ type: "order", order: clamped });
        return;
      }
      // host
      const nextPending = { ...pendingOrders, [me.id]: clamped };
      const nextSubmitted = Array.from(new Set([...submittedOrderIds, me.id]));
      setPendingOrders(nextPending);
      setSubmittedOrderIds(nextSubmitted);
      setISubmittedOrder(true);
      broadcastSnapshotFrom({
        pendingOrders: nextPending,
        submittedOrderIds: nextSubmitted,
        phase: "order",
        screen: "play",
      });
      setTimeout(() => tryFinalizeOnlineOrders(nextPending, nextSubmitted), 30);
      return;
    }
    // ---- LOCAL ----
    const ah = aliveHumans(players);
    const cur = ah[inputHumanIdx];
    if (!cur) {
      finalizeOrdersAndGoHack({});
      return;
    }
    let nOrd = Math.floor(Number(currentN) || 0);
    if (nOrd < 10000) { nOrd = randBase(); setCurrentN(nOrd); stateRef.current = { ...stateRef.current, currentN: nOrd }; }
    const px = sopf(nOrd);
    const clamped = clampOrder(humanOrderDraft, cur.cash, cur.holdings, px, turn, totalTurns);
    const nextOrders = { ...orders, [cur.id]: clamped };
    setOrders(nextOrders);
    const nextIdx = inputHumanIdx + 1;
    if (nextIdx < ah.length) {
      const nextP = ah[nextIdx];
      setInputHumanIdx(nextIdx);
      let draft = { action: "stay", shares: 0 };
      if (isLastFiveTurns(turn, totalTurns)) {
        const maxBuy = priceBefore > 0 ? Math.floor(nextP.cash / priceBefore) : 0;
        if (nextP.holdings > 0) draft = { action: "sell", shares: minOrderShares("sell", nextP.holdings, maxBuy) };
        else if (maxBuy > 0) draft = { action: "buy", shares: minOrderShares("buy", nextP.holdings, maxBuy) };
      }
      setHumanOrderDraft(draft);
      setPassBanner({ name: nextP.name, phaseLabel: "注文" });
      scrollToTop();
      return;
    }
    finalizeOrdersAndGoHack(nextOrders);
  }

  function finalizeOnlineOrders(pending) {
    if (!isHostRef.current) return;
    const st = stateRef.current;
    const nStartL = st.currentN;
    const priceBeforeL = nStartL > 0 ? sopf(nStartL) : 0;
    const refL = (st.priceHistory && st.priceHistory.length)
      ? st.priceHistory[st.priceHistory.length - 1].price
      : st.basePrice;
    const newOrders = { ...pending };
    const humans = humanPlayersOf(st.players).filter((p) => !p.isBankrupt);
    const refHuman = humans.slice().sort((a, b) => totalValue(b, priceBeforeL) - totalValue(a, priceBeforeL))[0] || null;
    (st.players || []).forEach((p) => {
      if (newOrders[p.id]) return;
      if (p.isBankrupt) {
        newOrders[p.id] = { action: "stay", shares: 0 };
      } else if (!p.isAI) {
        newOrders[p.id] = { action: "stay", shares: 0 };
      } else {
        newOrders[p.id] = clampOrder(
          aiDecideTrade(Math.random(), nStartL, priceBeforeL, p.cash, p.holdings, refL, {
            turn: st.turn,
            totalTurns: st.totalTurns,
            human: refHuman,
            self: p,
          }),
          p.cash, p.holdings, priceBeforeL, st.turn, st.totalTurns
        );
      }
    });
    setOrders(newOrders);
    stateRef.current = { ...stateRef.current, orders: newOrders, phase: "hack", currentN: ensureBaseN(stateRef.current.currentN) };
    setPendingOrders({});
    setSubmittedOrderIds([]);
    setISubmittedOrder(false);
    setISubmittedHack(false);
    setPendingHacks({});
    setSubmittedHackIds([]);
    setHumanHackDraft({ quick: 0, heavy: 0, defense: 0, reflect: 0, avant: 0, avantSab: 0, avantPrice: 1000, coinRescue: "" });
    setPhase("hack");
    setTimeout(() => {
      broadcastSnapshotFrom({
        orders: newOrders,
        phase: "hack",
        pendingOrders: {},
        submittedOrderIds: [],
        pendingHacks: {},
        submittedHackIds: [],
        screen: "play",
      });
    }, 40);
  }

  function finalizeOrdersAndGoHack(humanOrdersSoFar) {
    const newOrders = { ...humanOrdersSoFar };
    // 参照用の「最強人間」をAIの behindHuman 判定に使う
    const humans = humanPlayersOf(players).filter((p) => !p.isBankrupt);
    const refHuman = humans.slice().sort((a, b) => totalValue(b, priceBefore) - totalValue(a, priceBefore))[0] || null;
    players.forEach((p) => {
      if (newOrders[p.id]) return;
      if (p.isBankrupt) {
        newOrders[p.id] = { action: "stay", shares: 0 };
      } else if (!p.isAI) {
        newOrders[p.id] = { action: "stay", shares: 0 };
      } else {
        newOrders[p.id] = clampOrder(
          aiDecideTrade(Math.random(), nStart, priceBefore, p.cash, p.holdings, refPrice, {
            turn: turn,
            totalTurns: totalTurns,
            human: refHuman,
            self: p,
          }),
          p.cash, p.holdings, priceBefore, turn, totalTurns
        );
      }
    });
    setOrders(newOrders);
    stateRef.current = { ...stateRef.current, orders: newOrders, phase: "hack", currentN: ensureBaseN(stateRef.current.currentN) };
    // ハックフェーズへ：最初の生存人間
    const ah = aliveHumans(players);
    setInputHumanIdx(0);
    setHumanHackDraft({ quick: 0, heavy: 0, defense: 0, reflect: 0, avant: 0, avantSab: 0, avantPrice: 1000, coinRescue: "" });
    setPassBanner(ah.length > 1 && ah[0] ? { name: ah[0].name, phaseLabel: "市場HACK" } : null);
    setPhase("hack");
    scrollToTop();
  }

  function confirmHacks() {
    // ---- ONLINE ----
    if (playMode === "online") {
      const me = players.find((p) => p.id === myPlayerId) || players.find((p) => !p.isAI);
      if (!me || me.isBankrupt) return;
      const endgame = isLastFiveTurns(turn, totalTurns);
      const stock = me.cards.stock || 0;
      let choice = humanHackDraft.coinRescue || "";
      if (endgame) choice = "";
      if (choice === "zero10" && stock !== 0) choice = "";
      if (choice === "half5" && stock > 5) choice = "";
      let avant = (!me.avantUsed && humanHackDraft.avant && !humanHackDraft.avantSab) ? 1 : 0;
      let avantSab = (!me.avantUsed && humanHackDraft.avantSab && !humanHackDraft.avant) ? 1 : 0;
      if (turn <= 3) avantSab = 0;
      if (avant && avantSab) { avantSab = 0; }
      let avantPrice = Math.max(1, Math.min(99999, Math.floor(Number(humanHackDraft.avantPrice) || 1)));
      const anyAvant = avant || avantSab;
      let q = anyAvant ? 0 : Math.max(0, Math.floor(humanHackDraft.quick || 0));
      let h = anyAvant ? 0 : (turn <= 3 ? 0 : (humanHackDraft.heavy ? 1 : 0));
      let def = anyAvant ? 0 : ((turn > 3 && humanHackDraft.defense) ? 1 : 0);
      let ref = anyAvant ? 0 : ((turn > 3 && humanHackDraft.reflect) ? 1 : 0);
      if (def && ref) ref = 0; // 防衛優先
      if (isProtectOnCooldown(cur, turn)) { def = 0; ref = 0; }
      if (isProtectOnCooldown(me, turn)) { def = 0; ref = 0; }
      let stockAfterRescue = stock;
      if (choice === "half5") stockAfterRescue = stock + 5;
      if (choice === "zero10") stockAfterRescue = stock + 10;
      const heavyCost = h > 0 ? 5 : 0;
      const defCost = def ? 5 : 0;
      const refCost = ref ? 5 : 0;
      const avantCost = anyAvant ? 10 : 0;
      if (q + heavyCost + defCost + refCost + avantCost > stockAfterRescue) {
        if (anyAvant && stockAfterRescue < 10) { avant = 0; avantSab = 0; }
        if (def && stockAfterRescue - (anyAvant ? 10 : 0) < 5) { def = 0; }
        if (ref && stockAfterRescue - (anyAvant ? 10 : 0) - (def ? 5 : 0) < 5) { ref = 0; }
        if (h > 0 && stockAfterRescue - (anyAvant ? 10 : 0) - (def ? 5 : 0) - (ref ? 5 : 0) < 5) { h = 0; }
        const room = Math.max(0, stockAfterRescue - (anyAvant ? 10 : 0) - (def ? 5 : 0) - (ref ? 5 : 0) - (h > 0 ? 5 : 0));
        if (q > room) q = room;
      }
      const hackPayload = { quick: q, heavy: h, defense: def, reflect: ref, avant: avant, avantSab: avantSab, avantPrice: avantPrice, coinRescue: choice };
      if (onlineRole === "guest") {
        setISubmittedHack(true);
        sendToHost({ type: "hack", hack: hackPayload });
        return;
      }
      const nextPending = { ...pendingHacks, [me.id]: hackPayload };
      const nextSubmitted = Array.from(new Set([...submittedHackIds, me.id]));
      setPendingHacks(nextPending);
      setSubmittedHackIds(nextSubmitted);
      setISubmittedHack(true);
      broadcastSnapshotFrom({
        pendingHacks: nextPending,
        submittedHackIds: nextSubmitted,
        phase: "hack",
        screen: "play",
      });
      setTimeout(() => tryFinalizeOnlineHacks(nextPending, nextSubmitted), 30);
      return;
    }
    // ---- LOCAL ----
    const ah = aliveHumans(players);
    const cur = ah[inputHumanIdx];
    const endgame = isLastFiveTurns(turn, totalTurns);

    if (cur && !cur.isBankrupt) {
      const stock = cur.cards.stock || 0;
      let choice = humanHackDraft.coinRescue || "";
      if (endgame) choice = "";
      if (choice === "zero10" && stock !== 0) choice = "";
      if (choice === "half5" && stock > 5) choice = "";
      let avant = (!cur.avantUsed && humanHackDraft.avant && !humanHackDraft.avantSab) ? 1 : 0;
      let avantSab = (!cur.avantUsed && humanHackDraft.avantSab && !humanHackDraft.avant) ? 1 : 0;
      if (turn <= 3) avantSab = 0;
      if (avant && avantSab) { avantSab = 0; }
      let avantPrice = Math.max(1, Math.min(99999, Math.floor(Number(humanHackDraft.avantPrice) || 1)));
      const anyAvant = avant || avantSab;
      let q = anyAvant ? 0 : Math.max(0, Math.floor(humanHackDraft.quick || 0));
      let h = anyAvant ? 0 : (turn <= 3 ? 0 : (humanHackDraft.heavy ? 1 : 0));
      let def = anyAvant ? 0 : ((turn > 3 && humanHackDraft.defense) ? 1 : 0);
      let ref = anyAvant ? 0 : ((turn > 3 && humanHackDraft.reflect) ? 1 : 0);
      if (def && ref) ref = 0; // 防衛優先
      // 補充後の手札でコスト判定（実際の補充は finalize 時）
      let stockAfterRescue = stock;
      if (choice === "half5") stockAfterRescue = stock + 5;
      if (choice === "zero10") stockAfterRescue = stock + 10;
      const heavyCost = h > 0 ? 5 : 0;
      const defCost = def ? 5 : 0;
      const refCost = ref ? 5 : 0;
      const avantCost = anyAvant ? 10 : 0;
      if (q + heavyCost + defCost + refCost + avantCost > stockAfterRescue) {
        if (anyAvant && stockAfterRescue < 10) { avant = 0; avantSab = 0; }
        if (def && stockAfterRescue - (anyAvant ? 10 : 0) < 5) { def = 0; }
        if (ref && stockAfterRescue - (anyAvant ? 10 : 0) - (def ? 5 : 0) < 5) { ref = 0; }
        if (h > 0 && stockAfterRescue - (anyAvant ? 10 : 0) - (def ? 5 : 0) - (ref ? 5 : 0) < 5) { h = 0; }
        const room = Math.max(0, stockAfterRescue - (anyAvant ? 10 : 0) - (def ? 5 : 0) - (ref ? 5 : 0) - (h > 0 ? 5 : 0));
        if (q > room) q = room;
      }
      const nextHacks = {
        ...hackChoices,
        [cur.id]: { quick: q, heavy: h, defense: def, reflect: ref, avant: avant, avantSab: avantSab, avantPrice: avantPrice, coinRescue: choice },
      };
      setHackChoices(nextHacks);

      const nextIdx = inputHumanIdx + 1;
      if (nextIdx < ah.length) {
        const nextP = ah[nextIdx];
        setInputHumanIdx(nextIdx);
        setHumanHackDraft({ quick: 0, heavy: 0, defense: 0, reflect: 0, avant: 0, avantSab: 0, avantPrice: 1000, coinRescue: "" });
        setPassBanner({ name: nextP.name, phaseLabel: "市場HACK" });
        scrollToTop();
        return;
      }
      finalizeHacksAndResolve(nextHacks, players);
      return;
    }
    finalizeHacksAndResolve(hackChoices, players);
  }

  function finalizeHacksAndResolve(humanHacksSoFar, playersBase) {
    const endgame = isLastFiveTurns(turn, totalTurns);
    let rescuedPlayers = (playersBase || players).map((p) => ({ ...p, cards: { ...(p.cards || {}) }, history: [...(p.history || [])] }));
    // 防衛・反射の連続使用禁止を強制
    humanHacksSoFar = { ...(humanHacksSoFar || {}) };
    Object.keys(humanHacksSoFar).forEach((pid) => {
      const pl = rescuedPlayers.find((x) => String(x.id) === String(pid));
      if (!pl || !isProtectOnCooldown(pl, turn)) return;
      const hk = humanHacksSoFar[pid] || {};
      if (hk.defense || hk.reflect) {
        humanHacksSoFar[pid] = { ...hk, defense: 0, reflect: 0 };
      }
    });

    // COIN補充の記録（TRADERS表示用）
    const coinRescueMap = {};

    // 人間の COIN 補充を適用
    rescuedPlayers = rescuedPlayers.map((p) => {
      if (p.isBankrupt || p.isAI) return p;
      const hk = humanHacksSoFar[p.id] || {};
      const choice = hk.coinRescue || "";
      if (!choice || endgame) return p;
      const st = p.cards.stock != null ? p.cards.stock : 0;
      if (choice === "zero10" && st !== 0) return p;
      if (choice === "half5" && st > 5) return p;
      if (st > 5) return p;
      const next = applyCoinRescue(p, choice, priceBefore);
      coinRescueMap[p.id] = choice;
      if (choice === "half5") pushLog("COIN " + p.name + " COIN補充: 総資産の50%と引き換えに COIN+5");
      if (choice === "zero10") pushLog("COIN " + p.name + " COIN補充: 総資産の75%と引き換えに COIN+10");
      return next;
    });

    // AI の COIN 補充（積極化: 妨害・防衛用の弾を切らさない）
    rescuedPlayers = rescuedPlayers.map((p) => {
      if (p.isBankrupt || !p.isAI) return p;
      const st = p.cards.stock != null ? p.cards.stock : 0;
      if (endgame || st > 5) return p;
      const ord = orders[p.id] || { action: "stay", shares: 0 };
      let need = false;
      if (ord.action === "buy" && (ord.shares || 0) >= 1) {
        const priceHit = personalExecPrice(nStart, 0, 1, "buy");
        const req = (ord.shares || 0) * priceHit;
        const liq = (p.cash || 0) + (p.holdings || 0) * priceHit;
        need = req > liq + 1e-9;
      }
      const trading = (ord.action === "buy" || ord.action === "sell") && (ord.shares || 0) >= 1;
      const staying = ord.action === "stay";
      // 人間が有利か
      let humanAhead = false;
      const selfTV = (p.cash || 0) + (p.holdings || 0) * (priceBefore || 0);
      rescuedPlayers.forEach((hp) => {
        if (!hp || hp.isAI || hp.isBankrupt) return;
        const tv = (hp.cash || 0) + (hp.holdings || 0) * (priceBefore || 0);
        if (tv > selfTV * 1.05) humanAhead = true;
      });
      // 人間が売買中なら妨害用に補充を急ぐ
      const humanTrading = rescuedPlayers.some((hp) => {
        if (!hp || hp.isAI || hp.isBankrupt) return false;
        const o = orders[hp.id] || {};
        return (o.action === "buy" || o.action === "sell") && (o.shares || 0) > 0;
      });
      let choice = "";
      if (st === 0) {
        if (need) choice = Math.random() < 0.97 ? "zero10" : "half5";
        else if (humanAhead || humanTrading || staying) choice = Math.random() < 0.88 ? "zero10" : (Math.random() < 0.7 ? "half5" : "");
        else if (trading) choice = Math.random() < 0.82 ? "zero10" : (Math.random() < 0.55 ? "half5" : "");
        else choice = Math.random() < 0.7 ? "zero10" : (Math.random() < 0.4 ? "half5" : "");
      } else if (st <= 5) {
        if (need) choice = Math.random() < 0.95 ? "half5" : "";
        else if (humanAhead || humanTrading || staying) choice = Math.random() < 0.85 ? "half5" : "";
        else if (trading) choice = Math.random() < 0.75 ? "half5" : "";
        else choice = Math.random() < 0.55 ? "half5" : "";
      }
      if (!choice) return p;
      const next = applyCoinRescue(p, choice, priceBefore);
      coinRescueMap[p.id] = choice;
      pushLog("COIN " + (p.name || p.id) + " がCOIN補充（" + coinRescueLabel(choice) + "）");
      return next;
    });

    const newHacks = { ...humanHacksSoFar };
    rescuedPlayers.forEach((p) => {
      if (newHacks[p.id] && !p.isAI) {
        // 人間は既に入力済み。coinRescue は TRADERS 表示用に残す
        const choice = coinRescueMap[p.id] || newHacks[p.id].coinRescue || "";
        newHacks[p.id] = { ...newHacks[p.id], coinRescue: choice || "" };
        return;
      }
      if (newHacks[p.id]) return;
      if (p.isBankrupt) {
        newHacks[p.id] = { quick: 0, heavy: 0, defense: 0, reflect: 0, avant: 0, avantSab: 0, coinRescue: "" };
        return;
      }
      if (!p.isAI) {
        newHacks[p.id] = { quick: 0, heavy: 0, defense: 0, reflect: 0, avant: 0, avantSab: 0, coinRescue: coinRescueMap[p.id] || "" };
        return;
      }
      newHacks[p.id] = {
        ...aiDecideCards(
          p.cards, turn, totalTurns, orders[p.id], nStart, priceBefore, orders, p.id, rescuedPlayers
        ),
        coinRescue: coinRescueMap[p.id] || "",
      };
    });

    // 妨害の同時撃ちは少なめ（CPU同士重複を避け、人間狙いを優先して残す）
    const aiHeavy = rescuedPlayers.filter((p) => p.isAI && newHacks[p.id] && (newHacks[p.id].heavy || 0) > 0);
    const heavySlots = 1; // CPU同士で妨害が重複しないよう常に1枠
    if (aiHeavy.length > heavySlots) {
      // 人間が売買中ならその妨害を優先
      const humTrading = rescuedPlayers.some((hp) => {
        if (!hp || hp.isAI || hp.isBankrupt) return false;
        const o = orders[hp.id] || {};
        return (o.action === "buy" || o.action === "sell") && (o.shares || 0) > 0;
      });
      aiHeavy.sort((a, b) => {
        // 様子見のCPUを優先（妨害専任）、その後ランダム味付け
        const oa = (orders[a.id] || {}).action === "stay" ? 1 : 0;
        const ob = (orders[b.id] || {}).action === "stay" ? 1 : 0;
        if (oa !== ob) return ob - oa;
        return Math.random() - 0.5;
      });
      const keep = new Set(aiHeavy.slice(0, heavySlots).map((p) => p.id));
      aiHeavy.forEach((p) => {
        if (!keep.has(p.id)) newHacks[p.id] = { ...newHacks[p.id], heavy: 0 };
      });
    }

    // CPU同士の奥義重複回避（人間との重複は許容し、下の一般解決に任せる）
    {
      const aiAvantOp = rescuedPlayers.filter((p) => p.isAI && !p.isBankrupt && newHacks[p.id] && newHacks[p.id].avant);
      if (aiAvantOp.length > 1) {
        for (let i = aiAvantOp.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const tmp = aiAvantOp[i]; aiAvantOp[i] = aiAvantOp[j]; aiAvantOp[j] = tmp;
        }
        const keepId = aiAvantOp[0].id;
        aiAvantOp.forEach((p) => {
          if (p.id === keepId) return;
          const hk = newHacks[p.id];
          newHacks[p.id] = { ...hk, avant: 0, avantPrice: hk.avantSab ? hk.avantPrice : 0 };
        });
      }
      const aiAvantSab = rescuedPlayers.filter((p) => p.isAI && !p.isBankrupt && newHacks[p.id] && newHacks[p.id].avantSab);
      if (aiAvantSab.length > 1) {
        for (let i = aiAvantSab.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const tmp = aiAvantSab[i]; aiAvantSab[i] = aiAvantSab[j]; aiAvantSab[j] = tmp;
        }
        const keepId = aiAvantSab[0].id;
        aiAvantSab.forEach((p) => {
          if (p.id === keepId) return;
          const hk = newHacks[p.id];
          newHacks[p.id] = { ...hk, avantSab: 0, avantPrice: hk.avant ? hk.avantPrice : 0 };
        });
      }
    }

    // 奥義AVANT-GARDE重複解決（操作・妨害それぞれ）
    {
      // 同一プレイヤーが両方立てていたら操作のみ残す
      rescuedPlayers.forEach((p) => {
        const hk = newHacks[p.id];
        if (hk && hk.avant && hk.avantSab) {
          newHacks[p.id] = { ...hk, avantSab: 0 };
        }
      });
      // 操作（自分株価指定）
      const avantUsers = rescuedPlayers.filter((p) => !p.isBankrupt && newHacks[p.id] && newHacks[p.id].avant);
      if (avantUsers.length > 1) {
        let winner = avantUsers[0];
        let winTv = totalValue(winner, priceBefore);
        avantUsers.forEach((p) => {
          const tv = totalValue(p, priceBefore);
          if (tv < winTv || (tv === winTv && String(p.id) < String(winner.id))) {
            winner = p;
            winTv = tv;
          }
        });
        avantUsers.forEach((p) => {
          if (p.id === winner.id) return;
          newHacks[p.id] = { ...newHacks[p.id], avant: 0, avantPrice: newHacks[p.id].avantSab ? newHacks[p.id].avantPrice : 0 };
          pushLog("[ICON:avant] " + (p.name || p.id) + " の奥義：AVANT-GARDE-操作は重複により不成立（COIN返却）");
        });
        pushLog("[ICON:avant] 奥義：AVANT-GARDE-操作 成立: " + (winner.name || winner.id) + "（自分の株価 " + yenNum(newHacks[winner.id].avantPrice) + "円）");
      } else if (avantUsers.length === 1) {
        const w = avantUsers[0];
        pushLog("[ICON:avant] 奥義：AVANT-GARDE-操作: " + (w.name || w.id) + " が自分の株価 " + yenNum(newHacks[w.id].avantPrice) + "円 を指定");
      }
      // 妨害（他者株価指定）— 防衛で無効化される
      const sabUsers = rescuedPlayers.filter((p) => !p.isBankrupt && newHacks[p.id] && newHacks[p.id].avantSab);
      if (sabUsers.length > 1) {
        let winner = sabUsers[0];
        let winTv = totalValue(winner, priceBefore);
        sabUsers.forEach((p) => {
          const tv = totalValue(p, priceBefore);
          if (tv < winTv || (tv === winTv && String(p.id) < String(winner.id))) {
            winner = p;
            winTv = tv;
          }
        });
        sabUsers.forEach((p) => {
          if (p.id === winner.id) return;
          newHacks[p.id] = { ...newHacks[p.id], avantSab: 0, avantPrice: newHacks[p.id].avant ? newHacks[p.id].avantPrice : 0 };
          pushLog("[ICON:avant] " + (p.name || p.id) + " の奥義：AVANT-GARDE-妨害は重複により不成立（COIN返却）");
        });
        pushLog("[ICON:avant] 奥義：AVANT-GARDE-妨害 成立: " + (winner.name || winner.id) + "（他者の株価 " + yenNum(newHacks[winner.id].avantPrice) + "円）");
      } else if (sabUsers.length === 1) {
        const w = sabUsers[0];
        pushLog("[ICON:avant] 奥義AVANT-GARDE（妨害）: " + (w.name || w.id) + " が他者の株価 " + yenNum(newHacks[w.id].avantPrice) + "円 を指定");
      }
    }
    setHackChoices(newHacks);
    setPassBanner(null);
    resolveTurn(newHacks, rescuedPlayers);
  }

  function finalizeOnlineHacks(pending) {
    if (!isHostRef.current) return;
    // pending を humanHacksSoFar として既存 finalize を利用
    finalizeHacksAndResolve(pending, stateRef.current.players);
    // resolveTurn 内で setPhase reveal されるので、その後スナップショット
    setTimeout(() => {
      broadcastSnapshotFrom({
        phase: stateRef.current.phase,
        players: stateRef.current.players,
        revealData: stateRef.current.revealData,
        revealFocusId: stateRef.current.revealFocusId,
        priceHistory: stateRef.current.priceHistory,
        log: stateRef.current.log,
        orders: stateRef.current.orders,
        hackChoices: stateRef.current.hackChoices,
        pendingOrders: {},
        pendingHacks: {},
        submittedOrderIds: [],
        submittedHackIds: [],
        turn: stateRef.current.turn,
        currentN: stateRef.current.currentN,
        screen: stateRef.current.screen,
      });
      setISubmittedOrder(false);
      setISubmittedHack(false);
      setPendingOrders({});
      setPendingHacks({});
      setSubmittedOrderIds([]);
      setSubmittedHackIds([]);
    }, 80);
  }

  function resolveTurn(hacks, playersOverride) {
    const st = stateRef.current || {};
    const basePlayers = playersOverride || st.players || players;
    const nStartR = ensureBaseN(st.currentN != null ? st.currentN : currentN);
    const priceBeforeR = sopf(nStartR);
    const ordersR = (st.orders && Object.keys(st.orders).length) ? st.orders : (orders || {});
    const turnR = st.turn != null ? st.turn : turn;
    // 清算直前に stateRef も同期
    stateRef.current = { ...st, currentN: nStartR, orders: ordersR };
    const { updated, execResults, priceMap, nMap } = settleTurn(
      basePlayers, ordersR, hacks, nStartR, priceBeforeR
    );
    try {
      if (playMode !== "online") {
        recordAiTurnLearn(basePlayers, ordersR, hacks, execResults, nStartR, priceBeforeR);
      }
    } catch (e) {}

    const totalQuick = basePlayers.reduce((s, p) => s + (hacks[p.id]?.quick || 0), 0);
    const totalHeavy = basePlayers.reduce((s, p) => s + (hacks[p.id]?.heavy || 0), 0);

    const cardLines = basePlayers.map((p) => {
      const h = hacks[p.id];
      const parts = [];
      // [ICON:xxx] マーカーは LogPanel が SVG に置換（絵文字回避）
      if (h?.quick > 0) parts.push(`[ICON:quick]操作×${h.quick}`);
      if ((h?.heavy || 0) > 0) parts.push("[ICON:heavy]妨害×" + h.heavy);
      if (h?.defense) parts.push("[ICON:defense]防衛");
      if (h?.reflect) parts.push("[ICON:reflect]反射");
      if (h?.avant) parts.push("[ICON:avant]AVANT-GARDE-操作");
      if (h?.avantSab) parts.push("[ICON:avant]AVANT-GARDE-妨害");
      if (!parts.length) return null;
      return `${p.name}が${parts.join(" ")}を投入`;
    }).filter(Boolean);

    const orderLines = basePlayers.map((p) => {
      const ex = execResults[p.id];
      if (!ex) return null;
      if (ex.bankrupt) return `${p.name}: 破産`;
      if (ex.action === "buy" && ex.sharesFilled > 0) {
        return `${p.name}: 買い ${sharesFmt(ex.sharesFilled)}株 @ ${yenNum(ex.execPrice)}円 (操作+${ex.ownQuick}/被妨害${ex.incomingHeavy})${ex.note ? "("+ex.note+")" : ""}`;
      }
      if (ex.action === "sell" && ex.sharesFilled > 0) {
        return `${p.name}: 売り ${sharesFmt(ex.sharesFilled)}株 @ ${yenNum(ex.execPrice)}円 (操作+${ex.ownQuick}/被妨害${ex.incomingHeavy})${ex.note ? "("+ex.note+")" : ""}`;
      }
      if (ex.note) return `${p.name}: ${ex.note}`;
      return `${p.name}: 様子見`;
    }).filter(Boolean);

    // 称号用：LOCAL人間の1TERN統計
    if (playMode !== "online") {
      const hum = primaryHuman(basePlayers);
      if (hum && !hum.isAI) {
        const st = titleStatsRef.current || emptyGameTitleStats();
        const ex = execResults[hum.id] || {};
        st.quickUsed = (st.quickUsed || 0) + (ex.ownQuick || 0);
        if (ex.defense) st.defenseBlocked = (st.defenseBlocked || 0) + (ex.blockedHeavy || 0);
        if (ex.reflect) st.reflectOut = (st.reflectOut || 0) + (ex.reflectedOut || 0);
        if (ex.bailout) st.bailouts = (st.bailouts || 0) + 1;
        if (ex.avant || ex.avantSab) st.avantThisGame = (st.avantThisGame || 0) + 1;
        if (hacks[hum.id] && hacks[hum.id].coinRescue) st.coinRescueUsed = true;
        if ((ex.usedHeavy || 0) > 0) {
          basePlayers.forEach((op) => {
            if (!op || String(op.id) === String(hum.id)) return;
            const oex = execResults[op.id];
            if (oex && oex.bankrupt) {
              st.heavyBankruptIds = st.heavyBankruptIds || {};
              st.heavyBankruptIds[op.id] = true;
            }
          });
        }
        // 順位（時価・仮株価基準）
        const rankedNow = basePlayers
          .filter((p) => p && !p.isBankrupt)
          .slice()
          .sort((a, b) => totalValue(b, priceBeforeR) - totalValue(a, priceBeforeR));
        if (rankedNow.length >= 2 && rankedNow[rankedNow.length - 1].id === hum.id) {
          st.wasLast = true;
        }
        // 更新後の順位も見る
        const afterRank = updated
          .filter((p) => p && !p.isBankrupt)
          .slice()
          .sort((a, b) => {
            const pa = priceMap[a.id] != null ? priceMap[a.id] : priceBeforeR;
            const pb = priceMap[b.id] != null ? priceMap[b.id] : priceBeforeR;
            return totalValue(b, pb) - totalValue(a, pa);
          });
        if (afterRank.length >= 2 && afterRank[afterRank.length - 1].id === hum.id) {
          st.wasLast = true;
        }
        titleStatsRef.current = st;
      }
    }

    pushLog(`── TERN${turnR} ── 仮株価 ${yenNum(priceBeforeR)}円 / 個人株価制`);
    cardLines.forEach((l) => pushLog("  " + l));
    orderLines.forEach((l) => pushLog("  " + l));

    // チャート用: 最初の人間（または生存人間）の株価を記録
    // 自分の清算を先に表示（ONLINE は myPlayerId、LOCAL は人間プレイヤー）
    const focusId = (
      myPlayerIdRef.current
      || (primaryHuman(basePlayers) || humanPlayersOf(basePlayers)[0] || basePlayers[0]).id
    );
    const focusPrice = priceMap[focusId] != null ? priceMap[focusId] : sopf(nStartR);

    const perHuman = {};
    basePlayers.forEach((hb) => {
      const ha = updated.find((u) => u.id === hb.id) || hb;
      const hp = priceMap[hb.id] != null ? priceMap[hb.id] : sopf(nStartR);
      const vb = totalValue(hb, priceBeforeR);
      const va = ha.isBankrupt ? 0 : totalValue(ha, hp);
      perHuman[hb.id] = {
        id: hb.id,
        name: hb.name,
        isAI: !!hb.isAI,
        nFinal: nMap[hb.id] || nStartR,
        priceFinal: hp,
        humanOrder: ordersR[hb.id] || { action: "stay", shares: 0 },
        humanExec: execResults[hb.id],
        humanCashBefore: hb.cash,
        humanCashAfter: ha.cash,
        humanHoldingsBefore: hb.holdings,
        humanHoldingsAfter: ha.holdings,
        humanAvgPriceAfter: ha.avgPrice,
        humanValueBefore: vb,
        humanValueAfter: va,
        humanDiff: va - vb,
        humanBankrupt: !!ha.isBankrupt,
      };
    });

    const focusReveal = perHuman[focusId] || Object.values(perHuman)[0];

    // 防衛・反射を使ったプレイヤーは lastProtectTurn を記録（翌TERN連続使用不可）
    const updatedWithProtect = updated.map((p) => {
      const hk = hacks[p.id] || {};
      if (hk.defense || hk.reflect) {
        return { ...p, lastProtectTurn: turnR };
      }
      return p;
    });
    setPlayers(updatedWithProtect);
    setPriceHistory((h) => [...h, { turn: turnR, price: focusPrice, nFinal: (focusReveal && focusReveal.nFinal) || nStartR }]);
    setRevealFocusId(focusId);
    setRevealData({
      nStart: nStartR,
      nFinal: focusReveal ? focusReveal.nFinal : nStartR,
      priceBefore: priceBeforeR,
      priceFinal: focusReveal ? focusReveal.priceFinal : focusPrice,
      totalQuick,
      totalHeavy,
      refPrice,
      humanOrder: focusReveal ? focusReveal.humanOrder : { action: "stay", shares: 0 },
      humanExec: focusReveal ? focusReveal.humanExec : null,
      priceMap,
      execResults,
      humanCashBefore: focusReveal ? focusReveal.humanCashBefore : 0,
      humanCashAfter: focusReveal ? focusReveal.humanCashAfter : 0,
      humanHoldingsBefore: focusReveal ? focusReveal.humanHoldingsBefore : 0,
      humanHoldingsAfter: focusReveal ? focusReveal.humanHoldingsAfter : 0,
      humanAvgPriceAfter: focusReveal ? focusReveal.humanAvgPriceAfter : 0,
      humanValueBefore: focusReveal ? focusReveal.humanValueBefore : 0,
      humanValueAfter: focusReveal ? focusReveal.humanValueAfter : 0,
      humanDiff: focusReveal ? focusReveal.humanDiff : 0,
      humanBankrupt: focusReveal ? focusReveal.humanBankrupt : false,
      perHuman,
      focusId,
    });
    setPhase("reveal");
  }

  function goToGameOver(plsOverride, histOverride) {
    const pls = plsOverride || players;
    const hist = histOverride || priceHistory;
    const price = (hist.length ? hist[hist.length - 1].price : basePrice) || 0;
    const rankedList = pls.slice().sort((a, b) => totalValue(b, price) - totalValue(a, price));
    try {
      if (playMode !== "online") recordAiGameLearn(rankedList, price);
    } catch (e) {}
    const hum = primaryHuman(pls) || humanPlayersOf(pls)[0];
    let newly = [];
    if (playMode !== "online" && hum) {
      const isFirst = rankedList[0] && rankedList[0].id === hum.id;
      const tv = totalValue(hum, price);
      const coins = (hum.cards && hum.cards.stock != null) ? hum.cards.stock : 0;
      const result = evaluateTitlesAfterGame(true, !!isFirst, tv, coins, titleStatsRef.current, titleSave);
      newly = result.newly || [];
      if (result.save) setTitleSave(result.save);
    }
    setNewTitleIds(newly);
    setScreen("over");
  }

  function nextTurn() {
    if (playMode === "online" && onlineRole === "guest") {
      // ゲストはホストの進行を待つ（ホストが next したスナップショット）
      return;
    }
    const humans = humanPlayersOf(players);
    // 人間が全員破産したら残りを自動進行
    if (humans.length > 0 && humans.every((p) => p.isBankrupt)) {
      autoFinishAfterHumanBankrupt();
      return;
    }
    // 生存者が1人以下（人間含む）なら終了
    const alive = players.filter((p) => !p.isBankrupt);
    if (alive.length <= 1) {
      goToGameOver();
      return;
    }
    // CPUが全員破産かつ人間が残っていれば結果へ（対人のみの場合は続行）
    const cpus = players.filter((p) => p.isAI);
    if (cpus.length > 0 && cpus.every((p) => p.isBankrupt) && humans.every((p) => !p.isBankrupt || humans.filter(h=>!h.isBankrupt).length<=1)) {
      const aliveH = humans.filter((p) => !p.isBankrupt);
      if (aliveH.length <= 1) {
        goToGameOver();
        if (playMode === "online" && onlineRole === "host") {
          setTimeout(() => broadcastSnapshotFrom({ screen: "over", players: stateRef.current.players, phase: "reveal" }), 50);
        }
        return;
      }
    }
    if (turn >= totalTurns) {
      goToGameOver();
      if (playMode === "online" && onlineRole === "host") {
        setTimeout(() => broadcastSnapshotFrom({ screen: "over", players: stateRef.current.players, phase: "reveal" }), 50);
      }
      return;
    }
    const next = turn + 1;
    // ラスト5TERN突入時、破産していない生存者にCOIN10枚追加（終盤盛り上げ）
    if (isLastFiveTurns(next, totalTurns) && !isLastFiveTurns(turn, totalTurns)) {
      setPlayers((prev) =>
        prev.map((p) => {
          if (p.isBankrupt) return p;
          const stock = p.cards && p.cards.stock != null ? p.cards.stock : 0;
          return {
            ...p,
            cards: { ...p.cards, stock: stock + 10 },
          };
        })
      );
      const bonusText = "ラスト5TERN・ボーナス：COINが10枚配られました";
      setEndgameBonusMsg(bonusText);
      pushLog("🎁 " + bonusText);
    }
    setTurn(next);
    const cnNext = randBase();
    setCurrentN(cnNext);
    stateRef.current = { ...stateRef.current, turn: next, currentN: cnNext, phase: "market" };
    setPhase("market");
    setHumanOrderDraft({ action: "stay", shares: 0 });
    setHumanHackDraft({ quick: 0, heavy: 0, defense: 0, reflect: 0, avant: 0, avantSab: 0, avantPrice: 1000, coinRescue: "" });
    setOrders({});
    setHackChoices({});
    setRevealData(null);
    setRevealFocusId(null);
    setInputHumanIdx(0);
    setPassBanner(null);
    setISubmittedOrder(false);
    setISubmittedHack(false);
    setPendingOrders({});
    setPendingHacks({});
    setSubmittedOrderIds([]);
    setSubmittedHackIds([]);
    if (playMode === "online" && onlineRole === "host") {
      setTimeout(() => {
        broadcastSnapshotFrom({
          screen: stateRef.current.screen,
          phase: stateRef.current.phase,
          turn: stateRef.current.turn,
          currentN: stateRef.current.currentN,
          players: stateRef.current.players,
          priceHistory: stateRef.current.priceHistory,
          log: stateRef.current.log,
          orders: {},
          hackChoices: {},
          revealData: null,
          endgameBonusMsg: stateRef.current.endgameBonusMsg,
          pendingOrders: {},
          pendingHacks: {},
          submittedOrderIds: [],
          submittedHackIds: [],
        });
      }, 60);
    }
  }

  /** 人間破産後、残りTERNをCPUだけで進めて結果画面へ */
  function autoFinishAfterHumanBankrupt() {
    let pls = players.map((p) => ({ ...p, cards: { ...p.cards }, history: [...(p.history || [])] }));
    let t = turn;
    let hist = priceHistory.slice();
    let lastPrice = hist.length ? hist[hist.length - 1].price : sopf(nStart);

    while (t < totalTurns) {
      t += 1;
      const ns = randBase();
      const pb = sopf(ns);
      const ref = lastPrice || pb;
      const ords = {};
      pls.forEach((p) => {
        if (p.isBankrupt) {
          ords[p.id] = { action: "stay", shares: 0 };
        } else if (p.isAI) {
          const refH = primaryHuman(pls);
          ords[p.id] = clampOrder(aiDecideTrade(Math.random(), ns, pb, p.cash, p.holdings, ref, {
            turn: t,
            totalTurns: totalTurns,
            human: refH,
            self: p,
          }), p.cash, p.holdings, pb, t, totalTurns);
        } else {
          ords[p.id] = { action: "stay", shares: 0 };
        }
      });
      const hks = {};
      pls.forEach((p) => {
        if (p.isBankrupt || !p.isAI) {
          hks[p.id] = { quick: 0, heavy: 0, defense: 0 };
        } else {
          hks[p.id] = aiDecideCards(p.cards, t, totalTurns, ords[p.id], ns, pb, ords, p.id, pls);
        }
      });
      // CPU妨害の同一TERN重複は少なめ（様子見CPU優先・CPU同士の無駄撃ち抑制）
      const aiHeavy = pls.filter((p) => p.isAI && (hks[p.id]?.heavy || 0) > 0);
      const heavySlots = 1; // CPU同士で妨害が重複しないよう常に1枠
      if (aiHeavy.length > heavySlots) {
        aiHeavy.sort((a, b) => {
          const oa = (ords[a.id] || {}).action === "stay" ? 1 : 0;
          const ob = (ords[b.id] || {}).action === "stay" ? 1 : 0;
          if (oa !== ob) return ob - oa;
          return Math.random() - 0.5;
        });
        const keep = new Set(aiHeavy.slice(0, heavySlots).map((p) => p.id));
        aiHeavy.forEach((p) => {
          if (!keep.has(p.id)) hks[p.id] = { ...hks[p.id], heavy: 0 };
        });
      }
      // CPU同士の奥義重複回避
      {
        const aiOp = pls.filter((p) => p.isAI && !p.isBankrupt && hks[p.id] && hks[p.id].avant);
        if (aiOp.length > 1) {
          for (let i = aiOp.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            const tmp = aiOp[i]; aiOp[i] = aiOp[j]; aiOp[j] = tmp;
          }
          const keepId = aiOp[0].id;
          aiOp.forEach((p) => {
            if (p.id === keepId) return;
            const hk = hks[p.id];
            hks[p.id] = { ...hk, avant: 0, avantPrice: hk.avantSab ? hk.avantPrice : 0 };
          });
        }
        const aiSab = pls.filter((p) => p.isAI && !p.isBankrupt && hks[p.id] && hks[p.id].avantSab);
        if (aiSab.length > 1) {
          for (let i = aiSab.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            const tmp = aiSab[i]; aiSab[i] = aiSab[j]; aiSab[j] = tmp;
          }
          const keepId = aiSab[0].id;
          aiSab.forEach((p) => {
            if (p.id === keepId) return;
            const hk = hks[p.id];
            hks[p.id] = { ...hk, avantSab: 0, avantPrice: hk.avant ? hk.avantPrice : 0 };
          });
        }
      }
      const settled = settleTurn(pls, ords, hks, ns, pb);
      try {
        if (playMode !== "online") {
          recordAiTurnLearn(pls, ords, hks, settled.execResults, ns, pb);
        }
      } catch (e) {}
      pls = settled.updated.map((p) => {
        const hk = hks[p.id] || {};
        if (hk.defense || hk.reflect) return { ...p, lastProtectTurn: t };
        return p;
      });
      const fid = (primaryHuman(pls) || humanPlayersOf(pls)[0] || pls[0] || {}).id;
      const hp = (fid && settled.priceMap[fid] != null) ? settled.priceMap[fid] : pb;
      lastPrice = hp;
      hist.push({ turn: t, price: hp, nFinal: (fid && settled.nMap[fid]) || ns });
    }

    setPlayers(pls);
    setPriceHistory(hist);
    setTurn(totalTurns);
    setRevealData(null);
    setPhase("market");
    goToGameOver(pls, hist);
  }

  const [oppHoldings, setOppHoldings] = React.useState(0);
  const [oppAvgPrice, setOppAvgPrice] = React.useState(0);
  const [oppCoins, setOppCoins] = React.useState(40);

  function resetHackDraft() {

    setHeavyOn(false);
    setDefenseOn(false);

    let fixedShares = req.shares != null ? Math.max(1, Math.floor(Number(req.shares) || 1)) : null;
    if (orderAction === "buy") {
      let sh = fixedShares != null ? fixedShares : Math.max(0, Math.floor(Number(orderShares) || 0));

      setConfirmedOrder({ action: "buy", shares: sh });
    } else if (orderAction === "sell") {
      let sh = fixedShares != null ? fixedShares : Math.max(0, Math.floor(Number(orderShares) || 0));
      if (sh < 1 || sh > holdings) {
        flash("売却株数が不正です");
        return;
      }
      setOrderShares(sh);
      setConfirmedOrder({ action: "sell", shares: sh });
    } else {
      setOrderShares(0);
      setConfirmedOrder({ action: "stay", shares: 0 });
    }
    resetHackDraft();
    setPhase("hack");
  }

  function confirmHack() {
    const req = tern.require || {};
    const cost = coinCostPreview();
    if (cost > coins) {
      flash("COINが足りません（必要 " + cost + "）");
      return;
    }
    if (req.minQuick && quick < req.minQuick) {
      flash("操作を " + req.minQuick + " 枚使ってください");
      return;
    }
    if (req.minQuick && quick > req.minQuick) {
      flash("このTERNの操作は最大 " + req.minQuick + " 枚までです");
      return;
    }
    if (req.heavy && !heavyOn) {
      flash("妨害をONにしてください（5枚）");
      return;
    }
    if (req.defense && !defenseOn) {
      flash("防衛をONにしてください（5枚）");
      return;
    }
    if (req.reflect && !reflectOn) {
      flash("反射をONにしてください（5枚）");
      return;
    }
    if (req.avantOp) {
      if (!avantOn || avantMode !== "op") {
        flash("奥義・操作をONにしてください");
        return;
      }
      const ap = Math.max(1, Math.min(99999, Math.floor(Number(avantPrice) || 0)));
      if (ap !== (req.avantPrice || 1)) {
        flash("奥義の指定株価を " + (req.avantPrice || 1) + " 円にしてください");
        return;
      }
      setAvantPrice(ap);
    }
    if (defenseOn && reflectOn) {
      flash("防衛と反射は同時に使えません");
      return;
    }
    if (avantOn && (quick > 0 || heavyOn || defenseOn || reflectOn)) {
      flash("奥義は他のCOINと併用できません");
      return;
    }
    if (avantOn && avantUsed) {
      flash("奥義は一度しか使えません");
      return;
    }

    // --- 解決シミュレーション ---
    const opp = tern.oppHack || {};
    const oppOrd = tern.oppOrder || { action: "stay", shares: 0 };
    let myQuick = quick;
    let myHeavy = heavyOn ? 1 : 0;
    let myDef = defenseOn ? 1 : 0;
    let myRef = reflectOn ? 1 : 0;
    let myAvant = avantOn ? 1 : 0;
    let myAvantPrice = Math.max(1, Math.min(99999, Math.floor(Number(avantPrice) || 1)));
    let spent = 0;
    if (myAvant) spent += 10;
    else {
      spent += myQuick;
      if (myHeavy) spent += 5;
      if (myDef) spent += 5;
      if (myRef) spent += 5;
    }

    // 相手→自分への妨害
    let incoming = opp.heavy || 0;
    let reflected = 0;
    let blocked = 0;
    if (incoming > 0) {
      if (myDef) {
        blocked = incoming;
        incoming = 0;
      } else if (myRef) {
        reflected = incoming;
        incoming = 0;
      }
    }
    // 自分→相手への妨害（相手に防衛なし想定）
    let oppIncoming = myHeavy;
    if (reflected > 0) oppIncoming += reflected;

    // 自分の最終価格
    let myPrice;
    let myN = nStart;
    let quickNull = false;
    if (myAvant && avantMode === "op") {
      myPrice = myAvantPrice;
      myN = nStart;
    } else {
      if (incoming > 0 && myQuick > 0) {
        // 被妨害があると操作無効（ゲーム仕様に寄せる）
        quickNull = true;
        myN = nStart + incoming;
      } else {
        myN = nStart + myQuick + incoming;
      }
      myPrice = sopf(myN);
      if (quickNull) {
        myN = nStart + incoming;
        myPrice = sopf(myN);
      }
    }

    // 相手の最終価格
    let oppN = nStart + (opp.quick || 0) + oppIncoming;
    let oppPrice = sopf(oppN);

    // 自分の約定
    const cashBefore = cash;
    const holdBefore = holdings;
    const avgBefore = avgPrice;
    const valueBefore = cash + holdings * basePrice;
    let nextCash = cash;
    let nextHold = holdings;
    let nextAvg = avgPrice;
    let filled = 0;
    let action = orderAction;
    let notes = [];
    let tradeCost = 0;

    if (action === "buy") {
      const can = myPrice > 0 ? Math.floor(nextCash / myPrice) : 0;
      filled = Math.min(orderShares, can);
      if (filled > 0) {
        const costBuy = filled * myPrice;
        tradeCost = costBuy;
        const newHold = nextHold + filled;
        nextAvg = newHold > 0 ? ((nextAvg * nextHold) + costBuy) / newHold : 0;
        nextCash -= costBuy;
        nextHold = newHold;
        notes.push("あなた：買い " + filled + " 株 @ " + myPrice + "円");
      } else {
        notes.push("あなた：買い不成立（資金不足）");
      }
    } else if (action === "sell") {
      filled = Math.min(orderShares, nextHold);
      if (filled > 0) {
        tradeCost = filled * myPrice;
        nextCash += filled * myPrice;
        nextHold -= filled;
        if (nextHold <= 0) nextAvg = 0;
        notes.push("あなた：売り " + filled + " 株 @ " + myPrice + "円");
      }
    } else {
      notes.push("あなた：様子見");
    }

    // 相手約定（資産も本番同様に更新）
    const oppCashBefore = oppCash;
    const oppHoldBefore = oppHoldings;
    const oppAvgBefore = oppAvgPrice;
    const oppValueBefore = oppCash + oppHoldings * basePrice;
    let nextOppCash = oppCash;
    let nextOppHold = oppHoldings;
    let nextOppAvg = oppAvgPrice;
    let oppFilled = 0;
    let oppSpentCoins = 0;
    const oppHk = opp || {};
    if ((oppHk.quick || 0) > 0) oppSpentCoins += oppHk.quick || 0;
    if ((oppHk.heavy || 0) > 0) oppSpentCoins += 5;
    if ((oppHk.defense || 0) > 0) oppSpentCoins += 5;
    if ((oppHk.reflect || 0) > 0) oppSpentCoins += 5;
    if ((oppHk.avant || 0) > 0) oppSpentCoins += 10;
    const nextOppCoins = Math.max(0, oppCoins - oppSpentCoins);

    if (oppOrd.action === "buy" && (oppOrd.shares || 0) > 0) {
      const can = oppPrice > 0 ? Math.floor(nextOppCash / oppPrice) : 0;
      oppFilled = Math.min(oppOrd.shares || 0, can);
      if (oppFilled > 0) {
        const costBuy = oppFilled * oppPrice;
        const newHold = nextOppHold + oppFilled;
        nextOppAvg = newHold > 0 ? ((nextOppAvg * nextOppHold) + costBuy) / newHold : 0;
        nextOppCash -= costBuy;
        nextOppHold = newHold;
        notes.push(OPP + "：買い " + oppFilled + " 株 @ " + oppPrice + "円（N=" + oppN + "）");
      } else {
        notes.push(OPP + "：買い不成立（資金不足）・最終株価 " + oppPrice + "円");
      }
    } else if (oppOrd.action === "sell") {
      oppFilled = Math.min(oppOrd.shares || nextOppHold, nextOppHold);
      if (oppFilled > 0) {
        nextOppCash += oppFilled * oppPrice;
        nextOppHold -= oppFilled;
        if (nextOppHold <= 0) nextOppAvg = 0;
        notes.push(OPP + "：売り " + oppFilled + " 株 @ " + oppPrice + "円");
      } else {
        notes.push(OPP + "：売り（保有なし）");
      }
    } else {
      notes.push(OPP + "：様子見");
    }

    if (myQuick > 0) notes.push(quickNull ? "操作 " + myQuick + " 枚 → 被妨害により無効" : "操作 " + myQuick + " 枚使用（N+" + myQuick + "）");
    if (myHeavy) notes.push("妨害を使用（相手N+1）");
    if (myDef) notes.push("防衛で被妨害を無効化");
    if (myRef) notes.push("反射で妨害を返した（×" + reflected + "）");
    if (myAvant) notes.push("奥義AVANT-GARDE・" + (avantMode === "op" ? "操作" : "妨害") + " 指定 " + myAvantPrice + "円");
    if (incoming > 0) notes.push("被妨害が残存（N+" + incoming + "）");
    if ((oppHk.heavy || 0) > 0) notes.push(OPP + "が妨害を使用");
    if ((oppHk.quick || 0) > 0) notes.push(OPP + "が操作を " + oppHk.quick + " 枚使用");

    const nextCoins = coins - spent;
    setCash(nextCash);
    setHoldings(nextHold);
    setAvgPrice(nextAvg);
    setCoins(nextCoins);
    setOppCash(nextOppCash);
    setOppHoldings(nextOppHold);
    setOppAvgPrice(nextOppAvg);
    setOppCoins(nextOppCoins);
    if (myAvant) setAvantUsed(true);
    const valueAfter = nextCash + nextHold * myPrice;
    // 操作なし・被妨害なしなら仮株価で約定した場合との差額（買いなら安いほど得）
    let counterfactualPrice = basePrice;
    if (myAvant && avantMode === "op") {
      counterfactualPrice = basePrice; // 奥義なしなら仮株価
    } else if (!quickNull && myQuick > 0) {
      counterfactualPrice = basePrice;
    }
    let benefit = 0;
    if (action === "buy" && filled > 0) {
      benefit = (counterfactualPrice - myPrice) * filled; // 正=安く買えた
    } else if (action === "sell" && filled > 0) {
      benefit = (myPrice - counterfactualPrice) * filled; // 正=高く売れた
    }
    setResult({
      myPrice,
      myN,
      oppPrice,
      oppN,
      filled,
      action,
      spent,
      notes,
      basePrice,
      quickNull,
      blocked,
      reflected,
      myQuick,
      myHeavy,
      myDef,
      myRef,
      myAvant,
      avantMode,
      myAvantPrice,
      cashBefore,
      cashAfter: nextCash,
      holdBefore,
      holdAfter: nextHold,
      avgAfter: nextAvg,
      valueBefore,
      valueAfter,
      valueDiff: valueAfter - valueBefore,
      benefit,
      tradeCost,
      orderShares,
      incoming,
      oppIncoming,
      oppIncomingDirect: Math.max(0, myHeavy || 0),
      oppIncomingReflected: Math.max(0, reflected || 0),
      coinsAfter: nextCoins,
      oppFilled,
      oppCashAfter: nextOppCash,
      oppHoldAfter: nextOppHold,
      oppAvgAfter: nextOppAvg,
      oppCoinsAfter: nextOppCoins,
      oppOrder: { action: oppOrd.action || "stay", shares: oppOrd.shares || 0 },
      oppHack: {
        quick: oppHk.quick || 0,
        heavy: oppHk.heavy || 0,
        defense: oppHk.defense || 0,
        reflect: oppHk.reflect || 0,
        avant: oppHk.avant || 0,
      },
      oppCashBefore,
      oppHoldBefore,
      oppAvgBefore,
      oppValueBefore,
      oppValueAfter: nextOppCash + nextOppHold * oppPrice,
      oppValueDiff: (nextOppCash + nextOppHold * oppPrice) - oppValueBefore,
      oppSpentCoins,
    });
    // 本番と同様、フォーカス（あなた）の最終株価をMARKET FEEDに積む
    setPriceHistory((h) => [...h, { turn: tern.id, price: myPrice, nFinal: myN }]);
    notes.forEach((n) => pushLog("T" + tern.id + " " + n));
    setRevealView("you");
    setViewedOppReveal(false);
    setPhase("reveal");
  }

  function nextAfterReveal() {

    if (ternIdx < TERNS.length - 1) {
      startTern(ternIdx + 1);

    }

  const progressPct = phase === "intro" ? 4

          {phase === "intro" ? (

                  </div>

              {(() => {

                const myOrderDisp = phase === "reveal" && result

                  : (confirmedOrder || null);
                const oppOrderDisp = phase === "reveal" && result && result.oppOrder
                  ? result.oppOrder
                  : (showOrders ? (tern.oppOrder || { action: "stay", shares: 0 }) : null);
                // reveal 時の資産は result の確定後値を優先（state更新直後の表示ズレ防止）

                const meHold = phase === "reveal" && result ? result.holdAfter : holdings;
                const meAvg = phase === "reveal" && result ? result.avgAfter : avgPrice;
                const meCoins = phase === "reveal" && result && result.coinsAfter != null ? result.coinsAfter : coins;
                const oCash = phase === "reveal" && result && result.oppCashAfter != null ? result.oppCashAfter : oppCash;
                const oHold = phase === "reveal" && result && result.oppHoldAfter != null ? result.oppHoldAfter : oppHoldings;
                const oAvg = phase === "reveal" && result && result.oppAvgAfter != null ? result.oppAvgAfter : oppAvgPrice;
                const oCoins = phase === "reveal" && result && result.oppCoinsAfter != null ? result.oppCoinsAfter : oppCoins;
                const meTV = meCash + meHold * displayPrice;
                const oTV = oCash + oHold * (phase === "reveal" && result ? result.oppPrice : displayPrice);
                const rankMe = meTV >= oTV ? 1 : 2;
                const rankOpp = meTV >= oTV ? 2 : 1;

                let meGlow = "";
                let oppGlow = "";
                const traderNotes = [];
                if (phase === "reveal" && result) {

                  else if ((oh.defense || 0) > 0) oppGlow = " glow-amber";
                  else if ((oh.reflect || 0) > 0) oppGlow = " glow-white";
                  else if ((oh.heavy || 0) > 0) oppGlow = " glow-red";

                  if ((r.myQuick || 0) > 0) {

                  if (r.myDef) {
                    traderNotes.push({

                      icon: "defense",

                  if (r.myAvant) {

                  if ((oh.heavy || 0) > 0) {

                return (
                  <div className="ft-panel ft-panel-players ft-tut-traders">

                    <div className="ft-players-body">
                      <div className="ft-players-grid">
                        <div className={"ft-player-card human" + meGlow}>

                          <div className="ft-pc-cards"><Coin size={12} className="icon-coin" /> {meCoins}</div>

                          <div className="ft-pc-cash">{yen(oTV)}</div>

                          <div className="ft-pc-cards"><Coin size={12} className="icon-coin" /> {oCoins}</div>
                          {showOrders ? orderTag(oppOrderDisp) : (
                            <div className="ft-pc-order tag-stay" style={{ opacity: 0.65 }}>注文・HACK非公開</div>

                        </div>
                      </div>
                      {phase === "market" || phase === "order" ? (
                        <div className="ft-traders-notes">
                          <div style={{ color: "var(--ft-text-dim)" }}>

                      {traderNotes.length > 0 ? (

                              <span>{n.text}</span>
                            </div>
                          ))}
                        </div>
                      ) : null}
                    </div>
                  </div>

              })()}
              </div>

              <div className="ft-col-right">
              {phase === "market" ? (
                <div className="ft-panel ft-action" style={{ margin: 0 }}>
                  <div className="ft-panel-head">STEP 1 — 市場開示</div>
                  <p className="ft-action-desc">{tern.marketTip}</p>

                </div>
              ) : null}

              {phase === "order" ? (
                <div className="ft-panel ft-action" style={{ margin: 0 }}>
                  <div className="ft-panel-head">STEP 2 — 投資注文</div>
                  <div className="ft-holdings-box">

                      }

                      }
                      if (((result.oppHack && result.oppHack.quick) || 0) > 0) {

function SetupAccountMenu({ onProgressApplied }) {
  const [open, setOpen] = React.useState(false);
  const [view, setView] = React.useState("menu"); // menu | login | register | otp
  const [userId, setUserId] = React.useState("");
  const [password, setPassword] = React.useState("");
  const [password2, setPassword2] = React.useState("");
  const [otpInput, setOtpInput] = React.useState("");
  const [issuePass, setIssuePass] = React.useState("");
  const [issuedOtp, setIssuedOtp] = React.useState("");
  const [issuedToken, setIssuedToken] = React.useState("");
  const [msg, setMsg] = React.useState("");
  const [err, setErr] = React.useState("");
  const [busy, setBusy] = React.useState(false);
  const [loggedId, setLoggedId] = React.useState(() => getLoggedInAccountId());
  const rootRef = React.useRef(null);

  React.useEffect(() => {
    if (!open) return;
    function onDoc(e) {
      if (!rootRef.current) return;
      if (rootRef.current.contains(e.target)) return;
      // 入力中（IME変換・フォーカス中）は閉じない
      const ae = document.activeElement;
      if (
        ae &&
        rootRef.current.contains(ae) &&
        (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA" || ae.isContentEditable)
      ) {
        return;
      }
      setOpen(false);
    }
    function onKey(e) {
      if (e.key === "Escape") {
        const ae = document.activeElement;
        if (ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA")) return;
        setOpen(false);
      }
    }
    document.addEventListener("mousedown", onDoc);
    document.addEventListener("touchstart", onDoc, { passive: true });
    document.addEventListener("keydown", onKey);
    return () => {
      document.removeEventListener("mousedown", onDoc);
      document.removeEventListener("touchstart", onDoc);
      document.removeEventListener("keydown", onKey);
    };
  }, [open]);

  function openMenu() {
    setOpen(true);
    setView("menu");
    setErr("");
    setMsg("");
  }

  async function handleRegister(e) {
    e && e.preventDefault();
    setErr(""); setMsg("");
    if (password !== password2) {
      setErr("パスワードが一致しません");
      return;
    }
    setBusy(true);
    try {
      await registerAccount(userId, password);
      setLoggedId(String(userId).trim());
      setMsg("登録しました。進捗をアカウントに引き継ぎました。");
      if (onProgressApplied) onProgressApplied();
      setPassword(""); setPassword2("");
      setView("menu");
    } catch (ex) {
      setErr(ex.message || String(ex));
    }
    setBusy(false);
  }

  async function handleLogin(e) {
    e && e.preventDefault();
    setErr(""); setMsg("");
    setBusy(true);
    try {
      const otpNorm = otpInput ? ftNormalizeOtp(otpInput) : "";
      if (otpNorm) setOtpInput(otpNorm);
      await loginAccount(userId, password, otpNorm);
      setLoggedId(String(userId).trim());
      setMsg("ログインしました。");
      if (onProgressApplied) onProgressApplied();
      setPassword(""); setOtpInput("");
      setView("menu");
    } catch (ex) {
      setErr(ex.message || String(ex));
    }
    setBusy(false);
  }

  function handleLogout() {
    try { persistLoggedInProgress(); } catch (e) {}
    logoutAccount();
    setLoggedId(null);
    setIssuedOtp("");
    setIssuedToken("");
    setMsg("ログアウトしました");
    setErr("");
    setView("menu");
  }

  async function handleIssueOtp(e) {
    e && e.preventDefault();
    setErr(""); setMsg("");
    setBusy(true);
    try {
      const res = await issueSyncOtp(issuePass);
      setIssuedOtp(res.otp);
      setIssuedToken(res.otp);
      setMsg("発行しました（有効5分・1回限り）。8桁コードを他端末のログイン画面に入力してください。発行中はこのページを開いたままにしてください。");
      setIssuePass("");
      try {
        await navigator.clipboard.writeText(res.otp);
        setMsg("8桁コードをコピーしました（有効5分・1回限り）。他端末でログイン時に入力してください。");
      } catch (ce) {}
    } catch (ex) {
      setErr(ex.message || String(ex));
    }
    setBusy(false);
  }

  async function copyIssued() {
    const code = issuedOtp || issuedToken;
    if (!code) return;
    try {
      await navigator.clipboard.writeText(code);
      setMsg("8桁コードをコピーしました");
    } catch (e) {
      setMsg("表示中のコードを長押ししてコピーしてください");
    }
  }

  return (
    <div className="ft-account-menu" ref={rootRef}>
      <button
        type="button"
        className={"ft-account-menu-btn" + (open ? " is-open" : "") + (loggedId ? " is-logged" : "")}
        onClick={() => (open ? setOpen(false) : openMenu())}
        aria-label={loggedId ? "アカウントメニュー" : "ログインメニュー"}
        title={loggedId ? ("アカウント: " + loggedId) : "ログイン / 新規登録"}
      >
        {loggedId ? "ACCOUNT" : "LOGIN"}
      </button>
      {open ? (
        <>
        <div className="ft-account-menu-backdrop" aria-hidden="true" onClick={() => setOpen(false)} />
        <div className="ft-account-menu-panel" role="menu">
          {view === "menu" ? (
            <>
              <div className="ft-account-menu-title">
                {loggedId ? (
                  <>ACCOUNT <span className="ft-account-menu-id">{loggedId}</span></>
                ) : (
                  "ACCOUNT"
                )}
              </div>
              {loggedId ? (
                <div className="ft-account-menu-list">
                  <button type="button" className="ft-account-menu-item is-otp" onClick={() => { setView("otp"); setErr(""); setMsg(""); }}>同期ワンタイムパスワード</button>
                  <button type="button" className="ft-account-menu-item" onClick={handleLogout}>ログアウト</button>
                </div>
              ) : (
                <div className="ft-account-menu-list">
                  <button type="button" className="ft-account-menu-item" onClick={() => { setView("login"); setErr(""); setMsg(""); }}>ログイン</button>
                  <button type="button" className="ft-account-menu-item" onClick={() => { setView("register"); setErr(""); setMsg(""); }}>新規登録</button>
                </div>
              )}
              {msg ? <p className="ft-setup-status" style={{ color: "var(--ft-accent)", marginTop: 8 }}>{msg}</p> : null}
            </>
          ) : null}

          {view === "login" ? (
            <form onSubmit={handleLogin} className="ft-account-menu-form">
              <button type="button" className="ft-account-menu-back" onClick={() => setView("menu")}>← 戻る</button>
              <div className="ft-account-menu-title">ログイン</div>
              <div className="ft-label">ID</div>
              <input className="ft-setup-input" value={userId} onChange={(e) => setUserId(e.target.value)} autoComplete="username" maxLength={24} autoCapitalize="off" autoCorrect="off" spellCheck={false} inputMode="text" enterKeyHint="next" />
              <div className="ft-label">パスワード</div>
              <input className="ft-setup-input" type="password" value={password} onChange={(e) => setPassword(e.target.value)} autoComplete="current-password" enterKeyHint="next" />
              <div className="ft-label">同期ワンタイムパスワード（任意・8桁）</div>
