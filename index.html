は私の指先に拒絶の反応を示さなかった。ただ強張っていた両肩の力が、張り詰めた糸が緩むようにわずかに抜けた。</p>\n    <p class=\"no-indent\">「ありがと」</p>\n    <p>彼女は目を逸らしながら小さく呟くと、吸い寄せられるように私の肩口へ、その重い頭をそっと預けてきた。 遠くで誰かの弾けたような笑い声が響いていた。それはわんわんと響く蝉の声と重なり合って、真夏の空気の中に溶けていった。彼女の首輪はまだ水分を含んだまま、傾きかけた陽光を受けて鈍く黒い光を放っていた。革の表面に張り付いた無数の水滴が、夕暮れの光を浴びて、ひとつひとつ小さな宝石のようにきらきらと反射していた。</p>\n    <p>夕方になり、すっかり体力を奪われた私たちはプールを後にして、帰りの電車に疲れた体で乗り込んだ。オレンジ色の斜光を浴びた彼女の白い肌は、日焼けでほんのりと赤みを帯びていた。あの首輪はもう外され、バッグの底に深く仕舞い込まれている。 彼女は疲れ切った顔で、電車の窓ガラスに頭をもたれさせていた。けれどその疲れ方はいつも私の部屋で見せるような、精神を磨り潰された消耗のそれとは明らかに違っていた。体の奥底でみなぎるエネルギーを正しく使い切ったあとに残る、あの心地よい気怠さを孕んだ疲れだった。</p>\n    <p class=\"no-indent\">「また、行こう」</p>\n    <p>窓の外を見つめたまま、私は声をかけた。</p>\n    <p class=\"no-indent\">「うん」</p>\n    <p>彼女の掠れた声が返ってきた。少しだけ長い間があってから、彼女は小さく息を吸い「まだまだ、夏は続くからね」 と自分に言い聞かせるように付け加えた。ガタゴトと音を立てて走る窓の外で、少しずつ夜の帳が下り、街の明かりがまたたく間に流れていった。彼女の流麗で、どこか切ない横顔が、車内に飛び込んでくる流れる光の中で、何度も鮮やかに明滅を繰り返していた。</p>\n  </div>\n\n  <div class=\"section\" id=\"ch7\">\n    <h2 class=\"section-title\">第七話：うらら</h2>\n    <p>スター先輩がある曲を聴かせてくれたのは、プールに行った日から一週間後の夜だった。その日、部屋に行くとスター先輩はベッドの上に胡座をかき、古ぼけたCDケースを膝に乗せていた。テレビも、ゲーム機も切れていた。珍しいことだった。</p>\n    <p>私が何しているのと尋ねると、スター先輩は顔を上げた。</p>\n    <p class=\"no-indent\">「これ、知ってる？」</p>\n    <p>差し出されたのはベストアルバムだった。ジャケットに写った女の顔は、サングラスをしていたが、どこか遠くを見ていた。</p>\n    <p class=\"no-indent\">「森田童子」と私は読んだ。</p>\n    <p class=\"no-indent\">「知らない」</p>\n    <p class=\"no-indent\">「聴いたことない？」</p>\n    <p class=\"no-indent\">「ない」</p>\n    <p class=\"no-indent\">「聴こう」</p>\n    <p>彼女はそう言って、部屋の隅に置かれた小さなCDプレーヤーにディスクを差し込んだ。ゴミの山の奥から引っ張り出してきたらしく、プレーヤーには埃が積もっていた。再生ボタンを押すと、しばらく間があってから、細い音が流れ出した。最初の曲は「ぼくたちの失敗」だった。アコースティックギターの音が、部屋の空気に溶けていった。歌声は低く、ひっそりとしていて、何かを強く主張しなかった。ただそっと隣で寄り添うような声だった。</p>\n    <p class=\"no-indent\">「暗いね」と私は言った。</p>\n    <p class=\"no-indent\">「暗いよ」とスター先輩は言った。</p>\n    <p class=\"no-indent\">「でも、好き」</p>\n    <p>次に「たとえばぼくが死んだら」が流れた。スター先輩は目を閉じた。膝の上に置いた手が、わずかに動いた。私はその手の動きを見ながら、何も言わずにいた。歌詞の意味を尋ねることも、曲名について感想を述べることもしなかった。ただ、彼女がその曲を聴いている間だけ、部屋の空気が普段と違う密度を持つのを感じていた。いつもは絶え間なく鳴っているテレビの音も、スマホの通知音も、その日は一つもなかった。埃をかぶったCDプレーヤーの回転音だけが、規則正しく低く響いていた。私はその沈黙の中で、スター先輩がこの部屋でこんな風に音楽だけに耳を傾けている姿を、これまで一度も見たことがなかったことに気がついた。彼女はいつも何かをしながら喋っていた。スマホを見ながら、ポップコーンを食べながら、テレビを眺めながら。しかし今は違った。彼女はただ聴いていた。それだけのために、時間を使っていた。</p>\n    <p class=\"no-indent\">「なんでこの人の歌好きなの」</p>\n    <p>しばらくしてから、彼女は答えた。</p>\n    <p class=\"no-indent\">「葬式で流れたから」</p>\n    <p class=\"no-indent\">「葬式？」</p>\n    <p class=\"no-indent\">「友だちの」</p>\n    <p>その一言を発したとき、彼女の声にはそれまでと変わらない平坦さがあった。しかし私は、その平坦さの奥に、これまで聞いたことのない歪な硬さが混じっているのを感じ取った。それは感情を抑えているというよりも、感情がどこに向かえばいいのかわからず、行き場を失ったまま声帯の手前で止まっているような硬さだった。私はそれを聞きながら、天井の黄ばみを見ていた。CDプレイヤーからは「ひとり遊び」が流れ始めた。ピアノの音が部屋の隅の空き缶に触れて、静かに散っていくような気がした。</p>\n    <p class=\"no-indent\">「中学のとき、友だちがいてさ」とスター先輩は言った。</p>\n    <p class=\"no-indent\">「この人の歌、教えてくれたの」</p>\n    <p>私は何も言わなかった。</p>\n    <p class=\"no-indent\">「死んじゃったけどさ」</p>\n    <p>平坦な声だった。感情が乗っていないというより、乗せる場所を失ったような声だった。</p>\n    <p class=\"no-indent\">「首吊ったんだよ」</p>\n    <p class=\"no-indent\">「……」</p>\n    <p class=\"no-indent\">「一年くらい前。葬式で流れたの、さっきの曲」</p>\n    <p>音楽だけが流れ続けた。</p>\n    <p class=\"no-indent\">「さよならぼくのともだち」のイントロが始まった。スター先輩は目を開けずにいた。閉じた瞼の下で、眼球がわずかに動いているのが見えた。何かを追っているような、あるいは何かから逃げているような動きだった。</p>\n    <p class=\"no-indent\">「夢に出てくるんだよ、最近」と彼女は続けた。「何も言わないんだけど、ただそこに立ってる。起きてしばらくしてから、死んでるんだって思い出す。毎回」</p>\n    <p class=\"no-indent\">「……」</p>\n    <p class=\"no-indent\">「しんどい」と彼女は静かに言った。</p>\n    <p class=\"no-indent\">「でもなんか、完全に忘れちゃうよりはいいかなって気もする。夢に出てくるってことは、まだ覚えているってことだから」</p>\n    <p>私は返す言葉を探したが、見つからなかった。何かを言えば、それが彼女の言葉の続きを塞いでしまうような気がした。だから私は黙っていることを選んだ。それが正しい選択だったのかどうかはわからない。スター先輩はそのまま黙って、音楽を聴いていた。いつしか「まぶしい夏」が終わり、すぐに「ぼくと観光バスに乗ってみませんか」が始まった。部屋の外で自動車が通り過ぎる音がした。空き缶が一つ、どこかで転がった。やがてアルバムが最後の曲を終えて、プレーヤーが静かに止まった。部屋にしばらく、音のない時間が残った。時計の秒針の音すら聞こえないほどの静けさだった。</p>\n    <p class=\"no-indent\">「仲良かったの？」と私は訊いた。</p>\n    <p class=\"no-indent\">「うん、すごく」とスター先輩は言った。</p>\n    <p class=\"no-indent\">「彼女のためなら、なんだってできた」</p>\n    <p class=\"no-indent\">「……そう」</p>\n    <p>それで話は終わった。スター先輩はCDケースをまた膝に乗せて、ジャケットの顔を見ていた。スター先輩のジャケットを見ている横顔と、森田童子のどこか遠くを見ている眼差しが、しばらく同じ方向を向いていた。私はその横顔を見ながら、彼女が今、目の前にあるジャケットではなく、その向こう側にいる誰かを見ているのだと感じた。</p>\n    <p>夢に出てくると言っていたその友人のことが、彼女の中で何かを揺さぶり続けていることに気づいたのは、その三日後だった。</p>\n    <p>その日、私は朝早くに目を覚ましたのだが、スマホを見ると、スター先輩から一時間前にメッセージが届いていた。「またあの子が出てきた」とだけ書いてあった。私が「夢で目が覚めたの？」と返すと、既読がついたまま、返事は来なかった。その日の夕方に部屋を訪ねると、スター先輩はカーテンを引いたまま、床に座っていた。膝を抱えて、壁に背中を預けていた。こちらが声をかけると顔を上げたが、目の焦点が定まっていなかった。</p>\n    <p class=\"no-indent\">「大丈夫？」</p>\n    <p class=\"no-indent\">「うん」</p>\n    <p>しかし声が掠れていた。立ち上がろうとした瞬間、彼女の体がゆっくりと傾いた。咄嗟に腕を伸ばすと、肩が私の手のひらにぶつかった。スター先輩はそのままへたり込むように、また床に座ってしまった。</p>\n    <p class=\"no-indent\">「大丈夫？　立てる？」</p>\n    <p class=\"no-indent\">「立てる、けど」</p>\n    <p>試しに手を貸すと、立ちはしたが、膝がわずかに震えていた。壁に手をついて、ようやく姿勢を保っている状態だった。</p>\n    <p class=\"no-indent\">「めまいがする」と彼女は言った。</p>\n    <p class=\"no-indent\">「昨日から、ずっと」</p>\n    <p class=\"no-indent\">「昨日から？」</p>\n    <p class=\"no-indent\">「夢見てから、なんか変なんだよ」</p>\n    <p>彼女の顔色は白かった。唇の血の気が薄く、目の下に静かな影があった。眠れていないのか、眠り続けているのかも判別できない顔だった。ゆっくりとベッドまで連れて行くと、腰を下ろした瞬間に上体が折れるように前に傾いた。支えると、体は思ったより軽かった。</p>\n    <p class=\"no-indent\">「ちゃんとごはん食べた？」</p>\n    <p class=\"no-indent\">「食べてない」</p>\n    <p class=\"no-indent\">「いつから」</p>\n    <p class=\"no-indent\">「昨日の朝から、たぶん」</p>\n    <p>私は何も言わずに立ち上がり、台所に向かった。冷蔵庫を開けると、ほとんど空だった。棚にカップ麺が二つあった。お湯を沸かして、一つ作った。ベッドに戻ると、スター先輩はまた横になっていた。</p>\n    <p class=\"no-indent\">「食べて」</p>\n    <p class=\"no-indent\">「食欲ない」</p>\n    <p class=\"no-indent\">「一口だけでも」</p>\n    <p>彼女はしばらく黙って天井を見ていた。それから体を起こして、割り箸を受け取った。一口、二口と麺をすすった。</p>\n    <p class=\"no-indent\">「……夢の中でさ」と彼女は言った。</p>\n    <p class=\"no-indent\">「微笑んでるんだよ、ずっと。まるであっちの世界がすごく心地いいみたいに」</p>\n    <p class=\"no-indent\">「……」</p>\n    <p class=\"no-indent\">「ねえ、あっちの世界って心地いいのかな？」</p>\n    <p>私は何も言えなかった。</p>\n    <p class=\"no-indent\">「色々思い出すと、つらい」</p>\n    <p class=\"no-indent\">「うん」</p>\n    <p class=\"no-indent\">「どうすればいい？」</p>\n    <p class=\"no-indent\">「どうもしなくていいよ」と私は即答した。それからすぐに付け足した。</p>\n    <p class=\"no-indent\">「まあ、どうもできないのがつらいんだけどね」</p>\n    <p class=\"no-indent\">「よくわかってるじゃん」</p>\n    <p class=\"no-indent\">「うん、わからないけど、わかるよ」</p>\n    <p>箸が器の縁に触れて、かちりと鳴った。部屋の外で、遠くから電車の音が聞こえた。スター先輩はそれきり何も言わず、また一口だけ麺をすすって、カップを床に置いた。その夜、私たちはスター先輩の両親が帰ってくるまで、森田童子の曲を聴き続けた。穏やかで、どこか張り詰めた夜だった。</p>\n    <p>夢に出てきた友人について、彼女は少しずつではありながらも、断片的に話すようになった。彼女の名はうららと言った。うららはスター先輩の中学の頃の同級生で、三年間ずっと同じクラスだった。うららの性格は一言でいえば明朗で、物事をはっきりというクラスの中心人物といった感じだった。笑い方がとても自然で、誰かに話しかけることを少しも恐れず、場の空気を読むというより場の空気そのものを身に纏っていた。そういう人間は往々にして表面がなめらかで、何も考えていないように見えるが、うららだけは違ったとスター先輩は言った。</p>\n    <p class=\"no-indent\">「あの子だけ、私のことわかってたんだよ」</p>\n    <p class=\"no-indent\">「自分のことを？」</p>\n    <p class=\"no-indent\">「うん。自分のずっと奥の方のことを」</p>\n    <p>うららの具体的な人となりについて、スター先輩は少しずつ言葉を継いだ。うららは吹奏楽部に所属していて、パートはクラリネットだった。放課後になると音楽室から漏れてくる不揃いな音の中に、うららの音だけを聞き分けられるようになったのだと、スター先輩は言った。上手いというわけではなかったが、粘り強く同じ箇所を繰り返し練習する音だったので、それとわかったのだという。</p>\n    <p class=\"no-indent\">「あの子、練習嫌いだったくせに、絶対にやめないんだよ」とスター先輩は言った。</p>\n    <p class=\"no-indent\">「向いてないと思う、って本人も言ってた。それでもやめなかった」</p>\n    <p class=\"no-indent\">「なんで」</p>\n    <p class=\"no-indent\">「わかんない。でも、そういうところが好きだった」</p>\n    <p>二人が親しくなったきっかけは、中学一年の席替えだった。隣の席になったうららが、スター先輩のセンター分けの髪型を指さして、話しかけてきたのだという。「センター分け、かっこいいね。誰にやってもらってるの」という他愛のない一言だった。当時のスター先輩は誰かに自分から話しかけることを避けていたが、うららはそんな彼女に構わず、毎日のように何かしらの話題を持ちかけてきた。給食の献立への文句、担任の口癖の真似、休み時間に見た動画の話。内容はいつも他愛のないものだったが、うららはその他愛のなさを、まるで大切な仕事のように丁寧に扱った。</p>\n    <p class=\"no-indent\">「私、うるさくない？」とうららが一度尋ねたことがあった。スター先輩は「うるさい」と答えた。しかしそれは拒絶の言葉ではなく、そのやり取り自体を楽しんでいるという意味を含んでいたのだと、彼女は言った。</p>\n    <p>うららがスター先輩を「ととちゃん」と呼び始めたのは、池袋を二人でぶらぶら歩いているときに、偶然ペットショップのガラスの向こうで無邪気に尻尾を振るマルチーズを見かけて、「あの犬『とと』と似ている」とスター先輩が呟いたときのことだった。うららが「ととって、何？」と尋ねると、スター先輩はかつて自分が「とと」と呼んでいたマルチーズを飼っており、その子犬に自分を投影していたことをありのままに話した。うららはその話を、遮ることなく最後まで聞いていた。話し終えたスター先輩は、自分が思った以上に多くを語ってしまったことに気づき、少し後悔していたという。しかしうららは笑わなかった。茶化しもしなかった。それからひと言「わたしたちって、もしかしたら似たもの同士なのかもね」とだけ呟いた。</p>\n    <p class=\"no-indent\">「……似たもの同士」</p>\n    <p>スター先輩はその言葉に頷いた。笑っているようで、笑っていない顔だった。</p>\n    <p class=\"no-indent\">「なんかすごく救われた気がするんだよ、その言葉に」</p>\n    <p class=\"no-indent\">「救われた？」</p>\n    <p class=\"no-indent\">「だって誰にも共感されないと思ってたから。犬に自分を投影しているなんて」</p>\n    <p class=\"no-indent\">「うららは、何が似てるって思ったんだろうね」と私は尋ねた。</p>\n    <p class=\"no-indent\">「聞いたことある」とスター先輩は言った。「誰かに見つけてもらうのを待ってる感じがするって言ってた」</p>\n    <p class=\"no-indent\">「それだけ？」</p>\n    <p class=\"no-indent\">「それだけ。うららは、そういうことをあんまり深く説明しない子だった。感じたことをそのまま言葉にするだけで、理由をこねくり回さない」</p>\n    <p>それ以来、うららだけがスター先輩を「ととちゃん」と呼んだ。本名で呼ぶわけでも、スター先輩と呼ぶわけでもなく、ただ「ととちゃん」と。勿論周囲には意味のわからない呼び方だったが、二人の間ではそれだけで事足りた。うららが「ととちゃん」というあだ名をつけるようになってから、二人はより親密な関係になった。しかし二人の時間は、決して劇的なものではなかった。コンビニの前でぼーっとしたり、池袋の地下街を目的もなく歩いたり、ファミレスで何時間もスマホを眺めて過ごしたり、彼女たちは穏やかな時間を過ごした。うららはスター先輩にいつも深入りしなかった。なぜそんな顔してるのと聞くこともなければ、大丈夫と確認することもない。ただ隣に座っていた。その距離感が心地よかったのだ、とスター先輩は言った。「なんか、探られてる感じがしないんだよね。いるだけでいい、みたいな感じがして」</p>\n    <p>私はその言葉をどこかで聞き覚えがある感じで受け取っていた。自分が彼女の部屋で感じているものと、形は違うけれど根っこが同じような何かを。</p>\n    <p>中学二年の冬、うららが一時期学校を休みがちになった時期があったのだと、スター先輩は言った。理由は最後まで聞かされなかった。ただ、その時期だけはスター先輩の方から毎日メッセージを送っていたのだという。返信は来たり来なかったりしたが、スター先輩はそれを気にせず送り続けた。</p>\n    <p class=\"no-indent\">「今考えると、あれが私にできる精一杯だったんだと思う」とスター先輩は言った。「でも、それだけじゃ足りなかったのかもしれない」</p>\n    <p>うららが首を吊ってしまったのは、出会ってからちょうど三年が経った日のことだった。うららの死について語るとき、スター先輩の口から出てくる言葉は戸惑い、どこか後ろ向きになった。それはまるで話しながら自分でも整理しきれていないような、ひどく宙ぶらりんな語り口だった。</p>\n    <p class=\"no-indent\">「あの日のこと、覚えてる」とスター先輩は言った。「学校で、うららの席だけ空いてて。最初はただの風邪だと思ってた。誰も何も言わなかったし、担任も普通に授業をしてた」</p>\n    <p class=\"no-indent\">「知らされたのは、いつ」</p>\n    <p class=\"no-indent\">「その日の夕方。うららのお母さんから連絡が来て」</p>\n    <p>その時のことを、スター先輩はそれ以上詳しく話さなかった。話せなかったのか、話す気になれなかったのかは、私にはわからなかった。</p>\n    <p class=\"no-indent\">「葬式のとき」とスター先輩はしばらくして続けた。</p>\n    <p class=\"no-indent\">「あの子のお母さんが、うららの好きだった音楽を流したいって言ったの。それが森田童子だった」</p>\n    <p class=\"no-indent\">「好きだったこと、知らなかったの？」</p>\n    <p class=\"no-indent\">「知らなかった。だから余計、びっくりして」</p>\n    <p>スター先輩はそこで一度、唇を結んだ。</p>\n    <p class=\"no-indent\">「あんな暗い曲が好きだったって、全然知らなかった。いつも笑ってたし、友だちも多かったし、なんか……生きるのも上手そうだったのに」</p>\n    <p class=\"no-indent\">「上手そうだったから、わからなかったのかな」</p>\n    <p class=\"no-indent\">「わかんない。わかんないけど」と彼女は言って、宙のどこかを見た。</p>\n    <p class=\"no-indent\">「なんで、あの子が先に消えるんだろうとは思った。自分みたいなのが生き延びて、あの子が消えるなんて、なんか順番がおかしくない？　って」</p>\n    <p>その言葉は、冗談でも自己憐憫でもなかった。ただそういう感覚が確かにあった、という報告のように聞こえた。私は、何も言えなかった。</p>\n    <p class=\"no-indent\">「返信、しなかったんだよ」とスター先輩は続けた。</p>\n    <p class=\"no-indent\">「死ぬ何日か前に、連絡が来てたんだけど」</p>\n    <p class=\"no-indent\">「どんな内容」</p>\n    <p class=\"no-indent\">「元気にしてる？　って」</p>\n    <p>光の加減で、天井に波紋のようなものが浮かび上がっていた。私はその絶え間ない揺らめきを、じっと見つめていた。</p>\n    <p class=\"no-indent\">「後で返そうと思って、置いといたの。べつに急ぎじゃなさそうだったから。そしたらそのまま死んじゃった」</p>\n    <p class=\"no-indent\">「……」</p>\n    <p class=\"no-indent\">「悲しかった。でも、もしあのとき返事をしていても、たぶん変わらなかったと思う」</p>\n    <p>自分に言い聞かせているわけでもなく、私を安心させようとしているわけでもなく、ただ事実だけをそっとテーブルの上に置くような口調だった。</p>\n    <p class=\"no-indent\">「だって、そんなことで変わるなら、あの子はあんな簡単に死なないと思うから」</p>\n    <p class=\"no-indent\">「そっか」</p>\n    <p class=\"no-indent\">「でも、返さなかったっていう事実だけは、やっぱり残るんだよね」</p>\n    <p>彼女は手元のコーヒー牛乳のパックを両手で包み込んだまま、散らかった床へ視線を落とした。</p>\n    <p class=\"no-indent\">「あとになって気づいたんだけど」と彼女は言った。</p>\n    <p class=\"no-indent\">「あの子も、たぶん、自分と同じだったんだよ」</p>\n    <p class=\"no-indent\">「同じだった？」</p>\n    <p class=\"no-indent\">「誰かに必要とされてないと、自分がどこにいるかわかんなくなる、みたいな。恋人が途切れると荒れてたこととか、返信が遅いとすごく不安になってたこととか、後から思い出すと、そういうことが色々と繋がってきてさ。でも当時は、全然気づけなかった」</p>\n    <p>スター先輩はそこで少し黙った。</p>\n    <p class=\"no-indent\">「だから余計、ぐるぐるする。あの子も自分も、たぶん同じもの抱えてて、でも消えたのはあの子で。なんでだろう、ってずっと」</p>\n    <p>その日、私たちはそれ以上何も話さなかった。代わりに私たちは部屋を出て、どこへ向かうとも決めないまま、重い足取りでサンシャイン６０通りへと流れ込んだ。平日の夕暮れ時だというのに、街は容赦のない喧騒で満ちていた。お馴染みのアップテンポなBGMを垂れ流すドン・キホーテの前を通り過ぎ、ゲームセンターから漏れ出る電子音を背中で聞きながら、私たちは人混みを縫うように歩いた。すれ違う見知らぬ誰かの肩が私の肩をかすめ、極彩色の看板や液晶ディスプレイの強烈な光が、私たちの視界を容赦なく明滅させていく。まるで私たちの間の沈黙だけが、この賑やかな通りから切り離されているようだった。突き当たりのサンシャインシティの巨大なビルは、到底見上げる気にもなれず、私たちはそのままなんとなく左へ折れた。首都高速５号線の高架下が薄暗い影を落としている。頭上を走り去る車の重低音が、私の焦燥を代弁するように響いていた。そのまま東池袋中央公園のベンチに腰を下ろそうかとも思ったが、漂う湿っぽい空気に気圧され、立ち止まるのをやめた。私たちはアニメイトや同人誌ショップが並ぶ、乙女ロードの横を通り抜けた。すれ違う人々は誰もが楽しげに袋を抱え、私たちのことなど一瞥もしなかった。気づけば、私たちは池袋駅東口のロータリーへと戻ってきていた。正面には巨大な西武百貨店が壁のようにそびえ立っていた。</p>\n    <p class=\"no-indent\">「西口に行こう」</p>\n    <p class=\"no-indent\">「うん」</p>\n    <p>どちらからともなく、地下のアゼリアロードへと潜り込んだ。ひんやりとした地下通路のコンクリートを靴底が規則的な音を立てて叩く。JRの改札を行き交う人波に揉まれながら、中央通路をひたすら西へと進んだ。地上へ出ると、今度は東武百貨店とルミネ池袋が視界を遮った。東口のギラギラした喧騒とは違い、西口の空気はどこか雑多で、少しだけ冷めていた。私たちは池袋西口公園のグローバルリングの下を通り抜けた。噴水の水しぶきが街灯の光を反射して鈍く光っている。隣にある東京芸術劇場のガラス張りの巨大なパイプのような外観が、夜の闇にゆっくりと溶け込み始めていた。ロマンス通りを抜け、トキワ通りの怪しげなネオンを横目に、私たちはなおも歩き続けた。目的のない足は、やがて劇場通りを越え、西池袋公園の静けさへと行き着いた。振り返ってもそこにはただ、眠らない池袋の街の明かりが遠くでぼんやりと広がっているだけだった。私たちの言葉は、とうの昔にこの街の雑踏に吸い込まれて消えてしまっていた。しかし街灯の光にふちどられたスター先輩の横顔だけは、そんな俗世から完全に切り離されたかのように、どこまでも透き通っていた。そして彼女の輪郭には言葉にすることさえ躊躇われるほどの、言いようのない哀しみが深く、静かに湛えられていた。私はその静謐で、胸を締めつけるほどに痛切な眼差しをまるで世界のどこかに置き忘れてきてしまった言葉の残滓を探しあぐねるように、息を詰めてじっと眺めていた。しかし彼女の瞳がそこにある現実を捉えることは、ついに一度もなかった。いや正確には、彼女はただ果てしなく広がる虚空の一点──物質的には何もない空間の奥底──を凝視していたのだ。その狂おしい眼差しは、まるで虚空の深淵にひそむ、いつかの夜に切り離されてしまった自分の半身に思いを馳せているようにも見えた。彼女の魂はここにはなく、その半身が彷徨う、別のどこかへ囚われているのだろうか。私はその曇りのない、しかしどこまでも茫洋としたまなざしをただひたすらに見つめながら、彼女の奥底にひそむ得体の知れない虚無の淵へと引きずり込まれていった。</p>\n    <p>うららの墓に行きたいと彼女が言ったのは、その二日後のことだった。前触れはなかった。夕方、部屋を訪ねると、スター先輩はいつもの寝間着ではなく、外行きの服に着替えて座っていた。膝の上に、小さな花束が置かれていた。コンビニの前にあるようなラッピングされただけの簡素な花だった。 「行くの？」と私は尋ねた。「うん」とスター先輩は言った。</p>\n    <p class=\"no-indent\">「今日、命日じゃないんだけど」</p>\n    <p class=\"no-indent\">「どうして、今日？」</p>\n    <p class=\"no-indent\">「わからない。でも、今日じゃないと一生、後悔する気がして」</p>\n    <p>それ以上は尋ねなかった。ただ、墓参りの支度だけをした。</p>\n    <p>うららの墓は電車とバスを乗り継いで、一時間ほどかかる場所にあった。市営の霊園で、緩やかな傾斜地に無数の墓石が整列していた。バスを降りると、スター先輩は迷うことなく先に立って歩いた。何度もここに来ているのだと、その足取りが物語っていた。霊園の入り口には桶と柄杓が並べられていて、彼女は慣れた手つきで水を汲んだ。柄杓を持つ手が、いつもより少しだけ強張っているように見えた。墓石の並ぶ小道を歩きながら、スター先輩は一言も喋らなかった。私もまた口を開かなかった。砂利を踏む音だけが二人分、規則正しく響いていた。夕方の霊園には人影がほとんどなく、遠くで蝉の声が途切れ途切れに聞こえるだけだった。日差しはすでに傾き始めていて、墓石の影が長く、地面に淡く伸びていた。</p>\n    <p>うららの墓は、区画の奥まった場所にあった。他の墓と特に違うところのない、ごく普通の墓石だった。刻まれた姓の下に、うららの名前があった。スター先輩はその前に立つと、しばらく動かなかった。花束を持ったまま、ただ墓石を見つめていた。</p>\n    <p class=\"no-indent\">「久しぶりだよ」</p>\n    <p>小さな声だった。誰かに聞かせるためではなく、ただそこにいる誰かに向けて発せられた声だった。</p>\n    <p class=\"no-indent\">「しばらく来れなかったからね」</p>\n    <p>彼女は柄杓で水をかけ、持ってきたタオルで墓石を拭き始めた。表面についた埃や、雨の跡を、一つひとつ丁寧に拭き取っていく。その動作は驚くほど手慣れていて、私はそこに彼女がこれまで何度もここへ通ってきた時間の蓄積を見た。花立てに残っていた古い花を取り除き、新しい水を注ぐと、彼女は持参した花束をそっと立てた。線香に火をつけ、香炉に置いた。細い煙が、風のない夕方の空気の中で、まっすぐに立ち上っていった。スター先輩は墓石の前にしゃがみ込み、手を合わせた。私もその横で同じように手を合わせた。目を閉じると、線香の匂いだけが強く感じられた。どれくらいの時間、そうしていたのかはわからない。彼女が先に目を開けて、私もそれに合わせて目を開けた。</p>\n    <p class=\"no-indent\">「なんか、いつも同じこと頭の中で呟いている気がする」としゃがんだまま彼女は言った。</p>\n    <p class=\"no-indent\">「どんなこと」</p>\n    <p class=\"no-indent\">「最近あったこと。それだけ。うららに聞かせるような大した話、別にないんだけどね」</p>\n    <p class=\"no-indent\">「今日は、何を呟いたの」</p>\n    <p>スター先輩はしばらく墓石を見つめてから、口を開いた。</p>\n    <p class=\"no-indent\">「今年は、友だちができたよって」</p>\n    <p>彼女はそれ以上、私の方を見なかった。ただ墓石に向かって、静かに続けた。</p>\n    <p class=\"no-indent\">「あと、少しだけ、生きるのが前よりましになったよって。噓じゃなくて、本当に」</p>\n    <p>彼女の声には、いつもの平坦さとは違う、わずかな震えが混じっていた。それが涙をこらえているせいなのか、それとも別の理由なのか、私には判別がつかなかった。</p>\n    <p class=\"no-indent\">「うららが最後に送ってくれたメッセージ、返せなかったこと。ずっと謝りたかった。今もちゃんと謝れてるのかわかんないけど」</p>\n    <p>彼女はそこで一度言葉を切った。線香の煙が、彼女の横顔をかすめて上がっていった。</p>\n    <p class=\"no-indent\">「返事してたら何か変わったのかなって、何回も考える。でも、やっぱり変わらなかったとも思う。返さなかったことは、やっぱりずっと残るけどさ」</p>\n    <p>私は彼女の隣で、ただ黙って聞いていた。うららに向けられた言葉に、私が割り込む権利はなかった。</p>\n    <p class=\"no-indent\">「ねえ、うらら」とスター先輩は続けた。</p>\n    <p class=\"no-indent\">「そっちは、寂しくない？」</p>\n    <p>答えが返ってくるはずのない問いだった。それでも彼女はしばらく、その沈黙に耳を澄ませているようだった。風が一度、墓地の木立を揺らして通り過ぎた。葉擦れの音が遠くから近づき、そして遠ざかっていった。</p>\n    <p class=\"no-indent\">「自分は、まだこっちにいるから」</p>\n    <p>彼女はそう言うと、ゆっくりと立ち上がった。膝についた砂を払いながら、墓石をもう一度見つめた。</p>\n    <p class=\"no-indent\">「行こうか」</p>\n    <p class=\"no-indent\">「うん」</p>\n    <p>霊園の出口に向かって歩き出したとき、スター先輩がふと足を止めて振り返った。</p>\n    <p class=\"no-indent\">「あのさ」</p>\n    <p class=\"no-indent\">「なに」</p>\n    <p class=\"no-indent\">「ここに来ると、なんか、ちゃんと生きなきゃって思うんだよね」</p>\n    <p class=\"no-indent\">「そう？」</p>\n    <p class=\"no-indent\">「うん。うららの分まで、とか、そういうベタなことじゃなくて。ただ、こうやって誰かが誰かを覚えてる限り、ちゃんと終わってないんだなって思う。だから自分も、まだ終わってないんだなって」</p>\n    <p>その言葉は、彼女がこれまで口にしてきたどの言葉よりも、僅かながら光を含んでいるように私には聞こえた。もちろんそれは希望と呼べるほど確かなものではなかった。しかし少なくとも、絶望とは違う何かだった。バス停に向かう道すがら、夕陽が墓石の連なりを橙色に染めていた。スター先輩は俯きがちに歩きながら、時折立ち止まっては見知らぬ墓を前に、何秒か目を瞑った。誰かを悼むという行為が、彼女の中でうららひとりに向けられたものだけではなく、もっと広い場所へと静かに滲み出しているように見えた。バスに乗り込むと、スター先輩は窓の外を眺めていた。そして「絶対にまた来る」と彼女は誰に言うでもなく呟いた。「今度は、もっと強くなって来る」と。私はその横顔を見ながら、彼女が抱えているものの重さを、改めて思い知らされていた。それは私がどれだけ隣にいても、代わりに背負うことのできない重さだった。しかし彼女がその重さを、たった一人で抱え続けているわけではないということだけは、確かに感じ取ることができた。今日、この場所に私を連れてきたということ自体が、その証拠だった。</p>\n    <p>地元の花火大会が開催されることになったのは、うららの墓参りをした翌週だった。私がそのチラシを見せると、スター先輩はこちらを見もせずに、布団に丸まったまま、「めんどくさいよ」と吐き捨てた。薄暗い部屋には、西日の熱気とどこか気怠い生活臭が充満していた。換気されていない空気が皮膚にまとわりつくようで、窓の外だけが馬鹿みたいに明るかった。</p>\n    <p class=\"no-indent\">「屋台見るだけでもどう？　悪くないと思うんだけど」</p>\n    <p class=\"no-indent\">「……」</p>\n    <p class=\"no-indent\">「りんご飴もあるし」</p>\n    <p>短い沈黙が流れた。彼女の肩が、わずかにぴくりと動く。布団の端が、ほんのわずかにめくれた。</p>\n    <p class=\"no-indent\">「……りんご飴」</p>\n    <p>彼女はその単語を確かめるように小さく繰り返した。まるで久しく使っていなかった言語を口の中で転がすような、慎重さのある繰り返し方だった。拒絶の気配は、すでに消えていた。</p>\n  </div>\n\n  <div class=\"section\" id=\"ch8\">\n    <h2 class=\"section-title\">第八話：散歩して</h2>\n    <p>花火大会当日、私が鞄の底から実家に眠っていた浴衣を取り出すと、スター先輩はあからさまに顔をしかめた。紺地に白い小花柄が散らされた、姉のお下がりの飾り気のないものだ。畳んだときの折り目が、いくらか不自然に残っている。</p>\n    <p class=\"no-indent\">「絶対着ない。何それ、罰ゲーム？」</p>\n    <p class=\"no-indent\">「着てくれたら、今日だけは何でも言うこと聞くから」</p>\n    <p class=\"no-indent\">「何でも？」</p>\n    <p>彼女の視線が、私の顔をじっと値踏みするように彷徨う。その目は、相手の言葉の重さを測る天秤のようだった。心臓が嫌な音を立てた。</p>\n    <p class=\"no-indent\">「……まあ、可能な範囲で何でも」</p>\n    <p class=\"no-indent\">「わかった。じゃあそれ貸して」</p>\n    <p>彼女はぶっきらぼうに言って、私の手から浴衣をひったくった。着付けは想像以上に手間取った。どうにも帯の結び方が彼女には分からないらしく、狭い部屋でスマホの動画を見つめながら、格闘すること三十分。「暑い」「苦しい」「やっぱり罰ゲームじゃん」と彼女は不機嫌そうにぼやき続けたが、それでも途中で投げ出そうとはしなかった。私が「こうするんじゃないかな」と口を挟もうとするたびに「黙って」と一蹴された。それでも彼女の指は、不器用なりに帯と格闘し続けた。ようやく結び終え、姿見の前に立った彼女を見て、私は息を呑んだ。浴衣の少し緩んだ襟元から、彼女の白い肌が覗いていた。帯の結び目はどこか歪で、衿合わせも完璧とは言えなかったけれど、それがかえって彼女らしかった。いつもの首輪は帯のさらに下、見えない場所に押し込まれているようだった。彼女は姿見の自分を正面から見ようとせず、少し視線を逸らしたまま「行こう」と言った。</p>\n    <p>会場までは、電車で二駅だった。会場の最寄り駅の改札を出ると、色鮮やかな浴衣姿の人々の奔流に、私たちはあっという間に飲み込まれた。頭上に連なる提灯の橙色の光が、容赦なく夜の道を朱く染め上げていた。ソースの焦げるたこ焼きの匂いと、シロップの甘ったるい匂いが交互に鼻腔を突き、遠くからはお囃子の太鼓の音が地鳴りのように響いていた。笑い声、下駄の音、子供が親の手を引く声。日常では決して同時に現れることのないすべてが、この夜だけは重なって鳴っていた。スター先輩は慣れない帯の窮屈さに眉をひそめ、ぎこちない足取りで歩いていたが、その瞳はあちこちへ忙しなく動いていた。普段の、すべてに倦んだような目つきとは少し違っていた。</p>\n    <p class=\"no-indent\">「あ、あれ」</p>\n    <p>彼女が足を止めたのは、赤く艶光りするりんご飴の屋台の前だった。光沢のある砂糖の層が、提灯の光を吸い込んで深みのある紅色に輝いている。私がお金を払い、受け取った大玉の飴を、彼女は小さな口で思い切りかじり取る。ぱりん、と乾いた音が夏の夜に溶けた。</p>\n    <p class=\"no-indent\">「……おいしい」</p>\n    <p>ぱちぱちと飴を噛み砕きながら、彼女は小さく笑った。いつもの気怠げな表情が嘘みたいに消えていた。かじった跡の断面から白いりんごの果肉が覗いていた。彼女はそれをしばらく眺めてから、また一口かじった。浴衣が思った以上に似合っていることに、本人は全く気づいていないようだった。</p>\n    <p>はぐれるからと半分こじつけて、手を引いたのは彼女がりんご飴を半分ほど食べたときだった。彼女の手のひらは夏の夜の空気よりも少しだけ冷たかった。手を引かれた彼女は何も言わず、ただ私の歩調に合わせてついてきた。りんご飴を握っていない方の手がそのまま私の手の中に収まっている。このまま人混みを抜けて、どこか遠いところまで行ってしまえるのではないか。そんな淡い錯覚さえ抱くほど、私たちの境界線は曖昧に溶け合っているように思えた。しかし、しばらく人混みの奥へと進んだとき、スター先輩が突然、ぴたりと足を止めた。 繋いでいた手が不自然に後ろへ引っ張られる。 「どうしたの？」</p>\n    <p>振り返りながら尋ねる私の問いかけには答えず、彼女は視線を落としたまま、肩にかけたバッグのジッパーを無機質な音を立てて開けた。そしてその奥から何かを取り出す。お祭りの賑やかな喧騒を切り裂くように、暗がりの中で、かちりと硬質な金属音が響いた。</p>\n    <p>楽しげに通り過ぎていく人波の中で、彼女だけが、まるで時間の流れから切り離されたように静止していた。</p>\n    <p class=\"no-indent\">「……えっ、それって」</p>\n    <p class=\"no-indent\">「罰ゲーム」</p>\n    <p>彼女は振り返ると、唇の端を吊り上げて薄く笑った。その瞳には昏い悪戯心が宿っていた。周りの提灯の灯りが、その目の奥で小さく揺れていた。</p>\n    <p class=\"no-indent\">「何でも言うこと聞くって言ったよね」</p>\n    <p>彼女の手の中にあったのは、ととの形見のリードだった。</p>\n    <p class=\"no-indent\">「嫌だよ。冗談やめて」</p>\n    <p class=\"no-indent\">「散歩して」</p>\n    <p class=\"no-indent\">「ここ、こんなに人がいるんだよ？」</p>\n    <p class=\"no-indent\">「だから何？」</p>\n    <p class=\"no-indent\">「恥ずかしいよ、それに狂ってる」</p>\n    <p class=\"no-indent\">「いいじゃん」</p>\n    <p>スター先輩は一歩踏み込み、私の胸元にリードの持ち手を押し付けた。持ち手の革が、夏の熱でわずかに柔らかくなっていた。</p>\n    <p class=\"no-indent\">「たまには、死ぬほど狂ったことしようよ、ねえ……」</p>\n    <p>周囲の歩行者たちが、私たちの異様な雰囲気に気づき、ちらちらと視線を向け始めていた。彼女はそんな外野の目など一切意に介さず、首輪を自分の首に宛がって、私がリードを握るのを待っている。片手にりんご飴を持ったまま、その目だけが真剣だった。拒絶して彼女の手を振り払い、そのまま走り去ってしまえばいい。まともな倫理観が頭の中でそう叫んでいた。けれど私をじっと見つめる彼女の双眸には、冷徹なまでの純粋さと、私にすべてを委ねようとする絶対的な狂気が宿っていた。ここで私がリードを拒めば、彼女は二度と私の世界には戻ってこないのではないか。あのときプールの底に沈んでいったときのように、どこか遠い暗闇へ一人で還ってしまうのではないか。周囲から突き刺さる好奇の視線が、じりじりと私の肌を焼いていく。その羞恥と恐怖に押し潰されそうになりながらも、私は彼女の視線という目に見えない鎖に縛られ、一歩も動くことができなかった。逃げ出したいほどの恥辱よりも、彼女を失うことの恐怖が、私の中で圧倒的な質量を持って勝っていく。結局、私がその狂気に観念するまで、二分もかからなかった。</p>\n    <p>彼女の首に巻かれた首輪の金具が、かちりと噛み合う。その小さな音は祭りの凄まじい喧騒の中で、なぜか私の鼓膜に驚くほど鮮明に突き刺さった。まるでほかの音がすべて遠退いて、その一音だけが近づいてきたようだった。私はリードを手に短く巻き付け、なるべく周囲から隠すようにして、再び歩き出した。すれ違う人々が、次々に目を見開いて私たちを二度見していく。遠巻きにひそひそと囁き合うカップル。浴衣姿の若い女性グループが、見てはいけないものを見たような顔をして足を速めた。小さな子供が「ママ、あの人、お犬さんしてる」と言いかけ、母親に強烈な力で腕を引っ張られて去っていった。ポケットからスマホを抜き出し、レンズをこちらに向けようとする影もあった。私はただ顔を伏せ、耳まで熱くなる恥辱に耐えながら地面だけを見て歩いた。足元の砂利と、下駄の底の跡と、誰かが落としたりんご飴の欠片だけを視界に収めていた。けれどそれに引き換え、スター先輩は凛々しかった。彼女はまるで誇り高き生き物のようにすっと背筋を伸ばし、堂々と前を見据えて歩いていた。衆目など存在しないかのように、あるいは存在していても自分には一切関係がないかのように。浴衣の裾がわずかに揺れていた。</p>\n    <p class=\"no-indent\">「ねえ」</p>\n    <p class=\"no-indent\">「なに」</p>\n    <p class=\"no-indent\">「ちゃんと引いてよ、リード」</p>\n    <p class=\"no-indent\">「なんで、急に」</p>\n    <p class=\"no-indent\">「いいから」</p>\n    <p>仕方なく、ほんの少しだけリードを引いた。革が張って、金具がかちりと鳴った。スター先輩は一瞬だけ目を瞑った。それから小さく息を吐いた。</p>\n    <p class=\"no-indent\">「もう一回」</p>\n    <p class=\"no-indent\">「……」</p>\n    <p class=\"no-indent\">「もう一回だけ」</p>\n    <p>私はもう一度、少しだけ引いた。かちり、と首輪が鳴った。スター先輩の柔らかく温かな喉が、硬く冷たい首輪によって静かに締めつけられていく。スター先輩はそのままじっと動かなかった。首輪の金具が蛍光灯の光を鈍く反射していた。何秒かそうしていると、彼女はゆっくりと目を開けた。「……なんか落ち着く」</p>\n    <p class=\"no-indent\">「……そう」</p>\n    <p class=\"no-indent\">「なんでだろ」</p>\n    <p class=\"no-indent\">「さあ」</p>\n    <p class=\"no-indent\">「わかんないけど、落ち着く」</p>\n    <p>私はそれ以上、何も言わなかった。彼女も、何も言わなかった。リードを少し緩めると、スター先輩はまた立ち止まった。</p>\n    <p class=\"no-indent\">「もっと強く引いて」</p>\n    <p>背後から、低く濡れた声がした。彼女は不器用な上目遣いで、私を凝視していた。提灯の橙が、その瞳の中で揺れていた。</p>\n    <p class=\"no-indent\">「もう引かない」</p>\n    <p class=\"no-indent\">「引いてってば」</p>\n    <p class=\"no-indent\">「嫌だよ。このまま歩いて」</p>\n    <p class=\"no-indent\">「いいじゃん、ちょっとくらい……」</p>\n    <p>別の屋台の前を通りかかる瞬間、彼女が「りんご飴、おかわり」と平然と言った。さっきの一本は、いつの間にか食べきっていた。私はリードを右手で握り締めたまま、左手でポケットから財布を出した。汗ばんだ指先で紙幣を取り出すことの情けなさを噛みしめながら、店主に差し出す。店主が私たちの手元を見ても、一切表情を変えずに千円札を受け取ったのは、彼が商売のプロだからだと思いたかった。どうか、そうであってほしかった。</p>\n    <p>花火が上がったのは、私たちが人混みを抜け、会場の奥にある少し開けた広場に出た瞬間だった。ドォ、と腹の底に響く最初の一発が夜空を割った。その音は音というよりも振動で、胸の中心に直接触れるようだった。花火が上がった瞬間、広場にいた人々は一斉に顔を上げた。続いて二発、三発と、連続して打ち上がる大輪の花火。橙色、金色、鮮烈な白。散っていく光の残滓が長い弧を描いて夜空に消える。色とりどりの閃光が広場全体を、そして私たちの身体を順番に染め上げていく。スター先輩もまた、大きな瞳を見開いて上空を見上げていた。光が弾けるたび、彼女の横顔の輪郭がくっきりと変わり、影の落ち方が激しく明滅する。右こめかみの星型のほくろが、橙色の光の中でひときわ強く輝いていた。見上げる拍子に、浴衣の襟がわずかにずれて、彼女の白い喉が完全に露わになっていた。彼女は首輪をつけられたまま、花火を見上げて静かに笑っていた。声は出さない。口の端だけをわずかに動かす、あのいつもの寂しげな笑い方だった。しかし光が降るたびに、その笑い方はわずかに変化した。寂しさが薄れる瞬間と、濃くなる瞬間が、交互に現れているようだった。私はリードの感触を右手に感じながら、その横顔から目を離すことができなかった。美しい、と素直に思った。胸が痛くなるほどに。けれど同時に、そこには何か取り返しのつかない、見てはいけない深淵を覗き込んでいるような恐怖もあった。この世のものとは思えない美しさと、目を背けたくなるような狂気が、彼女という一つの存在の中に完全に同居していた。美しさと、狂気は対立するものではなく、互いに依存し合い、必要とし合っているものたちなのかもしれないと、私は花火の光の中でぼんやりと思った。やがて最後の大連発が夜空を埋め尽くし、ジリジリと黒い煙だけが残されると、花火大会は幕を閉じた。観客の拍手がまばらに起き、それもすぐに人波の音に飲み込まれた。人々が一斉に駅に向かって動き出し、祭りの熱狂がそのまま帰り道へと移動していく。それと同時に、スター先輩のテンションが、目に見えて急激に落ちていくのが分かった。表情から灯が消えるように。広場の喧騒に紛れていたものが人の流れが散るにつれて剥き出しになっていくようだった。</p>\n    <p>街灯の少ない、少し静かな裏道に入ったとき、彼女がぽつりと言った。</p>\n    <p class=\"no-indent\">「……うららと一緒に、夏祭りに行ったときのこと、思い出しちゃった」</p>\n    <p>私は反射的にリードを緩めた。言葉が見つからなかった。夜風が湿った熱気を運んで、提灯の灯りの届かない路地を通り抜けた。</p>\n    <p class=\"no-indent\">「うららもさ、浴衣着て、こういう花火、一緒に見たかったのかな」</p>\n    <p>彼女の声は続く。抑揚のない、でも確かに何かを抱えた声だった。</p>\n    <p class=\"no-indent\">「……自分だけがこうやって生きてて、美味しいもの食べてるの、なんか変な感じがする」</p>\n    <p>周囲にはまだ、祭りの余韻を引きずった人々の賑やかな声が満ちているのに、彼女の声だけがひどく冷たく、希薄で、今にも消えてしまいそうだった。提灯の光が届かない暗がりの中で、彼女の輪郭だけがぼんやりとしていた。</p>\n    <p class=\"no-indent\">「……ねえ、首輪、外そう」</p>\n    <p>私が手を伸ばすと、彼女はそれを手で制した。小さな、でもはっきりした動きだった。</p>\n    <p class=\"no-indent\">「いい。このまま帰る」</p>\n    <p>それからしばらく無言で歩き、駅の明かりが見えてきた頃、彼女は前を向いたまま小さく呟いた。</p>\n    <p class=\"no-indent\">「今日は……楽しかったよ。ありがと」</p>\n    <p>その言葉は短かったが、ぽとりと落ちるように重かった。私は「うん」と答えることしかできなかった。うん、以外の言葉が浮かばなかったし、浮かんだとしても、この夜のこの空気には合わなかった。駅までの残りの道のりを、私たちはほとんど口を利かずに歩いた。遠くの空で諦めの悪い、遅れて上がった花火の音が、ドォンと鈍く響いていた。誰かが残していったのか、道端に割れた線香花火の燃え殻が落ちていた。帰りの電車の中、スター先輩は窓ガラスに頭をもたれ、疲れたように目を閉じていた。電車の揺れに合わせて、浴衣の襟が小さく乱れる。その隙間から覗く彼女の白い首筋には、さっきまで繋がれていた首輪の赤い跡が、うっすらと皮膚に残っていた。革が当たっていた部分だけが、薄く腫れたように見えた。この歪で、狂おしいほど美しい夜こそが、私が彼女と一番近くにいられた時間だったのかもしれない。ガタゴトと揺れる車内で、私はそんなことを思った。しかし決してそれを言葉にすることはしなかった。言葉にした瞬間に、何かが音を立てて壊れてしまうような気がしたからだ。</p>\n    <p>彼女が海を見たいと言ったのは、花火大会から五日が経った頃のことだった。あの夜、お祭りの凄まじい喧騒の中で彼女を繋いだリードの感触は、今も私の手のひらに生々しく残っていた。けれど、日常に戻った私たちの間には、何事もなかったかのような静けさが戻っていた。セミの鳴き声だけが響く狭い部屋で、窓から差し込む西日を浴びながら、私たちはそれぞれの時間をただやり過ごしていた。そんな張り詰めた沈黙を破るように、彼女が膝を抱えたまま、前触れもなくその声を漏らしたのだ。まるで、ずっと心の中で温めていた小さな秘密を打ち明けるように。</p>\n    <p class=\"no-indent\">「海が見たい」</p>\n    <p class=\"no-indent\">「海？」</p>\n    <p class=\"no-indent\">「うん」</p>\n    <p class=\"no-indent\">「海って、どこ？」</p>\n    <p class=\"no-indent\">「江ノ島とか？」</p>\n    <p class=\"no-indent\">「江ノ島……」</p>\n    <p>私は本棚の片隅に置かれていた江ノ島特集の雑誌を引っ張り出した。</p>\n    <p class=\"no-indent\">「行きたい日、ある？」</p>\n    <p class=\"no-indent\">「特に、ないよ」と彼女は淡々と言った。そして首元の革の輪を指先で弾いて、かちりと鳴らした。私は少し迷ったが、「明後日でいい？」と答えた。するとスター先輩は珍しく小さく笑った。声には出ない、口の端だけの笑い方だった。それは彼女が何かを素直に望んでいるときの証だった。</p>\n    <p>三日後。早朝の池袋駅は昼間の喧騒が嘘のように人が少なかった。巨大な駅舎が吐き出すひんやりとした空気がコンコースを満たし、高い天井の隙間から、まだ白っぽい朝の光が斜めに差し込んでいる。そこでは戦場へ向かうような重い足取りの会社員が、視線も合わせず足早に通り過ぎていた。 彼女はそんな無彩色な人波の中で、ぽつんとひとり佇んでいた。いつもとは違う薄手の淡いグレーの長袖パーカーに、黒い短パンというラフな姿。トレードマークであるはずの首輪はしていなかったが、パーカーの右ポケットが不自然にに膨らんでいるのを私は見逃さなかった。</p>\n    <p>私たちは湘南方面へと向かう長距離の電車に乗り込んだ。通勤ラッシュとは逆方向の車内は拍子抜けするほど空いていて、モーターの駆動音だけが規則正しく響いている。彼女は誘われるように窓側の席に深く腰を掛けると、窓ガラスに額を押し付けるようにして、流れていく街並みをぼんやりと眺めていた。</p>\n    <p class=\"no-indent\">「電車乗るの、久しぶり」</p>\n    <p>車輪がレールを叩く音に混じって、彼女が小さく呟いた。</p>\n    <p class=\"no-indent\">「そう？」</p>\n    <p class=\"no-indent\">「うん。何て言うのかな。自分が外の世界に出て、移動してる気がする」</p>\n    <p>窓の外の景色は、灰色のビル群から徐々に生い茂る夏の緑へと、グラデーションのように変化していった。電柱の影が車内に規則的なリズムで細い影を落とす。「夏っぽいね」と私が言うと、「でも夏はもうすぐ終わるよ」と静かに言葉が返ってきた。 その言い方は言いようのない寂しさを孕んでいた。そこには楽しい季節が過ぎ去ることへの無邪気な惜しみなどではなく、この世界に存在する美しいものは何であれいつでも唐突に終わるという、冷酷な事実をただ淡々と確認しているような諦念すら混じっていた。</p>\n    <p class=\"no-indent\">「旅行なんて、したことなかったな」</p>\n    <p class=\"no-indent\">「えっ？」</p>\n    <p class=\"no-indent\">「いや父親はいつも仕事でいなくてさ。母親は母親で、家から出る旅行なんて面倒なだけだって、全然興味がなかったから」</p>\n    <p>スター先輩は自嘲気味に笑った。彼女が自分の家庭環境について話すのは珍しかった。</p>\n    <p class=\"no-indent\">「だからかな。こうやって電車で遠出するってだけで、ちょっと特別な感じがする」</p>\n    <p>特別、という言葉の響きを彼女は舌の上で転がし、かみしめるような口調で言った。それは喜びの表現というよりも、まるで剥き出しになった珍しい地層の断面を、他人事のように冷ややかに観察する学者のような語り口だった。「特別」という枠組みに閉じ込められることで、これまでどれほど多くのものを諦め、あるいは傷ついてきたのだろうか。彼女の横顔に浮かぶ諦念のような影がガタゴトと揺れる車内の狭い空間にひっそりと広がっていく。私は気の利いた言葉を返すこともできず、ただ彼女の冷えた言葉の余韻に耳を澄ませるしかなかった。世界のすべてを拒絶するかのような、張り詰めた沈黙が二人の間に流れた。彼女はその沈黙に身を任せるように、こてんと私の左肩に頭を預けてきた。窓から差し込む容赦のない朝の光が、彼女の右こめかみにある星型のほくろを透明に透かした。 彼女の髪からは、どこか独特な匂いが漂っていた。私は彼女の規則正しく、ゆっくりになっていく呼吸の重みを感じながら、車窓を流れていく鮮やかな緑の残像を、一人で静かに眺め続けていた。</p>\n    <p>目的地である海に着いたのは、午前十時だった。まだ海の家も開ききっていない、人がまばらな時間帯だった。 湿った砂浜にそっと足を踏み入れると、スター先輩は不意に足を止め、正面の水平線をじっと見つめた。彼女の口からついて出たのは「広い」 ただそれだけの二文字だった。けれど、その短い言葉の隙間には、何かがぎっしりと詰まっているようにも感じられた。それは広大な自然に対する素朴な驚きとも、日常からの解放による安堵とも違う、もっと感情の起伏を削ぎ落とした、平らで、果てしない何かだった。私はそれを形容しようとして、寸前になってやめた。今は海だ、と思った。</p>\n    <p>私たちは波打ち際まで歩くと、スニーカーを脱いで裸足になった。寄せ波が引き、ひんやりとした冷たい水が足首を洗った瞬間、彼女は「わあ、すご」と小さく、しかし確かな声で呟いた。それから自分の言葉が急に気恥ずかしくなったのか、「うわ、馬鹿みたい」と、はにかむように付け加えた。</p>\n    <p class=\"no-indent\">「馬鹿じゃないよ」</p>\n    <p class=\"no-indent\">「そう？」</p>\n    <p class=\"no-indent\">「うん。自分もいま、同じことを思ってたし」</p>\n    <p>水を含んだ砂が足の裏でじわりと沈み、二人の足跡がくっきりと並んで残る。けれど、すぐに大きな波が足元をすくい、白く泡立ちながら、その足跡の輪郭を曖昧にぼかし、引いていった。まるで私たちの存在そのものを消し去ろうとするかのように。私はバッグから日焼け止めを取り出すと、彼女の細い腕に白い液体を落とした。そして手のひらでそれを伸ばした。指先が数日前に見たばかりの新しく生々しい傷跡の上を通った。私は何も言わなかった。彼女も拒まず、ただ遠くの水平線を見つめていた。私たちの間には、寄せては引き返す単調な波の音だけが、世界のすべてを支配するように延々と鳴り響いていた。白い日焼け止めの液が、彼女の傷跡を一時的に覆い隠すように、ゆっくりと透明に伸びて肌に馴染んでいった。</p>\n    <p class=\"no-indent\">「……首輪、付けて」</p>\n    <p>視線を海に向けたまま、彼女が唐突に言った。</p>\n    <p class=\"no-indent\">「ここで？」</p>\n    <p>思わず声が裏返り、周囲を気にして見回してしまう。</p>\n    <p class=\"no-indent\">「ここで。お願い」</p>\n    <p>彼女の強い視線に圧されるように私はためらいながらも、彼女のパーカーのポケットに手を差し入れた。指先に触れた冷たい革の感触。引き出された首輪を、私は彼女の白い首にそっと巻き付けた。かちり、と金具の噛み合う音が響いた。ドォンという重い波の音と、その繊細な金属の音が、交互に私の耳を打つ。かちりと波、かちりと波。その音の連鎖が、世界で私たちだけを別の空間に切り離していくような錯覚を覚えた。私は短く調整したリードをしっかりと手に握り、砂浜をゆっくりと歩き出した。乾いた砂が足の指の間からさらさらと逃げていき、一歩進むたびに軽く足を取られる。波が足元に打ち寄せるたび、張り詰めたリードが水の抵抗でぐぐっと揺れた。彼女はリードに引かれながら「楽しい」と、長い睫毛の奥から少しは器用になった上目遣いで私を見た。それは子供のようでありながら、どこか妖艶な本当に楽しそうな美しい瞳だった。首輪をしていないときのどこか現実を拒絶したような顔とも、あの夜に見た花火の光に照らされた顔とも違う、私の知らない彼女の表情だった。</p>\n    <p>午後になるとカラフルなパラソルが増え、いかにも夏を楽しみに来たという風情の人々で砂浜が埋まり始めた。他人の視線から逃れるように、私たちは少し離れた荒々しい岩場へと移動した。波がゴツゴツとした黒い岩肌に当たって激しく砕ける音が周囲を満たし、かえってそこには二人きりしか存在しないような奇妙な静けさが漂っていた。岩の表面に打ち寄せた水が白く激しい泡になり、やがて引いていくのを私たちは並んで見つめていた。</p>\n    <p class=\"no-indent\">「私のこと、ずっと飼ってくれる？」</p>\n    <p>彼女は平らな岩場に腰を下ろし、膝を抱えて、海の向こうの境界線を凝視しながらぽつりと言った。 私は言葉を失い、返答に詰まった。</p>\n    <p class=\"no-indent\">「ずるいよね、答えられない質問ばかりして」</p>\n    <p>彼女は自嘲的に、声を立てて笑った。しかしその目は一切笑っていなかった。ただひたすらに、世界の果てを見つめるような目をしていた。</p>\n    <p class=\"no-indent\">「でも、今日だけは、飼っててくれる？」</p>\n    <p class=\"no-indent\">「それは……」</p>\n    <p>私が必死に言葉を紡ごうとすると、彼女は濡れた自分の人差し指を、そっと私の唇に当てて遮った。</p>\n    <p class=\"no-indent\">「何も言わなくていいよ。先のことなんて、何も約束しなくていい」</p>\n    <p>激しい波が再び岩を叩き、白い飛沫が舞った。強い潮風が彼女の黒髪を乱暴に持ち上げる。飛び散った冷たい水滴が、彼女の右こめかみの星のほくろに当たって、一瞬だけ陽光を反射してきらりと光った。けれどその光は夏の強い熱気によって、すぐに乾いて消えてしまった。</p>\n    <p class=\"no-indent\">「うららも、こういうところ好きだったんだよね……」</p>\n    <p>彼女が誰に言うでもなく零したその名前は、轟々という波の音の中に、跡形もなく吸い込まれて消えた。 真昼の夏の光はあまりにも強烈で、岩場に落とされる私たちの影は墨をこぼしたように真っ黒でくっきりとしていた。光と影の鋭い境目が私たちの足元の岩の上にくっきりと線を引いている。その容赦のない光の中で、一瞬だけ、雲が太陽を遮り、私たちの間に大きな影が差した。どちらからともなく引き寄せられるように、距離が縮まった。私は思わず手を伸ばし、彼女の形の良い額にそっと自分の唇を寄せた。触れた皮膚は、潮風のせいで驚くほどひんやりとしていた。それは一秒にも満たない水泡がぱちんと弾けるようなひとときの口づけだった。実際、気づいたときには唇を離していた。しかし彼女は長い間、目を閉じたまま、巨石から切り出された彫像のようにじっと動かなかった。波が一回、二回と岩肌に打ち寄せ、引いていく。やがて彼女はゆっくりと目を開け、ただひと言だけ「悪くなかったよ」とだけつぶやき、海を向いた。私はその言葉に曖昧に頷こうとして、首を振ったりしながら、ただじっと水平線の彼方を見つめていた。</p>\n    <p>帰りの電車の中、傾きかけた西日に照らされながら、彼女は深い眠りに落ちていた。今朝と同じように、私の左肩に頭を預けている。けれど、行きと帰りでは、まったく同じ姿勢であるはずなのに、私の肩にかかる彼女の頭の重みは、まるで違っていた。体力を使い果たした肉体の疲労のせいなのか、それとも私に対してほんの少しだけ、心を許してくれたからなのか。私は窓ガラスに映る彼女の無防備な寝顔を見つめながら、このまま電車のレールが永遠の轍となって、どこまでも遠くまで続けばいいのにと強く願った。しかし同時に、そう願いながらも電車はいずれ終着駅に着き、そのような奇跡が叶わず終わることも、私は痛いほど知っていた。終点の大ターミナル、池袋駅に戻ってくる頃には、彼女の表情はいつものあの感情の消えた虚ろな仮面へと戻り始めていた。まばゆい非日常から、息苦しい日常へと引き戻される直前の、あの残酷な遷移の瞬間。それは私たちがどこかへ出かけるたびに、決まって訪れる暗転のようなものだった。楽しければ楽しいほど、帰りの電車の中で、彼女の魂は少しずつ、元の暗闇へと帰還していってしまう。</p>\n    <p>彼女のマンションの、薄暗い廊下の前で別れるとき、スター先輩はいつものトーンで言った。</p>\n    <p class=\"no-indent\">「ありがと。今日、本当に楽しかった」</p>\n    <p class=\"no-indent\">「うん。また行こう。どこでも」</p>\n    <p>私がそう言うと、彼女は形の良い唇を少しだけ歪めて、曖昧に笑った。</p>\n    <p class=\"no-indent\">「うん」</p>\n    <p>返ってきたのは、それだけだった。その短い「うん」が、次を期待する肯定の意味なのか、それともこれ以上言葉を探すのを放棄した結果の拒絶なのか、今の私には判別がつかなかった。でも彼女が最後に笑ったことだけは確かだった。それがどんなに歪で、寂しい種類の笑いであったとしても、彼女が私の前で笑ったという事実だけは誰にも奪えないものだと思いたかった。やがて重い鉄製の扉が閉まり、錠が降りる無機質な音が響いた。その瞬間、今日私たちが聴いた電車の駆動音も、遠い波の音も、金属のかちりという音も、すべてがその冷たい扉の向こう側に吸い込まれ、永遠に閉じ込められてしまったような気がした。それでも私の耳の奥にはまだあの激しい潮騒の残響が、消えずに鳴り響いているような気がした。</p>\n  </div>\n\n  <div class=\"section\" id=\"ch9\">\n    <h2 class=\"section-title\">第九話：ありがとう</h2>\n    <p>時は戻り、ＯＤをした次の日に風邪を引いたスター先輩の看病をしながら、私は時折、彼女の横顔を目でなぞった。熱でやや赤みを帯びた頬に、天井を見つめたまま虚ろな瞳。センター分けの髪が汗で額に張りつき、そこからちらりと覗く瞳は体調の悪さをものともせず、泉のように澄み切っていた。小さな鼻は愛らしく、唇はきゅっと締まって、苦しさを堪えるように薄く結ばれている。咳をするたびに肩が小刻みに揺れ、それが収まると、また静かな横顔に戻った。スター先輩は自分の顔に自信がないと言っていたが、私に言わせればそれは謙遜にしか聞こえなかった。彼女は単に理想が高いだけで自分が思っている以上に醜くはないし、自尊心が低いだけで彼女は自分が思っている以上に凛々しく、美しい。それが彼女に対する私の所感だった。</p>\n    <p>ところが、それに引き換えスター先輩の部屋はゴミの巣窟だった。卒塔婆のようにところ狭しに立ち並んだ空き缶。サイダー、エナジードリンク、コーラ。銘柄はまちまちだが、どれも潰さずに置かれているせいで、床は缶の底面で埋め尽くされていた。進路調査用紙が一枚、白紙のまま踏みつけられている。スナック菓子の袋は口が開いたまま横倒しになり、中身だったかけらが周囲に散らばり、壁際に積まれたコンビニ袋は、いくつかが中身の重さで底から破れかけていた。床に落ちていた保険証の上には、空になった咳止めの瓶がひび割れて転がっていた。処方薬ではなく市販のものだったが、瓶のラベルには手書きで何かが書かれていて、途中で消されていた。床のあちこちにはティッシュに包むのが億劫になったチューインガムが無数に張りつき、吐瀉物の跡が無惨にも散乱していた。どれも古いものらしく、色が変わっていた。救いがたい悪臭だった。腐敗と、埃と、何か酸っぱいものが混ざり合った匂いだ。これをすべてあの元彼のせいにしてしまいたい気持ちは分からなくもなかった。実際、あの一件があってからは状態が格段に悪化したと、スター先輩を昔から知っている友人たちは口を揃えて言った。しかしこの部屋の基礎は、それ以前からあった。生来の大雑把さと、片付けることへの根本的な無関心が長い時間をかけて積み重なって、今の状態がある。あの元彼の一件はダムを決壊させた最後の一押しに過ぎなかった。決壊そのものは、もっと前から始まっていた。そして何より彼女は自らこの混沌を育て、維持し続けていた。綺麗に片付けてしまえば自分の輪郭があまりに頼りなくなってしまうからだ。ゴミと埃と汚れに埋もれている間だけ、彼女は自分がここにいるという、ぼんやりした手応えを得られた。もちろん、私としてはこの状態をなんとかするべきなのではないかとも思った。でも彼女の両親はこの部屋を黙認しているし、スター先輩本人も誰にも手をつけさせない。片付けを申し出たことは何度かあったし、ゴミ袋を持参したこともあった。でも彼女は「いい」と言った。「これが私の部屋だから」と声を張った。その言葉には、意地とも達観ともとれる何かがあった。荒れた部屋を恥じているわけでも、開き直っているわけでもない。ただ静かに、これが自分の場所だと言っている声だった。外からどう見えるかと、本人がその場所をどう感じているかは、別の話だ。私はそれ以上、何も言えなかった。</p>\n    <p>最初にこの部屋に来て、無意識のうちにほっとしたときのことを私は思い出した。そしてそれは今でも、ずっと続いていた。散らかっていても、整えなくていい。汚れていても、綺麗にしなくていい。それは彼女に「裏」がないことを表していた。そして「裏」がないということは、相手を詮索しなくていいということだった。この部屋の中だけで、私はそうだった。彼女がこの混沌を手放さない理由を、私は頭では理解していた。それは彼女が自分の存在を確かめるためだった。自分の希薄な存在を、混沌の中で確かめようとしているのだ。しかし私もまたこの混沌に縋りついていた。この混沌を安息の地として扱っていた。そう言った意味では、私もまた彼女と共犯なのかもしれない。この混沌に身を沈めることで、彼女の人生に、彼女の生き方に、大きく加担し、依存していたのかもしれない。</p>\n    <p>少し熱が引いた午後、スター先輩はベッドに起き上がり、枕元に置いてあったゲームコントローラーを引き寄せた。</p>\n    <p>テレビに繋がれたゲーム機が、静かに起動した。</p>\n    <p class=\"no-indent\">「テトリスやろ」と彼女は言った。</p>\n    <p class=\"no-indent\">「体調悪いんじゃないの」</p>\n    <p class=\"no-indent\">「暇なんだよ」</p>\n    <p>断る理由もなかったので、私は床に積まれたスナック菓子の空袋を払いのけて胡座をかき、二つ目のコントローラーを拾い上げた。スター先輩はマイクポップコーンの袋を一つ取り出してきた。電子レンジで温めたばかりらしく、まだほかほかと湯気が立ち、バターの香りが部屋に広がった。</p>\n    <p class=\"no-indent\">「マイクポップコーンってさ、すごくいいんだよ」と彼女は言った。</p>\n    <p class=\"no-indent\">「そう」</p>\n    <p class=\"no-indent\">「食物繊維がめちゃくちゃ取れるんだよ。しかも量が多いから満足感がすごいし、カロリーもそんなに高くないし、完全食に近いと思う」</p>\n    <p class=\"no-indent\">「完全食」</p>\n    <p class=\"no-indent\">「完全食。これだけ食べてれば生きていける」</p>\n    <p class=\"no-indent\">「生きていけないと思うけど」</p>\n    <p class=\"no-indent\">「うるさい」と彼女は言って、一粒口に放り込んだ。それからゲームを起動させた。</p>\n    <p>スター先輩のテトリスは、異様なほど速かった。序盤から手が止まらず、次々に出現するブロックが、降ってくるたびに指が吸い寄せられるように動いた。迷いがなかった。ネクストウィンドウの先まで完全に予測しているかのように、ガガガッと激しいハードドロップの音が室内に響く。凸型のＴミノを狭い隙間に滑り込ませて鋭く反転させる『Ｔスピン』。そして右端の一列だけを綺麗に開けた盤面に、待ち構えていた長いＩミノを突き刺す４列同時消しの『テトリス』。彼女が息もつかせぬコンボでラインを消し去るたび、画面が鮮やかにフラッシュした。コントローラーを握る手つきが、他のどんな場面の彼女とも違って、確信に満ちていた。それに引き換え、私のフィールドは無惨だった。焦りから置きミスを連発し、二度と埋められない『穴』を残したまま、ブロックはみるみるうちに積み上がっていく。さらに彼女がテトリスを決めるたびに送り込まれるお邪魔ブロックが、私のフィールドを下から容赦なく押し上げた。窒息寸前のデッドラインを示す警告音がせわしなく鳴り響き、一分も経たないうちに画面がブロックで埋め尽くされた。ゲームオーバーだった。</p>\n    <p class=\"no-indent\">「遅い」とスター先輩は言った。画面に視線を固定したまま、ポップコーンをもう一粒口に入れた。</p>\n    <p class=\"no-indent\">「速すぎるんだよ」</p>\n    <p class=\"no-indent\">「集中してないから崩れるんでしょ。ちゃんと二手先まで考えてる？」</p>\n    <p class=\"no-indent\">「考えてるよ」</p>\n    <p class=\"no-indent\">「考えてないじゃん、今のライン」</p>\n    <p>私は反論できなかった。スター先輩はそのまま一人でしばらく続け、高得点を叩き出して、それからようやくこちらを向いた。</p>\n    <p class=\"no-indent\">「マリオカートもやる？」</p>\n    <p class=\"no-indent\">「負けるから嫌だよ」</p>\n    <p class=\"no-indent\">「やろう」</p>\n    <p>彼女はもう半分以上空になったポップコーンの袋を膝に置いて、慣れた手つきで画面をスクロールさせ、難解なテクニカルコースを選んだ。</p>\n    <p>結果は案の定だった。カウントダウンのシグナルが青に変わった瞬間、彼女のマシンだけが鋭いエキゾーストノートを響かせて飛び出した。ぐうの音も出ない完璧なロケットスタート。スター先輩は序盤から当たり前のように先頭集団に食い込んだ。ヘアピンカーブの手前で車体を深く傾け、タイヤから火花を散らしながらインコースのギリギリを攻める。ドリフトからのミニターボを狂いなく繋ぎ、瞬く間に単独首位へと躍り出た。アイテムの使い方も信じられないほど的確だった。背後から迫る追尾型の攻撃アイテムを、カートの後ろに引きずった防御アイテムでパシリと鮮やかに相殺する。そして最終ラップ、ここ一番という勝負どころ。彼女は手元に温存していたダッシュアイテムを点火した。本来なら泥濘に足を取られて減速するはずの荒地を、凄まじいスピードで突っ切るショートカット。その果敢なライン取りのタイミングは、彼女の感覚に完全に染みついていた。そして敵の追随を一切許さない独走状態のまま、彼女はチェッカーフラッグをくぐり、圧倒的な一位でゴールした。</p>\n    <p class=\"no-indent\">「また負けた」</p>\n    <p class=\"no-indent\">「当たり前でしょ」</p>\n    <p class=\"no-indent\">「なんでそんなに強いの」</p>\n    <p>スター先輩はポップコーンを一粒つまみながら、少し考えるような顔をした。</p>\n    <p class=\"no-indent\">「暇なときゲームしかすることないから」</p>\n    <p>その横顔に、得意そうな色がわずかに混じっていた。ゲームをしているときのスター先輩は、どこか別の生き物みたいだった。ひどい部屋の散らかりも、眠れない永遠のような夜も、胸に空いた虚しい穴も、そのあいだだけは遠のいているような気がした。少なくとも、私にはそう見えた。そして私は、そう見えることに対して純粋に喜んでいた。彼女が何かに没頭しているとき、私はその中に無条件にいることができた。ゲームで大敗していても、彼女の中にいることこそが、私にとっては何よりも大切なのではないかと思うようになった。そしてそれはある意味では、間違っていなかった。</p>\n    <p>日が傾いてきた頃、私は荷物をまとめた。空き缶の間を縫うように歩いて、鞄を拾い上げた。</p>\n    <p class=\"no-indent\">「じゃあ、帰るから」</p>\n    <p>扉に手をかけると、背後で布団が動く気配がした。</p>\n    <p class=\"no-indent\">「……ありがと」</p>\n    <p>振り返ると、スター先輩がこちらを見ていた。相変わらず髪は乱れ、頬はまだ赤い。それでも背筋を伸ばして、彼女はまっすぐにこちらを見ていた。</p>\n    <p class=\"no-indent\">「えっ？」</p>\n    <p class=\"no-indent\">「ありがとう」</p>\n    <p>二度目のそれは、一度目よりもわずかに大きかった。珍しく目を見て、感謝を言っていた。スター先輩は感謝を述べるとき、いつも恥ずかしがって目を逸らしてしまう癖がある。視線が床や窓の方へふらふらと逃げて、言葉だけが宙に残る。それがいつものスター先輩だった。</p>\n    <p class=\"no-indent\">「ちゃんと言えたね」</p>\n    <p>私がからかうように言うと、彼女は「うるさい」と吐き捨て、布団にくるまり、背中を向けてしまった。</p>\n    <p>毛布の端が額まで引き上げられ、黒髪だけが無邪気にはみ出している。</p>\n    <p class=\"no-indent\">「じゃあ、お大事に」</p>\n    <p>手を振って扉から出ようとすると、布団がわずかにずれた。スター先輩がちらりとこちらを見て、それから小さく手を振り返した。うるうるとした目だった。熱のせいかもしれないし、そうでないのかもしれない。どちらとも判断する前に、布団はまた閉じた。私は心の中で微笑みながら、スター先輩の部屋を後にした。廊下に出ると、悪臭がすっと遠のいた。階段を下り、マンションの自動ドアをくぐると、夜風が頬に当たった。明日には少し良くなっているだろうと、そう思っていた。疑いもせずに、そう思っていた。しかしその翌日、スター先輩は首を吊った。ととの形見である、あの首輪で。</p>\n  </div>\n\n  <div class=\"section\" id=\"ch10\">\n    <h2 class=\"section-title\">第十話：かちり</h2>\n    <p>彼女と一緒に首輪を買いに行った日のことを、私は今でも思い返している。それは夏が終わりに近づき、秋が始まろうとしていた頃のことだった。</p>\n    <p>その日部屋を訪ねると、スター先輩はいつも首元につけている「とと」の首輪を指先でつまんで、じっと見ていた。</p>\n    <p class=\"no-indent\">「ボロボロになっちゃった」と彼女は言った。</p>\n    <p>よく見てみると、首輪は原型を留めないほどボロボロになっていた。革は乾燥してひび割れ、端のほうが薄く剥がれかけていた。金具の光沢も消えていた。ととが生きていた頃から数えれば、何年も首に巻き続けてきたものだった。ボロボロになるのも、無理はなかった。</p>\n    <p class=\"no-indent\">「これ、もうつけるのは厳しいかも」と彼女は小さく言った。声の底に、何かが沈んでいた。</p>\n    <p class=\"no-indent\">「どうするの、その首輪」と私は尋ねた。</p>\n    <p class=\"no-indent\">「わからない。でも、捨てたくはない」</p>\n    <p>彼女はまるでととが遺していった温もりが、まだその古びた革の一片にだけ辛うじて残っているかのように、首輪を愛おしそうに見つめていた。</p>\n    <p class=\"no-indent\">「でもだからって、それをつけるわけにもいかないよね」</p>\n    <p class=\"no-indent\">「そう、だね」</p>\n    <p>部屋の中に気まずいというよりは、どこか諦めを含んだ沈黙が流れた。窓の外からは心なしか勢いを失った蝉の声が途切れ途切れに聞こえてくる。</p>\n    <p class=\"no-indent\">「首輪はつけていたいの？」と私は尋ねた。</p>\n    <p class=\"no-indent\">「うん。ととが死んでから、ずっとつけてたから、今さらつけないのは違和感ある」</p>\n    <p class=\"no-indent\">「そっか──」</p>\n    <p>私は彼女の細い首元に目をやった。そこには首輪の跡が薄く残っていた。</p>\n    <p class=\"no-indent\">「代わりになるかはわからないけどさ」と私は言った。「もしよかったら、他の首輪見てみない？」</p>\n    <p class=\"no-indent\">「他の首輪？」</p>\n    <p class=\"no-indent\">「うん、そうすれば首元は寂しくないだろうし」</p>\n    <p class=\"no-indent\">「……でも」</p>\n    <p>彼女はしばらく古い首輪を見ていた。とととの思い出まで上書きしたくないと、彼女の横顔が語っていた。</p>\n    <p class=\"no-indent\">「新しいのにして、いいのかな」</p>\n    <p>古い革に触れる彼女の指先が震えていた。置いていかれることを恐れるような、あるいは置いていくことを恐れるような頼りない手つきだった。</p>\n    <p class=\"no-indent\">「いいと思うけどな」と私は言った。「別に首輪自体を捨てるわけじゃないんだしさ」</p>\n    <p>彼女は私の言葉を咀嚼するように、何度か瞬きをした。その瞳の奥にある迷いを少しでも振り払いたくて、私はわざと明るい声を絞り出した。</p>\n    <p class=\"no-indent\">「とりあえず、ホームセンターでも行ってみる？」</p>\n    <p class=\"no-indent\">「ホームセンター？」</p>\n    <p>私は頷いた。</p>\n    <p class=\"no-indent\">「ほら、ホームセンター行ったら何かはあると思うし」</p>\n    <p class=\"no-indent\">「ホームセンター」と彼女は繰り返した。</p>\n    <p>少しだけ可笑しそうにその言葉を口ずさんだあと彼女は「そうだね」と言って、ほんの少しだけ口元を緩めた。その表情を見て、私は息を吐き出した。</p>\n    <p>ホームセンターは街外れの丘の上にあった。私はスター先輩を自転車の後ろに乗せて、丘を一気に駆け上がった。真夏だったこともあり、ペダルを一回漕ぐたびに、額から汗が吹き出た。スター先輩は私の腰に手を回しながら、頑張ってーと感情のこもってないエールを送り続けていた。自転車の車輪はパリパリと音を立てながら、路上に転がっている蝉の亡骸を無惨に踏み潰している。街路樹にとまった蝉たちは、仲間の残骸に咽び泣くようにおどろおどろしく鳴いている。私はペダルを漕ぎながら、なんだか青春映画みたいだなと思った。青春映画というものには、不思議な嘘くさい澄み切り方がある。登場人物たちがどれほど傷ついても、画面は美しく、音楽は甘く、時間は光の中でゆっくり流れる。実際の青春はもっと汗臭くて、もっとぐじゃぐじゃで、もっと意味不明だ。でも、あの瞬間だけは、本当に純粋に映画みたいだと思った。私の背中に手を回したスター先輩と、踏み潰される蝉の死骸と、鳴き続ける蝉たちと、真夏の坂道。なんだかあまりにも出来上がっていて、この場面はあとで絶対に思い出すやつだと、その瞬間にわかった。</p>\n    <p>休日ということもあり、ホームセンターは家族連れで混雑していた。自転車を駐輪し、店内に入ると冷房のひんやりとした風が頬をかすめた。蛍光灯の乾いた光がスター先輩の白い肌を照らし、資材コーナーの切り立ての木材の香りが鼻腔をくすぐった。季節の温度から切り離された均質な明るさが、金属棚に並ぶ商品を無機質に照らし、粉塵を含んだコンクリートの床が靴底に薄くざらついた感触を残した。あまりホームセンターに来たことがないのか、スター先輩はその巨大な空間をぐるっと一周見回してから、目についた売り場を物色し始めた。何十種類もある除草剤をまるで工芸品でも鑑賞するみたいにじっと眺め、アウトドア用品を見つけると、アクセサリーを吟味するみたいに一つひとつ手に取って時折、振り回し、金具や工具の売り場を見つけると、ハンマーどこ？と辺りをしきりに見回した。</p>\n    <p class=\"no-indent\">「ハンマー使って何するの？」</p>\n    <p class=\"no-indent\">「ＤＩＹ」</p>\n    <p class=\"no-indent\">「できるの？」</p>\n    <p class=\"no-indent\">「わかんない。でも、棚とか作ったら部屋オシャレになりそうだし」</p>\n    <p class=\"no-indent\">「オシャレする前に、綺麗にしようね、あの汚部屋」</p>\n    <p class=\"no-indent\">「うるさい」</p>\n    <p class=\"no-indent\">「掃除用具は向こうだよ？」</p>\n    <p class=\"no-indent\">「あーもう、うるさい」</p>\n    <p>私が背を向けて掃除用具を探しに行こうとすると、彼女は私の腕をぎゅっと引っ張って、引き留めた。そしてそのまま売り場の奥へとずんずん歩いていった。ペット用品のコーナーは資材売り場と、防虫剤の棚に挟まれたかたちで、ひっそりと存在していた。犬や猫の写真が笑顔でパッケージを飾り、カラフルなおもちゃや、大小さまざまなゲージが所狭しと陳列されていた。しかしスター先輩は立ち止まることなく、その通路をゆっくりと歩き進んだ。フードコーナーを通り抜けると、壁際に首輪とリードの棚があった。スター先輩はそこで足を止めると、しゃがみ込み、指先で一つひとつの首輪を撫でていった。革の縫い目をなぞり、金具を指で弾いた。前髪の隙間からのぞく瞳はうつろで、首輪よりもはるか遠くをとらえているように見えた。</p>\n    <p class=\"no-indent\">「これ、どう思う」</p>\n    <p>振り返りもせずにそう言って、彼女は細いナイロン製の首輪を持ち上げた。淡いピンク色で、小さな鈴がついている首輪だった。揺れるたびにかすかな音が空気に混じった。私は一歩距離を詰めて、それを覗き込んだ。</p>\n    <p class=\"no-indent\">「……ちょっと派手すぎると思う」</p>\n    <p>私の返答に、スター先輩は返事をしなかった。ただ指先で鈴をつまみ、鳴らさないように押さえ込んでから、そっと棚へ戻した。そして代わりに手に取ったのは黒い革の首輪だった。幅が広く、鋲が打ち込まれている。光沢は鈍く、凶暴な犬が首に巻き付けているようなものだった。彼女はそれを掌に乗せ、しばらく動かなかった。何かを測るように、何かを見定めるように目だけが静かに動いていた。</p>\n    <p class=\"no-indent\">「重いね」</p>\n    <p>彼女は独り言のように言って、今度は腕に巻きつけた。革が擦れる低い音がして、金具が皮膚に当たった。私はその様子を見ていることに、微かな居心地の悪さを覚えた。視線の置き場が見つからず、隣の棚に並ぶドッグフードの袋へと静かに目を移した。乾燥した肉の匂いが、わずかに鼻についた。</p>\n    <p class=\"no-indent\">「これにしよっかな」と彼女は言った。</p>\n    <p>黒い首輪がぎらりと光った。彼女の手首はびっくりするくらい細く、首輪の無骨さがかえって際立った。</p>\n    <p class=\"no-indent\">「前の首輪と似てないけどいいの？」と私は言った。</p>\n    <p class=\"no-indent\">「うん」</p>\n    <p>彼女はそれをしばらく掌の上で転がしていた。それから顔を上げて、私を見た。</p>\n    <p class=\"no-indent\">「ねえ」と彼女は言った。</p>\n    <p class=\"no-indent\">「なに」</p>\n    <p class=\"no-indent\">「正直に言っていい？」</p>\n    <p class=\"no-indent\">「うん、何？」</p>\n    <p>蛍光灯の無機質な光が、彼女の瞳の奥をじっと射抜いていた。世界からすべての雑音が消え失せたかのような、ひやりとした沈黙が満ちていく。</p>\n    <p class=\"no-indent\">「私さ、きっとととになりたかったんだと思う」</p>\n    <p>声のトーンが、さっきまでと違った。軽口でも、冗談の前置きでもない。ただ事実をそっと言葉にするような、静かな声だった。</p>\n    <p class=\"no-indent\">「ととに？」と私は聞き返した。</p>\n    <p class=\"no-indent\">「うん。誰かのそばにいて、帰ってきたら喜んで、それだけで許してもらえるような。そういうととみたいなのに」</p>\n    <p>彼女は首輪を膝の上に置いて、棚の一点を見た。視線の先に何かがあるわけではなかった。</p>\n    <p class=\"no-indent\">「ととのこと最初に見たとき、あの子がうらやましかったんだよ。ガラスの向こうで無邪気に尻尾を振って、誰かに見つけてもらおうとしてて。あんなふうに自分をさらけ出せたら、どれだけいいんだろうって」</p>\n    <p>私は何も言わなかった。</p>\n    <p class=\"no-indent\">「ほら、人間って色々と隠そうとするからさ。隠して、隠して、それでいつの間にか、何をどこに隠したのかも忘れちゃってさ」</p>\n    <p>冷房の風が通路を通り抜けた。遠くで子どもが何かを叫ぶ声がして、すぐに遠ざかった。</p>\n    <p class=\"no-indent\">「だから首輪つけてたの？」と私は聞いた。聞いてから、踏み込みすぎたかと思った。</p>\n    <p>しかし彼女は怒らなかった。少し考えてから、答えた。</p>\n    <p class=\"no-indent\">「最初は、ととを忘れないためだったんだよ。でもいつの間にか、それだけじゃなくなってた」</p>\n    <p class=\"no-indent\">「というと？」</p>\n    <p class=\"no-indent\">「首輪つけてると、自分がここにいる感じがするんだよ」</p>\n    <p>彼女の細い首元だけが、妙に生々しく浮き上がって見えた。私は喉の奥が乾いていくのを感じながら、ただじっと彼女を見つめていた。</p>\n    <p class=\"no-indent\">「変でしょ？」</p>\n    <p class=\"no-indent\">「変じゃないよ、きっと」</p>\n    <p class=\"no-indent\">「変だよ」</p>\n    <p class=\"no-indent\">「変じゃない、と思う。たぶん」</p>\n    <p>彼女は私の顔を少し見てから、目を逸らした。</p>\n    <p class=\"no-indent\">「誰かのものになりたかったんだと思う。本当は」</p>\n    <p>その言葉はひどく静かに出てきた。大きな声で叫ぶような言葉ではなく、長い時間をかけてようやく水底から浮かんできたような言葉だった。</p>\n    <p class=\"no-indent\">「誰かのものになれたら、ここにいていい理由になるから。ほら、飼い犬みたいに。そういう理由がほしかったんだと思う、きっと」</p>\n    <p>私は何も言えなかった。何かを言うべきだと思った。自分のものになってほしいだとか、そんなものがなくてもここにいていいだとか、言葉はいくらでも思い浮かんだ。だけど彼女の言葉の重さに、そんな無責任な言葉で応じることが、本当に正しいのか私にはわからなかった。</p>\n    <p>スター先輩はまた首輪を手に取った。それをゆっくりと自分の首にあてがった。売り場の中で。家族連れが行き交う、蛍光灯の下で。バックルを留めて、顎を少し上げた。鏡代わりに金属棚の曇った反射面で自分の首元を確認してから、小さく息を吐いた。</p>\n    <p class=\"no-indent\">「似合う？」</p>\n    <p>似合う、という言葉が出てきたことに、私は少し驚いた。彼女がそういう問いを人に向けることは、ほとんどなかったからだ。</p>\n    <p class=\"no-indent\">「似合うよ」と私は答えた。嘘ではなかった。ただそれは見た目の話ではなく、もっと別の何かの話だったような気もした。</p>\n    <p>彼女はバックルを外した。首輪を手の中に収めて、立ち上がった。</p>\n    <p class=\"no-indent\">「これ、買うね」</p>\n    <p class=\"no-indent\">「うん」</p>\n    <p class=\"no-indent\">「あと、マジックも買う」</p>\n    <p class=\"no-indent\">「マジック？　何に使うの」</p>\n    <p class=\"no-indent\">「ひみつ」</p>\n    <p>文具コーナーで細字の黒マジックを一本買い足して、レジに向かった。合計で千三百円ほどだった。店員に首輪とマジックを袋に入れてもらい、店を出た。外の空気は相変わらず蒸し暑く、アスファルトから熱が立ち上っていた。駐輪場へ向かいながら、スター先輩は少し後ろを歩いていた。ふいに足音が止まった。振り返ると、彼女は荷物を地面に置いて、首輪を袋から取り出し、その内側に何かを書いていた。</p>\n    <p class=\"no-indent\">「何書いてるの」</p>\n    <p class=\"no-indent\">「ひみつ」</p>\n    <p>マジックの蓋を戻して、首輪を袋に戻した。レジ袋の口をひと結びして、自転車の籠に放り込んだ。</p>\n    <p class=\"no-indent\">「乗って」と私は言った。</p>\n    <p class=\"no-indent\">「うん」と彼女は言った。</p>\n    <p>荷台に足をかけて乗り込むと、腰に手が回った。いつもより少しだけ力が入っていた気がした。あるいは気のせいかもしれなかった。</p>\n    <p>帰り道は下り坂だった。ペダルを漕がなくても自転車は自然と加速していく。風が正面から押し返してくるみたいに顔に当たって、目が細くなった。丘を下り始めると、風が強く吹いた。服が風になびき、バタバタと音を立てていた。蝉の声がそっと遠ざかり、アスファルトの照り返しが肌をじりじりと焼いていた。スター先輩は何も言わなかった。ペダルを踏むごとに、蝉の死骸を踏む小気味いい音がして、街路樹が私たちの額に影を落とした。</p>\n    <p class=\"no-indent\">「ねえ」とスター先輩が言った。</p>\n    <p class=\"no-indent\">「なに」</p>\n    <p class=\"no-indent\">「もし十年後にさ」</p>\n    <p class=\"no-indent\">「うん」</p>\n    <p class=\"no-indent\">「今日のこと思い出したとき、悲しくなると思う？」</p>\n    <p>後ろから聞こえる声は、風に少し削られていた。</p>\n    <p class=\"no-indent\">「どういうこと？」</p>\n    <p class=\"no-indent\">「いや、十年もあったら楽しい思い出も、悲しくなっちゃうのかなって」</p>\n    <p>少しだけ考えてから、私は言った。</p>\n    <p class=\"no-indent\">「それは十年後になってみないとわからないよ」</p>\n    <p class=\"no-indent\">「そう？」</p>\n    <p class=\"no-indent\">「うん」と私は頷いた。「それにそんなこと今から考えることじゃない」</p>\n    <p class=\"no-indent\">「今から考えることじゃない、か」</p>\n    <p>自転車のチェーンが小さく鳴った。しばらく誰も喋らなかった。やがて彼女がぽつりと言った。</p>\n    <p class=\"no-indent\">「ずっと遠くまで来ちゃったな、って思うんだろうね」</p>\n    <p class=\"no-indent\">「えっ？」</p>\n    <p class=\"no-indent\">「いや、十年後に」</p>\n    <p>遠くまで来ちゃった。その言葉が、やけに長く耳に残った。</p>\n    <p class=\"no-indent\">「でも──」</p>\n    <p>彼女は一呼吸置いた。</p>\n    <p class=\"no-indent\">「今年は、ちゃんと夏を過ごせた気がする」</p>\n    <p>はっきりとした声音だった。</p>\n    <p class=\"no-indent\">「ほんとに？」と私は言った。</p>\n    <p class=\"no-indent\">「うん。もちろん色々あったけどさ、プールも、花火も、海も、楽しかったのは事実」</p>\n    <p class=\"no-indent\">「そっか」</p>\n    <p class=\"no-indent\">「だから、きっと楽しかったことは変わらないんだと思う。たとえそれが悲しい思い出になっても」</p>\n    <p class=\"no-indent\">「そうだね」</p>\n    <p>風が強くなった。下り坂の傾斜が急になって、自転車のスピードが上がった。スター先輩の手が、私の腰をわずかにきつく握った。</p>\n    <p class=\"no-indent\">「ありがとうね。一緒に付き合ってくれて」</p>\n    <p class=\"no-indent\">「え？」</p>\n    <p class=\"no-indent\">「いや、楽しかったからさ」</p>\n    <p>私は素直に驚いた。</p>\n    <p class=\"no-indent\">「何もしてないよ、私は」</p>\n    <p class=\"no-indent\">「何もしてなくないよ、うん、何もしてなくない」</p>\n    <p>言葉の意味を確かめるような声だった。背中に触れている彼女の体温だけが、風の中でやけに確かだった。</p>\n    <p class=\"no-indent\">「あの首輪はどうするの？」と私は話を逸らした。</p>\n    <p class=\"no-indent\">「ととの首輪？」</p>\n    <p class=\"no-indent\">「うん」</p>\n    <p>風が吹いた。自転車のスピードが、坂の傾斜に乗ってさらに上がった。</p>\n    <p class=\"no-indent\">「捨てるつもりはないよ」と彼女は言った。</p>\n    <p class=\"no-indent\">「じゃあ、とっておくの？」</p>\n    <p class=\"no-indent\">「うん。万が一のときのために」</p>\n    <p class=\"no-indent\">「万が一？」</p>\n    <p>私の声は、風に削られながらも、確かにそこにあった。いや、そこにあるはずだった。</p>\n    <p class=\"no-indent\">「万が一のときって、どういうこと？」</p>\n    <p class=\"no-indent\">「不測に備えるってこと」</p>\n    <p>彼女は少し間を置いてから、答えた。</p>\n    <p class=\"no-indent\">「どういうこと？」</p>\n    <p class=\"no-indent\">「いずれわかるよ──」</p>\n    <p class=\"no-indent\">「ほんとに？」</p>\n    <p class=\"no-indent\">「うん」</p>\n    <p>なんとなく、それ以上は聞かなかった。自転車は坂を下り続けた。風が吹くたびに、スター先輩の前髪が私の背中を掠めた。蝉の声が遠ざかり、街の音が少しずつ戻ってきた。アスファルトに咲く花が、陽炎でゆらいでいた。遠くの方で烏が二羽飛んでいた。自転車の籠の中には首輪の入ったレジ袋が収められていた。車輪が段差を踏むたびに、レジ袋は形を崩し、中からぎらりと首輪をのぞかせた。首輪の内側には、地べたで書いたことがわかる少し歪んだ文字で『ととちゃん』と書かれていた。彼女は段差で体が横に揺れても、何も言わなかった。私も時折体が触れ合っても、何も言わなかった。</p>\n    <p>やがて坂が終わり、道が平らになった。その瞬間、潮が引くみたいに夏の情景が遠ざかっていった。髪をなびかせる乾いた風も、蝉たちの悲鳴に似た鳴き声も、アスファルトに漂う陽炎も、何もかもが私の体から遠ざかっていった。静かだ、と思った。美しい、と思った。だけどそんな胸の高鳴りは、すぐに消えてしまった。盛りを過ぎた夏が遠ざかっていく。かちり、と乾いた音が耳に触れる。その瞬間、スター先輩の手がゆっくりと腰から離れた。</p>\n  </div>\n\n\n</main>"},{"id":"okaki","number":"III","title":"おかきくんの不倫","subtitle":"Okaki-kun's Affair","desc":"「不倫のエロいところって<br>誰も幸せにならないところだよね」<br>そんな言葉を喫茶店で口にした翌日、<br>おかきくんの不倫が発覚した。<br>相手は年上の人妻らしい。","content":"<div id=\"toc\">\n  <ol>\n    <li><a href=\"#ch0\">プロローグ</a></li>\n    <li><a href=\"#ch1\">第一話：喫茶「昭和」にて</a></li>\n    <li><a href=\"#ch2\">第二話：発覚について</a></li>\n    <li><a href=\"#ch3\">第三話：おかきくんについての考察</a></li>\n    <li><a href=\"#ch4\">第四話：葉月さんという人について</a></li>\n    <li><a href=\"#ch5\">第五話：愛と罪、あるいは責任への追及</a></li>\n    <li><a href=\"#ch6\">第六話：葉月さんの残影</a></li>\n    <li><a href=\"#ch7\">第七話：長い、長い独白</a></li>\n    <li><a href=\"#ch8\">第八話：長い、長い糾弾</a></li>\n    <li><a href=\"#ch9\">第九話：長い、長い手紙</a></li>\n  </ol>\n</div>\n\n\n<main id=\"honbun\">\n\n  <div class=\"section\" id=\"ch0\">\n    <h2 class=\"section-title\">プロローグ</h2>\n    <p>不倫のエロいところって誰も幸せにならないところだよね、とおかきくんは言った。翌日、おかきくんの不倫が発覚した。これが事の発端である。もっとも「事の発端」などという勇ましい言葉を使ってはみたものの、当のおかきくん本人は発覚の翌日も学食でカレーライスを食べており、その顔には悔恨の色もなければ羞恥の陰りもなく、ただいつもと同じ、ほんのわずかに翳りを帯びた童顔で、隣の席の女子学生の話を聞いていたのであるから、「事の発端」などという言葉は、実際のところ当てはまらないかもしれない。発端とは何かが始まる場所のことだが、おかきくんにとってはむしろ、何かが静かに終わる場所のことだったのかもしれない。しかし僕にとっては確かに、あの十一月の雨の夕方こそが、この物語の始まりだった。</p>\n  </div>\n\n  <div class=\"section\" id=\"ch1\">\n    <h2 class=\"section-title\">第一話：喫茶「昭和」にて</h2>\n    <p>その喫茶店は、あまりに奇妙な場所だった。大通りから一本入った路地の奥、煤けたコンクリートの外壁は、高度経済成長期の熱気がそのまま冷め切ったような佇まいを見せている。立て付けの悪いアルミの引き戸を引くと、ガタガタと乾いた音が鳴り、同時に湿った珈琲豆と古い絨毯の匂いが鼻を突く。店内の琥珀色の壁からは、全盛期の石原裕次郎のポスターが、どこか現実離れした遠い目で客席を見下ろしていた。スピーカーから流れる有線放送の昭和歌謡は高音がかすれ、低音がこもった特有の音響で店内の空気を満たしている。カウンターの奥に佇むマスターは深く刻まれた目尻の皺や白髪交じりの髪から一見すると七十代の重みを醸し出しているが、実年齢は五十代半ばという、年齢の辻褄が合わない不思議な男だった。注文のたびにサイフォンで淹れられる珈琲は、酸味が強く、正直なところ格別に美味しいわけではない。しかしおかきくんは、その店を深く愛していた。彼は週に三日、決まった時間帯に現れては、決まって窓際の使い古されたソファに深く腰掛けた。冷めていく珈琲の湯気をただ見つめ、文庫本を開くでもなく、携帯を弄るでもなく、ただゆっくりと時間を消費していった。僕も彼に引っ張られて通ううちに、いつの間にかその空間の居心地に馴染み、気づけば常連の端くれになっていた。人間は自分が好む場所に似てくる、という説があるが、おかきくんとこの喫茶店の関係を眺めていると、その言葉が真実のようにも思えるし、あるいは決定的な間違いのようにも思えた。店はどこまでも昭和的で、飾り気がなく、時が止まったような枯れた雰囲気を持っている。その点においては、実直で素朴な「おかき」という菓子のイメージに滑稽なほど合致していた。しかし、当のおかきくん自身は、昭和の生まれでもなければ、素朴でも枯れてもいなかった。整えられた指先に、どこか湿っぽさを含んだ柔らかな声、そして他人の視線を否応なく惹きつける独特の空気。彼はその古びた空間の中でもっとずっと奇妙で、不思議なほどに艶めかしい色気を放っている人間だった。その日、十一月の雨が降り始めた夕方も、僕とおかきくんはいつものテーブルに向かい合って座っていた。おかきくんは珈琲カップを両手で包んで、冷えた体を温めながら、窓の外の雨を眺めていた。</p>\n    <p class=\"no-indent\">「不倫のエロいところって誰も幸せにならないところだよね」</p>\n    <p>おかきくんはそう言った。使い古されたスプーンで冷めかけた珈琲をゆっくりとかき混ぜながら、ごく自然にその言葉を空間に落とした。問題は言い方であった。「エロい」という、本来なら卑俗な熱を帯びるはずの単語を、あの男はまるで精密な学術用語でも口にするような調子で発音したのだ。声のトーンは一定で、何ら感情の起伏もなく、ただ普遍的な事実を淡々と述べるみたいだった。そのあまりのギャップに、僕は危うく珈琲を吹き出すところだった。しかしおかきくんは小さくむせた僕の様子を見て、不思議そうに片方の眉を少しだけ上げた。「どうしたの？」という顔だった。芝居がかったところは一切なく、本当に心底、僕の動揺の理由がわからないという無垢な顔だった。</p>\n    <p class=\"no-indent\">「……どうしたの、ではなくて」と僕は咳き込みながら、ハンカチで口元を拭った。「何の話をしているんだ、君は」</p>\n    <p class=\"no-indent\">「不倫の話」</p>\n    <p class=\"no-indent\">「なぜ今、不倫の話になるんだ」</p>\n    <p class=\"no-indent\">「なんとなく」とおかきくんは言った。彼が視線を向けた窓の外では、先ほどまで細かく煙るように降っていた雨が、いつの間にか大粒の重い雨脚へと変わっていた。ガラス窓を激しく叩く水滴が、外の暗い街並みを歪ませている。「雨の夕方って、なんか不倫のこと考えない？」</p>\n    <p class=\"no-indent\">「断じて考えない」</p>\n    <p>僕が即座に否定すると、「そうかな。僕は考えるけどな」と、おかきくんは少しだけ唇の端を吊り上げて微笑んだ。</p>\n    <p>店内の琥珀色の壁からは、セピア色に変色しかけた石原裕次郎が、やはり現実離れした遠い目で僕たちの会話を無表情に見下ろしていた。スピーカーから流れる有線のBGMは、ちょうど「神田川」に切り替わったところだった。湿ったヴァイオリンのイントロが、重苦しい雨の夕暮れに妙にまとわりつく。確かに雨と不倫と昭和歌謡は、ある意味で文化的に隣接した概念かもしれない、と僕は頭の片隅で思ったが、それを口にして認めてしまうと、話がさらに不可解な方向へ進みそうだったので、黙って珈琲カップを机に置いた。</p>\n    <p class=\"no-indent\">「それで」と僕は姿勢を正した。「誰も幸せにならない、というのが、なぜエロいんだ」</p>\n    <p>おかきくんは、白磁のカップを細い指先で持ち上げ、珈琲を一口小さく飲んでから答えた。</p>\n    <p class=\"no-indent\">「不倫って関わった全員が何かを失うじゃない。浮気をした側は後ろめたさを抱えるし、された側は傷つくし、浮気相手もどこかで苦しい思いをする。でも、それをわかって飛び込んでしまう、その自棄っぱちな感じが、なんというか」</p>\n    <p class=\"no-indent\">「人間らしい？」</p>\n    <p class=\"no-indent\">「そう。人間らしいっていうか、人間の業の深さっていうか。計算や合理性じゃなくて、もっと原始的な何かに引きずられるその感じが、エロいというという意味で言ってるんだけど」</p>\n    <p class=\"no-indent\">「それはエロさとは言わないのではないか」と僕は言った。</p>\n    <p class=\"no-indent\">「そう？ 僕はそう思うんだけどな。エロさって、本質的には理性の敗北でしょ。理性が感情に負ける瞬間。不倫って理性的に考えれば、明らかに割に合わない行為なのに、それでもしてしまうという意味で、エロさの一形態だと思うんだよね」</p>\n    <p class=\"no-indent\">「それは少し哲学的すぎる定義ではないか」</p>\n    <p class=\"no-indent\">「哲学的かな」</p>\n    <p>おかきくんは少し顎を引き、自分の指先を見つめるようにして考え込んだ。</p>\n    <p class=\"no-indent\">「でも僕はエロさと哲学って、わりと近いところにあると思ってるんだけどね。どっちも、人間の生きる条件の核心に触れようとする試みだから」</p>\n    <p>有線から流れる「神田川」の、あのかすれた歌声が、ちょうど「あなたはもう忘れたかしら」という、やけに感傷的なくだりに差し掛かった。この静かな喫茶店の空気に対して、あまりにもタイミングが良すぎた。</p>\n    <p class=\"no-indent\">「不倫は、したことあるのか？」と僕は、探るように聞いた。</p>\n    <p class=\"no-indent\">「ないよ」とおかきくんは即答した。迷いのない、澄んだ声だった。「そこだけは守ってきた」</p>\n    <p class=\"no-indent\">「なぜ」</p>\n    <p class=\"no-indent\">「なんでだろうね」と彼は言い、また視線を僕から外して、激しく打ちつける窓の外の雨を見た。</p>\n    <p class=\"no-indent\">「なんかダメな気がするんだよ。自分でもよくわからないんだけど。超えてはいけない一線みたいな」</p>\n    <p class=\"no-indent\">「道徳的な感覚？」</p>\n    <p class=\"no-indent\">「道徳的、かな。でも道徳って言うと少し違う気がする。道徳は外側から来るものだけど、その感覚は内側から来る感じがするから」</p>\n    <p class=\"no-indent\">「良心？」</p>\n    <p class=\"no-indent\">「良心、に近いかも。でも良心って言うと、少し清らかすぎるような気もする」</p>\n    <p class=\"no-indent\">「では何と言えばいい」</p>\n    <p>おかきくんはしばらく黙ったまま、薄暗くなっていく外の景色を見つめていた。雨に濡れたアスファルトに遠くの街灯の光がにじんで広がっている。</p>\n    <p class=\"no-indent\">「うまく言えない」と彼は最終的に言った。</p>\n    <p>僕はその曖昧な答えを、当時は特に深く勘繰ることもなく、彼のいつもの気まぐれな哲学ごっこの一部として聞き流していた。</p>\n    <p>──翌日、おかきくんの不倫が発覚するまでは。</p>\n  </div>\n\n  <div class=\"section\" id=\"ch2\">\n    <h2 class=\"section-title\">第二話：発覚について</h2>\n    <p>不倫発覚というのは、一見すると大層な事件を予感させる言葉のようにも聞こえるが、おかきくんの場合、言葉の響きほどは劇的でもなければ、修羅場めいた緊迫感があるわけでもなかった。具体的に何が起きたかというと、その日の午後、僕が講義の合間に大学の中庭を歩いていたら、おかきくんの友人である桐島が、息を切らせて向こうから走ってきたのである。彼は僕の目の前でぴたりと足を止めると、おかきの不倫がバレたらしい、とそれだけを一方的に告げて、僕の反応を待つこともなく、再び別の方向へと颯爽と走り去っていった。耳に残ったのは彼のスニーカーが砂利を蹴る乾いた音だけだった。残された僕は、事情が飲み込めないまま、しばらく雲一つない秋晴れの高い空の下にぽつんと立ち尽くすしかなかった。</p>\n    <p>ここで、桐島という男について少し説明しておく必要がある。桐島は、この大学のキャンパスにおいて、あらゆる人間関係の流通を一手に担っている奇妙な人物であった。誰と誰が付き合い始めたとか、誰が誰に告白して振られたとか、あのサークルの幹部同士が険悪になっているとか、そういった類の噂話をいつどこで仕入れてくるのか、その情報源はまったくの謎だった。ただ、彼の頭脳には常に最新の相関図がアップデートされていた。彼は情報の詳細な精度よりも、とにかく速度を重視するタイプの人間で、登場人物の所属や時期といった細部は往々にして不正確であったが事件の骨組みという大筋においては、不思議と信頼できた。</p>\n    <p>足早に去っていった桐島の断片的な言葉によれば、おかきくんの不倫の相手は「年上の人妻」だという。それ以上の年齢も、出会った経緯も、詳細は一切不明だった。僕はその日の夜、自宅のベッドに横たわりながら、スマートフォンの画面を眺め、迷った末におかきくんに短いメッセージを送った。数分後、画面には確かに「既読」の文字がついた。しかし、日付が変わっても彼からの返信の振動がスマートフォンの端末を震わせることはなかった。</p>\n    <p>翌日、僕はいつものように大学へ行き、昼休みの混雑した学生食堂でおかきくんの姿を見つけた。彼は窓際の日当たりの良い席に座り、いつもとまったく変わらない平然とした様子で、スプーンを動かして大学食堂の安価なカレーライスを口に運んでいた。彼の両隣には同じ学部の女子学生が二人座っており、何事かを楽しそうに話しながら、時折声を上げて笑っていた。おかきくんもそれに合わせて、薄く微笑みながら小さく頷いている。その光景のどこを見渡しても、前日に不倫が外部に「発覚した」ばかりの男が醸し出すべき陰影や、動揺の破片などは微塵も見当たらなかった。</p>\n    <p class=\"no-indent\">「おかきくん」</p>\n    <p>喧騒のなかで声をかけると、彼は手にしたスプーンを皿の端に置き、ゆっくりとこちらを振り返った。「あ、僕のこと？」と、まるで見知らぬ人に呼び止められたかのような、屈託のない調子で言った。</p>\n    <p class=\"no-indent\">「そうだ。話を聞きたいんだ」</p>\n    <p class=\"no-indent\">「話ね、なんだい？」</p>\n    <p>彼は両隣の女子学生たちに「ちょっとごめんね」と、小さく手を上げて断りを入れ、トレイを持ち上げて僕と一緒に席を移った。移動したのは、昼時を過ぎて人口密度の低くなった食堂の端っこの誰も座っていない窓際のテーブルである。大きなガラス窓の向こうでは、乾いた数枚の枯れ葉が、冷たい秋風に煽られてコンクリートの地面を不規則に転がっていた。</p>\n    <p class=\"no-indent\">「不倫したって、本当か？」と、僕はトレイを置くのも忘れて、声を潜めて聞いた。</p>\n    <p class=\"no-indent\">「したよ」と彼は言った。</p>\n    <p>その声には何のてらいも、秘密を暴かれた者の動揺もなかった。まるで「うん、昨日ラーメン食べたよ」と、日常の些細な行動を報告するような、ひどく平板な調子だった。</p>\n    <p class=\"no-indent\">「どういうことだ。昨日言ってたじゃないか。不倫はしたことないって」</p>\n    <p>おかきくんは視線を斜め下に落とし、自分の爪の先をしばらく見つめてから、何かを思い出すように少し考えた。</p>\n    <p class=\"no-indent\">「うーん、確かに言ったね。でも、あのときはまだ不倫が発覚してなかったからさ」</p>\n    <p class=\"no-indent\">「どういうことだ？」</p>\n    <p class=\"no-indent\">「だって、不倫って発覚して初めて『した』って言えるものじゃない？」</p>\n    <p>僕はしばらく、その言葉の輪郭をなぞるように、彼の放った奇妙な論理を頭の中で咀嚼した。しかし、道徳的にも論理的にも上手く噛み砕けず、喉の奥に引っかかったままだった。</p>\n    <p class=\"no-indent\">「整理しよう」と僕は机に両肘をついた。</p>\n    <p class=\"no-indent\">「君は不倫は発覚して初めて『した』ことになると思っているんだね」</p>\n    <p class=\"no-indent\">「うん」</p>\n    <p class=\"no-indent\">「じゃあ逆に、発覚さえしなければ不倫はしてないことと同義なんだね」</p>\n    <p class=\"no-indent\">「そういうことになるね」</p>\n    <p>おかきくんは、少しだけ小首をかしげながら僕の目を見た。その表情は、まるで「太陽は東から昇るんだよ、知らなかったの？」と、世界の絶対的な真理を優しく教えてくれるかのようだった。</p>\n    <p class=\"no-indent\">「それは、おかしくないか？」と僕は言った。</p>\n    <p class=\"no-indent\">「おかしい？」おかきくんは、今度は反対側に少し首を傾けた。「どのへんが？」</p>\n    <p class=\"no-indent\">「行為の事実は、発覚の有無に関わらず存在するんじゃないか。誰かに知られていなくても、君が不倫をしたという事実は、昨日も一昨日も存在していたはずだろう」</p>\n    <p class=\"no-indent\">「行為の事実ね」</p>\n    <p>おかきくんは、その言葉の響きを確かめるように低く繰り返した。それから、まだ少し残っているカレーの皿に視線を落とした。</p>\n    <p class=\"no-indent\">「でも、事実って何かな、というのが僕は気になって」</p>\n    <p class=\"no-indent\">「事実は事実だろう」</p>\n    <p class=\"no-indent\">「たとえばさ」とおかきくんは言った。人差し指を少し立てて、窓の外の頼りない景色を指し示す。「森の中で木が倒れても、誰もその音を聞かなかったら、音はしたの？」</p>\n    <p class=\"no-indent\">「それはバークリーの有名な命題で、今の話とは文脈が違う」</p>\n    <p class=\"no-indent\">「でも本質的には似てると思うんだよね。不倫という行為が、誰にも認識されていない状態で、それは社会的に存在すると言えるのか、という問いとして読めるし」</p>\n    <p class=\"no-indent\">「社会的に存在するかどうかと、実際に行われたかどうかは別問題だ」</p>\n    <p class=\"no-indent\">「そうかな」</p>\n    <p>おかきくんは、冷めて黄色い脂の浮いたカレーのルーをスプーンですくい、一口食べた。咀嚼する間、彼の視線は宙を彷徨っていた。</p>\n    <p class=\"no-indent\">「社会って、認識の集積でしょ。誰も認識していない出来事が社会的に存在する、という主張は、ちょっと不思議な感じがしない？」</p>\n    <p class=\"no-indent\">「だから君は、発覚するまでは不倫をしていないと言ったのか」</p>\n    <p class=\"no-indent\">「まあ、そういうことかな」</p>\n    <p class=\"no-indent\">「でも昨日、そこだけは守ってきた、と言っていたじゃないか。越えてはいけない一線、とも言っていた」</p>\n    <p>おかきくんはスプーンを皿に置き、また少し考え込んだ。彼の顔から先ほどまでの淡々とした表情が消え、わずかに内省的な陰が差したようだった。</p>\n    <p class=\"no-indent\">「うーん、確かに言ったね」</p>\n    <p class=\"no-indent\">「矛盾してないか？」</p>\n    <p class=\"no-indent\">「矛盾してるかも」と彼は、あっさりと自分の非を認めた。「でも人間って大体矛盾してるじゃない。矛盾してる、ということはわかった上で、どちらかといえば真実だと思う方の命題を述べる、というのが人間の普通のやり方だと思う」</p>\n    <p class=\"no-indent\">「で、どちらが真実に近い？」</p>\n    <p class=\"no-indent\">「わからない」と彼は言った。それから、小さく息を吐き出す。「今となっては」</p>\n    <p>窓の外を、一枚の大きな枯れ葉がひらりと舞い、灰色の風にさらわれてそのまま視界から消えていった。</p>\n    <p>食堂の喧騒だけが、僕たちの間に再び戻ってきた。</p>\n  </div>\n\n  <div class=\"section\" id=\"ch3\">\n    <h2 class=\"section-title\">第三話：おかきくんについての考察</h2>\n    <p>おかきくんについて、ここで少し整理しておく必要がある。彼の本名は「岡木」といい、これが苗字なのか名前なのか初対面の者には判別しづらいのだが、本人いわく苗字だそうで、周囲からは自然と「おかきくん」と呼ばれるようになっていた。岡木とおかき。同じ響きであっても、文字に起こせばまったく異なる意味を持つ言葉である。おかきというのは、ご承知の通り米を原料とした日本の伝統的な菓子のことであり、その名が持つイメージは、どうにも素朴で、地味で、縁側でお茶と一緒にいただくような、穏やかで家族的な温かみを連想させる。あるいは正月の鏡餅を木槌で割って作る鏡開きの、あの生活感の滲む光景を。しかしおかきくん本人は、そうした家庭的な平穏や素朴さを何一つ体現していなかった。彼の外見についてはまあ、普通と言ってしまえば普通なのだけれど、その「普通」という言葉があまり似合わない男でもあった。背丈は同世代の平均値を出ない。顔の造作も、一目で誰もが振り返るような整い方をしているわけではなかった。どちらかといえば輪郭には幼さが残る童顔で、それでいて、肌の白さのせいかどこか独特の翳りがある。ふとした瞬間に彼が見せる表情は、教科書に載っている若い頃の太宰治の写真に酷似していた。太宰の顔を知らない人にこの話をすると「いつも暗い顔をしているのか？」と聞き返されるが、決してそういうわけではない。むしろ普段の彼は陽気で、声を立てて笑うことも多い。しかし彼が笑っているまさにその瞬間、目の奥の焦点だけが微動だにせず、完全に別の事象を捉えて思考しているような、そういった不気味な二重性を持っていた。そしておかきくんの恋愛遍歴についても、僕はそれなりに詳しい。詳しいというか、彼と同じ空間で過ごすうちに、気がついたら詳細を知らされていたという方が正確だ。彼の恋愛にまつわる噂話は、まるで季節の移り変わりを告げる天気予報のように、ごく自然に僕の耳へと流れ込んできた。大学に入学してわずかひと月、彼は同じサークルに所属する二年生の、誰もが憧れるような美人の先輩と付き合い始めた。周囲の証言によれば、先輩の方から熱烈なアプローチを仕掛けたらしい。しかしその関係は夏休みを越えたあたりで静かに幕を閉じた。そして秋を迎える頃には、彼は同じ学科の女子学生と手を繋いで歩いており、それも冬の訪れとともに終わりを告げ、年が明けるとまた別の誰かが彼の隣に収まっていた。彼は常に恋愛の生産と破壊を脅威的なペースで繰り返していた。しかしここで誤解のないように強調しておきたいのはおかきくんが不誠実な浮気者だとか、女性の感情を弄んで楽しむ悪趣味な男だとか、そういうことではない。むしろ事態は逆だった。おかきくんは交際が始まれば、その期間中は驚くほど相手に対して真摯であり、別れを切り出す際も言葉を選んで誠実に向き合った。そのため、関係が破綻した後も、大体の場合において禍根を残さず良好な友人関係が続いていた。問題は、おかきくんが誰かと付き合うたびに、その相手が例外なく彼にひどく惚れ込んでしまうことだった。文字通り、ころっと。本当に理由がわからないまま、誰もがころっと参ってしまうのだ。そして彼の方も、交際の最初のうちは相手と同じ熱量で惚れているように見えるのだが、ある一定の周期を迎えると、何の前触れもなく、すうっと気持ちが遠ざかっていくのだった。彼自身もその心境の変化を言語化できないらしく、「なんか、違う気がしてくるんだよね」と、困ったように眉を下げて呟くだけだった。</p>\n    <p class=\"no-indent\">「違う気がするって、具体的に何が不満なんだ」と僕が詰め寄っても、彼は「うーん、なんか」と視線を彷徨わせるだけだった。</p>\n    <p>なぜ女性たちはおかきくんにこれほど容易にころっとしてしまうのか。ある日の夕方、おかきくんと一緒に大学近くのコンビニに入ったとき、その理由の一端を垣間見る出来事があった。レジで会計をしていた若い女性アルバイトが、おかきくんが財布から小銭を出し、「ありがとうございます」と穏やかに言った瞬間、目に見えてはっと身じろぎした。彼女の指先がピタリと止まり、吸い寄せられるようにおかきくんの顔を見つめた。おかきくんはすでにレジ袋を受け取り、出口の方へ足を向けていたが、彼女は完全に上の空になってしまい、その直後に会計をした僕に対して、計算の合わない奇妙な額の釣り銭を渡してきた。</p>\n    <p class=\"no-indent\">「あのレジの人、おかきくんのこと完全に凝視してたな」</p>\n    <p>自動ドアを出て、冷たい夜気の中で僕がそう指摘すると、彼は不思議そうに「そう？」と短く答えた。</p>\n    <p class=\"no-indent\">「気づかなかったのか？　あからさまだったぞ」</p>\n    <p class=\"no-indent\">「気づかないよ、普通」</p>\n    <p>彼は本気でそう言っていた。そしてそれこそが、彼の本質的な部分なのだろう。おかきくんは、自分が周囲からどう見られているか、どんな視線を向けられているかということについて、構造的に無関心なのだ。多くの人間は社会の中で他者の視線を常に意識し、防壁を張り巡らせながら生きている。好かれようと愛想を振りまいたり、有能に見せようと身構えたり、少なくとも悪く思われないように自意識をコントロールする。しかし、おかきくんにはその自意識のノイズが一切ない。彼は他者の視線に向けて自分を演出するのではなく、ただ純粋に、自分の内側の世界だけを見つめて呼吸している。その徹底した内向きのあり方が、彼の周囲に不思議な無重力の磁場を作り出すのだと僕は思う。そこには押しつけがましい自己主張がなく、他者をコントロールしようとする計算もない。だからこそ人はおかきくんの前に立つと、警戒の紐を解いて無防備に安心してしまうのだ。そして安心しきった状態で、じっとおかきくんの横顔を見つめているうちに、彼の横顔に宿るあの特有の翳り──雨の日の窓ガラスを眺めているときのような、あのどこまでも遠い目つきに気づき、引きずり込まれるように何か決定的な感情を抱いてしまう。ころっと。本当に文字通り、ころっと。しかしおかきくんの側は、相手がそれほどまでに自分に傾倒している事実に、やはりあんまり気づかない。あるいは仮に気づいていたとしても、それに対して特別に甘やかしたり突き放したりするわけでもなく、ただそこに淡々と存在し続ける。剥き出しのままの彼がそこにいて、そのままの距離感で彼が佇んでいることによって、相手は底のない沼に沈むように、さらにころっとしていく。そして、ある日突然、おかきくんの中で何かがすうっと音もなく遠ざかり、関係の終わりだけが取り残される。</p>\n  </div>\n\n  <div class=\"section\" id=\"ch4\">\n    <h2 class=\"section-title\">第四話：葉月さんという人について</h2>\n    <p>おかきくんの不倫相手だというその女性の存在が、僕の頭からどうしても離れなくなっていた。気になるというのは決して邪推や野次馬根性といった不謹慎な意味ではない。おかきくんがこれまで重ねてきた恋愛の対象は、例外なく同じキャンパスに通う同年代の女子学生たちだった。それが突然、段階をすべて飛び越えて「年上の人妻」という未知の領域へと至った事実は、あまりにも唐突で、僕にとっては理解の範疇を超えていた。どういう偶然が重なり、どのような文脈を経てその関係に結びついたのか、その背景が純粋に想像できなかったのだ。大学生と人妻の不倫、という関係性は、世の中に氾濫する小説や映画のジャンルとしては確かに珍しくない。しかし、僕の知るおかきくんという男はそうした退廃的でドラマチックな物語に自ら進んで配役されるような人間ではない気がしていた。おかきくんの人生にはもっと、なんというか、同世代の恋人と週末の繁華街を歩き、お互いの写真を携帯で撮り合い、些細なことで口喧嘩をしては翌日には何事もなかったように仲直りし、そして大学の卒業を前にして静かに別れを迎えるような、そういう「青春の正しい道筋」が用意されているはずだったし、それが最も彼に似合っていると考えていた。</p>\n    <p>桐島からあの衝撃的な噂話を聞かされてから、一週間という時間が瞬く間に過ぎ去った。当のおかきくんはといえば、動揺の色を微塵も見せることなく、以前とまったく変わらない様子で毎日の講義に出席し、キャンパスの中を平然と歩いていた。そのあまりの日常への溶け込み方が、僕にはかえって不気味であり、ひどく不可解であった。関係が周囲に露見したというのに、なぜ彼はこれほどまでに静かでいられるのだろうか。相手の配偶者が大学の正門前に怒鳴り込んできたとか、学務課に抗議の電話が殺到したとか、そうした泥沼の騒動は一向に聞こえてこなかった。キャンパスの空気はどこまでも穏やかで、ただ秋の終わりを告げる冷たい風が通り抜けていくだけだった。釈然としない思いを抱えたまま、僕は昼休みに再び桐島を捕まえて、事の真相を尋ねてみた。桐島は周囲を軽く警戒するように声を潜め、最新の情報を僕の耳元へ落とした。「相手の旦那が、もの凄く冷静な人だったらしい。だから、お互いに法律の専門家を間に入れて、書面を交わすような事務的な話し合いだけで、あっさりと解決したらしいよ」と</p>\n    <p class=\"no-indent\">「話し合いで解決とはどういうことだ」と僕は、桐島の肩を掴むようにして聞いた。</p>\n    <p class=\"no-indent\">「知らん」と桐島は、面倒そうに首を振って僕の手をすり抜けた。「俺が知ってるのはそこまでだ」</p>\n    <p>十二月の頭、木枯らしが街の街路樹を容赦なく揺らす日の夕方、僕は久しぶりにおかきくんと二人で例の喫茶店へ行った。アルミの引き戸を引くと、いつもと変わらない薄暗い空間が出迎えてくれた。セピア色の石原裕次郎が、今日も現実離れした遠い目で琥珀色の壁から僕たちを見下ろしており、スピーカーから流れる有線のBGMは、ひどく哀愁を帯びた「別れの一本杉」だった。</p>\n    <p class=\"no-indent\">「相手の人のことを、教えてくれ」と僕は、運ばれてきたばかりの珈琲の湯気の向こうにいる彼へ、直球で切り出した。</p>\n    <p>おかきくんは白磁のカップに手を添えたまま少し考えてから、「怒ったりする？」と、僕の顔をじっと覗き込んできた。</p>\n    <p class=\"no-indent\">「怒らない」</p>\n    <p class=\"no-indent\">「本当に？」</p>\n    <p class=\"no-indent\">「本当に。ただ純粋に気になってるんだ」</p>\n    <p class=\"no-indent\">「純粋に」と彼はその言葉の響きをなぞるように小さくつぶやいて、珈琲を一口飲んだ。熱い液体が喉を通るのを待ってから、「純粋に気になる、ってどういう感情なんだろうね。でも、まあ、いいか」と続けた。</p>\n    <p>彼が淡々とした声で語り始めたことによると、相手の名前は葉月さんといい、年齢は三十四歳。夫は同い年の会社員で、二人の間に子供はいない、ということだった。二人が知り合ったのは、大学の最寄り駅の近くにある、棚の薄暗い小さな書店だという。おかきくんはある文庫本を選ぼうとしていて、葉月さんもまた同じ本を選ぼうとしていて、狭い通路で二人がまったく同時に同じ背表紙へ手を伸ばした。それだけである。劇的な事件もロマンチックな演出もない、ありふれた偶然の重なりだった。それだけなのに、気づいたら連絡先を交換していた、とおかきくんは言った。</p>\n    <p class=\"no-indent\">「気づいたら連絡先を交換してた、というのは」と僕は身を乗り出した。「具体的にどういう流れだ」</p>\n    <p class=\"no-indent\">「うん、なんか普通に話してたら、そうなってた」</p>\n    <p class=\"no-indent\">「向こうから？」</p>\n    <p class=\"no-indent\">「どっちからでもない感じ、だった」</p>\n    <p>僕はそれ以上言葉を続けることができず、椅子の背もたれに体を預けて天井を仰いだ。</p>\n    <p>視線の先では、やはり石原裕次郎が遠い目でこちらを黙って見つめていた。</p>\n    <p class=\"no-indent\">「葉月さんとはどんな人なんだ？」</p>\n    <p>おかきくんはまた少し考えた。指先でカップの縁をゆっくりとなぞる。</p>\n    <p class=\"no-indent\">「静かな人、かな。でも静かってわけでもない。なんか、うまく言えないんだけど」</p>\n    <p class=\"no-indent\">「うまく言えない」</p>\n    <p class=\"no-indent\">「うん。葉月さんって、こっちが話してると、ちゃんと話を聞いてる感じがするんだよね。本当に話を聞いてる、って感じがする。返事とかじゃなくて、話の内容をすべて自分の中に取り込もうとしている感じがする、みたいな？」</p>\n    <p class=\"no-indent\">「それは普通のことではないか」</p>\n    <p>僕の指摘に、おかきくんはカップを机に置いた。</p>\n    <p class=\"no-indent\">「そう思うでしょ。でも意外とそうじゃないんだよね。大体の人は、返事を考えながら話を聞いてるか、次に自分が言うことを考えながら聞いてるか、そのどっちかじゃない。でも葉月さんはそうじゃなかったんだ」</p>\n    <p>昭和歌謡の低い低音が響く店内で、僕はそれを聞いて、ああ、と思った。おかきくんが言っている「葉月さんの特異な姿勢」は、実はほかでもない、おかきくん自身が持っている性質そのものでもあった。おかきくんは他者の視線には構造的に無関心だが、それと対になるようにして、彼は他者の言葉を、驚くほど丁寧に、ちゃんと聞く男だった。彼は誰かと話すとき、目の前の人間をまっすぐに見つめ、その人が発する言葉の意味や温度を本当に全身で受け止めていた。だからこそ、女性たちは彼の前で安心して、ころっとしてしまうのだ。そしてその自分と全く同じ逆の性質を持った大人の女性に、おかきくんは出会ってしまった。あまりにも似た者同士が鏡を覗き込むように出会ったのか、あるいは正反対の極磁のような猛烈な引力が働いたのか、僕には分からなかった。</p>\n    <p class=\"no-indent\">「葉月さんのことが好きなの？」と僕は静かに聞いた。</p>\n    <p>おかきくんは少しの間、沈黙した。有線の音楽の隙間に、窓を叩く木枯らしの音が微かに混ざる。</p>\n    <p class=\"no-indent\">「好きだったよ」と彼は言った。はっきりとした過去形で。「でも今は、よくわからない」</p>\n    <p class=\"no-indent\">「よくわからなくなったから、不倫が発覚した？」</p>\n    <p class=\"no-indent\">「いや順番が逆で、発覚したから、よくわからなくなった感じがする」</p>\n    <p class=\"no-indent\">「どっちが先かなんて、わからなくないか？」</p>\n    <p>おかきくんは、僕のその言葉に少しだけ唇の端を緩めて笑った。</p>\n    <p class=\"no-indent\">「そうかもね」</p>\n    <p>その笑顔の目の奥には、やはり僕には窺い知ることのできない、暗い冬の空のような別の思考が深く沈んでいた。</p>\n  </div>\n\n  <div class=\"section\" id=\"ch5\">\n    <h2 class=\"section-title\">第五話：愛と罪、あるいは責任への追及</h2>\n    <p>それから僕たちは、少しばかり議論らしきものを重ねた。議論と言っても、冷たい隙間風が忍び寄る喫茶店の端のテーブルで、ぬるくなりかけた珈琲を時折口に含みながら、互いに着地点の見えないぼんやりとした言葉を交換し合っただけのことなのだが。</p>\n    <p class=\"no-indent\">「不倫というのは、果たして本当に純粋な愛なのか？」と僕は、答えを急ぐように尋ねた。</p>\n    <p class=\"no-indent\">「難しい質問だね」とおかきくんは言った。</p>\n    <p>彼は白磁のカップを見つめたまま、スプーンの柄に細い指を添えた。</p>\n    <p class=\"no-indent\">「難しいというのは、一般的に不倫と愛の関係については様々な見解があるから難しいのか、君自身の経験に照らして難しいのか、どっちなんだ？」</p>\n    <p class=\"no-indent\">「両方かな」</p>\n    <p>おかきくんは顔を上げ、僕の視線を真っ向から受け止めた。</p>\n    <p class=\"no-indent\">「一般論として言えば、不倫関係に本物の愛が含まれる可能性は否定できない。でもそれが愛だとしても、その愛は他の誰かを傷つける構造の中に最初から埋め込まれている。それを愛と呼ぶことができるのか、というのは確かに難しい」</p>\n    <p class=\"no-indent\">「君自身は？」</p>\n    <p class=\"no-indent\">「僕は、葉月さんのことが好きだった。それは確かなことだと思う。でも、それが愛だったかどうかは、自分でもよくわからない」</p>\n    <p class=\"no-indent\">「何が違うんだ、好きと愛は」</p>\n    <p>おかきくんは動きを止め、しばらく黙って考え込んだ。</p>\n    <p>いつの間にか有線のBGMは「北国の春」に切り替わっており、泥臭くも切ないイントロが、会話の空白を埋めるように店内に響いていた。</p>\n    <p class=\"no-indent\">「好きは、自分の中にある感情のことだと思う」とおかきくんは言葉を吟味するようにゆっくりと言った。「この人に会いたい、一緒にいたいという、自分を起点にした気持ち。でも愛は、もう少し相手の方に向かっている気がする。相手が幸せであることを心から願う、というか、相手の存在そのものを引き受けようとする意志のようなもの」</p>\n    <p class=\"no-indent\">「なるほど」</p>\n    <p class=\"no-indent\">「そういう意味では僕が葉月さんに感じていたのは好き、に近かったかもしれない。葉月さんが幸せであることを、心から願っていたかというと、よくわからない」</p>\n    <p class=\"no-indent\">「しかし不倫することが葉月さんを幸せにしない可能性くらい、わかっていたはずだろう」</p>\n    <p class=\"no-indent\">「そうだね」</p>\n    <p class=\"no-indent\">「それでも続けた」</p>\n    <p class=\"no-indent\">「うん」</p>\n    <p class=\"no-indent\">「それは」と僕は言いかけた。非難の言葉が喉まで出かかったが、彼のあまりに淡々とした態度を前に、その先をうまく形にできなかった。</p>\n    <p class=\"no-indent\">「お前の罪だ、とでも言いたいの？」とおかきくんが代わりにその言葉を口にした。</p>\n    <p class=\"no-indent\">「まあ」</p>\n    <p class=\"no-indent\">「罪だ、とは思う」と彼は言った。あっさりと、何ひとつ自己弁護を挟まずに。</p>\n    <p class=\"no-indent\">「罪だというのはわかってる。でも、罪だとわかっていることと、それをやめられることは、僕にとっては別のことだった」</p>\n    <p class=\"no-indent\">「やめられなかったのか」</p>\n    <p class=\"no-indent\">「正確には、やめようとしていた。でも、葉月さんに会うと、やめようという気持ちがどこかへいってしまった」</p>\n    <p class=\"no-indent\">「なぜだ？」</p>\n    <p class=\"no-indent\">「それもよくわからない。葉月さんが特別な魔力を持っている、というわけでもないと思う。ただ、一緒にいると、時間の流れ方が変わるような感じがしたんだ。普段は時間の流れが速くて、気づいたら日が暮れているような感覚があるんだけど、葉月さんと一緒にいると、ちゃんと一時間が、一時間としてのあるべき質量を持っているような感じがするんだ」</p>\n    <p>その独特の表現に、僕は一瞬圧倒された。</p>\n    <p class=\"no-indent\">「それは」と僕は言った。「とても素敵なことじゃないか」</p>\n    <p class=\"no-indent\">「そうかもしれない」とおかきくんは言った。視線を窓の外の薄暗い景色へと移す。</p>\n    <p class=\"no-indent\">「今になってみると、そう思う」</p>\n    <p>琥珀色の壁からは、やはり石原裕次郎が遠い目でこちらを無表情に見下ろしていた。</p>\n    <p>色褪せたポスターの奥にある眼差しは、僕たちの言葉の軽さを咎めているようにも見えた。</p>\n    <p class=\"no-indent\">「ちなみに責任、というものについて、君はどう考えてるんだ」と僕は、逃げ道を塞ぐように続けて尋ねた。</p>\n    <p class=\"no-indent\">「責任ね」とおかきくんは言った。「漠然としてるな。誰に対する責任？」</p>\n    <p class=\"no-indent\">「葉月さんの夫に対する、でも葉月さんに対する、でも、どちらでもいい」</p>\n    <p class=\"no-indent\">「夫に対する責任については、あまりわからない。僕は彼と一度も面識がないから。ただ、傷つけたということは確かだと思う。それに対しては申し訳ないという気持ちはある」</p>\n    <p class=\"no-indent\">「申し訳ない、と責任を感じるのは違うのか？」</p>\n    <p class=\"no-indent\">「少し違う気がするな。申し訳ないは感情だけど、責任を感じる、というのは、そこに何かをするべき義務が伴う気がする。で、僕は彼に対して何かをするべき義務があるのか、というと、よくわからない」</p>\n    <p class=\"no-indent\">「謝罪？」</p>\n    <p class=\"no-indent\">「謝罪すれば、傷が癒えるのか、というのは疑問がある。むしろ何もしない方がいいケースもある気がするし」</p>\n    <p class=\"no-indent\">「それは逃げていないか？」</p>\n    <p class=\"no-indent\">「逃げてるかもしれない」と彼はあっさりと認めた。「それは否定しない」</p>\n    <p class=\"no-indent\">「葉月さんに対しては」</p>\n    <p>僕が重ねて問い詰めると、おかきくんは少し首を振った。</p>\n    <p class=\"no-indent\">「葉月さんに対しては、もっとわからない。葉月さんは、自分で選んで来てくれた人だから」</p>\n    <p class=\"no-indent\">「それは葉月さんに責任がある、ということ？」</p>\n    <p class=\"no-indent\">「責任があるというより、葉月さんも主体的にそこにいた、ということ。僕が彼女を誘惑したわけではないし、彼女が何も知らなかったわけでもない。彼女は三十四歳の大人で、自分がしていることの意味を理解した上で、それでも来てくれた」</p>\n    <p class=\"no-indent\">「でも、君が大学生だという非対称性がある。年齢的にも、社会的な経験値としても、葉月さんの方が多くのものを失うリスクを背負っていた」</p>\n    <p class=\"no-indent\">「それはそうだね」とおかきくんは静かに言った。その声のトーンが、わずかに低くなった。「それは、ずっと気になっている」</p>\n    <p class=\"no-indent\">「気になっている」</p>\n    <p class=\"no-indent\">「葉月さんが、どのくらいのリスクを引き受けて僕のもとに来てくれたのか、ということを。僕には見えていなかった部分が、きっとたくさんあって、葉月さんの生活の中には、僕が知らない重みのようなものがたくさん積み重なっていたはずだし」</p>\n    <p class=\"no-indent\">「なぜ聞かなかったんだ」</p>\n    <p>おかきくんはそこで少し間を置いた。冷めた珈琲を喉の奥に流し込み、空になったカップをテーブルにそっと戻す。</p>\n    <p class=\"no-indent\">「うん。聞けばよかったな、と今は思う。でも当時はなんというか、聞いていい質問かどうか、わからなかったんだ」</p>\n    <p class=\"no-indent\">「知りたくなかっただけじゃないのか」</p>\n    <p class=\"no-indent\">「それも、あるかもしれない」と彼は静かに言った。その言葉を拒絶することなく、ただ受け入れた。</p>\n    <p>ふと気づけば、結露した大きなガラス窓の向こうで、白い小雪がひらひらと舞い始めていた。</p>\n    <p>街全体が灰色に沈んでいく、十二月の午後だった。</p>\n  </div>\n\n  <div class=\"section\" id=\"ch6\">\n    <h2 class=\"section-title\">第六話：葉月さんの残影</h2>\n    <p>葉月さんという女性について、僕が知っているすべてのことはここまでである。これまでの会話の中で、おかきくんの口から不意にこぼれ落ちた断片的な情報をひとつひとつ拾い集め、頭の中で並べてみる。彼女は本が好きで、料理が得意で、笑うときは声を出さずに肩をわずかに揺らすという、少し独特な癖があり、好きな色は白と水色。定職には就いておらず、週に一度だけ、自宅から少し離れたフラワーアレンジメントの教室に通っている──ということになる。それだけの、履歴書の余白に書かれるような限られた情報から、僕は葉月さんという一人の具体的な人間の像をなんとか想像しようと試みるのだが、どうしても作業は途中で行き詰まってしまう。たとえば、彼女の顔がまったくわからない。三十四歳の人妻で、本を愛し、静かに笑う人という条件から、最大公約数的な女性の輪郭のようなものはなんとなく脳裏に浮かびはするが、それはすりガラスの向こうの影のように、どうにも焦点が合わないまま霧散してしまう。鼻の高さも、唇の薄さも、あのコンビニの店員を硬直させたおかきくんをじっと見つめ返したであろう瞳の切れ込みも、何ひとつ具体的な像を結ばない。それから彼女の性格の核心がどうしても掴めなかった。おかきくんの話をなぞっている限りでは、彼女はどこまでも穏やかで、他者の言葉を拒まずに吸い込む、静謐な湖のような人のように思える。しかし本当にただ穏やかで静かなだけの人間が一歩間違えれば自らの平穏な生活のすべてを灰にしかねない、歳の離れた大学生との泥沼の不倫に、これほど淡々と踏み込むものだろうか。夫に内緒で本を買い求め、週に一度花を活け、声を出さずに笑う日常。その静水のような暮らしの底に、僕たちには決して見えていない、彼女だけが密かに抱えていた飢えや、諦念や、あるいは自暴自棄に近い決意といった、言葉にならない空白の部分が、まだあるような気がしてならなかった。</p>\n    <p class=\"no-indent\">「葉月さんは、どうして危険を冒してまで、君と不倫をしたのだろう」と僕は聞いた。</p>\n    <p>別の日のことである。同じ喫茶店の、同じテーブルで、やはりコーヒーを飲みながら。</p>\n    <p class=\"no-indent\">「わからないな」とおかきくんは言った。</p>\n    <p>彼は白磁の空のカップを見つめたまま、微動だにしない。</p>\n    <p class=\"no-indent\">「聞かなかったのか？」</p>\n    <p class=\"no-indent\">「なんか、聞いていい質問かどうか、わからなかったんだ」</p>\n    <p class=\"no-indent\">「またそれか」</p>\n    <p class=\"no-indent\">「そうだね」</p>\n    <p>僕の少し呆れたような口調に対しても、彼は気分を害する風でもなく、ただ小さく息を吐いて認め、それから膝の上で自分の指を一本ずつ確かめるように重ね合わせた。</p>\n    <p class=\"no-indent\">「葉月さんからは、何か言ってたか？」</p>\n    <p class=\"no-indent\">「うん」</p>\n    <p>おかきくんは、またあの特有の遠い目になった。</p>\n    <p>焦点は僕の頭上を通り越し、煤けた壁の石原裕次郎よりもさらに奥の、ここではないどこか薄暗い過去の記憶をなぞっているようだった。</p>\n    <p class=\"no-indent\">「一回だけ、言ってた。楽しかったよ、って」</p>\n    <p>楽しかった。過去形で。その響きには、まだ温かい関係の最中に交わされる言葉としては、あまりにも不自然な冷え切った自立が含まれていた。</p>\n    <p class=\"no-indent\">「それって、終わりを告げたということか？」</p>\n    <p class=\"no-indent\">「そんな感じだった」</p>\n    <p class=\"no-indent\">「それはいつ？」</p>\n    <p class=\"no-indent\">「発覚する前」</p>\n    <p>つまり葉月さんは、誰の目にも触れていない密室の段階で、すでに二人の関係に終わりを告げていたということだ。</p>\n    <p>そして夫にすべてが発覚したのは、その線引きがなされた後のことだったのか。</p>\n    <p class=\"no-indent\">「夫が調べていて、見つかった、ということか？」</p>\n    <p class=\"no-indent\">「そう」</p>\n    <p class=\"no-indent\">「葉月さんは、知ってたのか？ 夫が調べていることを」</p>\n    <p class=\"no-indent\">「知ってたと思う、たぶん」</p>\n    <p>結露した窓ガラスを小雪が白く叩く音を聞きながら、僕の中でこれまでばらばらだったパズルのピースが、いくつかの乾いた音を立てて繋がった気がした。葉月さんという三十四歳の女性はもしかすると、他者によって強制的に暴かれる前に、自ら終わりを告げることで、その後に訪れる破滅のすべてを自分の意志で引き受けていたのかもしれない。いや引き受けるというより、自らの生活が崩壊していく過程すらも、冷徹に準備していた、と言うべきか。彼女は不倫という罪を犯しながらも、その終わり方だけは誰の手にも委ねず、自分自身の形として完結させようとしていたのではないか。</p>\n    <p class=\"no-indent\">「葉月さんは楽しかった、と言った」と僕は机に少し身を乗り出して言った。「その言葉は、君にどう響いた？」</p>\n    <p>おかきくんは、ようやく視線を僕のところまで戻した。</p>\n    <p class=\"no-indent\">「正直、最初は戸惑った」とおかきくんは言った。微かに眉の間に皺が寄る。「楽しかったという言葉は何かが終わった後に言う言葉だと思ったから。でも、それを言われた時点ではまだ関係は終わってなかった。終わりを告げられながら、それでも楽しかったと言われた。それがどういう意味なのか、僕にはうまく理解できなかった」</p>\n    <p class=\"no-indent\">「今は、わかるのか？」</p>\n    <p class=\"no-indent\">「少しは。楽しかったという言葉は、きっと後悔していない、という意味なんだと思う。終わりにするけれど、これはよかったこととして関係を閉じる、という意思表示だったのかな、と」</p>\n    <p class=\"no-indent\">「それは葉月さんにとっての誠実さの表れかもしれない」</p>\n    <p class=\"no-indent\">「そうかもしれない」</p>\n    <p class=\"no-indent\">「君にとっては？」</p>\n    <p class=\"no-indent\">「よかったこととして関係を閉じるべきなのかどうかは、まだよくわからない」とおかきくんは言った。</p>\n    <p>彼は椅子の背もたれに深く体を預け、再び自分の内側の世界へと沈み込んでいく。その表情には、罪悪感とも感傷ともつかない、ただ事実をそのまま受け止めるだけの静かな空虚が広がっていた。</p>\n    <p class=\"no-indent\">「それがわかる日が来ると思う？」</p>\n    <p class=\"no-indent\">「わからない。でも、葉月さんが楽しかったと言ってくれたことは、ずっと覚えてると思う」</p>\n    <p>有線のスピーカーから流れるBGMが、激しい津軽三味線の前奏を合図に「津軽海峡冬景色」に変わった。重く湿った北の海の情景を歌い上げるその旋律は、窓の外で本格的に激しさを増し始めた小雪と、僕たちの間に横たわるぬるくなった二つの珈琲カップに対して、あまりにも哀しく、そして季節にぴったりすぎた。</p>\n  </div>\n\n  <div class=\"section\" id=\"ch7\">\n    <h2 class=\"section-title\">第七話：長い、長い独白</h2>\n    <p class=\"no-indent\">「本当のことを言うと、僕は抱かれるよりも、刺されたかったんだ。葉月さんに──」</p>\n    <p>おかきくんはある日、何の脈絡もなくそう言った。僕はその突然の告白に、飲んでいた珈琲を吹き出してしまった。</p>\n    <p class=\"no-indent\">「一体、何を急に言い出すんだ？」</p>\n    <p class=\"no-indent\">「いや、あれから考えていたんだよね。自分が葉月さんに何を求めていたのかって」</p>\n    <p class=\"no-indent\">「何を求めていたか？」</p>\n    <p>テーブルに飛び散った珈琲を紙ナプキンで拭く手が、思わず止まった。</p>\n    <p class=\"no-indent\">「うん、葉月さんとの関係の中に自分が何を求めていたか。そしてこれまで付き合ってきた人たちに僕が何を求めていたのかを」</p>\n    <p class=\"no-indent\">「それが『抱かれるよりも、刺されたい』なのか？」</p>\n    <p class=\"no-indent\">「うん」</p>\n    <p>抱かれるよりも、刺されたいという言葉の輪郭を、僕はしばらく頭の中で何度もなぞった。奇妙な言葉だったがおかきくんが口にすると、それはグロテスクな比喩というよりも、むしろひどく精密な言語表現のように響いた。</p>\n    <p class=\"no-indent\">「刺される、というのはもちろん比喩的な意味で言ってるんだろうな？」と僕は慎重に確認した。</p>\n    <p class=\"no-indent\">「それもあるね」とおかきくんは言った。「でも完全な比喩とも言い切れないんだよね、感覚的には」</p>\n    <p class=\"no-indent\">「それはどういう意味だ」</p>\n    <p>おかきくんは椅子の背もたれに寄りかかり、天井の染みを見上げながら言葉を探した。有線のBGMはいつの間にか「いい日旅立ち」に切り替わっており、その大仰な希望感が今の会話にまったく似合わず、むしろ滑稽だった。</p>\n    <p class=\"no-indent\">「実を言うと、僕はこれまでたくさんの人と関係を絶ってきたんだ」とおかきくんは言った。</p>\n    <p class=\"no-indent\">「そうなのか？」</p>\n    <p class=\"no-indent\">「うん」とおかきくんは頷いた。「君はこれまでたくさん見てきただろう？　僕がたくさんの人と関係を持ち、すぐに終わってきたところを」</p>\n    <p class=\"no-indent\">「ああ、見てきた」</p>\n    <p class=\"no-indent\">「でも、あれは実を言うと、ほとんどすべては僕が一方的に関係を絶ってきたんだ」</p>\n    <p class=\"no-indent\">「そうなのか」</p>\n    <p class=\"no-indent\">「ああ」</p>\n    <p>おかきくんは翳りのある笑みを浮かべ、すぐに窓の外へと視線を逸らした。</p>\n    <p class=\"no-indent\">「でも関係を絶ったのは、別にその人が嫌いになったからじゃないんだ。むしろ逆で」</p>\n    <p class=\"no-indent\">「逆？」</p>\n    <p class=\"no-indent\">「仲が良かった人ほど、僕は関係を絶ってきたんだ。一緒にいたいと思う人ほど、僕はどういうわけか関係を絶ってしまった」</p>\n    <p>僕は珈琲カップをテーブルに戻して、おかきくんの横顔を見た。彼の目の焦点は、天井を向いていた。</p>\n    <p class=\"no-indent\">「それは矛盾していないか」</p>\n    <p class=\"no-indent\">「矛盾しているように見えるよね。でも自分の中では一応、筋が通っているんだ。一緒にいたいと思うからこそ、関係を絶つことには」</p>\n    <p class=\"no-indent\">「どういう理屈だ」</p>\n    <p>おかきくんは天井から視線を下ろし、テーブルの上の空になったカップを指先でゆっくりと回した。</p>\n    <p class=\"no-indent\">「簡潔に言うなら、僕は試練を与えていたんだ」</p>\n    <p class=\"no-indent\">「試練？」</p>\n    <p class=\"no-indent\">「関係を絶つという試練を。突き放しても、それでもなお自分のことを求めてくれるかどうかを、僕は確かめていたんだ」</p>\n    <p>窓の外では、午後の薄い光の中を、枯れ枝が風に揺れていた。</p>\n    <p class=\"no-indent\">「整理させてくれないか。つまり、君は関係を絶つことで、相手を試していたということか？」</p>\n    <p class=\"no-indent\">「そういうことだね。付け加えるなら、僕は関係を絶つことで、その関係性の強度を確かめていたんだ」</p>\n    <p class=\"no-indent\">「強度？」</p>\n    <p>おかきくんは頷いた。</p>\n    <p class=\"no-indent\">「その関係性が、どれほど強靭で、美しいものであるか。それを一度絶って、確かめようとしていたんだ」</p>\n    <p class=\"no-indent\">「しかし」と僕はすぐに反論した。「それはあまりに矛盾してないか？」</p>\n    <p class=\"no-indent\">「というと？」</p>\n    <p class=\"no-indent\">「つまり、君は相手の信頼を試していたということだろ？　しかし、関係を絶つという行為はその信頼を壊しかねないじゃないか」</p>\n    <p>おかきくんはそれにしばらく考えを巡らせていた。</p>\n    <p class=\"no-indent\">「その通り。確かに、大いに矛盾している。だけど、今大事なのは矛盾しているか否かじゃないんだ。問題は筋が通っているか否かなんだよ」</p>\n    <p class=\"no-indent\">「筋が通っているか、否か」</p>\n    <p class=\"no-indent\">「相手の気持ちを試すことで、その関係の強度を確かめる。これ自体は、みんなやっていることなんじゃないかな。僕の場合が極端なだけで」</p>\n    <p>僕は何も言わなかった。正確には、何も言えなかった。</p>\n    <p class=\"no-indent\">「……理解は、できなくもない。しかし、納得はできない」</p>\n    <p>僕がぼそっと呟くと、おかきくんは大きく頷いた。</p>\n    <p class=\"no-indent\">「そう、大抵の人はそう思う。それは間違っていない」</p>\n    <p class=\"no-indent\">「では」と僕は声を出した。「なぜ君は、関係の強度を確かめようとするんだ？」</p>\n    <p class=\"no-indent\">「そこが一番大きなポイントだよね」とおかきくんは言った。</p>\n    <p class=\"no-indent\">「教えてくれないか？　気になる」</p>\n    <p>僕が正直に答えると、おかきくんは頷いた。外ではランドセルを背負った子どもたちが走り回っていた。</p>\n    <p class=\"no-indent\">「それはたぶん、自己肯定感が低いから、なんだと思う」とおかきくんは、長い沈黙を破って言った。</p>\n    <p class=\"no-indent\">「どういうことだ？」</p>\n    <p>おかきくんは珈琲を一口飲んだ。ただでさえ翳りの差したおかきくんの顔に、より深く、濃い陰影ができていた。</p>\n    <p class=\"no-indent\">「正直にいうと、僕は根本的に、自分という存在の価値を信じることができないんだ。だから僕は常に他人という存在に信じてもらう必要がある。でもありふれた優しさや、抱擁だけでは自尊心を保つことができないんだ。優しい言葉や、温かな抱擁はその気になれば誰にでも向けられるからね」</p>\n    <p class=\"no-indent\">「だから、自分にしか向けられない愛情を求める」</p>\n    <p class=\"no-indent\">「そう。関係を絶たれても、それでも離れられない。それこそが本当の絆であり、愛であると、どこかで思っていたんだと思う」</p>\n    <p class=\"no-indent\">「しかしそれは──」と僕は言いながら、唾をごくりと飲んだ。「ひどいやり方じゃないか」</p>\n    <p class=\"no-indent\">「ひどいと思う」とおかきくんはあっさりと言った。「傲慢な考えだと思う。卑怯な駆け引きだと思う。それはよくわかってる」</p>\n    <p class=\"no-indent\">「わかってるなら、なぜやめないんだ」</p>\n    <p>おかきくんはそこで少し沈黙した。珈琲カップをなぞる指が止まった。</p>\n    <p class=\"no-indent\">「自分の弱さが、そうさせるんだ」</p>\n    <p class=\"no-indent\">「弱さ？」</p>\n    <p>おかきくんは頷いた。</p>\n    <p class=\"no-indent\">「自分の弱さと、醜さ、愚かさと、脆さ。そのすべてが、僕という存在の根底にはひそんでいて、それが壊疽のように心を侵食していくんだ」</p>\n    <p>おかきくんの視線の先には、石原裕次郎のポスターがあった。その表情には、石原裕次郎演じる刑事に自白をしているような趣さえあった。</p>\n    <p class=\"no-indent\">「悪いが、それは言い訳にしか聞こえない」と僕はきっぱりと言った。「詩的な表現を用いているところが、より姑息さを際立たせている」</p>\n    <p>その瞬間、おかきくんの目が見開いた。</p>\n    <p class=\"no-indent\">「君、根暗のくせに鋭いこと言うね」</p>\n    <p class=\"no-indent\">「事実を言ったまでだ。それに根暗は余計だ」</p>\n    <p class=\"no-indent\">「ごめん。でも、それでいうと僕も根暗だよ。それも救いようのない根暗だ。悲観的で、ネガティブ思考。根暗の権化さ」</p>\n    <p class=\"no-indent\">「自虐する暇があったら、話を進めてくれ」</p>\n    <p class=\"no-indent\">「手厳しいね」</p>\n    <p class=\"no-indent\">「気になるんだ。それに君の内面を覗くのが面白いというのもある」</p>\n    <p class=\"no-indent\">「そう」とおかきくんはそっけなく呟いてから、テーブルの上で手を組んだ。</p>\n    <p class=\"no-indent\">「じゃあ、正直に語るよ。まず前置きとして言っておくと、これは長い話になる。そしてこの話には三つの層がある。ナルシシズムの話、自己評価の低さの話、そしてその二つが組み合わさったときに何が起きるかという話だ。順番に話していくよ」</p>\n    <p>おかきくんは一度目を伏せ、それから話し始めた。</p>\n    <p class=\"no-indent\">「まず第一の層──ナルシシズムについてだ。君の前だから、はっきり言おう。自分は弱い人間だ。どうしようもないくらい弱い。そう言うと、君はさっきみたいに『自虐する暇があったら話を進めてくれ』というかもしれない。でもこうやって自虐するのも、本心と向き合うのを恐れて話を逸らそうとしている表れなんだ。醜いよ、愚かだよ。だけど僕は同時に、そんな自分に酔っている。自分を俯瞰している自分に酔いしれている。ナルシシズムだ。そう、僕はきっとどうしようもないナルシストなんだ。じゃなきゃ、こんな救いようもない自分を抱えながら、何食わぬ顔して生きることなんてできない。自分で言うのもなんだけど──というのはいかにもナルシスト的な前置きだけど──この飄々とした感じも、結局は心の奥底に巣食う圧倒的なナルシシズム故なんだ。ナルシストは往々にして内省的で、自分の愚かさも弱さも誰よりもよく知っている。知った上で、愛しているんだ。気持ち悪いだろ。ああ、気持ち悪いさ。だけどその気持ち悪ささえも愛おしい。狂ってやがる。でも、それがナルシシズムというものだ。ここまではわかるか？」</p>\n    <p class=\"no-indent\">「納得できるかはさておき、理解はできる」</p>\n    <p class=\"no-indent\">「じゃあ第二の層に進む。問題はここからなんだ」</p>\n    <p>おかきくんはいったん口を閉じ、視線をカップの底に落とした。</p>\n    <p class=\"no-indent\">「第二層の話に入る前に、両親のことを話したい。虐待とかネグレクトとか、そういう話じゃない。むしろ逆だ。僕の両親は僕のことをとても愛していた。疑いようがないくらいちゃんと愛していた。だからこそ話がややこしいんだ。愛されていたのに、こうなった、ということだから。一人っ子の僕に、両親は誰よりも期待していた。幼児教育の本を買い漁り、お金のかかる学校に通わせてくれた。水泳に体操、そろばんに英会話、習い事もたくさんさせてくれた。僕はそれを小さい頃、愛情だと思っていた。いや両親にとってみれば、それは確かな愛情だったんだろう。だけど僕は次第に、その期待という愛情に縛られるようになっていった。親の期待に応えることが、愛情に応えることだと思うようになった。断ることができなかったんだ。努力することがいつしか全ての目的になり、自分の美徳になっていた。ところが中学二年生のある日、僕の中で努力することの意味がぷつんと切れた。すべてがわからなくなったんだ。自分は何のために努力しているのか。何のために生きているのか。もし仮に両親の期待に応えるために生きているとするなら、両親が死んでしまったら、自分は何のために生きるのか。そこで僕は生と死といった問題から、存在意義に至るまで観念的なことを考えるようになった。自分の生きる意味とは、存在価値とは、自分はどこから来てどこへ行くのか──それが僕にはわからなかった。そしてわからないことが、とてもつらかった。なぜなら今までは明確な答えがあったからだ。両親の期待に応えるだけで良かった。親の期待がクエスチョンであるなら、それに応えることがアンサーだった。でも生きる意味や存在価値という問いには、明確な答えがない。期待に応えるみたいな安易な回答がなかったんだ。それは別に、不思議なことじゃない。期待に応えることが受動的な行為であるなら、生きる意味や、存在価値を求めることは能動的な行動だ。それらは本来、思春期という困難な時期に自主性を持って見つけていくものだ。しかし僕には、その力がなかった。正確には、自主性を持って動く力を、幼い頃に養うことができなかった。親の期待によって受動的に生きてきた僕は、思春期に入って途端に能動的に生きることを求められた。だから僕は思春期に入り、右も左も、前も後ろも、生も死も、わからなくなった。迷い、戸惑い、そして病んだ。何もできなくなったんだ。努力できなくなった僕を前に、両親は特に怒らなかった。責めもしなかった。ただ、その眼差しから期待の色だけが消えた。それだけだった。でも僕にとって両親の目から期待の色が消えるということは、自分が期待に値しない人間であり、不在と同等に扱われているようなものだった。両親は確かにそこにいるのに、自分だけがそこにいないような奇妙な感覚。その怖さを、然るべき怖さとしてちゃんと認識できないまま、僕は成長してしまった。もちろん、僕は愛されていた。でも両親の愛は、常に『期待』という不安定なテーブルの上にだけ置かれていた。その愛は、期待に応えたときにだけ鮮明に輝き、応えられないときは僕の存在としての解像度は下がった。そしてそれが積み重なったことで、やがて自分の中には一つの歪んだ感覚が生まれた。『存在というものは自明じゃない。誰かの期待によってそれは輝いたり、くすんだりする』というものだ。このことに気づいてから、僕はより一層、テストの点数や、他者からの承認といったものに存在証明を求めた。でもそれらは全部、一時的なものだった。期待や承認はやがて消える。達成された事実はいつか忘れ去られる。賞賛や褒め言葉はすぐに過去となる。すると僕の解像度は再び下がる。そしてその苦痛が頂点に達したとき、僕はとある決断をした。それが存在証明のベクトルを『内側』に向けることだった。これまで外側にばかり求めていた存在証明を、すべて自給自足しようとしたんだ。でも結果的に言えば、その矢印の向きが自分の自己評価の低さに繋がってしまった。自分で自分を愛でるという行為は、表向きには他者の期待から脱却したようにも見えた。実際、自分の存在証明を他者に依存しなくて済んだから、その分楽にはなった。でもそれは裏を返せば、他者から与えられてきた期待を丸ごと自分の中に移植しただけでもあった。実際、僕は自分という存在を観察する過程で、絶えず自分のことを試し続けた。どれだけ深く考えられるか、どれだけ繊細でいられるか、どれだけ苦しめるか、どれだけ直視できるか。そうやって自分に負荷をかけ、存在としての強度を確かめて、自分を肯定しようとした。その結果、親の期待に応える苦しさは消えた。それ自体は良かった。でも、その代わりに自分の中にはもうひとりの親が生まれた。第二の親だ。そしてそいつは二十四時間、休むことなく僕を監視し続けた。もっと考えろ。もっと苦しめ。もっと深く潜れ。もっと誠実であれ。もっと特別であれ。でもその声に従っている間だけは、自分が価値のある存在だと思えた。逆に、やめた瞬間、自分の輪郭が失われてしまうような感覚があった。だから僕は、第二の親の監視から逃れられなかった。ここが核心なんだ。つまり、僕が抱える自己評価の低さとは、怠惰や卑屈から生まれたものじゃないんだよ。理想の自分──第二の親が要求する『あるべき自分』──のハードルが恐ろしく高い一方で、現実の自分がそれに全く追いついていない。その自己矛盾が、自己評価の低さを招いているんだ。普通ならナルシストは自己評価が高いはずだ。自分を愛しているから。だけど僕は自分を愛しながら、同時に自分という存在を根本的には信じることができない。これが第二の層だ。わかるか」</p>\n    <p class=\"no-indent\">「……理屈としては、わからなくもない」</p>\n    <p class=\"no-indent\">「そう、理屈としては筋が通っている。それが重要なんだ」</p>\n    <p>おかきくんは皮肉めいた笑みを浮かべ、カップを置いた。</p>\n    <p class=\"no-indent\">「さて、ここからが第三の層──つまり第一と第二が組み合わさったときに生まれる化け物についての話だ。まず、前提として第二の層──自分ひとりで、自分を評価し続けること──には限界がある。何故なら、どれだけ自分で自分という存在を認め、褒めちぎっても、その評価が正しいのかを確認したくなるからだ。自分のことを理解したつもりでも、本当に理解できているのか、誰かに保証してもらいたくなる。自分を評価しつづけるという自分の努力を誰かに認めてもらいたくなる。つまり僕は自分を愛することで他者評価から自由になろうとしていたはずなのに、いつの間にか以前よりもずっと他者評価を必要とする人間になってしまったんだ。しかしここで一つ問題がある。自己評価が『ただ低い』だけならば、多少の他者評価で補填できる。だが僕の自己評価は恐ろしく低い。だから多少の他者評価では、満足することができないんだ。普通に愛され、普通に必要とされるだけでは、もう足りないんだ。それだと見捨てられるんじゃないかという恐怖が首をもたげる。だからより確かな、より絶対的な他者評価を求める。その最たる例が──あの、関係を絶つという行為なんだ。関係の強度を確かめるために、関係を絶つ。それは考えてみれば、当たり前の行為なんだ。普通に仲良くしていれば普通に慕ってもらえる。けれどそれは自分の存在証明にはならない。でも、一度完全に突き放された相手が、それでもなお自分を求めてくれたとしたら？　その事実はどんな優しい言葉よりも、温かな抱擁よりも、ずっと確かな存在証明になる。自分には価値があるという揺るがぬ証拠になる。だから僕は関係を絶つ。ナルシシズムが自分を愛することを強いるものなら、自己評価の低さは他者による存在証明を強いる。そしてその存在証明への渇望が、親しい人間との関係を断つという最悪の手段を選ばせる。この三つが揃ったとき、初めて自己評価の低いナルシストという化け物が誕生するんだ」</p>\n    <p class=\"no-indent\">「自己評価の低いナルシスト」</p>\n    <p class=\"no-indent\">「そう、自己評価の低い、救いようのないナルシスト」</p>\n    <p>おかきくんはそこで自嘲的に、静かに笑った。</p>\n    <p class=\"no-indent\">「まとめよう。僕は自己評価の低いナルシストだ。そしてこの世でもっとも愚かな生き物こそが、この自己評価の低いナルシストだ。普通、ナルシストはナルシストで
