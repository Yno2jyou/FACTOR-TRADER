/* =====================================================================================
   FACTOR TRADER
   ---------------------------------------------------------------------------------
   コア数理エンジン:
     sopf(N) = Nを素因数分解し、その素因数(重複込み)をすべて足し合わせた値 = そのTERNの株価
       例) 12 = 2*2*3        -> 2+2+3 = 7円
       例) 53 (素数)         -> 53円 (分解不可 = 高騰)
       例) 64 = 2^6          -> 2*6 = 12円 (底値)

     N_start(T) = TERNごとに独立して抽選される 10,000〜90,000 のランダム整数
                  (先読み防止のため、前TERNの数字と一切連動しない)

   1TERNのシーケンス:
     1. 市場開示  : N_start を公開し、仮株価 sopf(N_start) を表示
     2. 投資注文  : 各プレイヤー(人間+AI)が 買い/売り/様子見 を秘密裏に決定
     3. 市場HACK: 生涯COINから操作/妨害を裏向きで決定
     4. 清算（個人株価）:
          - 操作: 自分の N にだけ +1 → 自分の株価だけ操作
          - 妨害: 自分以外の N にだけ +1（重複可） → 相手の株価だけ妨害方向に作用
          - 各プレイヤーの株価は個別計算（共通の最終株価は持たない）
   ===================================================================================== */

// ---------- 数理エンジン ----------
function sopf(n) {
  // 与えられた正整数 n の素因数(重複あり)の総和を返す
  let num = Math.floor(Number(n) || 0);
  if (num < 2) return 0;
  let sum = 0;
  let d = 2;
  while (d * d <= num) {
    while (num % d === 0) {
      sum += d;
      num = Math.floor(num / d);
    }
    d += 1;
  }
  if (num > 1) sum += num;
  return sum;
}

function isPrime(n) {
  if (n < 2) return false;
  for (let d = 2; d * d <= n; d++) if (n % d === 0) return false;
  return true;
}

function isPowerOfTwo(n) {
  return n > 0 && (n & (n - 1)) === 0;
}

  const t = TITLE_BY_ID[titleId];

  React.useEffect(() => {

const MAX_EQUIPPED_TITLES = 3;
function normalizeEquipped(eq) {
  let list = [];
  if (Array.isArray(eq)) list = eq.filter((id) => id && TITLE_BY_ID[id]);
  else if (eq && TITLE_BY_ID[eq]) list = [eq];
  // 重複除去・最大3
  const seen = {};
  const out = [];
  list.forEach((id) => {
    if (!seen[id] && out.length < MAX_EQUIPPED_TITLES) {
      seen[id] = true;
      out.push(id);
    }
  });
  return out;
}
function loadTitleSave() {
  try {
    const raw = localStorage.getItem(FT_TITLE_KEY);
    if (!raw) {
      return { unlocked: {}, equipped: [], avantTotal: 0, comebackTotal: 0, coinRichTotal: 0, coinPoorTotal: 0, gamesPlayed: 0 };
    }
    const o = JSON.parse(raw);
    // 旧「連続」データを累計へ引き継ぎ
    const richLegacy = Math.max(0, Number(o.coinRichTotal) || 0, Number(o.coinRichStreak) || 0);
    const poorLegacy = Math.max(0, Number(o.coinPoorTotal) || 0, Number(o.coinPoorStreak) || 0);
    const unlocked = o.unlocked && typeof o.unlocked === "object" ? o.unlocked : {};
    let comebackTotal = Math.max(0, Number(o.comebackTotal) || 0);
    // 旧条件（1回で解放）で逆転劇を所持している場合は累計10として引き継ぐ
    if (unlocked.comeback && comebackTotal < 10) comebackTotal = 10;
    return {
      unlocked: unlocked,
      equipped: normalizeEquipped(o.equipped),
      avantTotal: Math.max(0, Number(o.avantTotal) || 0),
      comebackTotal: comebackTotal,
      coinRichTotal: richLegacy,
      coinPoorTotal: poorLegacy,
      gamesPlayed: Math.max(0, Number(o.gamesPlayed) || 0),
    };
  } catch (e) {
    return { unlocked: {}, equipped: [], avantTotal: 0, comebackTotal: 0, coinRichTotal: 0, coinPoorTotal: 0, gamesPlayed: 0 };
  }
}

function unlockTitleById(id) {
  try {
    const save = loadTitleSave();
    if (!save.unlocked) save.unlocked = {};
    if (save.unlocked[id]) return false;
    save.unlocked[id] = true;
    const eq = normalizeEquipped(save.equipped);
    if (!eq.length) save.equipped = normalizeEquipped([id]);
    // ultimate re-check
    const allOthers = TITLE_DEFS.filter((t) => t.id !== "ultimate");
    if (allOthers.every((t) => save.unlocked[t.id])) {
      save.unlocked.ultimate = true;
    }
    saveTitleSave(save);
    return true;
  } catch (e) {
    return false;
  }
}

function evaluateTitlesAfterGame(isLocal, isFirst, finalTV, finalCoins, stats, save) {
  const newly = [];
  if (!isLocal || !stats) return { newly, save };
  const next = {
    unlocked: { ...(save.unlocked || {}) },
    equipped: normalizeEquipped(save.equipped),
    avantTotal: Math.max(0, Number(save.avantTotal) || 0) + (isFirst ? (stats.avantThisGame || 0) : 0),
    comebackTotal: Math.max(0, Number(save.comebackTotal) || 0),
    coinRichTotal: Math.max(0, Number(save.coinRichTotal) || 0),
    coinPoorTotal: Math.max(0, Number(save.coinPoorTotal) || 0),
    gamesPlayed: Math.max(0, Number(save.gamesPlayed) || 0) + 1,
  };
  function unlock(id) {
    if (!next.unlocked[id]) {
      next.unlocked[id] = true;
      newly.push(id);
    }
  }
  // D 通算プレイ（1位不要・途中リタイアは goToGameOver まで来ないため未カウント）
  const gp = next.gamesPlayed;
  if (gp >= 1) unlock("play1");
  if (gp >= 5) unlock("play5");
  if (gp >= 15) unlock("play15");
  if (gp >= 30) unlock("play30");
  if (gp >= 50) unlock("play50");
  if (gp >= 80) unlock("play80");
  if (gp >= 120) unlock("play120");
  if (gp >= 200) unlock("play200");
  if (gp >= 300) unlock("play300");

  if (!isFirst) {
    // E 総合（他称号が揃っていれば順位不問でも判定）
    const allOthers = TITLE_DEFS.filter((t) => t.id !== "ultimate");
    if (allOthers.every((t) => next.unlocked[t.id])) unlock("ultimate");
    next.equipped = normalizeEquipped(next.equipped);
    if ((!next.equipped || !next.equipped.length) && newly.length) {
      next.equipped = normalizeEquipped([newly[newly.length - 1]]);
    }
    saveTitleSave(next);
    return { newly, save: next };
  }

  const tv = Number(finalTV) || 0;
  if (tv >= 1e7) unlock("rich_1e8");      // 1000万 資産家
  if (tv >= 1e10) unlock("rich_1e12");    // 100億 セレブ
  if (tv >= 1e12) unlock("rich_1e13");    // 1兆 大富豪
  if (tv >= 1e13) unlock("rich_1e14");    // 10兆 超大富豪
  if (tv >= 5e13) unlock("rich_1e15");    // 50兆 支配者
  if (tv >= 1e14) unlock("rich_1e16");    // 100兆 征服者
  if (tv >= 1e15) unlock("rich_1e17");    // 1000兆 帝王
  if (tv >= 5e15) unlock("rich_1e18");    // 5000兆 覇王
  if (tv >= 1e16) unlock("rich_1e19");    // 1京 絶対神
  if (stats.wasLast) {
    next.comebackTotal = (next.comebackTotal || 0) + 1;
  }
  if (next.comebackTotal >= 10) unlock("comeback");

  const q = stats.quickUsed || 0;
  if (q >= 6) unlock("q10");
  if (q >= 10) unlock("q15");
  if (q >= 14) unlock("q20");
  if (q >= 18) unlock("q25");
  if (q >= 24) unlock("q30");

  const hb = Object.keys(stats.heavyBankruptIds || {}).length;
  if (hb >= 1) unlock("h1");
  if (hb >= 2) unlock("h3");
  if (hb >= 3) unlock("h5");
  if (hb >= 5) unlock("h7");
  if (hb >= 7) unlock("h9");

  const db = stats.defenseBlocked || 0;
  if (db >= 5) unlock("d10");
  if (db >= 12) unlock("d20");
  if (db >= 20) unlock("d30");
  if (db >= 28) unlock("d40");
  if (db >= 36) unlock("d50");

  const ro = stats.reflectOut || 0;
  if (ro >= 3) unlock("r5");
  if (ro >= 6) unlock("r10");
  if (ro >= 10) unlock("r15");
  if (ro >= 14) unlock("r20");
  if (ro >= 18) unlock("r25");

  const bl = stats.bailouts || 0;
  if (bl >= 1) unlock("bail2");
  if (bl >= 2) unlock("bail3");
  if (bl >= 3) unlock("bail5");

  if (next.avantTotal >= 5) unlock("av10");
  if (next.avantTotal >= 12) unlock("av20");
  if (next.avantTotal >= 20) unlock("av30");
  if (next.avantTotal >= 30) unlock("av40");
  if (next.avantTotal >= 40) unlock("av50");

  const coins = Math.max(0, Number(finalCoins) || 0);
  const richEnd = coins >= 10;
  const poorEnd = coins <= 0 && !stats.coinRescueUsed;
  if (richEnd) next.coinRichTotal = (next.coinRichTotal || 0) + 1;
  if (poorEnd) next.coinPoorTotal = (next.coinPoorTotal || 0) + 1;
  if (next.coinRichTotal >= 1) unlock("coin_rich1");
  if (next.coinRichTotal >= 3) unlock("coin_rich3");
  if (next.coinRichTotal >= 5) unlock("coin_rich5");
  if (next.coinPoorTotal >= 1) unlock("coin_poor1");
  if (next.coinPoorTotal >= 3) unlock("coin_poor3");
  if (next.coinPoorTotal >= 5) unlock("coin_poor5");

  // E 総合：ultimate以外をすべて所持
  {
    const allOthers = TITLE_DEFS.filter((t) => t.id !== "ultimate");
    if (allOthers.every((t) => next.unlocked[t.id])) unlock("ultimate");
  }

  next.equipped = normalizeEquipped(next.equipped);
  if ((!next.equipped || !next.equipped.length) && newly.length) {
    next.equipped = normalizeEquipped([newly[newly.length - 1]]);
  }
  saveTitleSave(next);
  return { newly, save: next };
}



/** 連続TERN使用不可（どちらか使用した翌TERNは両方不可） */
function isProtectOnCooldown(p, turn) {
  const last = Math.max(0, Math.floor(Number(p && p.lastProtectTurn) || 0));
  const t = Math.max(0, Math.floor(Number(turn) || 0));
  return last > 0 && t > 0 && last === t - 1;
}

/** ラスト5TERNか */
function isLastFiveTurns(turn, totalTurns) {
  const t = Number(turn) || 0;
  const tt = Number(totalTurns) || 0;
  if (tt <= 0 || t <= 0) return false;
  const remaining = tt - t + 1;
  return remaining <= 5;
}

/** 終盤の最低売買株数（保有100なら50以上など） */
function minOrderShares(action, holdings, maxBuyShares) {
  if (action === "sell") {
    if (holdings <= 0) return 0;
    // 保有の50%以上を自由に選択
    return Math.max(1, Math.ceil(holdings * 0.5));
  }
  if (action === "buy") {
    if (maxBuyShares <= 0) return 0;
    // 買付余力の50%以上を自由に選択（上限は余力いっぱい）
    return Math.max(1, Math.ceil(maxBuyShares * 0.5));
  }
  return 0;
}

/** 注文をルールに合わせて補正（終盤の様子見禁止・最低50%） */
function clampOrder(order, cash, holdings, priceBefore, turn, totalTurns) {
  const maxBuy = priceBefore > 0 ? Math.floor(cash / priceBefore) : 0;
  const end = isLastFiveTurns(turn, totalTurns);
  let action = (order && order.action) || "stay";
  let shares = Math.max(0, Math.floor((order && order.shares) || 0));

  if (end) {
    if (action === "stay") {
      if (holdings > 0) action = "sell";
      else if (maxBuy > 0) action = "buy";
    }
    if (action === "buy" || action === "sell") {
      const maxS = action === "buy" ? maxBuy : holdings;
      if (maxS <= 0) {
        action = "stay";
        shares = 0;
      } else {
        const minS = minOrderShares(action, holdings, maxBuy);
        if (!shares || shares < minS) shares = minS;
        if (shares > maxS) shares = maxS;
        // 最低が上限を超えることは minOrderShares で抑制済み
        if (shares < 1) {
          action = "stay";
          shares = 0;
        }
      }
    }
  }

  if (action === "buy") {
    shares = Math.min(shares, maxBuy);
    if (shares <= 0) { action = "stay"; shares = 0; }
  } else if (action === "sell") {
    shares = Math.min(shares, holdings);
    if (shares <= 0) { action = "stay"; shares = 0; }
  } else {
    shares = 0;
  }
  return { action: action, shares: shares };
}

      name: (names[i] && String(names[i]).trim()) || defaultName,
      isAI: false,
      cash: STARTING_CASH,
      holdings: 0,
      avgPrice: 0,
      cards: { stock: startStock },
      history: [STARTING_CASH],
      avantUsed: false,
      lastProtectTurn: 0,
    });
  }
  for (let i = 0; i < count - hCount; i++) {
    players.push({
      id: "ai-" + i,
      name: AI_NAMES[i % AI_NAMES.length],
      isAI: true,
      cash: STARTING_CASH,
      holdings: 0,
      avgPrice: 0,
      cards: { stock: startStock },
      history: [STARTING_CASH],
      avantUsed: false,
      lastProtectTurn: 0,
    });
  }
  return players;
}

/** 人間プレイヤー一覧（破産含む） */
function humanPlayersOf(players) {
  return (players || []).filter((p) => p && !p.isAI);
}

/** 操作対象の人間（破産していない先頭など） */
function primaryHuman(players) {
  const hs = humanPlayersOf(players);
  const alive = hs.find((p) => !p.isBankrupt);
  return alive || hs[0] || null;
}

/* ========== オンライン対戦（PeerJS / ホスト権威） ========== */
const PEER_PREFIX = "ftroom-";
function genRoomCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = "";
  for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}
function roomPeerId(code) {
  return PEER_PREFIX + String(code || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
}

function serializePlayers(players) {
  return (players || []).map((p) => ({

    isAI: !!p.isAI,
    cash: p.cash,
    holdings: p.holdings,

    avantUsed: !!p.avantUsed,

    isBankrupt: !!p.isBankrupt,

}

function buildSnapshot(state) {
  return {

  };
}


// プレイヤーの総資産(時価評価額) = 現金 + 保有株数 × 現在の株価
function totalValue(p, price) {
  return p.cash + p.holdings * price;
}

/** COIN補充（総資産の一部と交換）。last5では不可。choice: "" | "half5" | "zero10" */
function applyCoinRescue(p, choice, price) {
  if (!p || !choice) return p;
  const tv = totalValue(p, price);
  let keepRatio = 1;
  let addCoins = 0;
  if (choice === "half5") {
    keepRatio = 0.5;
    addCoins = 5;
  } else if (choice === "zero10") {
    keepRatio = 0.25;
    addCoins = 10;
  } else {
    return p;
  }
  const stock0 = p.cards && p.cards.stock != null ? p.cards.stock : 0;
  return {
    ...p,
    cash: Math.max(0, (p.cash || 0) * keepRatio),
    holdings: Math.max(0, Math.floor((p.holdings || 0) * keepRatio)),
    cards: { ...(p.cards || {}), stock: stock0 + addCoins },
  };
}

function coinRescueLabel(choice) {
  if (choice === "half5") return "総資産50% → COIN+5";
  if (choice === "zero10") return "総資産75% → COIN+10";
  return "";
}

// AIの投資判断: 株価の急騰・急落に強く反応する大胆スタイル
// - 数百円→数万円級の急騰時は保有株を大量売却
// - 数万円→数百円級の急落時は現金を大量投入して買う
// - 素数/2の累乗の特徴も加味しつつ、動くときは振り切る
// 現物取引なので、買いは現金の範囲内、売りは保有株数の範囲内で株数を決定する


/* ========== アカウント（ID/パスワード）・端末内保存・進捗マージ ========== */
const FT_AUTH_SESSION_KEY = "factor_trader_auth_session_v1";
const FT_AUTH_ACCOUNTS_KEY = "factor_trader_auth_accounts_v1";

function ftUtf8(str) {
  return new TextEncoder().encode(String(str || ""));
}
function ftB64FromBytes(bytes) {
  let s = "";
  const arr = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
  for (let i = 0; i < arr.length; i++) s += String.fromCharCode(arr[i]);
  return btoa(s);
}
function ftBytesFromB64(b64) {
  const s = atob(String(b64 || ""));
  const out = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
  return out;
}
async function ftSha256Hex(str) {
  const buf = await crypto.subtle.digest("SHA-256", ftUtf8(str));
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
}
async function ftDeriveAesKey(password, saltB64) {
  const base = await crypto.subtle.importKey("raw", ftUtf8(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: ftBytesFromB64(saltB64), iterations: 120000, hash: "SHA-256" },
    base,
    { name: "AES-GCM", length: 256 },
    false,
    ["encrypt", "decrypt"]
  );
}
function ftRandomSaltB64(n) {
  const a = new Uint8Array(n || 16);
  crypto.getRandomValues(a);
  return ftB64FromBytes(a);
}
async function ftEncryptJson(obj, password, saltB64) {
  const key = await ftDeriveAesKey(password, saltB64);
  const iv = new Uint8Array(12);
  crypto.getRandomValues(iv);
  const plain = ftUtf8(JSON.stringify(obj));
  const cipher = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, plain);
  return { iv: ftB64FromBytes(iv), data: ftB64FromBytes(new Uint8Array(cipher)) };
}
async function ftDecryptJson(payload, password, saltB64) {
  const key = await ftDeriveAesKey(password, saltB64);
  const iv = ftBytesFromB64(payload.iv);
  const data = ftBytesFromB64(payload.data);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, data);
  return JSON.parse(new TextDecoder().decode(plain));
}

function loadAuthAccounts() {

}
function saveAuthAccounts(map) {

}
function loadAuthSession() {

function mergeTitleSaves(a, b) {
  const A = a || {};
  const B = b || {};
  const unlocked = { ...(A.unlocked || {}) };
  Object.keys(B.unlocked || {}).forEach((id) => {
    if (B.unlocked[id]) unlocked[id] = true;
  });
  const equippedA = normalizeEquipped(A.equipped);
  const equippedB = normalizeEquipped(B.equipped);
  let equipped = equippedA.length ? equippedA : equippedB;
  equipped = normalizeEquipped(equipped.filter((id) => unlocked[id]));
  return {
    unlocked,
    equipped,
    avantTotal: Math.max(0, Number(A.avantTotal) || 0, Number(B.avantTotal) || 0),
    comebackTotal: Math.max(0, Number(A.comebackTotal) || 0, Number(B.comebackTotal) || 0),
    coinRichTotal: Math.max(0, Number(A.coinRichTotal) || 0, Number(B.coinRichTotal) || 0),
    coinPoorTotal: Math.max(0, Number(A.coinPoorTotal) || 0, Number(B.coinPoorTotal) || 0),
    gamesPlayed: Math.max(0, Number(A.gamesPlayed) || 0, Number(B.gamesPlayed) || 0),
  };
}
function mergeAiLearn(a, b) {
  const A = a && typeof a === "object" ? a : defaultAiLearn();
  const B = b && typeof b === "object" ? b : defaultAiLearn();
  // 対局数が多い方をベースに、カウンタは合算寄り（max）で安全側に
  const base = (Number(A.games) || 0) >= (Number(B.games) || 0) ? A : B;
  const other = base === A ? B : A;
  const out = JSON.parse(JSON.stringify(base));
  out.games = Math.max(Number(A.games) || 0, Number(B.games) || 0);
  out.aiBeatsHuman = Math.max(Number(A.aiBeatsHuman) || 0, Number(B.aiBeatsHuman) || 0);
  out.humanBeatsAi = Math.max(Number(A.humanBeatsAi) || 0, Number(B.humanBeatsAi) || 0);
  out.iq = clampAiIq(Math.max(Number(A.iq) || 80, Number(B.iq) || 80));
  const ws = out.w || (out.w = {});
  const wo = other.w || {};
  Object.keys({ ...ws, ...wo }).forEach((k) => {
    const x = Number(ws[k]);
    const y = Number(wo[k]);
    if (!isNaN(x) && !isNaN(y)) ws[k] = (x + y) / 2;
    else if (!isNaN(y)) ws[k] = y;
  });
  return out;
}

function collectLocalProgress() {
  return {
    titleSave: loadTitleSave(),
    aiLearn: loadAiLearn(),
  };
}
function applyProgressToLocal(progress) {
  if (!progress) return;
  if (progress.titleSave) {
    saveTitleSave(progress.titleSave);
  }
  if (progress.aiLearn) {

async function registerAccount(id, password) {
  const uid = String(id || "").trim();
  if (!uid || uid.length < 2) throw new Error("IDは2文字以上");
  if (!password || String(password).length < 4) throw new Error("パスワードは4文字以上");
  const map = loadAuthAccounts();
  if (map[uid]) throw new Error("このIDは既に登録されています。ログインしてください");
  const salt = ftRandomSaltB64(16);
  const passHash = await ftSha256Hex(salt + ":" + password);
  const local = collectLocalProgress();
  const account = {
    id: uid,
    salt: salt,
    passHash: passHash,
    progress: local,
    updatedAt: Date.now(),
  };
  map[uid] = account;
  saveAuthAccounts(map);
  saveAuthSession({ id: uid });
  applyProgressToLocal(account.progress);
  return { account, merged: true };
}

async function loginAccount(id, password, otpToken) {
  const uid = String(id || "").trim();
  if (!uid) throw new Error("IDを入力してください");
  if (!password) throw new Error("パスワードを入力してください");
  const map = loadAuthAccounts();
  let account = map[uid] || null;
  let fromOtp = null;
  if (otpToken && String(otpToken).trim()) {
    fromOtp = await consumeSyncOtp(uid, password, otpToken);
  }
  if (!account && !fromOtp) {
    throw new Error("この端末にアカウントがありません。新規登録するか、同期ワンタイムパスワードを入力してください");
  }
  if (account) {
    const expect = await ftSha256Hex(account.salt + ":" + password);
    if (expect !== account.passHash) throw new Error("IDまたはパスワードが違います");
  } else if (fromOtp) {
    // 他端末からの初回: ローカルアカウントを作成
    const salt = ftRandomSaltB64(16);
    const passHash = await ftSha256Hex(salt + ":" + password);
    account = {
      id: uid,
      salt: salt,
      passHash: passHash,
      progress: fromOtp.progress,
      updatedAt: Date.now(),
    };
  }
  const guest = collectLocalProgress();
  let progress = account.progress || { titleSave: loadTitleSave(), aiLearn: defaultAiLearn() };
  if (fromOtp && fromOtp.progress) {
    progress = {
      titleSave: mergeTitleSaves(progress.titleSave, fromOtp.progress.titleSave),
      aiLearn: mergeAiLearn(progress.aiLearn, fromOtp.progress.aiLearn),
    };
  }
  progress = {
    titleSave: mergeTitleSaves(progress.titleSave, guest.titleSave),
    aiLearn: mergeAiLearn(progress.aiLearn, guest.aiLearn),
  };
  account.progress = progress;
  account.updatedAt = Date.now();
  map[uid] = account;
  saveAuthAccounts(map);
  saveAuthSession({ id: uid });
  applyProgressToLocal(progress);
  return { account, merged: true };
}


/** 同期ワンタイムパスワード（8桁英数字・有効5分・1回限り。長いコード不要） */
const FT_OTP_VAULT_KEY = "factor_trader_otp_vault_v1";
const FT_OTP_PEER_PREFIX = "ftotp-";
const FT_OTP_TTL_MS = 5 * 60 * 1000; // 5分
let _ftOtpPublishPeer = null;
let _ftOtpPublishTimer = null;

function ftRandomOtp(len) {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  const n = len || 8;
  const a = new Uint8Array(n);
  crypto.getRandomValues(a);
  let s = "";
  for (let i = 0; i < n; i++) s += chars[a[i] % chars.length];
  return s;
}
function ftNormalizeOtp(s) {
  return String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
}
function loadOtpVault() {
  try {
    const v = JSON.parse(localStorage.getItem(FT_OTP_VAULT_KEY) || "{}");
    const now = Date.now();
    let changed = false;
    Object.keys(v).forEach((k) => {
      if (!v[k] || !v[k].exp || Number(v[k].exp) < now) {
        delete v[k];
        changed = true;
      }
    });
    if (changed) localStorage.setItem(FT_OTP_VAULT_KEY, JSON.stringify(v));
    return v && typeof v === "object" ? v : {};
  } catch (e) {
    return {};
  }
}
function saveOtpVaultEntry(otp, pack, exp) {
  const key = ftNormalizeOtp(otp);
  if (!key) return;
  const v = loadOtpVault();
  v[key] = { pack: pack, exp: Number(exp) || (Date.now() + FT_OTP_TTL_MS) };
  try {
    localStorage.setItem(FT_OTP_VAULT_KEY, JSON.stringify(v));
  } catch (e) {}
}
function peekOtpVaultEntry(otp) {
  const key = ftNormalizeOtp(otp);
  const v = loadOtpVault();
  return v[key] || null;
}
function removeOtpVaultEntry(otp) {
  const key = ftNormalizeOtp(otp);
  const v = loadOtpVault();
  if (v[key]) {
    delete v[key];
    try {
      localStorage.setItem(FT_OTP_VAULT_KEY, JSON.stringify(v));
    } catch (e) {}
  }
}
function stopOtpPublishPeer() {
  if (_ftOtpPublishTimer) {
    clearTimeout(_ftOtpPublishTimer);
    _ftOtpPublishTimer = null;
  }
  if (_ftOtpPublishPeer) {
    try {
      _ftOtpPublishPeer.destroy();
    } catch (e) {}
    _ftOtpPublishPeer = null;
  }
}
function startOtpPublishPeer(otp, pack, exp) {
  stopOtpPublishPeer();
  if (typeof Peer === "undefined") return;
  const peerId = FT_OTP_PEER_PREFIX + ftNormalizeOtp(otp);
  try {
    const peer = new Peer(peerId, { debug: 0 });
    _ftOtpPublishPeer = peer;
    peer.on("connection", (conn) => {
      conn.on("open", () => {
        try {
          conn.send({ type: "ftotp-pack", pack: pack });
        } catch (e) {}
        setTimeout(() => {
          try {
            conn.close();
          } catch (e) {}
        }, 400);
      });
    });
    peer.on("error", () => {});
    const remain = Math.max(1000, Number(exp) - Date.now());
    _ftOtpPublishTimer = setTimeout(() => {
      stopOtpPublishPeer();
      removeOtpVaultEntry(otp);
    }, remain);
  } catch (e) {}
}
function fetchOtpPackViaPeer(otp, timeoutMs) {
  return new Promise((resolve, reject) => {
    if (typeof Peer === "undefined") {
      reject(new Error("PeerJS未読込"));
      return;
    }
    const peer = new Peer({ debug: 0 });
    let done = false;
    const finish = (fn) => {
      if (done) return;
      done = true;
      clearTimeout(timer);
      try {
        peer.destroy();
      } catch (e) {}
      fn();
    };
    const timer = setTimeout(() => {
      finish(() =>
        reject(
          new Error(
            "発行元に接続できませんでした。発行した端末でページを開いたまま、5分以内に入力してください。"
          )
        )
      );
    }, timeoutMs || 12000);
    peer.on("error", () => {
      finish(() =>
        reject(
          new Error(
            "発行元に接続できませんでした。発行した端末でページを開いたまま、5分以内に入力してください。"
          )
        )
      );
    });
    peer.on("open", () => {
      try {
        const conn = peer.connect(FT_OTP_PEER_PREFIX + ftNormalizeOtp(otp), { reliable: true });
        conn.on("data", (data) => {
          if (data && data.type === "ftotp-pack" && data.pack) {
            finish(() => resolve(data.pack));
            try {
              conn.close();
            } catch (e) {}
          }
        });
        conn.on("error", () => {});
      } catch (e) {
        finish(() => reject(e));
      }
    });
  });
}
function parseOtpLongToken(raw) {
  let s = String(raw || "").trim();
  if (!s.startsWith("FTOTP1.")) return null;
  s = s.slice(7);
  try {
    return JSON.parse(new TextDecoder().decode(ftBytesFromB64(s)));
  } catch (e) {
    return null;
  }
}
async function issueSyncOtp(password) {
  const uid = getLoggedInAccountId();
  if (!uid) throw new Error("ログインしてください");
  if (!password) throw new Error("パスワードを再入力してください");
  const map = loadAuthAccounts();
  const account = map[uid];
  if (!account) throw new Error("アカウントが見つかりません");
  const expect = await ftSha256Hex(account.salt + ":" + password);
  if (expect !== account.passHash) throw new Error("パスワードが違います");
  // 最新進捗を反映
  account.progress = collectLocalProgress();
  account.updatedAt = Date.now();
  map[uid] = account;
  saveAuthAccounts(map);
  const otp = ftRandomOtp(8);
  const salt = ftRandomSaltB64(16);
  const nonce = ftRandomSaltB64(12);
  const exp = Date.now() + FT_OTP_TTL_MS;
  const body = {
    v: 1,
    id: uid,
    otp: otp,
    nonce: nonce,
    progress: account.progress,
    ts: Date.now(),
    exp: exp,
  };
  const enc = await ftEncryptJson(body, password + ":" + otp, salt);
  const pack = {
    v: 1,
    id: uid,
    otp: otp,
    salt: salt,
    iv: enc.iv,
    data: enc.data,
  };
  saveOtpVaultEntry(otp, pack, exp);
  startOtpPublishPeer(otp, pack, exp);
  // 互換用トークン（UIでは非表示。旧形式の貼付にも対応）
  const token = "FTOTP1." + ftB64FromBytes(ftUtf8(JSON.stringify(pack)));
  return { otp: otp, token: token, expMin: 5 };
}
async function consumeSyncOtp(uid, password, tokenOrOtp) {
  let raw = String(tokenOrOtp || "").trim();
  if (!raw) throw new Error("ワンタイムパスワードを入力してください");

  let pack = null;
  let shortOtp = null;

  if (raw.indexOf("FTOTP1.") >= 0) {
    // 旧形式の長いコードも受け付ける
    const idx = raw.indexOf("FTOTP1.");
    pack = parseOtpLongToken(raw.slice(idx));
    if (!pack) throw new Error("ワンタイムパスワードの形式が不正です");
  } else {
    shortOtp = ftNormalizeOtp(raw);
    if (!/^[A-Z0-9]{6,12}$/.test(shortOtp)) {
      throw new Error("ワンタイムパスワードは8桁の英数字です");
    }
    const entry = peekOtpVaultEntry(shortOtp);
    if (entry && entry.pack) {
      if (entry.exp && Date.now() > Number(entry.exp)) {
        removeOtpVaultEntry(shortOtp);
        throw new Error("ワンタイムパスワードの有効期限が切れています（発行から5分）");
      }
      pack = entry.pack;
    } else {
      try {
        pack = await fetchOtpPackViaPeer(shortOtp, 12000);
      } catch (e) {
        throw new Error(
          e && e.message
            ? e.message
            : "ワンタイムパスワードが見つかりません。発行した端末でページを開いたまま、5分以内に入力してください。"
        );
      }
    }
  }

  if (!pack || pack.v !== 1 || !pack.otp || !pack.salt || !pack.iv || !pack.data) {
    throw new Error("ワンタイムパスワードの形式が不正です");
  }
  if (shortOtp && ftNormalizeOtp(pack.otp) !== shortOtp) {
    throw new Error("ワンタイムパスワードが不正です");
  }
  if (pack.id && uid && pack.id !== uid) {
    throw new Error("IDがワンタイムパスワードと一致しません");
  }
  const useId = String(uid || pack.id || "").trim();
  if (!useId) throw new Error("IDを入力してください");
  let body;
  try {
    body = await ftDecryptJson({ iv: pack.iv, data: pack.data }, password + ":" + pack.otp, pack.salt);
  } catch (e) {
    throw new Error("ワンタイムパスワードまたはパスワードが違います");
  }
  if (!body || !body.progress) throw new Error("データが読めませんでした");
  if (body.exp && Date.now() > Number(body.exp)) {
    removeOtpVaultEntry(pack.otp);
    throw new Error("ワンタイムパスワードの有効期限が切れています（発行から5分）");
  }
  if (body.otp && body.otp !== pack.otp) throw new Error("ワンタイムパスワードが不正です");
  // 使い捨て: 同じ nonce は再使用不可（この端末）
  try {
    const usedKey = "factor_trader_otp_used_v1";
    const used = JSON.parse(localStorage.getItem(usedKey) || "{}");
    const nk = String(body.nonce || pack.otp);
    if (used[nk]) throw new Error("このワンタイムパスワードは使用済みです");
    used[nk] = Date.now();
    const cutoff = Date.now() - 7 * 24 * 3600 * 1000;
    Object.keys(used).forEach((k) => {
      if (used[k] < cutoff) delete used[k];
    });
    localStorage.setItem(usedKey, JSON.stringify(used));
  } catch (e) {
    if (e && e.message && e.message.indexOf("使用済み") >= 0) throw e;
  }
  removeOtpVaultEntry(pack.otp);
  return { id: useId, progress: body.progress, otp: pack.otp };
}

/* ========== CPU学習（localStorage永続・対局を重ねるほど強化） ========== */
const FT_AI_LEARN_KEY = "factor_trader_ai_learn_v1";
/** ONLINE対戦のCPUは常に Hard 相当（表示・学習には出さない） */
const FT_ONLINE_AI_IQ = 137;
let FT_AI_FORCE_HARD = false;
function setAiForceHard(v) {
  FT_AI_FORCE_HARD = !!v;
}

const AI_IQ_RANK_DEFS = [
  { min: 160, id: "extreme", name: "Extreme" },
  { min: 145, id: "expert", name: "Expert" },
  { min: 130, id: "hard", name: "Hard" },
  { min: 115, id: "moderate", name: "Moderate" },
  { min: 100, id: "easy", name: "Easy" },
  { min: 80, id: "trivial", name: "Trivial" },
];
function clampAiIq(n) {
  return Math.round(Math.max(80, Math.min(180, Number(n) || 80)));
}
function iqToSkill(iq) {
  // 80→0.18 / 137(Hard)→約0.57 / 180→1.0
  return Math.min(1, Math.max(0.15, (clampAiIq(iq) - 80) / 100));
}
function rankFromIq(iq) {
  const v = clampAiIq(iq);
  for (let i = 0; i < AI_IQ_RANK_DEFS.length; i++) {
    if (v >= AI_IQ_RANK_DEFS[i].min) return AI_IQ_RANK_DEFS[i];
  }
  return AI_IQ_RANK_DEFS[AI_IQ_RANK_DEFS.length - 1];
}

function defaultAiLearn() {
  return {
    games: 0,
    iq: 125,
    aiBeatsHuman: 0,
    humanBeatsAi: 0,
    w: {
      aggression: 0.82,
      protect: 0.94,
      heavy: 0.78,
      stayTrap: 0.22,
      primeBuy: 0.72,
      highSell: 0.72,
      endgame: 0.78,
      noise: 0.28,
    },
    s: {
      aiBankrupts: 0,
      humanBankrupts: 0,
      heavyHits: 0,
      heavyTries: 0,
      protectUsed: 0,
      buyPrimeOk: 0,
      buyPrimeN: 0,
      sellHighOk: 0,
      sellHighN: 0,
    },
    human: {
      buyRate: 0.4,
      heavyRate: 0.22,
      protectRate: 0.28,
    },
  };
}

function loadAiLearn() {
  try {
    const raw = localStorage.getItem(FT_AI_LEARN_KEY);
    if (!raw) return defaultAiLearn();
    const o = JSON.parse(raw);
    const d = defaultAiLearn();
    if (o && typeof o === "object") {
      d.games = Math.max(0, Number(o.games) || 0);
      d.aiBeatsHuman = Math.max(0, Number(o.aiBeatsHuman) || 0);
      d.humanBeatsAi = Math.max(0, Number(o.humanBeatsAi) || 0);
      // 旧セーブに iq が無い場合は勝敗・対局から推定
      if (o.iq != null && !isNaN(Number(o.iq))) {
        d.iq = clampAiIq(o.iq);
      } else {
        const g = d.games;
        const totalMatch = Math.max(0, d.aiBeatsHuman + d.humanBeatsAi);
        let est = 80;
        if (g > 0) {
          est = 80 + Math.min(40, g * 1.2);
          if (totalMatch > 0) {
            // 人間優勢が多いほどIQ高め（CPUが強くなる）
            const humRate = d.humanBeatsAi / totalMatch;
            est += humRate * 35 - (1 - humRate) * 15;
          }
        }
        d.iq = clampAiIq(est);
      }
      if (o.w && typeof o.w === "object") {
        Object.keys(d.w).forEach((k) => {
          if (o.w[k] != null) d.w[k] = Math.max(0.05, Math.min(0.98, Number(o.w[k]) || d.w[k]));
        });
      }
      if (o.s && typeof o.s === "object") {
        Object.keys(d.s).forEach((k) => {
          if (o.s[k] != null) d.s[k] = Math.max(0, Number(o.s[k]) || 0);
        });
      }
      if (o.human && typeof o.human === "object") {
        Object.keys(d.human).forEach((k) => {
          if (o.human[k] != null) d.human[k] = Math.max(0.05, Math.min(0.95, Number(o.human[k]) || d.human[k]));
        });
      }
    }
    return d;
  } catch (e) {
    return defaultAiLearn();
  }
}

function saveAiLearn(data) {

  try {

}

/** skill: IQに連動（人間が勝つほどCPUが強くなり、負けると弱くなる） */
function getAiBrain() {
  if (FT_AI_FORCE_HARD) {
    const data = loadAiLearn();
    const iq = FT_ONLINE_AI_IQ;
    const skill = iqToSkill(iq);
    return { data, skill, w: data.w, human: data.human, s: data.s, iq, fixed: true };
  }
  const data = loadAiLearn();
  const iq = clampAiIq(data.iq != null ? data.iq : 80);
  const skill = iqToSkill(iq);
  return { data, skill, w: data.w, human: data.human, s: data.s, iq, fixed: false };
}

/** CPU知能指数（LOCAL）人間の勝敗で上下。ONLINEは内部Hard固定 */
function getAiIqInfo() {
  const d = loadAiLearn();
  const g = Math.max(0, d.games || 0);
  const iq = clampAiIq(d.iq != null ? d.iq : 80);
  const rk = rankFromIq(iq);
  const skill = iqToSkill(iq);
  const totalMatch = Math.max(0, (d.aiBeatsHuman || 0) + (d.humanBeatsAi || 0));
  const winRate = totalMatch > 0 ? (d.humanBeatsAi || 0) / totalMatch : 0;
  const pct = Math.round(((iq - 80) / (180 - 80)) * 100);
  return {
    iq,
    rank: rk.name,
    rankId: rk.id,
    games: g,
    skill,
    winRate,
    aiBeatsHuman: d.aiBeatsHuman || 0,
    humanBeatsAi: d.humanBeatsAi || 0,
    pct,
  };
}

function clampW(v) {
  return Math.max(0.08, Math.min(0.97, v));
}

/** 1TERN終了時の学習（注文・COIN・結果から傾向を更新） */
function recordAiTurnLearn(basePlayers, orders, hacks, execResults, nStart, priceBefore) {
  try {
    const d = loadAiLearn();
    const prime = isPrime(nStart);
    const isHigh = priceBefore >= 1100;
    let humBuy = 0, humN = 0, humHeavy = 0, humProt = 0, humAct = 0;
    (basePlayers || []).forEach((p) => {
      if (!p || p.isBankrupt) return;
      const ord = (orders && orders[p.id]) || { action: "stay", shares: 0 };
      const hk = (hacks && hacks[p.id]) || {};
      const ex = (execResults && execResults[p.id]) || {};
      if (!p.isAI) {
        humAct += 1;
        if (ord.action === "buy" && (ord.shares || 0) > 0) humBuy += 1;
        if ((hk.heavy || 0) > 0) humHeavy += 1;
        if (hk.defense || hk.reflect) humProt += 1;
      } else {
        if ((hk.heavy || 0) > 0) {
          d.s.heavyTries += 1;
          let hit = false;
          (basePlayers || []).forEach((op) => {
            if (!op || String(op.id) === String(p.id)) return;
            const oex = execResults[op.id];
            if (oex && oex.bankrupt) hit = true;
          });
          if (hit) d.s.heavyHits += 1;
        }
        if (hk.defense || hk.reflect) d.s.protectUsed += 1;
        if (ex.bankrupt) d.s.aiBankrupts += 1;
        if (ord.action === "buy" && (ord.shares || 0) > 0 && prime) {
          d.s.buyPrimeN += 1;
          if (!ex.bankrupt && (ex.sharesFilled || 0) > 0) d.s.buyPrimeOk += 1;
        }
        if (ord.action === "sell" && (ord.shares || 0) > 0 && isHigh) {
          d.s.sellHighN += 1;
          if ((ex.sharesFilled || 0) > 0) d.s.sellHighOk += 1;
        }
      }
      if (!p.isAI && ex.bankrupt) d.s.humanBankrupts += 1;
    });
    if (humAct > 0) {
      const a = 0.12;
      d.human.buyRate = d.human.buyRate * (1 - a) + (humBuy / humAct) * a;
      d.human.heavyRate = d.human.heavyRate * (1 - a) + (humHeavy / humAct) * a;
      d.human.protectRate = d.human.protectRate * (1 - a) + (humProt / humAct) * a;
    }
    // 軽量な重み微調整（毎ターン）
    if (d.s.heavyTries >= 5) {
      const rate = d.s.heavyHits / d.s.heavyTries;
      d.w.heavy = clampW(d.w.heavy + (rate > 0.25 ? 0.01 : -0.008));
    }
    if (d.s.buyPrimeN >= 5) {
      const rate = d.s.buyPrimeOk / d.s.buyPrimeN;
      d.w.primeBuy = clampW(d.w.primeBuy + (rate > 0.55 ? 0.01 : -0.008));
    }
    if (d.s.sellHighN >= 5) {
      const rate = d.s.sellHighOk / d.s.sellHighN;
      d.w.highSell = clampW(d.w.highSell + (rate > 0.55 ? 0.01 : -0.008));
    }
    if (d.s.aiBankrupts > 0 && d.games > 0) {
      d.w.protect = clampW(d.w.protect + 0.004);
      d.w.aggression = clampW(d.w.aggression - 0.003);
    }
    saveAiLearn(d);
  } catch (e) {}
}

/** ゲーム終了時の学習（人間が勝てばIQ上昇・負ければ低下。プレイヤーに合わせた難度） */
function recordAiGameLearn(ranked, price) {
  try {
    const d = loadAiLearn();
    d.games = (d.games || 0) + 1;
    let iq = clampAiIq(d.iq != null ? d.iq : 80);
    const list = ranked || [];
    // 人間プレイヤー全員について、最強CPUとの比較で勝敗を集計（一人一人に反映）
    const humans = list.filter((p) => p && !p.isAI);
    const ais = list.filter((p) => p && p.isAI);
    const bestAiTV = ais.length
      ? Math.max.apply(null, ais.map((p) => totalValue(p, price)))
      : 0;
    let anyHumanWin = false;
    let anyHumanLose = false;
    humans.forEach((hum) => {
      const humTV = totalValue(hum, price);
      if (!ais.length) return;
      if (humTV >= bestAiTV) {
        anyHumanWin = true;
        d.humanBeatsAi = (d.humanBeatsAi || 0) + 1;
      } else {
        anyHumanLose = true;
        d.aiBeatsHuman = (d.aiBeatsHuman || 0) + 1;
      }
    });
    if (anyHumanWin && !anyHumanLose) {
      // 人間側がCPUを上回った → IQ上昇（次の対局でCPUが強くなる）
      const delta = 5 + Math.floor(Math.random() * 5); // +5〜9
      iq = clampAiIq(iq + delta);
      d.w.protect = clampW(d.w.protect + 0.02);
      d.w.stayTrap = clampW(d.w.stayTrap + 0.015);
      d.w.heavy = clampW(d.w.heavy + (d.human.buyRate > 0.45 ? 0.02 : 0.008));
      d.w.aggression = clampW(d.w.aggression - 0.008);
      d.w.endgame = clampW(d.w.endgame + 0.012);
      d.w.noise = clampW(d.w.noise - 0.015);
    } else if (anyHumanLose && !anyHumanWin) {
      // CPUが人間を上回った → IQ低下
      const delta = 3 + Math.floor(Math.random() * 5); // -3〜7
      iq = clampAiIq(iq - delta);
      d.w.aggression = clampW(d.w.aggression + 0.01);
      d.w.heavy = clampW(d.w.heavy + 0.008);
      d.w.noise = clampW(d.w.noise + 0.01);
    } else if (anyHumanWin && anyHumanLose) {
      // 混在（複数人間）: わずかに上昇寄り
      iq = clampAiIq(iq + 2);
      d.w.noise = clampW(d.w.noise - 0.005);
    }
    d.iq = iq;
    if (d.games >= 10) d.w.noise = clampW(d.w.noise - 0.008);
    if (d.games >= 30) d.w.noise = clampW(Math.min(d.w.noise, 0.32));
    saveAiLearn(d);
  } catch (e) {}
}

function aiDecideTrade(rnd, nStart, priceBefore, cash, holdings, refPrice, ctx) {
  ctx = ctx || {};
  const maxBuyShares = priceBefore > 0 ? Math.floor(cash / priceBefore) : 0;
  const ratio = refPrice > 0 ? priceBefore / refPrice : 1;
  const totalAssets = cash + holdings * priceBefore;
  const turn = ctx.turn || 1;
  const totalTurns = ctx.totalTurns || 12;
  const endgameLock = isLastFiveTurns(turn, totalTurns);
  const progress = turn / totalTurns;
  const human = ctx.human || null;
  const humanTV = human ? (human.cash + human.holdings * priceBefore) : 0;
  const behindHuman = humanTV > totalAssets * 1.05;
  const aheadHuman = totalAssets > humanTV * 1.15;
  const selfPl = ctx.self || ctx.player || null;
  const protectCd = !!(selfPl && isProtectOnCooldown(selfPl, turn));

  // 防衛/反射クールダウン中: 被妨害で破産しうる買いは禁止（様子見優先）
  function buyBankruptRisk(shares, quickAmt) {
    const sh = Math.max(0, Math.floor(shares || 0));
    if (sh < 1) return false;
    const q = Math.max(0, Math.floor(quickAmt || 0));
    for (let h = 1; h <= 3; h++) {
      const px = personalExecPrice(nStart, q, h, "buy");
      if (px <= 0) continue;
      const req = sh * px;
      const liq = cash + holdings * px;
      if (req > liq + 1e-9) return true;
    }
    return false;
  }
  function safeBuyShares() {
    // クールダウン中は被妨害1回でも破産しない範囲まで
    let lo = 0;
    let hi = maxBuyShares;
    while (lo < hi) {
      const mid = Math.ceil((lo + hi) / 2);
      if (buyBankruptRisk(mid, 0)) hi = mid - 1;
      else lo = mid;
    }
    return Math.max(0, lo);
  }
  function preferStayOrSafe(order) {
    if (!order) return { action: "stay", shares: 0 };
    if (order.action !== "buy" || (order.shares || 0) <= 0) return order;
    if (!protectCd) return order;
    if (!buyBankruptRisk(order.shares, 0)) return order;
    // 破産リスクあり → 様子見（終盤は売り優先、買いなら安全枠のみ）
    if (endgameLock) {
      if (holdings > 0) return { action: "sell", shares: holdings };
      const safe = safeBuyShares();
      if (safe > 0) return { action: "buy", shares: safe };
      return { action: "stay", shares: 0 };
    }
    return { action: "stay", shares: 0 };
  }

  const prime = isPrime(nStart);
  const pow2 = isPowerOfTwo(nStart);
  let factorCount = 0;
  (function countFactors(n) {
    let d = 2, x = n;
    while (d * d <= x) {
      while (x % d === 0) { factorCount++; x /= d; }
      d++;
    }
    if (x > 1) factorCount++;
  })(nStart);

  const isSkyHigh = priceBefore >= 4000 || (priceBefore >= 1600 && ratio >= 2.0);
  const isRockBottom = priceBefore <= 380 || (priceBefore <= 750 && ratio <= 0.4);
  const isHigh = priceBefore >= 1100 || ratio >= 1.45;
  const isLow = priceBefore <= 700 || ratio <= 0.65;

  // エッジ算出
  let edge = 0;
  if (prime) edge += 1.5;
  if (pow2) edge -= 1.4;
  if (factorCount >= 6) edge -= 0.4;
  if (factorCount <= 2 && !pow2) edge += 0.45;
  if (ratio >= 1.3) edge -= 0.6;
  if (ratio <= 0.78) edge += 0.55;
  const equityRatio = totalAssets > 0 ? (holdings * priceBefore) / totalAssets : 0;
  if (equityRatio > 0.75) edge -= 0.35;
  if (equityRatio < 0.15) edge += 0.2;

  // 学習済みブレイン
  const brain = getAiBrain();
  const skill = Math.max(0.45, brain.skill); // 下限を上げて弱体化を防ぐ
  const ww = brain.w || {};
  const humMem = brain.human || {};
  const agr = ww.aggression != null ? ww.aggression : 0.82;

  // 人間に負けているときは強く攻める
  if (behindHuman) edge *= 1.25 + 0.35 * agr;
  if (aheadHuman) edge *= 1.05; // リード中も手を緩めすぎない
  // 素数・高値学習
  if (prime) edge += 0.5 * ((ww.primeBuy || 0.72) - 0.4) * skill;
  if (isHigh) edge -= 0.5 * ((ww.highSell || 0.72) - 0.4) * skill;
  // ノイズは抑制（詰めの甘さを減らす）
  const noiseAmp = 0.12 * (1 - 0.75 * skill) * (ww.noise != null ? ww.noise : 0.28);
  edge += (Math.random() - 0.5) * noiseAmp;
  edge *= 1.05 + 0.35 * agr * skill;

  // --- 様子見＋妨害待ちは「本当にエッジが薄いとき」に限定 ---
  let sabotageStayChance = behindHuman ? 0.22 : (aheadHuman ? 0.14 : 0.16);
  sabotageStayChance *= 0.55 + 0.35 * (ww.stayTrap != null ? ww.stayTrap : 0.22);
  if (protectCd && !endgameLock) {
    sabotageStayChance = Math.min(0.55, sabotageStayChance + 0.18);
  }
  if ((humMem.buyRate || 0) > 0.5) sabotageStayChance = Math.min(0.4, sabotageStayChance + 0.06 * skill);
  const stayEdgeLimit = behindHuman ? 0.55 : 0.4;
  if (!endgameLock && Math.abs(edge) < stayEdgeLimit && Math.random() < sabotageStayChance) {
    return { action: "stay", shares: 0 };
  }

  // --- 高値利確: ほぼ全売り ---
  if ((isSkyHigh || (isHigh && edge < 0.35)) && holdings > 0) {
    const pct = 0.95 + Math.random() * 0.05;
    return { action: "sell", shares: Math.max(1, Math.floor(holdings * pct)) };
  }

  // --- 安値: 現金ほぼ全買い ---
  if ((isRockBottom || (isLow && edge > 0.25)) && maxBuyShares > 0) {
    const pct = 0.94 + Math.random() * 0.06;
    return preferStayOrSafe({ action: "buy", shares: Math.max(1, Math.floor(maxBuyShares * pct)) });
  }

  // --- 強いシグナルは振り切り ---
  if (edge >= 0.7 && maxBuyShares > 0) {
    let pct = prime ? 0.98 : 0.92;
    pct = Math.min(1, pct + Math.random() * 0.04);
    if (behindHuman) pct = Math.min(1, pct + 0.04);
    return preferStayOrSafe({ action: "buy", shares: Math.max(1, Math.floor(maxBuyShares * pct)) });
  }
  if (edge <= -0.7 && holdings > 0) {
    let pct = pow2 ? 0.98 : 0.92;
    pct = Math.min(1, pct + Math.random() * 0.04);
    return { action: "sell", shares: Math.max(1, Math.floor(holdings * pct)) };
  }

  // --- 中程度のエッジでも厚め ---
  if (edge > 0.15 && maxBuyShares > 0) {
    const pct = 0.82 + Math.random() * 0.16;
    return preferStayOrSafe({ action: "buy", shares: Math.max(1, Math.floor(maxBuyShares * pct)) });
  }
  if (edge < -0.15 && holdings > 0) {
    const pct = 0.82 + Math.random() * 0.16;
    return { action: "sell", shares: Math.max(1, Math.floor(holdings * pct)) };
  }

  // エッジほぼなしでも終盤以外は様子見を抑え、ポジションを取る
  if (!endgameLock && Math.random() < 0.22) return { action: "stay", shares: 0 };
  if (maxBuyShares > 0 && equityRatio < 0.45) {
    return preferStayOrSafe(clampOrder({ action: "buy", shares: Math.max(1, Math.floor(maxBuyShares * (0.8 + Math.random() * 0.18))) }, cash, holdings, priceBefore, turn, totalTurns));
  }
  if (holdings > 0 && equityRatio > 0.45) {
    return clampOrder(
      { action: "sell", shares: Math.max(1, Math.floor(holdings * (0.8 + Math.random() * 0.18))) },
      cash, holdings, priceBefore, turn, totalTurns
    );
  }
  if (endgameLock) {
    // 終盤: リードなら利確、ビハインドなら全買い寄りで詰め
    if (aheadHuman && holdings > 0) {
      return clampOrder({ action: "sell", shares: Math.max(1, Math.floor(holdings * (0.85 + Math.random() * 0.15))) }, cash, holdings, priceBefore, turn, totalTurns);
    }
    if (behindHuman && maxBuyShares > 0) {
      return preferStayOrSafe(clampOrder({ action: "buy", shares: maxBuyShares }, cash, holdings, priceBefore, turn, totalTurns));
    }
    if (holdings > 0) {
      return clampOrder({ action: "sell", shares: Math.max(1, Math.floor(holdings * 0.9)) }, cash, holdings, priceBefore, turn, totalTurns);
    }
    if (maxBuyShares > 0) {
      return preferStayOrSafe(clampOrder({ action: "buy", shares: maxBuyShares }, cash, holdings, priceBefore, turn, totalTurns));
    }
  }
  return { action: "stay", shares: 0 };
}

// COIN使用後の株価を試算
function previewSelfPrice(nStart, quick) {
  return sopf(nStart + (quick || 0));
}

function previewPrice(nStart, quick, heavyCount) {
  return previewSelfPrice(nStart, quick);
}

/** 個人株価。
 *  ownQuick: 自分の操作のみ（自分の妨害は含めない）
 *  incomingHeavy: 他者からの妨害のみ（自分の妨害は絶対に渡さない）
 *  妨害1回（COIN5枚）= 相手Nに+1。妨害方向にのみ効く。
 *  追加: 被妨害がある場合、操作は無効化され妨害のみ適用（防げるのは防衛のみ）。
 */
function personalExecPrice(nStart, ownQuick, incomingHeavy, action) {
  const h = Math.max(0, incomingHeavy || 0); // 他者分のみ
  // 妨害を受けている間は操作を無効化
  const q = h > 0 ? 0 : Math.max(0, ownQuick || 0);
  const base = sopf(nStart + q);
  if (h <= 0 || !action || action === "stay") return base;
  // 操作は既に無効化済みのため、N は nStart+h のみ
  const interfered = sopf(nStart + h);
  if (action === "buy") return Math.max(base, interfered);
  if (action === "sell") return Math.min(base, interfered);
  return base;
}

/** 1TERN分の清算（純粋関数）。破産判定付き */
function settleTurn(players, orders, hacks, nStart, priceBefore) {
  const incomingHeavyMap = {};
  const defenseMap = {};
  const reflectMap = {};
  const reflectedToMap = {}; // 反射で受け取った妨害量
  const rawIncomingFrom = {}; // p.id -> { otherId: amount }

  players.forEach((p) => {
    const def = hacks[p.id] && hacks[p.id].defense;
    const ref = hacks[p.id] && hacks[p.id].reflect;
    defenseMap[p.id] = !!(typeof def === "number" ? def > 0 : def);
    reflectMap[p.id] = !!(typeof ref === "number" ? ref > 0 : ref);
    // 防衛と反射の同時使用時は防衛を優先（無効化）
    if (defenseMap[p.id] && reflectMap[p.id]) reflectMap[p.id] = false;
    reflectedToMap[p.id] = 0;
    rawIncomingFrom[p.id] = {};
  });

  // 通常妨害の集計 + 反射
  players.forEach((p) => {
    players.forEach((other) => {
      if (String(other.id) === String(p.id)) return;
      const hv = hacks[other.id] && hacks[other.id].heavy;
      const amt = typeof hv === "number" ? hv : hv ? 1 : 0;
      if (amt <= 0) return;
      rawIncomingFrom[p.id][other.id] = (rawIncomingFrom[p.id][other.id] || 0) + amt;
    });
  });

  players.forEach((p) => {
    if (defenseMap[p.id]) {
      // 防衛: 被妨害をすべて防ぐ
      incomingHeavyMap[p.id] = 0;
      return;
    }
    let inc = 0;
    Object.keys(rawIncomingFrom[p.id] || {}).forEach((oid) => {
      const amt = rawIncomingFrom[p.id][oid] || 0;
      if (amt <= 0) return;
      if (reflectMap[p.id]) {
        // 反射: 妨害を発動者に返す
        reflectedToMap[oid] = (reflectedToMap[oid] || 0) + amt;
      } else {
        inc += amt;
      }
    });
    incomingHeavyMap[p.id] = Math.max(0, inc);
  });

  // 反射分を加算（反射された側が防衛していればその分も防ぐ）
  players.forEach((p) => {
    const bounced = reflectedToMap[p.id] || 0;
    if (bounced <= 0) return;
    if (defenseMap[p.id]) {
      // 反射された妨害も防衛で防げる
      return;
    }
    // 反射先がさらに反射している場合は連鎖しない（受け取って終了）
    incomingHeavyMap[p.id] = Math.max(0, (incomingHeavyMap[p.id] || 0) + bounced);
  });

  // 奥義：AVANT-GARDE-妨害: 自分以外の株価を指定。防衛で無効化される。
  let sabForcePrice = null;
  let sabForceFromId = null;
  players.forEach((p) => {
    if (p.isBankrupt) return;
    const hk = hacks[p.id] || {};
    if (hk.avantSab) {
      const ap = Math.max(1, Math.min(99999, Math.floor(Number(hk.avantPrice) || 1)));
      sabForcePrice = ap;
      sabForceFromId = p.id;
    }
  });

  const priceMap = {};
  const nMap = {};
  const forcedBySabMap = {};
  const sabBlockedByDefMap = {};
  players.forEach((p) => {
    if (p.isBankrupt) {
      priceMap[p.id] = priceBefore;
      nMap[p.id] = nStart;
      forcedBySabMap[p.id] = false;
      sabBlockedByDefMap[p.id] = false;
      return;
    }
    const hk = hacks[p.id] || {};
    // 奥義（操作）: 自分の株価指定が最優先
    if (hk.avant) {
      const ap = Math.max(1, Math.min(99999, Math.floor(Number(hk.avantPrice) || 1)));
      priceMap[p.id] = ap;
      nMap[p.id] = nStart;
      forcedBySabMap[p.id] = false;
      sabBlockedByDefMap[p.id] = false;
      return;
    }
    // 奥義（妨害）: 発動者以外に強制。防衛で無効化される
    if (sabForcePrice != null && String(p.id) !== String(sabForceFromId)) {
      if (defenseMap[p.id]) {
        sabBlockedByDefMap[p.id] = true;
        forcedBySabMap[p.id] = false;
        // 防衛成功 → 通常の株価計算へフォールスルー
      } else {
        priceMap[p.id] = sabForcePrice;
        nMap[p.id] = nStart;
        forcedBySabMap[p.id] = true;
        sabBlockedByDefMap[p.id] = false;
        return;
      }
    } else {
      sabBlockedByDefMap[p.id] = false;
      forcedBySabMap[p.id] = false;
    }
    const ownQuick = hk.quick || 0;
    const incH = incomingHeavyMap[p.id] || 0;
    const order = orders[p.id] || { action: "stay", shares: 0 };
    const effectiveQuick = incH > 0 ? 0 : ownQuick;
    priceMap[p.id] = personalExecPrice(nStart, ownQuick, incH, order.action);
    nMap[p.id] = nStart + effectiveQuick + incH;
  });

  const execResults = {};
  const updated = players.map((p) => {
    if (p.isBankrupt) {
      execResults[p.id] = {
        action: "stay", sharesReq: 0, sharesFilled: 0, note: "破産済み",
        execPrice: priceMap[p.id], ownQuick: 0, incomingHeavy: 0, usedHeavy: 0, bankrupt: true,
      };
      return { ...p, history: [...(p.history || []), 0] };
    }

    let cash = p.cash;
    let holdings = p.holdings;
    let avgPrice = p.avgPrice;
    const order = orders[p.id] || { action: "stay", shares: 0 };
    const execPrice = priceMap[p.id];
    let filled = 0;
    let note = "";
    let wentBankrupt = false;
    let bailoutCards = 0;

    if (order.action === "buy" && order.shares > 0 && execPrice > 0) {
      const required = order.shares * execPrice;
      const liquidity = cash + holdings * execPrice; // 全株売却後の支払能力
      if (required > liquidity + 1e-9) {
        const hand = p.cards.stock != null ? p.cards.stock : 0;
        const defCost = (hacks[p.id]?.defense) ? 5 : 0;
        const refCost = (hacks[p.id]?.reflect) ? 5 : 0;
        const alreadyUsed = (hacks[p.id]?.quick || 0) + ((hacks[p.id]?.heavy || 0) > 0 ? 5 : 0) + defCost + refCost + ((hacks[p.id]?.avant || hacks[p.id]?.avantSab) ? 10 : 0);
        const handLeft = Math.max(0, hand - alreadyUsed);
        if (handLeft >= 10) {
          filled = 0;
          note = "COIN10枚で買付を帳消し（破産回避）";
          bailoutCards = 10;
        } else {
          wentBankrupt = true;
          filled = 0;
          note = "破産（買付代金を支払不能・帳消し不可）";
          cash = 0;
          holdings = 0;
          avgPrice = 0;
        }
      } else {
        // 現金不足なら保有株を先に全売却してから執行
        if (cash < required && holdings > 0) {
          cash += holdings * execPrice;
          holdings = 0;
          avgPrice = 0;
          note = "資金不足のため保有株を強制売却して買付";
        }
        filled = order.shares;
        const cost = filled * execPrice;
        cash -= cost;
        holdings += filled;
        avgPrice = execPrice;
      }
    } else if (order.action === "sell" && order.shares > 0) {
      filled = Math.min(order.shares, holdings);
      if (filled < order.shares) note = "保有株不足のため一部成立";
      if (filled > 0) {
        cash += filled * execPrice;
        holdings -= filled;
        if (holdings === 0) avgPrice = 0;
      }
    }

    execResults[p.id] = {
      action: order.action,
      sharesReq: order.shares,
      sharesFilled: filled,
      note,
      execPrice,
      ownQuick: hacks[p.id]?.quick || 0,
      quickNullified: (incomingHeavyMap[p.id] || 0) > 0 && (hacks[p.id]?.quick || 0) > 0,
      effectiveQuick: (incomingHeavyMap[p.id] || 0) > 0 ? 0 : (hacks[p.id]?.quick || 0),
      incomingHeavy: incomingHeavyMap[p.id] || 0,
      usedHeavy: hacks[p.id]?.heavy || 0,
      defense: !!defenseMap[p.id],
      reflect: !!reflectMap[p.id],
      reflectedTo: reflectedToMap[p.id] || 0,
      avant: !!(hacks[p.id] && hacks[p.id].avant),
      avantSab: !!(hacks[p.id] && hacks[p.id].avantSab),
      avantPrice: (hacks[p.id] && (hacks[p.id].avant || hacks[p.id].avantSab)) ? (hacks[p.id].avantPrice || 0) : 0,
      forcedBySab: !!forcedBySabMap[p.id],
      sabBlockedByDef: !!sabBlockedByDefMap[p.id],
      blockedHeavy: defenseMap[p.id] ? (function () {
        let raw = 0;
        players.forEach((other) => {
          if (String(other.id) === String(p.id)) return;
          const hv = hacks[other.id] && hacks[other.id].heavy;
          raw += typeof hv === "number" ? hv : hv ? 1 : 0;
        });
        return raw;
      })() : 0,
      reflectedOut: reflectMap[p.id] ? (function () {
        let raw = 0;
        players.forEach((other) => {
          if (String(other.id) === String(p.id)) return;
          const hv = hacks[other.id] && hacks[other.id].heavy;
          raw += typeof hv === "number" ? hv : hv ? 1 : 0;
        });
        return raw;
      })() : 0,
      bankrupt: wentBankrupt,
      bailout: bailoutCards > 0,
      bailoutCards,
      coinRescue: (hacks[p.id] && hacks[p.id].coinRescue) || "",
    };

    const defCostUsed = (hacks[p.id]?.defense) ? 5 : 0;
    const refCostUsed = (hacks[p.id]?.reflect) ? 5 : 0;
    const avantCostUsed = (hacks[p.id]?.avant || hacks[p.id]?.avantSab) ? 10 : 0;
    const used = (hacks[p.id]?.quick || 0) + ((hacks[p.id]?.heavy || 0) > 0 ? 5 : 0) + defCostUsed + refCostUsed + avantCostUsed + bailoutCards;
    let cards;
    if (wentBankrupt) {
      cards = { stock: 0 };
    } else {
      cards = { stock: Math.max(0, (p.cards.stock != null ? p.cards.stock : 0) - used) };
    }

    const tv = wentBankrupt ? 0 : totalValue({ cash, holdings }, execPrice);
    return {
      ...p,
      cash,
      holdings,
      avgPrice,
      cards,
      isBankrupt: wentBankrupt || !!p.isBankrupt,
      history: [...(p.history || []), tv],
      avantUsed: !!p.avantUsed || !!(hacks[p.id]?.avant) || !!(hacks[p.id]?.avantSab),
    };
  });

  return { updated, execResults, priceMap, nMap, incomingHeavyMap };
}



// AIのCOIN使用判断:
// - 前半は温存し、後半に回す（COINの残量と残りTERNを見て配分）
// - 自分の売買に有利な株価、または大口の相手を不利にする株価を狙って選ぶ
// - 操作は複数枚使用可
function aiDecideCards(cards, turn, totalTurns, order, nStart, priceBefore, allOrders, selfId, playersList) {
  const progress = turn / totalTurns;
  const remainingTurns = Math.max(1, totalTurns - turn + 1);
  const selfAction = order?.action || "stay";
  const selfShares = order?.shares || 0;
  let stock = cards.stock != null ? cards.stock : ((cards.quick || 0) + (cards.heavy || 0));
  const brainC = getAiBrain();
  const skillC = brainC.skill;
  const wwC = brainC.w || {};
  const humC = brainC.human || {};

  let idHash = 0;
  const idStr = String(selfId || "");
  for (let i = 0; i < idStr.length; i++) idHash = (idHash * 31 + idStr.charCodeAt(i)) | 0;
  const isPreferredTurn = (turn % 3) === (Math.abs(idHash) % 3);

  // --- 操作: 利益が出るなら積極使用（温存しすぎない） ---
  let bestQuick = 0;
  if (selfAction !== "stay" && selfShares > 0 && stock > 0) {
    const reserve = progress < 0.35 ? Math.max(1, Math.ceil(stock * 0.35))
      : progress < 0.65 ? Math.max(1, Math.ceil(stock * 0.2))
      : progress < 0.9 ? Math.max(0, Math.ceil(stock * 0.08))
      : 0;
    const spendable = Math.max(0, stock - reserve);
    let turnCap = 2;
    if (progress < 0.35) turnCap = selfShares >= 5 ? 3 : 2;
    else if (progress < 0.6) turnCap = selfShares >= 3 ? 3 : 2;
    else if (progress < 0.85) turnCap = 4;
    else turnCap = remainingTurns <= 2 ? 8 : 6;
    // 大口ほど厚く操作
    if (selfShares >= 50) turnCap = Math.min(turnCap + 2, spendable);
    if (selfShares >= 200) turnCap = Math.min(turnCap + 2, spendable);
    const maxQ = Math.min(spendable, turnCap);

    const basePrice = personalExecPrice(nStart, 0, 0, selfAction);
    let bestScore = -1;
    for (let q = 0; q <= maxQ; q++) {
      const p = personalExecPrice(nStart, q, 0, selfAction);
      const gain = selfAction === "buy" ? basePrice - p : p - basePrice;
      const unitCost = progress < 0.45 ? 0.9 : progress < 0.75 ? 0.55 : 0.3;
      const score = gain * selfShares - q * unitCost;
      if (gain >= 1 && score > bestScore) {
        bestScore = score;
        bestQuick = q;
      }
    }
    // 効率カットは緩く（0.85まで許容して厚めに残す）
    if (bestQuick > 1) {
      const gainBest = selfAction === "buy"
        ? basePrice - personalExecPrice(nStart, bestQuick, 0, selfAction)
        : personalExecPrice(nStart, bestQuick, 0, selfAction) - basePrice;
      for (let q = 0; q < bestQuick; q++) {
        const gain = selfAction === "buy"
          ? basePrice - personalExecPrice(nStart, q, 0, selfAction)
          : personalExecPrice(nStart, q, 0, selfAction) - basePrice;
        if (gain >= gainBest * 0.85) { bestQuick = q; break; }
      }
    }
  }

  // --- 妨害: 固定5枚。大口買い（複数妨害で破産級）に積極。売り対象には使わない。様子見時は積極 ---
  // 最初の3TERNは使用不可。効果は1（相手N+1）
  let bestHeavy = 0;
  // 人間有利判定（総資産）
  let behindHumForHeavy = false;
  {
    const selfPlH = (playersList || []).find((pl) => pl && String(pl.id) === String(selfId));
    const selfTVH = selfPlH ? ((selfPlH.cash || 0) + (selfPlH.holdings || 0) * (priceBefore || 0)) : 0;
    (playersList || []).forEach((pl) => {
      if (!pl || pl.isAI || pl.isBankrupt) return;
      const tv = (pl.cash || 0) + (pl.holdings || 0) * (priceBefore || 0);
      if (tv > selfTVH * 1.05) behindHumForHeavy = true;
    });
  }
  if (turn > 3 && stock - bestQuick >= 5 && playersList && playersList.length) {
    // COIN温存を緩め、狙い目なら撃つ
    let coinReserve = progress < 0.4 ? Math.max(5, Math.ceil(stock * 0.3))
      : progress < 0.7 ? Math.max(3, Math.ceil(stock * 0.18))
      : progress < 0.9 ? Math.max(0, Math.ceil(stock * 0.08))
      : 0;
    if (behindHumForHeavy || selfAction === "stay") {
      coinReserve = Math.max(0, Math.floor(coinReserve * 0.25));
    }
    const canAffordHeavy = stock - bestQuick - coinReserve >= 5;

    let bestTarget = null;
    let bestScore = -1;
    let bestIsBankruptShot = false;
    let bestNeedsMulti = false;

    // 買いのみ対象（破産狙い）
    (playersList || []).forEach((pl) => {
      if (!pl || String(pl.id) === String(selfId) || pl.isBankrupt) return;
      const tOrder = allOrders && allOrders[pl.id];
      const tAction = tOrder?.action || "stay";
      const tShares = tOrder?.shares || 0;
      if (tAction !== "buy" || tShares < 1) return;

      const before = personalExecPrice(nStart, 0, 0, "buy");
      const cashT = pl.cash || 0;
      const holdT = pl.holdings || 0;
      const maxProbe = Math.min(3, Math.max(1, (playersList.length || 2) - 1));
      let bankruptAt = 0;
      let afterAt1 = before;
      for (let h = 1; h <= maxProbe; h++) {
        const after = personalExecPrice(nStart, 0, h, "buy");
        if (h === 1) afterAt1 = after;
        const req = tShares * after;
        const liq = cashT + holdT * after;
        if (req > liq + 1e-9) {
          bankruptAt = h;
          break;
        }
      }
      const delta = afterAt1 - before;
      if (delta <= 0 && bankruptAt <= 0) return;

      const bankruptShot = bankruptAt === 1;
      const multiBankrupt = bankruptAt >= 2;
      const isLargeBuy = tShares >= 5 || bankruptAt > 0 || (delta * tShares >= 2000);
      if (!isLargeBuy && !bankruptShot && !multiBankrupt) return;

      const totalLoss = Math.max(0, delta) * tShares;
      let score = totalLoss + (bankruptShot ? 80000 : 0) + (multiBankrupt ? 45000 : 0);
      if (!pl.isAI) {
        score *= 2.2;
        if (selfAction === "stay") score *= 1.5;
        if (behindHumForHeavy) score *= 1.55;
      } else {
        score *= 0.45;
      }
      if (!bankruptShot && !multiBankrupt && totalLoss < 2500) score *= 0.2;

      if (score > bestScore) {
        bestScore = score;
        bestTarget = pl;
        bestIsBankruptShot = bankruptShot || multiBankrupt;
        bestNeedsMulti = multiBankrupt && !bankruptShot;
      }
    });

    if (bestTarget && (canAffordHeavy || bestIsBankruptShot)) {
      let fireChance = 0;
      const targetIsHuman = !bestTarget.isAI;
      if (bestIsBankruptShot) {
        fireChance = progress < 0.35 ? 0.72 : progress < 0.6 ? 0.9 : 0.97;
        if (targetIsHuman) fireChance = Math.min(0.995, fireChance + 0.08);
        if (selfAction === "stay") fireChance = Math.min(0.995, fireChance + 0.1);
        if (bestNeedsMulti && selfAction === "stay") fireChance = Math.min(0.995, fireChance + 0.05);
      } else if (targetIsHuman) {
        fireChance = progress < 0.4 ? 0.28 : progress < 0.7 ? 0.45 : 0.58;
        if (selfAction === "stay") fireChance = Math.min(0.92, fireChance + 0.32);
        if (behindHumForHeavy) fireChance = Math.min(0.95, fireChance + 0.22);
        if (isPreferredTurn) fireChance += 0.08;
      } else {
        fireChance = bestIsBankruptShot ? 0.2 : 0.08;
        if (selfAction === "stay") fireChance += 0.08;
      }
      if (stock < 12 && !bestIsBankruptShot) fireChance *= targetIsHuman ? 0.7 : 0.35;
      if (stock < 8 && bestIsBankruptShot) fireChance *= 0.88;

      fireChance *= 0.85 + 0.5 * (wwC.heavy != null ? wwC.heavy : 0.78) * (0.55 + 0.45 * Math.max(0.45, skillC));
      if ((humC.buyRate || 0) > 0.4) fireChance = Math.min(0.995, fireChance + 0.1 * Math.max(0.45, skillC));
      if ((humC.protectRate || 0) > 0.6 && targetIsHuman) fireChance *= 0.92;
      if (Math.random() < fireChance) bestHeavy = 1;
    }
  }

  if (bestQuick + (bestHeavy > 0 ? 5 : 0) > stock) bestHeavy = 0;

  // --- 防衛 / 反射 ---
  // CPU鉄則: 『破産』を絶対に避ける。破産は買いでのみ発生。
  // 被妨害で破産確定級の大口買いでは、必ず防衛 or 反射を使う。
  let useDefense = 0;
  let useReflect = 0;
  let mustProtectBankruptcy = false;
  let cancelBuyToAvoidBankruptcy = false; // 買い取り下げは行わない（注文は貫く）

  const selfPlDef = (playersList || []).find((pl) => pl && String(pl.id) === String(selfId));
  const cash0 = selfPlDef ? (selfPlDef.cash || 0) : 0;
  const hold0 = selfPlDef ? (selfPlDef.holdings || 0) : 0;

  function wouldBankruptOnHit(quickAmt, shares) {
    if (selfAction !== "buy" || shares < 1) return false;
    const priceHit = personalExecPrice(nStart, quickAmt || 0, 1, "buy");
    const reqHit = shares * priceHit;
    const liqHit = cash0 + hold0 * priceHit;
    return reqHit > liqHit + 1e-9;
  }

  // ターン1-3は通常妨害不可だが、鉄則判定自体は行う（将来拡張・帳消し計算にも利用）
  if (selfAction === "buy" && selfShares >= 1) {
    mustProtectBankruptcy = wouldBankruptOnHit(bestQuick, selfShares);
  }

  if (turn > 3 && selfAction === "buy" && selfShares >= 1) {
    const priceHit = personalExecPrice(nStart, bestQuick, 1, "buy");
    const priceSafe = personalExecPrice(nStart, bestQuick, 0, "buy");
    const willBankruptIfHit = mustProtectBankruptcy;

    // 鉄則: 破産確定級 → 100%防衛/反射。COINが足りなければ妨害・操作を削って枠を確保。
    if (willBankruptIfHit) {
      // 鉄則: 破産確定級の大口買い → 必ず防衛 or 反射（反射跳ね返りリスクがあるため基本は防衛）
      let spent = bestQuick + (bestHeavy > 0 ? 5 : 0);
      if (stock - spent < 5) {
        bestHeavy = 0;
        spent = bestQuick;
      }
      if (stock - spent < 5) {
        bestQuick = Math.max(0, stock - 5);
        spent = bestQuick;
      }
      if (stock >= 5 && stock - spent >= 5) {
        // 自分が妨害を撃つ/超大口 → 防衛必須。それ以外は防衛優先で反射も可
        if (bestHeavy > 0 || selfShares >= 30) {
          useDefense = 1;
          useReflect = 0;
        } else if (Math.random() < 0.35) {
          useReflect = 1;
          useDefense = 0;
        } else {
          useDefense = 1;
          useReflect = 0;
        }
      }
    } else {
      // 破産までは行かないが、高値づかみリスクがある場合は防衛を厚めに
      let afterQH = bestQuick + (bestHeavy > 0 ? 5 : 0);
      let leftAfter = stock - afterQH;
      if (leftAfter >= 5) {
        let protectChance = 0;
        const overpayRisk = priceHit > priceSafe * 1.35 && selfShares >= 5;
        if (overpayRisk) protectChance = 0.48;
        if (selfShares >= 15 && bestQuick > 0) protectChance = Math.max(protectChance, 0.38);
        if (selfShares >= 40) protectChance = Math.max(protectChance, 0.55);
        if (progress < 0.4) protectChance *= 0.75;
        if (stock < 10) protectChance *= 0.7;
        protectChance *= 0.85 + 0.45 * (wwC.protect != null ? wwC.protect : 0.94);
        protectChance = Math.min(0.97, protectChance * (0.9 + 0.25 * Math.max(0.45, skillC)));
        if (Math.random() < protectChance) {
          // 防衛優先（反射は跳ね返りリスク）
          if (Math.random() < 0.28) useReflect = 1;
          else useDefense = 1;
        }
      }
    }
  }
  // 売り・様子見では防衛/反射を使わない（様子見は反射しない／小口売りも基本不使用）
  // （破産は買いでのみ発生するため、売りでCOINを防衛に回さない）

  // 予算超過時は妨害→操作を削って防衛/反射を優先（破産回避が最優先）
  if ((useDefense || useReflect) && bestQuick + (bestHeavy > 0 ? 5 : 0) + 5 > stock) {
    bestHeavy = 0;
    if (bestQuick + 5 > stock) bestQuick = Math.max(0, stock - 5);
  }
  if (useDefense && useReflect) useReflect = 0; // 同時不可・防衛優先
  // 最初の3TERNは通常妨害が無いため防衛/反射は使わない（COIN温存）
  if (turn <= 3) { useDefense = 0; useReflect = 0; }
  // 防衛・反射の連続使用禁止（前TERNにどちらか使用していれば両方不可）
  if (isProtectOnCooldown(selfPlDef, turn)) { useDefense = 0; useReflect = 0; }

  // 妨害使用時の反射対策: 跳ね返り被妨害で破産するなら防衛必須（反射では防げない）
  if (bestHeavy > 0 && turn > 3 && selfAction === "buy" && selfShares >= 1) {
    if (wouldBankruptOnHit(bestQuick, selfShares)) {
      const spentQH = bestQuick + 5;
      let handAfterQH = Math.max(0, stock - spentQH);
      if (handAfterQH < 5) {
        // 操作を削って防衛枠を確保
        bestQuick = Math.max(0, stock - 5 - 5);
        handAfterQH = Math.max(0, stock - bestQuick - 5);
      }
      if (handAfterQH >= 5) {
        useDefense = 1;
        useReflect = 0;
      }
    }
  }
  // 防衛併用で予算超過なら操作を削る
  if ((useDefense || useReflect) && bestQuick + (bestHeavy > 0 ? 5 : 0) + 5 > stock) {
    const room = Math.max(0, stock - (bestHeavy > 0 ? 5 : 0) - 5);
    bestQuick = Math.min(bestQuick, room);
  }

  // 買い取り下げは禁止（注文を貫く）。守れない場合は防衛確保・奥義に任せる
  cancelBuyToAvoidBankruptcy = false;

  let avant = 0;
  let avantSab = 0;
  let avantPrice = 1000;
  const selfPl = (playersList || []).find((pl) => pl && String(pl.id) === String(selfId));
  const stockLeft = stock - bestQuick - (bestHeavy > 0 ? 5 : 0) - (useDefense ? 5 : 0) - (useReflect ? 5 : 0);
  // 奥義は大口取引向け。小口では控える。10万株以上の売買で積極使用。
  // CPUは進行度40%〜100%（中盤〜後半）でのみ使用。
  const AVANT_BIG = 100000;
  if (
    selfPl && !selfPl.avantUsed && !selfPl.isBankrupt &&
    stockLeft >= 10 &&
    progress >= 0.4
  ) {
    // --- 奥義（妨害）: 最初の3TERN不可。中盤以降、他者の大口売買で損失が大きくなるときに積極使用 ---
    let sabChance = 0;
    let sabPrice = 1000;
    let bestSabScore = 0;
    let totalOthersTradeShares = 0;
    let othersTradingCount = 0;
    if (turn > 3) {
      (playersList || []).forEach((pl) => {
        if (!pl || String(pl.id) === String(selfId) || pl.isBankrupt) return;
        const tOrder = allOrders && allOrders[pl.id];
        const tAction = tOrder?.action || "stay";
        const tShares = tOrder?.shares || 0;
        if (tAction !== "buy" && tAction !== "sell") return;
        if (tShares < 1) return;
        othersTradingCount += 1;
        totalOthersTradeShares += tShares;
        // 買い相手 → 高値を押し付け / 売り相手 → 安値を押し付ける
        const forced = tAction === "buy" ? 99999 : 1;
        const before = personalExecPrice(nStart, 0, 0, tAction);
        const delta = tAction === "buy" ? forced - before : before - forced;
        if (delta <= 0) return;
        let bankruptShot = false;
        if (tAction === "buy") {
          const req = tShares * forced;
          const liq = (pl.cash || 0) + (pl.holdings || 0) * forced;
          bankruptShot = req > liq + 1e-9;
        }
        const totalLoss = delta * tShares;
        let score = totalLoss + (bankruptShot ? 80000 : 0);
        if (!pl.isAI) score *= 1.35;
        // 株数が多いほど損失規模が大きい
        if (tShares >= 50) score *= 1.15;
        if (tShares >= 200) score *= 1.25;
        if (score > bestSabScore) {
          bestSabScore = score;
          sabPrice = forced;
        }
      });
      // 他者が多く売買しているほど積極（損失インパクトが大きい局面）
      const marketHeat = totalOthersTradeShares >= 300 || othersTradingCount >= 2;
      const heavyHeat = totalOthersTradeShares >= 800 || bestSabScore >= 80000;
      if (bestSabScore >= 3000) {
        // 序盤寄りの中盤は控えめ、中盤〜終盤にかけて上げる
        const playerN = (playersList || []).length;
        // 多人数時は序盤を抑え、中盤〜終盤に温存して使う
        if (progress < 0.35) sabChance = playerN >= 5 ? 0.04 : 0.12;
        else if (progress < 0.5) sabChance = playerN >= 5 ? 0.18 : 0.32;
        else if (progress < 0.6) sabChance = playerN >= 5 ? 0.38 : 0.45;
        else if (progress <= 0.8) sabChance = 0.65; // 中盤60〜80%は積極
        else sabChance = 0.58; // 終盤も継続使用
        if (marketHeat) sabChance = Math.min(0.95, sabChance + 0.2);
        if (heavyHeat) sabChance = Math.min(0.97, sabChance + 0.25);
        if (bestSabScore >= 30000) sabChance = Math.min(0.97, sabChance + 0.2);
        if (bestSabScore >= 100000) sabChance = Math.min(0.99, sabChance + 0.25);
        if (progress >= 0.6 && progress <= 0.85) {
          sabChance = Math.min(0.98, sabChance + (marketHeat ? 0.2 : 0.12));
        } else if (progress >= 0.5 && progress < 0.6 && marketHeat) {
          sabChance = Math.min(0.95, sabChance + 0.12);
        }
        // 多人数・序盤はさらに抑制
        if (playerN >= 5 && progress < 0.4) sabChance *= 0.35;
        if (playerN >= 5 && progress < 0.5) sabChance *= 0.7;
      }
    }

    // --- 奥義（操作）: 自分の売買を有利に。妨害型と状況で使い分け ---
    let avChance = 0;
    let avPrice = 1000;
    if (selfAction !== "stay" && selfShares > 0) {
      // 閾値を下げてCPUも積極使用（大口ほど高く）
      if (selfShares >= AVANT_BIG) {
        avChance = 0.78;
        if (selfShares >= AVANT_BIG * 2) avChance = 0.92;
      } else if (selfShares >= 30000) {
        avChance = 0.35 + Math.min(0.35, (selfShares / AVANT_BIG) * 0.35);
      } else if (selfShares >= 8000) {
        avChance = 0.18 + Math.min(0.2, (selfShares / 30000) * 0.2);
      } else if (selfShares >= 2000) {
        avChance = 0.08;
      } else if (selfShares >= 500) {
        avChance = 0.03;
      }
      if (progress > 0.45) avChance = Math.min(0.95, avChance + 0.08);
      if (progress > 0.7) avChance = Math.min(0.95, avChance + 0.06);
      if (selfAction === "buy" && selfShares >= 2000) {
        const priceHit = personalExecPrice(nStart, bestQuick, 1, "buy");
        const req = selfShares * priceHit;
        const liq = (selfPl.cash || 0) + (selfPl.holdings || 0) * priceHit;
        if (req > liq + 1e-9) avChance = Math.max(avChance, selfShares >= 10000 ? 0.85 : 0.4);
      }
      if (selfAction === "buy") avPrice = 1;
      else if (selfAction === "sell") avPrice = 99999;
      else {
        const cash = selfPl.cash || 0;
        const hold = selfPl.holdings || 0;
        avPrice = (hold >= 5 && cash < hold * (priceBefore || 1) * 0.3) ? 99999 : 1;
      }
    }
    if (stockLeft < 15) {
      avChance *= 0.85;
      sabChance *= 0.85;
    }
    const playerN = (playersList || []).length;
    // 多人数: CPUごとに操作寄り / 妨害寄りを割り当ててバランス
    // 少人数: 状況を見て念入りに使い分け
    let styleBias = 0; // -1 操作寄り, +1 妨害寄り
    if (playerN >= 5) {
      styleBias = (Math.abs(idHash) % 2 === 0) ? -1 : 1;
      if (styleBias < 0) {
        avChance = Math.min(0.96, avChance * 1.4 + 0.05);
        sabChance *= 0.5;
      } else {
        sabChance = Math.min(0.96, sabChance * 1.35 + 0.05);
        avChance *= 0.55;
      }
    }
    const selfGainScale = (selfAction === "buy" || selfAction === "sell")
      ? selfShares * Math.max(1, Math.abs((priceBefore || 1) - (selfAction === "buy" ? 1 : 99999)))
      : 0;
    let pickSab = false;
    if (sabChance > 0 && bestSabScore > 0) {
      if (playerN < 5) {
        // 少人数: 他者への損害が自分の奥義利益を明確に上回るときだけ妨害
        const clearSabWin = bestSabScore >= selfGainScale * 1.15 || selfAction === "stay";
        const marginal = bestSabScore >= selfGainScale * 0.85 && sabChance >= avChance + 0.12;
        pickSab = clearSabWin || marginal;
      } else {
        // 多人数: 傾向に沿いつつ状況も見る
        if (styleBias > 0) {
          pickSab = selfAction === "stay" || bestSabScore >= selfGainScale * 0.45 || sabChance >= avChance;
        } else {
          pickSab = (selfAction === "stay" && bestSabScore >= 20000) || bestSabScore >= selfGainScale * 1.4;
        }
      }
    }
    // 鉄則: 破産回避が必要な大口買いでは、妨害型奥義より操作型奥義（自株価固定）を優先
    if (mustProtectBankruptcy && selfAction === "buy") {
      pickSab = false;
      if (stockLeft >= 10 && selfPl && !selfPl.avantUsed) {
        avChance = Math.max(avChance, 0.92);
        avPrice = 1;
      }
    }
    if (pickSab && !mustProtectBankruptcy && Math.random() < Math.min(0.98, Math.max(sabChance, playerN < 5 ? 0.28 : 0.35))) {
      avantSab = 1;
      avantPrice = sabPrice;
      bestQuick = 0;
      bestHeavy = 0;
      useDefense = 0;
      useReflect = 0;
    } else if (!avantSab && avChance > 0 && Math.random() < avChance) {
      avant = 1;
      avantPrice = avPrice;
      bestQuick = 0;
      bestHeavy = 0;
      // 奥義操作は自株価固定のため被妨害でも破産しない → 防衛不要
      useDefense = 0;
      useReflect = 0;
      cancelBuyToAvoidBankruptcy = false;
    }
  }

  // 買い取り下げは禁止。破産回避は防衛・反射・奥義で行う
  cancelBuyToAvoidBankruptcy = false;

  return { quick: bestQuick, heavy: bestHeavy, defense: useDefense, reflect: useReflect, avant: avant, avantSab: avantSab, avantPrice: avantPrice, cancelBuyToAvoidBankruptcy: !!cancelBuyToAvoidBankruptcy, mustProtectBankruptcy: !!mustProtectBankruptcy };
}

// ---------- UI 補助 ----------
function yen(n) {
  const sign = n < 0 ? "-" : "";
  return sign + "¥" + Math.abs(Math.round(n)).toLocaleString();
}
function yenNum(n) {
  return Math.round(Number(n) || 0).toLocaleString();
}
function sharesFmt(n) {
  return Math.round(Number(n) || 0).toLocaleString();
}

function factorParts(n) {
  let num = Math.floor(Number(n) || 0);
  const factors = [];
  if (num < 2) return factors;
  let d = 2;
  while (d * d <= num) {
    while (num % d === 0) {
      factors.push(d);
      num = Math.floor(num / d);
    }
    d += 1;
  }
  if (num > 1) factors.push(num);
  return factors;
}
function factorString(n) {
  const factors = factorParts(n);
  return factors.length ? factors.join(" × ") : String(Math.floor(Number(n) || 0));
}
/** 素因数の和の式 → 「2 + 2 + 3 = 7円」 */
function factorSumFormula(n) {
  const factors = factorParts(n);
  if (!factors.length) {
    const v = Math.floor(Number(n) || 0);
    return v + " = " + v + "円";
  }
  const sum = factors.reduce((a, b) => a + b, 0);
  return factors.join(" + ") + " = " + sum + "円";
}

    setLobbyList(list);
    // ゲストへロビー配信
    list.forEach(() => {});
    Object.keys(connsRef.current).forEach((pid) => {
      const c = connsRef.current[pid];
      if (c && c.open) {
        try { c.send({ type: "lobby", players: list, roomCode: stateRef.current.roomCode || roomCode, playerCount }); } catch (e) {}
      }
    });
  }

  function handleHostMessage(conn, data) {
    if (!data || !data.type) return;
    if (data.type === "hello") {
      const used = Object.keys(connsRef.current).filter((k) => connsRef.current[k] && connsRef.current[k].open).length;
      // human-0 is host; assign human-1, human-2, ...
      const nextIdx = used + 1; // first guest = 1
      if (nextIdx >= playerCount) {
        try { conn.send({ type: "error", message: "部屋が満員です" }); } catch (e) {}
        try { conn.close(); } catch (e) {}
        return;
      }
      const playerId = "human-" + nextIdx;
      conn.meta = { playerId, name: data.name || ("P" + (nextIdx + 1)), peerId: conn.peer };
      connsRef.current[conn.peer] = conn;
      try {
        conn.send({
          type: "welcome",
          playerId,
          name: conn.meta.name,
          roomCode: stateRef.current.roomCode || roomCode,
          playerCount,
        });
      } catch (e) {}
      setNetStatus("プレイヤー接続: " + conn.meta.name);
      setTimeout(updateLobbyFromHost, 50);
      return;
    }
    if (data.type === "order") {
      hostReceiveOrder(conn.meta && conn.meta.playerId, data.order);
      return;
    }
    if (data.type === "hack") {
      hostReceiveHack(conn.meta && conn.meta.playerId, data.hack);
      return;
    }
    if (data.type === "next") {
      // ゲストが「次へ」要求 → ホストのみ進行可。無視またはホスト同期
      return;
    }
  }

  function hostReceiveOrder(playerId, order) {
    if (!playerId || !order) return;
    const st = stateRef.current;
    if (st.phase !== "order") return;
    const nextPending = { ...(st.pendingOrders || {}), [playerId]: order };
    const nextSubmitted = Array.from(new Set([...(st.submittedOrderIds || []), playerId]));
    setPendingOrders(nextPending);
    setSubmittedOrderIds(nextSubmitted);
    // 全員揃ったかチェック（遅延で state 更新後）
    setTimeout(() => tryFinalizeOnlineOrders(nextPending, nextSubmitted), 30);
    broadcastSnapshotFrom({
      pendingOrders: nextPending,
      submittedOrderIds: nextSubmitted,
      phase: "order",
      screen: "play",
    });
  }

  function hostReceiveHack(playerId, hack) {
    if (!playerId || !hack) return;
    const st = stateRef.current;
    if (st.phase !== "hack") return;
    const nextPending = { ...(st.pendingHacks || {}), [playerId]: hack };
    const nextSubmitted = Array.from(new Set([...(st.submittedHackIds || []), playerId]));
    setPendingHacks(nextPending);
    setSubmittedHackIds(nextSubmitted);
    setTimeout(() => tryFinalizeOnlineHacks(nextPending, nextSubmitted), 30);
    broadcastSnapshotFrom({
      pendingHacks: nextPending,
      submittedHackIds: nextSubmitted,
      phase: "hack",
      screen: "play",
    });
  }

  function onlineAliveHumans(list) {
    return humanPlayersOf(list || stateRef.current.players || []).filter((p) => !p.isBankrupt && !p.isAI);
  }

  function tryFinalizeOnlineOrders(pending, submitted) {
    if (!isHostRef.current) return;
    const st = stateRef.current;
    if (st.phase !== "order") return;
    const need = onlineAliveHumans(st.players).map((p) => p.id);
    if (!need.length) return;
    const ok = need.every((id) => submitted.indexOf(id) >= 0 && pending[id]);
    if (!ok) return;
    // ホスト側 finalizeOrdersAndGoHack 相当
    finalizeOnlineOrders(pending);
  }

  function tryFinalizeOnlineHacks(pending, submitted) {
    if (!isHostRef.current) return;
    const st = stateRef.current;
    if (st.phase !== "hack") return;
    const need = onlineAliveHumans(st.players).map((p) => p.id);
    if (!need.length) return;
    const ok = need.every((id) => submitted.indexOf(id) >= 0 && pending[id]);
    if (!ok) return;
    finalizeOnlineHacks(pending);
  }

  // 表示用。不正値は useEffect で修復される（ここでは再抽選しない）
  const nStart = Math.floor(Number(currentN) || 0);
  const priceBefore = nStart >= 2 ? sopf(nStart) : 0;

  // TERN開始時から見えるようにして、変動の読み合いができるようにする。
