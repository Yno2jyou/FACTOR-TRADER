あるが故に自己中心的に生きる。しかし自分は自己評価が低いが故に、他者を試したり傷つけたりして、自分の存在価値を証明しようとする。モンスターだよ。悪魔だよ。でも、やめられないんだ。もちろん関係を絶ったあとに、それでも関係が継続したことはただの一度もない。関係を一度でも絶ってしまえば、相手は心配し、困惑し、傷つき、離れていく。当たり前だ。誰もナルシストの存在証明のために、生贄になろうとはしない。残されるのは関係を自ら壊したという事実と、解像度が下がってボロボロになった自分だけ。ほら見ろ、やっぱり誰も無条件には愛してくれない。自分には価値がないんだ。そうやって自己評価をさらに底へと叩き落とす。でも本当に恐ろしいのはここからだ。深く傷つき、孤独のどん底で、やっぱり自分は救いようのない化け物だと涙を流している、その惨めな自分の姿を、僕の中のもう一人の自分が、うっとりとした目で見つめているんだ。ああ、なんて可哀想な僕。なんて繊細で、なんて業が深くて、なんて美しい孤独なんだろうって。自己評価の低さという底なし沼に溺れながら、その溺れているドラマチックな自分を、極上のナルシシズムで愛でている。つまりどん底に落ちることさえも、自分を愛する供物に変えてしまうんだ。この無限ループから抜け出すことはできない。呆れただろ。気持ち悪いだろ。でも、それすらも愛おしい。狂ってやがる。関係を絶ってなお、断ち切れない関係が最初から存在しないことはわかっている。それが思想を拗らせた自己評価の低いナルシストによって生まれる、哀れな幻想であることもわかっている。それでも僕は懲りずに関係を絶っても断ち切れない、強靭で、美しい関係を求めてしまう。自分でさえも信じられない不確かな自分を、世界のどこかにいる誰かに強引に刻みつけようとする。関係を断ち切ってもなお自分のことを想い、傷つき、囚われ続けてくれる人がいるという事実に、狂おしいほど震え上がってしまう。醜いさ、愚かさ。だけど、それすらも抱きしめて、僕は『自分』を愛する。『自分』を肯定するだけでなく、その身を挺して受け止めてくれる熱狂的な支持者を求めている。だから僕はわざと関係を絶つ。相手を裏切り、突き放し、最悪の形で試す。もしそこまでされてもなお、僕を求めてくれる人がいたとしたら？　もし僕がその人の日常を、人生を、取り返しがつかないほど、破壊しても、僕を忘れずにいてくれたとしたら？　それこそが条件付きの期待などではない、僕にとっての絶対的な存在証明なんだ。相手が傷つけば傷つくほど、その傷跡の深さが、僕という存在の価値になる。最低で、最悪で、身勝手な行為であることは重々承知している。だけど、そんな自分さえも愛おしい。頭がおかしいだろ」</p>\n    <p>僕は何も言えなかった。ただ黙って、じっと珈琲の液面を見つめていた。</p>\n    <p class=\"no-indent\">「葉月さんが、ずっと前にとても鋭いことを言っていたよ。『おかきくんは私のことが好きなんじゃなくて、おかきくんのことを好きな私のことが好きなんだって』。僕はそれを聞いて、ようやくわかったんだ。きっと僕にとって他者の愛とは、自分という存在を写す鏡に過ぎなかったんだって。他者の愛に触れながら、僕はその先に映る自分の姿に酔っていたんだって。ああ、なんてみじめで、泥臭く、愛おしい存在なんだろうって。気持ち悪いよ、身震いがするよ。でも僕は、その身震いごと抱きしめることしかできないんだ。身震いごと、その愛おしい自分を抱きしめて、自分を愛することしかできないんだ。それが僕のどうしようもなく愚かな生き方であり、醜い自己肯定であり、狂おしいほど魅惑的な原罪なんだ」</p>\n    <p>おかきくんはそこで一息つくと、憑き物が落ちたようにふっと肩の力を抜いた。怒涛の言葉の奔流のあとに訪れた沈黙は、まるでハリケーンが巨大な街を丸ごとひとつ飲み込んでしまったようで、僕たちの間の空気を重く支配していた。僕はしばらくの間、おかきくんの剥き出しの告白を反芻した。彼は自分の弱さを告白しているようでいて、その実、一度も救済を求めてはいなかった。理解されることも許されることも望まず、ただ自分という人間の構造を、醜悪な腑を解剖台の上に並べてみせていた。そしてそこには自分を被害者に仕立て上げるための甘えも、他者を傷つけるための刃も、すべてを自覚しながら狂い続ける男の、あまりに哀しい袋小路があった。だからこそ僕には、彼の言葉を軽蔑することも、あるいは憐れむこともできなかった。</p>\n    <p class=\"no-indent\">「けれど葉月さんだけは、君が試練を与えるよりも先に、自分から関係の終わりを告げた。『楽しかった』と言って」</p>\n    <p>気づいたときには、そう口にしていた。その瞬間、おかきくんの指先がぴたりと止まった。</p>\n    <p class=\"no-indent\">「そう、まさにその通り。葉月さんだけだった。試練を受ける立場に、僕を立たせたのは」</p>\n    <p>その言葉の重さが、喫茶店の湿った空気の中にゆっくりと沈んでいった。カウンターの奥でサイフォンを扱う低い音だけが、会話の空白を埋めた。</p>\n    <p class=\"no-indent\">「つまり」と僕は言った。「葉月さんは、君の手口を先読みして、先手を打ったということになるのかな」</p>\n    <p class=\"no-indent\">「先読みしたというより、葉月さんはそういう関係の終わらせ方しかできない人だったんだと思うよ」とおかきくんは注意深く、しかし丁寧に言った。「彼女も彼女なりの傷を抱えていて、その傷の形が、たまたま僕の傷の形と向き合うかたちで合わさったんじゃないかって。最近はそんな気がしてる」</p>\n    <p class=\"no-indent\">「二人とも傷を抱えたもの同士だった、ということか」</p>\n    <p class=\"no-indent\">「かもしれない」</p>\n    <p>有線がまた切り替わった。今度は竹内まりやの「元気を出して」だった。この喫茶店の有線は今日に限って、選曲の精度がひどく悪かった。</p>\n    <p class=\"no-indent\">「つまり、話は戻るが、君が抱かれるより刺されたいと言ったのは──」</p>\n    <p class=\"no-indent\">「うん。抱かれてしまったら、自分のナルシシズムは肥大してしまう。だから僕は、自分が傷つけてしまった相手に、一思いに殺してもらいたいんだ。すべてはこの救いようのない、巨大な渦のようなナルシシズムをこの世界から消し去るために」</p>\n  </div>\n\n  <div class=\"section\" id=\"ch8\">\n    <h2 class=\"section-title\">第八話：長い、長い糾弾</h2>\n    <p>その言葉が喫茶店の空気の中に落ちてから、僕はずいぶん長い時間をかけて珈琲の底を眺めていた。</p>\n    <p class=\"no-indent\">「すべてはこの救いようのないナルシシズムを、この世界から消し去るために」</p>\n    <p>おかきくんは続けて何かを言わなかった。有線から流れる竹内まりやの「元気を出して」だけが、絶望的に白々しく場を満たしていた。</p>\n    <p class=\"no-indent\">「そうか」とやがて僕は言った。</p>\n    <p class=\"no-indent\">「うん」とおかきくんは言った。</p>\n    <p>それだけだった。しかし僕は次の言葉をすぐに見つけることができなかった。彼のナルシシズムの告白はあまりにも流暢で、整然としていて、まるで長い年月をかけて飼い慣らした生き物を、目の前に並べてみせたようだった。その整然さそのものが、彼の言う「自分に酔いしれる構造」の現れなのだということは、おそらくおかきくん自身が一番よくわかっているはずだった。</p>\n    <p class=\"no-indent\">「素晴らしい演説だった、とでも言うべきかな」</p>\n    <p class=\"no-indent\">「演説？」</p>\n    <p class=\"no-indent\">「ああ。素晴らしく中身のない演説だったよ」</p>\n    <p class=\"no-indent\">「随分と冷笑的だね」</p>\n    <p class=\"no-indent\">「そりゃあ冷笑的にもなるだろ。あんなにも流暢で、見事なパフォーマンスをされたら」</p>\n    <p class=\"no-indent\">「パフォーマンス……」</p>\n    <p>おかきくんはぬるくなった珈琲を喉の奥に流し込んだ。</p>\n    <p class=\"no-indent\">「拍手でも送れば満足か？」</p>\n    <p>僕は珈琲カップを揺らした。</p>\n    <p class=\"no-indent\">「確かに、君の言うその『三つの層』とやらは、精緻で、美しくて、ぐうの音も出ないほど論理的だよ」</p>\n    <p class=\"no-indent\">「なら──」</p>\n    <p class=\"no-indent\">「だけどね、おかきくん。君が今嬉々としてやってみせたのは反省でも告白でもない。ただの哀れで愚かな自己弁護に過ぎない。君は自分の醜さや傲慢さを並べ立てて、『化け物だ』『悪魔だ』と自嘲してみせることで、先回りして他人からの批判を無効化しているだけじゃないか。人間、自分をそこまで客観的に、詩的に、憐れみ深く語れるうちは、まだちっとも傷ついていないんだよ」</p>\n    <p>僕の言葉に、おかきくんの眉がぴくりと動いた。</p>\n    <p class=\"no-indent\">「珍しく饒舌だね」</p>\n    <p class=\"no-indent\">「そりゃあ、饒舌にもなるさ」と僕は笑った。「だって君は今、自分の心の闇をスポットライトで照らして、舞台の上で悲劇の主人公を演じているんだ。そしてそんな自分を客観的に見ている『もう一人の自分』に、やっぱりうっとりしているんだよ。これを罵倒しないで、他の何を罵倒すればいい？」</p>\n    <p>その問いに、おかきくんは答えなかった。僕は一口だけ珈琲を飲み、続けた。</p>\n    <p class=\"no-indent\">「結局のところ、君のその壮大な独白のなかに、葉月さんという血の通った一人の人間の重みはどこにあるんだ。君が語っているのはいつだって『葉月さんを鏡にして映し出された、可哀想で繊細な僕の物語』だけだ。彼女が背負ったリスクや、今この瞬間も彼女の生活にへばりついているであろう泥臭い現実から、君はいつも巧妙に目を背けている。言葉をどれだけ複雑に拗らせたって、君がやったことはただひとつ、自分の自尊心を育てるために、大人の女の覚悟をタダで貪り尽くした、それだけだよ。刺されたかっただって？ 冗談じゃない。君は刺されたいんじゃない。刺されることで『ほら見ろ、やっぱり僕は傷つけられる運命だったんだ』と、自分のナルシシズムを正当化する、決定的な免罪符が欲しいだけだ。どこまでも自分、自分、自分。葉月さんが君を刺さずに『楽しかった』とだけ言って去ったのは、その底なしの自意識の格闘に、付き合ってあげる義理なんてないと気づいたからだよ。君のその薄っぺらい悲劇のシナリオに、彼女は自分の人生を付き合わせるのを拒絶したんだ。彼女の『楽しかった』は、君へのメッセージなんかじゃない。『あなたの鏡になってあげるつもりは、もうないわ』という、最大級の突き放しなんだよ。それを君は本当の意味で、わかっているのか？」</p>\n    <p>僕の言葉は、喫茶「昭和」の湿った空気を切り裂き、おかきくんの前に置かれた白磁のカップの縁をかすめて消えた。おかきくんは、しばらくの間、微動だにせず窓の外を見つめていた。結露したガラスの向こうで、小雪はいつの間にか、ただの冷たい雨へと戻っている。アスファルトの上で、それはドラマチックな白さを残すこともなく、ただ黒くにじんで消えていくだけの、どこにでもある冬の雨だった。いつもなら、彼はここで少しだけ唇の端を吊り上げ、「手厳しいね」とでも言いながら、また新しい哲学のヴェールを織り始めたはずだった。僕の批判すらも彼の言う、「第三の層」を補強する新たなパーツとして、彼の精緻なナルシシズムの機械の中に組み込んでみせたはずだった。しかし、おかきくんは何も言わなかった。</p>\n    <p class=\"no-indent\">「そうやって黙り込むことで、傷ついた姿を見せて、僕に罪悪感を抱かせようとしているんだろ」</p>\n    <p>僕は椅子の背もたれに深く寄りかかり、腕を組んで彼を冷たく見下ろした。</p>\n    <p class=\"no-indent\">「答えないわけか、姑息だな」と僕は言った。</p>\n    <p class=\"no-indent\">「……姑息だよ」とおかきくんは、小さく、掠れた声で言った。「だって、君の言う通りだから」</p>\n    <p>その言い方が、また僕を苛立たせた。どこまでも従順で、どこまでも無抵抗。それは反省のポーズを取ることで、これ以上の追及を免れようとする、極めて洗練された保身に他ならなかった。彼は自分が悪者であることを認めることで、悪者である自分を免罪しているのだ。</p>\n    <p class=\"no-indent\">「君はそうやって、これからも生きていくんだよ」</p>\n    <p>僕は冷めきった珈琲を一口もすすらずに、言葉を重ねた。</p>\n    <p class=\"no-indent\">「誰かと出会い、その人を鏡にして自分を愛でて、相手がその不毛さに気づいて呆れて去っていく。あるいは君が先手を打って傷つける。そのたびに君は、この薄暗い喫茶店に逃げ込んできては有線の昭和歌謡を背景に、自分がいかに救いようのない化け物であるかを、飽きもせず反芻するんだ。だけどね、おかきくん。世間は君が思っているほど、その業の深さとやらに興味はないんだよ」</p>\n    <p>僕は机を指先で叩いた。</p>\n    <p class=\"no-indent\">「葉月さんの旦那さんが、なぜ法律家を間に入れて事務的に処理したか、今ならよくわかるよ。彼は君を憎むことすら、君の自意識への加担になるから拒否したんだ。怒鳴り込んだり、殴りつけたりしたら、君はそれこそ刺された僕という極上の悲劇を手に入れてしまう。だから彼は、君をただの処理すべき事務タスクとして扱った。君という存在を、徹底的に記号化して排除したんだ。葉月さんもそうだ。彼女が去ったのは、君が化け物だからじゃない。君との会話が、ただただ退屈になったからだよ。自分のことにしか興味のない男との時間は、どれだけ美辞麗句で飾られていても、結局はただの時間の無駄遣いだからね」</p>\n    <p>おかきくんの童顔が、心なしかいつもより白く見えた。彼の目の奥の焦点は、やはりどこか遠くを向いていたが、そこにはもう太宰治のような陰影はなかった。ただ、輪郭のぼやけた、所在なげな大学生がそこに座っているだけだった。</p>\n    <p class=\"no-indent\">「君はきっと、明日も学食でカレーライスを食べるんだろ」</p>\n    <p>僕はじっと、おかきくんの瞳を見つめた。</p>\n    <p class=\"no-indent\">「悔恨も羞恥もなく、隣の女子学生の声を『丁寧に聞くフリ』をしながら、安っぽいルーを口に運ぶ。そのとき、君は自分の喉を通るカレーが、いかに凡庸で、世俗的で、劇的なドラマから遠ざかっているか、知るべきだ。君の不倫は、誰も幸せにしなかったんじゃない。誰の人生にとっても、たいしたノイズにすらならなかったんだよ。君はそれを理解した上で、すべてを自覚するべきだ」</p>\n    <p>僕がそこまで一息に言い切ったとき、店内の有線放送はあろうことか僕自身の心臓の鼓動をなぞるような、ひどく間の抜けた無音の時間を数秒間だけ作った。それから場違いなほど軽快なメロディが流れ始めた。笠置シヅ子の『東京ブギウギ』だった。あまりにも狂った選曲だった。おかきくんは黙っていた。その沈黙は相変わらず従順で、無抵抗なものに見えた。しかし彼のその徹底した被害者としての佇まいを眺めているうちに、僕の胸の奥底で、ドロドロとした黒い熱量が限界を迎えて沸騰した。僕は彼を糾弾しながら、同時に自分自身の醜悪な内臓を裏返して見せているような、奇妙な自己嫌悪に囚われていた。なぜ僕がこれほどまでにおかきくんの不倫に拘泥し、彼の自意識の構造をストーカーのように分析し、そして今、激しい怒りをぶつけているのか。その本当の理由を、僕は彼に突きつけなければならなかった。そうでなければ、この不公平な糾弾は終わらないような気がした。</p>\n    <p class=\"no-indent\">「おかきくん、僕がなぜここまで君に怒っているか、わかるか？」</p>\n    <p>僕は自分の声を、努めて低く、しかしこれまでにないほど冷酷な響きを込めて絞り出した。</p>\n    <p class=\"no-indent\">「君が自分の歪んだ過去や、両親との関係を免罪符にしているように、僕にだって、君のその安っぽい演劇をどうしても許せない過去があるんだ。僕はね、かつて君と全く同じだったんだよ」</p>\n    <p>おかきくんの視線が、ほんの数ミリだけ動いた。僕は構わずに続けた。</p>\n    <p class=\"no-indent\">「二年前、僕には付き合っていた女性がいた。君の出会った葉月さんのような、落ち着いた、そしてどこか影のある大人の女性だった。僕は彼女を愛していると思っていた。でも、違ったんだ。僕は自分の凡庸さに耐えかねて、他者の無条件の愛を求めていたんだ。彼女の信頼を確かめるために、何度も最低な行為をした。連絡を断ち、わざと傷つけるような言葉を吐き、君と似たような試練を彼女に与えたんだ。相手がボロボロになって僕に縋りついてくることで、ようやく自分の存在を確認できるという、あの薄汚い麻薬のようなものに、僕も溺れていたんだよ」</p>\n    <p>僕は冷めきった珈琲カップを強く握りしめた。指先が白く震えていた。</p>\n    <p class=\"no-indent\">「結果はどうだったと思う？ 君の予想通りさ。彼女は僕のその底なしの自意識に愛想を尽かし、ある日、何も言わずに僕の前から消えた。ドラマチックな別れの言葉も、僕を刺すような激情も残さず、ただ僕という人間を『人生の汚点』として、ゴミ箱にポイっと捨てたんだ。後に残されたのは、自分がどれほど醜く、独りよがりで、凡庸な化け物であるかという、救いようのない事実だけだった。そして僕はそれからというもの、自分の自意識をこれ以上肥大させないために、あえて根暗で、目立たない、何者でもない観察者としての仮面を被って生きることにした。自分の傷を、芸術や哲学に昇華することを禁じて、凡庸な大学生という肩書きに身を浸すことで、自分を罰してきた」</p>\n    <p>僕は身を乗り出し、おかきくんの顔を覗き込んだ。今や僕の顔も、彼と同じくらい歪んでいたはずだ。</p>\n    <p class=\"no-indent\">「だからこそ、僕は君が許せない。僕が必死で抑え込んでいるその醜悪なナルシシズムを、君は『色気』や『哲学』という綺麗なおべべで包み込んで、今もお洒落に消費しているからだ。三つの層？　自己評価の低いナルシスト？　笑わせるな。そんなものは自分が犯した身勝手な裏切りに、それらしい学術的な名前をつけて引き出しに仕舞っているだけに過ぎない。君は僕と同じ、ただの独りよがりの臆病者だ。それ以上でも以下でもない。なのに君は、その傷跡すらも『僕の原罪だ』なんて言葉でロマンチックに飾って、まだ自分の特別さに酔おうとしているんだよ」</p>\n    <p>僕は机を再び叩いた。ガタリと音を立てて、白磁のカップが揺れ、中の黒い液体が数滴、テーブルにこぼれ落ちた。</p>\n    <p class=\"no-indent\">「少しは目を覚ますんだ」</p>\n    <p>僕は語気を強めた。喫茶店のマスターがこちらをチラリと見たが、もうどうでもよかった。</p>\n    <p class=\"no-indent\">「君は刺されたいと言った。すべてを消し去るために殺されたい、と。だけど君は、どこまでも守られている。刺される恐怖も、血を流す痛みも、君は本当の意味では何一つ背負っていないんだよ。葉月さんの夫からも、葉月さん本人からも、まともに憎んでさえもらえなかった君は、今、この僕という、君の鏡にすらなれない凡庸な男に、言葉のナイフでなぶり殺しにされているんだよ。君のその精緻な自意識の城壁を、僕が今、根底から引きずり出して、ここに晒してやっているんだ。苦しいだろ、つらいだろ、それが人の痛みだ。逃げるんじゃない、少しは傷つくことを覚えるんだ」</p>\n    <p>僕の静かな怒号は軽快なジャズの旋律を容赦なく圧殺した。おかきくんの顔から、あのほんのわずかに翳りを帯びた童顔の余裕が消失していくような気配があった。それでも目の前に座るおかきくんは、まだどこか他人事のような、あるいは自分の解剖図を眺める学者のような目で僕を見ていた。その傷つくことのない無抵抗が、僕の視界を完全に怒りで染め上げた。僕の指先は自分の意思を離れたかのように、テーブルの上に置かれていたガラスコップを掴んでいた。──パシャリ、とひどく安っぽく、間の抜けた音がした。コップの中に入っていた冷や水が、おかきくんの顔面に真っ直ぐに浴びせかけられた。整えられた前髪が額にべったりと張り付き、顎のラインから滴る水滴が、彼の着ている上質なセーターの胸元をまたたく間に黒く汚していく。コンビニの店員をはっとさせたあの艶めかしい色気も、太宰治を気取った翳りのある童顔も、水浸しになった前では、一瞬で吹き飛んでいた。</p>\n    <p class=\"no-indent\">「……冷たい」</p>\n    <p>おかきくんは濡れた睫毛を震わせながら、顔を歪めた。しかし僕は彼にハンカチを出す隙も、自意識を立て直す猶予も与えなかった。</p>\n    <p class=\"no-indent\">「哲学ごっこはもう終わりだ」</p>\n    <p>僕は机に両手を突き、水滴を滴らせる彼の顔を、至近距離から冷酷に睨みつけた。</p>\n    <p class=\"no-indent\">「惨めだろ。滑稽だろ。今の君には、それを『理性の敗北』だの『人間の業』だのと言葉で飾る余裕なんてないはずだ。ただただ冷たくて、恥ずかしくて、目の前の男に水をぶっかけられたという、凡庸な事実に直面しているだけだ。それこそが君がずっと無視し続けてきた『現実』なんだよ」</p>\n    <p>おかきくんは顔を拭おうと手を動かしかけたが、僕の言葉の圧力に圧されて、その手を膝の上で硬直させた。</p>\n    <p class=\"no-indent\">「君は『刺されたかった』なんて、さも高尚な心中でも望むかのように言った。けれど君が本当に恐れているのは、誰かに刺されて血を流すことじゃない。自分のその肥大した自意識の劇場が、誰の関心も引かないまま、ただの痛い大学生の独り相撲として幕を閉じることだ。葉月さんも、その旦那さんも、君という人間を真剣に相手にする価値すらないと判断した。君がどれだけ『僕は化け物だ』と脳内で叫ぼうが、彼らにとって君は生活の平穏を少し脅かしただけの男に過ぎないんだよ。自分の存在の解像度が下がっている？　面白いこと言うじゃないか。でもね、はっきり言わせてもらうと、彼らの人生にとってみれば、君という存在は、最初から呆れるくらい薄っぺらなんだよ」</p>\n    <p class=\"no-indent\">「僕は……」</p>\n    <p class=\"no-indent\">「少しは認めろ！」</p>\n    <p>言い訳を紡ごうとする彼の唇を、僕は容赦なく両断した。</p>\n    <p class=\"no-indent\">「君はさっき、自分の弱さや醜さを愛おしいと言った。自分を俯瞰してうっとりしていると言った。じゃあ、今の自分も愛おしいか？ 水浸しになって、髪を張り付かせて、同級生に己の醜態まで暴露されて、喫茶店の隅で震えている今の自分を、君の中の『第二の親』とやらは美しく見つめているのか？ なわけないだろ。今ここにいる君は、悲劇のヒーローでもなければ、孤独を愛する哲学者でもない。ただの、他人の人生を安易にかき乱して、誰からもまともに怒ってもらえず、うつろな心を藁くずで埋めて塞いでいる、哀れな人形に過ぎないんだよ」</p>\n    <p>おかきくんの目から、光が失われていくのがわかった。彼の自慢の城壁──あらゆる批判を「自覚的な自虐」というパーツに変えて取り込んでしまう無敵の論理が、僕の個人的な怨嗟と、あまりにも俗悪な水をかけるという物理的な暴力によって、完全に機能不全を起こしていた。彼はもう窓の外の雨を見ることも、壁の石原裕次郎に救いを求めることもできなかった。ただ、濡れた自分の指先を見つめたまま、言葉を失って野良猫のように小さく丸くなっていた。その顔には、かつて見たことのない本物の絶望と、羞恥の色が、どす黒く滲み出ていた。</p>\n    <p class=\"no-indent\">「君には、もう何も残っていない」</p>\n    <p>僕は立ち上がり、コートを羽織った。テーブルの上には、わずかに残った珈琲と、僕がぶちまけた水が混ざり合い、汚らしい染みを作っていた。</p>\n    <p class=\"no-indent\">「君の不倫はね、おかきくん」</p>\n    <p>僕は最後の一撃を、彼の心臓に向けて正確に突き刺した。</p>\n    <p class=\"no-indent\">「エロくもなければ、哲学的でもない。ただの二十歳そこらのガキが起こした、退屈で、迷惑で、誰の記憶にも残らない『出来心』だよ。君がどれだけ内省的なポーズを取ろうが、君はもう誰にとっても特別な存在じゃない。葉月さんにとって君は、とっくに終わった過去の暇つぶしに過ぎない。そして君のその巨大なナルシシズムは、世界を動かす渦なんかじゃない。この狭い喫茶店の、ぬるい珈琲の底で勝手に回っている、ただの小さなゴミ屑に過ぎないんだよ。ほら、何か言ってみろよ。お得意の哲学で、自己弁護してみせろよ。自分で言ってたじゃないか──化け物なんだろ」</p>\n    <p>おかきくんは黙っていた。彼はもう、自嘲的に笑ってもいなかった。彼はただ、額の前で両手を組み合わせ、窓の外の暗くなっていく空を見ていた。その横顔にはいつもの翳りとは異なる、もっと生々しい何かが静かに貼りついていた。太宰治の顔写真に似ていると言ったのは誰だったか。しかしあの写真の太宰は己の破滅を美学の一部として組み込んでいるような、媚びた陶酔を顔に宿していた。おかきくんの今夜の横顔には、そういった演出の余白が一切なかった。彼はただ容赦なく傷つけられた人間の、剥き出しの感情を、その顔に露わにしていた。</p>\n    <p class=\"no-indent\">「明日、学食でカレーを食べるとき、君は自分がどれだけ底辺に落ちたかを思い知るよ。君の不倫は美しくもなければ、エロくもなかった。ただ、誰も幸せにせず、君自身をここまで無残に貶めただけの、無意味な汚点に過ぎなかった。それを君はこれからの人生で、嫌と言うほど思い知るに違いない」</p>\n    <p>僕は伝票を掴み、ガタガタと音を立ててアルミの引き戸を開けた。背後からは、もう何の気配も、言葉も聞こえてこなかった。有線のジャズだけが、どん底まで追い詰められ、ただの水浸しの塊と化したおかきくんを、冷酷に置き去りにしていた。</p>\n  </div>\n\n  <div class=\"section\" id=\"ch9\">\n    <h2 class=\"section-title\">第九話：長い、長い手紙</h2>\n    <p class=\"no-indent\">おかきくんへ</p>\n    <p>君に水をかけたあの夜から、二週間が経った。伝票を持って「昭和」を出た後、僕は十分ほど雨の中を歩いてから、すでに後悔していた。後悔というのも少し違う。もっと正確に言えば、自分が何をやったのかという事実の輪郭が、冷たい雨の中でゆっくりと像を結び始めて、僕はその輪郭のあまりにも世俗的な醜さに、ただただ黙り込むしかなかった、ということだ。僕は君を言葉で追い詰め、水を浴びせた。それが君への正当な糾弾だったのか、あるいは僕自身の古い傷に突き動かされた、ただの私的な暴力だったのか、今もまだ整理がついていない。だからこれは謝罪の手紙ではない。もちろん、言い訳の手紙でもない。ただ、あの夜以降、ずっと僕の頭の中で渦を巻いていることを、一度言葉にして外に出さなければ、自分が何か大切なものを飲み込んだまま消化できずにいる気がして、こうして書いている。</p>\n    <p>さておかきくん、君は葉月さんが刺してくれなかったことについてどう思っているだろう。僕は最近、こう考えるようになったんだ。葉月さんは、君を刺したんじゃないか、と。ただ、君が望んでいたような刃物や血の滴る劇的な凶器ではなく、もっと静かで、冷たくて、逃げ場のない誠実さという刃で。「楽しかったよ」という、あの過去形の一言。それは君のナルシシズムの劇場に優しく、しかし容赦なく突き立てられたナイフだったのではないか。君がずっと待ち望んでいた刺されるという究極の試練を、彼女はあえて拒否することで、逆に君を取り返しがつかないほど深く刺したのではないか。血は出なかった。傷痕は目に見えなかった。けれど、君の物語を君自身が大切に育ててきた救いようのない化け物としての自分を、静かに、しかし決定的に切り裂いたのではないか。君は抱かれるよりも刺されたかったと言った。自分が傷つけ、破壊した相手に、一思いに殺されることで、自分の存在の重さを、罪の深さをようやく実感したかったのだろう。相手が血を流し、叫び、憎悪をぶつけてくれることで、「ほら見ろ、僕はこれほどまでに誰かを傷つける価値のある人間だった」と、自分の物語を完結させたかった。そしてそこにこそ、自己評価の低いナルシストである君が求める、絶対的な存在証明があった。しかし葉月さんは、それをしなかった。刃を振り下ろさず、夫に発覚した後も、修羅場を作らず、ただ「楽しかったよ」と、穏やかで、整然とした、まるで事務的な確認のような言葉を残して去った。三十四歳の人妻として、君という大学生との不倫に身を委ねながらも、最後まで自分の人生の主体性を手放さなかった。彼女は君のシナリオに付き合わなかった。君を悲劇の相手役として消費しなかった。代わりに、彼女は誠実さという最も冷たい刃で、こう告げたのだ。「これは私の人生の一部分だった。あなたとの時間は確かに楽しかったけれど、それはもう終わったこと。あなたがどれだけ深く傷つき、どれだけ美しい孤独を背負おうと、それは私の物語ではないわ」と、その誠実さが、君を刺した。それは君の三つの層──ナルシシズム、自己評価の低さ、そしてその融合が生む化け物──を、すべて無効にするような一撃だった。君がどれだけ「僕は化け物だ」と叫んでも、彼女は「ええ、そうかもしれないわね。でも私はもうあなたの鏡にはならない」と静かに微笑んで背を向けた。そこに憎しみも、激情も、救済もなかった。ただ、淡々とした、三十四歳の女性が自分の人生を守るための、極めて誠実な線引きだけがあった。そしてそれがきっと、大人の分別というものなんだよ。</p>\n    <p>ただ、おかきくん、僕は思うんだ。君が本当に恐れていたのは刺される痛みそのものではなかった。刺されたあとに訪れるかもしれない何も残らない果てしない虚無だったのではないか、と。だけど葉月さんが刃を下ろさなかったことで、君は初めて自分の物語が世界にとってただの出来心に過ぎなかったことを、否応なく突きつけられた。血も、叫びも、永遠の傷も残らず、ただ楽しかったという軽やかな過去形だけが残った。その事実に、君は今も戸惑っているだろう。彼女の誠実さは、君の弱さを許さなかった。君の過去の両親の期待も、第二の親となった内なる監視者も、試練を与えては関係を絶つという繰り返しも──それらすべてを彼女は知った上で受け入れ、しかし最後にそれでも「私の人生は私のものよ」と切り離した。君が葉月さんに求めていたのは、鏡としての愛だった。自分の醜さや繊細さを、深く深く映し返してくれる存在だった。でも葉月さんは鏡になることを拒否した。代わりに、一人の独立した人間として、君と向き合った。その拒絶の誠実さが、君の心に最も深い傷を残したのだと思う。これはすごいことだよ。</p>\n    <p>そして何より、あの夜、僕が君に向けて浴びせた言葉の数々を今になって読み返すと、ずいぶん多くのことを言いすぎたと思う。言いすぎた、というのは量の問題ではなく、僕が君を責めながら実際には自分を責めていたという点だ。僕は確かに、かつて君と似たことをした人間だ。それは、事実だ。そしてその事実を、もう少し詳しく書いておこうと思う。</p>\n    <p>今まで君にきちんと話したことはなかったけれど、この手紙を書き始めてから僕はずっとその記憶と向き合っている。彼女は僕より三つ年上で、当時はもう働いていた。出会ったのは、大学の近くの古い定食屋だった。カウンターだけの狭い店で、僕はいつも一人で夕食を済ませていた。ある日、隣の席に彼女が座り、たまたま同じ定食を頼んで、たまたま同じタイミングで「ここの味噌汁っていつも少ししょっぱいですよね」と、誰にともなく呟いた。僕はその言葉に思わず頷いてしまい、それが会話の始まりだった。君と葉月さんの本屋の話と、驚くほど似た始まり方だと、今書きながら気づいた。人間は結局、似たような偶然の入り口から、似たような部屋に迷い込むのかもしれない。</p>\n    <p>彼女は落ち着いていて、物静かで、でも決して受け身な人ではなかった。むしろ彼女は自分の意見をはっきり持っていて、僕の言うことに簡単には同意しなかった。それが最初は新鮮だった。それまで僕の周りにいた人たちは、僕が何かを言うと、大体において肯定してくれるか、少なくとも反論を避けてくれるかのどちらかだったから。彼女だけが、僕の言葉を一度自分の中で咀嚼してから、違うと思えば「それは違うと思う」とはっきり言った。僕はそれに惹かれた。今思えば、惹かれたというより、試されているような緊張感に酔っていたのかもしれない。付き合い始めて最初の数か月は、本当に穏やかだった。彼女と話していると、時間の流れが変わるような感覚があった──君が葉月さんについて言っていたのと、まったく同じ表現を、僕もかつて使っていたことにこの手紙を書きながら気づいて、少し愕然としている。しかしその穏やかさが、僕にとってはいつしか物足りなくなっていった。正確に言うと物足りなくなったのではなく、怖くなっていったのだと思う。彼女が僕を穏やかに愛してくれればくれるほど、僕はその愛が本物かどうか、確かめずにはいられなくなった。普通に愛されているだけでは、僕は自分の存在を信じることができなかった。これは君の言葉を借りるなら、僕の中にも「第二の親」がいたということなんだろう。僕が最初にやったのは、些細な連絡の途絶えだった。忙しいふりをして、彼女からのメッセージに三日、四日と返事をしなかった。彼女は最初、心配して何度も連絡をくれた。そのたびに僕は、彼女の心配の量を、まるで温度計の目盛りを読むように、冷静に観察していた。ああ、これだけ心配してくれるんだ、と。その観察自体が、もう歪んでいたんだと今は思う。彼女が本当に心配していたのは、単純に僕という人間の身を案じてのことだったのに、僕はそれを、自分の存在価値を測るための数値として消費していた。次第に、僕のやり口はもっと悪質になっていった。わざと彼女の前で、別の女性の話をした。深い意味はないと言い訳しながら、彼女の顔色が曇るのを、横目でじっと窺っていた。彼女が傷ついた顔をすると、僕の中で奇妙な安堵が広がった。ああ彼女はまだ僕に執着してくれている、と。そのくせ彼女が本当に怒って距離を置こうとすると、僕は今度は必死に謝り、彼女を引き戻そうとした。試練を与えては、引き戻す。突き放しては、抱き寄せる。まさに君が言っていた通りの卑怯な行為だった。それを僕は当時、自分でも気づかずにやっていた。いや、正確にはうっすらと気づいていながら、気づかないふりをしていた。</p>\n    <p>彼女が最終的に僕から離れたときのことを、僕はよく覚えている。特別な事件があったわけではない。ある晩、彼女は静かにこう言った。「あなたは私のことが好きなんじゃなくて、私に好かれている自分のことが好きなんだと思う」と。君が葉月さんから言われた言葉と、あまりにも似ている一言だった。この手紙を書きながら、僕はその偶然に何度も立ち止まってしまう。もしかしたら僕たちのような人間を見抜く言葉は、いつだって同じかたちをしているのかもしれない。彼女はその一言を残して、それ以上何も言わず、静かに荷物をまとめて、僕の部屋を出て行った。ドラマチックな修羅場も、涙も、罵倒もなかった。ただ、ドアが静かに閉まる音だけが、部屋に残った。その後、僕は何か月もの間、自分がどれほど醜い人間だったかを繰り返し、反芻していた。反芻していた、というのは正確ではないかもしれない。むしろ僕はその反芻という行為そのものに、どこかで陶酔していたんだと思う。傷ついている自分、後悔している自分、それを客観視できる自分──そういう幾重にも重なった自己像を僕は一人きりの部屋で、飽きもせず眺め続けていた。君がさっき語った「第三の層」と、恐ろしいほど同じ構造だ。僕は君を糾弾しながら、実のところ、自分がかつて陥っていた沼の底を、もう一度覗き込んでいたに過ぎなかったのかもしれない。それから僕は自分自身にある種の禁欲を課した。自分の傷を、言葉で美しく飾ることを禁じた。誰かに何かを語るときは、極力平坦に、極力凡庸に話すようにした。それは反省というより、むしろ罰のようなものに近かった。僕は自分の内面を語る資格を、一時的に剥奪したかったんだと思う。だからこそ君と出会ってからのこの数か月、君の饒舌で詩的な独白を聞くたびに、僕の中で何か引っかかるものがあった。羨ましさだったのか、嫌悪だったのか、あるいはその両方だったのか、今でもうまく言葉にできない。そしてあの夜、水をかけたとき、僕はきっと君に対して怒っていたと同時に、二年前の自分に対しても、遅すぎる罰を与えていたのだと思う。あのとき彼女が僕にしてくれなかったこと──怒鳴りつけること、水をかけること、僕の醜い自意識の城壁を力づくで壊すことを僕は君に代わりにやってもらいたかったのかもしれない。いや、逆だ。僕が君にそれをすることで、あのとき彼女が僕にしてくれなかった仕打ちを、自分で自分に施していたのかもしれない。ずいぶんとねじれた話だと思う。だから、僕が君を責める資格が本当にあったのかどうか、今でもわからない。ただ一つ言えるのは、僕は君のことを断罪しながら、実際には、二年前の自分自身の姿を、君という鏡越しに正面から怒鳴りつけていた、ということだ。そしてそれが正しいのなら、あの夜の僕もまた、君を鏡にして、自分自身を愛でていたということになる。皮肉な話だけれど、君が葉月さんを鏡にして自分を見ていたのと同じように、僕も君を鏡にして、自分の過去を見ていた、ということなのだろう。お互い、誰かを鏡にしないと自分の姿を見ることができない、不器用な人間なのかもしれない。哀しいことに。</p>\n    <p>それでも一つだけ、あの夜に伝え損ねたことがある。だからこの場を借りてちゃんと伝えたいと思う。はっきり言う。君はこれから先も、間違いなく誰かを傷つけることになると思う。それは予言でも呪いでもない。ただの洞察だ。君の中のナルシシズムはあの夜の水程度では消えないし、葉月さんとの経験が君を別の人間に作り変えるわけでもない。人間はそんなに簡単に変わらない。君も僕も含めて。だから君は、また誰かを好きになり、その人を近づけ、関係の強度を試そうとする。そしてその衝動が動き始めたとき、君は少しの間、立ち止まるかもしれない。あるいは一歩も立ち止まらないかもしれない。どちらになるかは、僕にはわからない。でも立ち止まれる可能性が、以前の君にはなかった。そして葉月さんが君に与えたのは、そのわずかな可能性なのだと思う。傷でも赦しでもなく、君のシナリオの外に出るための目に見えないほど細い裂け目のようなものを、あの楽しかったという言葉が、君の中に入れた。その裂け目から何が入り込むかは、これから先の君次第だ。だから君には頑張ってもらいたいと、僕は無責任に思う。</p>\n    <p>そしてその上でおかきくん、一つ聞いていいか。君は喫茶「昭和」のあの使い古されたソファに深く腰掛けて、珈琲の湯気をぼんやり眺めているとき、何を考えているんだろう。文庫本を開くでもなく、携帯を弄るでもなく、ただ時間を消費しているあの時間に。正直に言うと、僕はそれが前からずっと気になっていたんだ。あの店のどこが好きなのか、と聞いたことはあったけれど、君はいつも「なんとなく」と言って濁してしまった。でも最近、少しわかってきた気がする。あの店は何も期待してこないんだ、君に。石原裕次郎は遠い目をしているだけで、マスターは珈琲を出すだけで、有線は関係なく流れ続ける。誰も君を試さないし、君も誰も試さなくていい。ただそこにいるだけで、君の存在は拒絶もされなければ特別扱いもされない。あの薄暗い喫茶店は、君にとっての唯一の、関係の外にある場所なんじゃないか。だとしたら、君は本当は、いつだってその場所を欲しがっていた。試されない場所を。証明しなくていい場所を。楽しかった、という言葉だけで完結できる、静かな場所を。葉月さんはきっとそれを知っていた。だから彼女は最後に刃ではなく、「楽しかった」という言葉の誠実さで君を刺した。そしてそれは別れの言葉であると同時に、そういう時間をわたしたちは持てたよ、という確認だったのだと思う。誰かを傷つけることも、傷つけられることも、関係の強度を試すことも何もなく、ただ同じ本棚の前で同時に同じ背表紙に手を伸ばした、あの最初の偶然のような時間を、わたしたちは確かに持てたよ、という。そしてその言葉を、きっと君はまだ手放せないでいるのだろう。だけど手放さなくていいと僕は思う。手放せないことが、たぶん正しい。葉月さんはもう戻らないし、君が傷つけた関係は元には戻らない。それでも手放せないということは、君が葉月さんを、自分の鏡としてではなく、一人の別個の人間として、少なくともあの瞬間には見ていたということだと思うから。その手放せなさだけは、君のどんな自意識の産物でもない、本物だ。だから、君にはそれを大切にしてほしいし、これから活かしてほしいと思う。</p>\n    <p>最後に、もうすぐ桜が咲く。君はたぶん、花見にも行かず、喫茶「昭和」で珈琲を飲んでいるんだろう。セピア色の石原裕次郎を眺めながら、有線の昭和歌謡を聞きながら、珈琲カップを両手で包んで、特に何も考えていないふりをしながら、いろんなことを考えているんだろう。もし君がそうなら、桜が咲く前に、また会おう。今度は誰も刺し合いをせず、ただ珈琲を飲みながら、くだらない話をしよう。君の内なる化け物の話でも、葉月さんの残影でも、僕の二年前の愚かさでもいい。試し合いも、証明し合いも、哲学ごっこも最小限にして、ただ時間を消費するんだ。あの店が教えてくれる、唯一の優しい生き方のように。葉月さんの誠実さが君を刺したように、僕もいつか、誰かの誠実さに刺される日が来るかもしれない。そのとき、僕たちは少しだけ、刃を恐れずに向き合える人間になれているだろうか。それはわからない。ただあの夜は怒鳴りつけることしかできなかったけれど、今度はもう少し、まともな話ができる気がするんだ。だから、また会おう。もし会えるなら、珈琲の一杯くらいは、僕が奢ってあげるよ。楽しみにしててくれ。</p>\n    <p class=\"no-indent\">追伸。あの夜こぼした水、ちゃんとマスターに謝ったか。謝っていないなら一緒に謝ろう。何しろ、あの店には長居させてもらっているからな。</p>\n  </div>"}]}</script>
<script type="module">
/* =========================================================

  const firebaseConfig = {

  const DEFAULTS = JSON.parse(document.getElementById("site-data").textContent);

  /* 隠し作品：管理画面の「隠し」で secret:true にした作品が対象 */
  function isSecretUnlocked() {
    try { return sessionStorage.getItem("luna3-secret-unlocked") === "1"; } catch (e) { return false; }

  function setSecretUnlocked(v) {

  var _factorUnlockedMem = false;

  function isFactorUnlocked() {
    if (_factorUnlockedMem) return true;
    try { return sessionStorage.getItem("luna3-factor-unlocked") === "1"; } catch (e) { return false; }
  }
  function setFactorUnlocked(v) {
    _factorUnlockedMem = !!v;
    try { sessionStorage.setItem("luna3-factor-unlocked", v ? "1" : "0"); } catch (e) {}

  var currentUser = null;

  var app = document.getElementById("app");

  var siteSidebarNav = document.getElementById("site-sidebar-nav");

  var manageMode = false;

  function isAdmin() { return !!currentUser; }
  function isManaging() { return !!currentUser && manageMode; }
  function setManageMode(on) {
    manageMode = !!on;
    try { sessionStorage.setItem("luna3-manage-mode", manageMode ? "1" : "0"); } catch (e) {}
    updateFab();
  }

  /* ===== HTMLエスケープ ===== */
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  /** 長い章タイトル用：：や、の直後で改行しやすくする */
          function softBreakTitle(text) {
    var t = esc(String(text == null ? "" : text));
    // 入りきらないときだけ「、」の直後で折り返せるようにする（強制改行はしない）
    t = t.replace(/([、,])/g, "$1<wbr>");
    return t;
  }

  function looksLikeHtml(s) {
    return /<[a-zA-Z][\s\S]*>/.test(String(s || ""));
  }

  function plainToBr(text) {
    return esc(String(text == null ? "" : text).replace(/\r\n/g, "\n")).replace(/\n/g, "<br>");
  }

  function brToPlain(html) {
    return String(html == null ? "" : html)
      .replace(/\r\n/g, "\n")
      .replace(/<br\s*\/?>/gi, "\n")
      .replace(/<\/p>\s*<p[^>]*>/gi, "\n\n")
      .replace(/<\/?p[^>]*>/gi, "\n")
      .replace(/&nbsp;/g, " ")
      .replace(/&amp;/g, "&")
      .replace(/&lt;/g, "<")
      .replace(/&gt;/g, ">")
      .replace(/&quot;/g, '"')
      .replace(/&#39;/g, "'")
      .replace(/<[^>]+>/g, "")
      .replace(/\n{3,}/g, "\n\n")
      .trim();
  }

  function formatShort(s) {
    if (s == null || s === "") return "";
    if (looksLikeHtml(s)) return s;
    return plainToBr(s);
  }

  function splitParas(body) {
    // 戻り値: 文字列（段落）または { sceneBreak: true }
    var paras = [];
    var buf = [];
    var pendingBreak = false;
    String(body || "").split("\n").forEach(function (ln) {
      if (ln.trim() === "") {
        if (buf.length) {
          paras.push(buf.join(""));
          buf = [];
          pendingBreak = true;
        } else if (paras.length) {
          pendingBreak = true;
        }
      } else {
        if (pendingBreak && paras.length) {
          paras.push({ sceneBreak: true });
          pendingBreak = false;
        }
        buf.push(ln.trim());
      }
    });
    if (buf.length) {
      if (pendingBreak && paras.length) paras.push({ sceneBreak: true });
      paras.push(buf.join(""));
    }
    return paras;
  }

  function parasToHtml(paras) {
    return paras.map(function (p) {
      if (p && typeof p === "object" && p.sceneBreak) return '<hr class="scene-break" />';
      var noIndent = /^[「『（(\[【─―—]/.test(p);
      return "<p" + (noIndent ? ' class="no-indent"' : "") + ">" + esc(p) + "</p>";
    }).join("\n    ");
  }

  /** 本文プレーンテキスト → 目次付き HTML
      書式:
        # 章タイトル
        段落（空行で区切る）
        「会話文」もそのまま
        # あとがき   ← 特別扱い（折りたたみあとがき）
  */
  function plainToContent(text) {
    text = String(text == null ? "" : text).replace(/\r\n/g, "\n").replace(/^\uFEFF/, "").trim();
    if (!text) return "";
    if (looksLikeHtml(text) && (text.indexOf("class=\"section\"") >= 0 || text.indexOf("id=\"toc\"") >= 0)) {
      return text;
    }

    var lines = text.split("\n");
    var chapters = [];
    var current = { title: null, lines: [] };
    lines.forEach(function (line) {
      var m = line.match(/^#+\s+(.+)$/);
      if (m) {
        if (current.title !== null || current.lines.some(function (l) { return l.trim(); })) {
          chapters.push(current);
        }
        current = { title: m[1].trim(), lines: [] };
      } else {
        current.lines.push(line);
      }
    });
    if (current.title !== null || current.lines.some(function (l) { return l.trim(); })) {
      chapters.push(current);
    }
    if (!chapters.length) {
      chapters.push({ title: null, lines: lines });
    }

    var tocItems = [];
    var sectionsHtml = [];
    var afterwordHtml = "";
    var chIndex = 0;
    chapters.forEach(function (ch) {
      var title = ch.title || "";
      var isAfterword = /^あとがき/.test(title);
      var body = ch.lines.join("\n").trim();
      var paras = splitParas(body);

      if (isAfterword) {
        afterwordHtml =
          '<div class="afterword-section">\n' +
          '  <button type="button" class="afterword-toggle" aria-expanded="false">最後に</button>\n' +
          '  <div class="afterword-content" hidden>\n' +
          '    <h2 class="aw-title">' + esc(title || "あとがき") + "</h2>\n" +
          "    " + parasToHtml(paras) + "\n" +
          "  </div>\n</div>";
        return;
      }

      var id = "ch" + chIndex;
      chIndex += 1;
      var displayTitle = title || (chapters.length === 1 ? "" : ("第" + chIndex + "話"));
      if (displayTitle) {
        tocItems.push('<li><a href="#' + id + '">' + softBreakTitle(displayTitle) + "</a></li>");
      }
      var titleHtml = displayTitle
        ? '  <h2 class="section-title">' + softBreakTitle(displayTitle) + "</h2>\n"
        : "";
      sectionsHtml.push(
        '<div class="section" id="' + id + '">\n' +
        titleHtml +
        "    " + parasToHtml(paras) + "\n" +
        "</div>"
      );
    });

    var toc = tocItems.length
      ? '<div id="toc">\n  <ol>\n    ' + tocItems.join("\n    ") + "\n  </ol>\n</div>\n\n"
      : "";
    return toc + sectionsHtml.join("\n\n") + (afterwordHtml ? "\n\n" + afterwordHtml : "");
  }

  /** 既存 HTML 本文 → 編集用プレーンテキスト */
  function contentToPlain(html) {
    if (html == null || html === "") return "";
    if (!looksLikeHtml(html)) return String(html);
    try {
      var doc = new DOMParser().parseFromString("<div id='__root'>" + html + "</div>", "text/html");
      var root = doc.getElementById("__root") || doc.body;
      var sections = root.querySelectorAll(".section");
      var parts = [];
      if (sections.length) {
        sections.forEach(function (sec) {
          var titleEl = sec.querySelector(".section-title");
          if (titleEl) {
            var t = (titleEl.textContent || "").trim();
            if (t) parts.push("# " + t);
          }
          sec.querySelectorAll("p").forEach(function (p) {
            var t = (p.textContent || "").trim();
            if (t) parts.push(t);
          });
        });
      }
      var aw = root.querySelector(".afterword-content");
      if (aw) {
        var awTitle = aw.querySelector(".aw-title");
        parts.push("# " + ((awTitle && awTitle.textContent) || "あとがき").trim());
        var epi = aw.querySelector(".aw-epigraph");
        if (epi) {
          var epiLines = [];
          epi.querySelectorAll("span").forEach(function (sp) {
            var t = (sp.textContent || "").trim();
            if (t) epiLines.push(t);
          });
          if (epiLines.length) parts.push(epiLines.join("\n"));
        }
        aw.querySelectorAll("p").forEach(function (p) {
          var t = (p.textContent || "").trim();
          if (t) parts.push(t);
        });
      }
      if (parts.length) {
        return parts.join("\n\n").replace(/\n{3,}/g, "\n\n").trim();
      }
      return brToPlain(html);
    } catch (e) {
      return brToPlain(html);
    }
  }

  /** 保存済み HTML から余分な <main> ラップを外す */
  function normalizeWorkHtml(html) {
    html = String(html == null ? "" : html);
    if (!html) return "";
    // 内側にネストされた <main id="honbun">...</main> を中身だけに展開
    html = html.replace(/<main\b[^>]*\bid=["']honbun["'][^>]*>/gi, "");
    html = html.replace(/<main\b[^>]*>/gi, "");
    html = html.replace(/<\/main>/gi, "");
    return html.trim();
  }

    function applyTitleSoftBreaks(html) {
    html = String(html || "");
    // 章タイトル
    html = html.replace(
      /(<h2\b[^>]*class="[^"]*section-title[^"]*"[^>]*>)([\s\S]*?)(<\/h2>)/gi,
      function (_, open, inner, close) {
        var text = inner.replace(/<[^>]+>/g, "")
          .replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"');
        return open + softBreakTitle(text) + close;
      }
    );
    // 目次リンク
    html = html.replace(
      /(<a\b[^>]*href="#ch\d+"[^>]*>)([\s\S]*?)(<\/a>)/gi,
      function (_, open, inner, close) {
        var text = inner.replace(/<[^>]+>/g, "")
          .replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"');
        return open + softBreakTitle(text) + close;
      }
    );
    return html;
  }


  /** 本文HTMLから文字数を数える（タグ・空白除外） */
  function countWorkChars(content) {
    var text = String(content == null ? "" : content)
      .replace(/<script[\s\S]*?<\/script>/gi, "")
      .replace(/<style[\s\S]*?<\/style>/gi, "")
      .replace(/<[^>]+>/g, "")
      .replace(/&nbsp;/gi, " ")
      .replace(/&amp;/gi, "&")
      .replace(/&lt;/gi, "<")
      .replace(/&gt;/gi, ">")
      .replace(/&quot;/gi, '"')
      .replace(/&#(\d+);/g, function (_, n) {
        try { return String.fromCharCode(Number(n)); } catch (e) { return ""; }
      })
      .replace(/\s+/g, "");
    return text.length;
  }

  /** 「12,345文字/25分」形式。読了目安は約500字/分 */
  function formatWorkReadingMeta(content) {
    var n = countWorkChars(content);
    if (n <= 0) return "0文字/0分";
    var mins = Math.max(1, Math.ceil(n / 500));
    var num = (typeof n.toLocaleString === "function") ? n.toLocaleString("ja-JP") : String(n);
    return num + "文字/" + mins + "分";
  }

  function formatContent(s) {
    if (s == null || s === "") return "";
    if (looksLikeHtml(s) && (s.indexOf("class=\"section\"") >= 0 || s.indexOf("<p") >= 0 || s.indexOf("id=\"toc\"") >= 0)) {
      return applyTitleSoftBreaks(normalizeWorkHtml(s));
    }
    return applyTitleSoftBreaks(plainToContent(s));
  }

  /* ===== Firestore 初期化・読み込み =====
     注意: 初期データの書き込み(seed)はログインしていないと
     セキュリティルールにより失敗するため、管理者がログインして
     いるときだけ実行します。未ログイン時にFirestoreが空だった
     場合は、ページ内蔵の初期データをその場だけ表示します
     （保存はされません。管理者が一度ログインすれば自動的に
     Firestoreへ書き込まれ、以後は全員に永続的に反映されます）。
  ===== */
  async function ensureSeededIfAdmin() {
    if (!isAdmin()) return;
    var metaSnap = await getDoc(META_REF);
    if (!metaSnap.exists()) {
      await setDoc(META_REF, { site: DEFAULTS.site, theme: { bg: "#060508", fg: "#e6e2dc", accent: "#9a8b7a" } });
    }
    var worksSnap = await getDocs(WORKS_COL);
    if (worksSnap.empty) {
      var batch = writeBatch(db);
      DEFAULTS.works.forEach(function (w) {
        var ref = doc(db, "site_works", w.id);
        batch.set(ref, {
          number: w.number, title: w.title, subtitle: w.subtitle,
          desc: w.desc, content: w.content,
          order: DEFAULTS.works.indexOf(w),
          published: w.published !== false,
          secret: !!w.secret
        });
      });
      await batch.commit();
    }
  }

  async function loadData() {
    try {
      await ensureSeededIfAdmin();
    } catch (e) {
      console.warn("seed skipped:", e);
    }
    try {
      var metaSnap = await getDoc(META_REF);
      var worksSnap = await getDocs(WORKS_COL);
      if (!metaSnap.exists() || worksSnap.empty) {
        // Firestoreがまだ空（未ログイン状態で初回アクセスなど）
        cache = { site: DEFAULTS.site, theme: { bg: "#060508", fg: "#e6e2dc", accent: "#9a8b7a" }, works: DEFAULTS.works.map(function (w) {
          return Object.assign({}, w, { published: w.published !== false });
        }) };
        return cache;
      }
      var meta = metaSnap.data();
      var works = [];
      worksSnap.forEach(function (d) {
        var row = Object.assign({ id: d.id }, d.data());
        if (row.published === undefined) row.published = true;
        if (row.secret === undefined) row.secret = false;
        works.push(row);
      });
      works.sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
      cache = {
        site: Object.assign({ title: "", subtitle: "", epigraph: "", catchcopy: "", subcopy: "" }, meta.site || {}),
        theme: meta.theme,
        works: works
      };
      return cache;
    } catch (e) {
      console.warn("読み込みに失敗、初期データを表示します:", e);
      cache = { site: DEFAULTS.site, theme: { bg: "#060508", fg: "#e6e2dc", accent: "#9a8b7a" }, works: DEFAULTS.works.map(function (w) {
        return Object.assign({}, w, { published: w.published !== false });
      }) };
      return cache;
    }
  }

  /* メニュー操作でフォーカスが外れても、直前の本文キャレット位置を覚えおく */
  var _savedEditorRange = null;
  var _savedEditorBody = null;
  document.addEventListener("selectionchange", function () {
    if (!document.body.classList.contains("is-editing")) return;
    var sel = window.getSelection();
    if (!sel || !sel.rangeCount || sel.isCollapsed === undefined) return;
    var node = sel.anchorNode;
    if (!node) return;
    if (node.nodeType === 3) node = node.parentNode;
    if (!node || !node.closest) return;
    var body = node.closest(".chapter-edit-body");
    if (!body) return;
    try {
      _savedEditorRange = sel.getRangeAt(0).cloneRange();
      _savedEditorBody = body;
    } catch (err) {}
  });

  /** 編集中の本文キャレット位置に区切り線を挿入（メニュー／ツールバー共用） */
  function insertSceneBreakAtCursor() {
    if (!document.body.classList.contains("is-editing")) {
      alert("編集モードでのみ区切り線を追加できます");
      return;
    }
    var sel = window.getSelection();
    var body = null;
    var range = null;

    if (sel && sel.rangeCount) {
      var node = sel.anchorNode;
      if (node && node.nodeType === 3) node = node.parentNode;
      if (node && node.closest) body = node.closest(".chapter-edit-body");
      if (body) {
        try { range = sel.getRangeAt(0); } catch (err) {}
      }
    }
    // メニュー操作で選択が消えている場合は保存済み位置を使う
    if (!body && _savedEditorBody && document.body.contains(_savedEditorBody)) {
      body = _savedEditorBody;
      range = _savedEditorRange;
    }
    if (!body) {
      var jumpEl = document.getElementById("chapter-jump");
      var blocks = app.querySelectorAll(".chapter-edit-block");
      var idx = jumpEl ? jumpEl.value : "";
      var block = (idx !== "" && blocks[idx]) ? blocks[idx] : blocks[0];
      body = block ? block.querySelector(".chapter-edit-body") : null;
    }
    if (!body) {
      alert("区切り線を入れる章の本文を選択してください");
      return;
    }

    var hr = document.createElement("hr");
    hr.className = "scene-break";
    try {
      if (range && body.contains(range.commonAncestorContainer)) {
        var r = range.cloneRange();
        r.collapse(false);
        var container = r.commonAncestorContainer;
        if (container.nodeType === 3) container = container.parentNode;
        var p = container && container.closest ? container.closest("p") : null;
        if (p && body.contains(p)) {
          if (p.nextSibling) body.insertBefore(hr, p.nextSibling);
          else body.appendChild(hr);
        } else {
          r.insertNode(hr);
        }
      } else {
        body.appendChild(hr);
      }
    } catch (err) {
      body.appendChild(hr);
    }

    try {
      body.focus();
      var after = hr.nextElementSibling;
      if (!after) {
        after = document.createElement("p");
        after.innerHTML = "<br>";
        body.appendChild(after);
      }
      var r2 = document.createRange();
      r2.selectNodeContents(after);
      r2.collapse(true);
      var s2 = window.getSelection();
      s2.removeAllRanges();
      s2.addRange(r2);
      _savedEditorRange = r2.cloneRange();
      _savedEditorBody = body;
    } catch (err2) {}
  }

  function slugifyId(title) {
    var base = String(title || "")
      .trim()
      .toLowerCase()
      .replace(/[^\w぀-ヿ㐀-鿿]+/g, "-")
      .replace(/^-+|-+$/g, "")
      .slice(0, 40);
    if (!base) base = "work";
    var id = base;
    var n = 2;
    var existing = {};
    (cache && cache.works || []).forEach(function (w) { existing[w.id] = true; });
    while (existing[id]) {
      id = base + "-" + n;
      n += 1;
    }
    return id;
  }

  function nextWorkNumber() {
    var roman = ["I","II","III","IV","V","VI","VII","VIII","IX","X",
      "XI","XII","XIII","XIV","XV","XVI","XVII","XVIII","XIX","XX"];
    var n = (cache && cache.works ? cache.works.length : 0);
    return roman[n] || String(n + 1);
  }

  async function createWork(fields) {
    var id = slugifyId(fields.title);
    var order = (cache && cache.works) ? cache.works.length : 0;
    var initialBody = (fields.firstChapterTitle || "プロローグ").trim();
    var content = plainToContent("# " + initialBody + "\n\n（ここに本文を書いてください）");
    await setDoc(doc(db, "site_works", id), {
      number: (fields.number || nextWorkNumber()).trim(),
      title: (fields.title || "").trim(),
      subtitle: (fields.subtitle || "").trim(),
      desc: plainToBr(fields.desc || ""),
      content: content,
      order: order,
      published: true,
      secret: false
    });
    return id;
  }

  /* ===== 星空演出 ===== */
  function createSkyStars(n) {
    document.querySelectorAll(".sky-star").forEach(function (el) { el.remove(); });
    var frag = document.createDocumentFragment();
    for (var i = 0; i < n; i++) {
      var el = document.createElement("span");
      el.className = "sky-star";
      var size = Math.random() < 0.16 ? (1.3 + Math.random() * 0.7) : (0.6 + Math.random() * 0.65);
      el.style.width = size + "px";
      el.style.height = size + "px";
      el.style.left = (Math.random() * 100) + "vw";
      el.style.top = (Math.random() * 100) + "vh";
      if (size > 1.2) el.style.boxShadow = "0 0 " + (1 + Math.random()) + "px rgba(210,220,255,0.3)";
      var duration = 2.8 + Math.random() * 6.5;
      el.style.animationDuration = duration + "s";
      el.style.animationDelay = (-Math.random() * duration) + "s";
      el.style.setProperty("--dim", String(0.07 + Math.random() * 0.16));
      el.style.setProperty("--bright", String(0.32 + Math.random() * 0.42));
      frag.appendChild(el);
    }
    document.body.appendChild(frag);
  }

  function spawnShootingStar() {
    var star = document.createElement("div");
    star.className = "shooting-star";
    star.style.left = (5 + Math.random() * 70) + "vw";
    star.style.top = (3 + Math.random() * 35) + "vh";
    var dir = Math.random() > 0.3 ? 1 : -1;
    var dist = 200 + Math.random() * 260;
    var angle = dir > 0 ? (18 + Math.random() * 42) : (125 + Math.random() * 38);
    star.style.setProperty("--angle", angle + "deg");
    star.style.setProperty("--dist", dist + "px");
    document.body.appendChild(star);
    void star.offsetWidth;
    star.classList.add("is-flying");
    setTimeout(function () { if (star.parentNode) star.parentNode.removeChild(star); }, 1500);
  }

  var shootTimer = null;
  function scheduleShootingStars() {
    if (shootTimer) clearTimeout(shootTimer);
    shootTimer = setTimeout(function () {
      spawnShootingStar();
      if (Math.random() < 0.12) setTimeout(spawnShootingStar, 400 + Math.random() * 500);
      scheduleShootingStars();
    }, 6000 + Math.random() * 10000);
  }

  function startStars() {
    createSkyStars(48);
    setTimeout(function () { spawnShootingStar(); scheduleShootingStars(); }, 1800 + Math.random() * 2200);
  }

  var meteorBurstTimer = null;
  var meteorBurstEnd = 0;
  function startMeteorShower(durationMs) {
    durationMs = durationMs || 30000;
    meteorBurstEnd = Date.now() + durationMs;
    if (meteorBurstTimer) clearInterval(meteorBurstTimer);
    // 流星群：短い間隔で連続発生
    function burstTick() {
      if (Date.now() >= meteorBurstEnd) {
        clearInterval(meteorBurstTimer);
        meteorBurstTimer = null;
        return;
      }
      spawnShootingStar();
      if (Math.random() < 0.55) setTimeout(spawnShootingStar, 80 + Math.random() * 180);
      if (Math.random() < 0.3) setTimeout(spawnShootingStar, 200 + Math.random() * 320);
    }
    burstTick();
    meteorBurstTimer = setInterval(burstTick, 280 + Math.random() * 120);
  }

      if (work.published === false && !isAdmin()) {

  var _eggTitleTaps = 0;
  var _eggTitleLast = 0;
  var _eggSubTaps = 0;
  var _eggSubLast = 0;
  var _eggPhase = "idle";
  var _eggPhaseTimer = null;
  var _eggCatchTaps = 0;
  var _eggCatchLast = 0;
  var _eggCatchPhase = "idle";
  var _eggCatchPhaseTimer = null;
  var _eggCmdMenuTaps = 0;
  var _eggCmdMenuLast = 0;
  var _eggCmdPhase = "idle"; /* idle | after-menu */
  var _eggCmdPhaseTimer = null;
  var TAP_GAP = 1200;
  var _rainTimer = null;
  var _rainLayer = null;

  function attachEasterEggs() {
    var titleEl = app.querySelector("header .site-title");
    var subEl = app.querySelector("header .site-subtitle");
    var catchEl = app.querySelector("header .site-catchcopy") || app.querySelector("#egg-catchcopy");

    function onTitleTap(e) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      var now = Date.now();
      if (now - _eggTitleLast > TAP_GAP) _eggTitleTaps = 0;
      _eggTitleLast = now;
      _eggTitleTaps += 1;

      /* メニュー5回のあと → タイトル5回で隠しコマンド一覧（最優先） */
      if (_eggCmdPhase === "after-menu") {
        if (_eggTitleTaps >= 5) {
          _eggTitleTaps = 0;
          _eggCmdPhase = "idle";
          if (_eggCmdPhaseTimer) { clearTimeout(_eggCmdPhaseTimer); _eggCmdPhaseTimer = null; }
          closeSidebar();
          openSecretGuideModal();
        }
        return;
      }

      if (isSecretUnlocked()) {
        if (_eggTitleTaps >= 3) {
          _eggTitleTaps = 0;
          lockSecretWork();
        }
        return;
      }

      if (_eggPhase === "after-meteor") {
        if (_eggTitleTaps >= 3) {
          _eggTitleTaps = 0;
          unlockSecretWork();
        }
        return;
      }

      if (_eggTitleTaps >= 5) {
        _eggTitleTaps = 0;
        startMeteorShower(30000);
        _eggPhase = "after-meteor";
        if (_eggPhaseTimer) clearTimeout(_eggPhaseTimer);
        _eggPhaseTimer = setTimeout(function () { _eggPhase = "idle"; }, 45000);
      }
    }

    function onSubTap(e) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      var now = Date.now();
      if (now - _eggSubLast > TAP_GAP) _eggSubTaps = 0;
      _eggSubLast = now;
      _eggSubTaps += 1;
      if (_eggSubTaps >= 3) {
        _eggSubTaps = 0;
        document.body.classList.toggle("is-inverted");
      }
    }

    function onCatchTap(e) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      var now = Date.now();
      // 解放フェーズ中は間隔を長く取る（大雨のあとゆっくりタップしても通る）
      var gapLimit = (_eggCatchPhase === "after-rain") ? 4000 : TAP_GAP;
      if (now - _eggCatchLast > gapLimit) _eggCatchTaps = 0;
      _eggCatchLast = now;
      _eggCatchTaps += 1;

      // タップフィードバック
      if (catchEl) {
        catchEl.classList.add("is-egg-pulse");
        setTimeout(function () { catchEl.classList.remove("is-egg-pulse"); }, 180);
      }

      if (isFactorUnlocked()) {
        if (_eggCatchTaps >= 5) {
          _eggCatchTaps = 0;
          startHeavyRain(30000);
        }
        return;
      }

      if (_eggCatchPhase === "after-rain") {
        if (_eggCatchTaps >= 3) {
          _eggCatchTaps = 0;
          unlockFactorTrader();
        }
        return;
      }

      if (_eggCatchTaps >= 5) {
        _eggCatchTaps = 0;
        startHeavyRain(30000);
        _eggCatchPhase = "after-rain";
        // 大雨中〜終了後も十分に受付（90秒）
        if (_eggCatchPhaseTimer) clearTimeout(_eggCatchPhaseTimer);
        _eggCatchPhaseTimer = setTimeout(function () {
          _eggCatchPhase = "idle";
          _eggCatchTaps = 0;
        }, 90000);
      }
    }

    function bindTap(el, handler) {
      if (!el) return;
      if (el.getAttribute("data-egg-bound") === "1") return;
      el.setAttribute("data-egg-bound", "1");
      var lastFire = 0;
      function fire(ev) {
        var t = Date.now();
        if (t - lastFire < 320) return;
        lastFire = t;
        handler(ev);
      }
      // pointerup 優先。click は pointer 非対応環境のフォールバック
      el.addEventListener("pointerup", fire);
      el.addEventListener("click", function (ev) {
        if (window.PointerEvent) return; // pointer がある環境では click を無視
        fire(ev);
      });
    }

    bindTap(titleEl, onTitleTap);
    bindTap(subEl, onSubTap);
    bindTap(catchEl, onCatchTap);
    updateFactorFab();
  }

  function openFactorTraderGame() {
    if (document.querySelector(".factor-game-overlay")) return;

    function decodeGameHtml() {
      var srcEl = document.getElementById("factor-trader-src");
      if (!srcEl) return "";
      try {
        var raw = String(srcEl.textContent || "").replace(/\s+/g, "");
        if (srcEl.getAttribute("data-encoding") === "base64" && raw) {
          var bin = atob(raw);
          if (typeof TextDecoder !== "undefined") {
            var bytes = new Uint8Array(bin.length);
            for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return new TextDecoder("utf-8").decode(bytes);
          }
          // TextDecoder 非対応環境
          return decodeURIComponent(escape(bin));
        }
        var html = String(srcEl.textContent || "");
        var closeTag = "<" + "/" + "script>";
        return html.split("<\\" + "/" + "script>").join(closeTag);
      } catch (err) {
        console.warn("factor-trader decode failed", err);
        return "";
      }
    }

    var html = decodeGameHtml();
    if (!html || html.length < 100) {
      alert("ゲームデータの読み込みに失敗しました。");
      return;
    }

    var overlay = document.createElement("div");
    overlay.className = "factor-game-overlay";
    overlay.innerHTML =
      '<div class="factor-game-bar">' +
      "<span>FACTOR/TRADER</span>" +
      '<button type="button" data-close-factor>サイトに戻る</button>' +
      "</div>" +
      '<div class="factor-game-frame-wrap"></div>';
    document.body.appendChild(overlay);
    document.body.style.overflow = "hidden";

    var wrap = overlay.querySelector(".factor-game-frame-wrap");
    var iframe = document.createElement("iframe");
    iframe.className = "factor-game-frame";
    iframe.title = "FACTOR/TRADER";
    iframe.setAttribute("allow", "fullscreen");
    // about:blank は親と同オリジン扱いになり、Chrome の blob ブロックを回避できる
    iframe.src = "about:blank";
    wrap.appendChild(iframe);

    function close() {
      document.body.style.overflow = "";
      if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
    }
    overlay.querySelector("[data-close-factor]").addEventListener("click", close);

    function writeIntoIframe() {
      try {
        var doc = iframe.contentDocument || (iframe.contentWindow && iframe.contentWindow.document);
        if (!doc) throw new Error("no contentDocument");
        doc.open();
        doc.write(html);
        doc.close();
        return true;
      } catch (err) {
        console.warn("iframe write failed", err);
        return false;
      }
    }

    function openInNewWindow() {
      try {
        var w = window.open("", "_blank");
        if (!w) {
          alert("ポップアップがブロックされました。ブラウザで許可するか、もう一度お試しください。");
          return false;
        }
        w.document.open();
        w.document.write(html);
        w.document.close();
        return true;
      } catch (err) {
        console.warn("window.open write failed", err);
        return false;
      }
    }

    var written = false;
    function tryMount() {
      if (written) return;
      written = writeIntoIframe();
      if (!written) {
        // iframe に書けない場合は srcdoc、それでもダメなら別タブ
        try {
          iframe.removeAttribute("src");
          iframe.srcdoc = html;
          written = true;
        } catch (err2) {
          close();
          if (!openInNewWindow()) {
            alert("ゲームを表示できませんでした。別のブラウザで試すか、ポップアップを許可してください。");
          }
        }
      }
    }

    // about:blank の load 後に write（即時でも試す）
    iframe.addEventListener("load", function () {
      if (!written) tryMount();
    });
    setTimeout(function () {
      if (!written) tryMount();
    }, 0);

    // 描画失敗の検知
    setTimeout(function () {
      try {
        var doc = iframe.contentDocument;
        if (!doc) return;
        var root = doc.getElementById("root");
        if (root && root.childNodes.length === 0) {
          var fb = doc.getElementById("ft-fallback");
          if (fb) {
            fb.style.display = "block";
            fb.innerHTML = "ゲームの読み込みに失敗しました。<br>インターネット接続を確認してください（React を CDN から取得します）。<br><br>それでも表示されない場合は、メニューから再度開くか、別タブで開いてください。";
          }
          if (!overlay.querySelector("[data-open-tab]")) {
            var bar = overlay.querySelector(".factor-game-bar");
            var tabBtn = document.createElement("button");
            tabBtn.type = "button";
            tabBtn.setAttribute("data-open-tab", "1");
            tabBtn.textContent = "別タブで開く";
            tabBtn.addEventListener("click", function () { openInNewWindow(); });
            bar.appendChild(tabBtn);
          }
        }
      } catch (e1) {}
    }, 4000);
  }

  /* ===== 作品ページ内の目次・あとがき挙動（イベント委譲） ===== */
  var scrolling = false;
  function scrollToEl(target) {
    if (scrolling) return;
    scrolling = true;
    var isTouch = window.matchMedia && window.matchMedia("(hover: none), (pointer: coarse)").matches;
    if (isTouch) {
      var top = target.getBoundingClientRect().top + (window.pageYOffset || 0) - 12;
      window.scrollTo(0, top);
      scrolling = false;
    } else if (typeof target.scrollIntoView === "function") {
      target.scrollIntoView({ behavior: "smooth", block: "start" });
      setTimeout(function () { scrolling = false; }, 900);
    } else { scrolling = false; }
  }

  function attachWorkInteractions() {
    app.querySelectorAll('a[href^="#"]').forEach(function (link) {
      var href = link.getAttribute("href");
      if (!href || href.length < 2 || href.charAt(1) === "/") return;
      link.addEventListener("click", function (ev) {
        ev.preventDefault();
        var toc = app.querySelector("#toc");
        if (href === "#toc" && toc) {
          var opening = !toc.classList.contains("is-open");
          toc.classList.toggle("is-open", opening);
          if (opening) setTimeout(function () { scrollToEl(toc); }, 30);
          return;
        }
        if (toc) toc.classList.remove("is-open");
        var target = app.querySelector(href.replace(/[^#\-\w]/g, ""));
        var id = href.slice(1);
        target = document.getElementById(id) || target;
        if (target) setTimeout(function () { scrollToEl(target); }, 30);
      });
    });

    app.querySelectorAll(".afterword-toggle").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var content = btn.parentElement.querySelector(".afterword-content");
        if (!content) return;
        var open = content.classList.toggle("is-open");
        content.hidden = !open;
        btn.setAttribute("aria-expanded", open ? "true" : "false");
      });
    });
  }

  /* ===== 本文コピー：改行・一字下げ・空行をプレーンテキストに反映 ===== */
  function normalizeNovelLine(s) {
    return String(s || "")
      .replace(/\u00a0/g, " ")
      .replace(/\r\n/g, "\n")
      .replace(/\r/g, "\n")
      .replace(/\n+/g, "")
      .replace(/[ \t\f\v]+/g, " ")
      .trim();
  }

  function paragraphNeedsIndent(el, text) {
    if (el && el.classList && el.classList.contains("no-indent")) return false;
    if (/^[「『（(\[【─―—]/.test(text || "")) return false;
    return true;
  }

  function novelBlocksToPlain(blocks) {
    var lines = [];
    blocks.forEach(function (b) {
      if (!b) return;
      if (b.kind === "hr") {
        // 区切り線 → 空行（前後の段落と合わせて空行1つになるよう空文字行を入れる）
        if (lines.length && lines[lines.length - 1] !== "") lines.push("");
        return;
      }
      if (!b.text) return;
      if (b.kind === "h2") {
        lines.push(b.text);
      } else {
        lines.push((b.indent ? "　" : "") + b.text);
      }
    });
    return lines.join("\n");
  }

  function getNovelPlainFromSelection() {
    var main = app.querySelector("#honbun");
    // 閲覧・編集モード共通（編集中も改行・一字下げ・区切り線→空行を反映）
    if (!main) return null;
    var sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount) return null;
    var range = sel.getRangeAt(0);
    var anc = range.commonAncestorContainer;
    if (anc.nodeType === 3) anc = anc.parentNode;
    if (!main.contains(anc) && anc !== main) return null;

    var candidates = main.querySelectorAll("h2.section-title, h2.aw-title, h2, p, hr.scene-break, hr");
    var hit = [];
    candidates.forEach(function (el) {
      try {
        if (!sel.containsNode(el, true)) return;
      } catch (err) {
        return;
      }
      if (el.tagName === "HR" || (el.classList && el.classList.contains("scene-break"))) {
        hit.push({ kind: "hr", el: el, fully: true });
        return;
      }
      var full = normalizeNovelLine(el.textContent);
      if (!full) return;
      if (el.tagName === "H2") {
        hit.push({ kind: "h2", el: el, text: full, fully: true });
        return;
      }
      var fully = false;
      try { fully = sel.containsNode(el, false); } catch (err) {}
      hit.push({
        kind: "p",
        el: el,
        text: full,
        fully: fully,
        indent: paragraphNeedsIndent(el, full)
      });
    });

    if (!hit.length) {
      var raw = sel.toString();
      if (!raw || !String(raw).trim()) return null;
      return String(raw).replace(/\r\n/g, "\n").replace(/\r/g, "\n");
    }

    // 1段落の部分選択：選択文字列を使い、段落先頭からの選択なら一字下げ
    if (hit.length === 1 && hit[0].kind === "p" && !hit[0].fully) {
      var partial = normalizeNovelLine(sel.toString());
      if (!partial) return null;
      var indent = false;
      try {
        var pre = document.createRange();
        pre.selectNodeContents(hit[0].el);
        pre.setEnd(range.startContainer, range.startOffset);
        if (!normalizeNovelLine(pre.toString())) indent = hit[0].indent;
      } catch (err) {}
      return (indent ? "　" : "") + partial;
    }

    var blocks = hit.map(function (h) {
      if (h.kind === "hr") return { kind: "hr" };
      if (h.kind === "h2") return { kind: "h2", text: h.text };
      return { kind: "p", text: h.text, indent: h.indent };
    });
    return novelBlocksToPlain(blocks);
  }

  document.addEventListener("copy", function (e) {
    try {
      var plain = getNovelPlainFromSelection();
      if (plain == null || plain === "") return;
      e.preventDefault();
      if (e.clipboardData) {
        e.clipboardData.setData("text/plain", plain);
        // 簡易 HTML（段落改行・一字下げ・区切り線由来の空行を保つ）
        var html = plain
          .split("\n")
          .map(function (line) {
            if (line === "") return "<p><br></p>";
            return "<p>" + line
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;") + "</p>";
          })
          .join("");
        e.clipboardData.setData("text/html", html);
      } else if (window.clipboardData) {
        window.clipboardData.setData("Text", plain);
      }
    } catch (err) {
      // 失敗時はブラウザ標準のコピーに任せる
    }
  });

  /** 作品ページから章一覧を取得（閲覧・編集共通） */
  function collectWorkChapters() {
    var items = [];
    var editTitles = app.querySelectorAll(".chapter-edit-title");
    if (editTitles.length) {
      editTitles.forEach(function (h, i) {
        var t = (h.textContent || "").replace(/\s+/g, " ").trim();
        items.push({
          idx: i,
          title: t || ("章 " + (i + 1)),
          el: h.closest(".chapter-edit-block") || h
        });
      });
      return items;
    }
    var sections = app.querySelectorAll("#honbun .section, main .section");
    if (sections.length) {
      sections.forEach(function (sec, i) {
        var h = sec.querySelector(".section-title");
        var t = h ? (h.textContent || "").replace(/\s+/g, " ").trim() : "";
        items.push({
          idx: i,
          title: t || ("第" + (i + 1) + "話"),
          id: sec.id || ("ch" + i),
          el: h || sec
        });
      });
      return items;
    }
    // 目次リンクから拾う
    var tocLinks = app.querySelectorAll("#toc a[href^='#']");
    tocLinks.forEach(function (a, i) {
      var href = a.getAttribute("href") || "";
      var id = href.charAt(0) === "#" ? href.slice(1) : "";
      var t = (a.textContent || "").replace(/\s+/g, " ").trim();
      items.push({
        idx: i,
        title: t || ("章 " + (i + 1)),
        id: id,
        el: id ? document.getElementById(id) : null
      });
    });
    return items;
  }

  function jumpToWorkChapter(item) {
    if (!item) return;
    // 編集モード：ツールバーの章ジャンプと同期
    var jumpEl = document.getElementById("chapter-jump");
    if (jumpEl && document.body.classList.contains("is-editing")) {
      jumpEl.value = String(item.idx);
      try {
        jumpEl.dispatchEvent(new Event("change", { bubbles: true }));
      } catch (err) {}
    }
    var target = item.el;
    if (!target && item.id) target = document.getElementById(item.id);
    if (!target) {
      var blocks = app.querySelectorAll(".chapter-edit-block, #honbun .section, main .section");
      target = blocks[item.idx] || null;
    }
    if (!target) return;
    try {
      var top = target.getBoundingClientRect().top + (window.pageYOffset || 0) - 12;
      window.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
    } catch (err) {
      try { target.scrollIntoView({ behavior: "smooth", block: "start" }); } catch (e2) {}
    }
    // 軽いハイライト
    try {
      target.classList.add("is-jump-target");
      setTimeout(function () { target.classList.remove("is-jump-target"); }, 1600);
    } catch (err) {}
  }

  function showSidebarChapterList() {
    if (!siteSidebarNav) return;
    var chapters = collectWorkChapters();
    var html = "";
    html += '<button type="button" data-action="toc-back">← メニューに戻る</button>';
    html += '<div class="sidebar-label">目次（章一覧）</div>';
    if (!chapters.length) {
      html += '<div class="sidebar-empty">章がありません</div>';
    } else {
      chapters.forEach(function (ch) {
        html += '<button type="button" class="is-work" data-action="jump-chapter" data-chapter-idx="' +
          ch.idx + '"' + (ch.id ? ' data-chapter-id="' + esc(ch.id) + '"' : "") + ">" +
          esc(ch.title) + "</button>";
      });
    }
    siteSidebarNav.innerHTML = html;
    // 章データをボタンに紐づけ（クロージャ）
    siteSidebarNav.querySelectorAll("[data-action='jump-chapter']").forEach(function (btn) {
      var idx = Number(btn.getAttribute("data-chapter-idx"));
      btn._chapterItem = chapters[idx] || null;
    });
    bindSidebarNavActions();
    scrollSidebarToTop();

  function bindSidebarNavActions() {
    if (!siteSidebarNav) return;
    siteSidebarNav.querySelectorAll("[data-action]").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        var act = btn.getAttribute("data-action");

        // 目次パネル内操作はサイドバーを閉じない
        if (act === "toc") {
          showSidebarChapterList();
          return;
        }
        if (act === "toc-back") {
          rebuildSidebarNav();
          return;
        }
        if (act === "jump-chapter") {
          var item = btn._chapterItem;
          if (!item) {
            item = {
              idx: Number(btn.getAttribute("data-chapter-idx")),
              id: btn.getAttribute("data-chapter-id") || "",
              title: (btn.textContent || "").trim()
            };
          }
          closeSidebar();
          setTimeout(function () { jumpToWorkChapter(item); }, 50);
          return;
        }
        if (act === "add-break") {
          closeSidebar();
          setTimeout(function () { insertSceneBreakAtCursor(); }, 40);
          return;
        }

        closeSidebar();
        if (act === "page-top") {
          window.scrollTo({ top: 0, behavior: "smooth" });
        } else if (act === "home") {
          location.hash = "#/";
        } else if (act === "work") {
          var wid = btn.getAttribute("data-work-id");
          if (wid) location.hash = "#/work/" + encodeURIComponent(wid);
        } else if (act === "save-work") {
          saveCurrentWorkEdits();
        } else if (act === "login") {
          openLoginModal();
        } else if (act === "toggle-manage") {
          setManageMode(!manageMode);
          if (cache) render();
        } else if (act === "secret-guide") {
          openSecretGuideModal();
        } else if (act === "logout") {
          if (window.confirm("ログアウトしますか？")) logout();
        } else if (act === "factor") {
          openFactorTraderGame();
        }
      });
    });
  }

  /* サイドバー「メニュー」文字を5回タップ → サイトタイトル5回で隠しコマンド一覧 */
  (function setupMenuLabelEgg() {
    var label = document.getElementById("sidebar-menu-label");
    if (!label || label.getAttribute("data-egg-bound") === "1") return;
    label.setAttribute("data-egg-bound", "1");
    var lastFire = 0;
    function onMenuLabelTap(ev) {
      var t = Date.now();
      if (t - lastFire < 280) return;
      lastFire = t;
      if (ev) { ev.preventDefault(); ev.stopPropagation(); }
      var now = Date.now();
      if (now - _eggCmdMenuLast > TAP_GAP) _eggCmdMenuTaps = 0;
      _eggCmdMenuLast = now;
      _eggCmdMenuTaps += 1;
      label.classList.add("is-egg-pulse");
      setTimeout(function () { label.classList.remove("is-egg-pulse"); }, 180);
      if (_eggCmdMenuTaps >= 5) {
        _eggCmdMenuTaps = 0;
        _eggCmdPhase = "after-menu";
        if (_eggCmdPhaseTimer) clearTimeout(_eggCmdPhaseTimer);
        _eggCmdPhaseTimer = setTimeout(function () {
          _eggCmdPhase = "idle";
        }, 60000);
        // サイドバーを閉じてタイトルへ誘導
        closeSidebar();
      }
    }
    label.addEventListener("pointerup", onMenuLabelTap);
    label.addEventListener("click", function (ev) {
      if (window.PointerEvent) return;
      onMenuLabelTap(ev);
    });
  })();
  if (siteSidebarOverlay) {
    siteSidebarOverlay.addEventListener("click", function (e) {
      if (e.target === siteSidebarOverlay) closeSidebar();
    });
    var closeBtn = siteSidebarOverlay.querySelector("[data-sidebar-close]");
    if (closeBtn) closeBtn.addEventListener("click", function (e) {
      e.preventDefault();
      closeSidebar();
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && siteSidebarOverlay.classList.contains("is-open")) {
        closeSidebar();
      }
    });
  }

  /* ===== 管理: 汎用フォームモーダル ===== */
  function openFormModal(title, fields, onSave) {
    var overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    var box = document.createElement("div");
    box.className = "modal-box";
    var hasLongText = fields.some(function (f) { return f.type === "textarea" && (f.rows || 0) >= 12; });
    box.style.maxWidth = hasLongText ? "720px" : "560px";
    box.style.maxHeight = "84vh";
    box.style.overflowY = "auto";
    var html = "<h3>" + esc(title) + "</h3>";
    fields.forEach(function (f) {
      html += '<label style="white-space:pre-line;line-height:1.6;">' + esc(f.label) + '</label>';
      if (f.type === "textarea") {
        html += '<textarea data-field="' + f.key + '" rows="' + (f.rows || 4) + '" style="width:100%;background:#050406;border:1px solid var(--line);color:var(--fg);padding:8px 10px;font-family:var(--font-body);font-size:13px;line-height:1.7;white-space:pre-wrap;">' + esc(f.value) + '</textarea>';
      } else if (f.type === "color") {
        html += '<input type="color" data-field="' + f.key + '" value="' + esc(f.value) + '" />';
      } else {
        html += '<input type="text" data-field="' + f.key + '" value="' + esc(f.value) + '" style="width:100%;background:#050406;border:1px solid var(--line);color:var(--fg);padding:8px 10px;font-family:var(--font-body);font-size:13px;" />';
      }
    });
    html += '<div class="modal-actions" style="margin-top:20px;"><button class="btn" data-close>キャンセル</button><button class="btn primary" data-save>保存</button></div>';
    box.innerHTML = html;
    overlay.appendChild(box);
    document.body.appendChild(overlay);

    overlay.querySelector("[data-close]").addEventListener("click", function () { overlay.remove(); });
    overlay.addEventListener("click", function (e) { if (e.target === overlay) overlay.remove(); });
    overlay.querySelector("[data-save]").addEventListener("click", async function () {
      var result = {};
      fields.forEach(function (f) {
        var el = box.querySelector('[data-field="' + f.key + '"]');
        result[f.key] = el.value;
      });
      overlay.querySelector("[data-save]").textContent = "保存中...";
      overlay.querySelector("[data-save]").disabled = true;
      try {
        await onSave(result);
        overlay.remove();
        await refresh();
      } catch (e) {
        alert("保存に失敗しました: " + (e && e.message ? e.message : e));
        overlay.remove();
      }
    });
  }

        var next = !currentlyPub;
