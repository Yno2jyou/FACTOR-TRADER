/* =====================================================================================
   FACTOR TRADER — 素因数分解投資ゲーム
   ---------------------------------------------------------------------------------
   コア数理エンジン:
     sopf(N) = Nを素因数分解し、その素因数(重複込み)をすべて足し合わせた値 = そのターンの株価
       例) 12 = 2*2*3        -> 2+2+3 = 7円
       例) 53 (素数)         -> 53円 (分解不可 = 高騰)
       例) 64 = 2^6          -> 2*6 = 12円 (底値)

     N_start(T) = ターンごとに独立して抽選される 10,000〜90,000 のランダム整数
                  (先読み防止のため、前ターンの数字と一切連動しない)

   1ターンのシーケンス:
     1. 市場開示  : N_start を公開し、仮株価 sopf(N_start) を表示
     2. 投資注文  : 各プレイヤー(人間+AI)が 買い/空売り/様子見 を秘密裏に決定
     3. 市場ハック: 生涯手札(速攻+1 x3, 重撃x2 x1)から出すか出さないかを裏向きで決定
     4. 清算      : 速攻カード(加算, 早) -> 重撃カード(乗算, 遅) の順で N_final を確定
                    sopf(N_final) が最終株価。注文時株価との比率で資産を清算する。
   ===================================================================================== */

// ---------- 数理エンジン ----------
function sopf(n) {
  // 与えられた正整数 n の素因数(重複あり)の総和を返す
  let num = n;
  let sum = 0;
  let d = 2;
  while (d * d <= num) {
    while (num % d === 0) {
      sum += d;
      num /= d;
    }
    d += 1;
  }
  if (num > 1) sum += num; // 残った num は素数
  return sum;
}

function isPrime(n) {
  if (n < 2) return false;
  for (let d = 2; d * d <= n; d++) if (n % d === 0) return false;
  return true;
}

function isPowerOfTwo(n) {
  return n > 0 && (n & (n - 1)) === 0;
}

// ---------- ゲーム設定 ----------
const TURN_TABLE = { 2: 18, 3: 24, 4: 30 };
const STARTING_CASH = 10000;
const STARTING_CARDS = { quick: 3, heavy: 1 };
const AI_NAMES = ["ORACLE-7", "NULLBYTE", "SIEVE-9", "GAUSS.exe"];

function randBase() {
  return 10000 + Math.floor(Math.random() * 80000);
}

function makePlayers(count, humanName) {
  const players = [];
  players.push({
    id: "human",
    name: humanName || "YOU",
    isAI: false,
    cash: STARTING_CASH,
    holdings: 0,     // 保有株数
    avgPrice: 0,     // 平均取得単価
    cards: { ...STARTING_CARDS },
    history: [STARTING_CASH], // 各ターン終了時点の総資産(時価評価額)
  });
  for (let i = 0; i < count - 1; i++) {
    players.push({
      id: `ai-${i}`,
      name: AI_NAMES[i % AI_NAMES.length],
      isAI: true,
      cash: STARTING_CASH,
      holdings: 0,
      avgPrice: 0,
      cards: { ...STARTING_CARDS },
      history: [STARTING_CASH],
    });
  }
  return players;
}

// プレイヤーの総資産(時価評価額) = 現金 + 保有株数 × 現在の株価
function totalValue(p, price) {
  return p.cash + p.holdings * price;
}

// AIの投資判断: 素数なら買い優勢、2の累乗なら売り優勢、それ以外はランダム寄り
// 現物取引なので、買いは現金の範囲内、売りは保有株数の範囲内で株数を決定する
function aiDecideTrade(rnd, nStart, priceBefore, cash, holdings) {
  let bias = 0;
  if (isPrime(nStart)) bias = 0.6;
  else if (isPowerOfTwo(nStart)) bias = -0.6;
  else bias = (Math.random() - 0.5) * 0.6;

  const r = Math.random() + bias;
  const maxBuyShares = priceBefore > 0 ? Math.floor(cash / priceBefore) : 0;

  if (r > 0.55 && maxBuyShares > 0) {
    const pct = 0.4 + Math.random() * 0.6;
    const shares = Math.max(1, Math.floor(maxBuyShares * pct));
    return { action: "buy", shares };
  }
  if (r < -0.15 && holdings > 0) {
    const pct = 0.4 + Math.random() * 0.6;
    const shares = Math.max(1, Math.floor(holdings * pct));
    return { action: "sell", shares };
  }
  return { action: "stay", shares: 0 };
}

// AIのカード使用判断: 手札を温存しがち。重撃は勝負所(終盤 or 大きく賭けた時)のみ低確率で
function aiDecideCards(cards, turn, totalTurns, order) {
  let quick = 0;
  let heavy = false;
  if (cards.quick > 0 && Math.random() < 0.18) quick = 1;
  const lateGame = turn > totalTurns * 0.6;
  if (cards.heavy > 0 && order.action !== "stay" && lateGame && Math.random() < 0.12) {
    heavy = true;
  }
  return { quick, heavy };
}

// ---------- UI 補助 ----------
function yen(n) {
  const sign = n < 0 ? "-" : "";
  return sign + "¥" + Math.abs(Math.round(n)).toLocaleString();
}

function factorString(n) {
  let num = n;
  const factors = [];
  let d = 2;
  while (d * d <= num) {
    while (num % d === 0) {
      factors.push(d);
      num /= d;
    }
    d += 1;
  }
  if (num > 1) factors.push(num);
  return factors.join(" × ");
}

// ---------- メインコンポーネント ----------
function FactorTrader() {
  const [screen, setScreen] = useState("setup"); // setup | play | over
  const [playerCount, setPlayerCount] = useState(3);
  const [players, setPlayers] = useState([]);
  const [currentN, setCurrentN] = useState(0);
  const [turn, setTurn] = useState(1);
  const [totalTurns, setTotalTurns] = useState(24);
  const [phase, setPhase] = useState("market"); // market | order | hack | reveal
  const [priceHistory, setPriceHistory] = useState([]); // { turn, price }
  const [log, setLog] = useState([]);
  const [orders, setOrders] = useState({}); // playerId -> {action:'buy'|'sell'|'stay', shares}
  const [hackChoices, setHackChoices] = useState({}); // playerId -> {quick, heavy}
  const [humanOrderDraft, setHumanOrderDraft] = useState({ action: "stay", shares: 0 });
  const [humanHackDraft, setHumanHackDraft] = useState({ quick: 0, heavy: false });
  const [revealData, setRevealData] = useState(null);
  const [basePrice, setBasePrice] = useState(0);
  const [showQuitConfirm, setShowQuitConfirm] = useState(false);
  const [showRulesModal, setShowRulesModal] = useState(false);
  const logEndRef = useRef(null);
  const topRef = useRef(null);

  const nStart = currentN;
  const priceBefore = currentN > 0 ? sopf(nStart) : 0;
  // 基準株価: 損益計算の基準になる価格。前ターンの確定株価(無ければゲーム開始時のbasePrice)。
  // ターン開始時から見えるようにして、変動の読み合いができるようにする。
  const refPrice = priceHistory.length > 0 ? priceHistory[priceHistory.length - 1].price : basePrice;

  useEffect(() => {
    logEndRef.current?.scrollIntoView({ behavior: "smooth" });
  }, [log]);

  // 画面(トップ/プレイ/結果)が切り替わったら必ずページ上部が見えるようにする
  useEffect(() => {
    topRef.current?.scrollIntoView({ block: "start" });
    window.scrollTo({ top: 0 });
  }, [screen]);

  function pushLog(text) {
    setLog((l) => [...l, text]);
  }

  function startGame() {
    const t = TURN_TABLE[playerCount];
    // ゲーム開始前の「仮想の直前株価」として、独立した乱数のsopfを基準値にする
    // (1ターン目からベース数字は完全ランダムなので、この基準がないとturn1だけ損益が出せない)
    setBasePrice(sopf(randBase()));
    setCurrentN(randBase());
    setTotalTurns(t);
    setTurn(1);
    setPlayers(makePlayers(playerCount, "YOU"));
    setPriceHistory([]);
    setLog([`🎲 市場が起動しました。人数: ${playerCount}人 / 総ターン数: ${t}`]);
    setPhase("market");
    setScreen("play");
    setOrders({});
    setHackChoices({});
    setHumanOrderDraft({ action: "stay", shares: 0 });
    setHumanHackDraft({ quick: 0, heavy: false });
  }

  function goToOrderPhase() {
    setPhase("order");
  }

  function confirmOrders() {
    const newOrders = {};
    players.forEach((p) => {
      if (!p.isAI) {
        newOrders[p.id] = { ...humanOrderDraft };
      } else {
        newOrders[p.id] = aiDecideTrade(Math.random(), nStart, priceBefore, p.cash, p.holdings);
      }
    });
    setOrders(newOrders);
    setPhase("hack");
  }

  function confirmHacks() {
    const newHacks = {};
    players.forEach((p) => {
      if (!p.isAI) {
        const q = Math.min(humanHackDraft.quick, p.cards.quick);
        const h = humanHackDraft.heavy && p.cards.heavy > 0;
        newHacks[p.id] = { quick: q, heavy: h };
      } else {
        newHacks[p.id] = aiDecideCards(p.cards, turn, totalTurns, orders[p.id]);
      }
    });
    setHackChoices(newHacks);
    resolveTurn(newHacks);
  }

  function resolveTurn(hacks) {
    // 集計
    let totalQuick = 0;
    let totalHeavy = 0;
    players.forEach((p) => {
      totalQuick += hacks[p.id]?.quick || 0;
      totalHeavy += hacks[p.id]?.heavy ? 1 : 0;
    });

    let nFinal = nStart + totalQuick;
    for (let i = 0; i < totalHeavy; i++) nFinal *= 2;

    const priceFinal = sopf(nFinal);
    // 注文時点では「仮株価(priceBefore)」を基準に株数を決めているが、
    // 実際の約定はハック確定後の「最終株価(priceFinal)」で行う。
    // これにより、注文後のハックによる株価変動という波乱要素がそのまま約定結果に反映される。

    const execResults = {}; // playerId -> { action, sharesReq, sharesFilled, cashDelta, note }

    // 資産精算(現物取引の約定) & 手札消費
    const updated = players.map((p) => {
      let cash = p.cash;
      let holdings = p.holdings;
      let avgPrice = p.avgPrice;
      const order = orders[p.id] || { action: "stay", shares: 0 };
      let filled = 0;
      let note = "";

      if (order.action === "buy" && order.shares > 0) {
        // 最終株価で購入。現金が不足する場合は、買える株数まで自動的に減らして約定(部分約定)する。
        const affordable = priceFinal > 0 ? Math.floor(cash / priceFinal) : 0;
        filled = Math.min(order.shares, affordable);
        if (filled < order.shares) note = "資金不足のため一部約定";
        if (filled > 0) {
          const cost = filled * priceFinal;
          const newHoldings = holdings + filled;
          avgPrice = (holdings * avgPrice + cost) / newHoldings;
          holdings = newHoldings;
          cash -= cost;
        }
      } else if (order.action === "sell" && order.shares > 0) {
        // 保有株数を超えて売ることはできないので、上限まで自動的に減らして約定する。
        filled = Math.min(order.shares, holdings);
        if (filled < order.shares) note = "保有株不足のため一部約定";
        if (filled > 0) {
          const proceeds = filled * priceFinal;
          holdings -= filled;
          cash += proceeds;
          if (holdings === 0) avgPrice = 0;
        }
      }

      execResults[p.id] = { action: order.action, sharesReq: order.shares, sharesFilled: filled, note };

      const usedQuick = hacks[p.id]?.quick || 0;
      const usedHeavy = hacks[p.id]?.heavy ? 1 : 0;
      const cards = {
        quick: p.cards.quick - usedQuick,
        heavy: p.cards.heavy - usedHeavy,
      };
      const tv = totalValue({ cash, holdings }, priceFinal);
      return { ...p, cash, holdings, avgPrice, cards, history: [...p.history, tv] };
    });

    // ログ生成
    const cardLines = players
      .map((p) => {
        const h = hacks[p.id];
        const parts = [];
        if (h.quick > 0) parts.push(`⚡×${h.quick}`);
        if (h.heavy) parts.push("💥");
        if (parts.length === 0) return null;
        return `${p.name}が${parts.join(" ")}を投入`;
      })
      .filter(Boolean);

    const orderLines = players.map((p) => {
      const ex = execResults[p.id];
      if (ex.action === "buy" && ex.sharesFilled > 0) {
        return `${p.name}: 買い ${ex.sharesFilled}株 @ ${priceFinal}円${ex.note ? `(${ex.note})` : ""}`;
      }
      if (ex.action === "sell" && ex.sharesFilled > 0) {
        return `${p.name}: 売り ${ex.sharesFilled}株 @ ${priceFinal}円${ex.note ? `(${ex.note})` : ""}`;
      }
      return `${p.name}: 様子見`;
    });

    pushLog(
      `── ターン${turn} ── N=${nStart}${totalQuick ? `+${totalQuick}` : ""}${
        totalHeavy ? ` ×2^${totalHeavy}` : ""
      } = ${nFinal} → 株価 ${priceFinal}円 (${factorString(nFinal)})`
    );
    cardLines.forEach((l) => pushLog("  " + l));
    orderLines.forEach((l) => pushLog("  " + l));

    // 自分(human)の損益詳細
    const humanBefore = players.find((p) => p.id === "human");
    const humanAfter = updated.find((u) => u.id === "human");
    const humanOrder = orders["human"] || { action: "stay", shares: 0 };
    const humanExec = execResults["human"];
    const humanValueBefore = totalValue(humanBefore, priceBefore);
    const humanValueAfter = totalValue(humanAfter, priceFinal);
    const humanDiff = humanValueAfter - humanValueBefore;

    setPlayers(updated);
    setPriceHistory((h) => [...h, { turn, price: priceFinal, nFinal }]);
    setRevealData({
      nStart,
      nFinal,
      priceBefore,
      priceFinal,
      totalQuick,
      totalHeavy,
      refPrice,
      humanOrder,
      humanExec,
      humanCashBefore: humanBefore.cash,
      humanCashAfter: humanAfter.cash,
      humanHoldingsBefore: humanBefore.holdings,
      humanHoldingsAfter: humanAfter.holdings,
      humanAvgPriceAfter: humanAfter.avgPrice,
      humanValueBefore,
      humanValueAfter,
      humanDiff,
    });
    setPhase("reveal");
  }

  function nextTurn() {
    if (turn >= totalTurns) {
      setScreen("over");
      return;
    }
    setTurn((t) => t + 1);
    setCurrentN(randBase());
    setPhase("market");
    setHumanOrderDraft({ action: "stay", shares: 0 });
    setHumanHackDraft({ quick: 0, heavy: false });
    setOrders({});
    setHackChoices({});
    setRevealData(null);
  }

  function quitToTop() {
    setShowQuitConfirm(true);
  }

  function confirmQuit() {
    setShowQuitConfirm(false);
    setScreen("setup");
  }

  function cancelQuit() {
    setShowQuitConfirm(false);
  }

  const human = players.find((p) => !p.isAI);
  // 現在の(未確定)株価を使って評価額を出す。ゲーム中は仮株価、ゲーム終了後は最終確定株価。
  const currentPriceForValue =
    screen === "over"
      ? (priceHistory.length > 0 ? priceHistory[priceHistory.length - 1].price : basePrice)
      : priceBefore;
  const ranked = useMemo(
    () => [...players].sort((a, b) => totalValue(b, currentPriceForValue) - totalValue(a, currentPriceForValue)),
    [players, currentPriceForValue]
  );

  return (
    <div className="ft-root" ref={topRef}>
      <style>{CSS}</style>
      {screen === "setup" && (
        <SetupScreen
          playerCount={playerCount}
          setPlayerCount={setPlayerCount}
          onStart={startGame}
        />
      )}

      {screen === "play" && human && (
        <div className="ft-shell">
          <TopBar
            turn={turn}
            totalTurns={totalTurns}
            human={human}
            currentPrice={priceBefore}
            onQuit={quitToTop}
            onShowRules={() => setShowRulesModal(true)}
          />
          <div className="ft-main">
            <div className="ft-left">
              <ChartPanel priceHistory={priceHistory} nStart={nStart} priceBefore={priceBefore} refPrice={refPrice} phase={phase} />
              <PlayersPanel players={players} orders={orders} phase={phase} currentPrice={priceBefore} />
            </div>
            <div className="ft-right">
              <ActionPanel
                phase={phase}
                human={human}
                priceBefore={priceBefore}
                refPrice={refPrice}
                nStart={nStart}
                humanOrderDraft={humanOrderDraft}
                setHumanOrderDraft={setHumanOrderDraft}
                humanHackDraft={humanHackDraft}
                setHumanHackDraft={setHumanHackDraft}
                onGoOrder={goToOrderPhase}
                onConfirmOrders={confirmOrders}
                onConfirmHacks={confirmHacks}
                onNextTurn={nextTurn}
                revealData={revealData}
                orders={orders}
                hackChoices={hackChoices}
                players={players}
              />
              <LogPanel log={log} logEndRef={logEndRef} />
            </div>
          </div>
        </div>
      )}

      {screen === "over" && (
        <GameOverScreen ranked={ranked} currentPrice={currentPriceForValue} onRestart={() => setScreen("setup")} />
      )}

      {showQuitConfirm && (
        <div className="ft-modal-overlay" onClick={cancelQuit}>
          <div className="ft-modal-box" onClick={(e) => e.stopPropagation()}>
            <div className="ft-modal-title">ゲームを中断しますか？</div>
            <p className="ft-modal-desc">
              トップページに戻ります。現在の進行状況は失われます。
            </p>
            <div className="ft-modal-btns">
              <button className="ft-modal-cancel" onClick={cancelQuit}>
                キャンセル
              </button>
              <button className="ft-modal-confirm" onClick={confirmQuit}>
                トップへ戻る
              </button>
            </div>
          </div>
        </div>
      )}

      {showRulesModal && (
        <div className="ft-modal-overlay" onClick={() => setShowRulesModal(false)}>
          <div className="ft-modal-box ft-modal-box-wide" onClick={(e) => e.stopPropagation()}>
            <div className="ft-modal-title">ルール & ゲームの流れ</div>
            <div className="ft-modal-scroll">
              <RulesContent />
            </div>

}

function ChartPanel({ priceHistory, nStart, priceBefore, refPrice, phase }) {
  const max = Math.max(20, ...priceHistory.map((h) => h.price), priceBefore || 0, refPrice || 0);
  const points = priceHistory.slice(-8);
  const w = 560;
  const h = 160;
  const stepX = points.length > 1 ? w / (points.length - 1) : w;

  const path = points
    .map((p, i) => {
      const x = points.length > 1 ? i * stepX : w / 2;
      const y = h - (p.price / max) * (h - 20) - 10;
      return `${i === 0 ? "M" : "L"}${x},${y}`;
    })
    .join(" ");

  const diff = priceBefore - refPrice;
  const diffPct = refPrice > 0 ? ((priceBefore / refPrice - 1) * 100) : 0;

  return (
    <div className="ft-panel">
      <div className="ft-panel-head">
        <Activity size={15} /> MARKET FEED
      </div>
      <div className="ft-refprice-box">
        <div className="ft-refprice-label">📌 前回終値（値動きの目安。実際の売買は最終株価で約定します）</div>
        <div className="ft-refprice-row">
          <span className="ft-refprice-value">{refPrice}円</span>
          <span className="ft-refprice-arrow">→</span>
          <span className="ft-refprice-value current">{priceBefore}円</span>
          <span className={"ft-refprice-diff" + (diff > 0 ? " up" : diff < 0 ? " down" : "")}>
            {diff === 0 ? "±0" : diff > 0 ? `+${diff}円` : `${diff}円`}
            {refPrice > 0 && ` (${diffPct >= 0 ? "+" : ""}${diffPct.toFixed(1)}%)`}
          </span>
        </div>
      </div>
      <div className="ft-market-open">
        <div>
          <div className="ft-mo-label">ベース数 N</div>
          <div className="ft-mo-value">{nStart.toLocaleString()}</div>
        </div>
        <div className="ft-mo-arrow">=</div>
        <div>
          <div className="ft-mo-label">仮株価 (ハック前)</div>
          <div className="ft-mo-value price">{priceBefore}円</div>
        </div>
      </div>
      <svg viewBox={`0 0 ${w} ${h}`} className="ft-chart-svg">
        <line x1="0" y1={h - 10} x2={w} y2={h - 10} stroke="var(--ft-grid)" strokeWidth="1" />
        {points.length > 0 && (
          <path d={path} fill="none" stroke="var(--ft-accent)" strokeWidth="2.5" />
        )}
        {points.map((p, i) => {
          const x = points.length > 1 ? i * stepX : w / 2;
          const y = h - (p.price / max) * (h - 20) - 10;
          return <circle key={i} cx={x} cy={y} r="3.5" fill="var(--ft-accent)" />;
        })}
      </svg>
      {priceHistory.length === 0 && (
        <div className="ft-chart-empty">まだ取引履歴がありません — 最初のターンを開始してください</div>
      )}
    </div>
  );
}

function ActionPanel(props) {
  const {
    phase,
    human,
    priceBefore,
    refPrice,
    nStart,
    humanOrderDraft,
    setHumanOrderDraft,
    humanHackDraft,
    setHumanHackDraft,
    onGoOrder,
    onConfirmOrders,
    onConfirmHacks,
    onNextTurn,
    revealData,
    orders,
    hackChoices,
    players,
  } = props;

  if (phase === "market") {
    return (
      <div className="ft-panel ft-action">
        <div className="ft-panel-head">STEP 1 — 市場開示</div>
        <p className="ft-action-desc">
          今タームのベース数字 <b>{nStart.toLocaleString()}</b> が公開されました。
          仮株価は <b className="ft-highlight">{priceBefore}円</b>（{factorString(nStart)}）。
          基準株価 <b className="ft-highlight">{refPrice}円</b> と比べて
          {priceBefore > refPrice ? "上振れ" : priceBefore < refPrice ? "下振れ" : "同水準"}
          しています。高騰（素数）を狙うか、暴落（2の累乗）に備えるか——判断のときです。
        </p>
        <button className="ft-primary-btn" onClick={onGoOrder}>
          注文フェーズへ ▶
        </button>
      </div>
    );
  }

  if (phase === "order") {
    const maxBuyShares = priceBefore > 0 ? Math.floor(human.cash / priceBefore) : 0;
    const maxSellShares = human.holdings;
    const action = humanOrderDraft.action;
    const shares = humanOrderDraft.shares || 0;
    const estCost = shares * priceBefore;
    const unrealizedPnl = human.holdings > 0 ? (priceBefore - human.avgPrice) * human.holdings : 0;

    function setAction(a) {
      const cap = a === "buy" ? maxBuyShares : a === "sell" ? maxSellShares : 0;
      setHumanOrderDraft({ action: a, shares: a === "stay" ? 0 : Math.min(Math.max(shares, cap > 0 ? 1 : 0), cap) });
    }
    function setShares(n) {
      const cap = action === "buy" ? maxBuyShares : maxSellShares;
      const v = Math.max(0, Math.min(cap, Math.floor(n) || 0));
      setHumanOrderDraft({ ...humanOrderDraft, shares: v });
    }

    return (
      <div className="ft-panel ft-action">
        <div className="ft-panel-head">STEP 2 — 投資注文（秘密）</div>
        <p className="ft-action-desc">
          現仮株価 <b className="ft-highlight">{priceBefore}円</b> を目安に、何株「買う」か「売る」かを決めます。
          実際の約定は、この後の市場ハックで確定する<b>最終株価</b>で行われます。
        </p>
        <div className="ft-holdings-box">
          <div>現金: <b>{yen(human.cash)}</b></div>
          <div>保有株: <b>{human.holdings}株</b>{human.holdings > 0 && <> (平均取得単価 {human.avgPrice.toFixed(1)}円)</>}</div>
          {human.holdings > 0 && (
            <div>
              評価損益(仮株価基準): {" "}
              <b className={unrealizedPnl > 0 ? "pnl-up" : unrealizedPnl < 0 ? "pnl-down" : ""}>
                {unrealizedPnl === 0 ? "±0" : unrealizedPnl > 0 ? `+${yen(unrealizedPnl)}` : `-${yen(Math.abs(unrealizedPnl))}`}
              </b>
            </div>
          )}
        </div>
        <div className="ft-order-btns">
          <button
            className={"ft-order-btn long" + (action === "buy" ? " active" : "")}
            onClick={() => setAction("buy")}
            disabled={maxBuyShares <= 0}
          >
            <TrendingUp size={16} /> 買い
          </button>
          <button
            className={"ft-order-btn short" + (action === "sell" ? " active" : "")}
            onClick={() => setAction("sell")}
            disabled={maxSellShares <= 0}
          >
            <TrendingDown size={16} /> 売り
          </button>
          <button
            className={"ft-order-btn stay" + (action === "stay" ? " active" : "")}
            onClick={() => setAction("stay")}
          >
            <Minus size={16} /> 様子見
          </button>
        </div>
        {action !== "stay" && (
          <div className="ft-pct-block">
            <div className="ft-label">
              {action === "buy" ? "購入株数" : "売却株数"}: {shares}株
              <span className="ft-factor-note"> (最大 {action === "buy" ? maxBuyShares : maxSellShares}株)</span>
            </div>
            <input
              type="range"
              min="0"
              max={action === "buy" ? maxBuyShares : maxSellShares}
              step="1"
              value={shares}
              onChange={(e) => setShares(parseInt(e.target.value, 10))}
            />
            <input
              type="number"
              className="ft-shares-input"
              min="0"
              max={action === "buy" ? maxBuyShares : maxSellShares}
              value={shares}
              onChange={(e) => setShares(parseInt(e.target.value, 10))}
            />
            {action === "buy" && <div className="ft-pct-amount">概算コスト: {yen(estCost)}</div>}
            {action === "sell" && <div className="ft-pct-amount">概算受取: {yen(estCost)}</div>}
          </div>
        )}
        <button className="ft-primary-btn" onClick={onConfirmOrders}>
          注文を確定 ▶
        </button>
      </div>
    );
  }

  if (phase === "hack") {
    return (
      <div className="ft-panel ft-action">
        <div className="ft-panel-head">STEP 3 — 市場ハック（裏向き）</div>
        <p className="ft-action-desc">生涯手札を投入しますか？ 使えばもう戻りません。</p>
        <div className="ft-hack-controls">
          <div className="ft-hack-row">
            <div className="ft-hack-label">
              <Zap size={16} className="icon-quick" /> 速攻 (+1) — 残り{human.cards.quick}枚
            </div>
            <div className="ft-hack-stepper">
              <button
                disabled={humanHackDraft.quick <= 0}
                onClick={() => setHumanHackDraft((d) => ({ ...d, quick: Math.max(0, d.quick - 1) }))}
              >
                −
              </button>
              <span>{humanHackDraft.quick}</span>
              <button
                disabled={humanHackDraft.quick >= human.cards.quick}
                onClick={() =>
                  setHumanHackDraft((d) => ({ ...d, quick: Math.min(human.cards.quick, d.quick + 1) }))
                }
              >
                +
              </button>
            </div>
          </div>
          <div className="ft-hack-row">
            <div className="ft-hack-label">
              <Bomb size={16} className="icon-heavy" /> 重撃 (×2) — 残り{human.cards.heavy}枚
            </div>
            <button
              className={"ft-heavy-toggle" + (humanHackDraft.heavy ? " active" : "")}
              disabled={human.cards.heavy <= 0}
              onClick={() => setHumanHackDraft((d) => ({ ...d, heavy: !d.heavy }))}
            >
              {humanHackDraft.heavy ? "投入する 💥" : "投入しない"}
            </button>
          </div>
        </div>
        {(humanHackDraft.quick > 0 || humanHackDraft.heavy) && (() => {
          let previewN = nStart + humanHackDraft.quick;
          if (humanHackDraft.heavy) previewN *= 2;
          const previewPrice = sopf(previewN);
          return (
            <div className="ft-private-box">
              <div className="ft-private-head">🔒 あなただけの先取り情報</div>
              <p className="ft-private-desc">
                他プレイヤーと重複しなかった場合、あなたのカードだけで株価は
                <b> {previewPrice}円</b>（{factorString(previewN)}）になります。
                実際は他プレイヤーのハックと重なると結果が変わる可能性があります。
              </p>
            </div>
          );
        })()}
        <button className="ft-primary-btn danger" onClick={onConfirmHacks}>
          カードをセットして開示 ▶
        </button>
      </div>
    );
  }

  if (phase === "reveal" && revealData) {
    return (
      <div className="ft-panel ft-action">
        <div className="ft-panel-head">STEP 4 — 清算結果</div>
        <div className="ft-reveal-box">
          <div className="ft-reveal-row">
            <span>N_start</span>
            <b>{revealData.nStart.toLocaleString()}</b>
          </div>
          {revealData.totalQuick > 0 && (
            <div className="ft-reveal-row quick">
              <span>⚡ 速攻合計</span>
              <b>+{revealData.totalQuick}</b>
            </div>
          )}
          {revealData.totalHeavy > 0 && (
            <div className="ft-reveal-row heavy">
              <span>💥 重撃合計</span>
              <b>×2^{revealData.totalHeavy}</b>
            </div>
          )}
          <div className="ft-reveal-row final">
            <span>N_final</span>
            <b>{revealData.nFinal.toLocaleString()}</b>
          </div>
          <div className="ft-reveal-row price">
            <span>最終株価</span>
            <b>{revealData.priceFinal}円</b>
            <span className="ft-factor-note">{factorString(revealData.nFinal)}</span>
          </div>
        </div>

        <div className="ft-panel-head" style={{ marginTop: 4 }}>あなたの約定結果</div>
        <div className="ft-reveal-box">
          <div className="ft-reveal-row">
            <span>注文</span>
            <b>
              {revealData.humanOrder.action === "buy"
                ? "買い"
                : revealData.humanOrder.action === "sell"
                ? "売り"
                : "様子見"}
              {revealData.humanOrder.action !== "stay" && ` ${revealData.humanOrder.shares}株`}
            </b>
          </div>
          {revealData.humanOrder.action !== "stay" && (
            <div className="ft-reveal-row">
              <span>約定株数 @ 最終株価</span>
              <b>
                {revealData.humanExec.sharesFilled}株 @ {revealData.priceFinal}円
                {revealData.humanExec.note && <span className="ft-factor-note"> {revealData.humanExec.note}</span>}
              </b>
            </div>
          )}
          <div className="ft-reveal-row">
            <span>現金</span>
            <b>{yen(revealData.humanCashBefore)} → {yen(revealData.humanCashAfter)}</b>
          </div>
          <div className="ft-reveal-row">
            <span>保有株</span>
            <b>
              {revealData.humanHoldingsBefore}株 → {revealData.humanHoldingsAfter}株
              {revealData.humanHoldingsAfter > 0 && ` (平均${revealData.humanAvgPriceAfter.toFixed(1)}円)`}
            </b>
          </div>
          <div className="ft-reveal-row">
            <span>総資産</span>
            <b>{yen(revealData.humanValueBefore)} → {yen(revealData.humanValueAfter)}</b>
          </div>
          <div className="ft-reveal-row final">
            <span>総資産の変動</span>
            <b className={revealData.humanDiff > 0 ? "pnl-up" : revealData.humanDiff < 0 ? "pnl-down" : ""}>
              {revealData.humanDiff === 0
                ? "±0"
                : revealData.humanDiff > 0
                ? `+${yen(revealData.humanDiff)}`
                : `-${yen(Math.abs(revealData.humanDiff))}`}
            </b>
          </div>
        </div>

        <button className="ft-primary-btn" onClick={onNextTurn}>
          次のターンへ ▶
        </button>
      </div>
    );
  }

  return null;
}

function GameOverScreen({ ranked, currentPrice, onRestart }) {
  return (
    <div className="ft-setup">
      <div className="ft-setup-card">
        <div className="ft-eyebrow">MARKET CLOSED</div>
        <h1 className="ft-title">FINAL SETTLEMENT</h1>
        <div className="ft-ranking">
          {ranked.map((p, i) => (
            <div key={p.id} className={"ft-rank-row" + (i === 0 ? " first" : "")}>
              <span className="ft-rank-pos">#{i + 1}</span>
              <span className="ft-rank-name">
                {p.isAI ? <Cpu size={13} /> : <User size={13} />} {p.name}
              </span>
              <span className="ft-rank-cash">{yen(totalValue(p, currentPrice))}</span>
            </div>
          ))}
        </div>
        <button className="ft-start-btn" onClick={onRestart}>
          もう一度市場に挑む ▶
        </button>
      </div>
    </div>
  );
}
