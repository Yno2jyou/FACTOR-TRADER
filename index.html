   ---------------------------------------------------------------------------------
   コア数理エンジン:
     sopf(N) = Nを素因数分解し、その素因数(重複込み)をすべて足し合わせた値 = そのTERNの株価
       例) 12 = 2*2*3        -> 2+2+3 = 7円
       例) 53 (素数)         -> 53円 (分解不可 = 高騰)
       例) 64 = 2^6          -> 2*6 = 12円 (底値)

     N_start(T) = TERNごとに独立して抽選される 10,000〜90,000 のランダム整数
                  (先読み防止のため、前TERNの数字と一切連動しない)

   1TERNのシーケンス:
     1. 市場開示  : N_start を公開し、仮株価 sopf(N_start) を表示
     2. 投資注文  : 各プレイヤー(人間+AI)が 買い/売り/様子見 を秘密裏に決定
     3. 市場ハック: 生涯COINから操作/妨害を裏向きで決定
     4. 清算（個人株価）:
          - 操作: 自分の N にだけ +1 → 自分の株価だけ操作
          - 妨害: 自分以外の N にだけ +1（重複可） → 相手の株価だけ妨害方向に作用
          - 各プレイヤーの株価は個別計算（共通の最終株価は持たない）
   ===================================================================================== */

// ---------- 数理エンジン ----------
function sopf(n) {
  // 与えられた正整数 n の素因数(重複あり)の総和を返す
  let num = Math.floor(Number(n) || 0);
  if (num < 2) return 0;
  let sum = 0;
  let d = 2;
  while (d * d <= num) {
    while (num % d === 0) {
      sum += d;
      num = Math.floor(num / d);
    }
    d += 1;
  }
  if (num > 1) sum += num;
  return sum;
}

function isPrime(n) {
  if (n < 2) return false;
  for (let d = 2; d * d <= n; d++) if (n % d === 0) return false;
  return true;
}

function isPowerOfTwo(n) {
  return n > 0 && (n & (n - 1)) === 0;
}

// 人数別: TERN数 / COIN枚数（操作・妨害共用）
const TURN_TABLE = { 2: 22, 3: 22, 5: 32, 9: 32 };

const CARDS_TABLE = { 2: 30, 3: 30, 5: 40, 9: 40 };
/** SERIOUSはNORMALよりCOIN+10 */
const SERIOUS_COIN_BONUS = 10;

/** ラスト5TERNか */
function isLastFiveTurns(turn, totalTurns) {
  const t = Number(turn) || 0;
  const tt = Number(totalTurns) || 0;
  if (tt <= 0 || t <= 0) return false;
  const remaining = tt - t + 1;
  return remaining <= 5;
}

/** 終盤の最低売買株数（保有100なら50以上など） */
function minOrderShares(action, holdings, maxBuyShares) {
  if (action === "sell") {
    if (holdings <= 0) return 0;
    // 保有の50%以上を自由に選択
    return Math.max(1, Math.ceil(holdings * 0.5));
  }
  if (action === "buy") {
    if (maxBuyShares <= 0) return 0;
    // 買付余力の50%以上を自由に選択（上限は余力いっぱい）
    return Math.max(1, Math.ceil(maxBuyShares * 0.5));
  }
  return 0;
}

/** 注文をルールに合わせて補正（終盤の様子見禁止・最低50%） */
function clampOrder(order, cash, holdings, priceBefore, turn, totalTurns) {
  const maxBuy = priceBefore > 0 ? Math.floor(cash / priceBefore) : 0;
  const end = isLastFiveTurns(turn, totalTurns);
  let action = (order && order.action) || "stay";
  let shares = Math.max(0, Math.floor((order && order.shares) || 0));

  if (end) {
    if (action === "stay") {
      if (holdings > 0) action = "sell";
      else if (maxBuy > 0) action = "buy";
    }
    if (action === "buy" || action === "sell") {
      const maxS = action === "buy" ? maxBuy : holdings;
      if (maxS <= 0) {
        action = "stay";
        shares = 0;
      } else {
        const minS = minOrderShares(action, holdings, maxBuy);
        if (!shares || shares < minS) shares = minS;
        if (shares > maxS) shares = maxS;
        // 最低が上限を超えることは minOrderShares で抑制済み
        if (shares < 1) {
          action = "stay";
          shares = 0;
        }
      }
    }
  }

  if (action === "buy") {
    shares = Math.min(shares, maxBuy);
    if (shares <= 0) { action = "stay"; shares = 0; }
  } else if (action === "sell") {
    shares = Math.min(shares, holdings);
    if (shares <= 0) { action = "stay"; shares = 0; }
  } else {
    shares = 0;
  }
  return { action: action, shares: shares };
}

const STARTING_CASH = 10000;
const AI_NAMES = ["Albert Einstein", "Sir Isaac Newton", "Marie Curie", "Leonardo da Vinci", "Nikola Tesla", "Charles Darwin", "Galileo Galilei", "Ada Lovelace"];

function randBase() {
  return 10000 + Math.floor(Math.random() * 80000);
}
function ensureBaseN(n) {
  const v = Math.floor(Number(n) || 0);
  if (v >= 10000 && v <= 99999) return v;
  return randBase();
}

function makePlayers(count, humanCount, humanNames, seriousMode) {
  const baseStock = CARDS_TABLE[count] || CARDS_TABLE[3];
  const startStock = baseStock + (seriousMode ? SERIOUS_COIN_BONUS : 0);
  const players = [];
  const hCount = Math.max(1, Math.min(count, Number(humanCount) || 1));
  const names = humanNames || [];
  for (let i = 0; i < hCount; i++) {
    const defaultName = hCount === 1 ? "YOU" : ("P" + (i + 1));
    players.push({
      id: "human-" + i,
      name: (names[i] && String(names[i]).trim()) || defaultName,
      isAI: false,
      cash: STARTING_CASH,
      holdings: 0,
      avgPrice: 0,
      cards: { stock: startStock },
      history: [STARTING_CASH],
      avantUsed: false,
    });
  }
  for (let i = 0; i < count - hCount; i++) {
    players.push({
      id: "ai-" + i,
      name: AI_NAMES[i % AI_NAMES.length],
      isAI: true,
      cash: STARTING_CASH,
      holdings: 0,
      avgPrice: 0,
      cards: { stock: startStock },
      history: [STARTING_CASH],
      avantUsed: false,
    });
  }
  return players;
}

/** 人間プレイヤー一覧（破産含む） */
function humanPlayersOf(players) {
  return (players || []).filter((p) => p && !p.isAI);
}

/** 操作対象の人間（破産していない先頭など） */
function primaryHuman(players) {
  const hs = humanPlayersOf(players);
  const alive = hs.find((p) => !p.isBankrupt);
  return alive || hs[0] || null;
}

/* ========== オンライン対戦（PeerJS / ホスト権威） ========== */
const PEER_PREFIX = "ftroom-";
function genRoomCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = "";
  for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}
function roomPeerId(code) {
  return PEER_PREFIX + String(code || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
}

function serializePlayers(players) {
  return (players || []).map((p) => ({
    id: p.id,
    name: p.name,
    isAI: !!p.isAI,
    cash: p.cash,
    holdings: p.holdings,
    avgPrice: p.avgPrice,
    cards: { stock: (p.cards && p.cards.stock) || 0 },
    history: Array.isArray(p.history) ? p.history.slice() : [],
    avantUsed: !!p.avantUsed,
    isBankrupt: !!p.isBankrupt,
    isRemote: !!p.isRemote,
    peerConnId: p.peerConnId || null,
  }));
}

function buildSnapshot(state) {
  return {
    v: 1,
    screen: state.screen,
    players: serializePlayers(state.players),
    turn: state.turn,
    totalTurns: state.totalTurns,
    phase: state.phase,
    currentN: state.currentN,
    basePrice: state.basePrice,
    priceHistory: (state.priceHistory || []).slice(),
    log: (state.log || []).slice(-80),
    orders: state.orders || {},
    hackChoices: state.hackChoices || {},
    revealData: state.revealData,
    revealFocusId: state.revealFocusId,
    endgameBonusMsg: state.endgameBonusMsg || "",
    playerCount: state.playerCount,
    seriousMode: !!state.seriousMode,
    pendingOrders: state.pendingOrders || {},
    pendingHacks: state.pendingHacks || {},
    submittedOrderIds: state.submittedOrderIds || [],
    submittedHackIds: state.submittedHackIds || [],
  };
}


// プレイヤーの総資産(時価評価額) = 現金 + 保有株数 × 現在の株価
function totalValue(p, price) {
  return p.cash + p.holdings * price;
}

/** COIN補充（総資産の一部と交換）。last5では不可。choice: "" | "half5" | "zero10" */
function applyCoinRescue(p, choice, price) {
  if (!p || !choice) return p;
  const tv = totalValue(p, price);
  let keepRatio = 1;
  let addCoins = 0;
  if (choice === "half5") {
    keepRatio = 0.5;
    addCoins = 5;
  } else if (choice === "zero10") {
    keepRatio = 0.25;
    addCoins = 10;
  } else {
    return p;
  }
  const stock0 = p.cards && p.cards.stock != null ? p.cards.stock : 0;
  return {
    ...p,
    cash: Math.max(0, (p.cash || 0) * keepRatio),
    holdings: Math.max(0, Math.floor((p.holdings || 0) * keepRatio)),
    cards: { ...(p.cards || {}), stock: stock0 + addCoins },
  };
}

function coinRescueLabel(choice) {
  if (choice === "half5") return "総資産50% → COIN+5";
  if (choice === "zero10") return "総資産75% → COIN+10";
  return "";
}

// AIの投資判断: 株価の急騰・急落に強く反応する大胆スタイル
// - 数百円→数万円級の急騰時は保有株を大量売却
// - 数万円→数百円級の急落時は現金を大量投入して買う
// - 素数/2の累乗の特徴も加味しつつ、動くときは振り切る
// 現物取引なので、買いは現金の範囲内、売りは保有株数の範囲内で株数を決定する
function aiDecideTrade(rnd, nStart, priceBefore, cash, holdings, refPrice, ctx) {
  ctx = ctx || {};
  const maxBuyShares = priceBefore > 0 ? Math.floor(cash / priceBefore) : 0;
  const ratio = refPrice > 0 ? priceBefore / refPrice : 1;
  const totalAssets = cash + holdings * priceBefore;
  const turn = ctx.turn || 1;
  const totalTurns = ctx.totalTurns || 12;
  const endgameLock = isLastFiveTurns(turn, totalTurns);
  const progress = turn / totalTurns;
  const human = ctx.human || null;
  const humanTV = human ? (human.cash + human.holdings * priceBefore) : 0;
  const behindHuman = humanTV > totalAssets * 1.05;
  const aheadHuman = totalAssets > humanTV * 1.15;

  const prime = isPrime(nStart);
  const pow2 = isPowerOfTwo(nStart);
  let factorCount = 0;
  (function countFactors(n) {
    let d = 2, x = n;
    while (d * d <= x) {
      while (x % d === 0) { factorCount++; x /= d; }
      d++;
    }
    if (x > 1) factorCount++;
  })(nStart);

  const isSkyHigh = priceBefore >= 4000 || (priceBefore >= 1600 && ratio >= 2.0);
  const isRockBottom = priceBefore <= 380 || (priceBefore <= 750 && ratio <= 0.4);
  const isHigh = priceBefore >= 1100 || ratio >= 1.45;
  const isLow = priceBefore <= 700 || ratio <= 0.65;

  // エッジ算出
  let edge = 0;
  if (prime) edge += 1.5;
  if (pow2) edge -= 1.4;
  if (factorCount >= 6) edge -= 0.4;
  if (factorCount <= 2 && !pow2) edge += 0.45;
  if (ratio >= 1.3) edge -= 0.6;
  if (ratio <= 0.78) edge += 0.55;
  const equityRatio = totalAssets > 0 ? (holdings * priceBefore) / totalAssets : 0;
  if (equityRatio > 0.75) edge -= 0.35;
  if (equityRatio < 0.15) edge += 0.2;

  // 人間に負けているときは攻める、勝っているときは邪魔しやすい様子見も混ぜる
  if (behindHuman) edge *= 1.15;
  // 小さなノイズ
  edge += (Math.random() - 0.5) * 0.25;

  // --- 様子見＋後でCOIN妨害を狙う戦術 ---
  // シグナルが弱〜中程度のとき、あえて注文せずCOINで人間を潰す余地を残す
  // （COINフェーズでは全注文が見える）
  const sabotageStayChance = behindHuman ? 0.22 : (aheadHuman ? 0.38 : 0.28);
  if (!endgameLock && Math.abs(edge) < 0.85 && Math.random() < sabotageStayChance) {
    return { action: "stay", shares: 0 };
  }
  // 終盤でリードしているときは様子見多め（ただしラスト5は禁止）
  if (!endgameLock && progress > 0.7 && aheadHuman && Math.abs(edge) < 1.1 && Math.random() < 0.4) {
    return { action: "stay", shares: 0 };
  }

  // --- 高値利確: ほぼ全売り ---
  if ((isSkyHigh || (isHigh && edge < 0.3)) && holdings > 0) {
    const pct = 0.92 + Math.random() * 0.08; // 92-100%
    return { action: "sell", shares: Math.max(1, Math.floor(holdings * pct)) };
  }

  // --- 安値: 現金ほぼ全買い ---
  if ((isRockBottom || (isLow && edge > 0.3)) && maxBuyShares > 0) {
    const pct = 0.92 + Math.random() * 0.08;
    return { action: "buy", shares: Math.max(1, Math.floor(maxBuyShares * pct)) };
  }

  // --- 強いシグナルは振り切り ---
  if (edge >= 0.9 && maxBuyShares > 0) {
    // 買うときは現金のほとんどを投入
    let pct = prime ? 0.95 : 0.88;
    pct = Math.min(1, pct + Math.random() * 0.05);
    if (behindHuman) pct = Math.min(1, pct + 0.03);
    return { action: "buy", shares: Math.max(1, Math.floor(maxBuyShares * pct)) };
  }
  if (edge <= -0.9 && holdings > 0) {
    // 売るときは株のほとんどを放出
    let pct = pow2 ? 0.95 : 0.88;
    pct = Math.min(1, pct + Math.random() * 0.05);
    return { action: "sell", shares: Math.max(1, Math.floor(holdings * pct)) };
  }

  // --- 中程度のエッジでも厚め（振り切り寄り） ---
  if (edge > 0.25 && maxBuyShares > 0) {
    const pct = 0.75 + Math.random() * 0.2; // 75-95%
    return { action: "buy", shares: Math.max(1, Math.floor(maxBuyShares * pct)) };
  }
  if (edge < -0.25 && holdings > 0) {
    const pct = 0.75 + Math.random() * 0.2;
    return { action: "sell", shares: Math.max(1, Math.floor(holdings * pct)) };
  }

  // エッジほぼなし → 様子見（COIN妨害待ち）※ラスト5は不可
  if (!endgameLock && Math.random() < 0.55) return { action: "stay", shares: 0 };
  if (maxBuyShares > 0 && equityRatio < 0.4) {
    return clampOrder(
      { action: "buy", shares: Math.max(1, Math.floor(maxBuyShares * (0.7 + Math.random() * 0.25))) },
      cash, holdings, priceBefore, turn, totalTurns
    );
  }
  if (holdings > 0 && equityRatio > 0.5) {
    return clampOrder(
      { action: "sell", shares: Math.max(1, Math.floor(holdings * (0.7 + Math.random() * 0.25))) },
      cash, holdings, priceBefore, turn, totalTurns
    );
  }
  if (endgameLock) {
    if (holdings > 0) {
      return clampOrder({ action: "sell", shares: holdings }, cash, holdings, priceBefore, turn, totalTurns);
    }
    if (maxBuyShares > 0) {
      return clampOrder({ action: "buy", shares: maxBuyShares }, cash, holdings, priceBefore, turn, totalTurns);
    }
  }
  return { action: "stay", shares: 0 };
}

// COIN使用後の株価を試算
function previewSelfPrice(nStart, quick) {
  return sopf(nStart + (quick || 0));
}

function previewPrice(nStart, quick, heavyCount) {
  return previewSelfPrice(nStart, quick);
}

/** 個人株価。
 *  ownQuick: 自分の操作のみ（自分の妨害は含めない）
 *  incomingHeavy: 他者からの妨害のみ（自分の妨害は絶対に渡さない）
 *  妨害1回（COIN5枚）= 相手Nに+1。妨害方向にのみ効く。
 *  追加: 被妨害がある場合、操作は無効化され妨害のみ適用（防げるのは防衛のみ）。
 */
function personalExecPrice(nStart, ownQuick, incomingHeavy, action) {
  const h = Math.max(0, incomingHeavy || 0); // 他者分のみ
  // 妨害を受けている間は操作を無効化
  const q = h > 0 ? 0 : Math.max(0, ownQuick || 0);
  const base = sopf(nStart + q);
  if (h <= 0 || !action || action === "stay") return base;
  // 操作は既に無効化済みのため、N は nStart+h のみ
  const interfered = sopf(nStart + h);
  if (action === "buy") return Math.max(base, interfered);
  if (action === "sell") return Math.min(base, interfered);
  return base;
}

/** 1TERN分の清算（純粋関数）。破産判定付き */
function settleTurn(players, orders, hacks, nStart, priceBefore) {
  const incomingHeavyMap = {};
  const defenseMap = {};
  players.forEach((p) => {
    const def = hacks[p.id] && hacks[p.id].defense;
    defenseMap[p.id] = !!(typeof def === "number" ? def > 0 : def);
    let inc = 0;
    players.forEach((other) => {
      if (String(other.id) === String(p.id)) return;
      const hv = hacks[other.id] && hacks[other.id].heavy;
      inc += typeof hv === "number" ? hv : hv ? 1 : 0;
    });
    // 防衛使用時は被妨害をすべて防ぐ
    incomingHeavyMap[p.id] = defenseMap[p.id] ? 0 : Math.max(0, inc);
  });

  const priceMap = {};
  const nMap = {};
  players.forEach((p) => {
    if (p.isBankrupt) {
      priceMap[p.id] = priceBefore;
      nMap[p.id] = nStart;
      return;
    }
    const hk = hacks[p.id] || {};
    if (hk.avant) {
      const ap = Math.max(1, Math.min(99999, Math.floor(Number(hk.avantPrice) || 1)));
      priceMap[p.id] = ap;
      nMap[p.id] = nStart;
      return;
    }
    const ownQuick = hk.quick || 0;
    const incH = incomingHeavyMap[p.id] || 0;
    const order = orders[p.id] || { action: "stay", shares: 0 };
    const effectiveQuick = incH > 0 ? 0 : ownQuick;
    priceMap[p.id] = personalExecPrice(nStart, ownQuick, incH, order.action);
    nMap[p.id] = nStart + effectiveQuick + incH;
  });

  const execResults = {};
  const updated = players.map((p) => {
    if (p.isBankrupt) {
      execResults[p.id] = {
        action: "stay", sharesReq: 0, sharesFilled: 0, note: "破産済み",
        execPrice: priceMap[p.id], ownQuick: 0, incomingHeavy: 0, usedHeavy: 0, bankrupt: true,
      };
      return { ...p, history: [...(p.history || []), 0] };
    }

    let cash = p.cash;
    let holdings = p.holdings;
    let avgPrice = p.avgPrice;
    const order = orders[p.id] || { action: "stay", shares: 0 };
    const execPrice = priceMap[p.id];
    let filled = 0;
    let note = "";
    let wentBankrupt = false;
    let bailoutCards = 0;

    if (order.action === "buy" && order.shares > 0 && execPrice > 0) {
      const required = order.shares * execPrice;
      const liquidity = cash + holdings * execPrice; // 全株売却後の支払能力
      if (required > liquidity + 1e-9) {
        const hand = p.cards.stock != null ? p.cards.stock : 0;
        const defCost = (hacks[p.id]?.defense) ? 5 : 0;
        const alreadyUsed = (hacks[p.id]?.quick || 0) + ((hacks[p.id]?.heavy || 0) > 0 ? 5 : 0) + defCost + ((hacks[p.id]?.avant) ? 10 : 0);
        const handLeft = Math.max(0, hand - alreadyUsed);
        if (handLeft >= 10) {
          filled = 0;
          note = "COIN10枚で買付を帳消し（破産回避）";
          bailoutCards = 10;
        } else {
          wentBankrupt = true;
          filled = 0;
          note = "破産（買付代金を支払不能・帳消し不可）";
          cash = 0;
          holdings = 0;
          avgPrice = 0;
        }
      } else {
        // 現金不足なら保有株を先に全売却してから執行
        if (cash < required && holdings > 0) {
          cash += holdings * execPrice;
          holdings = 0;
          avgPrice = 0;
          note = "資金不足のため保有株を強制売却して買付";
        }
        filled = order.shares;
        const cost = filled * execPrice;
        cash -= cost;
        holdings += filled;
        avgPrice = execPrice;
      }
    } else if (order.action === "sell" && order.shares > 0) {
      filled = Math.min(order.shares, holdings);
      if (filled < order.shares) note = "保有株不足のため一部成立";
      if (filled > 0) {
        cash += filled * execPrice;
        holdings -= filled;
        if (holdings === 0) avgPrice = 0;
      }
    }

    execResults[p.id] = {
      action: order.action,
      sharesReq: order.shares,
      sharesFilled: filled,
      note,
      execPrice,
      ownQuick: hacks[p.id]?.quick || 0,
      quickNullified: (incomingHeavyMap[p.id] || 0) > 0 && (hacks[p.id]?.quick || 0) > 0,
      effectiveQuick: (incomingHeavyMap[p.id] || 0) > 0 ? 0 : (hacks[p.id]?.quick || 0),
      incomingHeavy: incomingHeavyMap[p.id] || 0,
      usedHeavy: hacks[p.id]?.heavy || 0,
      defense: !!defenseMap[p.id],
      avant: !!(hacks[p.id] && hacks[p.id].avant),
      avantPrice: (hacks[p.id] && hacks[p.id].avant) ? (hacks[p.id].avantPrice || 0) : 0,
      blockedHeavy: defenseMap[p.id] ? (function () {
        let raw = 0;
        players.forEach((other) => {
          if (String(other.id) === String(p.id)) return;
          const hv = hacks[other.id] && hacks[other.id].heavy;
          raw += typeof hv === "number" ? hv : hv ? 1 : 0;
        });
        return raw;
      })() : 0,
      bankrupt: wentBankrupt,
      bailout: bailoutCards > 0,
      bailoutCards,
    };

    const defCostUsed = (hacks[p.id]?.defense) ? 5 : 0;
    const avantCostUsed = (hacks[p.id]?.avant) ? 10 : 0;
    const used = (hacks[p.id]?.quick || 0) + ((hacks[p.id]?.heavy || 0) > 0 ? 5 : 0) + defCostUsed + avantCostUsed + bailoutCards;
    let cards;
    if (wentBankrupt) {
      cards = { stock: 0 };
    } else {
      cards = { stock: Math.max(0, (p.cards.stock != null ? p.cards.stock : 0) - used) };
    }

    const tv = wentBankrupt ? 0 : totalValue({ cash, holdings }, execPrice);
    return {
      ...p,
      cash,
      holdings,
      avgPrice,
      cards,
      isBankrupt: wentBankrupt || !!p.isBankrupt,
      history: [...(p.history || []), tv],
      avantUsed: !!p.avantUsed || !!(hacks[p.id]?.avant),
    };
  });

  return { updated, execResults, priceMap, nMap, incomingHeavyMap };
}



// AIのCOIN使用判断:
// - 前半は温存し、後半に回す（COINの残量と残りTERNを見て配分）
// - 自分の売買に有利な株価、または大口の相手を不利にする株価を狙って選ぶ
// - 操作は複数枚使用可
function aiDecideCards(cards, turn, totalTurns, order, nStart, priceBefore, allOrders, selfId, playersList) {
  const progress = turn / totalTurns;
  const remainingTurns = Math.max(1, totalTurns - turn + 1);
  const selfAction = order?.action || "stay";
  const selfShares = order?.shares || 0;
  let stock = cards.stock != null ? cards.stock : ((cards.quick || 0) + (cards.heavy || 0));

  let idHash = 0;
  const idStr = String(selfId || "");
  for (let i = 0; i < idStr.length; i++) idHash = (idHash * 31 + idStr.charCodeAt(i)) | 0;
  const isPreferredTurn = (turn % 3) === (Math.abs(idHash) % 3);

  // --- 操作: 前半も適度に使い、後半用に温存する配分 ---
  // 理想消費ペース: 経過割合に応じてCOINの一部を残す
  let bestQuick = 0;
  if (selfAction !== "stay" && selfShares > 0 && stock > 0) {
    // 残りTERN用の温存枚数（最低でも終盤に2〜4枚残す意識）
    const reserve = progress < 0.4 ? Math.max(2, Math.ceil(stock * 0.55))
      : progress < 0.7 ? Math.max(2, Math.ceil(stock * 0.35))
      : progress < 0.9 ? Math.max(1, Math.ceil(stock * 0.15))
      : 0;
    const spendable = Math.max(0, stock - reserve);
    // 1TERN上限（前半は抑えめ、後半は厚く）
    let turnCap = 1;
    if (progress < 0.35) turnCap = selfShares >= 5 ? 2 : 1;
    else if (progress < 0.6) turnCap = selfShares >= 3 ? 2 : 1;
    else if (progress < 0.85) turnCap = 3;
    else turnCap = remainingTurns <= 2 ? 5 : 4;
    const maxQ = Math.min(spendable, turnCap);

    const basePrice = personalExecPrice(nStart, 0, 0, selfAction);
    let bestScore = -1;
    for (let q = 0; q <= maxQ; q++) {
      const p = personalExecPrice(nStart, q, 0, selfAction);
      const gain = selfAction === "buy" ? basePrice - p : p - basePrice;
      // 操作を積極的に使う（前半も適度に、後半はさらに軽く）
      const unitCost = progress < 0.45 ? 1.4 : progress < 0.75 ? 0.9 : 0.5;
      const score = gain * selfShares - q * unitCost;
      if (gain >= 1 && score > bestScore) {
        bestScore = score;
        bestQuick = q;
      }
    }
    if (bestQuick > 1) {
      const gainBest = selfAction === "buy"
        ? basePrice - personalExecPrice(nStart, bestQuick, 0, selfAction)
        : personalExecPrice(nStart, bestQuick, 0, selfAction) - basePrice;
      for (let q = 0; q < bestQuick; q++) {
        const gain = selfAction === "buy"
          ? basePrice - personalExecPrice(nStart, q, 0, selfAction)
          : personalExecPrice(nStart, q, 0, selfAction) - basePrice;
        if (gain >= gainBest * 0.9) { bestQuick = q; break; }
      }
    }
  }

  // --- 妨害: 固定5枚。破産級の大口買いに対して積極、それ以外は温存 ---
  // 最初の3TERNは使用不可。効果は1（相手N+1）
  let bestHeavy = 0;
  if (turn > 3 && stock - bestQuick >= 5 && playersList && playersList.length) {
    // COIN温存: 前半は破産狙い以外ほぼ撃たない
    const coinReserve = progress < 0.4 ? Math.max(10, Math.ceil(stock * 0.55))
      : progress < 0.7 ? Math.max(6, Math.ceil(stock * 0.35))
      : progress < 0.9 ? Math.max(3, Math.ceil(stock * 0.15))
      : 0;
    const canAffordHeavy = stock - bestQuick - coinReserve >= 5;

    let bestTarget = null;
    let bestScore = -1;
    let bestIsBankruptShot = false;

    (playersList || []).forEach((pl) => {
      if (!pl || String(pl.id) === String(selfId) || pl.isBankrupt) return;
      const tOrder = allOrders && allOrders[pl.id];
      const tAction = tOrder?.action || "stay";
      const tShares = tOrder?.shares || 0;
      if (tAction !== "buy" && tAction !== "sell") return;
      if (tShares < 1) return;

      const before = personalExecPrice(nStart, 0, 0, tAction);
      const after = personalExecPrice(nStart, 0, 1, tAction);
      const delta = tAction === "buy" ? after - before : before - after;
      if (delta <= 0) return;

      // 買い注文: 被妨害後の約定価格で支払い不能なら破産級
      let bankruptShot = false;
      if (tAction === "buy") {
        const req = tShares * after;
        const liq = (pl.cash || 0) + (pl.holdings || 0) * after;
        bankruptShot = req > liq + 1e-9;
      }

      const harmRatio = before > 0 ? delta / before : 99;
      const totalLoss = delta * tShares;
      let score = totalLoss + (bankruptShot ? 50000 : 0);
      if (!pl.isAI) score *= 1.25;
      // 効きが薄い相手は低優先
      if (!bankruptShot && totalLoss < 2000 && harmRatio < 0.8) score *= 0.25;

      if (score > bestScore) {
        bestScore = score;
        bestTarget = pl;
        bestIsBankruptShot = bankruptShot;
      }
    });

    if (bestTarget && (canAffordHeavy || bestIsBankruptShot)) {
      let fireChance = 0;
      if (bestIsBankruptShot) {
        // 破産確定級 → 積極的に妨害（ただし前半は少し抑える）
        fireChance = progress < 0.35 ? 0.55 : progress < 0.6 ? 0.72 : 0.88;
        if (!bestTarget.isAI) fireChance = Math.min(0.95, fireChance + 0.08);
      } else {
        // NORMALの大損害のみ低確率（COIN温存）
        fireChance = progress < 0.45 ? 0.04 : progress < 0.75 ? 0.1 : 0.18;
        if (!bestTarget.isAI) fireChance += 0.05;
        if (isPreferredTurn) fireChance += 0.04;
      }
      // 手元が薄いときは破産級以外ほぼ撃たない
      if (stock < 12 && !bestIsBankruptShot) fireChance *= 0.35;
      if (stock < 8 && bestIsBankruptShot) fireChance *= 0.75;

      if (Math.random() < fireChance) bestHeavy = 1;
    }
  }

  if (bestQuick + (bestHeavy > 0 ? 5 : 0) > stock) bestHeavy = 0;

  // --- 防衛: 破産回避を最優先。被妨害で支払い不能になる大口買いでは高確率で防衛 ---
  let useDefense = 0;
  const afterQH = bestQuick + (bestHeavy > 0 ? 5 : 0);
  const leftAfter = stock - afterQH;
  if (turn > 3 && leftAfter >= 5 && selfAction === "buy" && selfShares >= 1) {
    const selfPlDef = (playersList || []).find((pl) => pl && String(pl.id) === String(selfId));
    const cash0 = selfPlDef ? (selfPlDef.cash || 0) : 0;
    const hold0 = selfPlDef ? (selfPlDef.holdings || 0) : 0;
    // 被妨害時は操作無効 → heavy=1 で価格を試算
    const priceHit = personalExecPrice(nStart, bestQuick, 1, "buy");
    const priceSafe = personalExecPrice(nStart, bestQuick, 0, "buy");
    const reqHit = selfShares * priceHit;
    const liqHit = cash0 + hold0 * priceHit;
    const willBankruptIfHit = reqHit > liqHit + 1e-9;
    // 帳消し（10枚）は大幅減るので極力避ける → 防衛（5枚）で先に防ぐ
    const handIfNoDef = leftAfter;
    const wouldNeedBailout = willBankruptIfHit && handIfNoDef >= 10;
    const cannotBailout = willBankruptIfHit && handIfNoDef < 10;

    let defChance = 0;
    if (wouldNeedBailout) {
      // 被妨害→支払い不能→帳消しコース: 防衛を積極使用（帳消し10枚より防衛5枚）
      defChance = 0.96;
    } else if (cannotBailout) {
      // 帳消しすらできず破産確定: ほぼ必ず防衛
      defChance = 0.99;
    } else {
      // 破産までいかなくても大口＋操作中は軽く検討
      const overpayRisk = priceHit > priceSafe * 1.5 && selfShares >= 10;
      if (overpayRisk) defChance = 0.2;
      if (selfShares >= 25 && bestQuick > 0) defChance = Math.max(defChance, 0.15);
      if (progress < 0.45) defChance *= 0.4;
      if (stock < 12) defChance *= 0.5;
    }
    if (Math.random() < defChance) useDefense = 1;
  } else if (turn > 3 && leftAfter >= 5 && selfAction === "sell" && selfShares >= 20) {
    // 大口売りは価格保護の優先度は低め（破産は買いに特有）
    let defChance = progress > 0.7 ? 0.12 : 0.05;
    if (bestQuick > 0) defChance += 0.06;
    if (stock < 12) defChance *= 0.5;
    if (Math.random() < defChance) useDefense = 1;
  }
  if (useDefense && bestQuick + (bestHeavy > 0 ? 5 : 0) + 5 > stock) {
    // 防衛（破産回避）優先: 妨害→操作の順に削る
    bestHeavy = 0;
    if (bestQuick + 5 > stock) bestQuick = Math.max(0, stock - 5);
  }
  // 念のためTERN1-3は防衛しない
  if (turn <= 3) useDefense = 0;

  let avant = 0;
  let avantPrice = 1000;
  const selfPl = (playersList || []).find((pl) => pl && String(pl.id) === String(selfId));
  const stockLeft = stock - bestQuick - (bestHeavy > 0 ? 5 : 0) - (useDefense ? 5 : 0);
  if (
    selfPl && !selfPl.avantUsed && !selfPl.isBankrupt &&
    stockLeft >= 10 && progress >= 0.35 &&
    selfAction !== "stay" && selfShares >= 5
  ) {
    // 積極的に奥義を狙う（ゲーム中1回・効果大）
    let avChance = 0.18;
    if (selfShares >= 12) avChance = 0.28;
    if (selfShares >= 25) avChance = 0.4;
    if (selfShares >= 40) avChance = 0.52;
    if (progress > 0.55) avChance += 0.1;
    if (progress > 0.8) avChance += 0.12;
    // 被妨害で破産しそうな大口買いは特に優先
    if (selfAction === "buy") {
      const priceHit = personalExecPrice(nStart, bestQuick, 1, "buy");
      const req = selfShares * priceHit;
      const liq = (selfPl.cash || 0) + (selfPl.holdings || 0) * priceHit;
      if (req > liq + 1e-9) avChance = Math.min(0.85, avChance + 0.35);
    }
    if (stockLeft < 15) avChance *= 0.85;
    if (Math.random() < avChance) {
      avant = 1;
      if (selfAction === "buy") {
        avantPrice = Math.max(1, Math.min(99999, Math.floor(priceBefore * (0.08 + Math.random() * 0.25))));
      } else {
        avantPrice = Math.max(1, Math.min(99999, Math.floor(priceBefore * (1.8 + Math.random() * 2.5))));
      }
      bestQuick = 0;
      bestHeavy = 0;
      useDefense = 0;
    }
  }

  return { quick: bestQuick, heavy: bestHeavy, defense: useDefense, avant: avant, avantPrice: avantPrice };
}

// ---------- UI 補助 ----------
function yen(n) {
  const sign = n < 0 ? "-" : "";
  return sign + "¥" + Math.abs(Math.round(n)).toLocaleString();
}
function yenNum(n) {
  return Math.round(Number(n) || 0).toLocaleString();
}

function factorString(n) {
  let num = n;
  const factors = [];
  let d = 2;
  while (d * d <= num) {
    while (num % d === 0) {
      factors.push(d);
      num /= d;
    }
    d += 1;
  }
  if (num > 1) factors.push(num);
  return factors.join(" × ");
}

// ---------- メインコンポーネント ----------
function FactorTrader() {
  const [screen, setScreen] = useState("setup"); // setup | lobby | play | over

  const [humanCount, setHumanCount] = useState(1);

  const [myName, setMyName] = useState("YOU");
  const [myPlayerId, setMyPlayerId] = useState(null);
  const [netStatus, setNetStatus] = useState(""); // 接続状態メッセージ
  const [lobbyList, setLobbyList] = useState([]); // [{id,name,isHost,connected}]
  const [pendingOrders, setPendingOrders] = useState({});
  const [pendingHacks, setPendingHacks] = useState({});
  const [submittedOrderIds, setSubmittedOrderIds] = useState([]);
  const [submittedHackIds, setSubmittedHackIds] = useState([]);
  const [iSubmittedOrder, setISubmittedOrder] = useState(false);
  const [iSubmittedHack, setISubmittedHack] = useState(false);
  const peerRef = useRef(null);
  const connsRef = useRef({}); // peerId -> DataConnection (host)
  const hostConnRef = useRef(null); // guest -> host
  const isHostRef = useRef(false);
  const myPlayerIdRef = useRef(null);
  const stateRef = useRef({});
  const [players, setPlayers] = useState([]);
  const [currentN, setCurrentN] = useState(0);
  const [turn, setTurn] = useState(1);
  const [totalTurns, setTotalTurns] = useState(24);
  const [phase, setPhase] = useState("market"); // market | order | hack | reveal
  // 対人: 現在入力中の人間プレイヤー index（humanPlayers 配列上）
  const [inputHumanIdx, setInputHumanIdx] = useState(0);
  const [playersReadyMask, setPlayersReadyMask] = useState({}); // id -> true 注文/ハック確定済み
  const [priceHistory, setPriceHistory] = useState([]); // { turn, price }
  const [log, setLog] = useState([]);
  const [orders, setOrders] = useState({}); // playerId -> {action:'buy'|'sell'|'stay', shares}
  const [hackChoices, setHackChoices] = useState({}); // playerId -> {quick, heavy}
  const [humanOrderDraft, setHumanOrderDraft] = useState({ action: "stay", shares: 0 });
  const [humanHackDraft, setHumanHackDraft] = useState({ quick: 0, heavy: 0, defense: 0, avant: 0, avantPrice: 1000, coinRescue: "" });
  const [endgameBonusMsg, setEndgameBonusMsg] = useState("");
  const [revealData, setRevealData] = useState(null);
  const [revealFocusId, setRevealFocusId] = useState(null); // 清算画面で見る人間
  const [basePrice, setBasePrice] = useState(0);
  const [showQuitConfirm, setShowQuitConfirm] = useState(false);
  const [showRulesModal, setShowRulesModal] = useState(false);
  const [passBanner, setPassBanner] = useState(null); // { name } 端末渡しメッセージ
  const logEndRef = useRef(null);
  const topRef = useRef(null);

  // 最新 state を ref に保持（Peer コールバックから参照）
  useEffect(() => {
    stateRef.current = {
      screen, players, turn, totalTurns, phase, currentN, basePrice,
      priceHistory, log, orders, hackChoices, revealData, revealFocusId,
      endgameBonusMsg, playerCount, seriousMode, pendingOrders, pendingHacks,
      submittedOrderIds, submittedHackIds, myPlayerId, onlineRole, roomCode,
    };
    myPlayerIdRef.current = myPlayerId;
    isHostRef.current = onlineRole === "host";
  });

  // currentN が 0/不正なら再抽選（仮株価0円バグ防止）
  useEffect(() => {
    if (screen !== "play") return;
    const v = Math.floor(Number(currentN) || 0);
    if (v < 10000 || v > 99999) {
      const fixed = randBase();
      setCurrentN(fixed);
      stateRef.current = { ...stateRef.current, currentN: fixed };
    }
  }, [screen, turn, currentN]);

  // ゲスト: フェーズ切替で下書きをリセット
  const prevPhaseRef = useRef(phase);
  useEffect(() => {
    if (playMode !== "online") return;
    if (prevPhaseRef.current !== phase) {
      if (phase === "order") {
        setHumanOrderDraft({ action: "stay", shares: 0 });
        setISubmittedOrder(false);
      }
      if (phase === "hack") {
        setHumanHackDraft({ quick: 0, heavy: 0, defense: 0, avant: 0, avantPrice: 1000, coinRescue: "" });
        setISubmittedHack(false);
      }
      prevPhaseRef.current = phase;
    }
  }, [phase, playMode]);

  // アンマウント時に Peer 破棄
  useEffect(() => {
    return () => { destroyPeer(); };
  }, []);

  function applySnapshot(snap) {
    if (!snap) return;
    if (snap.players) setPlayers(snap.players);
    if (snap.turn != null) setTurn(snap.turn);
    if (snap.totalTurns != null) setTotalTurns(snap.totalTurns);
    if (snap.phase) setPhase(snap.phase);
    if (snap.currentN != null) setCurrentN(ensureBaseN(snap.currentN));
    if (snap.basePrice != null) setBasePrice(snap.basePrice);
    if (snap.priceHistory) setPriceHistory(snap.priceHistory);
    if (snap.log) setLog(snap.log);
    if (snap.orders) setOrders(snap.orders);
    if (snap.hackChoices) setHackChoices(snap.hackChoices);
    if (snap.revealData !== undefined) setRevealData(snap.revealData);
    if (snap.phase === "reveal" && myPlayerIdRef.current) {
      setRevealFocusId(myPlayerIdRef.current);
    } else if (snap.revealFocusId !== undefined) {
      setRevealFocusId(snap.revealFocusId);
    }
    if (snap.endgameBonusMsg != null) setEndgameBonusMsg(snap.endgameBonusMsg);
    if (snap.playerCount != null) setPlayerCount(snap.playerCount);
    if (snap.seriousMode != null) setSeriousMode(!!snap.seriousMode);
    if (snap.pendingOrders) setPendingOrders(snap.pendingOrders);
    if (snap.pendingHacks) setPendingHacks(snap.pendingHacks);
    if (snap.submittedOrderIds) setSubmittedOrderIds(snap.submittedOrderIds);
    if (snap.submittedHackIds) setSubmittedHackIds(snap.submittedHackIds);
    if (snap.screen) setScreen(snap.screen);
    // 自分の提出フラグを同期
    const mid = myPlayerIdRef.current;
    if (mid && snap.submittedOrderIds) {
      setISubmittedOrder(snap.submittedOrderIds.indexOf(mid) >= 0);
    }
    if (mid && snap.submittedHackIds) {
      setISubmittedHack(snap.submittedHackIds.indexOf(mid) >= 0);
    }
    if (snap.phase === "order") {
      // 新ターンの注文開始時はドラフトリセットはホスト側で制御
    }
  }

  function broadcastSnapshot(extra) {
    if (!isHostRef.current) return;
    const snap = buildSnapshot({ ...stateRef.current, ...extra });
    // extra で上書きした値を snap に反映済み想定。呼び出し側で setState 後に遅延ブロードキャストも可
    Object.keys(connsRef.current).forEach((pid) => {
      const c = connsRef.current[pid];
      if (c && c.open) {
        try { c.send({ type: "snapshot", snapshot: snap }); } catch (e) {}
      }
    });
  }

  function broadcastSnapshotFrom(partialState) {
    if (!isHostRef.current) return;
    const merged = { ...stateRef.current, ...partialState };
    const snap = buildSnapshot(merged);
    Object.keys(connsRef.current).forEach((pid) => {
      const c = connsRef.current[pid];
      if (c && c.open) {
        try { c.send({ type: "snapshot", snapshot: snap }); } catch (e) {}
      }
    });
    return snap;
  }

  function sendToHost(msg) {
    const c = hostConnRef.current;
    if (c && c.open) {
      try { c.send(msg); } catch (e) {}
    }
  }

  function destroyPeer() {
    try {
      Object.keys(connsRef.current).forEach((k) => {
        try { connsRef.current[k].close(); } catch (e) {}
      });
      connsRef.current = {};
      if (hostConnRef.current) {
        try { hostConnRef.current.close(); } catch (e) {}
        hostConnRef.current = null;
      }
      if (peerRef.current) {
        try { peerRef.current.destroy(); } catch (e) {}
        peerRef.current = null;
      }
    } catch (e) {}
  }

  function updateLobbyFromHost() {
    const list = [{ id: "human-0", name: myName || "HOST", isHost: true, connected: true }];
    Object.keys(connsRef.current).forEach((peerId) => {
      const c = connsRef.current[peerId];
      if (c && c.open && c.meta) {
        list.push({ id: c.meta.playerId, name: c.meta.name, isHost: false, connected: true, peerId });
      }
    });
    setLobbyList(list);
    // ゲストへロビー配信
    list.forEach(() => {});
    Object.keys(connsRef.current).forEach((pid) => {
      const c = connsRef.current[pid];
      if (c && c.open) {
        try { c.send({ type: "lobby", players: list, roomCode: stateRef.current.roomCode || roomCode, playerCount }); } catch (e) {}
      }
    });
  }

  function handleHostMessage(conn, data) {
    if (!data || !data.type) return;
    if (data.type === "hello") {
      const used = Object.keys(connsRef.current).filter((k) => connsRef.current[k] && connsRef.current[k].open).length;
      // human-0 is host; assign human-1, human-2, ...
      const nextIdx = used + 1; // first guest = 1
      if (nextIdx >= playerCount) {
        try { conn.send({ type: "error", message: "部屋が満員です" }); } catch (e) {}
        try { conn.close(); } catch (e) {}
        return;
      }
      const playerId = "human-" + nextIdx;
      conn.meta = { playerId, name: data.name || ("P" + (nextIdx + 1)), peerId: conn.peer };
      connsRef.current[conn.peer] = conn;
      try {
        conn.send({
          type: "welcome",
          playerId,
          name: conn.meta.name,
          roomCode: stateRef.current.roomCode || roomCode,
          playerCount,
        });
      } catch (e) {}
      setNetStatus("プレイヤー接続: " + conn.meta.name);
      setTimeout(updateLobbyFromHost, 50);
      return;
    }
    if (data.type === "order") {
      hostReceiveOrder(conn.meta && conn.meta.playerId, data.order);
      return;
    }
    if (data.type === "hack") {
      hostReceiveHack(conn.meta && conn.meta.playerId, data.hack);
      return;
    }
    if (data.type === "next") {
      // ゲストが「次へ」要求 → ホストのみ進行可。無視またはホスト同期
      return;
    }
  }

  function hostReceiveOrder(playerId, order) {
    if (!playerId || !order) return;
    const st = stateRef.current;
    if (st.phase !== "order") return;
    const nextPending = { ...(st.pendingOrders || {}), [playerId]: order };
    const nextSubmitted = Array.from(new Set([...(st.submittedOrderIds || []), playerId]));
    setPendingOrders(nextPending);
    setSubmittedOrderIds(nextSubmitted);
    // 全員揃ったかチェック（遅延で state 更新後）
    setTimeout(() => tryFinalizeOnlineOrders(nextPending, nextSubmitted), 30);
    broadcastSnapshotFrom({
      pendingOrders: nextPending,
      submittedOrderIds: nextSubmitted,
      phase: "order",
      screen: "play",
    });
  }

  function hostReceiveHack(playerId, hack) {
    if (!playerId || !hack) return;
    const st = stateRef.current;
    if (st.phase !== "hack") return;
    const nextPending = { ...(st.pendingHacks || {}), [playerId]: hack };
    const nextSubmitted = Array.from(new Set([...(st.submittedHackIds || []), playerId]));
    setPendingHacks(nextPending);
    setSubmittedHackIds(nextSubmitted);
    setTimeout(() => tryFinalizeOnlineHacks(nextPending, nextSubmitted), 30);
    broadcastSnapshotFrom({
      pendingHacks: nextPending,
      submittedHackIds: nextSubmitted,
      phase: "hack",
      screen: "play",
    });
  }

  function onlineAliveHumans(list) {
    return humanPlayersOf(list || stateRef.current.players || []).filter((p) => !p.isBankrupt && !p.isAI);
  }

  function tryFinalizeOnlineOrders(pending, submitted) {
    if (!isHostRef.current) return;
    const st = stateRef.current;
    if (st.phase !== "order") return;
    const need = onlineAliveHumans(st.players).map((p) => p.id);
    if (!need.length) return;
    const ok = need.every((id) => submitted.indexOf(id) >= 0 && pending[id]);
    if (!ok) return;
    // ホスト側 finalizeOrdersAndGoHack 相当
    finalizeOnlineOrders(pending);
  }

  function tryFinalizeOnlineHacks(pending, submitted) {
    if (!isHostRef.current) return;
    const st = stateRef.current;
    if (st.phase !== "hack") return;
    const need = onlineAliveHumans(st.players).map((p) => p.id);
    if (!need.length) return;
    const ok = need.every((id) => submitted.indexOf(id) >= 0 && pending[id]);
    if (!ok) return;
    finalizeOnlineHacks(pending);
  }

  // 表示用。不正値は useEffect で修復される（ここでは再抽選しない）

  // 基準株価: 損益計算の基準になる価格。前TERNの確定株価(無ければゲーム開始時のbasePrice)。
  // TERN開始時から見えるようにして、変動の読み合いができるようにする。

  function createOnlineRoom() {
    if (typeof Peer === "undefined") {
      setNetStatus("PeerJSの読み込みに失敗しました。ネットワークを確認してください。");
      return;
    }
    destroyPeer();
    const code = genRoomCode();
    const pid = roomPeerId(code);
    setRoomCode(code);
    setOnlineRole("host");
    setPlayMode("online");
    setNetStatus("部屋を作成中…");
    setLobbyList([]);
    setMyPlayerId("human-0");
    myPlayerIdRef.current = "human-0";
    isHostRef.current = true;
    const peer = new Peer(pid, { debug: 1 });
    peerRef.current = peer;
    peer.on("open", (id) => {
      setNetStatus("部屋コード: " + code + "（参加者を待っています）");
      setScreen("lobby");
      setLobbyList([{ id: "human-0", name: myName || "HOST", isHost: true, connected: true }]);
    });
    peer.on("connection", (conn) => {
      conn.on("open", () => {
        conn.on("data", (data) => handleHostMessage(conn, data));
      });
      conn.on("close", () => {
        if (connsRef.current[conn.peer]) delete connsRef.current[conn.peer];
        setNetStatus("切断: 参加者");
        setTimeout(updateLobbyFromHost, 50);
      });
      conn.on("error", () => {
        setNetStatus("接続エラー");
      });
    });
    peer.on("error", (err) => {
      const msg = (err && err.type) || (err && err.message) || "unknown";
      if (String(msg).indexOf("unavailable-id") >= 0 || String(msg) === "unavailable-id") {
        setNetStatus("部屋IDが衝突しました。再作成してください。");
      } else {
        setNetStatus("Peerエラー: " + msg);
      }
    });
  }

  function joinOnlineRoom() {
    if (typeof Peer === "undefined") {
      setNetStatus("PeerJSの読み込みに失敗しました。");
      return;
    }
    const code = String(joinCodeInput || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (code.length < 4) {
      setNetStatus("部屋コードを入力してください");
      return;
    }
    destroyPeer();
    setRoomCode(code);
    setOnlineRole("guest");
    setPlayMode("online");
    setNetStatus("接続中…");
    isHostRef.current = false;
    const peer = new Peer({ debug: 1 });
    peerRef.current = peer;
    peer.on("open", () => {
      const hostId = roomPeerId(code);
      const conn = peer.connect(hostId, { reliable: true });
      hostConnRef.current = conn;
      conn.on("open", () => {
        setNetStatus("ホストに接続しました");
        conn.send({ type: "hello", name: myName || "GUEST" });
      });
      conn.on("data", (data) => {
        if (!data || !data.type) return;
        if (data.type === "welcome") {
          setMyPlayerId(data.playerId);
          myPlayerIdRef.current = data.playerId;
          if (data.name) setMyName(data.name);
          setNetStatus("参加完了: " + (data.playerId || ""));
          setScreen("lobby");
        } else if (data.type === "lobby") {
          setLobbyList(data.players || []);
          if (data.playerCount) setPlayerCount(data.playerCount);
          if (data.roomCode) setRoomCode(data.roomCode);
        } else if (data.type === "snapshot") {
          applySnapshot(data.snapshot);
        } else if (data.type === "error") {
          setNetStatus(data.message || "エラー");
        }
      });
      conn.on("close", () => {
        setNetStatus("ホストとの接続が切れました");
      });
      conn.on("error", () => {
        setNetStatus("接続エラー（部屋コード・ネットワークを確認）");
      });
    });
    peer.on("error", (err) => {
      const msg = (err && err.type) || (err && err.message) || "unknown";
      setNetStatus("Peerエラー: " + msg + "（部屋が存在するか確認）");
    });
  }

  function goToOrderPhase() {
    // ONLINE ゲストはホストのスナップショット待ち
    if (playMode === "online" && onlineRole === "guest") return;
    const ah = aliveHumans(players);
    setInputHumanIdx(0);
    setPlayersReadyMask({});
    setOrders({});
    setPassBanner(null);
    setPendingOrders({});
    setPendingHacks({});
    setSubmittedOrderIds([]);
    setSubmittedHackIds([]);
    setISubmittedOrder(false);
    setISubmittedHack(false);
    // ONLINE: 同時入力。LOCAL は常に人間1人
    const online = playMode === "online";
    const hum = online
      ? players.find((p) => p.id === myPlayerId) || ah[0]
      : ah[0];
    let draft = { action: "stay", shares: 0 };
    if (hum && isLastFiveTurns(turn, totalTurns)) {
      const maxBuy = priceBefore > 0 ? Math.floor(hum.cash / priceBefore) : 0;
      if (hum.holdings > 0) draft = { action: "sell", shares: minOrderShares("sell", hum.holdings, maxBuy) };
      else if (maxBuy > 0) draft = { action: "buy", shares: minOrderShares("buy", hum.holdings, maxBuy) };
    }
    setHumanOrderDraft(draft);
    if (!online && ah.length > 1 && hum) {
      setPassBanner({ name: hum.name, phaseLabel: "注文" });
    }
    setPhase("order");
    if (online && onlineRole === "host") {
      setTimeout(() => {
        broadcastSnapshotFrom({
          phase: "order",
          orders: {},
          pendingOrders: {},
          submittedOrderIds: [],
          pendingHacks: {},
          submittedHackIds: [],
          screen: "play",
        });
      }, 40);
    }
  }

  function confirmOrders() {
    // ---- ONLINE ----
    if (playMode === "online") {
      const me = players.find((p) => p.id === myPlayerId) || players.find((p) => !p.isAI);
      if (!me || me.isBankrupt) return;
      let nOrd = Math.floor(Number(currentN) || 0);
      if (nOrd < 10000) { nOrd = randBase(); setCurrentN(nOrd); stateRef.current = { ...stateRef.current, currentN: nOrd }; }
      const px = sopf(nOrd);
      const clamped = clampOrder(humanOrderDraft, me.cash, me.holdings, px, turn, totalTurns);
      if (onlineRole === "guest") {
        setISubmittedOrder(true);
        sendToHost({ type: "order", order: clamped });
        return;
      }
      // host
      const nextPending = { ...pendingOrders, [me.id]: clamped };
      const nextSubmitted = Array.from(new Set([...submittedOrderIds, me.id]));
      setPendingOrders(nextPending);
      setSubmittedOrderIds(nextSubmitted);
      setISubmittedOrder(true);
      broadcastSnapshotFrom({
        pendingOrders: nextPending,
        submittedOrderIds: nextSubmitted,
        phase: "order",
        screen: "play",
      });
      setTimeout(() => tryFinalizeOnlineOrders(nextPending, nextSubmitted), 30);
      return;
    }
    // ---- LOCAL ----
    const ah = aliveHumans(players);
    const cur = ah[inputHumanIdx];
    if (!cur) {
      finalizeOrdersAndGoHack({});
      return;
    }
    let nOrd = Math.floor(Number(currentN) || 0);
    if (nOrd < 10000) { nOrd = randBase(); setCurrentN(nOrd); stateRef.current = { ...stateRef.current, currentN: nOrd }; }
    const px = sopf(nOrd);
    const clamped = clampOrder(humanOrderDraft, cur.cash, cur.holdings, px, turn, totalTurns);
    const nextOrders = { ...orders, [cur.id]: clamped };
    setOrders(nextOrders);
    const nextIdx = inputHumanIdx + 1;
    if (nextIdx < ah.length) {
      const nextP = ah[nextIdx];
      setInputHumanIdx(nextIdx);
      let draft = { action: "stay", shares: 0 };
      if (isLastFiveTurns(turn, totalTurns)) {
        const maxBuy = priceBefore > 0 ? Math.floor(nextP.cash / priceBefore) : 0;
        if (nextP.holdings > 0) draft = { action: "sell", shares: minOrderShares("sell", nextP.holdings, maxBuy) };
        else if (maxBuy > 0) draft = { action: "buy", shares: minOrderShares("buy", nextP.holdings, maxBuy) };
      }
      setHumanOrderDraft(draft);
      setPassBanner({ name: nextP.name, phaseLabel: "注文" });
      scrollToTop();
      return;
    }
    finalizeOrdersAndGoHack(nextOrders);
  }

  function finalizeOnlineOrders(pending) {
    if (!isHostRef.current) return;
    const st = stateRef.current;
    const nStartL = st.currentN;
    const priceBeforeL = nStartL > 0 ? sopf(nStartL) : 0;
    const refL = (st.priceHistory && st.priceHistory.length)
      ? st.priceHistory[st.priceHistory.length - 1].price
      : st.basePrice;
    const newOrders = { ...pending };
    const humans = humanPlayersOf(st.players).filter((p) => !p.isBankrupt);
    const refHuman = humans.slice().sort((a, b) => totalValue(b, priceBeforeL) - totalValue(a, priceBeforeL))[0] || null;
    (st.players || []).forEach((p) => {
      if (newOrders[p.id]) return;
      if (p.isBankrupt) {
        newOrders[p.id] = { action: "stay", shares: 0 };
      } else if (!p.isAI) {
        newOrders[p.id] = { action: "stay", shares: 0 };
      } else {
        newOrders[p.id] = clampOrder(
          aiDecideTrade(Math.random(), nStartL, priceBeforeL, p.cash, p.holdings, refL, {
            turn: st.turn,
            totalTurns: st.totalTurns,
            human: refHuman,
          }),
          p.cash, p.holdings, priceBeforeL, st.turn, st.totalTurns
        );
      }
    });
    setOrders(newOrders);
    stateRef.current = { ...stateRef.current, orders: newOrders, phase: "hack", currentN: ensureBaseN(stateRef.current.currentN) };
    setPendingOrders({});
    setSubmittedOrderIds([]);
    setISubmittedOrder(false);
    setISubmittedHack(false);
    setPendingHacks({});
    setSubmittedHackIds([]);
    setHumanHackDraft({ quick: 0, heavy: 0, defense: 0, avant: 0, avantPrice: 1000, coinRescue: "" });
    setPhase("hack");
    setTimeout(() => {
      broadcastSnapshotFrom({
        orders: newOrders,
        phase: "hack",
        pendingOrders: {},
        submittedOrderIds: [],
        pendingHacks: {},
        submittedHackIds: [],
        screen: "play",
      });
    }, 40);
  }

  function finalizeOrdersAndGoHack(humanOrdersSoFar) {
    const newOrders = { ...humanOrdersSoFar };
    // 参照用の「最強人間」をAIの behindHuman 判定に使う
    const humans = humanPlayersOf(players).filter((p) => !p.isBankrupt);
    const refHuman = humans.slice().sort((a, b) => totalValue(b, priceBefore) - totalValue(a, priceBefore))[0] || null;
    players.forEach((p) => {
      if (newOrders[p.id]) return;
      if (p.isBankrupt) {
        newOrders[p.id] = { action: "stay", shares: 0 };
      } else if (!p.isAI) {
        newOrders[p.id] = { action: "stay", shares: 0 };
      } else {
        newOrders[p.id] = clampOrder(
          aiDecideTrade(Math.random(), nStart, priceBefore, p.cash, p.holdings, refPrice, {
            turn: turn,
            totalTurns: totalTurns,
            human: refHuman,
          }),
          p.cash, p.holdings, priceBefore, turn, totalTurns
        );
      }
    });
    setOrders(newOrders);
    stateRef.current = { ...stateRef.current, orders: newOrders, phase: "hack", currentN: ensureBaseN(stateRef.current.currentN) };
    // ハックフェーズへ：最初の生存人間
    const ah = aliveHumans(players);
    setInputHumanIdx(0);
    setHumanHackDraft({ quick: 0, heavy: 0, defense: 0, avant: 0, avantPrice: 1000, coinRescue: "" });
    setPassBanner(ah.length > 1 && ah[0] ? { name: ah[0].name, phaseLabel: "COIN" } : null);
    setPhase("hack");
    scrollToTop();
  }

  function confirmHacks() {
    // ---- ONLINE ----
    if (playMode === "online") {
      const me = players.find((p) => p.id === myPlayerId) || players.find((p) => !p.isAI);
      if (!me || me.isBankrupt) return;
      const endgame = isLastFiveTurns(turn, totalTurns);
      const stock = me.cards.stock || 0;
      let choice = humanHackDraft.coinRescue || "";
      if (endgame) choice = "";
      if (choice === "zero10" && stock !== 0) choice = "";
      if (choice === "half5" && stock > 5) choice = "";
      let avant = (!me.avantUsed && humanHackDraft.avant) ? 1 : 0;
      let avantPrice = Math.max(1, Math.min(99999, Math.floor(Number(humanHackDraft.avantPrice) || 1)));
      let q = avant ? 0 : Math.max(0, Math.floor(humanHackDraft.quick || 0));
      let h = avant ? 0 : (turn <= 3 ? 0 : (humanHackDraft.heavy ? 1 : 0));
      let def = avant ? 0 : ((turn > 3 && humanHackDraft.defense) ? 1 : 0);
      let stockAfterRescue = stock;
      if (choice === "half5") stockAfterRescue = stock + 5;
      if (choice === "zero10") stockAfterRescue = stock + 10;
      const heavyCost = h > 0 ? 5 : 0;
      const defCost = def ? 5 : 0;
      const avantCost = avant ? 10 : 0;
      if (q + heavyCost + defCost + avantCost > stockAfterRescue) {
        if (avant && stockAfterRescue < 10) { avant = 0; }
        if (def && stockAfterRescue - (avant ? 10 : 0) < 5) { def = 0; }
        if (h > 0 && stockAfterRescue - (avant ? 10 : 0) - (def ? 5 : 0) < 5) { h = 0; }
        const room = Math.max(0, stockAfterRescue - (avant ? 10 : 0) - (def ? 5 : 0) - (h > 0 ? 5 : 0));
        if (q > room) q = room;
      }
      const hackPayload = { quick: q, heavy: h, defense: def, avant: avant, avantPrice: avantPrice, coinRescue: choice };
      if (onlineRole === "guest") {
        setISubmittedHack(true);
        sendToHost({ type: "hack", hack: hackPayload });
        return;
      }
      const nextPending = { ...pendingHacks, [me.id]: hackPayload };
      const nextSubmitted = Array.from(new Set([...submittedHackIds, me.id]));
      setPendingHacks(nextPending);
      setSubmittedHackIds(nextSubmitted);
      setISubmittedHack(true);
      broadcastSnapshotFrom({
        pendingHacks: nextPending,
        submittedHackIds: nextSubmitted,
        phase: "hack",
        screen: "play",
      });
      setTimeout(() => tryFinalizeOnlineHacks(nextPending, nextSubmitted), 30);
      return;
    }
    // ---- LOCAL ----
    const ah = aliveHumans(players);
    const cur = ah[inputHumanIdx];
    const endgame = isLastFiveTurns(turn, totalTurns);

    if (cur && !cur.isBankrupt) {
      const stock = cur.cards.stock || 0;
      let choice = humanHackDraft.coinRescue || "";
      if (endgame) choice = "";
      if (choice === "zero10" && stock !== 0) choice = "";
      if (choice === "half5" && stock > 5) choice = "";
      let avant = (!cur.avantUsed && humanHackDraft.avant) ? 1 : 0;
      let avantPrice = Math.max(1, Math.min(99999, Math.floor(Number(humanHackDraft.avantPrice) || 1)));
      let q = avant ? 0 : Math.max(0, Math.floor(humanHackDraft.quick || 0));
      let h = avant ? 0 : (turn <= 3 ? 0 : (humanHackDraft.heavy ? 1 : 0));
      let def = avant ? 0 : ((turn > 3 && humanHackDraft.defense) ? 1 : 0);
      // 補充後の手札でコスト判定（実際の補充は finalize 時）
      let stockAfterRescue = stock;
      if (choice === "half5") stockAfterRescue = stock + 5;
      if (choice === "zero10") stockAfterRescue = stock + 10;
      const heavyCost = h > 0 ? 5 : 0;
      const defCost = def ? 5 : 0;
      const avantCost = avant ? 10 : 0;
      if (q + heavyCost + defCost + avantCost > stockAfterRescue) {
        if (avant && stockAfterRescue < 10) { avant = 0; }
        if (def && stockAfterRescue - (avant ? 10 : 0) < 5) { def = 0; }
        if (h > 0 && stockAfterRescue - (avant ? 10 : 0) - (def ? 5 : 0) < 5) { h = 0; }
        const room = Math.max(0, stockAfterRescue - (avant ? 10 : 0) - (def ? 5 : 0) - (h > 0 ? 5 : 0));
        if (q > room) q = room;
      }
      const nextHacks = {
        ...hackChoices,
        [cur.id]: { quick: q, heavy: h, defense: def, avant: avant, avantPrice: avantPrice, coinRescue: choice },
      };
      setHackChoices(nextHacks);

      const nextIdx = inputHumanIdx + 1;
      if (nextIdx < ah.length) {
        const nextP = ah[nextIdx];
        setInputHumanIdx(nextIdx);
        setHumanHackDraft({ quick: 0, heavy: 0, defense: 0, avant: 0, avantPrice: 1000, coinRescue: "" });
        setPassBanner({ name: nextP.name, phaseLabel: "COIN" });
        scrollToTop();
        return;
      }
      finalizeHacksAndResolve(nextHacks, players);
      return;
    }
    finalizeHacksAndResolve(hackChoices, players);
  }

  function finalizeHacksAndResolve(humanHacksSoFar, playersBase) {
    const endgame = isLastFiveTurns(turn, totalTurns);
    let rescuedPlayers = (playersBase || players).map((p) => ({ ...p, cards: { ...(p.cards || {}) }, history: [...(p.history || [])] }));

    // 人間の COIN 補充を適用
    rescuedPlayers = rescuedPlayers.map((p) => {
      if (p.isBankrupt || p.isAI) return p;
      const hk = humanHacksSoFar[p.id] || {};
      const choice = hk.coinRescue || "";
      if (!choice || endgame) return p;
      const st = p.cards.stock != null ? p.cards.stock : 0;
      if (choice === "zero10" && st !== 0) return p;
      if (choice === "half5" && st > 5) return p;
      if (st > 5) return p;
      const next = applyCoinRescue(p, choice, priceBefore);
      if (choice === "half5") pushLog("💱 " + p.name + " COIN補充: 総資産の50%と引き換えに COIN+5");
      if (choice === "zero10") pushLog("💱 " + p.name + " COIN補充: 総資産の75%と引き換えに COIN+10");
      return next;
    });

    // AI の COIN 補充
    rescuedPlayers = rescuedPlayers.map((p) => {
      if (p.isBankrupt || !p.isAI) return p;
      const st = p.cards.stock != null ? p.cards.stock : 0;
      if (endgame || st > 5) return p;
      const ord = orders[p.id] || { action: "stay", shares: 0 };
      let need = false;
      if (ord.action === "buy" && (ord.shares || 0) >= 1) {
        const priceHit = personalExecPrice(nStart, 0, 1, "buy");
        const req = (ord.shares || 0) * priceHit;
        const liq = (p.cash || 0) + (p.holdings || 0) * priceHit;
        need = req > liq + 1e-9;
      }
      const trading = (ord.action === "buy" || ord.action === "sell") && (ord.shares || 0) >= 1;
      let choice = "";
      if (st === 0) {
        if (need) choice = Math.random() < 0.9 ? "zero10" : (Math.random() < 0.5 ? "half5" : "");
        else if (trading) choice = Math.random() < 0.7 ? "zero10" : (Math.random() < 0.4 ? "half5" : "");
        else choice = Math.random() < 0.45 ? "zero10" : "";
      } else if (st <= 5) {
        if (need) choice = Math.random() < 0.85 ? "half5" : "";
        else if (trading) choice = Math.random() < 0.55 ? "half5" : "";
        else choice = Math.random() < 0.3 ? "half5" : "";
      }
      if (!choice) return p;
      const next = applyCoinRescue(p, choice, priceBefore);
      pushLog("💱 " + (p.name || p.id) + " がCOIN補充（" + coinRescueLabel(choice) + "）");
      return next;
    });

    const newHacks = { ...humanHacksSoFar };
    rescuedPlayers.forEach((p) => {
      if (newHacks[p.id] && !p.isAI) {
        // 人間は既に入力済み（coinRescue キーは settle に不要）
        const { coinRescue, ...rest } = newHacks[p.id];
        newHacks[p.id] = rest;
        return;
      }
      if (newHacks[p.id]) return;
      if (p.isBankrupt) {
        newHacks[p.id] = { quick: 0, heavy: 0, defense: 0, avant: 0 };
        return;
      }
      if (!p.isAI) {
        newHacks[p.id] = { quick: 0, heavy: 0, defense: 0, avant: 0 };
        return;
      }
      newHacks[p.id] = aiDecideCards(
        p.cards, turn, totalTurns, orders[p.id], nStart, priceBefore, orders, p.id, rescuedPlayers
      );
    });

    // 妨害の同時撃ちは少なめ
    const aiHeavy = rescuedPlayers.filter((p) => p.isAI && newHacks[p.id] && (newHacks[p.id].heavy || 0) > 0);
    const heavySlots = rescuedPlayers.length >= 5 ? 2 : 1;
    if (aiHeavy.length > heavySlots) {
      for (let i = aiHeavy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = aiHeavy[i]; aiHeavy[i] = aiHeavy[j]; aiHeavy[j] = tmp;
      }
      const keep = new Set(aiHeavy.slice(0, heavySlots).map((p) => p.id));
      aiHeavy.forEach((p) => {
        if (!keep.has(p.id)) newHacks[p.id] = { ...newHacks[p.id], heavy: 0 };
      });
    }

    // 奥義アバンギャルド重複解決
    {
      const avantUsers = rescuedPlayers.filter((p) => !p.isBankrupt && newHacks[p.id] && newHacks[p.id].avant);
      if (avantUsers.length > 1) {
        let winner = avantUsers[0];
        let winTv = totalValue(winner, priceBefore);
        avantUsers.forEach((p) => {
          const tv = totalValue(p, priceBefore);
          if (tv < winTv || (tv === winTv && String(p.id) < String(winner.id))) {
            winner = p;
            winTv = tv;
          }
        });
        avantUsers.forEach((p) => {
          if (p.id === winner.id) return;
          newHacks[p.id] = { ...newHacks[p.id], avant: 0, avantPrice: 0 };
          pushLog("💜 " + (p.name || p.id) + " の奥義アバンギャルドは重複により不成立（COIN返却）");
        });
        pushLog("💜 奥義アバンギャルド成立: " + (winner.name || winner.id) + "（株価 " + yenNum(newHacks[winner.id].avantPrice) + "円）");
      } else if (avantUsers.length === 1) {
        const w = avantUsers[0];
        pushLog("💜 奥義アバンギャルド: " + (w.name || w.id) + " が株価 " + yenNum(newHacks[w.id].avantPrice) + "円 を指定");
      }
    }
    setHackChoices(newHacks);
    setPassBanner(null);
    resolveTurn(newHacks, rescuedPlayers);
  }

  function finalizeOnlineHacks(pending) {
    if (!isHostRef.current) return;
    // pending を humanHacksSoFar として既存 finalize を利用
    finalizeHacksAndResolve(pending, stateRef.current.players);
    // resolveTurn 内で setPhase reveal されるので、その後スナップショット
    setTimeout(() => {
      broadcastSnapshotFrom({
        phase: stateRef.current.phase,
        players: stateRef.current.players,
        revealData: stateRef.current.revealData,
        revealFocusId: stateRef.current.revealFocusId,
        priceHistory: stateRef.current.priceHistory,
        log: stateRef.current.log,
        orders: stateRef.current.orders,
        hackChoices: stateRef.current.hackChoices,
        pendingOrders: {},
        pendingHacks: {},
        submittedOrderIds: [],
        submittedHackIds: [],
        turn: stateRef.current.turn,
        currentN: stateRef.current.currentN,
        screen: stateRef.current.screen,
      });
      setISubmittedOrder(false);
      setISubmittedHack(false);
      setPendingOrders({});
      setPendingHacks({});
      setSubmittedOrderIds([]);
      setSubmittedHackIds([]);
    }, 80);
  }

  function resolveTurn(hacks, playersOverride) {
    const st = stateRef.current || {};
    const basePlayers = playersOverride || st.players || players;
    const nStartR = ensureBaseN(st.currentN != null ? st.currentN : currentN);
    const priceBeforeR = sopf(nStartR);
    const ordersR = (st.orders && Object.keys(st.orders).length) ? st.orders : (orders || {});
    const turnR = st.turn != null ? st.turn : turn;
    // 清算直前に stateRef も同期
    stateRef.current = { ...st, currentN: nStartR, orders: ordersR };
    const { updated, execResults, priceMap, nMap } = settleTurn(
      basePlayers, ordersR, hacks, nStartR, priceBeforeR
    );

    const totalQuick = basePlayers.reduce((s, p) => s + (hacks[p.id]?.quick || 0), 0);
    const totalHeavy = basePlayers.reduce((s, p) => s + (hacks[p.id]?.heavy || 0), 0);

    const cardLines = basePlayers.map((p) => {
      const h = hacks[p.id];
      const parts = [];
      if (h?.quick > 0) parts.push(`⚡操作×${h.quick}`);
      if ((h?.heavy || 0) > 0) parts.push("💥妨害×" + h.heavy);
      if (h?.defense) parts.push("🛡防衛");
      if (h?.avant) parts.push("◆奥義");
      if (!parts.length) return null;
      return `${p.name}が${parts.join(" ")}を投入`;
    }).filter(Boolean);

    const orderLines = basePlayers.map((p) => {
      const ex = execResults[p.id];
      if (!ex) return null;
      if (ex.bankrupt) return `${p.name}: 破産`;
      if (ex.action === "buy" && ex.sharesFilled > 0) {
        return `${p.name}: 買い ${ex.sharesFilled}株 @ ${yenNum(ex.execPrice)}円 (操作+${ex.ownQuick}/被妨害${ex.incomingHeavy})${ex.note ? "("+ex.note+")" : ""}`;
      }
      if (ex.action === "sell" && ex.sharesFilled > 0) {
        return `${p.name}: 売り ${ex.sharesFilled}株 @ ${yenNum(ex.execPrice)}円 (操作+${ex.ownQuick}/被妨害${ex.incomingHeavy})${ex.note ? "("+ex.note+")" : ""}`;
      }
      if (ex.note) return `${p.name}: ${ex.note}`;
      return `${p.name}: 様子見`;
    }).filter(Boolean);

    pushLog(`── TERN${turnR} ── 仮株価 ${yenNum(priceBeforeR)}円 / 個人株価制`);
    cardLines.forEach((l) => pushLog("  " + l));
    orderLines.forEach((l) => pushLog("  " + l));

    // チャート用: 最初の人間（または生存人間）の株価を記録
    // 自分の清算を先に表示（ONLINE は myPlayerId、LOCAL は人間プレイヤー）
    const focusId = (
      myPlayerIdRef.current
      || (primaryHuman(basePlayers) || humanPlayersOf(basePlayers)[0] || basePlayers[0]).id
    );
    const focusPrice = priceMap[focusId] != null ? priceMap[focusId] : sopf(nStartR);

    const perHuman = {};
    humanPlayersOf(basePlayers).forEach((hb) => {
      const ha = updated.find((u) => u.id === hb.id) || hb;
      const hp = priceMap[hb.id] != null ? priceMap[hb.id] : sopf(nStartR);
      const vb = totalValue(hb, priceBeforeR);
      const va = ha.isBankrupt ? 0 : totalValue(ha, hp);
      perHuman[hb.id] = {
        id: hb.id,
        name: hb.name,
        nFinal: nMap[hb.id] || nStartR,
        priceFinal: hp,
        humanOrder: ordersR[hb.id] || { action: "stay", shares: 0 },
        humanExec: execResults[hb.id],
        humanCashBefore: hb.cash,
        humanCashAfter: ha.cash,
        humanHoldingsBefore: hb.holdings,
        humanHoldingsAfter: ha.holdings,
        humanAvgPriceAfter: ha.avgPrice,
        humanValueBefore: vb,
        humanValueAfter: va,
        humanDiff: va - vb,
        humanBankrupt: !!ha.isBankrupt,
      };
    });

    const focusReveal = perHuman[focusId] || Object.values(perHuman)[0];

    setPlayers(updated);
    setPriceHistory((h) => [...h, { turn: turnR, price: focusPrice, nFinal: (focusReveal && focusReveal.nFinal) || nStartR }]);
    setRevealFocusId(focusId);
    setRevealData({
      nStart: nStartR,
      nFinal: focusReveal ? focusReveal.nFinal : nStartR,
      priceBefore: priceBeforeR,
      priceFinal: focusReveal ? focusReveal.priceFinal : focusPrice,
      totalQuick,
      totalHeavy,
      refPrice,
      humanOrder: focusReveal ? focusReveal.humanOrder : { action: "stay", shares: 0 },
      humanExec: focusReveal ? focusReveal.humanExec : null,
      priceMap,
      execResults,
      humanCashBefore: focusReveal ? focusReveal.humanCashBefore : 0,
      humanCashAfter: focusReveal ? focusReveal.humanCashAfter : 0,
      humanHoldingsBefore: focusReveal ? focusReveal.humanHoldingsBefore : 0,
      humanHoldingsAfter: focusReveal ? focusReveal.humanHoldingsAfter : 0,
      humanAvgPriceAfter: focusReveal ? focusReveal.humanAvgPriceAfter : 0,
      humanValueBefore: focusReveal ? focusReveal.humanValueBefore : 0,
      humanValueAfter: focusReveal ? focusReveal.humanValueAfter : 0,
      humanDiff: focusReveal ? focusReveal.humanDiff : 0,
      humanBankrupt: focusReveal ? focusReveal.humanBankrupt : false,
      perHuman,
      focusId,
    });
    setPhase("reveal");
  }

  function nextTurn() {
    if (playMode === "online" && onlineRole === "guest") {
      // ゲストはホストの進行を待つ（ホストが next したスナップショット）
      return;
    }
    const humans = humanPlayersOf(players);
    // 人間が全員破産したら残りを自動進行
    if (humans.length > 0 && humans.every((p) => p.isBankrupt)) {
      autoFinishAfterHumanBankrupt();
      return;
    }
    // 生存者が1人以下（人間含む）なら終了
    const alive = players.filter((p) => !p.isBankrupt);
    if (alive.length <= 1) {
      setScreen("over");
      return;
    }
    // CPUが全員破産かつ人間が残っていれば結果へ（対人のみの場合は続行）
    const cpus = players.filter((p) => p.isAI);
    if (cpus.length > 0 && cpus.every((p) => p.isBankrupt) && humans.every((p) => !p.isBankrupt || humans.filter(h=>!h.isBankrupt).length<=1)) {
      const aliveH = humans.filter((p) => !p.isBankrupt);
      if (aliveH.length <= 1) {
        setScreen("over");
        if (playMode === "online" && onlineRole === "host") {
          setTimeout(() => broadcastSnapshotFrom({ screen: "over", players: stateRef.current.players, phase: "reveal" }), 50);
        }
        return;
      }
    }
    if (turn >= totalTurns) {
      setScreen("over");
      if (playMode === "online" && onlineRole === "host") {
        setTimeout(() => broadcastSnapshotFrom({ screen: "over", players: stateRef.current.players, phase: "reveal" }), 50);
      }
      return;
    }
    const next = turn + 1;
    // ラスト5TERN突入時、破産していない生存者にCOIN5枚追加（終盤盛り上げ）
    if (isLastFiveTurns(next, totalTurns) && !isLastFiveTurns(turn, totalTurns)) {
      setPlayers((prev) =>
        prev.map((p) => {
          if (p.isBankrupt) return p;
          const stock = p.cards && p.cards.stock != null ? p.cards.stock : 0;
          return {
            ...p,
            cards: { ...p.cards, stock: stock + 5 },
          };
        })
      );
      const bonusText = "ラスト5TERN・ボーナス：COINが5枚配られました";
      setEndgameBonusMsg(bonusText);
      pushLog("🎁 " + bonusText);
    }
    setTurn(next);
    const cnNext = randBase();
    setCurrentN(cnNext);
    stateRef.current = { ...stateRef.current, turn: next, currentN: cnNext, phase: "market" };
    setPhase("market");
    setHumanOrderDraft({ action: "stay", shares: 0 });
    setHumanHackDraft({ quick: 0, heavy: 0, defense: 0, avant: 0, avantPrice: 1000, coinRescue: "" });
    setOrders({});
    setHackChoices({});
    setRevealData(null);
    setRevealFocusId(null);
    setInputHumanIdx(0);
    setPassBanner(null);
    setISubmittedOrder(false);
    setISubmittedHack(false);
    setPendingOrders({});
    setPendingHacks({});
    setSubmittedOrderIds([]);
    setSubmittedHackIds([]);
    if (playMode === "online" && onlineRole === "host") {
      setTimeout(() => {
        broadcastSnapshotFrom({
          screen: stateRef.current.screen,
          phase: stateRef.current.phase,
          turn: stateRef.current.turn,
          currentN: stateRef.current.currentN,
          players: stateRef.current.players,
          priceHistory: stateRef.current.priceHistory,
          log: stateRef.current.log,
          orders: {},
          hackChoices: {},
          revealData: null,
          endgameBonusMsg: stateRef.current.endgameBonusMsg,
          pendingOrders: {},
          pendingHacks: {},
          submittedOrderIds: [],
          submittedHackIds: [],
        });
      }, 60);
    }
  }

  /** 人間破産後、残りTERNをCPUだけで進めて結果画面へ */
  function autoFinishAfterHumanBankrupt() {
    let pls = players.map((p) => ({ ...p, cards: { ...p.cards }, history: [...(p.history || [])] }));
    let t = turn;
    let hist = priceHistory.slice();
    let lastPrice = hist.length ? hist[hist.length - 1].price : sopf(nStart);

    while (t < totalTurns) {
      t += 1;
      const ns = randBase();
      const pb = sopf(ns);
      const ref = lastPrice || pb;
      const ords = {};
      pls.forEach((p) => {
        if (p.isBankrupt) {
          ords[p.id] = { action: "stay", shares: 0 };
        } else if (p.isAI) {
          const refH = primaryHuman(pls);
          ords[p.id] = clampOrder(aiDecideTrade(Math.random(), ns, pb, p.cash, p.holdings, ref, {
            turn: t,
            totalTurns: totalTurns,
            human: refH,
          }), p.cash, p.holdings, pb, t, totalTurns);
        } else {
          ords[p.id] = { action: "stay", shares: 0 };
        }
      });
      const hks = {};
      pls.forEach((p) => {
        if (p.isBankrupt || !p.isAI) {
          hks[p.id] = { quick: 0, heavy: 0, defense: 0 };
        } else {
          hks[p.id] = aiDecideCards(p.cards, t, totalTurns, ords[p.id], ns, pb, ords, p.id, pls);
        }
      });
      // CPU妨害の同一TERN重複は少なめ（基本1体、5人戦のみ最大2体）
      const aiHeavy = pls.filter((p) => p.isAI && (hks[p.id]?.heavy || 0) > 0);
      const heavySlots = pls.length >= 5 ? 2 : 1;
      if (aiHeavy.length > heavySlots) {
        for (let i = aiHeavy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const tmp = aiHeavy[i]; aiHeavy[i] = aiHeavy[j]; aiHeavy[j] = tmp;
        }
        const keep = new Set(aiHeavy.slice(0, heavySlots).map((p) => p.id));
        aiHeavy.forEach((p) => {
          if (!keep.has(p.id)) hks[p.id] = { quick: hks[p.id].quick || 0, heavy: 0, defense: hks[p.id].defense || 0 };
        });
      }
      const settled = settleTurn(pls, ords, hks, ns, pb);
      pls = settled.updated;
      const fid = (primaryHuman(pls) || humanPlayersOf(pls)[0] || pls[0] || {}).id;
      const hp = (fid && settled.priceMap[fid] != null) ? settled.priceMap[fid] : pb;
      lastPrice = hp;
      hist.push({ turn: t, price: hp, nFinal: (fid && settled.nMap[fid]) || ns });
    }

    setPlayers(pls);
    setPriceHistory(hist);
    setTurn(totalTurns);
    setRevealData(null);
    setPhase("market");
    setScreen("over");
  }

  function quitToTop() {
    setShowQuitConfirm(true);
  }

  function confirmQuit() {
    setShowQuitConfirm(false);
    if (playMode === "online") {
      leaveOnline();
      return;
    }
    setScreen("setup");
  }

  function cancelQuit() {
    setShowQuitConfirm(false);
  }

  const allHumans = humanPlayersOf(players);
  const human = (playMode === "online" && myPlayerId
    ? players.find((p) => p.id === myPlayerId)
    : null) || primaryHuman(players) || allHumans[0];
  // 注文/ハック入力中の対象プレイヤー
  const ahForInput = aliveHumans(players);
  const activeHuman = playMode === "online"
    ? human
    : ((phase === "order" || phase === "hack") && ahForInput[inputHumanIdx]
      ? ahForInput[inputHumanIdx]
      : human);
  // 現在の(未確定)株価を使って評価額を出す。ゲーム中は仮株価、ゲーム終了後は最終確定株価。
  const currentPriceForValue =
    screen === "over"
      ? (priceHistory.length > 0 ? priceHistory[priceHistory.length - 1].price : basePrice)
      : priceBefore;
  const ranked = useMemo(
    () => [...players].sort((a, b) => totalValue(b, currentPriceForValue) - totalValue(a, currentPriceForValue)),
    [players, currentPriceForValue]
  );

  return (
    <div className="ft-root" ref={topRef}>
      <style>{CSS}</style>
      {screen === "setup" && (
        <SetupScreen
          playerCount={playerCount}
          setPlayerCount={setPlayerCount}
          humanCount={humanCount}
          setHumanCount={setHumanCount}
          humanNames={humanNames}
          setHumanNames={setHumanNames}
          seriousMode={seriousMode}
          setSeriousMode={setSeriousMode}
          onStart={startGame}
          playMode={playMode}
          setPlayMode={setPlayMode}
          myName={myName}
          setMyName={setMyName}
          joinCodeInput={joinCodeInput}
          setJoinCodeInput={setJoinCodeInput}
          netStatus={netStatus}
          onCreateRoom={createOnlineRoom}
          onJoinRoom={joinOnlineRoom}
        />
      )}

      {screen === "lobby" && (
        <div className="ft-setup">
          <div className="ft-setup-card">
            <div className="ft-eyebrow">ONLINE LOBBY</div>
            <h1 className="ft-title">部屋 <span className="ft-title-accent">{roomCode}</span></h1>
            <p style={{ fontSize: 13, opacity: 0.8, lineHeight: 1.7 }}>
              {onlineRole === "host"
                ? "この部屋コードを他のプレイヤーに伝えてください。PeerJS（WebRTC）で接続します。"
                : "ホストの開始を待っています…"}
            </p>
            <div style={{ margin: "14px 0", padding: 12, background: "var(--ft-panel-alt)", border: "1px solid var(--ft-border)", borderRadius: 4 }}>
              <div style={{ fontSize: 11, letterSpacing: 1, opacity: 0.6, marginBottom: 8 }}>参加者</div>
              {(lobbyList.length ? lobbyList : [{ id: "me", name: myName, isHost: onlineRole === "host" }]).map((p) => (
                <div key={p.id} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: "1px dashed var(--ft-border)", fontSize: 13 }}>

    setPlayerCount(n);
    const nextHc = Math.min(hc, n);
    setHumanCount(nextHc);
    setHumanNames((prev) => {
      const arr = [];
      for (let i = 0; i < nextHc; i++) {
        arr.push((prev && prev[i]) || (nextHc === 1 ? "YOU" : ("P" + (i + 1))));
      }
      return arr;
    });

  function changeHumanCount(n) {
    const v = Math.max(1, Math.min(playerCount, n));
    setHumanCount(v);

      const arr = [];
      for (let i = 0; i < v; i++) {
