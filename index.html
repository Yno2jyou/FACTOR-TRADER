              </span>
            </div>
            <div className="ft-hack-stepper">
              <button
                type="button"
                className={"ft-defense-toggle" + (humanHackDraft.defense ? " is-on" : "")}
                disabled={turn <= 3 || isProtectOnCooldown(human, turn) || (!humanHackDraft.defense && (humanHackDraft.quick || 0) + ((humanHackDraft.heavy || 0) > 0 ? 5 : 0) + 5 > (human.cards.stock || 0))}
                onClick={() =>
                  setHumanHackDraft((d) => {
                    if (turn <= 3 || isProtectOnCooldown(human, turn)) return d;
                    if (d.avant || d.avantSab) return d;
                    if (d.defense) return { ...d, defense: 0 };
                    const stock = human.cards.stock || 0;
                    if ((d.quick || 0) + ((d.heavy || 0) > 0 ? 5 : 0) + 5 + ((d.avant || d.avantSab) ? 10 : 0) > stock) return d;
                    return { ...d, defense: 1, reflect: 0 };
                  })
                }
              >{turn <= 3 || isProtectOnCooldown(human, turn) ? "不可" : (humanHackDraft.defense ? "ON" : "OFF")}</button>
            </div>
          </div>
          <div className="ft-hack-row">
            <div className="ft-hack-label">
              <Reflect size={16} className="icon-reflect" /> 反射
              <span style={{fontSize:"11px", opacity:0.7, marginLeft:8}}>
                {turn <= 3
                  ? "最初の3TERNは使用不可"
                  : (isProtectOnCooldown(human, turn)
                    ? "前TERNに防衛/反射使用のため不可"
                    : "妨害の効果を相手に反射")}
              </span>
            </div>
            <div className="ft-hack-stepper">
              <button
                type="button"
                className={"ft-defense-toggle" + (humanHackDraft.reflect ? " is-reflect-on" : "")}
                disabled={turn <= 3 || isProtectOnCooldown(human, turn) || (!humanHackDraft.reflect && (humanHackDraft.quick || 0) + ((humanHackDraft.heavy || 0) > 0 ? 5 : 0) + (humanHackDraft.defense ? 5 : 0) + 5 + ((humanHackDraft.avant || humanHackDraft.avantSab) ? 10 : 0) > (human.cards.stock || 0))}
                onClick={() =>
                  setHumanHackDraft((d) => {
                    if (turn <= 3 || isProtectOnCooldown(human, turn)) return d;
                    if (d.avant || d.avantSab) return d;
                    if (d.reflect) return { ...d, reflect: 0 };
                    const stock = human.cards.stock || 0;
                    if ((d.quick || 0) + ((d.heavy || 0) > 0 ? 5 : 0) + (d.defense ? 5 : 0) + 5 + ((d.avant || d.avantSab) ? 10 : 0) > stock) return d;
                    // 反射ON時は防衛をオフ（同時不可・防衛優先のためUI側でも排他）
                    return { ...d, reflect: 1, defense: 0 };
                  })
                }
              >{turn <= 3 || isProtectOnCooldown(human, turn) ? "不可" : (humanHackDraft.reflect ? "ON" : "OFF")}</button>
            </div>
          </div>
          <div className={"ft-hack-row is-avant" + (humanHackDraft.avant ? " is-on" : "")}>
            <div className="ft-hack-label">
              <Heptagram size={16} className="icon-avant" style={{marginRight:4}} />
              <span style={{color:"var(--ft-purple)", fontWeight:600}}>奥義：AVANT-GARDE-操作</span>
              {!humanHackDraft.avant ? (
                <span style={{fontSize:"11px", opacity:0.7, marginLeft:8}}>自分の株価指定</span>
              ) : null}
            </div>
            <div className="ft-hack-stepper" style={{display:"flex", alignItems:"center", gap:8}}>
              {!!humanHackDraft.avant && (
                <input
                  type="number"
                  className="ft-avant-price-input"
                  min={1}
                  max={99999}
                  value={humanHackDraft.avantPrice || 1000}
                  onChange={(e) => {
                    let v = parseInt(e.target.value, 10);
                    if (isNaN(v)) v = 1;
                    v = Math.max(1, Math.min(99999, v));
                    setHumanHackDraft((d) => ({ ...d, avantPrice: v }));
                  }}
                />
              )}
              <button
                type="button"
                className={"ft-defense-toggle" + (humanHackDraft.avant ? " is-avant-on" : "")}
                disabled={!!human.avantUsed || (!humanHackDraft.avant && (human.cards.stock || 0) < 10)}
                onClick={() =>
                  setHumanHackDraft((d) => {
                    if (human.avantUsed) return d;
                    if (d.avant) return { ...d, avant: 0 };
                    if ((human.cards.stock || 0) < 10) return d;
                    // 奥義（操作）ON: 奥義（妨害）・操作・妨害・防衛をクリア
                    return { ...d, avant: 1, avantSab: 0, quick: 0, heavy: 0, defense: 0, reflect: 0, avantPrice: d.avantPrice || 1000 };
                  })
                }
              >{human.avantUsed ? "済" : (humanHackDraft.avant ? "ON" : "OFF")}</button>
            </div>
          </div>
          <div className={"ft-hack-row is-avant" + (humanHackDraft.avantSab ? " is-on" : "")}>
            <div className="ft-hack-label">
              <Heptagram size={16} className="icon-avant" style={{marginRight:4}} />
              <span style={{color:"var(--ft-purple)", fontWeight:600}}>奥義：AVANT-GARDE-妨害</span>
              {!humanHackDraft.avantSab ? (
                <span style={{fontSize:"11px", opacity:0.7, marginLeft:8}}>
                  {turn <= 3 ? "最初の3TERNは使用不可" : "自分以外の株価指定"}
                </span>
              ) : null}
            </div>
            <div className="ft-hack-stepper" style={{display:"flex", alignItems:"center", gap:8}}>
              {!!humanHackDraft.avantSab && turn > 3 && (
                <input
                  type="number"
                  className="ft-avant-price-input"
                  min={1}
                  max={99999}
                  value={humanHackDraft.avantPrice || 1000}
                  onChange={(e) => {
                    let v = parseInt(e.target.value, 10);
                    if (isNaN(v)) v = 1;
                    v = Math.max(1, Math.min(99999, v));
                    setHumanHackDraft((d) => ({ ...d, avantPrice: v }));
                  }}
                />
              )}
              <button
                type="button"
                className={"ft-defense-toggle" + (humanHackDraft.avantSab ? " is-avant-on" : "")}
                disabled={turn <= 3 || !!human.avantUsed || (!humanHackDraft.avantSab && (human.cards.stock || 0) < 10)}
                onClick={() =>
                  setHumanHackDraft((d) => {
                    if (turn <= 3) return d;
                    if (human.avantUsed) return d;
                    if (d.avantSab) return { ...d, avantSab: 0 };
                    if ((human.cards.stock || 0) < 10) return d;
                    // 奥義（妨害）ON: 奥義（操作）・操作・妨害・防衛をクリア
                    return { ...d, avantSab: 1, avant: 0, quick: 0, heavy: 0, defense: 0, reflect: 0, avantPrice: d.avantPrice || 1000 };
                  })
                }
              >{turn <= 3 ? "不可" : (human.avantUsed ? "済" : (humanHackDraft.avantSab ? "ON" : "OFF"))}</button>
            </div>
          </div>
        </div>
        {((humanHackDraft.quick > 0 || humanHackDraft.heavy > 0 || !!humanHackDraft.defense || !!humanHackDraft.reflect || !!humanHackDraft.avant || !!humanHackDraft.avantSab)) ? (() => {
          const order = humanOrderDraft || { action: "stay" };
          const act = order.action === "stay" ? "buy" : order.action;
          const selfPrice = personalExecPrice(nStart, humanHackDraft.quick, 0, act);
          const baseP = personalExecPrice(nStart, 0, 0, act);
          const buy0 = personalExecPrice(nStart, 0, 0, "buy");
          const buy1 = personalExecPrice(nStart, 0, 1, "buy");
          const sell0 = personalExecPrice(nStart, 0, 0, "sell");
          const sell1 = personalExecPrice(nStart, 0, 1, "sell");
          return (
            <div className="ft-private-box">
              <div className="ft-private-head">📊 効果</div>
              <p className="ft-private-desc" style={{ lineHeight: 1.85 }}>
                {humanHackDraft.avant ? (() => {
                  const ap = Math.max(1, Math.min(99999, Math.floor(Number(humanHackDraft.avantPrice) || 1)));
                  const ord = humanOrderDraft || { action: "stay", shares: 0 };
                  const sh = Math.max(0, Math.floor(ord.shares || 0));
                  const cash0 = human.cash || 0;
                  const hold0 = human.holdings || 0;
                  const tv0 = cash0 + hold0 * (priceBefore || 0);
                  let cash1 = cash0;
                  let hold1 = hold0;
                  let tradeNote = "注文なし（様子見）";
                  if (ord.action === "buy" && sh > 0) {
                    const cost = sh * ap;
                    cash1 = cash0 - cost;
                    hold1 = hold0 + sh;
                    tradeNote = `買い ${sh}株 × ${ap}円 = ${cost.toLocaleString()}円`;
                  } else if (ord.action === "sell" && sh > 0) {
                    const got = sh * ap;
                    cash1 = cash0 + got;
                    hold1 = hold0 - sh;
                    tradeNote = `売り ${sh}株 × ${ap}円 = ${got.toLocaleString()}円`;
                  }
                  const tv1 = cash1 + hold1 * ap;
                  const dTv = tv1 - tv0;
                  const dSign = dTv > 0 ? "+" : "";
                  return (
                    <span style={{ display: "block" }}>
                      <b style={{ color: "var(--ft-purple)" }}>奥義：AVANT-GARDE-操作</b>
                      <span style={{ opacity: 0.85 }}>（COIN10枚・一度限り／自分の株価のみ／被妨害無効）</span>
                      <br />
                      指定する自分の株価 <b style={{ color: "var(--ft-purple)" }}>{ap.toLocaleString()}円</b>
                      <br />
                      {tradeNote}
                      <br />
                      保有株 <b>{sharesFmt(hold0)}株 → {sharesFmt(hold1)}株</b>
                      <br />
                      現金 <b>{cash0.toLocaleString()}円 → {cash1.toLocaleString()}円</b>
                      <br />
                      総資産（評価） <b>{tv0.toLocaleString()}円 → {tv1.toLocaleString()}円</b>
                      <span style={{ color: dTv >= 0 ? "var(--ft-accent)" : "var(--ft-red)", marginLeft: 6 }}>
                        ({dSign}{dTv.toLocaleString()}円)
                      </span>
                      <br />
                      <span style={{ opacity: 0.75, fontSize: 12 }}>※奥義が重複した場合、総資産が少ない側が優先（多い側はCOIN返却）</span>
                    </span>
                  );
                })() : null}
                {humanHackDraft.avantSab ? (() => {
                  const ap = Math.max(1, Math.min(99999, Math.floor(Number(humanHackDraft.avantPrice) || 1)));
                  return (
                    <span style={{ display: "block" }}>
                      <b style={{ color: "var(--ft-purple)" }}>奥義：AVANT-GARDE-妨害</b>
                      <span style={{ opacity: 0.85 }}>（COIN10枚・一度限り／自分以外の株価指定）</span>
                      <br />
                      自分以外の株価を <b style={{ color: "var(--ft-purple)" }}>{ap.toLocaleString()}円</b> に強制（1〜99999円）
                      <br />
                      自分の株価は通常計算（操作・通常妨害の対象）
                      <br />
                      <span style={{ opacity: 0.75, fontSize: 12 }}>※相手の防衛で無効化されます。奥義が重複した場合は総資産が少ない側が優先されます。</span>
                    </span>
                  );
                })() : null}
                {!humanHackDraft.avant && !humanHackDraft.avantSab && humanHackDraft.quick > 0 ? (
                  <span style={{ display: "block", marginBottom: 8 }}>
                    <b style={{ color: "var(--ft-blue)" }}>操作</b>：自分の株価を操作（被妨害時は無効）<br />
                    あなたの株価目安 <b>{yenNum(selfPrice)}円</b>
                    {baseP !== selfPrice ? `（操作前 ${yenNum(baseP)}円）` : ""}
                    <br />
                    自分のみ作用。
                  </span>
                ) : null}
                {!humanHackDraft.avant && !humanHackDraft.avantSab && humanHackDraft.heavy > 0 ? (
                  <span style={{ display: "block", marginBottom: 8 }}>
                    <b style={{ color: "var(--ft-red)" }}>妨害</b>：自分以外の株価を妨害（N+1）<br />
                    自分には無効、他プレイヤーと重複する可能性あり<br />
                    買い：<b>{yenNum(buy0)}円→{yenNum(personalExecPrice(nStart, 0, humanHackDraft.heavy, "buy"))}円</b>
                    <br />
                    売り：<b>{yenNum(sell0)}円→{yenNum(personalExecPrice(nStart, 0, humanHackDraft.heavy, "sell"))}円</b>
                  </span>
                ) : null}
                {!humanHackDraft.avant && !humanHackDraft.avantSab && humanHackDraft.defense ? (
                  <span style={{ display: "block" }}>
                    <b style={{ color: "var(--ft-amber)" }}>防衛</b>：相手からの妨害・反射・AVANT-GARDE-妨害を無効化<br />
                    COIN5枚
                  </span>
                ) : null}
                {!humanHackDraft.avant && !humanHackDraft.avantSab && humanHackDraft.reflect ? (
                  <span style={{ display: "block" }}>
                    <b style={{ color: "var(--ft-text)" }}>反射</b>：妨害の効果を相手に反射<br />
                    COIN5枚
                  </span>
                ) : null}
              </p>
            </div>
          );
        })() : null}
        {multiHuman ? (
          <div style={{ fontSize: 12, marginBottom: 10, color: "var(--ft-amber)" }}>
            {human.name} の市場HACK（{inputHumanIdx + 1}/{humanInputTotal}）
          </div>
        ) : null}
        {isOnline ? (
          <div style={{ fontSize: 12, marginBottom: 10, color: "var(--ft-amber)" }}>
            提出状況 {hackWaitCount}/{aliveHumanIds.length}
            {onlineWaitingHack ? " — 他のプレイヤーを待っています…" : ""}
          </div>
        ) : null}
        {onlineWaitingHack ? (
          <div className="ft-primary-btn danger" style={{ opacity: 0.5, pointerEvents: "none", textAlign: "center" }}>
            提出済み（待機中）
          </div>
        ) : (
          <button className="ft-primary-btn danger" onClick={onConfirmHacks}>
            {multiHuman && !isLastHumanInput
              ? human.name + " のCOINを確定 → 次のプレイヤーへ ▶"
              : isOnline
              ? "COINを提出 ▶"
              : "COINをセットして開示 ▶"}
          </button>
        )}
      </div>
    );
  }

  if (phase === "reveal" && revealData) {
    const per = revealData.perHuman || {};
    const focusId = revealFocusId || (human && human.id) || revealData.focusId;
    const focused = (focusId && per[focusId]) || null;
    const view = focused || {
      humanOrder: revealData.humanOrder,
      humanExec: revealData.humanExec,
      nFinal: revealData.nFinal,
      priceFinal: revealData.priceFinal,
      humanCashBefore: revealData.humanCashBefore,
      humanCashAfter: revealData.humanCashAfter,
      humanHoldingsBefore: revealData.humanHoldingsBefore,
      humanHoldingsAfter: revealData.humanHoldingsAfter,
      humanAvgPriceAfter: revealData.humanAvgPriceAfter,
      humanValueBefore: revealData.humanValueBefore,
      humanValueAfter: revealData.humanValueAfter,
      humanDiff: revealData.humanDiff,
      humanBankrupt: revealData.humanBankrupt,
      name: human ? human.name : "YOU",
    };
    const hex = view.humanExec || {};
    const myQuick = hex.ownQuick || 0;
    const hitHeavy = hex.incomingHeavy || 0;
    const myDefense = !!hex.defense;
    const blockedHeavy = hex.blockedHeavy || 0;
    const usedHeavy = hex.usedHeavy || 0;
    const myAvant = !!hex.avant;
    const myAvantSab = !!hex.avantSab;
    // 自分を先頭に、全プレイヤーの清算タブ
    const selfId = (human && human.id) || null;
    const humanNamesList = Object.values(per).slice().sort((a, b) => {
      if (selfId && a.id === selfId) return -1;
      if (selfId && b.id === selfId) return 1;
      if (!a.isAI && b.isAI) return -1;
      if (a.isAI && !b.isAI) return 1;
      return 0;
    });
    return (
      <div className="ft-panel ft-action">
        <div className="ft-panel-head">STEP 4 — 清算結果{view.name ? "（" + view.name + "）" : ""}</div>
        {humanNamesList.length > 0 ? (
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 12 }}>
            {humanNamesList.map((h) => (
              <button
                key={h.id}
                type="button"
                onClick={() => setRevealFocusId && setRevealFocusId(h.id)}
                style={{
                  padding: "6px 10px",
                  fontSize: 11,
                  borderRadius: 3,
                  cursor: "pointer",
                  border: (focusId === h.id) ? "1px solid var(--ft-accent)" : "1px solid var(--ft-border)",
                  background: (focusId === h.id) ? "rgba(57,255,156,0.12)" : "var(--ft-panel-alt)",
                  color: (focusId === h.id) ? "var(--ft-accent)" : "var(--ft-text-dim)",
                }}
              >
                {h.name}{h.isAI ? "（CPU）" : ""}{h.humanBankrupt ? "（破産）" : ""}
              </button>
            ))}
          </div>
        ) : null}

        {view.humanBankrupt && (
          <div className="ft-bankrupt-banner">
            <div className="ft-bankrupt-title">破産</div>
            <div className="ft-bankrupt-desc">
              買付代金を支払えず破産しました（COIN10枚未満で帳消し不可）。以降のプレイはできません。
              残りTERNはCPUが自動進行し、最終結果を表示します。
            </div>
          </div>
        )}
        {!view.humanBankrupt && view.humanExec && view.humanExec.bailout && (
          <div className="ft-bailout-banner">
            <div className="ft-bailout-title">帳消し</div>
            <div className="ft-bailout-desc">
              COINを{view.humanExec.bailoutCards || 10}枚消費し、このTERNの買い注文をキャンセルして破産を回避しました。
            </div>
          </div>
        )}

        <div className="ft-card-banner">
          <div className="ft-card-banner-title">このTERNのCOIN</div>
          <div className="ft-card-banner-body">
            {myAvant && (
              <span className="ft-card-banner-chip" style={{ color: "var(--ft-purple)", background: "rgba(192,132,252,0.15)", border: "1px solid rgba(192,132,252,0.45)" }}>
                <Heptagram size={15} style={{ marginRight: 6, verticalAlign: "middle", flexShrink: 0 }} />
                奥義：AVANT-GARDE-操作
              </span>
            )}
            {!!hex.avantSab && (
              <span className="ft-card-banner-chip" style={{ color: "var(--ft-purple)", background: "rgba(192,132,252,0.15)", border: "1px solid rgba(192,132,252,0.45)" }}>
                <Heptagram size={15} style={{ marginRight: 6, verticalAlign: "middle", flexShrink: 0 }} />
                奥義：AVANT-GARDE-妨害
              </span>
            )}
            {!!hex.forcedBySab && (
              <span className="ft-card-banner-chip heavy">
                <Heptagram size={15} style={{ marginRight: 6, verticalAlign: "middle", flexShrink: 0 }} />
                AVANT-GARDE-妨害で株価固定
              </span>
            )}
            {myQuick > 0 && (() => {
              const nullified = !!hex.quickNullified;
              // 反射で被妨害を防いだ場合は操作有効を明記
              const reflectedAway = !!hex.reflect && (hex.reflectedOut || 0) > 0 && !nullified;
              let label = `操作 ×${myQuick}`;
              if (nullified) label = `操作 ×${myQuick} → 被妨害で無効`;
              else if (reflectedAway) label = `操作 ×${myQuick}（有効・反射で被妨害を回避）`;
              return (
                <span className={"ft-card-banner-chip " + (nullified ? "heavy" : "quick")}>
                  <Zap size={15} style={{ marginRight: 6, verticalAlign: "middle", flexShrink: 0 }} />
                  {label}
                </span>
              );
            })()}
            {/* 実際に受けた妨害のみ表示（反射で防いだ分は反射チップで分かるため非表示） */}
            {hitHeavy > 0 && (() => {
              const bounced = Math.max(0, Math.min(hitHeavy, hex.reflectedTo || 0));
              const direct = Math.max(0, hitHeavy - bounced);
              let detail = "";
              if (bounced > 0 && direct > 0) {
                detail = `（全体×${direct} + 反射×${bounced}）`;
              } else if (bounced > 0) {
                detail = `（反射×${bounced}）`;
              } else if (direct > 0) {
                detail = `（全体×${direct}）`;
              }
              return (
                <span className="ft-card-banner-chip heavy">
                  <Bomb size={15} style={{ marginRight: 6, verticalAlign: "middle", flexShrink: 0 }} />
                  妨害 ×{hitHeavy}{detail}
                </span>
              );
            })()}
            {myDefense ? (
              <span className="ft-card-banner-chip defense">
                <Shield size={15} style={{ marginRight: 6, verticalAlign: "middle", flexShrink: 0 }} />
                防衛{blockedHeavy > 0 ? `（妨害×${blockedHeavy}を無効化）` : ""}{hex.sabBlockedByDef ? "（AVANT-GARDE-妨害を無効化）" : (blockedHeavy <= 0 && !hex.sabBlockedByDef ? "（妨害なし）" : "")}
              </span>
            ) : null}
            {!!hex.reflect ? (
              <span className="ft-card-banner-chip reflect">
                <Reflect size={15} style={{ marginRight: 6, verticalAlign: "middle", flexShrink: 0 }} />
                反射{(hex.reflectedOut || 0) > 0 ? `（妨害×${hex.reflectedOut}を反射）` : ""}
              </span>
            ) : null}
            {!myDefense && !hex.reflect && hitHeavy <= 0 && !myAvant && !hex.avantSab && !hex.forcedBySab ? (
              <span className="ft-card-banner-chip none-hit">
                誰にも妨害されなかった
              </span>
            ) : null}
          </div>
          <div className="ft-card-banner-note">
            仮株価 {yenNum(revealData.priceBefore)}円 → 最終株価 <b>{yenNum(view.priceFinal)}円</b>
            {view.priceFinal > revealData.priceBefore
              ? `（+${view.priceFinal - revealData.priceBefore}円）`
              : view.priceFinal < revealData.priceBefore
              ? `（${view.priceFinal - revealData.priceBefore}円）`
              : ""}
          </div>
        </div>

        <div className="ft-reveal-box">
          <div className="ft-reveal-row">
            <span>N_start</span>
            <b>{revealData.nStart.toLocaleString()}</b>
          </div>
          {myQuick > 0 && (() => {
            const nullified = !!hex.quickNullified;
            const reflectedAway = !!hex.reflect && (hex.reflectedOut || 0) > 0 && !nullified;
            let detail = "";
            if (nullified) detail = "（被妨害で無効）";
            else if (reflectedAway) detail = "（有効・反射で被妨害を回避）";
            return (
              <div className={"ft-reveal-row " + (nullified ? "heavy" : "quick")}>
                <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>
                  <Zap size={14} className="icon-quick" /> 操作
                </span>
                <b>{nullified ? `+${myQuick}${detail}` : `+${myQuick}${detail}`}</b>
              </div>
            );
          })()}
          {/* 実際に適用された被妨害のみ。反射で防いだ分は行を出さない */}
          {hitHeavy > 0 && (() => {
            const bounced = Math.max(0, Math.min(hitHeavy, hex.reflectedTo || 0));
            const direct = Math.max(0, hitHeavy - bounced);
            let detail = "";
            if (bounced > 0 && direct > 0) detail = `（全体+${direct} / 反射+${bounced}）`;
            else if (bounced > 0) detail = `（反射+${bounced}）`;
            else if (direct > 0) detail = `（全体+${direct}）`;
            return (
              <div className="ft-reveal-row heavy">
                <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>
                  <Bomb size={14} className="icon-heavy" /> 妨害
                </span>
                <b>+{hitHeavy}{detail}</b>
              </div>
            );
          })()}
          {myDefense && (
            <div className="ft-reveal-row" style={{ color: "var(--ft-amber)" }}>
              <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>
                <Shield size={14} className="icon-defense" /> 防衛
              </span>
              <b>{blockedHeavy > 0 ? `妨害×${blockedHeavy}を無効化` : "妨害なし"}</b>
            </div>
          )}
          <div className="ft-reveal-row final">
            <span>あなたの N</span>
            <b>{view.nFinal.toLocaleString()}</b>
          </div>
          <div className="ft-reveal-row price">
            <span>あなたの株価</span>
            <b>{yenNum(view.priceFinal)}円</b>
            <span className="ft-factor-note">{factorString(view.nFinal)}</span>
          </div>
        </div>

        <div className="ft-panel-head" style={{ marginTop: 4 }}>あなたの株価結果</div>
        <div className="ft-reveal-box">
          <div className="ft-reveal-row">
            <span>注文</span>
            <b>
              {view.humanOrder.action === "buy"
                ? "買い"
                : view.humanOrder.action === "sell"
                ? "売り"
                : "様子見"}
              {view.humanOrder.action !== "stay" && ` ${sharesFmt(view.humanOrder.shares)}株`}
            </b>
          </div>
          {view.humanOrder.action !== "stay" && (
            <div className="ft-reveal-row">
              <span>株価株数 @ 最終株価</span>
              <b>
                {sharesFmt(view.humanExec.sharesFilled)}株 @ {yenNum(view.priceFinal)}円
                {view.humanExec.note && <span className="ft-factor-note"> {view.humanExec.note}</span>}
              </b>
            </div>
          )}
          <div className="ft-reveal-row">
            <span>現金</span>
            <b>{yen(view.humanCashBefore)} → {yen(view.humanCashAfter)}</b>
          </div>
          <div className="ft-reveal-row">
            <span>保有株</span>
            <b>
              {sharesFmt(view.humanHoldingsBefore)}株 → {sharesFmt(view.humanHoldingsAfter)}株
              {view.humanHoldingsAfter > 0 && ` (平均${view.humanAvgPriceAfter.toFixed(1)}円)`}
            </b>
          </div>
          <div className="ft-reveal-row">
            <span>総資産</span>
            <b>{yen(view.humanValueBefore)} → {yen(view.humanValueAfter)}</b>
          </div>
          <div className="ft-reveal-row final">
            <span>総資産の変動</span>
            <b className={view.humanDiff > 0 ? "pnl-up" : view.humanDiff < 0 ? "pnl-down" : ""}>
              {view.humanDiff === 0
                ? "±0"
                : view.humanDiff > 0
                ? `+${yen(view.humanDiff)}`
                : `-${yen(Math.abs(view.humanDiff))}`}
            </b>
          </div>
        </div>

        {isOnline && onlineRole === "guest" ? (
          <p className="ft-action-desc" style={{ color: "var(--ft-amber)" }}>ホストが次のTERNへ進めるまでお待ちください…</p>
        ) : (
          <button className="ft-primary-btn" onClick={onNextTurn}>
            {view.humanBankrupt || (players || []).filter((p) => p.isAI).every((p) => p.isBankrupt)
              ? "最終結果を見る ▶"
              : "次のTERNへ ▶"}
          </button>
        )}
      </div>
    );
  }

  return null;
}

/** ログ文字列内の [ICON:quick|heavy|defense|avant] を SVG アイコンに置換 */
function renderLogLine(text) {
  const s = String(text == null ? "" : text);
  const re = /\[ICON:(quick|heavy|defense|reflect|avant)\]/g;
  const nodes = [];
  let last = 0;
  let m;
  let key = 0;
  while ((m = re.exec(s)) !== null) {
    if (m.index > last) {
      nodes.push(s.slice(last, m.index));
    }
    const kind = m[1];
    const iconStyle = { display: "inline-block", verticalAlign: "middle", margin: "0 3px 0 1px", flexShrink: 0 };
    if (kind === "quick") {
      nodes.push(<Zap key={"i" + key++} size={12} className="icon-quick" style={iconStyle} />);
    } else if (kind === "heavy") {
      nodes.push(<Bomb key={"i" + key++} size={12} className="icon-heavy" style={iconStyle} />);
    } else if (kind === "defense") {
      nodes.push(<Shield key={"i" + key++} size={12} className="icon-defense" style={iconStyle} />);
    } else if (kind === "reflect") {
      nodes.push(<Reflect key={"i" + key++} size={12} className="icon-reflect" style={iconStyle} />);
    } else if (kind === "avant") {
      nodes.push(<Heptagram key={"i" + key++} size={12} className="icon-avant" style={iconStyle} />);
    }
    last = m.index + m[0].length;
  }
  if (last < s.length) nodes.push(s.slice(last));
  if (nodes.length === 0) return s;
  return nodes;
}

function TitlesModal({ titleSave, onClose, onEquip, canEquip }) {
  const unlocked = (titleSave && titleSave.unlocked) || {};
  const equippedList = normalizeEquipped(titleSave && titleSave.equipped);
  const equippedSet = {};
  equippedList.forEach((id) => { equippedSet[id] = true; });
  const avantTotal = Math.max(0, Number(titleSave && titleSave.avantTotal) || 0);
  const comebackTotal = Math.max(0, Number(titleSave && titleSave.comebackTotal) || 0);
  const coinRichTotal = Math.max(0, Number(titleSave && titleSave.coinRichTotal) || 0);
  const coinPoorTotal = Math.max(0, Number(titleSave && titleSave.coinPoorTotal) || 0);

  const GROUP_ORDER = {
    A: ["asset", "comeback"],
    B: ["bailout", "coin_rich", "coin_poor"],
    C: ["quick", "heavy", "defense", "reflect", "avant"],
  };
  const GROUP_LABELS = {
    asset: "資産",
    comeback: "逆転",
    bailout: "帳消し",
    coin_rich: "COIN温存",
    coin_poor: "COIN0",
    quick: "操作",
    heavy: "妨害",
    defense: "防衛",
    reflect: "反射",
    avant: "AVANT-GARDE",
  };

  const cats = [
    { key: "A", label: "A 取引・資産" },
    { key: "B", label: "B COIN" },
    { key: "C", label: "C 市場ハック" },
  ];

  function countUnlocked(list) {
    let n = 0;
    list.forEach((t) => { if (unlocked[t.id]) n++; });
    return n;
  }

  function progressPct(got, current, threshold) {
    if (got) return 100;
    if (threshold == null || threshold <= 0) return 0;
    const cur = Math.max(0, Number(current) || 0);
    return Math.min(100, Math.floor((cur / threshold) * 100));
  }

  /** 累計系のみ進捗値を表示。game系は解放済=100% / 未=0%（1ゲーム内条件のため） */
  function titleProgress(t) {
    const got = !!unlocked[t.id];
    if (got) return { pct: 100, label: "達成", current: null, threshold: t.threshold };
    if (t.kind !== "cumul" || t.threshold == null) {
      return { pct: 0, label: "未達成", current: null, threshold: t.threshold };
    }
    let current = 0;
    if (t.group === "avant") current = avantTotal;
    else if (t.group === "comeback") current = comebackTotal;
    else if (t.group === "coin_rich") current = coinRichTotal;
    else if (t.group === "coin_poor") current = coinPoorTotal;
    const pct = progressPct(false, current, t.threshold);
    return {
      pct,
      label: current + " / " + t.threshold,
      current,
      threshold: t.threshold,
    };
  }

  const totalAll = TITLE_DEFS.length;
  const unlockedAll = countUnlocked(TITLE_DEFS);
  const overallPct = totalAll > 0 ? Math.floor((unlockedAll / totalAll) * 100) : 0;

  return (
    <div className="ft-modal-overlay" onClick={onClose}>
      <div className="ft-modal-box ft-modal-box-wide" onClick={(e) => e.stopPropagation()}>
        <div className="ft-modal-title">称号一覧</div>
        <p className="ft-modal-desc" style={{ marginBottom: 10 }}>
          称号の獲得はLOCALのみ・最終1位が条件です。進捗はブラウザに保存されます。称号は最大3つまで装備でき、トレーダー名・トップバーにバッジ表示されます（現在 {equippedList.length}/{MAX_EQUIPPED_TITLES}）。
        </p>
        <div className="ft-title-progress-block" style={{ marginBottom: 14 }}>
          <div className="ft-title-progress-head">
            <span>全体進捗</span>
            <span className="ft-title-progress-pct">{unlockedAll}/{totalAll}（{overallPct}%）</span>
          </div>
          <div className="ft-title-progress-bar">
            <div className="ft-title-progress-fill" style={{ width: overallPct + "%" }} />
          </div>
        </div>
        <div className="ft-modal-scroll">
          {cats.map((c) => {
            const catTitles = TITLE_DEFS.filter((t) => t.cat === c.key);
            const catGot = countUnlocked(catTitles);
            const catPct = catTitles.length ? Math.floor((catGot / catTitles.length) * 100) : 0;
            const groups = GROUP_ORDER[c.key] || [];
            return (
              <div key={c.key} className="ft-rules-section">
                <div className="ft-rules-h" style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, flexWrap: "wrap" }}>
                  <span>{c.label}</span>
                  <span className="ft-title-cat-pct">{catGot}/{catTitles.length}（{catPct}%）</span>
                </div>
                <div className="ft-title-progress-bar ft-title-progress-bar-sm" style={{ marginBottom: 12 }}>
                  <div className="ft-title-progress-fill" style={{ width: catPct + "%" }} />
                </div>
                {groups.map((gKey) => {
                  const gTitles = catTitles.filter((t) => t.group === gKey);
                  if (!gTitles.length) return null;
                  const gGot = countUnlocked(gTitles);
                  const gPct = Math.floor((gGot / gTitles.length) * 100);
                  return (
                    <div key={gKey} className="ft-title-group">
                      <div className="ft-title-group-head">
                        <span className="ft-title-group-label">{GROUP_LABELS[gKey] || gKey}</span>
                        <span className="ft-title-group-pct">{gGot}/{gTitles.length}（{gPct}%）</span>
                      </div>
                      <div className="ft-title-progress-bar ft-title-progress-bar-xs" style={{ marginBottom: 8 }}>
                        <div className="ft-title-progress-fill is-group" style={{ width: gPct + "%" }} />
                      </div>
                      {gTitles.map((t) => {
                        const got = !!unlocked[t.id];
                        const isEq = !!equippedSet[t.id];
                        const prog = titleProgress(t);
                        return (
                          <div key={t.id} className={"ft-title-row" + (got ? " is-got" : "") + (isEq ? " is-eq" : "")}>
                            <div style={{ flexShrink: 0, opacity: got ? 1 : 0.25 }}>
                              <TitleBadge titleId={t.id} size={20} />
                            </div>
                            <div style={{ flex: 1, minWidth: 0 }}>
                              <div className={got && t.rank === "rainbow" ? "ft-rainbow-text" : undefined} style={{ fontSize: 13, fontWeight: 700, color: got ? (t.rank === "rainbow" ? undefined : (titleRankColor(t.rank) || "var(--ft-accent)")) : "var(--ft-text-dim)" }}>
                                {got ? t.name : "？？？"}
                                {isEq ? <span style={{ marginLeft: 8, fontSize: 10, color: "var(--ft-amber)" }}>装備中</span> : null}
                              </div>
                              <div style={{ fontSize: 11, color: "var(--ft-text-dim)", marginTop: 2 }}>{t.desc}</div>
                              <div className="ft-title-item-progress">
                                <div className="ft-title-progress-bar ft-title-progress-bar-item">
                                  <div
                                    className={"ft-title-progress-fill" + (got ? " is-done" : "")}
                                    style={{ width: prog.pct + "%" }}
                                  />
                                </div>
                                <span className="ft-title-item-pct">{prog.pct}%{prog.label && prog.label !== "達成" && prog.label !== "未達成" ? " · " + prog.label : (got ? " · 達成" : "")}</span>
                              </div>
                            </div>
                            {got && canEquip ? (
                              <button
                                type="button"
                                className="ft-rules-btn"
                                style={{ flexShrink: 0, padding: "6px 10px" }}
                                onClick={() => onEquip && onEquip(t.id)}
                                title={isEq ? "装備を外す" : (equippedList.length >= MAX_EQUIPPED_TITLES ? "装備枠が満杯のため、最も古い装備と入れ替え" : "装備する（最大3つ）")}
                              >
                                {isEq ? "外す" : (equippedList.length >= MAX_EQUIPPED_TITLES ? "入替" : "装備")}
                              </button>
                            ) : null}
                          </div>
                        );
                      })}
                    </div>
                  );
                })}
              </div>
            );
          })}
          <div style={{ fontSize: 11, color: "var(--ft-text-dim)", marginTop: 8 }}>
            AVANT-GARDE累計: {avantTotal}回 ／
            逆転累計: {comebackTotal}回 ／
            COIN温存累計: {coinRichTotal} ／
            COIN0累計: {coinPoorTotal}
          </div>
        </div>
        <div className="ft-modal-btns">
          <button className="ft-modal-confirm" style={{ flex: 1 }} onClick={onClose}>閉じる</button>
        </div>
      </div>
    </div>
  );
}
